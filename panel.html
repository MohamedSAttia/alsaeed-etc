<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>لوحة الإدارة — السعيد</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--navy:#0E2444;--navy2:#173763;--orange:#F0741A;--orange2:#FBA43C;--orange3:#FFF1E3;
 --paper:#F6F8FB;--line:#E3E8F0;--line2:#CDD6E4;--txt:#1C2B42;--dim:#5B6B85;--dim2:#8D9BB2;
 --ok:#0E7C4A;--ok-s:#E6F6EE;--warn:#B45309;--warn-s:#FDF4E5;--bad:#C02434;--bad-s:#FDECEE;
 --fd:'Tajawal',sans-serif;--fb:'IBM Plex Sans Arabic',sans-serif;--fm:'IBM Plex Mono',monospace;
 --sh:0 2px 14px -6px rgba(14,36,68,.14);--sh2:0 16px 44px -14px rgba(14,36,68,.24)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--fb);background:var(--paper);color:var(--txt);direction:rtl;line-height:1.7;
 -webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}
.en,.num{direction:ltr;unicode-bidi:isolate;display:inline-block}
.num{font-family:var(--fm);font-variant-numeric:tabular-nums}
:focus-visible{outline:2.5px solid var(--orange);outline-offset:2px}

/* ── الدخول ── */
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
 background:linear-gradient(150deg,var(--navy),var(--navy2));position:relative;overflow:hidden}
.login::before{content:'';position:absolute;inset-inline-end:-140px;top:-140px;width:460px;height:460px;
 border-radius:50%;background:radial-gradient(circle,rgba(240,116,26,.28),transparent 70%)}
.login-box{background:#fff;border-radius:26px;padding:40px;max-width:420px;width:100%;
 box-shadow:0 30px 80px -24px rgba(0,0,0,.5);position:relative;z-index:2}
.login-lg{text-align:center;margin-bottom:26px}
.login-lg img{width:74px;margin:0 auto 12px}
.login-lg b{display:block;font-family:var(--fd);font-weight:800;font-size:1.3rem;color:var(--navy)}
.login-lg span{font-size:.78rem;color:var(--dim)}
.login-box h1{font-family:var(--fd);font-weight:800;font-size:1.15rem;color:var(--navy);
 text-align:center;margin-bottom:6px}
.login-box p{font-size:.83rem;color:var(--dim);text-align:center;margin-bottom:22px}
.lock{display:flex;align-items:center;justify-content:center;gap:7px;background:var(--ok-s);
 color:var(--ok);border-radius:9px;padding:8px;font-size:.76rem;margin-bottom:20px;font-weight:600}

/* ── الهيكل ── */
.shell{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
@media(max-width:900px){.shell{grid-template-columns:1fr}}
.side{background:var(--navy);color:#C6D2E4;padding:20px 0;position:sticky;top:0;height:100vh;
 overflow-y:auto;display:flex;flex-direction:column}
@media(max-width:900px){.side{position:static;height:auto}}
.side-lg{display:flex;align-items:center;gap:10px;padding:0 20px 20px;
 border-bottom:1px solid rgba(255,255,255,.1);margin-bottom:14px}
.side-lg img{width:40px}
.side-lg b{display:block;font-family:var(--fd);font-weight:800;color:#fff;font-size:1.02rem}
.side-lg span{font-size:.64rem;color:#8FA3C0}
.side nav{flex:1;padding:0 12px}
.side nav button{display:flex;align-items:center;gap:11px;width:100%;padding:11px 14px;
 border-radius:11px;font-size:.88rem;color:#C6D2E4;text-align:start;transition:.16s;margin-bottom:3px}
.side nav button:hover{background:rgba(255,255,255,.09);color:#fff}
.side nav button.on{background:var(--orange);color:#fff;font-weight:600}
.side nav .ic{font-size:1.05rem;width:22px;text-align:center}
.side nav .n{margin-inline-start:auto;font-family:var(--fm);font-size:.74rem;opacity:.7}
.side-ft{padding:16px 20px 0;border-top:1px solid rgba(255,255,255,.1);font-size:.78rem}
.side-ft b{display:block;color:#fff;font-size:.85rem}
.side-ft a{color:#8FA3C0;display:block;padding:5px 0;transition:.14s}
.side-ft a:hover{color:var(--orange2)}

.main{padding:26px 30px 60px;min-width:0}
@media(max-width:600px){.main{padding:18px 16px 40px}}
.top{display:flex;align-items:center;gap:14px;margin-bottom:24px;flex-wrap:wrap}
.top h1{font-family:var(--fd);font-weight:800;font-size:1.6rem;color:var(--navy);flex:1}
.top p{font-size:.86rem;color:var(--dim);width:100%}

/* ── عناصر ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:11px 20px;
 border-radius:11px;font-size:.87rem;font-weight:700;transition:.2s;border:1.5px solid transparent}
.btn.p{background:var(--orange);color:#fff;box-shadow:0 6px 18px -6px rgba(240,116,26,.55)}
.btn.p:hover{background:#DC6512;transform:translateY(-1px)}
.btn.n{background:var(--navy);color:#fff}
.btn.n:hover{background:var(--navy2)}
.btn.o{background:#fff;border-color:var(--line2);color:var(--txt)}
.btn.o:hover{border-color:var(--orange);color:var(--orange);background:var(--orange3)}
.btn.d{background:var(--bad-s);color:var(--bad);border-color:#F5C2C8}
.btn.d:hover{background:var(--bad);color:#fff}
.btn.sm{padding:7px 13px;font-size:.8rem;border-radius:9px}
.btn.full{width:100%}
.btn[disabled]{opacity:.5;cursor:not-allowed;transform:none}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:var(--sh)}
.card.pad{padding:24px}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.stat{background:#fff;border:1px solid var(--line);border-radius:15px;padding:18px 20px;
 transition:.2s}
.stat:hover{transform:translateY(-2px);box-shadow:var(--sh)}
.stat b{display:block;font-family:var(--fm);font-size:1.8rem;font-weight:600;color:var(--navy);line-height:1.2}
.stat span{font-size:.78rem;color:var(--dim)}
.stat .up{font-size:.74rem;color:var(--ok);font-weight:600}
.stat.hl{background:linear-gradient(140deg,var(--orange),#DC6512);border:0;color:#fff}
.stat.hl b,.stat.hl span{color:#fff}
label.f{display:block;margin-bottom:14px}
label.f span{display:block;font-size:.84rem;font-weight:600;margin-bottom:6px}
label.f small{font-weight:400;color:var(--dim);font-size:.77rem}
input[type=text],input[type=email],input[type=password],input[type=number],select,textarea,input:not([type]){
 width:100%;padding:12px 15px;border:1.5px solid var(--line2);border-radius:11px;background:#fff;
 font-size:.9rem;transition:.16s}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--orange);
 box-shadow:0 0 0 4px rgba(240,116,26,.13)}
textarea{resize:vertical;line-height:1.8}
.f-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:560px){.f-row{grid-template-columns:1fr}}
.tbl-w{overflow-x:auto;border:1px solid var(--line);border-radius:15px;background:#fff}
table{width:100%;border-collapse:collapse;font-size:.85rem}
th{background:var(--navy);color:#fff;padding:12px 14px;text-align:start;font-weight:600;
 white-space:nowrap;font-size:.81rem}
td{padding:11px 14px;border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--orange3)}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:8px;padding:3px 10px;
 font-size:.74rem;font-weight:600}
.chip.ok{background:var(--ok-s);color:var(--ok)}
.chip.no{background:var(--bad-s);color:var(--bad)}
.chip.info{background:var(--orange3);color:var(--orange)}
.chip.wait{background:var(--warn-s);color:var(--warn)}
.note{border-radius:13px;padding:15px 19px;font-size:.86rem;line-height:1.85;border:1px solid;
 margin-bottom:16px}
.note.info{background:var(--orange3);border-color:#F7D9BB;color:#8A4108}
.note.ok{background:var(--ok-s);border-color:#B5E3CB;color:#0B5A36}
.note.warn{background:var(--warn-s);border-color:#F3DDB4;color:#7A4A08}
.note.bad{background:var(--bad-s);border-color:#F5C2C8;color:#8A1220}
.ov{position:fixed;inset:0;background:rgba(14,36,68,.72);backdrop-filter:blur(5px);display:flex;
 align-items:center;justify-content:center;z-index:900;padding:22px;overflow-y:auto}
.mdl{background:#fff;border-radius:24px;padding:30px;max-width:600px;width:100%;max-height:90vh;
 overflow-y:auto;box-shadow:var(--sh2)}
.mdl h3{font-family:var(--fd);font-weight:800;font-size:1.28rem;color:var(--navy);margin-bottom:7px}
.mdl>p{font-size:.87rem;color:var(--dim);margin-bottom:18px;line-height:1.85}
.mdl-act{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}
.toast{position:fixed;bottom:24px;inset-inline-start:24px;background:var(--navy);color:#fff;
 padding:14px 22px;border-radius:13px;font-size:.88rem;z-index:999;box-shadow:var(--sh2);max-width:400px}
.empty{text-align:center;padding:50px 20px;color:var(--dim)}
.empty .ic{font-size:2.6rem;margin-bottom:12px;opacity:.5}
.empty b{display:block;font-family:var(--fd);font-size:1.1rem;color:var(--navy);margin-bottom:6px}
.muted{color:var(--dim);font-size:.85rem;line-height:1.85}
.mt{margin-top:16px}.mb{margin-bottom:16px}
.bar{height:8px;background:var(--line);border-radius:5px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--orange),var(--orange2))}
.pwbox{background:var(--navy);color:#fff;border-radius:13px;padding:16px;text-align:center;
 font-family:var(--fm);font-size:1.2rem;letter-spacing:1px;margin:12px 0}
.ch-blk{border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:14px;background:#fff}
.ch-h{padding:13px 18px;background:var(--paper);display:flex;align-items:center;gap:11px;
 border-bottom:1px solid var(--line)}
.ch-h b{flex:1;font-family:var(--fd);font-weight:700;font-size:.93rem;color:var(--navy);
 outline:0;padding:2px 5px;border-radius:5px}
.ch-h b:focus{background:var(--orange3)}
.ch-n{width:27px;height:27px;border-radius:9px;background:var(--orange3);color:var(--orange);
 display:flex;align-items:center;justify-content:center;font-family:var(--fm);font-size:.78rem;flex-shrink:0}
.mini{padding:6px 10px;font-size:.82rem;border:1px solid var(--line);border-radius:8px}
</style>
</head>
<body>
<div id="root"></div>
<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>(s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;')
  .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const money=n=>Number(n||0).toLocaleString('en-US');
const BASE=location.pathname.replace(/\/$/,'');
let TOK=null, ADMIN=null, TAB='dash', DATA={}, PKGS=[], LESSONS={}, CURPK='';

try{TOK=localStorage.getItem('as_panel_tok')}catch(e){}

async function api(p,o){
  o=o||{};
  const h={'Content-Type':'application/json'};
  if(TOK)h.Authorization='Bearer '+TOK;
  const r=await fetch(BASE+'/api'+p,{method:o.method||'GET',headers:h,
    body:o.body?JSON.stringify(o.body):undefined});
  const d=await r.json().catch(()=>({}));
  if(r.status===401){TOK=null;try{localStorage.removeItem('as_panel_tok')}catch(e){};renderLogin();throw new Error(d.error||'انتهت الجلسة')}
  if(!r.ok)throw new Error(d.error||'خطأ');
  return d;
}
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;
  document.body.appendChild(t);setTimeout(()=>t.remove(),3200)}
function modal(h,after){closeM();const o=document.createElement('div');o.className='ov';o.id='ov';
  o.innerHTML='<div class="mdl">'+h+'</div>';document.body.appendChild(o);
  o.addEventListener('click',e=>{if(e.target===o)closeM()});
  o.querySelectorAll('[data-close]').forEach(b=>b.onclick=closeM);if(after)after()}
function closeM(){const o=$('#ov');if(o)o.remove()}

/* ═══ الدخول ═══ */
function renderLogin(err){
  $('#root').innerHTML=`<div class="login"><div class="login-box">
    <div class="login-lg"><img src="/img/logo.png" alt="السعيد">
      <b>لوحة الإدارة</b><span>السعيد للتعليم والتدريب والاستشارات</span></div>
    <div class="lock">🔒 اتصال مؤمّن · صلاحية مقيّدة</div>
    ${err?`<div class="note bad">${esc(err)}</div>`:''}
    <label class="f"><span>البريد الإلكتروني</span>
      <input class="en" id="lgMail" type="email" autocomplete="username" autofocus></label>
    <label class="f"><span>كلمة المرور</span>
      <input id="lgPass" type="password" autocomplete="current-password"></label>
    <button class="btn p full" id="lgGo">دخول</button>
    <p style="margin-top:16px;font-size:.76rem">هذه الصفحة للمشرفين فقط. كل محاولة دخول تُسجَّل.</p>
  </div></div>`;
  const go=async()=>{
    const b=$('#lgGo');b.disabled=true;b.textContent='جارٍ التحقّق…';
    try{
      const d=await api('/login',{method:'POST',body:{email:$('#lgMail').value.trim(),
        password:$('#lgPass').value}});
      TOK=d.token;ADMIN=d.admin;
      try{localStorage.setItem('as_panel_tok',TOK)}catch(e){}
      await boot();
    }catch(e){renderLogin(e.message);}
  };
  $('#lgGo').onclick=go;
  $('#lgPass').addEventListener('keydown',e=>{if(e.key==='Enter')go()});
  $('#lgMail').addEventListener('keydown',e=>{if(e.key==='Enter')$('#lgPass').focus()});
}

/* ═══ الهيكل ═══ */
function shell(body){
  const nav=[['dash','📊','لوحة القيادة',''],['students','👥','المتدربون',DATA.students||''],
    ['add','➕','إضافة متدربين',''],['videos','🎬','الفيديوهات والدروس',''],
    ['orders','🧾','الطلبات',DATA.orders||''],['settings','⚙️','الإعدادات','']];
  return `<div class="shell">
    <aside class="side">
      <div class="side-lg"><img src="/img/logo.png" alt="">
        <div><b>لوحة الإدارة</b><span>السعيد</span></div></div>
      <nav>${nav.map(([k,i,l,n])=>`<button class="${TAB===k?'on':''}" data-t="${k}">
        <span class="ic">${i}</span><span>${l}</span>${n?`<span class="n">${n}</span>`:''}</button>`).join('')}</nav>
      <div class="side-ft">
        <b>${esc(ADMIN?ADMIN.name:'')}</b>
        <span class="en" style="font-size:.72rem;color:#8FA3C0">${esc(ADMIN?ADMIN.email:'')}</span>
        <a href="/" target="_blank">↗ فتح الموقع</a>
        <a href="#" id="logout">← خروج</a>
      </div>
    </aside>
    <main class="main">${body}</main></div>`;
}

/* ═══ لوحة القيادة ═══ */
function vDash(){
  const d=DATA;
  return `<div class="top"><h1>لوحة القيادة</h1>
    <p>نظرة سريعة على المنصة — المتدربون والاشتراكات والمحتوى.</p></div>
  <div class="grid g4 mb">
    <div class="stat hl"><b class="num">${d.students||0}</b><span>متدرّب مسجّل</span>
      ${d.newWeek?`<span class="up" style="color:#fff">+${d.newWeek} هذا الأسبوع</span>`:''}</div>
    <div class="stat"><b class="num">${d.active||0}</b><span>لديه اشتراك نشط</span></div>
    <div class="stat"><b class="num">${money(d.revenue)}</b><span>إجمالي المبيعات</span>
      ${d.revenue30?`<span class="up">+${money(d.revenue30)} آخر 30 يوماً</span>`:''}</div>
    <div class="stat"><b class="num">${d.certificates||0}</b><span>شهادة صادرة</span></div>
  </div>
  <div class="grid g4 mb">
    <div class="stat"><b class="num">${d.lessons||0}</b><span>درساً في المنصة</span></div>
    <div class="stat"><b class="num">${d.withVideo||0}</b><span>مرتبط بفيديو</span></div>
    <div class="stat"><b class="num">${(d.lessons||0)-(d.withVideo||0)}</b><span>بانتظار الرفع</span></div>
    <div class="stat"><b class="num">${d.paid||0}/${d.orders||0}</b><span>طلب مدفوع</span></div>
  </div>
  <div class="grid g2">
    <div class="card pad">
      <h3 style="font-family:var(--fd);font-weight:700;font-size:1.05rem;color:var(--navy);margin-bottom:14px">
        الأكثر اشتراكاً</h3>
      ${(d.topPackages||[]).length?(d.topPackages||[]).map(p=>{
        const pk=PKGS.find(x=>x.id===p.package_id);
        const mx=Math.max(...d.topPackages.map(x=>x.n));
        return `<div style="margin-bottom:12px">
          <div style="display:flex;justify-content:space-between;font-size:.85rem;margin-bottom:5px">
            <span>${esc(pk?pk.ar:p.package_id)}</span><b class="num">${p.n}</b></div>
          <div class="bar"><i style="width:${p.n/mx*100}%"></i></div></div>`;
      }).join(''):'<p class="muted">لا اشتراكات بعد.</p>'}
    </div>
    <div class="card pad">
      <h3 style="font-family:var(--fd);font-weight:700;font-size:1.05rem;color:var(--navy);margin-bottom:14px">
        آخر المسجّلين</h3>
      ${(d.recent||[]).length?(d.recent||[]).map(u=>`<div style="display:flex;gap:11px;align-items:center;
        padding:9px 0;border-bottom:1px solid var(--line)">
        <div style="width:34px;height:34px;border-radius:11px;background:var(--orange3);color:var(--orange);
          display:flex;align-items:center;justify-content:center;font-weight:700">${esc(u.name[0]||'?')}</div>
        <div style="flex:1;min-width:0"><b style="font-size:.87rem">${esc(u.name)}</b>
          <div class="en" style="font-size:.75rem;color:var(--dim)">${esc(u.email)}</div></div>
        <span class="num" style="font-size:.74rem;color:var(--dim2)">${new Date(u.created).toLocaleDateString('ar-EG')}</span>
      </div>`).join(''):'<p class="muted">لا متدربين بعد.</p>'}
    </div>
  </div>`;
}

/* ═══ المتدربون ═══ */
let STU=[], SQ='';
function vStudents(){
  return `<div class="top"><h1>المتدربون</h1>
    <p>${STU.length} متدرّب — أضف واحذف وامنح الباقات.</p></div>
  <div style="display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap">
    <input id="sq" placeholder="🔍 ابحث بالاسم أو البريد…" value="${esc(SQ)}" style="max-width:280px">
    <button class="btn p" data-t="add">➕ إضافة متدربين</button>
    <button class="btn o" id="expCsv">⬇ تصدير CSV</button>
  </div>
  ${STU.length?`<div class="tbl-w"><table>
    <thead><tr><th>المتدرّب</th><th>الباقات</th><th>الشهادات</th><th>آخر دخول</th><th>الحالة</th><th></th></tr></thead>
    <tbody>${STU.map(u=>`<tr>
      <td><b>${esc(u.name)}</b>
        <div class="en" style="font-size:.76rem;color:var(--dim)">${esc(u.email)}</div>
        ${u.phone?`<div class="num" style="font-size:.73rem;color:var(--dim2)">${esc(u.phone)}</div>`:''}</td>
      <td>${(u.enrollments||[]).length?(u.enrollments||[]).map(e=>{
        const p=PKGS.find(x=>x.id===e.package_id);
        return `<span class="chip ok" style="margin:2px">${esc(p?p.ar:e.package_id)}</span>`}).join('')
        :'<span class="muted">—</span>'}</td>
      <td class="num">${u.certs||0}</td>
      <td class="num" style="font-size:.76rem">${u.last_login?new Date(u.last_login).toLocaleDateString('ar-EG'):'—'}</td>
      <td><span class="chip ${u.active===0?'no':'ok'}">${u.active===0?'معطّل':'نشط'}</span></td>
      <td style="white-space:nowrap">
        <button class="btn o sm" data-grant="${u.id}">🎁 باقة</button>
        <button class="btn o sm" data-edit="${u.id}">✏️</button>
        <button class="btn o sm" data-reset="${u.id}">🔑</button>
        <button class="btn d sm" data-del="${u.id}">🗑</button></td>
    </tr>`).join('')}</tbody></table></div>`
  :`<div class="empty"><div class="ic">👥</div><b>لا متدربين بعد</b>
     <p class="muted">ابدأ بإضافة أول متدرّب أو استورد دفعة كاملة.</p>

function render(){

function bind(){
  $$('[data-t]').forEach(b=>b.onclick=()=>go(b.dataset.t));
  const lo=$('#logout');if(lo)lo.onclick=e=>{e.preventDefault();TOK=null;
    try{localStorage.removeItem('as_panel_tok')}catch(x){};renderLogin()};

  if(TAB==='videos')bindVideos();
  if(TAB==='settings')bindSettings();

async function go(t){
  TAB=t;
  if(t==='dash')DATA=await api('/dash').catch(()=>({}));
  if(t==='students')STU=await api('/students?q='+encodeURIComponent(SQ)).catch(()=>[]);

async function loadLessons(pid){
  if(!pid)return;
  try{LESSONS[pid]=await api('/lessons/'+pid)}catch(e){LESSONS[pid]=[]}
  CURPK=pid;
}
function curLs(){return LESSONS[CURPK]=LESSONS[CURPK]||[]}
function curChs(){const p=PKGS.find(x=>x.id===CURPK);if(!p)return[];
  p._chapters=p._chapters||[];return p._chapters}
function harvest(){
  const ls=curLs();
  $$('[data-lt]').forEach(x=>{if(ls[+x.dataset.lt])ls[+x.dataset.lt].title=x.value});
  $$('[data-ld]').forEach(x=>{if(ls[+x.dataset.ld])ls[+x.dataset.ld].duration=x.value});
  $$('[data-lv]').forEach(x=>{if(ls[+x.dataset.lv])ls[+x.dataset.lv].vimeo=
    x.value.trim().replace(/^https?:\/\/(www\.)?vimeo\.com\//,'').replace(/[^0-9]/g,'')});
  $$('[data-lf]').forEach(x=>{if(ls[+x.dataset.lf])ls[+x.dataset.lf].free=x.checked?1:0});
  const chs=curChs();
  $$('[data-ch]').forEach(x=>{const n=+x.dataset.ch;if(chs[n]!==undefined)chs[n]=x.textContent.trim()});
}

  $$('[data-lf]').forEach(x=>x.onchange=()=>{harvest();render()});
  $$('[data-ch]').forEach(x=>x.onblur=harvest);
  const add=(ch)=>{
    harvest();
    modal(`<h3>إضافة درس</h3>
      <label class="f"><span>عنوان الدرس</span><input id="nT" autofocus></label>
      <div class="f-row">
        <label class="f"><span>الفصل</span><select id="nC">
          ${curChs().map((c,k)=>`<option value="${k}" ${k===ch?'selected':''}>${k+1}. ${esc(c)}</option>`).join('')}</select></label>
        <label class="f"><span>المدة</span><input class="num" id="nD" placeholder="12:30"></label></div>
      <label class="f"><span>رقم Vimeo أو الرابط</span><input class="en" id="nV" placeholder="912345678"></label>
      <label style="display:flex;gap:9px;align-items:center;margin-bottom:16px">
        <input type="checkbox" id="nF"><span>درس مجاني</span></label>
      <div class="mdl-act"><button class="btn p" id="nGo">أضف</button>
        <button class="btn o" id="nGo2">أضف واستمر</button>
        <button class="btn o" data-close>إلغاء</button></div>`,()=>{
      const doIt=keep=>{
        const t=$('#nT').value.trim();if(!t){toast('اكتب العنوان');return}
        curLs().push({chapter:+$('#nC').value,title:t,duration:$('#nD').value.trim()||'00:00',
          vimeo:$('#nV').value.trim().replace(/^https?:\/\/(www\.)?vimeo\.com\//,'').replace(/[^0-9]/g,''),
          free:$('#nF').checked?1:0});
        if(keep){['nT','nD','nV'].forEach(k=>$('#'+k).value='');$('#nT').focus();toast('✅ أُضيف')}
        else{closeM();render();toast('✅ أُضيف الدرس')}
      };
      $('#nGo').onclick=()=>doIt(false);$('#nGo2').onclick=()=>doIt(true);
      $('#nT').addEventListener('keydown',e=>{if(e.key==='Enter')doIt(true)});
    });
  };
  const va=$('#vAdd');if(va)va.onclick=()=>add(0);
  $$('[data-addto]').forEach(b=>b.onclick=()=>add(+b.dataset.addto));
  const chapAdd=()=>{
    harvest();
    modal(`<h3>إضافة فصل</h3>
      <label class="f"><span>اسم الفصل</span><input id="cN" autofocus></label>
      <div class="mdl-act"><button class="btn p" id="cGo">أضف</button>
        <button class="btn o" data-close>إلغاء</button></div>`,()=>{
      const g=()=>{const v=$('#cN').value.trim();if(!v){toast('اكتب الاسم');return}
        curChs().push(v);closeM();render();toast('✅ أُضيف الفصل')};
      $('#cGo').onclick=g;$('#cN').addEventListener('keydown',e=>{if(e.key==='Enter')g()});
    });
  };
  [$('#vChap'),$('#vChap2')].forEach(b=>{if(b)b.onclick=chapAdd});
  $$('[data-delch]').forEach(b=>b.onclick=()=>{
    const n=+b.dataset.delch;
    if(!confirm('حذف الفصل ودروسه؟'))return;
    harvest();
    LESSONS[CURPK]=curLs().filter(l=>(l.chapter||0)!==n)
      .map(l=>({...l,chapter:(l.chapter||0)>n?l.chapter-1:l.chapter}));
    curChs().splice(n,1);render();toast('حُذف')});
  $$('[data-ldel]').forEach(b=>b.onclick=()=>{
    if(!confirm('حذف الدرس؟'))return;harvest();curLs().splice(+b.dataset.ldel,1);render()});
  const mv=(i,d)=>{harvest();const ls=curLs(),ch=ls[i].chapter||0;
    const sib=ls.map((l,k)=>({l,k})).filter(x=>(x.l.chapter||0)===ch);
    const p=sib.findIndex(x=>x.k===i),t=p+d;
    if(t<0||t>=sib.length)return;
    const a=sib[p].k,b2=sib[t].k;[ls[a],ls[b2]]=[ls[b2],ls[a]];render()};
  $$('[data-up]').forEach(b=>b.onclick=()=>mv(+b.dataset.up,-1));
  $$('[data-dn]').forEach(b=>b.onclick=()=>mv(+b.dataset.dn,1));
  $$('[data-pv]').forEach(b=>b.onclick=()=>modal(
    `<h3>معاينة</h3><p class="en">vimeo.com/${esc(b.dataset.pv)}</p>
     <div style="aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:#000">
       <iframe src="https://player.vimeo.com/video/${esc(b.dataset.pv)}" style="width:100%;height:100%;border:0"
         allow="fullscreen" allowfullscreen></iframe></div>
     <div class="mdl-act"><button class="btn o" data-close>إغلاق</button></div>`));
  const bk=$('#vBulk');
  if(bk)bk.onclick=()=>{
    harvest();
    modal(`<h3>📋 لصق دفعة دروس</h3>
      <p>سطر لكل درس: <span class="en">العنوان, المدة, رقم Vimeo</span></p>
      <label class="f"><span>الفصل</span><select id="bC">
        ${curChs().map((c,k)=>`<option value="${k}">${k+1}. ${esc(c)}</option>`).join('')}</select></label>
      <label class="f"><span>الدروس</span><textarea id="bT" rows="9"
        placeholder="مقدمة, 12:30, 912345678"></textarea></label>
      <div class="mdl-act"><button class="btn p" id="bGo">أضف</button>
        <button class="btn o" data-close>إلغاء</button></div>`,()=>{
      $('#bGo').onclick=()=>{
        const ch=+$('#bC').value;let n=0;
        $('#bT').value.split('\n').map(x=>x.trim()).filter(Boolean).forEach(l=>{
          const p=l.split(',').map(x=>x.trim());if(!p[0])return;
          curLs().push({chapter:ch,title:p[0],duration:p[1]||'00:00',
            vimeo:(p[2]||'').replace(/^https?:\/\/(www\.)?vimeo\.com\//,'').replace(/[^0-9]/g,''),free:0});n++});
        closeM();render();toast(`✅ أُضيف ${n} درساً`)};
    });
  };
  const sv=$('#vSave');
  if(sv)sv.onclick=async()=>{
    harvest();sv.disabled=true;sv.textContent='جارٍ الحفظ…';
    try{const d=await api('/lessons/'+CURPK,{method:'PUT',body:curLs()});
      toast(`✅ حُفظ ${d.count} درساً`)}catch(e){toast(e.message)}
    sv.disabled=false;sv.textContent='💾 حفظ';
  };
}
function bindSettings(){
  const g=$('#pwGo');
  if(g)g.onclick=async()=>{
    const n=$('#pwN').value,r=$('#pwR').value;
    if(n!==r){toast('كلمتا المرور غير متطابقتين');return}
    if(n.length<10){toast('كلمة المرور عشرة أحرف على الأقل');return}
    try{await api('/password',{method:'POST',body:{current:$('#pwC').value,next:n}});
      toast('✅ حُدّثت كلمة المرور');['pwC','pwN','pwR'].forEach(k=>$('#'+k).value='')}
    catch(e){toast(e.message)}
  };
}

/* ═══ الإقلاع ═══ */
async function boot(){
  try{
    const me=await api('/me');ADMIN=me.admin;
    const c=await fetch('/api/content').then(r=>r.json()).catch(()=>({}));
    PKGS=(c.packages&&c.packages.length)?c.packages:[];
    if(!PKGS.length){
      const h=await fetch('/').then(r=>r.text()).catch(()=>'');
      const m=h.match(/window\.PACKAGES\s*=\s*(\[[\s\S]*?\]);/);
      if(m){try{PKGS=eval(m[1])}catch(e){}}
    }
    /* الفصول من الدورات */
    const cs=(c.courses&&c.courses.length)?c.courses:[];
    PKGS.forEach(p=>{const co=cs.find(x=>x.id===p.course);if(co)p._chapters=(co.chapters||[]).slice()});
    DATA=await api('/dash');
    TAB='dash';render();
  }catch(e){renderLogin(e.message&&e.message!=='يلزم تسجيل الدخول'?e.message:null)}
}
if(TOK)boot();else renderLogin();
</script>
</body>
</html>
