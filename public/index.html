<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>السعيد للتعليم والتدريب والخدمات الاستشارية</title>
<meta name="description" content="منصة السعيد V15 للتعلّم التفاعلي: PMP وPMI-RMP وPMI-ACP وGRCP بالعربية والإنجليزية، وP3O وPMI-PBA وLean Six Sigma بالإنجليزية.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/unified-exam.css?v=20260905-1">
<link rel="stylesheet" href="/learning-v20.css?v=20.0">
<link rel="stylesheet" href="/ui-v21.css?v=21.1">
<link rel="stylesheet" href="/platform-v22.css?v=22.0">
<style>/* ============================================================
   منصة السعيد — التصميم
   كحلي عميق · برتقالي السعيد · حركة هادئة
   ============================================================ */

:root{
  --navy:#0E2444; --navy2:#173763; --navy3:#1B3B6F;
  --orange:#F0741A; --orange2:#FBA43C; --orange3:#FFF1E3;
  --teal:#0E7C7B; --gold:#C9A227;
  --paper:#F8F9FC; --white:#fff; --cream:#FDFAF6;
  --line:#E3E8F0; --line2:#CDD6E4;
  --txt:#1C2B42; --dim:#5B6B85; --dim2:#8D9BB2;
  --ok:#0E7C4A; --ok-s:#E6F6EE;
  --warn:#B45309; --warn-s:#FDF4E5;
  --bad:#C02434; --bad-s:#FDECEE;
  --fd:'Tajawal',system-ui,sans-serif;
  --fb:'IBM Plex Sans Arabic',system-ui,sans-serif;
  --fm:'IBM Plex Mono','SF Mono',monospace;
  --r:14px; --r2:20px; --r3:28px;
  --sh:0 2px 14px -6px rgba(14,36,68,.12);
  --sh2:0 16px 44px -14px rgba(14,36,68,.22);
  --sh3:0 30px 80px -24px rgba(14,36,68,.38);
  --ease:cubic-bezier(.16,1,.3,1);
  --hdr:82px;
}

*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:var(--fb);background:var(--paper);color:var(--txt);
  direction:rtl;line-height:1.75;-webkit-font-smoothing:antialiased;overflow-x:hidden}
html[dir="ltr"] body{direction:ltr}html[dir="rtl"] body{direction:rtl}
img{max-width:100%;display:block}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}
/* عزل الاتجاه — يُصلح ظهور ® و ™ في الجهة الخاطئة */
.en,.code,.num{direction:ltr;unicode-bidi:isolate;display:inline-block}
.num{font-family:var(--fm);font-variant-numeric:tabular-nums}
.code{font-family:var(--fm);font-weight:600;letter-spacing:.3px}
:focus-visible{outline:2.5px solid var(--orange);outline-offset:3px;border-radius:4px}

/* ─── الحركة ─── */
@keyframes fadeUp{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
@keyframes glowPulse{0%,100%{opacity:.5}50%{opacity:.9}}
.reveal{opacity:0;transform:translateY(24px)}
.reveal.in{animation:fadeUp .7s var(--ease) forwards}
.d1{animation-delay:.08s}.d2{animation-delay:.16s}.d3{animation-delay:.24s}.d4{animation-delay:.32s}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}
  .reveal{opacity:1;transform:none}}

/* ═══════════ الترويسة ═══════════ */
.hdr{position:fixed;inset-inline:0;top:0;z-index:200;height:var(--hdr);
  background:rgba(14,36,68,.97);backdrop-filter:blur(16px) saturate(1.4);
  border-bottom:1px solid rgba(255,255,255,.09);transition:.3s var(--ease)}
.hdr.scrolled{height:68px;box-shadow:0 8px 30px -12px rgba(0,0,0,.5)}
.hdr-in{max-width:1320px;margin:0 auto;padding:0 26px;height:100%;
  display:flex;align-items:center;gap:16px}
body{padding-top:var(--hdr)}

.lg{display:flex;align-items:center;gap:11px;flex-shrink:0}
.lg-svg{flex-shrink:0;transition:.35s var(--ease)}
.lg:hover .lg-svg{transform:rotate(-6deg) scale(1.06)}
.lg-t b{display:block;font-family:var(--fd);font-weight:800;font-size:1.18rem;
  color:#fff;line-height:1.15;letter-spacing:-.3px}
.lg-t span{font-size:.63rem;color:#9DB0CC;letter-spacing:.2px;display:block}
.lg-t.d b{color:var(--navy)}.lg-t.d span{color:var(--dim)}

/* ─── التنقّل ─── */
.nav{display:flex;align-items:center;gap:2px;margin-inline-start:auto}
.nav a,.nav .nb{position:relative;padding:9px 13px;border-radius:10px;font-size:.85rem;
  font-weight:500;color:#C6D2E4;transition:.18s;white-space:nowrap;
  display:flex;align-items:center;gap:6px}
.nav a::after,.nav .nb::after{content:'';position:absolute;bottom:2px;inset-inline:13px;height:2px;
  background:var(--orange2);border-radius:2px;transform:scaleX(0);transition:.24s var(--ease)}
.nav a:hover,.nav .nb:hover{color:#fff}
.nav a:hover::after,.nav .nb:hover::after{transform:scaleX(1)}
.nav a.on,.nav .nb.on{color:#fff;background:rgba(255,255,255,.09)}
.nav a.on::after,.nav .nb.on::after{transform:scaleX(1)}
.nav .nb i{font-style:normal;font-size:.62rem;transition:.24s}
.nav .nb.open i{transform:rotate(180deg)}

.hdr-act{display:flex;gap:8px;align-items:center;flex-shrink:0}
.burger{display:none;font-size:1.35rem;color:#fff;padding:6px 9px;border-radius:9px}
.burger:hover{background:rgba(255,255,255,.1)}
@media(max-width:1180px){
  .nav{position:fixed;inset:var(--hdr) 0 auto;background:var(--navy);flex-direction:column;
    align-items:stretch;padding:14px 22px 24px;gap:2px;display:none;max-height:calc(100vh - var(--hdr));
    overflow-y:auto;border-bottom:1px solid rgba(255,255,255,.1)}
  .nav.open{display:flex;animation:fadeIn .2s}
  .burger{display:block;margin-inline-start:auto}
  .hdr-act{margin-inline-start:0}
}

/* ─── مبدّل اللغة ─── */
.lang{position:relative}
.lang-b{display:flex;align-items:center;gap:6px;padding:8px 13px;border-radius:10px;
  border:1px solid rgba(255,255,255,.2);color:#C6D2E4;font-size:.82rem;font-weight:600;transition:.18s}
.lang-b:hover{background:rgba(255,255,255,.1);color:#fff;border-color:rgba(255,255,255,.35)}
.lang-m{position:absolute;top:calc(100% + 8px);inset-inline-end:0;background:#fff;
  border-radius:14px;box-shadow:var(--sh3);padding:6px;min-width:180px;z-index:210;
  animation:fadeUp .2s var(--ease)}
.lang-m button{display:flex;align-items:center;gap:9px;width:100%;padding:9px 12px;
  border-radius:9px;font-size:.86rem;text-align:start;color:var(--txt);transition:.14s}
.lang-m button:hover{background:var(--orange3)}
.lang-m button.on{background:var(--navy);color:#fff}
.lang-m .fl{font-size:1.05rem}
.lang-m .nm{flex:1}
.lang-m .nt{font-size:.68rem;color:var(--dim2)}
.lang-m button.on .nt{color:#9DB0CC}

/* ═══════════ الأزرار ═══════════ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:12px 24px;border-radius:12px;font-size:.9rem;font-weight:700;
  transition:.22s var(--ease);white-space:nowrap;border:1.5px solid transparent;position:relative;
  overflow:hidden}
.btn.p{background:var(--orange);color:#fff;box-shadow:0 8px 22px -8px rgba(240,116,26,.6)}
.btn.p:hover{background:#DC6512;transform:translateY(-2px);box-shadow:0 14px 32px -10px rgba(240,116,26,.7)}
.btn.n{background:var(--navy);color:#fff}
.btn.n:hover{background:var(--navy2);transform:translateY(-2px);box-shadow:var(--sh2)}
.btn.o{background:var(--white);border-color:var(--line2);color:var(--txt)}
.btn.o:hover{border-color:var(--orange);color:var(--orange);background:var(--orange3);transform:translateY(-1px)}
.btn.gh{color:#D5DEEC;border-color:rgba(255,255,255,.26)}
.btn.gh:hover{background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.45)}
.btn.sm{padding:8px 15px;font-size:.82rem;border-radius:10px}
.btn.lg{padding:15px 32px;font-size:1rem;border-radius:14px}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none!important;box-shadow:none}
.btn.full{width:100%}
.btn .ar{transition:.24s var(--ease)}
.btn:hover .ar{transform:translateX(-4px)}

/* ═══════════ التخطيط ═══════════ */
.wrap{max-width:1320px;margin:0 auto;padding:0 26px}
.sec{padding:88px 0}
.sec.tight{padding:56px 0}
.sec.alt{background:var(--white);border-block:1px solid var(--line)}
.sec-h{margin-bottom:40px;max-width:720px}
.sec-h.mid{margin-inline:auto;text-align:center}
.eyebrow{display:inline-flex;align-items:center;gap:9px;font-size:.71rem;font-weight:800;
  letter-spacing:2.4px;color:var(--orange);margin-bottom:13px;text-transform:uppercase}
.eyebrow::before{content:'';width:28px;height:2px;background:var(--orange);border-radius:2px}
.sec-h.mid .eyebrow::before{display:none}
.sec-h h2{font-family:var(--fd);font-weight:800;font-size:2.3rem;line-height:1.24;
  color:var(--navy);letter-spacing:-.7px}
.sec-h p{font-size:1.02rem;color:var(--dim);line-height:1.95;margin-top:13px}
@media(max-width:640px){.sec-h h2{font-size:1.7rem}.sec{padding:58px 0}}

/* ═══════════ البطل ═══════════ */
.hero{position:relative;overflow:hidden;background:var(--navy);color:#fff;
  padding:80px 0 96px;min-height:min(88vh,760px);display:flex;align-items:center}
.hero-bg{position:absolute;inset:0;z-index:0}
.hero-bg video,.hero-bg img{width:100%;height:100%;object-fit:cover;opacity:.22}
.hero-mesh{position:absolute;inset:0;z-index:1;
  background:
    radial-gradient(ellipse 60% 50% at 78% 18%,rgba(240,116,26,.34),transparent 62%),
    radial-gradient(ellipse 50% 60% at 12% 82%,rgba(27,59,111,.9),transparent 60%),
    linear-gradient(155deg,rgba(14,36,68,.96),rgba(14,36,68,.82) 50%,rgba(23,55,99,.94))}
.hero-orb{position:absolute;border-radius:50%;filter:blur(70px);z-index:1;
  animation:floaty 9s ease-in-out infinite}
.hero-orb.a{width:400px;height:400px;top:-100px;inset-inline-end:-60px;
  background:radial-gradient(circle,rgba(251,164,60,.4),transparent 70%)}
.hero-orb.b{width:340px;height:340px;bottom:-120px;inset-inline-start:-70px;
  background:radial-gradient(circle,rgba(14,124,123,.42),transparent 70%);animation-delay:-4s}
.hero-grid{position:absolute;inset:0;z-index:1;opacity:.14;
  background-image:linear-gradient(rgba(255,255,255,.6) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.6) 1px,transparent 1px);
  background-size:60px 60px;
  mask-image:radial-gradient(ellipse 70% 60% at 50% 40%,#000,transparent)}
.hero-in{position:relative;z-index:3;display:grid;grid-template-columns:1.08fr .92fr;
  gap:56px;align-items:center;width:100%}
@media(max-width:1020px){.hero-in{grid-template-columns:1fr;gap:40px}}
.hero h1{font-family:var(--fd);font-weight:800;font-size:3.2rem;line-height:1.16;
  letter-spacing:-1.4px;margin-bottom:20px}
.hero h1 em{font-style:normal;position:relative;color:var(--orange2);white-space:nowrap}
.hero h1 em::after{content:'';position:absolute;inset-inline:0;bottom:4px;height:10px;
  background:rgba(251,164,60,.24);border-radius:5px;z-index:-1}
.hero-p{font-size:1.06rem;color:#BFCCE0;line-height:2.05;max-width:560px;margin-bottom:28px}
.hero-cta{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:34px}
.hero-tr{display:flex;gap:30px;flex-wrap:wrap;padding-top:26px;
  border-top:1px solid rgba(255,255,255,.16)}
.htr b{display:block;font-family:var(--fm);font-size:1.7rem;font-weight:600;color:var(--orange2)}
.htr span{font-size:.77rem;color:#9DB0CC}
@media(max-width:640px){.hero h1{font-size:2.2rem}.hero-p{font-size:.96rem}}

/* شارات الاعتماد */
.accred{display:flex;gap:9px;flex-wrap:wrap;margin-top:20px}
.acc{display:flex;align-items:center;gap:7px;background:rgba(255,255,255,.09);
  border:1px solid rgba(255,255,255,.16);border-radius:10px;padding:6px 13px;
  font-size:.76rem;color:#D5DEEC;transition:.2s}
.acc:hover{background:rgba(255,255,255,.16);transform:translateY(-2px)}
.acc b{color:var(--orange2);font-family:var(--fm);font-size:.78rem}

/* ─── مقياس الجاهزية ─── */
.rm{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.17);
  border-radius:var(--r3);padding:26px;backdrop-filter:blur(14px);box-shadow:var(--sh3)}
.rm-h{display:flex;align-items:center;gap:10px;margin-bottom:6px;flex-wrap:wrap}
.rm-h b{font-family:var(--fd);font-weight:700;font-size:1.05rem}
.rm-h .tag{font-size:.66rem;background:var(--orange);color:#fff;border-radius:6px;
  padding:3px 10px;font-weight:700;animation:glowPulse 2.6s ease-in-out infinite}
.rm-sub{font-size:.79rem;color:#9DB0CC;margin-bottom:18px;line-height:1.72}
.rm-pick{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:20px}
.rm-pick button{padding:7px 14px;border-radius:9px;font-size:.79rem;font-weight:600;
  background:rgba(255,255,255,.09);color:#C6D2E4;border:1px solid rgba(255,255,255,.14);transition:.18s}
.rm-pick button:hover{background:rgba(255,255,255,.18);transform:translateY(-1px)}
.rm-pick button.on{background:var(--orange);color:#fff;border-color:var(--orange)}
.rm-bar{display:flex;height:76px;border-radius:14px;overflow:hidden;gap:2px;margin-bottom:8px}
.rmd{position:relative;display:flex;flex-direction:column;justify-content:flex-end;
  background:rgba(255,255,255,.1);overflow:hidden;transition:.5s}
.rmd i{display:block;transition:height 1s var(--ease)}
.rmd .lab{position:absolute;inset-inline:0;top:7px;text-align:center;
  font-size:.61rem;color:rgba(255,255,255,.92);line-height:1.25;padding:0 3px}
.rmd .lab b{display:block;font-family:var(--fm);font-size:.72rem}
.rm-legend{display:flex;justify-content:space-between;align-items:center;
  font-size:.72rem;color:#9DB0CC;flex-wrap:wrap;gap:8px}
.rm-legend .k{display:flex;align-items:center;gap:5px}
.rm-legend .k i{width:9px;height:9px;border-radius:3px;display:block}
.rm-foot{margin-top:16px;padding-top:14px;border-top:1px solid rgba(255,255,255,.14);
  font-size:.79rem;color:#BFCCE0;line-height:1.78}
.rm-foot b{color:var(--orange2)}

/* ═══════════ القائمة الكبرى ═══════════ */
.mega{position:fixed;inset-inline:0;top:var(--hdr);background:var(--white);
  border-bottom:3px solid var(--orange);box-shadow:0 26px 70px -22px rgba(14,36,68,.35);
  z-index:190;max-height:calc(100vh - var(--hdr));overflow-y:auto;
  animation:megaIn .22s var(--ease)}
@keyframes megaIn{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:none}}
.mega-in{max-width:1320px;margin:0 auto;padding:28px 26px 32px;
  display:grid;grid-template-columns:250px 1fr;gap:30px}
@media(max-width:980px){.mega-in{grid-template-columns:1fr;gap:18px}}
.mega-side{border-inline-end:1px solid var(--line);padding-inline-end:24px}
@media(max-width:980px){.mega-side{border:0;padding:0}}
.mega-side h4{font-family:var(--fd);font-weight:800;font-size:.72rem;letter-spacing:1.6px;
  color:var(--dim2);text-transform:uppercase;margin-bottom:12px}
.mtrack{display:flex;align-items:center;gap:11px;padding:11px 13px;border-radius:12px;
  width:100%;text-align:start;transition:.16s;font-size:.87rem;color:var(--txt)}
.mtrack:hover{background:var(--orange3);color:var(--orange);transform:translateX(-3px)}
.mtrack.on{background:var(--navy);color:#fff}
.mtrack .ic{font-size:1.1rem}
.mtrack b{flex:1;font-weight:600}
.mtrack em{font-style:normal;font-size:.72rem;color:var(--dim2);font-family:var(--fm)}
.mtrack.on em{color:#9DB0CC}
.mega-body{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
@media(max-width:880px){.mega-body{grid-template-columns:1fr 1fr}}
@media(max-width:580px){.mega-body{grid-template-columns:1fr}}
.mlevel h5{font-family:var(--fd);font-weight:800;font-size:.74rem;letter-spacing:1.3px;
  color:var(--orange);text-transform:uppercase;padding-bottom:8px;margin-bottom:10px;
  border-bottom:2px solid var(--orange3)}
.mcourse{display:block;padding:9px 11px;border-radius:10px;margin-bottom:4px;transition:.16s}
.mcourse:hover{background:var(--orange3);transform:translateX(-3px)}
.mcourse b{display:block;font-size:.86rem;color:var(--navy);font-weight:600;line-height:1.45}
.mcourse .code{font-size:.7rem;color:var(--orange)}
.mcourse .mm{display:flex;gap:4px;margin-top:5px;flex-wrap:wrap}
.mcourse .mm i{font-style:normal;font-size:.62rem;background:var(--paper);border:1px solid var(--line);
  border-radius:5px;padding:1px 6px;color:var(--dim)}
.mbadge{font-size:.61rem;background:var(--orange);color:#fff;border-radius:5px;
  padding:1px 7px;font-weight:700;margin-inline-start:5px}
.mega-foot{grid-column:1/-1;border-top:1px solid var(--line);padding-top:18px;margin-top:8px;
  display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.mega-foot span{font-size:.84rem;color:var(--dim);flex:1}

/* ═══════════ البطاقات ═══════════ */
.card{background:var(--white);border:1px solid var(--line);border-radius:var(--r2);
  box-shadow:var(--sh);transition:.28s var(--ease)}
.card.pad{padding:28px}
.grid{display:grid;gap:22px}
.g2{grid-template-columns:repeat(auto-fit,minmax(310px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(285px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(215px,1fr))}

/* ─── بطاقة الباقة ─── */
.pk{display:flex;flex-direction:column;overflow:hidden;position:relative}
.pk:hover{transform:translateY(-6px);box-shadow:var(--sh2);border-color:var(--orange)}
.pk-vis{height:126px;position:relative;overflow:hidden;
  background:linear-gradient(150deg,var(--navy),var(--navy3))}
.pk-vis::after{content:'';position:absolute;inset:0;
  background:radial-gradient(circle at 78% 22%,rgba(240,116,26,.4),transparent 62%)}
.pk-vis .em{position:absolute;inset-inline-end:16px;bottom:-8px;font-size:4.2rem;
  opacity:.28;transition:.4s var(--ease)}
.pk:hover .pk-vis .em{transform:scale(1.15) rotate(-8deg);opacity:.4}
.pk-vis .cd{position:absolute;top:16px;inset-inline-start:18px;z-index:2;
  font-size:.82rem;color:var(--orange2);font-weight:700}
.pk-vis .md{position:absolute;bottom:14px;inset-inline-start:18px;z-index:2;
  display:inline-flex;align-items:center;gap:5px;background:rgba(255,255,255,.16);
  border:1px solid rgba(255,255,255,.24);border-radius:8px;padding:3px 10px;
  font-size:.72rem;color:#fff;backdrop-filter:blur(6px)}
.pk-badge{position:absolute;top:14px;inset-inline-end:16px;z-index:3;
  background:var(--orange);color:#fff;font-size:.68rem;font-weight:700;
  border-radius:7px;padding:4px 11px;box-shadow:0 4px 14px -4px rgba(240,116,26,.7)}
.pk-body{padding:20px 24px 24px;flex:1;display:flex;flex-direction:column}
.pk-body h3{font-family:var(--fd);font-weight:700;font-size:1.1rem;color:var(--navy);
  line-height:1.45;margin-bottom:7px}
.pk-body>p{font-size:.85rem;color:var(--dim);line-height:1.78;margin-bottom:14px}
.pk-meta{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:15px;
  padding-bottom:15px;border-bottom:1px dashed var(--line2)}
.pkm{font-size:.74rem;color:var(--dim)}
.pkm b{display:block;font-family:var(--fm);font-size:1rem;color:var(--navy);font-weight:600}
.pk-inc{list-style:none;margin-bottom:18px;flex:1}
.pk-inc li{font-size:.83rem;color:var(--txt);padding:5px 0;padding-inline-start:23px;
  position:relative;line-height:1.7}
.pk-inc li::before{content:'✓';position:absolute;inset-inline-start:0;top:5px;
  color:var(--ok);font-weight:800;font-size:.82rem}
