<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>إدارة الباقات والمحتوى — السعيد</title>
<style>
:root{--n:#0e2444;--n2:#173763;--o:#f0741a;--bg:#f6f8fb;--w:#fff;--l:#dfe5ee;--t:#1c2b42;--d:#66758d;--ok:#0e7c4a;--bad:#bd2635}
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:var(--bg);color:var(--t)}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}.side{background:var(--n);color:#fff;padding:22px 14px;position:sticky;top:0;height:100vh}.brand{padding:8px 10px 20px;border-bottom:1px solid #ffffff22;margin-bottom:14px}.brand b{font-size:20px}.brand small{display:block;color:#b8c7db;margin-top:4px}.nav button{width:100%;border:0;background:transparent;color:#d7e1ef;text-align:right;padding:12px;border-radius:10px;margin:3px 0}.nav button.on,.nav button:hover{background:var(--o);color:#fff}.main{padding:28px;min-width:0}.top{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:20px}.top h1{margin:0;color:var(--n);font-size:26px;flex:1}.top p{width:100%;margin:0;color:var(--d)}.card{background:#fff;border:1px solid var(--l);border-radius:16px;padding:18px;margin-bottom:16px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.stat b{display:block;font-size:28px;color:var(--n)}.muted{color:var(--d);font-size:13px}.btn{border:1px solid var(--l);background:#fff;border-radius:10px;padding:10px 14px;font-weight:700}.btn.p{background:var(--o);border-color:var(--o);color:#fff}.btn.n{background:var(--n);border-color:var(--n);color:#fff}.btn.d{background:#fff1f2;color:var(--bad);border-color:#f1c7cc}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.f{display:block;margin-bottom:12px}.f span{display:block;font-weight:700;font-size:13px;margin-bottom:5px}.f input,.f select,.f textarea,input,select,textarea{width:100%;border:1px solid #cbd5e1;border-radius:9px;padding:10px;background:#fff}.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}.tools>*{max-width:320px}.tbl{overflow:auto;border:1px solid var(--l);border-radius:12px;background:#fff}table{width:100%;border-collapse:collapse;font-size:13px}th{background:var(--n);color:#fff;padding:10px;text-align:right;white-space:nowrap}td{padding:9px;border-bottom:1px solid var(--l);vertical-align:top}.chip{display:inline-block;padding:3px 8px;border-radius:999px;background:#fff0e4;color:#a24b0e;font-size:12px}.ok{color:var(--ok)}.bad{color:var(--bad)}.notice{padding:13px 15px;border-radius:10px;background:#fff5e9;border:1px solid #f2d3ac;margin-bottom:14px}.err{background:#fff1f2;border-color:#f1c7cc;color:#8c1d28}.modal{position:fixed;inset:0;background:#0e2444cc;display:flex;align-items:center;justify-content:center;padding:20px;z-index:50}.box{background:#fff;border-radius:18px;padding:22px;width:min(760px,100%);max-height:90vh;overflow:auto}.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.pkg{display:flex;gap:12px;align-items:start}.pkg h3{margin:0;color:var(--n)}.pkg .grow{flex:1}.pager{display:flex;gap:8px;align-items:center;justify-content:center;margin-top:12px}.loginerr{max-width:650px;margin:80px auto;background:#fff;padding:30px;border-radius:18px;border:1px solid var(--l);text-align:center}@media(max-width:850px){.app{grid-template-columns:1fr}.side{height:auto;position:static}.nav{display:flex;overflow:auto}.nav button{min-width:max-content}.main{padding:16px}.row,.row3{grid-template-columns:1fr}}
</style>
</head>
<body><div id="root"></div>
<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const ROOT='/' + location.pathname.split('/').filter(Boolean)[0];
let TOK=''; try{TOK=localStorage.getItem('as_panel_tok')||''}catch{}
let TAB='packages', PKGS=[], STATS={}, CUR='', QUESTIONS=[], QPAGE=1, QSEARCH='';
function failScreen(msg){$('#root').innerHTML=`<div class="loginerr"><h2>تعذر فتح إدارة المحتوى</h2><p>${esc(msg)}</p><button class="btn n" onclick="location.href='${ROOT}'">العودة للوحة الإدارة</button></div>`}
async function req(url,opt={}){const r=await fetch(url,{method:opt.method||'GET',headers:{'Content-Type':'application/json','Authorization':'Bearer '+TOK},body:opt.body?JSON.stringify(opt.body):undefined});const d=await r.json().catch(()=>({}));if(!r.ok){const e=new Error(d.error||`خطأ ${r.status}`);e.status=r.status;throw e}return d}
const ca=(p,o)=>req(ROOT+'/api/content-admin'+p,o);
const pa=(p,o)=>req(ROOT+'/api'+p,o);
function toast(m){const x=document.createElement('div');x.style='position:fixed;left:20px;bottom:20px;background:#0e2444;color:#fff;padding:12px 18px;border-radius:10px;z-index:80';x.textContent=m;document.body.appendChild(x);setTimeout(()=>x.remove(),3200)}
function modal(html,bind){const m=document.createElement('div');m.className='modal';m.innerHTML='<div class="box">'+html+'</div>';document.body.appendChild(m);m.onclick=e=>{if(e.target===m)m.remove()};m.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>m.remove());bind&&bind(m)}
function nav(){return [['packages','📦','الباقات'],['students','👥','الطلاب وإسناد الباقات'],['questions','❓','بنك الأسئلة'],['lessons','🎬','الدروس والفيديو'],['exams','📝','الاختبارات'],['resources','📚','الموارد']];}
function shell(body){return `<div class="app"><aside class="side"><div class="brand"><b>إدارة الباقات والمحتوى</b><small>AL SAEED LMS</small></div><div class="nav">${nav().map(n=>`<button data-tab="${n[0]}" class="${TAB===n[0]?'on':''}">${n[1]} ${n[2]}</button>`).join('')}</div><button class="btn" style="width:100%;margin-top:18px" id="back">← لوحة المشرف</button></aside><main class="main">${body}</main></div>`}
function top(h,p,a=''){return `<div class="top"><h1>${h}</h1>${a}<p>${p}</p></div>`}
function pkgSelect(id='pkgSel'){return `<select id="${id}">${PKGS.map(p=>`<option value="${esc(p.id)}" ${p.id===CUR?'selected':''}>${esc(p.ar||p.en||p.id)}</option>`).join('')}</select>`}
function bindCommon(){$$('[data-tab]').forEach(b=>b.onclick=()=>{TAB=b.dataset.tab;render()});const bk=$('#back');if(bk)bk.onclick=()=>location.href=ROOT}
async function boot(){if(!TOK)return failScreen('سجّل الدخول أولًا من لوحة المشرف ثم افتح إدارة المحتوى.');try{const d=await ca('/boot');PKGS=d.packages||[];STATS=d.stats||{};CUR=PKGS[0]?.id||'';render()}catch(e){failScreen(e.status===401?'جلسة المشرف منتهية. ارجع للوحة وسجّل الدخول من جديد.':e.message)}}
function render(){let body='';if(TAB==='packages')body=viewPackages();if(TAB==='students')body=viewStudents();if(TAB==='questions')body=viewQuestions();if(TAB==='lessons')body=viewLessons();if(TAB==='exams')body=viewExams();if(TAB==='resources')body=viewResources();$('#root').innerHTML=shell(body);bindCommon();if(TAB==='packages')bindPackages();if(TAB==='students')bindStudents();if(TAB==='questions')bindQuestions();if(TAB==='lessons')bindLessons();if(TAB==='exams')bindExams();if(TAB==='resources')bindResources()}
function viewPackages(){return top('الباقات','أضف أو عدّل السعر والمدة والوصف والفصول وحالة النشر.','<button class="btn p" id="newPkg">＋ باقة جديدة</button>')+`<div class="grid"><div class="card stat"><b>${PKGS.length}</b><span>باقة</span></div><div class="card stat"><b>${STATS.lessons||0}</b><span>درس</span></div><div class="card stat"><b>${STATS.questions||0}</b><span>سؤال</span></div><div class="card stat"><b>${STATS.enrollments||0}</b><span>اشتراك</span></div></div><div class="grid" style="margin-top:16px">${PKGS.map(p=>`<div class="card pkg"><div class="grow"><h3>${esc(p.ar||p.id)}</h3><div class="muted">${esc(p.code||p.id)} · ${esc(p.en||'')}</div><p>${esc(p.desc||'')}</p><span class="chip">${Number(p.price||0)} ${esc(p.currency||'USD')}</span> <span class="chip">${Number(p.days||90)} يوم</span> <span class="chip">${p.active===false?'غير منشورة':'منشورة'}</span></div><button class="btn editPkg" data-id="${esc(p.id)}">تعديل</button></div>`).join('')||'<div class="card">لا توجد باقات.</div>'}</div>`}
function pkgForm(p={}){return `<h2>${p.id?'تعديل الباقة':'باقة جديدة'}</h2><div class="row"><label class="f"><span>ID</span><input id="pId" value="${esc(p.id||'')}" ${p.id?'disabled':''} placeholder="pmp-2026"></label><label class="f"><span>الكود</span><input id="pCode" value="${esc(p.code||'')}"></label></div><div class="row"><label class="f"><span>الاسم العربي</span><input id="pAr" value="${esc(p.ar||'')}"></label><label class="f"><span>English</span><input id="pEn" value="${esc(p.en||'')}"></label></div><label class="f"><span>الوصف</span><textarea id="pDesc" rows="3">${esc(p.desc||'')}</textarea></label><div class="row3"><label class="f"><span>السعر</span><input id="pPrice" type="number" step="0.01" value="${Number(p.price||0)}"></label><label class="f"><span>العملة</span><select id="pCur">${['USD','EGP','SAR','AED'].map(x=>`<option ${x===(p.currency||'USD')?'selected':''}>${x}</option>`).join('')}</select></label><label class="f"><span>مدة الوصول بالأيام</span><input id="pDays" type="number" value="${Number(p.days||90)}"></label></div><div class="row"><label class="f"><span>الساعات</span><input id="pHours" type="number" value="${Number(p.hours||0)}"></label><label class="f"><span>رابط صورة الغلاف</span><input id="pImg" value="${esc(p.image||'')}"></label></div><label class="f"><span>الفصول — فصل في كل سطر</span><textarea id="pCh" rows="6">${esc((p._chapters||[]).join('\n'))}</textarea></label><label><input style="width:auto" id="pActive" type="checkbox" ${p.active===false?'':'checked'}> منشورة</label><div class="acts"><button class="btn p" id="savePkg">حفظ</button><button class="btn" data-close>إلغاء</button></div>`}
function bindPackages(){const n=$('#newPkg');if(n)n.onclick=()=>openPkg({});$$('.editPkg').forEach(b=>b.onclick=()=>openPkg(PKGS.find(p=>p.id===b.dataset.id)||{}))}
function openPkg(p){modal(pkgForm(p),m=>{$('#savePkg').onclick=async()=>{try{const body={id:$('#pId').value.trim(),code:$('#pCode').value.trim(),ar:$('#pAr').value.trim(),en:$('#pEn').value.trim(),desc:$('#pDesc').value.trim(),price:+$('#pPrice').value||0,currency:$('#pCur').value,days:+$('#pDays').value||90,hours:+$('#pHours').value||0,image:$('#pImg').value.trim(),_chapters:$('#pCh').value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean),active:$('#pActive').checked};await ca('/packages'+(p.id?'/'+encodeURIComponent(p.id):''),{method:p.id?'PUT':'POST',body});m.remove();toast('تم حفظ الباقة');await boot()}catch(e){alert(e.message)}}})}
function viewStudents(){return top('الطلاب وإسناد الباقات','اكتب البريد. إذا كان الطالب موجودًا نفتح له الباقة، وإذا غير موجود أدخل اسمه وسيتم إنشاء حساب وفتح الباقة في نفس العملية.')+`<div class="card"><div class="row"><label class="f"><span>البريد الإلكتروني *</span><input id="stEmail" type="email" placeholder="student@example.com"></label><label class="f"><span>الاسم — مطلوب فقط إذا كان جديدًا</span><input id="stName" placeholder="اسم الطالب"></label></div><div class="row"><label class="f"><span>الباقة</span>${pkgSelect('stPkg')}</label><label class="f"><span>مدة الوصول</span><input id="stDays" type="number" value="365"></label></div><label class="f"><span>كلمة مرور مؤقتة — اختياري للطالب الجديد</span><input id="stPass" placeholder="اتركها فارغة ليولّد النظام كلمة مرور"></label><div class="acts"><button class="btn p" id="grantOrCreate">فتح الباقة / إنشاء الطالب</button><button class="btn d" id="revoke">سحب الباقة</button></div><div id="stMsg" style="margin-top:12px"></div></div><div class="card"><div class="tools"><input id="findText" placeholder="ابحث بالاسم أو البريد"><button class="btn n" id="findBtn">بحث</button></div><div id="studentResults" class="tbl"></div></div>`}
function bindStudents(){$('#grantOrCreate').onclick=async()=>{const email=$('#stEmail').value.trim().toLowerCase(),pkg=$('#stPkg').value,days=+$('#stDays').value||365,name=$('#stName').value.trim();if(!email||!pkg)return alert('اكتب البريد واختر الباقة');try{await ca('/enroll',{method:'POST',body:{email,packageId:pkg,days,source:'إضافة إدارية'}});$('#stMsg').innerHTML='<div class="notice ok">✅ الطالب موجود وتم فتح الباقة له فورًا.</div>';toast('تم فتح الباقة')}catch(e){if(e.status!==404)return alert(e.message);if(!name)return $('#stMsg').innerHTML='<div class="notice err">هذا البريد غير مسجل. اكتب اسم الطالب ثم اضغط الزر مرة أخرى لإنشاء الحساب وفتح الباقة.</div>';try{const d=await pa('/students',{method:'POST',body:{name,email,password:$('#stPass').value.trim(),packages:[{id:pkg,days}]}});$('#stMsg').innerHTML=`<div class="notice ok">✅ تم إنشاء الحساب وفتح الباقة.<br>البريد: <b>${esc(email)}</b>${d.password?`<br>كلمة المرور المؤقتة: <b>${esc(d.password)}</b>`:''}</div>`;toast('تم إنشاء الطالب وفتح الباقة')}catch(x){alert(x.message)}}};$('#revoke').onclick=async()=>{if(!confirm('سحب الباقة؟'))return;try{await ca('/enroll',{method:'DELETE',body:{email:$('#stEmail').value.trim(),packageId:$('#stPkg').value}});toast('تم سحب الباقة')}catch(e){alert(e.message)}};$('#findBtn').onclick=async()=>{try{const a=await ca('/students?q='+encodeURIComponent($('#findText').value));$('#studentResults').innerHTML=a.length?`<table><thead><tr><th>الاسم</th><th>البريد</th><th>الباقات</th></tr></thead><tbody>${a.map(u=>`<tr><td>${esc(u.name)}</td><td>${esc(u.email)}</td><td>${(u.enrollments||[]).map(e=>`<span class="chip">${esc(e.package_id)}</span>`).join(' ')||'—'}</td></tr>`).join('')}</tbody></table>`:'<div class="card">لا توجد نتائج</div>'}catch(e){alert(e.message)}}}
function viewQuestions(){return top('بنك الأسئلة','اختر الباقة ثم حمّل الأسئلة. يمكنك البحث والتعديل سؤالًا بسؤال.')+`<div class="card"><div class="tools">${pkgSelect('qPkg')}<button class="btn n" id="loadQ">تحميل الأسئلة</button><input id="qSearch" placeholder="بحث"></div><div id="qInfo" class="muted"></div><div id="qTable" class="tbl"></div><div id="qPager" class="pager"></div></div>`}
function filteredQ(){const s=QSEARCH.toLowerCase();return QUESTIONS.filter(q=>!s||JSON.stringify(q).toLowerCase().includes(s))}
function drawQ(){const a=filteredQ(),size=50,pages=Math.max(1,Math.ceil(a.length/size));QPAGE=Math.min(QPAGE,pages);const part=a.slice((QPAGE-1)*size,QPAGE*size);$('#qInfo').textContent=`${a.length} سؤال — الصفحة ${QPAGE} من ${pages}`;$('#qTable').innerHTML=part.length?`<table><thead><tr><th>#</th><th>السؤال</th><th>Domain</th><th>النوع</th><th>الإجابة</th><th></th></tr></thead><tbody>${part.map((q,i)=>`<tr><td>${(QPAGE-1)*size+i+1}</td><td style="min-width:420px">${esc(q.question_ar||q.question_en)}</td><td>${esc(q.domain||'')}</td><td>${esc(q.type||'')}</td><td>${esc(q.correct||'')}</td><td><button class="btn editQ" data-id="${esc(q.id)}">تعديل</button></td></tr>`).join('')}</tbody></table>`:'<div class="card">لا توجد أسئلة.</div>';$('#qPager').innerHTML=`<button class="btn" id="qPrev" ${QPAGE<=1?'disabled':''}>السابق</button><span>${QPAGE}/${pages}</span><button class="btn" id="qNext" ${QPAGE>=pages?'disabled':''}>التالي</button>`;$('#qPrev').onclick=()=>{QPAGE--;drawQ()};$('#qNext').onclick=()=>{QPAGE++;drawQ()};$$('.editQ').forEach(b=>b.onclick=()=>openQuestion(QUESTIONS.find(q=>q.id===b.dataset.id)))}
function bindQuestions(){$('#loadQ').onclick=async()=>{CUR=$('#qPkg').value;try{QUESTIONS=await ca('/questions/'+encodeURIComponent(CUR));QPAGE=1;drawQ()}catch(e){alert(e.message)}};$('#qSearch').oninput=e=>{QSEARCH=e.target.value;QPAGE=1;if(QUESTIONS.length)drawQ()}}
function openQuestion(q){let ops=[];try{ops=Array.isArray(q.options)?q.options:JSON.parse(q.options||'[]')}catch{};while(ops.length<4)ops.push('');modal(`<h2>تعديل السؤال</h2><div class="row"><label class="f"><span>Domain</span><input id="qeDom" value="${esc(q.domain||'')}"></label><label class="f"><span>الموضوع</span><input id="qeTopic" value="${esc(q.topic||'')}"></label></div><label class="f"><span>نص السؤال</span><textarea id="qeText" rows="5">${esc(q.question_ar||'')}</textarea></label>${ops.map((o,i)=>`<label class="f"><span>الخيار ${String.fromCharCode(65+i)}</span><input class="qeOp" value="${esc(o)}"></label>`).join('')}<label class="f"><span>الإجابة الصحيحة (مثال A أو A,C)</span><input id="qeCor" value="${esc(q.correct||'')}"></label><label class="f"><span>التفسير</span><textarea id="qeExp" rows="4">${esc(q.explanation_ar||'')}</textarea></label><label class="f"><span>المرجع</span><input id="qeRef" value="${esc(q.reference||'')}"></label><div class="acts"><button class="btn p" id="saveQe">حفظ</button><button class="btn" data-close>إلغاء</button></div>`,m=>{$('#saveQe').onclick=async()=>{try{await ca('/questions/'+encodeURIComponent(q.id),{method:'PUT',body:{package_id:q.package_id,domain:$('#qeDom').value,topic:$('#qeTopic').value,difficulty:q.difficulty||'medium',type:q.type||'single',question_ar:$('#qeText').value,question_en:q.question_en||'',options:$$('.qeOp').map(x=>x.value),correct:$('#qeCor').value,explanation_ar:$('#qeExp').value,explanation_en:q.explanation_en||'',reference:$('#qeRef').value,active:true}});m.remove();toast('تم حفظ السؤال');QUESTIONS=await ca('/questions/'+encodeURIComponent(CUR));drawQ()}catch(e){alert(e.message)}}})}
function viewLessons(){return top('الدروس والفيديو','اختر الباقة، حمّل الدروس، عدّل Vimeo والعناوين ثم احفظ.')+`<div class="card"><div class="tools">${pkgSelect('lPkg')}<button class="btn n" id="loadL">تحميل</button><button class="btn p" id="addL">＋ درس</button><button class="btn" id="saveL">حفظ</button></div><div id="lTable" class="tbl"></div></div>`}
function bindLessons(){let L=[];const draw=()=>{$('#lTable').innerHTML=`<table><thead><tr><th>#</th><th>الفصل</th><th>العنوان</th><th>المدة</th><th>Vimeo</th><th>مجاني</th><th></th></tr></thead><tbody>${L.map((x,i)=>`<tr><td>${i+1}</td><td><input class="lc" type="number" value="${x.chapter||0}"></td><td><input class="lt" value="${esc(x.title||'')}"></td><td><input class="ld" value="${esc(x.duration||'')}"></td><td><input class="lv" value="${esc(x.vimeo||'')}"></td><td><input class="lf" type="checkbox" ${x.free?'checked':''}></td><td><button class="btn d lx" data-i="${i}">حذف</button></td></tr>`).join('')}</tbody></table>`;$$('.lx').forEach(b=>b.onclick=()=>{L.splice(+b.dataset.i,1);draw()})};const harvest=()=>{$$('#lTable tbody tr').forEach((r,i)=>{L[i]={chapter:+r.querySelector('.lc').value||0,title:r.querySelector('.lt').value,duration:r.querySelector('.ld').value,vimeo:r.querySelector('.lv').value,free:r.querySelector('.lf').checked}})};$('#loadL').onclick=async()=>{CUR=$('#lPkg').value;try{L=await pa('/lessons/'+encodeURIComponent(CUR));draw()}catch(e){alert(e.message)}};$('#addL').onclick=()=>{if($('#lTable tbody'))harvest();L.push({chapter:0,title:'',duration:'',vimeo:'',free:false});draw()};$('#saveL').onclick=async()=>{harvest();try{await pa('/lessons/'+encodeURIComponent($('#lPkg').value),{method:'PUT',body:L});toast('تم حفظ الدروس')}catch(e){alert(e.message)}}}
function viewExams(){return top('الاختبارات','أنشئ أو راجع الاختبارات المرتبطة بالباقة.')+`<div class="card"><div class="tools">${pkgSelect('ePkg')}<button class="btn n" id="loadE">تحميل</button><button class="btn p" id="newE">＋ اختبار</button></div><div id="eTable" class="tbl"></div></div>`}
function bindExams(){let E=[];const draw=()=>{$('#eTable').innerHTML=E.length?`<table><thead><tr><th>العنوان</th><th>النوع</th><th>المدة</th><th>الأسئلة</th><th>النجاح</th></tr></thead><tbody>${E.map(x=>`<tr><td>${esc(x.title)}</td><td>${esc(x.kind)}</td><td>${x.duration}</td><td>${x.question_count}</td><td>${x.pass_score}%</td></tr>`).join('')}</tbody></table>`:'<div class="card">لا توجد اختبارات.</div>'};$('#loadE').onclick=async()=>{try{E=await ca('/exams/'+encodeURIComponent($('#ePkg').value));draw()}catch(e){alert(e.message)}};$('#newE').onclick=()=>modal(`<h2>اختبار جديد</h2><label class="f"><span>العنوان</span><input id="et"></label><div class="row3"><label class="f"><span>النوع</span><select id="ek"><option>mini</option><option>chapter</option><option>domain</option><option>full</option><option>custom</option></select></label><label class="f"><span>المدة</span><input id="ed" type="number" value="60"></label><label class="f"><span>عدد الأسئلة</span><input id="ec" type="number" value="50"></label></div><label class="f"><span>درجة النجاح</span><input id="ep" type="number" value="70"></label><div class="acts"><button class="btn p" id="es">حفظ</button><button class="btn" data-close>إلغاء</button></div>`,m=>{$('#es').onclick=async()=>{try{await ca('/exams',{method:'POST',body:{package_id:$('#ePkg').value,title:$('#et').value,kind:$('#ek').value,duration:+$('#ed').value,question_count:+$('#ec').value,pass_score:+$('#ep').value,active:true}});m.remove();toast('تم حفظ الاختبار')}catch(e){alert(e.message)}}})}
function viewResources(){return top('الموارد','PDF وروابط وقوالب وأنشطة ومختبرات.')+`<div class="card"><div class="tools">${pkgSelect('rPkg')}<button class="btn n" id="loadR">تحميل</button><button class="btn p" id="newR">＋ مورد</button></div><div id="rTable" class="tbl"></div></div>`}
function bindResources(){let R=[];const draw=()=>{$('#rTable').innerHTML=R.length?`<table><thead><tr><th>العنوان</th><th>النوع</th><th>الرابط</th><th>ملاحظة</th></tr></thead><tbody>${R.map(x=>`<tr><td>${esc(x.title)}</td><td>${esc(x.type)}</td><td>${x.url?`<a href="${esc(x.url)}" target="_blank">فتح</a>`:'—'}</td><td>${esc(x.note||'')}</td></tr>`).join('')}</tbody></table>`:'<div class="card">لا توجد موارد.</div>'};$('#loadR').onclick=async()=>{try{R=await ca('/resources/'+encodeURIComponent($('#rPkg').value));draw()}catch(e){alert(e.message)}};$('#newR').onclick=()=>modal(`<h2>مورد جديد</h2><div class="row"><label class="f"><span>العنوان</span><input id="rt"></label><label class="f"><span>النوع</span><select id="ry"><option>pdf</option><option>template</option><option>link</option><option>book</option><option>activity</option><option>lab</option><option>other</option></select></label></div><label class="f"><span>الرابط</span><input id="ru"></label><label class="f"><span>ملاحظة</span><textarea id="rn"></textarea></label><div class="acts"><button class="btn p" id="rs">حفظ</button><button class="btn" data-close>إلغاء</button></div>`,m=>{$('#rs').onclick=async()=>{try{await ca('/resources',{method:'POST',body:{package_id:$('#rPkg').value,title:$('#rt').value,type:$('#ry').value,url:$('#ru').value,note:$('#rn').value,active:true}});m.remove();toast('تم حفظ المورد')}catch(e){alert(e.message)}}})}
boot();
</script></body></html>
