<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>إدارة الباقات والمحتوى — السعيد</title>
<style>
:root{--n:#0e2444;--o:#f0741a;--bg:#f6f8fb;--w:#fff;--l:#dfe5ee;--t:#1c2b42;--d:#66758d;--ok:#0e7c4a;--bad:#bd2635}
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:var(--bg);color:var(--t)}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{display:grid;grid-template-columns:260px 1fr;min-height:100vh}.side{background:var(--n);color:#fff;padding:20px 14px}.brand{padding:8px 10px 18px;border-bottom:1px solid #ffffff22;margin-bottom:12px}.brand b{font-size:19px}.brand small{display:block;color:#b8c7db;margin-top:5px}.nav button{width:100%;border:0;background:transparent;color:#d7e1ef;text-align:right;padding:12px;border-radius:10px;margin:3px 0}.nav button.active,.nav button:hover{background:var(--o);color:#fff}.main{padding:26px}.card{background:#fff;border:1px solid var(--l);border-radius:15px;padding:18px;margin-bottom:15px}h1{font-size:26px;color:var(--n);margin:0 0 6px}h2{font-size:18px;color:var(--n)}.muted{color:var(--d);font-size:13px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.stat b{display:block;font-size:27px;color:var(--n)}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.f{display:block;margin-bottom:11px}.f span{display:block;font-weight:700;font-size:13px;margin-bottom:5px}input,select,textarea{width:100%;border:1px solid #cbd5e1;border-radius:9px;padding:10px;background:#fff}.btn{border:1px solid var(--l);background:#fff;border-radius:9px;padding:9px 13px;font-weight:700}.btn.p{background:var(--o);border-color:var(--o);color:#fff}.btn.n{background:var(--n);border-color:var(--n);color:#fff}.btn.d{color:var(--bad)}.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:12px 0}.tools>*{max-width:320px}.tbl{overflow:auto;border:1px solid var(--l);border-radius:12px;background:#fff}table{width:100%;border-collapse:collapse;font-size:13px}th{background:var(--n);color:#fff;padding:10px;text-align:right;white-space:nowrap}td{padding:9px;border-bottom:1px solid var(--l);vertical-align:top}.notice{padding:13px;border-radius:10px;background:#fff6e8;border:1px solid #f2d3ac;margin:12px 0}.ok{background:#e8f6ef;border-color:#b9e3cc;color:#0b6240}.bad{background:#fff1f2;border-color:#f1c7cc;color:#8c1d28}.hidden{display:none}.topline{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:15px}.topline h1{flex:1}@media(max-width:850px){.app{grid-template-columns:1fr}.row{grid-template-columns:1fr}.main{padding:15px}}
</style>
</head>
<body>
<div id="root"><div style="padding:40px;text-align:center">جارٍ تحميل لوحة إدارة المحتوى…</div></div>
<script>
(function(){
'use strict';
var ROOT='/' + location.pathname.split('/').filter(Boolean)[0];
var TOK='';
try{TOK=localStorage.getItem('as_panel_tok')||'';}catch(e){}
var PKGS=[],STATS={},TAB='packages',QUESTIONS=[];
function byId(id){return document.getElementById(id);}
function esc(v){return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function request(url,method,body){return fetch(url,{method:method||'GET',headers:{'Content-Type':'application/json','Authorization':'Bearer '+TOK},body:body?JSON.stringify(body):undefined}).then(function(r){return r.json().catch(function(){return {};}).then(function(d){if(!r.ok){var e=new Error(d.error||('خطأ '+r.status));e.status=r.status;throw e;}return d;});});}
function ca(path,method,body){return request(ROOT+'/api/content-admin'+path,method,body);}
function pa(path,method,body){return request(ROOT+'/api'+path,method,body);}
function pkgOptions(){return PKGS.map(function(p){return '<option value="'+esc(p.id)+'">'+esc(p.ar||p.en||p.id)+'</option>';}).join('');}
function layout(body){var items=[['packages','📦','الباقات'],['students','👥','الطلاب وإسناد الباقات'],['questions','❓','بنك الأسئلة'],['lessons','🎬','الدروس والفيديو']];return '<div class="app"><aside class="side"><div class="brand"><b>إدارة الباقات والمحتوى</b><small>AL SAEED LMS</small></div><div class="nav">'+items.map(function(x){return '<button data-tab="'+x[0]+'" class="'+(TAB===x[0]?'active':'')+'">'+x[1]+' '+x[2]+'</button>';}).join('')+'</div><button class="btn" id="back" style="width:100%;margin-top:18px">← لوحة المشرف</button></aside><main class="main">'+body+'</main></div>';}
function bindNav(){Array.prototype.forEach.call(document.querySelectorAll('[data-tab]'),function(b){b.onclick=function(){TAB=b.getAttribute('data-tab');render();};});if(byId('back'))byId('back').onclick=function(){location.href=ROOT;};}
function fail(msg){byId('root').innerHTML='<div class="card" style="max-width:700px;margin:70px auto;text-align:center"><h1>تعذر فتح إدارة المحتوى</h1><div class="notice bad">'+esc(msg)+'</div><button class="btn n" onclick="location.href=\''+ROOT+'\'">العودة للوحة المشرف</button></div>';}
function boot(){if(!TOK){fail('لا توجد جلسة مشرف. افتح لوحة المشرف وسجّل الدخول أولاً.');return;}ca('/boot').then(function(d){PKGS=d.packages||[];STATS=d.stats||{};render();}).catch(function(e){fail(e.status===401?'جلسة المشرف انتهت. ارجع للوحة وسجل الدخول من جديد.':e.message);});}
function render(){var body='';if(TAB==='packages')body=viewPackages();else if(TAB==='students')body=viewStudents();else if(TAB==='questions')body=viewQuestions();else body=viewLessons();byId('root').innerHTML=layout(body);bindNav();if(TAB==='packages')bindPackages();if(TAB==='students')bindStudents();if(TAB==='questions')bindQuestions();if(TAB==='lessons')bindLessons();}
function viewPackages(){var cards=PKGS.map(function(p){return '<div class="card"><h2>'+esc(p.ar||p.id)+'</h2><div class="muted">'+esc(p.code||p.id)+' · '+esc(p.en||'')+'</div><p>'+esc(p.desc||'')+'</p><b>'+Number(p.price||0)+' '+esc(p.currency||'USD')+'</b> · '+Number(p.days||90)+' يوم<br><button class="btn editPkg" data-id="'+esc(p.id)+'" style="margin-top:10px">تعديل</button></div>';}).join('');return '<div class="topline"><h1>الباقات</h1><button class="btn p" id="newPkg">＋ باقة جديدة</button></div><div class="muted">أضف وعدّل السعر والمدة والوصف والفصول وحالة النشر.</div><div class="grid" style="margin-top:15px"><div class="card stat"><b>'+PKGS.length+'</b>باقات</div><div class="card stat"><b>'+(STATS.lessons||0)+'</b>دروس</div><div class="card stat"><b>'+(STATS.questions||0)+'</b>أسئلة</div><div class="card stat"><b>'+(STATS.enrollments||0)+'</b>اشتراكات</div></div><div class="grid" style="margin-top:15px">'+(cards||'<div class="card">لا توجد باقات.</div>')+'</div>';}
function packageForm(p){p=p||{};return '<div class="card"><h2>'+(p.id?'تعديل الباقة':'باقة جديدة')+'</h2><div class="row"><label class="f"><span>ID</span><input id="pId" '+(p.id?'disabled':'')+' value="'+esc(p.id||'')+'" placeholder="pmp-2026"></label><label class="f"><span>الكود</span><input id="pCode" value="'+esc(p.code||'')+'"></label></div><div class="row"><label class="f"><span>الاسم العربي</span><input id="pAr" value="'+esc(p.ar||'')+'"></label><label class="f"><span>الاسم الإنجليزي</span><input id="pEn" value="'+esc(p.en||'')+'"></label></div><label class="f"><span>الوصف</span><textarea id="pDesc" rows="3">'+esc(p.desc||'')+'</textarea></label><div class="row"><label class="f"><span>السعر</span><input id="pPrice" type="number" step="0.01" value="'+Number(p.price||0)+'"></label><label class="f"><span>العملة</span><select id="pCur"><option>USD</option><option>EGP</option><option>SAR</option><option>AED</option></select></label></div><div class="row"><label class="f"><span>مدة الوصول بالأيام</span><input id="pDays" type="number" value="'+Number(p.days||90)+'"></label><label class="f"><span>الساعات</span><input id="pHours" type="number" value="'+Number(p.hours||0)+'"></label></div><label class="f"><span>الفصول — فصل في كل سطر</span><textarea id="pCh" rows="5">'+esc((p._chapters||[]).join('\n'))+'</textarea></label><label><input id="pActive" type="checkbox" style="width:auto" '+(p.active===false?'':'checked')+'> منشورة</label><div class="tools"><button class="btn p" id="savePkg">حفظ</button><button class="btn" id="cancelPkg">إلغاء</button></div></div>';}
function editPackage(p){byId('root').innerHTML=layout(packageForm(p));bindNav();var cur=byId('pCur');if(cur)cur.value=p.currency||'USD';byId('cancelPkg').onclick=function(){render();};byId('savePkg').onclick=function(){var body={id:byId('pId').value.trim(),code:byId('pCode').value.trim(),ar:byId('pAr').value.trim(),en:byId('pEn').value.trim(),desc:byId('pDesc').value.trim(),price:Number(byId('pPrice').value)||0,currency:byId('pCur').value,days:Number(byId('pDays').value)||90,hours:Number(byId('pHours').value)||0,_chapters:byId('pCh').value.split(/\r?\n/).map(function(x){return x.trim();}).filter(Boolean),active:byId('pActive').checked};ca('/packages'+(p.id?'/'+encodeURIComponent(p.id):''),p.id?'PUT':'POST',body).then(function(){return ca('/boot');}).then(function(d){PKGS=d.packages||[];STATS=d.stats||{};render();}).catch(function(e){alert(e.message);});};}
function bindPackages(){if(byId('newPkg'))byId('newPkg').onclick=function(){editPackage({});};Array.prototype.forEach.call(document.querySelectorAll('.editPkg'),function(b){b.onclick=function(){var id=b.getAttribute('data-id');var p=PKGS.find(function(x){return x.id===id;})||{};editPackage(p);};});}
function viewStudents(){return '<h1>الطلاب وإسناد الباقات</h1><div class="muted">اكتب البريد واختر الباقة. إذا الطالب موجود نفتحها فورًا، وإذا جديد اكتب اسمه فيتم إنشاء حساب وفتحها.</div><div class="card" style="margin-top:15px"><div class="row"><label class="f"><span>البريد الإلكتروني *</span><input id="stEmail" type="email"></label><label class="f"><span>الاسم — للطالب الجديد فقط</span><input id="stName"></label></div><div class="row"><label class="f"><span>الباقة</span><select id="stPkg">'+pkgOptions()+'</select></label><label class="f"><span>مدة الوصول بالأيام</span><input id="stDays" type="number" value="365"></label></div><label class="f"><span>كلمة مرور مؤقتة — اختياري</span><input id="stPass"></label><button class="btn p" id="grantBtn">فتح الباقة / إنشاء الحساب</button><div id="stMsg"></div></div><div class="card"><div class="tools"><input id="findText" placeholder="بحث بالاسم أو البريد"><button class="btn n" id="findBtn">بحث</button></div><div id="results"></div></div>';}
function bindStudents(){byId('grantBtn').onclick=function(){var email=byId('stEmail').value.trim().toLowerCase(),name=byId('stName').value.trim(),pkg=byId('stPkg').value,days=Number(byId('stDays').value)||365;if(!email||!pkg){alert('اكتب البريد واختر الباقة');return;}ca('/enroll','POST',{email:email,packageId:pkg,days:days,source:'إضافة إدارية'}).then(function(){byId('stMsg').innerHTML='<div class="notice ok">✅ الطالب موجود وتم فتح الباقة له.</div>';}).catch(function(e){if(e.status!==404){alert(e.message);return;}if(!name){byId('stMsg').innerHTML='<div class="notice bad">هذا البريد غير مسجل. اكتب اسم الطالب ثم اضغط الزر مرة أخرى.</div>';return;}pa('/students','POST',{name:name,email:email,password:byId('stPass').value.trim(),packages:[{id:pkg,days:days}]}).then(function(d){byId('stMsg').innerHTML='<div class="notice ok">✅ تم إنشاء الحساب وفتح الباقة.<br>البريد: <b>'+esc(email)+'</b>'+(d.password?'<br>كلمة المرور المؤقتة: <b>'+esc(d.password)+'</b>':'')+'</div>';}).catch(function(x){alert(x.message);});});};byId('findBtn').onclick=function(){ca('/students?q='+encodeURIComponent(byId('findText').value)).then(function(a){byId('results').innerHTML=a.length?'<div class="tbl"><table><thead><tr><th>الاسم</th><th>البريد</th><th>الباقات</th></tr></thead><tbody>'+a.map(function(u){return '<tr><td>'+esc(u.name)+'</td><td>'+esc(u.email)+'</td><td>'+((u.enrollments||[]).map(function(e){return esc(e.package_id);}).join('، ')||'—')+'</td></tr>';}).join('')+'</tbody></table></div>':'لا توجد نتائج';}).catch(function(e){alert(e.message);});};}
function viewQuestions(){return '<h1>بنك الأسئلة</h1><div class="muted">اختر الباقة ثم حمّل الأسئلة. بعد استيراد بنك PMP سيظهر هنا.</div><div class="card" style="margin-top:15px"><div class="tools"><select id="qPkg">'+pkgOptions()+'</select><button class="btn n" id="loadQ">تحميل</button><input id="qSearch" placeholder="بحث"></div><div id="qInfo"></div><div id="qTable"></div></div>';}
function drawQuestions(){var s=(byId('qSearch').value||'').toLowerCase();var a=QUESTIONS.filter(function(q){return !s||JSON.stringify(q).toLowerCase().indexOf(s)>=0;});var part=a.slice(0,200);byId('qInfo').innerHTML='<div class="notice">'+a.length+' سؤال'+(a.length>200?' — معروض أول 200 فقط':'')+'</div>';byId('qTable').innerHTML=part.length?'<div class="tbl"><table><thead><tr><th>#</th><th>السؤال</th><th>Domain</th><th>النوع</th><th>الإجابة</th><th></th></tr></thead><tbody>'+part.map(function(q,i){return '<tr><td>'+(i+1)+'</td><td style="min-width:420px">'+esc(q.question_ar||q.question_en)+'</td><td>'+esc(q.domain||'')+'</td><td>'+esc(q.type||'')+'</td><td>'+esc(q.correct||'')+'</td><td><button class="btn editQ" data-id="'+esc(q.id)+'">تعديل</button></td></tr>';}).join('')+'</tbody></table></div>':'<div class="notice bad">لا توجد أسئلة في هذه الباقة.</div>';Array.prototype.forEach.call(document.querySelectorAll('.editQ'),function(b){b.onclick=function(){var q=QUESTIONS.find(function(x){return x.id===b.getAttribute('data-id');});editQuestion(q);};});}
function bindQuestions(){byId('loadQ').onclick=function(){ca('/questions/'+encodeURIComponent(byId('qPkg').value)).then(function(a){QUESTIONS=a||[];drawQuestions();}).catch(function(e){alert(e.message);});};byId('qSearch').oninput=function(){if(QUESTIONS.length)drawQuestions();};}
function editQuestion(q){if(!q)return;var text=prompt('نص السؤال:',q.question_ar||q.question_en||'');if(text===null)return;var correct=prompt('الإجابة الصحيحة (مثال A أو A,C):',q.correct||'');if(correct===null)return;var exp=prompt('التفسير:',q.explanation_ar||'');if(exp===null)return;ca('/questions/'+encodeURIComponent(q.id),'PUT',{package_id:q.package_id,domain:q.domain||'',topic:q.topic||'',difficulty:q.difficulty||'medium',type:q.type||'single',question_ar:text,question_en:q.question_en||'',options:Array.isArray(q.options)?q.options:[],correct:correct,explanation_ar:exp,explanation_en:q.explanation_en||'',reference:q.reference||'',active:true}).then(function(){alert('تم حفظ السؤال');return ca('/questions/'+encodeURIComponent(q.package_id));}).then(function(a){QUESTIONS=a||[];drawQuestions();}).catch(function(e){alert(e.message);});}
function viewLessons(){return '<h1>الدروس والفيديو</h1><div class="muted">اربط كل درس بفيديو Vimeo ثم احفظ.</div><div class="card" style="margin-top:15px"><div class="tools"><select id="lPkg">'+pkgOptions()+'</select><button class="btn n" id="loadL">تحميل</button><button class="btn p" id="addL">＋ درس</button><button class="btn" id="saveL">حفظ</button></div><div id="lTable"></div></div>';}
function bindLessons(){var L=[];function draw(){byId('lTable').innerHTML='<div class="tbl"><table><thead><tr><th>#</th><th>الفصل</th><th>العنوان</th><th>المدة</th><th>Vimeo</th><th>مجاني</th></tr></thead><tbody>'+L.map(function(x,i){return '<tr><td>'+(i+1)+'</td><td><input class="lc" type="number" value="'+Number(x.chapter||0)+'"></td><td><input class="lt" value="'+esc(x.title||'')+'"></td><td><input class="ld" value="'+esc(x.duration||'')+'"></td><td><input class="lv" value="'+esc(x.vimeo||'')+'"></td><td><input class="lf" type="checkbox" style="width:auto" '+(x.free?'checked':'')+'></td></tr>';}).join('')+'</tbody></table></div>';}function harvest(){Array.prototype.forEach.call(document.querySelectorAll('#lTable tbody tr'),function(r,i){L[i]={chapter:Number(r.querySelector('.lc').value)||0,title:r.querySelector('.lt').value,duration:r.querySelector('.ld').value,vimeo:r.querySelector('.lv').value,free:r.querySelector('.lf').checked};});}byId('loadL').onclick=function(){pa('/lessons/'+encodeURIComponent(byId('lPkg').value)).then(function(a){L=a||[];draw();}).catch(function(e){alert(e.message);});};byId('addL').onclick=function(){if(document.querySelector('#lTable tbody'))harvest();L.push({chapter:0,title:'',duration:'',vimeo:'',free:false});draw();};byId('saveL').onclick=function(){harvest();pa('/lessons/'+encodeURIComponent(byId('lPkg').value),'PUT',L).then(function(){alert('تم حفظ الدروس');}).catch(function(e){alert(e.message);});};}
boot();
})();
</script>
</body>
</html>
