<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>إدارة المحتوى — السعيد</title><style>
:root{--n:#0e2444;--o:#f0741a;--bg:#f6f8fb;--l:#dce4ef;--d:#64748b;--bad:#b42336;--ok:#087443}*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial;background:var(--bg);color:#1d2c42}button,input,select,textarea{font:inherit}.app{display:grid;grid-template-columns:245px 1fr;min-height:100vh}.side{background:var(--n);color:#fff;padding:20px 12px}.side h2{font-size:18px;margin:5px 10px 18px}.nav button{display:block;width:100%;padding:12px;border:0;border-radius:10px;background:transparent;color:#dce7f5;text-align:right;margin:3px 0;cursor:pointer}.nav button.on,.nav button:hover{background:var(--o);color:#fff}.main{padding:26px}.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:18px}.top h1{margin:0;flex:1;color:var(--n)}.top p{width:100%;margin:0;color:var(--d)}.card{background:#fff;border:1px solid var(--l);border-radius:14px;padding:16px;margin-bottom:14px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}.btn{border:1px solid var(--l);background:#fff;border-radius:9px;padding:9px 13px;font-weight:700;cursor:pointer}.btn.p{background:var(--o);color:#fff;border-color:var(--o)}.btn.n{background:var(--n);color:#fff}.btn.d{color:var(--bad);background:#fff1f3}.btn.sm{padding:5px 8px;font-size:12px}.f{display:block;margin-bottom:10px}.f span{display:block;font-size:12px;font-weight:bold;margin-bottom:4px}input,select,textarea{width:100%;padding:9px;border:1px solid #cbd5e1;border-radius:8px;background:#fff}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.tools{display:flex;gap:7px;flex-wrap:wrap;align-items:end;margin-bottom:10px}.tools .f{min-width:150px;flex:1;max-width:280px;margin:0}.tbl{overflow:auto;border:1px solid var(--l);border-radius:11px}table{width:100%;border-collapse:collapse;font-size:12px}th{background:var(--n);color:#fff;padding:9px;text-align:right;white-space:nowrap}td{padding:9px;border-bottom:1px solid var(--l);vertical-align:top}.chip{display:inline-block;padding:3px 7px;border-radius:999px;background:#fff1e7;color:#a74c0c;font-size:11px;margin:2px}.chip.ok{background:#e9f8f0;color:var(--ok)}.chip.bad{background:#fff0f2;color:var(--bad)}.muted{color:var(--d);font-size:12px}.en{direction:ltr;text-align:left}.ar{direction:rtl}.modal{position:fixed;inset:0;background:#0e2444cc;display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}.box{background:#fff;width:min(920px,100%);max-height:94vh;overflow:auto;border-radius:16px;padding:20px}.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.section{font-weight:bold;color:var(--n);margin:14px 0 8px;border-bottom:1px solid var(--l);padding-bottom:5px}.pager{text-align:center;margin-top:10px}.err{max-width:600px;margin:70px auto;background:#fff;border:1px solid var(--l);padding:25px;border-radius:14px;text-align:center}@media(max-width:850px){.app{grid-template-columns:1fr}.side{height:auto}.nav{display:flex;overflow:auto}.nav button{min-width:max-content}.main{padding:15px}.row,.row3{grid-template-columns:1fr}}
</style></head><body><div id="root"><div style="max-width:720px;margin:70px auto;background:#fff;border:1px solid #dce4ef;border-radius:16px;padding:28px;text-align:center"><h2 style="color:#0e2444;margin:0 0 10px">إدارة الباقات والمحتوى</h2><p style="color:#64748b">جارٍ تحميل لوحة الإدارة — الإصدار 2.2…</p></div></div><script>
window.addEventListener('error',function(e){var r=document.getElementById('root');if(r)r.innerHTML='<div class="err"><h2>تعذر تشغيل لوحة الإدارة</h2><p style="direction:ltr;text-align:left">'+String(e.message||'JavaScript error').replace(/</g,'&lt;')+'</p><p>أرسل صورة هذه الرسالة فقط.</p></div>';});
window.addEventListener('unhandledrejection',function(e){var r=document.getElementById('root');if(r&&r.innerText.indexOf('جارٍ تحميل')>=0)r.innerHTML='<div class="err"><h2>تعذر تحميل بيانات الإدارة</h2><p>'+String((e.reason&&e.reason.message)||e.reason||'Unknown error').replace(/</g,'&lt;')+'</p><p>أرسل صورة هذه الرسالة فقط.</p></div>';});
(()=>{'use strict';const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],E=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');const ROOT='/'+location.pathname.split('/').filter(Boolean)[0];let T='';try{T=localStorage.getItem('as_panel_tok')||''}catch(e){}let tab='packages',P=[],Q=[],cur='',page=1,search='',dom='all',lang='all';
async function R(url,o={}){const r=await fetch(url,{method:o.method||'GET',headers:{'Content-Type':'application/json','Authorization':'Bearer '+T},body:o.body?JSON.stringify(o.body):undefined}),d=await r.json().catch(()=>({}));if(!r.ok){const e=new Error(d.error||'خطأ '+r.status);e.status=r.status;throw e}return d}const C=(p,o)=>R(ROOT+'/api/content-admin'+p,o),A=(p,o)=>R(ROOT+'/api'+p,o),B=(p,o)=>R('/api/admin-question-bank'+p,o);function modal(h,f){const m=document.createElement('div');m.className='modal';m.innerHTML='<div class="box">'+h+'</div>';document.body.appendChild(m);m.onclick=e=>{if(e.target===m)m.remove()};m.querySelectorAll('[data-x]').forEach(x=>x.onclick=()=>m.remove());f&&f(m)}function toast(x){alert(x)}function sel(id){return '<select id="'+id+'">'+P.map(p=>'<option value="'+E(p.id)+'" '+(p.id===cur?'selected':'')+'>'+E(p.ar||p.en||p.id)+'</option>').join('')+'</select>'}function shell(b){return '<div class="app"><aside class="side"><h2>إدارة الباقات والمحتوى</h2><div class="nav"><button data-t="packages">📦 الباقات</button><button data-t="questions">❓ بنك الأسئلة</button><button data-t="students">👥 الطلاب والباقات</button><button data-t="lessons">🎬 الدروس والفيديو</button></div><button class="btn" id="back" style="width:100%;margin-top:18px">← لوحة المشرف</button></aside><main class="main">'+b+'</main></div>'}function top(h,p,a=''){return '<div class="top"><h1>'+h+'</h1>'+a+'<p>'+p+'</p></div>'}function bindNav(){$$('[data-t]').forEach(b=>{b.classList.toggle('on',b.dataset.t===tab);b.onclick=()=>{tab=b.dataset.t;draw()}});$('#back').onclick=()=>location.href=ROOT}
async function boot(){if(!T){fail('سجل الدخول أولًا من لوحة المشرف.');return}try{P=await R('/api/admin-package-summary');if(!cur&&P.length)cur=P[0].id;draw()}catch(e){fail(e.status===401?'جلسة المشرف منتهية — سجل الدخول من جديد.':e.message)}}function fail(x){$('#root').innerHTML='<div class="err"><h2>تعذر فتح الإدارة</h2><p>'+E(x)+'</p><button class="btn n" onclick="location.href=\''+ROOT+'\'">العودة</button></div>'}function draw(){let h=tab==='packages'?packages():tab==='questions'?questions():tab==='students'?students():lessons();$('#root').innerHTML=shell(h);bindNav();tab==='packages'?bindP():tab==='questions'?bindQ():tab==='students'?bindS():bindL()}
function packages(){return top('الباقات','كل الباقات المسجلة تظهر هنا مع عدد الأسئلة والدروس والاختبارات والموارد.','<button class="btn p" id="newP">＋ باقة جديدة</button>')+'<div class="grid">'+P.map(p=>'<div class="card"><h3>'+E(p.ar||p.id)+'</h3><div class="muted en">'+E(p.code||p.id)+' · '+E(p.en||'')+'</div><p>'+E(p.desc||'')+'</p><span class="chip">'+Number(p.price||0)+' '+E(p.currency||'USD')+'</span><span class="chip">'+Number(p.days||90)+' يوم</span><div><span class="chip">❓ '+(p.counts?.questions||0)+'</span><span class="chip">🎬 '+(p.counts?.lessons||0)+'</span><span class="chip">📝 '+(p.counts?.exams||0)+'</span><span class="chip">📚 '+(p.counts?.resources||0)+'</span></div><div class="acts"><button class="btn sm editP" data-id="'+E(p.id)+'">تعديل</button></div></div>').join('')+'</div>'}
function pform(p={}){return '<h2>'+(p.id?'تعديل الباقة':'باقة جديدة')+'</h2><div class="row"><label class="f"><span>ID</span><input id="pi" value="'+E(p.id||'')+'" '+(p.id?'disabled':'')+'></label><label class="f"><span>الكود</span><input id="pc" value="'+E(p.code||'')+'"></label></div><div class="row"><label class="f"><span>الاسم العربي</span><input id="pa" value="'+E(p.ar||'')+'"></label><label class="f"><span>English</span><input id="pe" class="en" value="'+E(p.en||'')+'"></label></div><label class="f"><span>الوصف</span><textarea id="pd">'+E(p.desc||'')+'</textarea></label><div class="row3"><label class="f"><span>السعر</span><input id="pp" type="number" value="'+Number(p.price||0)+'"></label><label class="f"><span>العملة</span><select id="pu">'+['USD','EGP','SAR','AED'].map(x=>'<option '+(x===(p.currency||'USD')?'selected':'')+'>'+x+'</option>').join('')+'</select></label><label class="f"><span>الأيام</span><input id="py" type="number" value="'+Number(p.days||90)+'"></label></div><label class="f"><span>الساعات</span><input id="ph" type="number" value="'+Number(p.hours||0)+'"></label><label><input id="pac" type="checkbox" style="width:auto" '+(p.active===false?'':'checked')+'> منشورة</label><div class="acts"><button class="btn p" id="ps">حفظ</button><button class="btn" data-x>إلغاء</button></div>'}
function bindP(){$('#newP').onclick=()=>openP({});$$('.editP').forEach(b=>b.onclick=()=>openP(P.find(x=>x.id===b.dataset.id)||{}))}function openP(p){modal(pform(p),m=>{$('#ps').onclick=async()=>{try{await C('/packages'+(p.id?'/'+encodeURIComponent(p.id):''),{method:p.id?'PUT':'POST',body:{id:$('#pi').value.trim(),code:$('#pc').value.trim(),ar:$('#pa').value.trim(),en:$('#pe').value.trim(),desc:$('#pd').value.trim(),price:+$('#pp').value||0,currency:$('#pu').value,days:+$('#py').value||90,hours:+$('#ph').value||0,active:$('#pac').checked}});m.remove();P=await R('/api/admin-package-summary');draw()}catch(e){alert(e.message)}}})}
function questions(){return top('بنك الأسئلة','شاهد وعدل العربية والإنجليزية والاختيارات والشرح والمرجع. الأسئلة غير المترجمة تظهر بوضوح.','<button class="btn p" id="newQ">＋ سؤال</button> <button class="btn" id="imp">📥 استيراد PMP</button>')+'<div class="card"><div class="tools"><label class="f"><span>الباقة</span>'+sel('qp')+'</label><label class="f"><span>بحث</span><input id="qs"></label><label class="f"><span>Domain</span><select id="qd"><option value="all">الكل</option><option value="people">People</option><option value="process">Process</option><option value="business">Business</option></select></label><label class="f"><span>اللغة</span><select id="ql"><option value="all">الكل</option><option value="ar">ثنائي اللغة</option><option value="need">يحتاج عربي</option></select></label><button class="btn n" id="load">تحميل</button></div><div id="qi" class="muted"></div><div id="qt" class="tbl"></div><div id="pg" class="pager"></div></div>'}
function filtered(){const s=search.toLowerCase();return Q.filter(q=>(!s||JSON.stringify([q.question_ar,q.question_en,q.explanation_ar,q.explanation_en,q.reference]).toLowerCase().includes(s))&&(dom==='all'||q.domain===dom)&&(lang==='all'||(lang==='ar'&&String(q.question_ar||'').trim())||(lang==='need'&&!String(q.question_ar||'').trim())))}function table(){const a=filtered(),n=35,pages=Math.max(1,Math.ceil(a.length/n));page=Math.min(Math.max(1,page),pages);const z=a.slice((page-1)*n,page*n),need=a.filter(q=>!String(q.question_ar||'').trim()).length;$('#qi').innerHTML='<b>'+a.length+'</b> سؤال · <b style="color:var(--bad)">'+need+'</b> يحتاج ترجمة عربية';$('#qt').innerHTML=z.length?'<table><thead><tr><th>#</th><th>السؤال AR / EN</th><th>Domain</th><th>Approach</th><th>اللغة</th><th>الإجابة</th><th></th></tr></thead><tbody>'+z.map((q,i)=>{const ar=String(q.question_ar||'').trim();return '<tr><td>'+((page-1)*n+i+1)+'</td><td style="min-width:400px">'+(ar?'<div class="ar"><b>AR:</b> '+E(ar)+'</div>':'<div style="color:var(--bad)"><b>يحتاج ترجمة عربية</b></div>')+'<div class="en" style="margin-top:5px"><b>EN:</b> '+E(q.question_en||'')+'</div></td><td>'+E(q.domain||'')+'</td><td>'+E(q.approach||'')+'</td><td><span class="chip '+(ar?'ok':'bad')+'">'+(ar?'AR+EN':'EN فقط')+'</span></td><td class="en">'+E(q.correct||'')+'</td><td><button class="btn sm editQ" data-id="'+E(q.id)+'">تعديل</button> <button class="btn sm d delQ" data-id="'+E(q.id)+'">حذف</button></td></tr>'}).join('')+'</tbody></table>':'<div style="padding:20px">لا توجد أسئلة.</div>';$('#pg').innerHTML='<button class="btn" id="pr">السابق</button> '+page+'/'+pages+' <button class="btn" id="nx">التالي</button>';$('#pr').disabled=page<=1;$('#nx').disabled=page>=pages;$('#pr').onclick=()=>{page--;table()};$('#nx').onclick=()=>{page++;table()};$$('.editQ').forEach(b=>b.onclick=()=>openQ(Q.find(x=>x.id===b.dataset.id)));$$('.delQ').forEach(b=>b.onclick=async()=>{if(confirm('حذف السؤال؟')){await B('/'+encodeURIComponent(b.dataset.id),{method:'DELETE'});Q=Q.filter(x=>x.id!==b.dataset.id);table()}})}
function bindQ(){$('#load').onclick=async()=>{cur=$('#qp').value;Q=await B('/'+encodeURIComponent(cur));page=1;table()};$('#qs').oninput=e=>{search=e.target.value;page=1;if(Q.length)table()};$('#qd').onchange=e=>{dom=e.target.value;page=1;if(Q.length)table()};$('#ql').onchange=e=>{lang=e.target.value;page=1;if(Q.length)table()};$('#newQ').onclick=()=>openQ({package_id:$('#qp').value,domain:'process',type:'single',options_en:['','','',''],options_ar:['','','',''],active:true});$('#imp').onclick=()=>window.open('/pmp-import.html','_blank')}
function opts(c,a,dir){a=Array.isArray(a)?a.slice():[];while(a.length<4)a.push('');return a.slice(0,4).map((x,i)=>'<label class="f"><span>'+c+' '+String.fromCharCode(65+i)+'</span><input class="'+c+' '+dir+'" value="'+E(x)+'"></label>').join('')}
function openQ(q={}){const oe=q.options_en||q.options||[],oa=q.options_ar||[];modal('<h2>'+(q.id?'تعديل السؤال':'سؤال جديد')+'</h2><div class="row3"><label class="f"><span>Domain</span><select id="dm">'+['people','process','business'].map(x=>'<option '+(q.domain===x?'selected':'')+'>'+x+'</option>').join('')+'</select></label><label class="f"><span>Approach</span><input id="ap" value="'+E(q.approach||'')+'"></label><label class="f"><span>Type</span><select id="ty">'+['single','multiple','scenario','matching','drag_drop','ordering','hotspot','fill_blank'].map(x=>'<option '+(q.type===x?'selected':'')+'>'+x+'</option>').join('')+'</select></label></div><label class="f"><span>السؤال بالعربية</span><textarea id="qar" class="ar" rows="4">'+E(q.question_ar||'')+'</textarea></label><label class="f"><span>Question in English</span><textarea id="qen" class="en" rows="4">'+E(q.question_en||'')+'</textarea></label><div class="section">الاختيارات</div><div class="row"><div>'+opts('OA',oa,'ar')+'</div><div>'+opts('OE',oe,'en')+'</div></div><div class="row"><label class="f"><span>الإجابة الصحيحة A أو A,C</span><input id="co" class="en" value="'+E(q.correct||'A')+'"></label><label class="f"><span>المرجع</span><input id="rf" value="'+E(q.reference||'')+'"></label></div><label class="f"><span>التفسير بالعربية</span><textarea id="ear" class="ar" rows="3">'+E(q.explanation_ar||'')+'</textarea></label><label class="f"><span>Explanation in English</span><textarea id="een" class="en" rows="3">'+E(q.explanation_en||'')+'</textarea></label><div class="acts"><button class="btn p" id="saveQ">حفظ</button><button class="btn" data-x>إلغاء</button></div>',m=>{$('#saveQ').onclick=async()=>{const body={package_id:q.package_id||cur,domain:$('#dm').value,approach:$('#ap').value,type:$('#ty').value,question_ar:$('#qar').value.trim(),question_en:$('#qen').value.trim(),options_ar:$$('.OA').map(x=>x.value),options_en:$$('.OE').map(x=>x.value),correct:$('#co').value.trim().toUpperCase(),explanation_ar:$('#ear').value.trim(),explanation_en:$('#een').value.trim(),reference:$('#rf').value.trim(),active:true};try{await B(q.id?'/'+encodeURIComponent(q.id):'',{method:q.id?'PUT':'POST',body});m.remove();Q=await B('/'+encodeURIComponent(body.package_id));table();P=await R('/api/admin-package-summary')}catch(e){alert(e.message)}}})}
function students(){return top('الطلاب وإسناد الباقات','اكتب البريد واختر الباقة. لو الطالب موجود تُفتح له فورًا؛ لو جديد اكتب الاسم لإنشاء الحساب.')+'<div class="card"><div class="row"><label class="f"><span>البريد</span><input id="em" class="en"></label><label class="f"><span>الاسم للطالب الجديد</span><input id="nm"></label></div><div class="row"><label class="f"><span>الباقة</span>'+sel('sp')+'</label><label class="f"><span>مدة الوصول</span><input id="dy" type="number" value="365"></label></div><div class="acts"><button class="btn p" id="grant">فتح الباقة / إنشاء الطالب</button><button class="btn d" id="revoke">سحب الباقة</button></div><div id="sm"></div></div>'}function bindS(){$('#grant').onclick=async()=>{const email=$('#em').value.trim().toLowerCase(),pkg=$('#sp').value,days=+$('#dy').value||365;if(!email)return alert('اكتب البريد');try{await C('/enroll',{method:'POST',body:{email,packageId:pkg,days,source:'إضافة إدارية'}});$('#sm').innerHTML='<p style="color:var(--ok)">تم فتح الباقة.</p>'}catch(e){if(e.status!==404)return alert(e.message);const name=$('#nm').value.trim();if(!name)return alert('الحساب غير موجود؛ اكتب الاسم ثم اضغط مرة أخرى');const d=await A('/students',{method:'POST',body:{name,email,packages:[{id:pkg,days}]}});$('#sm').innerHTML='<p style="color:var(--ok)">تم إنشاء الحساب وفتح الباقة. كلمة المرور: <b>'+E(d.password||'')+'</b></p>'}};$('#revoke').onclick=async()=>{if(confirm('سحب الباقة؟'))await C('/enroll',{method:'DELETE',body:{email:$('#em').value.trim(),packageId:$('#sp').value}})}}
function lessons(){return top('الدروس والفيديو','إدارة الدروس الحالية موجودة هنا، ويمكنك أيضًا الرجوع للوحة المشرف القديمة للفيديوهات.')+'<div class="card"><div class="tools"><label class="f"><span>الباقة</span>'+sel('lp')+'</label><button class="btn n" id="ll">تحميل</button><button class="btn p" id="la">＋ درس</button><button class="btn" id="ls">حفظ</button></div><div id="lt" class="tbl"></div></div>'}function bindL(){let L=[];const d=()=>{$('#lt').innerHTML='<table><tr><th>#</th><th>الفصل</th><th>العنوان</th><th>المدة</th><th>Vimeo</th></tr>'+L.map((x,i)=>'<tr><td>'+i+'</td><td><input class="lc" value="'+(x.chapter||0)+'"></td><td><input class="ln" value="'+E(x.title||'')+'"></td><td><input class="ld" value="'+E(x.duration||'')+'"></td><td><input class="lv en" value="'+E(x.vimeo||'')+'"></td></tr>').join('')+'</table>'};const h=()=>{$$('#lt tr').slice(1).forEach((r,i)=>L[i]={chapter:+r.querySelector('.lc').value||0,title:r.querySelector('.ln').value,duration:r.querySelector('.ld').value,vimeo:r.querySelector('.lv').value,free:false})};$('#ll').onclick=async()=>{cur=$('#lp').value;L=await A('/lessons/'+encodeURIComponent(cur));d()};$('#la').onclick=()=>{if($('#lt tr'))h();L.push({});d()};$('#ls').onclick=async()=>{h();await A('/lessons/'+encodeURIComponent($('#lp').value),{method:'PUT',body:L});alert('تم الحفظ')}}boot()})();
</script></body></html>
