<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>إدارة المحتوى والباقات — السعيد</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--n:#0E2444;--n2:#173763;--o:#F0741A;--o2:#FBA43C;--os:#FFF1E3;--bg:#F6F8FB;--w:#fff;--l:#E3E8F0;--l2:#CDD6E4;--t:#1C2B42;--d:#5B6B85;--ok:#0E7C4A;--oks:#E6F6EE;--bad:#C02434;--bads:#FDECEE;--warn:#B45309;--warns:#FDF4E5;--fd:'Tajawal',sans-serif;--fb:'IBM Plex Sans Arabic',sans-serif;--fm:'IBM Plex Mono',monospace}
*{box-sizing:border-box}body{margin:0;font-family:var(--fb);background:var(--bg);color:var(--t);line-height:1.65}button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}.shell{display:grid;grid-template-columns:245px 1fr;min-height:100vh}.side{background:var(--n);color:#C6D2E4;padding:20px 12px;position:sticky;top:0;height:100vh;overflow:auto}.brand{display:flex;gap:11px;align-items:center;padding:0 8px 18px;border-bottom:1px solid #ffffff1c;margin-bottom:14px}.brand img{width:42px}.brand b{color:#fff;font:800 1.05rem var(--fd)}.brand small{display:block;color:#91A5C2}.nav button,.back{display:flex;width:100%;align-items:center;gap:10px;border:0;background:none;color:#C6D2E4;padding:11px 13px;border-radius:11px;margin:3px 0;text-align:start}.nav button:hover,.back:hover{background:#ffffff12;color:#fff}.nav button.on{background:var(--o);color:#fff;font-weight:700}.back{border:1px solid #ffffff20;margin-top:20px}.main{padding:28px 32px 70px;min-width:0}.top{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:22px}.top h1{font:800 1.65rem var(--fd);color:var(--n);margin:0;flex:1}.top p{width:100%;margin:0;color:var(--d);font-size:.9rem}.btn{border:1.5px solid transparent;border-radius:11px;padding:10px 18px;font-weight:700;background:#fff}.btn.p{background:var(--o);color:#fff}.btn.n{background:var(--n);color:#fff}.btn.o{border-color:var(--l2)}.btn.d{background:var(--bads);color:var(--bad);border-color:#f5c2c8}.btn.sm{padding:6px 11px;font-size:.8rem}.grid{display:grid;gap:16px}.g4{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}.card{background:#fff;border:1px solid var(--l);border-radius:17px;padding:20px}.stat b{display:block;color:var(--n);font:600 1.7rem var(--fm)}.stat span{color:var(--d);font-size:.8rem}.tools{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-bottom:16px}.tools select,.tools input{min-width:180px;max-width:340px}.field{display:block;margin-bottom:13px}.field>span{display:block;font-weight:600;font-size:.84rem;margin-bottom:5px}.field small{color:var(--d);font-weight:400}input,select,textarea{width:100%;border:1.5px solid var(--l2);border-radius:10px;background:#fff;padding:10px 12px}textarea{resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.tbl{overflow:auto;background:#fff;border:1px solid var(--l);border-radius:14px}table{width:100%;border-collapse:collapse;font-size:.83rem}th{background:var(--n);color:#fff;padding:11px;text-align:start;white-space:nowrap}td{padding:10px 11px;border-bottom:1px solid var(--l);vertical-align:top}tbody tr:hover{background:var(--os)}.chip{display:inline-flex;border-radius:8px;padding:3px 9px;font-size:.72rem;font-weight:700}.chip.ok{background:var(--oks);color:var(--ok)}.chip.no{background:var(--bads);color:var(--bad)}.chip.info{background:var(--os);color:var(--o)}.note{padding:13px 16px;border-radius:12px;background:var(--os);border:1px solid #f4d4b5;color:#7e410c;margin-bottom:16px;font-size:.85rem}.empty{text-align:center;padding:45px 20px;color:var(--d)}.ov{position:fixed;inset:0;background:#0e2444bd;backdrop-filter:blur(4px);z-index:99;display:flex;align-items:center;justify-content:center;padding:22px}.mdl{width:min(760px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:22px;padding:27px}.mdl h3{margin:0 0 5px;font:800 1.25rem var(--fd);color:var(--n)}.mdl>p{margin:0 0 18px;color:var(--d);font-size:.86rem}.act{display:flex;gap:9px;flex-wrap:wrap;margin-top:18px}.toast{position:fixed;bottom:24px;left:24px;background:var(--n);color:#fff;padding:13px 19px;border-radius:12px;z-index:120;box-shadow:0 12px 35px #0003}.pkg{display:flex;gap:14px;align-items:flex-start}.pkg-img{width:86px;height:70px;border-radius:12px;background:linear-gradient(135deg,var(--n),var(--n2));display:flex;align-items:center;justify-content:center;color:var(--o2);font-weight:800;overflow:hidden;flex:none}.pkg-img img{width:100%;height:100%;object-fit:cover}.pkg h3{margin:0;color:var(--n);font:800 1rem var(--fd)}.pkg p{margin:4px 0;color:var(--d);font-size:.8rem}.pkg .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}.pkg-act{margin-inline-start:auto;display:flex;gap:6px;flex-wrap:wrap}.qtext{max-width:420px}.en{direction:ltr;unicode-bidi:isolate;display:inline-block}.mono{font-family:var(--fm)}.checks{display:flex;gap:12px;flex-wrap:wrap}.checks label{display:flex;gap:6px;align-items:center}.checks input{width:auto}.section-title{font:800 1.1rem var(--fd);color:var(--n);margin:20px 0 12px}.split{display:grid;grid-template-columns:320px 1fr;gap:16px}.list{background:#fff;border:1px solid var(--l);border-radius:14px;padding:10px;max-height:520px;overflow:auto}.list button{width:100%;text-align:start;border:0;background:#fff;padding:10px;border-radius:9px;margin:2px 0}.list button:hover,.list button.on{background:var(--os);color:var(--o)}
@media(max-width:900px){.shell{grid-template-columns:1fr}.side{height:auto;position:static}.nav{display:flex;overflow:auto}.nav button{min-width:max-content}.main{padding:20px 15px}.split{grid-template-columns:1fr}.row,.row3{grid-template-columns:1fr}}
</style></head><body><div id="root"></div>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];const esc=s=>(s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const ROOT='/' + location.pathname.split('/').filter(Boolean)[0];let TOK=localStorage.getItem('as_panel_tok')||'';let TAB='packages',PKGS=[],STATS={},CUR='';
async function api(p,o={}){const r=await fetch(ROOT+'/api'+p,{method:o.method||'GET',headers:{'Content-Type':'application/json','Authorization':'Bearer '+TOK},body:o.body?JSON.stringify(o.body):undefined});const d=await r.json().catch(()=>({}));if(r.status===401){location.href=ROOT;throw new Error('انتهت الجلسة')}if(!r.ok)throw new Error(d.error||'حدث خطأ');return d}
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),3000)}function modal(h,fn){const o=document.createElement('div');o.className='ov';o.innerHTML='<div class="mdl">'+h+'</div>';document.body.appendChild(o);o.onclick=e=>{if(e.target===o)o.remove()};o.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>o.remove());fn&&fn(o)}
function shell(body){const nav=[['packages','📦','الباقات'],['lessons','🎬','الدروس والفيديو'],['questions','❓','بنك الأسئلة'],['exams','📝','الاختبارات'],['resources','📚','الموارد والملفات'],['enroll','👥','إسناد الباقات']];return `<div class="shell"><aside class="side"><div class="brand"><img src="/img/logo.png"><div><b>إدارة المحتوى</b><small>AL SAEED LMS</small></div></div><div class="nav">${nav.map(n=>`<button data-tab="${n[0]}" class="${TAB===n[0]?'on':''}"><span>${n[1]}</span>${n[2]}</button>`).join('')}</div><button class="back" id="back">← العودة للوحة الإدارة</button></aside><main class="main">${body}</main></div>`}
function bindNav(){$$('[data-tab]').forEach(b=>b.onclick=()=>{TAB=b.dataset.tab;render()});$('#back').onclick=()=>location.href=ROOT}
function pkgSel(){return `<select id="pkgSel">${PKGS.map(p=>`<option value="${esc(p.id)}" ${CUR===p.id?'selected':''}>${esc(p.ar||p.en||p.id)}</option>`).join('')}</select>`}
async function boot(){if(!TOK)return location.href=ROOT;const d=await api('/content-admin/boot');PKGS=d.packages||[];STATS=d.stats||{};CUR=PKGS[0]?.id||'';render()}
function top(title,sub,action=''){return `<div class="top"><h1>${title}</h1>${action}<p>${sub}</p></div>`}
function render(){let h='';if(TAB==='packages')h=packages();else if(TAB==='lessons')h=lessons();else if(TAB==='questions')h=questions();else if(TAB==='exams')h=exams();else if(TAB==='resources')h=resources();else h=enroll();$('#root').innerHTML=shell(h);bindNav();bindTab()}
function packages(){return `${top('الباقات والمنتجات','أنشئ باقة جديدة وحدد السعر والمدة والفصول وما يظهر للطالب.',`<button class="btn p" id="addPkg">＋ باقة جديدة</button>`)}<div class="grid g4"><div class="card stat"><b>${PKGS.length}</b><span>إجمالي الباقات</span></div><div class="card stat"><b>${STATS.lessons||0}</b><span>درس</span></div><div class="card stat"><b>${STATS.questions||0}</b><span>سؤال</span></div><div class="card stat"><b>${STATS.enrollments||0}</b><span>اشتراك نشط/مسجل</span></div></div><div class="section-title">الباقات الحالية</div><div class="grid g2">${PKGS.map(p=>`<div class="card pkg"><div class="pkg-img">${p.image?`<img src="${esc(p.image)}">`:'AL'}</div><div><h3>${esc(p.ar||p.id)}</h3><p><span class="en">${esc(p.code||p.id)}</span> · ${esc(p.en||'')}</p><div class="meta"><span class="chip info">${Number(p.price||0)} ${esc(p.currency||'USD')}</span><span class="chip ok">${Number(p.days||90)} يوم</span><span class="chip ${p.active===false?'no':'ok'}">${p.active===false?'موقوفة':'منشورة'}</span></div></div><div class="pkg-act"><button class="btn o sm editPkg" data-id="${esc(p.id)}">تعديل</button><button class="btn d sm delPkg" data-id="${esc(p.id)}">أرشفة</button></div></div>`).join('')||'<div class="empty card">لا توجد باقات بعد.</div>'}</div>`}
function pkgForm(p={}){const ch=(p._chapters||p.chapters||[]).join('\n');return `<h3>${p.id?'تعديل الباقة':'إنشاء باقة'}</h3><p>كل باقة هي المنتج الذي يشتريه الطالب ويحتوي على الدروس والأسئلة والاختبارات والموارد.</p><div class="row"><label class="field"><span>المعرّف ID <small>بالإنجليزية وبدون مسافات</small></span><input id="pId" value="${esc(p.id||'')}" ${p.id?'disabled':''} placeholder="pmp-gold"></label><label class="field"><span>الكود</span><input id="pCode" value="${esc(p.code||'')}" placeholder="PMP® 2026"></label></div><div class="row"><label class="field"><span>الاسم العربي</span><input id="pAr" value="${esc(p.ar||'')}"></label><label class="field"><span>English name</span><input id="pEn" dir="ltr" value="${esc(p.en||'')}"></label></div><label class="field"><span>الوصف المختصر</span><textarea id="pDesc" rows="3">${esc(p.desc||p.description||'')}</textarea></label><div class="row3"><label class="field"><span>السعر</span><input id="pPrice" type="number" step="0.01" value="${Number(p.price||0)}"></label><label class="field"><span>العملة</span><select id="pCur">${['USD','EGP','SAR','AED'].map(x=>`<option ${x===(p.currency||'USD')?'selected':''}>${x}</option>`).join('')}</select></label><label class="field"><span>مدة الوصول بالأيام</span><input id="pDays" type="number" value="${Number(p.days||90)}"></label></div><div class="row"><label class="field"><span>الساعات التدريبية</span><input id="pHours" type="number" value="${Number(p.hours||0)}"></label><label class="field"><span>رابط صورة الغلاف</span><input id="pImg" dir="ltr" value="${esc(p.image||'')}"></label></div><label class="field"><span>الفصول — فصل في كل سطر</span><textarea id="pCh" rows="7">${esc(ch)}</textarea></label><div class="checks"><label><input id="pActive" type="checkbox" ${p.active===false?'':'checked'}> منشورة ومتاحة</label><label><input id="pFeatured" type="checkbox" ${p.featured?'checked':''}> باقة مميزة</label></div><div class="act"><button class="btn p" id="savePkg">حفظ الباقة</button><button class="btn o" data-close>إلغاء</button></div>`}
function lessons(){if(!PKGS.length)return top('الدروس والفيديو','أنشئ باقة أولاً.');return `${top('الدروس والفيديو','اربط كل درس بفيديو Vimeo وحدد الفصل والمدة وإمكانية المعاينة المجانية.')}<div class="tools">${pkgSel()}<button class="btn p" id="loadLessons">تحميل</button><button class="btn o" id="addLesson">＋ درس</button><button class="btn n" id="saveLessons">حفظ الترتيب</button></div><div class="note">يمكنك لصق رابط Vimeo الكامل أو رقم الفيديو فقط. الفيديو يبقى محمياً بقيود الدومين التي ضبطناها في Vimeo.</div><div id="lessonBox" class="tbl"><div class="empty">اضغط تحميل لعرض دروس الباقة.</div></div>`}
function questions(){if(!PKGS.length)return top('بنك الأسئلة','أنشئ باقة أولاً.');return `${top('بنك الأسئلة','أضف الأسئلة مع النطاق والموضوع والصعوبة والتفسير والمرجع.',`<button class="btn p" id="addQ">＋ سؤال</button>`)}<div class="tools">${pkgSel()}<button class="btn n" id="loadQ">تحميل</button><button class="btn o" id="bulkQ">لصق دفعة من Excel</button><input id="qSearch" placeholder="بحث داخل الأسئلة"></div><div id="qBox" class="tbl"><div class="empty">اختر باقة واضغط تحميل.</div></div>`}
function exams(){if(!PKGS.length)return top('الاختبارات','أنشئ باقة أولاً.');return `${top('الاختبارات','أنشئ اختبارات فصلية أو Domain أو Mini أو محاكاة كاملة.',`<button class="btn p" id="addExam">＋ اختبار</button>`)}<div class="tools">${pkgSel()}<button class="btn n" id="loadEx">تحميل</button></div><div id="exBox" class="tbl"><div class="empty">اختر باقة واضغط تحميل.</div></div>`}
function resources(){if(!PKGS.length)return top('الموارد والملفات','أنشئ باقة أولاً.');return `${top('الموارد والملفات','أضف مراجع وملفات وقوالب وروابط وأنشطة عملية.',`<button class="btn p" id="addRes">＋ مورد</button>`)}<div class="tools">${pkgSel()}<button class="btn n" id="loadRes">تحميل</button></div><div id="resBox" class="tbl"><div class="empty">اختر باقة واضغط تحميل.</div></div>`}
function enroll(){return `${top('إسناد الباقات للمتدربين','امنح أو اسحب باقة من طالب بدون دفع، للحالات الإدارية والشركات والمنح.')}<div class="card"><div class="row"><label class="field"><span>البريد الإلكتروني للطالب</span><input id="eMail" type="email" placeholder="student@example.com"></label><label class="field"><span>الباقة</span>${pkgSel()}</label></div><div class="row"><label class="field"><span>مدة الوصول بالأيام</span><input id="eDays" type="number" value="365"></label><label class="field"><span>سبب الإسناد</span><select id="eSource"><option>إضافة إدارية</option><option>تحويل بنكي</option><option>كاش</option><option>شركة</option><option>منحة</option><option>Complimentary</option></select></label></div><div class="act"><button class="btn p" id="grant">منح الباقة</button><button class="btn d" id="revoke">سحب الباقة</button></div></div><div class="section-title">بحث عن طالب</div><div class="card"><div class="tools"><input id="studentQ" placeholder="الاسم أو البريد"><button class="btn n" id="findStudent">بحث</button></div><div id="studentBox"></div></div>`}
function bindTab(){if($('#pkgSel'))$('#pkgSel').onchange=e=>CUR=e.target.value;if(TAB==='packages'){$('#addPkg').onclick=()=>openPkg({});$$('.editPkg').forEach(b=>b.onclick=()=>openPkg(PKGS.find(p=>p.id===b.dataset.id)||{}));$$('.delPkg').forEach(b=>b.onclick=async()=>{if(!confirm('سيتم إيقاف الباقة وإخفاؤها من البيع، مع الحفاظ على اشتراكات الطلاب. متابعة؟'))return;await api('/content-admin/packages/'+b.dataset.id,{method:'DELETE'});toast('تمت أرشفة الباقة');await refresh()})}else if(TAB==='lessons')bindLessons();else if(TAB==='questions')bindQuestions();else if(TAB==='exams')bindExams();else if(TAB==='resources')bindResources();else bindEnroll()}
function openPkg(p){modal(pkgForm(p),o=>{$('#savePkg').onclick=async()=>{const body={id:$('#pId').value.trim(),code:$('#pCode').value.trim(),ar:$('#pAr').value.trim(),en:$('#pEn').value.trim(),desc:$('#pDesc').value.trim(),price:+$('#pPrice').value||0,currency:$('#pCur').value,days:+$('#pDays').value||90,hours:+$('#pHours').value||0,image:$('#pImg').value.trim(),_chapters:$('#pCh').value.split('\n').map(x=>x.trim()).filter(Boolean),active:$('#pActive').checked,featured:$('#pFeatured').checked};await api('/content-admin/packages'+(p.id?'/'+encodeURIComponent(p.id):''),{method:p.id?'PUT':'POST',body});o.remove();toast('تم حفظ الباقة');await refresh()}})}
async function refresh(){const d=await api('/content-admin/boot');PKGS=d.packages||[];STATS=d.stats||{};if(!PKGS.some(p=>p.id===CUR))CUR=PKGS[0]?.id||'';render()}
function bindLessons(){let L=[];const draw=()=>{$('#lessonBox').innerHTML=`<table><thead><tr><th>#</th><th>الفصل</th><th>العنوان</th><th>المدة</th><th>Vimeo</th><th>مجاني</th><th></th></tr></thead><tbody>${L.map((x,i)=>`<tr><td>${i+1}</td><td><input class="lc" type="number" value="${x.chapter||0}" style="width:70px"></td><td><input class="lt" value="${esc(x.title||'')}"></td><td><input class="ld" value="${esc(x.duration||'')}" style="width:90px"></td><td><input class="lv en" value="${esc(x.vimeo||'')}"></td><td><input class="lf" type="checkbox" ${x.free?'checked':''} style="width:auto"></td><td><button class="btn d sm lx">حذف</button></td></tr>`).join('')}</tbody></table>`;$$('.lx').forEach((b,i)=>b.onclick=()=>{L.splice(i,1);draw()})};const harvest=()=>{const rows=$$('#lessonBox tbody tr');L=rows.map(r=>({chapter:+r.querySelector('.lc').value||0,title:r.querySelector('.lt').value,duration:r.querySelector('.ld').value,vimeo:r.querySelector('.lv').value,free:r.querySelector('.lf').checked}))};$('#loadLessons').onclick=async()=>{CUR=$('#pkgSel').value;L=await api('/lessons/'+CUR);draw()};$('#addLesson').onclick=()=>{if($('#lessonBox tbody'))harvest();L.push({chapter:0,title:'',duration:'',vimeo:'',free:false});draw()};$('#saveLessons').onclick=async()=>{harvest();await api('/lessons/'+CUR,{method:'PUT',body:L});toast('تم حفظ الدروس والفيديوهات')}}
function qForm(q={}){let op=[];try{op=Array.isArray(q.options)?q.options:JSON.parse(q.options||'[]')}catch(e){};while(op.length<4)op.push('');return `<h3>${q.id?'تعديل سؤال':'إضافة سؤال'}</h3><div class="row3"><label class="field"><span>Domain / النطاق</span><input id="qDom" value="${esc(q.domain||'')}"></label><label class="field"><span>الموضوع</span><input id="qTopic" value="${esc(q.topic||'')}"></label><label class="field"><span>الصعوبة</span><select id="qDiff">${['easy','medium','hard'].map(x=>`<option ${x===(q.difficulty||'medium')?'selected':''}>${x}</option>`).join('')}</select></label></div><label class="field"><span>السؤال بالعربية</span><textarea id="qAr" rows="3">${esc(q.question_ar||'')}</textarea></label><label class="field"><span>Question in English</span><textarea id="qEn" dir="ltr" rows="2">${esc(q.question_en||'')}</textarea></label>${op.map((x,i)=>`<label class="field"><span>الخيار ${String.fromCharCode(65+i)}</span><input class="qOp" value="${esc(x)}"></label>`).join('')}<div class="row"><label class="field"><span>الإجابة الصحيحة</span><select id="qCor">${['A','B','C','D'].map(x=>`<option ${x===(q.correct||'A')?'selected':''}>${x}</option>`).join('')}</select><label class="field"><span>المرجع</span><input id="qRef" value="${esc(q.reference||'')}"></label></div><label class="field"><span>التفسير بالعربية</span><textarea id="qExp" rows="3">${esc(q.explanation_ar||'')}</textarea></label><div class="act"><button class="btn p" id="saveQ">حفظ السؤال</button><button class="btn o" data-close>إلغاء</button></div>`}
function bindQuestions(){let Q=[];const draw=()=>{$('#qBox').innerHTML=`<table><thead><tr><th>#</th><th>السؤال</th><th>النطاق</th><th>الصعوبة</th><th>الإجابة</th><th></th></tr></thead><tbody>${Q.map((q,i)=>`<tr><td>${i+1}</td><td class="qtext">${esc(q.question_ar)}</td><td>${esc(q.domain||'—')}</td><td><span class="chip info">${esc(q.difficulty)}</span></td><td><b class="en">${esc(q.correct)}</b></td><td><button class="btn o sm qe" data-i="${i}">تعديل</button> <button class="btn d sm qd" data-id="${q.id}">حذف</button></td></tr>`).join('')}</tbody></table>`;$$('.qe').forEach(b=>b.onclick=()=>openQ(Q[+b.dataset.i]));$$('.qd').forEach(b=>b.onclick=async()=>{if(confirm('حذف السؤال؟')){await api('/content-admin/questions/'+b.dataset.id,{method:'DELETE'});$('#loadQ').click()}})};const load=async()=>{CUR=$('#pkgSel').value;Q=await api('/content-admin/questions/'+CUR);draw()};$('#loadQ').onclick=load;$('#addQ').onclick=()=>openQ({package_id:$('#pkgSel').value});$('#bulkQ').onclick=()=>modal(`<h3>لصق دفعة أسئلة من Excel</h3><p>كل سطر: السؤال ثم Tab ثم A ثم B ثم C ثم D ثم الإجابة الصحيحة ثم التفسير ثم Domain ثم الصعوبة.</p><textarea id="bulkText" rows="14" dir="auto" placeholder="السؤال\tالخيار A\tالخيار B\tالخيار C\tالخيار D\tA\tالتفسير\tPeople\tmedium"></textarea><div class="act"><button class="btn p" id="bulkSave">استيراد</button><button class="btn o" data-close>إلغاء</button></div>`,o=>{$('#bulkSave').onclick=async()=>{const rows=$('#bulkText').value.split('\n').map(x=>x.trim()).filter(Boolean).map(line=>{const a=line.split('\t');return {question_ar:a[0]||'',options:a.slice(1,5),correct:(a[5]||'A').toUpperCase(),explanation_ar:a[6]||'',domain:a[7]||'',difficulty:a[8]||'medium'}});await api('/content-admin/questions/'+$('#pkgSel').value+'/bulk',{method:'POST',body:{rows}});o.remove();toast('تم استيراد '+rows.length+' سؤال');load()}});$('#qSearch').oninput=e=>{const s=e.target.value.trim().toLowerCase();$$('#qBox tbody tr').forEach((r,i)=>r.style.display=!s||JSON.stringify(Q[i]).toLowerCase().includes(s)?'':'none')};function openQ(q){modal(qForm(q),o=>{$('#saveQ').onclick=async()=>{const body={package_id:$('#pkgSel').value,domain:$('#qDom').value,topic:$('#qTopic').value,difficulty:$('#qDiff').value,type:'mcq',question_ar:$('#qAr').value,question_en:$('#qEn').value,options:$$('.qOp').map(x=>x.value),correct:$('#qCor').value,explanation_ar:$('#qExp').value,reference:$('#qRef').value,active:true};await api('/content-admin/questions'+(q.id?'/'+q.id:''),{method:q.id?'PUT':'POST',body});o.remove();toast('تم حفظ السؤال');load()}})}}
function bindExams(){let E=[];const draw=()=>{$('#exBox').innerHTML=`<table><thead><tr><th>الاختبار</th><th>النوع</th><th>المدة</th><th>عدد الأسئلة</th><th>النجاح</th><th></th></tr></thead><tbody>${E.map((x,i)=>`<tr><td>${esc(x.title)}</td><td>${esc(x.kind)}</td><td>${x.duration} دقيقة</td><td>${x.question_count}</td><td>${x.pass_score}%</td><td><button class="btn o sm ee" data-i="${i}">تعديل</button> <button class="btn d sm ed" data-id="${x.id}">حذف</button></td></tr>`).join('')}</tbody></table>`;$$('.ee').forEach(b=>b.onclick=()=>openEx(E[+b.dataset.i]));$$('.ed').forEach(b=>b.onclick=async()=>{if(confirm('حذف الاختبار؟')){await api('/content-admin/exams/'+b.dataset.id,{method:'DELETE'});load()}})};const load=async()=>{CUR=$('#pkgSel').value;E=await api('/content-admin/exams/'+CUR);draw()};$('#loadEx').onclick=load;$('#addExam').onclick=()=>openEx({});function openEx(x){modal(`<h3>${x.id?'تعديل اختبار':'اختبار جديد'}</h3><label class="field"><span>العنوان</span><input id="eTitle" value="${esc(x.title||'')}"></label><div class="row3"><label class="field"><span>النوع</span><select id="eKind">${['chapter','domain','mini','full','custom'].map(k=>`<option ${k===(x.kind||'mini')?'selected':''}>${k}</option>`).join('')}</select></label><label class="field"><span>المدة بالدقائق</span><input id="eDur" type="number" value="${x.duration||60}"></label><label class="field"><span>عدد الأسئلة</span><input id="eCount" type="number" value="${x.question_count||50}"></label></div><label class="field"><span>درجة النجاح %</span><input id="ePass" type="number" value="${x.pass_score||70}"></label><div class="act"><button class="btn p" id="eSave">حفظ</button><button class="btn o" data-close>إلغاء</button></div>`,o=>{$('#eSave').onclick=async()=>{await api('/content-admin/exams'+(x.id?'/'+x.id:''),{method:x.id?'PUT':'POST',body:{package_id:$('#pkgSel').value,title:$('#eTitle').value,kind:$('#eKind').value,duration:+$('#eDur').value,question_count:+$('#eCount').value,pass_score:+$('#ePass').value,active:true}});o.remove();toast('تم حفظ الاختبار');load()}})}}
function bindResources(){let R=[];const draw=()=>{$('#resBox').innerHTML=`<table><thead><tr><th>العنوان</th><th>النوع</th><th>الرابط</th><th>ملاحظة</th><th></th></tr></thead><tbody>${R.map((x,i)=>`<tr><td>${esc(x.title)}</td><td>${esc(x.type)}</td><td><a class="en" href="${esc(x.url)}" target="_blank">فتح</a></td><td>${esc(x.note||'')}</td><td><button class="btn o sm re" data-i="${i}">تعديل</button> <button class="btn d sm rd" data-id="${x.id}">حذف</button></td></tr>`).join('')}</tbody></table>`;$$('.re').forEach(b=>b.onclick=()=>openRes(R[+b.dataset.i]));$$('.rd').forEach(b=>b.onclick=async()=>{if(confirm('حذف المورد؟')){await api('/content-admin/resources/'+b.dataset.id,{method:'DELETE'});load()}})};const load=async()=>{CUR=$('#pkgSel').value;R=await api('/content-admin/resources/'+CUR);draw()};$('#loadRes').onclick=load;$('#addRes').onclick=()=>openRes({});function openRes(x){modal(`<h3>${x.id?'تعديل مورد':'مورد جديد'}</h3><div class="row"><label class="field"><span>العنوان</span><input id="rTitle" value="${esc(x.title||'')}"></label><label class="field"><span>النوع</span><select id="rType">${['pdf','template','link','book','activity','lab','other'].map(k=>`<option ${k===(x.type||'pdf')?'selected':''}>${k}</option>`).join('')}</select></label></div><label class="field"><span>الرابط</span><input id="rUrl" dir="ltr" value="${esc(x.url||'')}"></label><label class="field"><span>ملاحظة</span><textarea id="rNote" rows="3">${esc(x.note||'')}</textarea></label><div class="act"><button class="btn p" id="rSave">حفظ</button><button class="btn o" data-close>إلغاء</button></div>`,o=>{$('#rSave').onclick=async()=>{await api('/content-admin/resources'+(x.id?'/'+x.id:''),{method:x.id?'PUT':'POST',body:{package_id:$('#pkgSel').value,title:$('#rTitle').value,type:$('#rType').value,url:$('#rUrl').value,note:$('#rNote').value,active:true}});o.remove();toast('تم حفظ المورد');load()}})}}
function bindEnroll(){$('#grant').onclick=async()=>{await api('/content-admin/enroll',{method:'POST',body:{email:$('#eMail').value,packageId:$('#pkgSel').value,days:+$('#eDays').value,source:$('#eSource').value}});toast('تم منح الباقة للطالب')};$('#revoke').onclick=async()=>{if(!confirm('سحب الباقة من الطالب؟'))return;await api('/content-admin/enroll',{method:'DELETE',body:{email:$('#eMail').value,packageId:$('#pkgSel').value}});toast('تم سحب الباقة')};$('#findStudent').onclick=async()=>{const a=await api('/content-admin/students?q='+encodeURIComponent($('#studentQ').value));$('#studentBox').innerHTML=a.length?`<div class="tbl"><table><thead><tr><th>الاسم</th><th>البريد</th><th>الباقات</th></tr></thead><tbody>${a.map(x=>`<tr><td>${esc(x.name)}</td><td class="en">${esc(x.email)}</td><td>${(x.enrollments||[]).map(e=>`<span class="chip info">${esc(e.package_id)}</span>`).join(' ')||'—'}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">لا نتائج</div>'}}
boot().catch(e=>{document.body.innerHTML='<div style="padding:40px;font-family:sans-serif">'+esc(e.message)+'</div>'});
</script></body></html>
