<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>PMP® 2026 — محاكاة 180 سؤال | السعيد</title><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet"><style>
:root{--n:#0e2444;--n2:#173763;--o:#f0741a;--o2:#fba43c;--bg:#f5f7fb;--w:#fff;--l:#dfe5ee;--t:#1c2b42;--d:#66758d;--ok:#0e7c4a;--bad:#bd2635;--warn:#a96208;--fd:Tajawal,sans-serif;--fb:'IBM Plex Sans Arabic',sans-serif;--fm:'IBM Plex Mono',monospace}*{box-sizing:border-box}body{margin:0;font-family:var(--fb);background:var(--bg);color:var(--t)}button,input{font:inherit}.top{position:sticky;top:0;z-index:10;background:var(--n);color:#fff;padding:12px 20px;box-shadow:0 4px 16px #0002}.topin{max-width:1440px;margin:auto;display:flex;gap:14px;align-items:center;flex-wrap:wrap}.brand{font:800 1.05rem var(--fd);flex:1}.badge{background:#ffffff16;border:1px solid #ffffff2c;border-radius:10px;padding:7px 11px;font-size:.78rem}.timer{font:600 1rem var(--fm);background:var(--o);padding:8px 13px;border-radius:10px}.wrap{max-width:1440px;margin:20px auto;padding:0 18px;display:grid;grid-template-columns:270px minmax(0,1fr) 250px;gap:16px}.card{background:#fff;border:1px solid var(--l);border-radius:17px;box-shadow:0 8px 24px -18px #0e244455}.side{padding:16px;align-self:start;position:sticky;top:82px}.side h3{margin:0 0 10px;font:800 1rem var(--fd);color:var(--n)}.qmap{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;max-height:55vh;overflow:auto}.qmap button{border:1px solid var(--l);background:#fff;border-radius:7px;padding:6px 2px;font-size:.72rem;cursor:pointer}.qmap button.cur{background:var(--n);color:#fff}.qmap button.answered{border-color:#78c4a2;background:#ecf8f2}.qmap button.flagged{box-shadow:inset 0 0 0 2px var(--o)}.qmap button.locked{opacity:.35}.main{padding:26px;min-height:650px}.meta{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.chip{font-size:.74rem;border-radius:999px;padding:4px 10px;background:#eef2f7}.chip.o{background:#fff0e3;color:#9a480d}.chip.n{background:#eaf0f9;color:var(--n)}.stem{font-size:1.03rem;line-height:1.95;margin:12px 0 20px;white-space:pre-wrap}.scenario{background:#fff6ec;border-right:4px solid var(--o);padding:14px 16px;border-radius:12px;margin-bottom:18px}.scenario b{color:var(--o)}.opts{display:grid;gap:10px}.opt{display:flex;gap:11px;align-items:flex-start;border:1.5px solid var(--l);border-radius:13px;padding:13px 14px;cursor:pointer;transition:.15s;background:#fff}.opt:hover{border-color:#f4b27b}.opt.sel{border-color:var(--o);background:#fff8f2}.opt input{margin-top:5px}.strike{text-decoration:line-through;opacity:.45}.opt .kill{margin-inline-start:auto;border:0;background:#eef2f6;border-radius:7px;padding:2px 7px;cursor:pointer;color:#6b778c}.controls{display:flex;gap:9px;flex-wrap:wrap;margin-top:24px;border-top:1px solid var(--l);padding-top:18px}.btn{border:1.5px solid var(--l);background:#fff;border-radius:10px;padding:10px 16px;font-weight:700;cursor:pointer}.btn.p{background:var(--o);border-color:var(--o);color:#fff}.btn.n{background:var(--n);border-color:var(--n);color:#fff}.btn.warn{background:#fff4e6;color:#8c4a08;border-color:#f2d4a7}.btn.d{background:#fff0f1;color:var(--bad);border-color:#f1c2c8}.summary{padding:16px}.summary .row{display:flex;justify-content:space-between;border-bottom:1px solid var(--l);padding:8px 0;font-size:.82rem}.progress{height:8px;background:#edf1f6;border-radius:6px;overflow:hidden;margin-top:10px}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--o),var(--o2))}.multihelp{font-size:.82rem;color:var(--d);margin-bottom:12px}.fill{width:100%;border:1.5px solid var(--l);padding:13px;border-radius:11px}.order{list-style:none;padding:0;margin:0;display:grid;gap:8px}.order li{border:1px solid var(--l);padding:11px;border-radius:9px;background:#fff;cursor:grab}.report{max-width:1000px;margin:25px auto;padding:22px}.score{font:800 3rem var(--fm);color:var(--n)}.pass{color:var(--ok)}.fail{color:var(--bad)}.domainGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin:18px 0}.domain{padding:16px}.review{margin-top:18px}.rev{padding:12px 0;border-bottom:1px solid var(--l);font-size:.85rem}.overlay{position:fixed;inset:0;background:#0e2444db;z-index:99;display:flex;align-items:center;justify-content:center;padding:20px}.breakbox{max-width:540px;width:100%;background:#fff;border-radius:24px;padding:34px;text-align:center}.breakbox h2{font:800 1.7rem var(--fd);color:var(--n)}.breaktime{font:700 3rem var(--fm);color:var(--o);margin:15px}.loading{padding:80px 20px;text-align:center;color:var(--d)}.notice{background:#fff4e6;border:1px solid #f0d1a1;border-radius:12px;padding:12px 15px;color:#75430b;margin:10px 0}.typebox{border:1px solid var(--l);border-radius:12px;padding:14px}.matchrow{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}.matchrow select{border:1px solid var(--l);padding:9px;border-radius:8px}@media(max-width:1050px){.wrap{grid-template-columns:1fr}.side{position:static}.qmap{max-height:none;grid-template-columns:repeat(12,1fr)}.right{order:3}}@media(max-width:600px){.qmap{grid-template-columns:repeat(8,1fr)}.main{padding:18px}.topin{font-size:.85rem}}
</style></head><body><div id="root"><div class="loading">جارٍ فتح محاكاة PMP® 2026…</div></div><script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
let TOKEN='',S=null,IDX=0,remaining=240*60,inBreak=false,breakTaken={10:false,96:false},strike={},saveTimer=null,tick=null;
function findToken(){for(let i=0;i<localStorage.length;i++){const v=localStorage.getItem(localStorage.key(i))||'';if(/^[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$/.test(v)){try{const p=JSON.parse(atob(v.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')));if(p&&p.id)return v}catch{}}}return''}
async function api(path,opt={}){const r=await fetch('/api/pmp-2026'+path,{method:opt.method||'GET',headers:{'Content-Type':'application/json','Authorization':'Bearer '+TOKEN},body:opt.body?JSON.stringify(opt.body):undefined});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'حدث خطأ');return d}
function esc(s){return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function fmt(sec){sec=Math.max(0,sec|0);return String(Math.floor(sec/3600)).padStart(2,'0')+':'+String(Math.floor(sec%3600/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0')}
function domainLabel(d){return d==='people'?'الأفراد':d==='process'?'العمليات':d==='business'?'بيئة العمل':d}
function saveLocal(){if(!S)return;localStorage.setItem('pmp2026-session',S.id);localStorage.setItem('pmp2026-time-'+S.id,String(remaining));localStorage.setItem('pmp2026-breaks-'+S.id,JSON.stringify(breakTaken))}
function loadLocal(){if(!S)return;const t=+localStorage.getItem('pmp2026-time-'+S.id);if(Number.isFinite(t)&&t>0&&t<=240*60)remaining=t;try{breakTaken={...breakTaken,...JSON.parse(localStorage.getItem('pmp2026-breaks-'+S.id)||'{}')}}catch{}}
function startTick(){clearInterval(tick);tick=setInterval(()=>{if(!inBreak){remaining--;saveLocal();const x=$('#timer');if(x)x.textContent=fmt(remaining);if(remaining<=0){clearInterval(tick);finishExam()}}},1000)}
function renderShell(){const q=S.questions[IDX],ans=S.answers[q.id];const done=Object.keys(S.answers||{}).length;const flagged=new Set(S.flagged||[]);const maxAllowed=breakTaken[10]?(breakTaken[96]?179:95):9;document.querySelector('#root').innerHTML=`<div class="top"><div class="topin"><div class="brand">السعيد — PMP® 2026 Full Simulation</div><span class="badge">180 سؤال</span><span class="badge">الأفراد 59 · العمليات 74 · بيئة العمل 47</span><span class="timer" id="timer">${fmt(remaining)}</span></div></div><div class="wrap"><aside class="card side"><h3>خريطة الأسئلة</h3><div class="qmap">${S.questions.map((x,i)=>`<button data-i="${i}" ${i>maxAllowed?'disabled':''} class="${i===IDX?'cur ':''}${S.answers[x.id]!=null?'answered ':''}${flagged.has(x.id)?'flagged ':''}${i>maxAllowed?'locked ':''}">${i+1}</button>`).join('')}</div><div class="controls"><button class="btn d" id="finish">إنهاء الاختبار</button></div></aside><main class="card main"><div class="meta"><span class="chip n">السؤال ${IDX+1} من 180</span><span class="chip">${domainLabel(q.domain)}</span><span class="chip">${esc(q.approach||'General')}</span><span class="chip o">${q.scenario?'سيناريو':''}${q.type==='multiple'?' اختيار متعدد':''}</span></div>${q.scenario?`<div class="scenario"><b>Scenario ${IDX+1}/10</b><div>هذا السؤال ضمن مجموعة السيناريوهات الافتتاحية قبل الاستراحة الأولى.</div></div>`:''}<div class="stem">${esc(q.question)}</div>${renderAnswer(q,ans)}<div class="controls"><button class="btn" id="prev" ${IDX===0?'disabled':''}>السابق</button><button class="btn warn" id="flag">${flagged.has(q.id)?'إزالة العلامة':'وضع علامة للمراجعة'}</button><button class="btn p" id="next">${IDX===179?'مراجعة ثم إنهاء':'التالي'}</button></div></main><aside class="card side right"><div class="summary"><h3>حالة المحاولة</h3><div class="row"><span>تمت الإجابة</span><b>${done}/180</b></div><div class="row"><span>متبقي</span><b>${180-done}</b></div><div class="row"><span>للمراجعة</span><b>${flagged.size}</b></div><div class="row"><span>الاستراحة 1</span><b>${breakTaken[10]?'✓':'بعد 10'}</b></div><div class="row"><span>الاستراحة 2</span><b>${breakTaken[96]?'✓':'بعد 96'}</b></div><div class="progress"><i style="width:${Math.round(done/180*100)}%"></i></div><div class="notice">وقت الاختبار 240 دقيقة، والمؤقت يتوقف أثناء الاستراحات.</div></div></aside></div>`;bind()}
function renderAnswer(q,ans){const opts=q.options||[];if(q.type==='multiple')return `<div class="multihelp">اختر كل الإجابات الصحيحة المطلوبة.</div><div class="opts">${opts.map((o,i)=>optionHtml(q,o,i,Array.isArray(ans)?ans.includes(String.fromCharCode(65+i)):String(ans||'').split(',').includes(String.fromCharCode(65+i)),true)).join('')}</div>`;if(q.type==='fill_blank')return `<input class="fill" id="fillAns" value="${esc(ans||'')}" placeholder="اكتب الإجابة">`;if(q.type==='ordering'||q.type==='drag_drop')return `<div class="typebox"><div class="multihelp">رتّب العناصر بالسحب.</div><ul class="order" id="orderList">${(Array.isArray(ans)&&ans.length?ans:opts).map((o,i)=>`<li draggable="true" data-v="${esc(o)}">☰ ${esc(o)}</li>`).join('')}</ul></div>`;if(q.type==='matching'){const pairs=q.meta?.pairs||[];return `<div class="typebox">${pairs.map((p,i)=>`<div class="matchrow"><div>${esc(p.left||'')}</div><select data-match="${i}"><option value="">اختر</option>${(p.choices||[]).map(c=>`<option ${ans&&ans[i]===c?'selected':''}>${esc(c)}</option>`).join('')}</select></div>`).join('')||'<div class="notice">يمكن إضافة بيانات المطابقة من لوحة الإدارة لهذا السؤال.</div>'}</div>`}if(q.type==='hotspot'){const hs=q.meta?.hotspots||[];return `<div class="typebox"><div class="multihelp">اختر المنطقة الصحيحة:</div><div class="opts">${hs.map((h,i)=>`<button class="btn hotspot ${ans===h.id?'p':''}" data-v="${esc(h.id)}">${esc(h.label||h.id)}</button>`).join('')||'<div class="notice">يمكن إضافة صورة ومناطق Hotspot من لوحة الإدارة.</div>'}</div></div>`}return `<div class="opts">${opts.map((o,i)=>optionHtml(q,o,i,String(ans||'')===String.fromCharCode(65+i),false)).join('')}</div>`}
function optionHtml(q,o,i,sel,multi){const L=String.fromCharCode(65+i),k=q.id+'-'+i;return `<label class="opt ${sel?'sel':''} ${strike[k]?'strike':''}"><input name="ans" type="${multi?'checkbox':'radio'}" value="${L}" ${sel?'checked':''}><b>${L}</b><span>${esc(o)}</span><button type="button" class="kill" data-k="${k}">✕</button></label>`}
function collect(){const q=S.questions[IDX];let a=null;if(q.type==='multiple')a=$$('input[name=ans]:checked').map(x=>x.value);else if(q.type==='fill_blank')a=$('#fillAns')?.value||'';else if(q.type==='ordering'||q.type==='drag_drop')a=$$('#orderList li').map(x=>x.dataset.v);else if(q.type==='matching')a=$$('[data-match]').map(x=>x.value);else if(q.type==='hotspot')a=$('.hotspot.p')?.dataset.v||null;else a=$('input[name=ans]:checked')?.value||null;return a}
async function persist(){const q=S.questions[IDX],a=collect();if(a==null||a===''||(Array.isArray(a)&&!a.length))delete S.answers[q.id];else S.answers[q.id]=a;clearTimeout(saveTimer);saveTimer=setTimeout(()=>api('/session/'+S.id+'/answer',{method:'POST',body:{questionId:q.id,answer:a}}).catch(console.warn),80);saveLocal()}
function bind(){const q=S.questions[IDX];$$('input[name=ans]').forEach(x=>x.onchange=()=>{persist();renderShell()});$('#fillAns')&&($('#fillAns').onchange=persist);$$('.kill').forEach(b=>b.onclick=e=>{e.preventDefault();strike[b.dataset.k]=!strike[b.dataset.k];renderShell()});$$('.qmap button').forEach(b=>b.onclick=async()=>{if(b.disabled)return;await persist();IDX=+b.dataset.i;renderShell()});$('#prev').onclick=async()=>{await persist();if(IDX>0){IDX--;renderShell()}};$('#next').onclick=async()=>{await persist();if(IDX===9&&!breakTaken[10])return takeBreak(10,5,()=>{IDX=10;renderShell()});if(IDX===95&&!breakTaken[96])return takeBreak(96,10,()=>{IDX=96;renderShell()});if(IDX<179){IDX++;renderShell()}else reviewEnd()};$('#flag').onclick=async()=>{const f=!(S.flagged||[]).includes(q.id);S.flagged=f?[...new Set([...(S.flagged||[]),q.id])]:(S.flagged||[]).filter(x=>x!==q.id);await api('/session/'+S.id+'/flag',{method:'POST',body:{questionId:q.id,flagged:f}});renderShell()};$('#finish').onclick=reviewEnd;bindOrder();$$('.hotspot').forEach(b=>b.onclick=()=>{S.answers[q.id]=b.dataset.v;persist();renderShell()})}
function bindOrder(){const list=$('#orderList');if(!list)return;let drag=null;$$('#orderList li').forEach(li=>{li.ondragstart=()=>drag=li;li.ondragover=e=>e.preventDefault();li.ondrop=e=>{e.preventDefault();if(drag&&drag!==li){const r=li.getBoundingClientRect();list.insertBefore(drag,e.clientY<r.top+r.height/2?li:li.nextSibling);persist()}}})}
function takeBreak(after,min,done){inBreak=true;let left=min*60;const o=document.createElement('div');o.className='overlay';o.innerHTML=`<div class="breakbox"><h2>${after===10?'الاستراحة الأولى':'الاستراحة الثانية'}</h2><p>أكملت الأسئلة حتى رقم ${after}. وقت الاختبار متوقف الآن.</p><div class="breaktime" id="breaktime">${fmt(left).slice(3)}</div><p>مدة الاستراحة ${min} دقائق.</p><button class="btn n" id="resume" disabled>استئناف الاختبار</button></div>`;document.body.appendChild(o);const z=setInterval(()=>{left--;$('#breaktime').textContent=fmt(left).slice(3);if(left<=0){clearInterval(z);$('#resume').disabled=false;$('#resume').textContent='استئناف الآن'}},1000);$('#resume').onclick=()=>{if(left>0)return;breakTaken[after]=true;inBreak=false;o.remove();saveLocal();done()}}
function reviewEnd(){persist();const unanswered=S.questions.filter(q=>S.answers[q.id]==null).length;const flagged=(S.flagged||[]).length;if(confirm(`متبقي بدون إجابة: ${unanswered}\nللمراجعة: ${flagged}\nهل تريد إنهاء المحاكاة الآن؟`))finishExam()}
async function finishExam(){clearInterval(tick);inBreak=true;document.querySelector('#root').innerHTML='<div class="loading">جارٍ تصحيح المحاكاة وإعداد التقرير…</div>';try{const r=await api('/session/'+S.id+'/finish',{method:'POST'});showReport(r)}catch(e){document.querySelector('#root').innerHTML='<div class="loading">'+esc(e.message)+'</div>'}}
function showReport(r){const names={people:'الأفراد',process:'العمليات',business:'بيئة العمل'};document.querySelector('#root').innerHTML=`<div class="card report"><h1>PMP® 2026 — تقرير المحاكاة</h1><div class="score ${r.passed?'pass':'fail'}">${r.score}%</div><h2>${r.passed?'PASS — اجتياز المحاكاة':'تحتاج إلى مراجعة إضافية'}</h2><p>${r.correct} إجابة صحيحة من ${r.total}</p><div class="domainGrid">${Object.entries(r.domains||{}).map(([k,v])=>`<div class="card domain"><b>${names[k]||k}</b><div class="score" style="font-size:1.5rem">${v.percent}%</div><small>${v.correct}/${v.total}</small></div>`).join('')}</div><h3>الأداء حسب نمط السؤال</h3><div class="domainGrid">${Object.entries(r.types||{}).map(([k,v])=>`<div class="card domain"><b>${esc(k)}</b><div>${v.percent}%</div><small>${v.correct}/${v.total}</small></div>`).join('')}</div><div class="controls"><button class="btn n" onclick="newExam()">محاولة جديدة</button><button class="btn" onclick="location.href='/'">العودة للمنصة</button></div><div class="review"><h3>مراجعة الأخطاء</h3>${(r.review||[]).filter(x=>!x.correct).slice(0,80).map(x=>`<div class="rev"><b>سؤال ${x.index} · ${domainLabel(x.domain)}</b><div>إجابتك: ${esc(Array.isArray(x.answer)?x.answer.join(', '):x.answer??'—')} · الصحيحة: ${esc(x.correctAnswer)}</div><div>${esc(x.explanation||'')}</div>${x.reference?`<small>${esc(x.reference)}</small>`:''}</div>`).join('')||'<p>لا توجد أخطاء.</p>'}</div></div>`;localStorage.removeItem('pmp2026-session')}
async function newExam(){localStorage.removeItem('pmp2026-session');S=await api('/start',{method:'POST'});IDX=0;remaining=240*60;breakTaken={10:false,96:false};saveLocal();renderShell();startTick()}
async function init(){TOKEN=findToken();if(!TOKEN){document.querySelector('#root').innerHTML='<div class="loading"><h2>يلزم تسجيل الدخول أولاً</h2><button class="btn n" onclick="location.href=\'/#login\'">العودة لتسجيل الدخول</button></div>';return}try{const old=localStorage.getItem('pmp2026-session');if(old){try{S=await api('/session/'+old);if(S.status!=='active')S=null}catch{S=null}}if(!S)S=await api('/start',{method:'POST'});loadLocal();renderShell();startTick()}catch(e){document.querySelector('#root').innerHTML='<div class="loading"><h2>تعذر فتح المحاكاة</h2><p>'+esc(e.message)+'</p><button class="btn" onclick="location.href=\'/\'">العودة للمنصة</button></div>'}}
init();
</script></body></html>
