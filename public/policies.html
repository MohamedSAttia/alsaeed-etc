<script src="/launch-v22.js?v=30.0"></script><script>(()=>{const all=window.AL_SAEED_POLICIES;if(!all)return;let lang='ar';try{lang=localStorage.getItem('alsaeed_lang')==='en'?'en':'ar'}catch{}document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';const nav=document.getElementById('policyNav'),body=document.getElementById('policyBody');const keys=['terms','privacy','refund'];document.getElementById('heading').textContent=lang==='en'?'Policies and legal information':'السياسات والمعلومات القانونية';document.getElementById('intro').textContent=lang==='en'?'Read the terms governing access, personal data, and cancellation before placing an order.':'اطّلع على شروط الوصول للبرامج ومعالجة البيانات والإلغاء قبل تأكيد طلبك.';function render(){const key=keys.includes(location.hash.slice(1))?location.hash.slice(1):'terms',item=all[key][lang];nav.innerHTML=keys.map(k=>'<a class="'+(k===key?'active':'')+'" href="#'+k+'">'+all[k][lang][0]+'</a>').join('');body.replaceChildren();const heading=document.createElement('h2');heading.textContent=item[0];body.append(heading);item[1].forEach(([title,content])=>{const section=document.createElement('section'),h=document.createElement('h3'),p=document.createElement('p');h.textContent=title;p.textContent=content;section.append(h,p);body.append(section)});const note=document.createElement('p');note.className='note';note.textContent=lang==='en'?'Updated 25 September 2026 · Contact: info@alsaeed-etc.com':'آخر تحديث: 25 سبتمبر 2026 · الاستفسارات: info@alsaeed-etc.com';body.append(note)}window.addEventListener('hashchange',render);render()})();</script></body></html>
