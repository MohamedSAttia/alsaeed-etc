<script>/* ============================================================
   نظام السعيد GRC™ — السجلات التفصيلية + التوقيع الإلكتروني
   سجل المخاطر بنموذج S×P×R مع قبل/بعد وخطة الاستجابة والتتبّع
   ومرآته على الفرص والالتزامات
   تصميم وبرمجة: د. محمد عطية
   ============================================================ */

/* ═══════════ 1) مقاييس التقدير ═══════════ */
window.REG_SCALES = {
  S: [['0.1','نادرة جداً (10%)'],['0.3','منخفضة (30%)'],['0.5','متوسطة (50%)'],
      ['0.7','مرجّحة (70%)'],['0.9','شبه مؤكدة (90%)']],
  P: [['1','ضئيل'],['2','بسيط'],['5','متوسط'],['10','كبير'],['20','كارثي']],
  R: [['1','نادر — مرة كل بضع سنوات'],['2','متقطّع — سنوياً'],['5','متكرر — فصلياً'],
      ['10','مستمر — شهرياً أو أكثر']]
};

/* درجة الخطر = S × P × R */
window.regScore = function (s, p, r) {
  const v = (parseFloat(s) || 0) * (parseFloat(p) || 0) * (parseFloat(r) || 0);
  return Math.round(v * 100) / 100;
};
window.regGrade = function (v) {
  if (!v) return ['—', '#8A9AAE'];
  if (v >= 50) return ['خطر حرج', '#7A1F17'];
  if (v >= 20) return ['خطر عالٍ', '#B3261E'];
  if (v >= 7)  return ['خطر متوسط', '#B4690E'];
  if (v >= 2)  return ['خطر منخفض', '#0F766E'];
  return ['خطر ضئيل', '#047857'];
};
window.regImpact = function (p) {
  const n = parseFloat(p) || 0;
  return n >= 20 ? 'كارثي' : n >= 10 ? 'خطير' : n >= 5 ? 'مؤثر' : n >= 2 ? 'محدود' : 'غير خطير';
};
window.regPriority = function (v) {
  return v >= 50 ? 'أولوية أولى' : v >= 20 ? 'أولوية ثانية' : v >= 7 ? 'أولوية ثالثة' : 'مراقبة';
};

/* ═══════════ 2) تعريف الأعمدة — ثلاثة سجلات بمرآة واحدة ═══════════ */
function cols(kind) {
  const isRisk = kind === 'risk', isOpp = kind === 'opp';
  const label = isRisk ? 'الخطر' : isOpp ? 'الفرصة' : 'الالتزام';
  const typeOpts = isRisk ? ['تهديد','خطر تشغيلي','خطر استراتيجي']
    : isOpp ? ['فرصة تحسين','فرصة نمو','فرصة توفير'] : ['إلزامي','طوعي','تعاقدي'];
  const respOpts = isRisk ? ['تجنّب','تخفيف','نقل','قبول','تصعيد']
    : isOpp ? ['استغلال','تعزيز','مشاركة','قبول'] : ['امتثال كامل','امتثال تدريجي','طلب استثناء','معالجة الفجوة'];

  return {
    id: kind,
    title: isRisk ? 'سجل المخاطر التفصيلي' : isOpp ? 'سجل الفرص التفصيلي' : 'سجل الالتزامات التفصيلي',
    en: isRisk ? 'Detailed Risk Register' : isOpp ? 'Detailed Opportunity Register' : 'Detailed Obligation Register',
    groups: [
      { g: 'التعريف', cols: [
        { k: 'no',   ar: 'م',            t: 'auto' },
        { k: 'date', ar: 'التاريخ',       t: 'date' },
        { k: 'item', ar: label,           t: 'text', w: 220 },
        { k: 'type', ar: 'النوع',         t: 'select', opts: typeOpts },
        { k: 'cls',  ar: 'التصنيف',       t: 'select', opts: ['استراتيجي','تشغيلي','مالي','امتثال','خارجي','تنظيمي','صحة وسلامة','سيبراني','سمعة','بيئي'] },
        { k: 'root', ar: 'الأسباب الجذرية', t: 'text', w: 200 },
        { k: 'eff',  ar: 'التأثيرات',      t: 'multi', opts: ['الجدول الزمني','التكاليف','الجودة','رضا المستفيدين','السمعة','السلامة','الامتثال','الاستمرارية'] },
        { k: 'obj',   ar: 'الهدف المتأثر',  t: 'ref', ref: 'objectives', w: 180 },
        { k: 'rowner',ar: 'مالك الخطر / البند', t: 'ref', ref: 'owners', w: 160 },
        { k: 'runit', ar: 'الإدارة المسؤولة',   t: 'text', w: 150 }
      ]},
      { g: 'التقدير قبل المعالجة', cols: [
        { k: 'S1', ar: 'الاحتمالية S', t: 'select', opts: window.REG_SCALES.S.map(x => x[0]), hint: window.REG_SCALES.S },
        { k: 'P1', ar: 'شدّة الأثر P',  t: 'select', opts: window.REG_SCALES.P.map(x => x[0]), hint: window.REG_SCALES.P },
        { k: 'R1', ar: 'التكرار R',     t: 'select', opts: window.REG_SCALES.R.map(x => x[0]), hint: window.REG_SCALES.R },
        { k: 'V1', ar: 'S×P×R',        t: 'calc' },
        { k: 'G1', ar: 'الدرجة',        t: 'calc' },
        { k: 'I1', ar: 'الأثر',         t: 'calc' },
        { k: 'PR', ar: 'الأولوية',      t: 'calc' }
      ]},
      { g: 'خطة الاستجابة', cols: [
        { k: 'resp',  ar: 'الاستجابة',       t: 'select', opts: respOpts },
        { k: 'owner', ar: 'مالك الإجراء',    t: 'ref', ref: 'owners', w: 160 },
        { k: 'osup',  ar: 'الجهة المساندة',   t: 'text', w: 140 },
        { k: 'pdate', ar: 'تاريخ التنفيذ المخطط', t: 'date' },
        { k: 'pdays', ar: 'المدة المخططة (يوم)', t: 'num' },
        { k: 'teff',  ar: 'الفعالية المستهدفة %', t: 'num' },
        { k: 'main',  ar: 'الخطة الأساسية',  t: 'text', w: 200 },
        { k: 'alt',   ar: 'الخطة البديلة',   t: 'text', w: 200 }
      ]},
      { g: 'التنفيذ والتتبّع', cols: [
        { k: 'adate', ar: 'تاريخ التنفيذ الفعلي', t: 'date' },
        { k: 'result',ar: 'النتيجة',          t: 'text', w: 170 },
        { k: 'adays', ar: 'المدة الفعلية (يوم)', t: 'num' },
        { k: 'aeff',  ar: 'فعالية التنفيذ %',  t: 'num' },
        { k: 'dev',   ar: 'الانحراف (يوم)',    t: 'calc' },
        { k: 'devp',  ar: 'نسبة الانحراف',     t: 'calc' },
        { k: 'status',ar: 'الحالة',            t: 'calc' },
        { k: 'ctrl',  ar: 'إجراءات التحكم',    t: 'select', opts: ['ضوابط إدارية','ضوابط هندسية','ضوابط وقائية','ضوابط كشفية','ضوابط استجابية','معدات وقاية','تدريب وتوعية'] }
      ]},
      { g: 'التقدير بعد المعالجة', cols: [
        { k: 'S2', ar: 'الاحتمالية S', t: 'select', opts: window.REG_SCALES.S.map(x => x[0]), hint: window.REG_SCALES.S },
        { k: 'P2', ar: 'شدّة الأثر P',  t: 'select', opts: window.REG_SCALES.P.map(x => x[0]), hint: window.REG_SCALES.P },
        { k: 'R2', ar: 'التكرار R',     t: 'select', opts: window.REG_SCALES.R.map(x => x[0]), hint: window.REG_SCALES.R },
        { k: 'V2', ar: 'S×P×R بعد',    t: 'calc' },
        { k: 'G2', ar: 'الدرجة بعد',    t: 'calc' },
        { k: 'red',ar: 'نسبة التخفيض',  t: 'calc' },
        { k: 'wt', ar: 'داخل حدود التحمّل؟', t: 'select', opts: ['نعم','لا','قيد المراجعة'] }
      ]}
    ]
  };
}
window.REGISTERS = { risk: cols('risk'), opp: cols('opp'), obl: cols('obl') };

/* ═══ أعمدة مخصّصة يضيفها المستخدم — نوعية أو كمية ═══ */
window.regCustom = function (kind) {
  const s = window.GRCAPP ? window.GRCAPP.ST() : {};
  s.regCols = s.regCols || {};
  s.regCols[kind] = s.regCols[kind] || [];
  return s.regCols[kind];
};
window.regAddCol = function (kind, col) {
  const a = window.regCustom(kind);
  col.k = 'x_' + Date.now().toString(36);
  col.custom = true;
  a.push(col);
  return col;
};
window.regDelCol = function (kind, k) {
  const a = window.regCustom(kind);
  const i = a.findIndex(c => c.k === k);
  if (i >= 0) a.splice(i, 1);
};
/* كل الأعمدة = المعيارية + المخصّصة */
window.regAllGroups = function (kind) {
  const g = window.REGISTERS[kind].groups.map(x => ({ g: x.g, cols: x.cols.slice() }));
  const cu = window.regCustom(kind);
  if (cu.length) g.push({ g: 'حقول مخصّصة', cols: cu.slice() });
  return g;
};

/* ═══════════ 3) الحسابات ═══════════ */
window.regCompute = function (r) {
  const v1 = window.regScore(r.S1, r.P1, r.R1);
  const v2 = window.regScore(r.S2, r.P2, r.R2);
  const g1 = window.regGrade(v1), g2 = window.regGrade(v2);
  const dev = (r.adays !== '' && r.pdays !== '' && r.adays != null && r.pdays != null)
    ? (parseFloat(r.pdays) - parseFloat(r.adays)) : '';
  const devp = (dev !== '' && parseFloat(r.pdays)) ? Math.round(dev / parseFloat(r.pdays) * 100) : '';
  return {
    V1: v1 || '', G1: g1[0], G1c: g1[1], I1: window.regImpact(r.P1), PR: v1 ? window.regPriority(v1) : '',
    V2: v2 || '', G2: g2[0], G2c: g2[1],
    red: (v1 && v2) ? Math.round((1 - v2 / v1) * 100) + '%' : '',
    dev: dev === '' ? '' : dev,
    devp: devp === '' ? '' : devp + '%',
    status: dev === '' ? '' : (dev > 0 ? 'متقدّم' : dev < 0 ? 'متأخّر' : 'في الموعد')
  };
};

/* ═══════════ 4) التوقيع الإلكتروني ═══════════ */
window.ESign = (function () {
'use strict';
function hash(s) { let h = 0; for (let i = 0; i < s.length; i++) { h = ((h << 5) - h + s.charCodeAt(i)) | 0; } return Math.abs(h).toString(36).toUpperCase(); }

function open(title, onDone, existing) {
  const ov = document.createElement('div'); ov.className = 'tr-ov es-ov';
  ov.innerHTML = `<div class="tr-box es-box">
    <h3>✍️ التوقيع الإلكتروني</h3>
    <p>${title || ''}</p>
    <div class="es-tabs">
      <button class="es-t on" data-m="draw">ارسم توقيعك</button>
      <button class="es-t" data-m="type">اكتب اسمك</button>
    </div>
    <div id="esDraw"><canvas id="esCanvas" width="620" height="180"></canvas>
      <div class="es-hint">ارسم بالفأرة أو بإصبعك داخل الإطار</div></div>
    <div id="esType" class="hide"><input id="esName" placeholder="الاسم الكامل" value="${(existing && existing.name) || ''}">
      <div class="es-prev" id="esPrev">${(existing && existing.name) || ''}</div></div>
    <label class="full">الصفة / المسمّى الوظيفي<input id="esRole" value="${(existing && existing.role) || ''}" placeholder="مثال: مدير المخاطر"></label>
    <label class="chk"><input type="checkbox" id="esAck"> أُقرّ بأنني اطّلعت على المحتوى وأوافق على اعتماده، وأن هذا التوقيع الإلكتروني مُلزِم كالتوقيع الخطّي.</label>
    <div class="tr-act">
      <button class="btn g" id="esSave" disabled>اعتماد التوقيع</button>
      <button class="btn o" id="esClear">مسح</button>
      <button class="btn o" id="esCancel">إلغاء</button>
    </div>
  </div>`;
  document.body.appendChild(ov);

  const cv = ov.querySelector('#esCanvas'), ctx = cv.getContext('2d');
  ctx.lineWidth = 2.4; ctx.lineCap = 'round'; ctx.strokeStyle = '#12365A';
  let drawing = false, dirty = false, mode = 'draw';
  const pos = e => { const r = cv.getBoundingClientRect();
    const t = e.touches ? e.touches[0] : e;
    return [(t.clientX - r.left) * cv.width / r.width, (t.clientY - r.top) * cv.height / r.height]; };
  const down = e => { drawing = true; dirty = true; ctx.beginPath(); ctx.moveTo(...pos(e)); e.preventDefault(); check(); };
  const move = e => { if (!drawing) return; ctx.lineTo(...pos(e)); ctx.stroke(); e.preventDefault(); };
  const up = () => drawing = false;
  cv.addEventListener('mousedown', down); cv.addEventListener('mousemove', move);
  window.addEventListener('mouseup', up);
  cv.addEventListener('touchstart', down); cv.addEventListener('touchmove', move); cv.addEventListener('touchend', up);

  const nm = ov.querySelector('#esName'), pv = ov.querySelector('#esPrev');
  nm.oninput = () => { pv.textContent = nm.value; check(); };
  ov.querySelector('#esRole').oninput = check;
  ov.querySelector('#esAck').onchange = check;

  ov.querySelectorAll('.es-t').forEach(b => b.onclick = () => {
    mode = b.dataset.m;
    ov.querySelectorAll('.es-t').forEach(x => x.classList.remove('on')); b.classList.add('on');
    ov.querySelector('#esDraw').classList.toggle('hide', mode !== 'draw');
    ov.querySelector('#esType').classList.toggle('hide', mode !== 'type');
    check();
  });
  function check() {
    const ok = ov.querySelector('#esAck').checked &&
      (mode === 'draw' ? dirty : nm.value.trim().length > 2);
    ov.querySelector('#esSave').disabled = !ok;
  }
  ov.querySelector('#esClear').onclick = () => {
    ctx.clearRect(0, 0, cv.width, cv.height); dirty = false; nm.value = ''; pv.textContent = ''; check();
  };
  ov.querySelector('#esCancel').onclick = () => ov.remove();
  ov.querySelector('#esSave').onclick = () => {
    const name = mode === 'type' ? nm.value.trim() : (nm.value.trim() || 'توقيع مرسوم');
    const img = mode === 'draw' ? cv.toDataURL('image/png') : '';
    const at = new Date().toISOString();
    const sig = { name, role: ov.querySelector('#esRole').value.trim(), img, mode, at,
      id: 'SIG-' + hash(name + at + (img.length || 0)) };
    ov.remove(); onDone && onDone(sig);
  };
  return ov;
}

function render(sig) {
  if (!sig) return '<span class="es-none">— لم يُوقَّع بعد —</span>';
  const d = new Date(sig.at);
  return `<div class="es-card">
    ${sig.img ? `<img src="${sig.img}" alt="توقيع">` : `<div class="es-script">${(sig.name || '')}</div>`}
    <div class="es-meta"><b>${sig.name || ''}</b>
      ${sig.role ? `<span>${sig.role}</span>` : ''}
      <small>${d.toLocaleString('ar-SA')} · ${sig.id}</small></div>
  </div>`;
}
return { open, render, hash };
})();
</script>
<script>/* ============================================================
   نظام السعيد GRC™ — واجهة السجلات التفصيلية
   عرض · إضافة · تعديل · حذف · نسخ · تصفية · تصدير
   ============================================================ */
window.REGUI = (function () {
'use strict';
function backBar() {
  const st = window.GRCAPP.ST();
  if (!st.backTo) return '';
  const k = st.backTo.split(':')[1];
  const c = (window.GRC_MODEL || []).find(x => x.k === k);
  if (!c) return '';
  return `<div class="back-bar">
    <b>◀ ضمن مكوّن ${c.ar}</b>
    <span>هذه الأداة جزء من عناصر هذا المكوّن — مخرجاتها تُغذّي ما بعده.</span>
    <button class="btn o sm" data-nav="${st.backTo}">رجوع للمكوّن</button>
  </div>`;
}
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => (s == null ? '' : String(s)).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const ST = () => window.GRCAPP.ST();

let KIND = 'risk', FILTER = '', EDIT = null;

function data() {
  const s = ST(); s.registers = s.registers || { risk: [], opp: [], obl: [] };
  s.registers[KIND] = s.registers[KIND] || [];
  return s.registers[KIND];
}
function def() { return window.REGISTERS[KIND]; }
function groups() { return window.regAllGroups(KIND); }
function flat() { return groups().flatMap(g => g.cols); }

/* قوائم المراجع من مخرجات العناصر السابقة */
function refList(name) {
  const o = (ST().outputs || {})[name];
  const rows = (o && o.rows) || [];
  const key = name === 'objectives' ? 'obj' : 'owner';
  const alt = name === 'objectives' ? 't' : 'own';
  return [...new Set(rows.map(r => (r[key] || r[alt] || '').trim()).filter(Boolean))];
}

/* ═══ العرض ═══ */
function view() {
  const D = def(), G = groups(), rows = data();
  const shown = FILTER ? rows.filter(r => JSON.stringify(r).indexOf(FILTER) >= 0) : rows;
  const stats = summary(rows);
  return `<div class="wrap">
  ${backBar()}
  <div class="hero">
    <div class="hero-t">
      <span class="kick">DETAILED REGISTERS · S × P × R</span>
      <h1>السجلات التفصيلية</h1>
      <p>سجل واحد بثلاث مرايا — المخاطر والفرص والالتزامات — بنموذج تقدير S×P×R وقياس قبل وبعد المعالجة وتتبّع تنفيذ خطة الاستجابة.</p>
    </div>
  </div>

  <div class="reg-tabs">
    ${Object.entries(window.REGISTERS).map(([k, v]) => `<button class="rt ${KIND === k ? 'on' : ''}" data-rk="${k}">
      ${v.title.replace('سجل ', '').replace(' التفصيلي', '')}
      <i>${(ST().registers && ST().registers[k] || []).length}</i></button>`).join('')}
  </div>

  <div class="grid4 mb">
    <div class="stat"><b>${stats.n}</b><span>بند مسجّل</span></div>
    <div class="stat"><b style="color:#B3261E">${stats.high}</b><span>حرج أو عالٍ</span></div>
    <div class="stat"><b style="color:#047857">${stats.red}%</b><span>متوسط التخفيض</span></div>
    <div class="stat"><b>${stats.open}</b><span>بلا خطة استجابة</span></div>
  </div>

  <div class="card pad">
    <div class="reg-bar">
      <button class="btn g sm" id="regAdd">＋ أضف بنداً</button>
      <button class="btn b sm" id="regAI">✨ توليد مقترح</button>
      <input id="regFind" placeholder="ابحث في السجل…" value="${esc(FILTER)}">
      <span class="ws-use">${shown.length} / ${rows.length}</span>
      <button class="btn o sm" id="regCol">➕ عمود مخصّص</button>
      <button class="btn o sm" id="regXls">📊 تصدير Excel</button>
      <button class="btn o sm" id="regPrint">🖨️ طباعة</button>
      <span class="sv-i">💾 يُحفظ تلقائياً</span>
    </div>

    ${shown.length ? `<div class="reg-wrap"><table class="reg-t">
      <thead>
        <tr class="rg">${G.map(g => `<th colspan="${g.cols.length}">${esc(g.g)}</th>`).join('')}<th rowspan="2">إجراءات</th></tr>
        <tr>${flat().map(c => `<th style="${c.w ? 'min-width:' + c.w + 'px' : ''}">${esc(c.ar)}</th>`).join('')}</tr>
      </thead>
      <tbody>${shown.map((r, i) => rowView(r, rows.indexOf(r))).join('')}</tbody>
    </table></div>` : `<p class="hint">لا توجد بنود بعد — أضف بنداً أو استخدم التوليد المقترح.</p>`}
  </div>

  <div class="card pad">
    <h3>دليل التقدير</h3>
    <div class="grid3">
      ${[['S · الاحتمالية', window.REG_SCALES.S], ['P · شدّة الأثر', window.REG_SCALES.P], ['R · التكرار', window.REG_SCALES.R]]
        .map(([t, sc]) => `<div class="mini"><b>${t}</b><ul>${sc.map(x => `<li><code>${x[0]}</code> ${esc(x[1])}</li>`).join('')}</ul></div>`).join('')}
    </div>
    <div class="reg-leg">
      ${[[50,'خطر حرج'],[20,'خطر عالٍ'],[7,'خطر متوسط'],[2,'خطر منخفض'],[0.1,'خطر ضئيل']]
        .map(([v, t]) => { const g = window.regGrade(v); return `<span class="rl" style="background:${g[1]}18;color:${g[1]};border-color:${g[1]}55">${t} — ${v >= 50 ? '≥50' : '≥' + v}</span>`; }).join('')}
    </div>
  </div></div>`;
}

function rowView(r, idx) {
  const c = window.regCompute(r);
  const g1 = window.regGrade(c.V1), g2 = window.regGrade(c.V2);
  return `<tr data-i="${idx}">
    ${flat().map(col => {
      const k = col.k;
      if (k === 'no') return `<td class="rc-n">${idx + 1}</td>`;
      if (col.t === 'calc') {
        let v = c[k] != null ? c[k] : '';
        let st = '';
        if (k === 'G1') st = `color:${g1[1]};font-weight:700`;
        if (k === 'G2') st = `color:${g2[1]};font-weight:700`;
        if (k === 'V1') st = `background:${g1[1]}14;font-weight:700`;
        if (k === 'V2') st = `background:${g2[1]}14;font-weight:700`;
        if (k === 'red' && v) st = 'color:#047857;font-weight:700';
        if (k === 'status') st = v === 'متأخّر' ? 'color:#B3261E' : v === 'متقدّم' ? 'color:#047857' : '';
        return `<td class="rc-c" style="${st}">${esc(v)}</td>`;
      }
      const v = r[k] == null ? '' : r[k];
      if (col.t === 'multi') return `<td class="rc-m">${esc(Array.isArray(v) ? v.join(' · ') : v)}</td>`;
      return `<td>${esc(v)}</td>`;
    }).join('')}
    <td class="rc-a">
      <button class="ra e" data-red="${idx}" title="تعديل">✎</button>
      <button class="ra c" data-rcp="${idx}" title="نسخة">⧉</button>
      <button class="ra d" data-rdl="${idx}" title="حذف">✕</button>
    </td></tr>`;
}

function summary(rows) {
  const vs = rows.map(r => window.regCompute(r));
  const high = vs.filter(v => v.V1 >= 20).length;
  const reds = vs.filter(v => v.red).map(v => parseInt(v.red));
  return {
    n: rows.length, high,
    red: reds.length ? Math.round(reds.reduce((a, b) => a + b, 0) / reds.length) : 0,
    open: rows.filter(r => !r.resp).length
  };
}

/* ═══ نافذة التحرير ═══ */
function editor(idx) {
  const D = def(), G = groups(), rows = data();
  const r = idx == null ? {} : Object.assign({}, rows[idx]);
  const ov = document.createElement('div'); ov.className = 'tr-ov';
  ov.innerHTML = `<div class="tr-box reg-ed">
    <h3>${idx == null ? '＋ بند جديد' : '✎ تعديل البند'} — ${esc(D.title)}</h3>
    <div id="regForm">${G.map(g => `
      <div class="reg-g"><div class="reg-gh">${esc(g.g)}</div>
        <div class="reg-gf">${g.cols.filter(c => c.t !== 'auto' && c.t !== 'calc').map(c => field(c, r)).join('')}</div>
      </div>`).join('')}
      <div class="reg-live" id="regLive"></div>
    </div>
    <div class="tr-act">
      <button class="btn g" id="regSave">حفظ البند</button>
      <button class="btn o" id="regCancel">إلغاء</button>
    </div>
  </div>`;
  document.body.appendChild(ov);

  function read() {
    const o = {};
    ov.querySelectorAll('[data-rf]').forEach(el => {
      if (el.dataset.multi) return;
      o[el.dataset.rf] = el.value;
    });
    ov.querySelectorAll('[data-multi]').forEach(box => {
      o[box.dataset.multi] = [...box.querySelectorAll('input:checked')].map(x => x.value);
    });
    return o;
  }
  function live() {
    const c = window.regCompute(read());
    const g1 = window.regGrade(c.V1), g2 = window.regGrade(c.V2);
    ov.querySelector('#regLive').innerHTML = `
      <div class="rlv"><span>قبل المعالجة</span>
        <b style="color:${g1[1]}">${c.V1 || '—'}</b><i style="color:${g1[1]}">${c.G1}</i>
        <em>${c.I1 || ''} · ${c.PR || ''}</em></div>
      <div class="rlv-a">◀</div>
      <div class="rlv"><span>بعد المعالجة</span>
        <b style="color:${g2[1]}">${c.V2 || '—'}</b><i style="color:${g2[1]}">${c.G2}</i>
        <em>${c.red ? 'تخفيض ' + c.red : ''}</em></div>
      ${c.status ? `<div class="rlv"><span>التنفيذ</span><b>${c.dev}</b><i>${c.status}</i><em>${c.devp}</em></div>` : ''}`;
  }
  ov.querySelectorAll('[data-rf],[data-multi] input').forEach(el => el.onchange = el.oninput = live);
  live();
  ov.querySelector('#regCancel').onclick = () => ov.remove();
  ov.querySelector('#regSave').onclick = () => {
    const o = read();
    if (!String(o.item || '').trim()) { window.GRCAPP.toast('اكتب وصف البند أولاً'); return; }
    if (!o.date) o.date = new Date().toISOString().slice(0, 10);
    if (idx == null) rows.push(o); else rows[idx] = o;
    window.GRCAPP.save(); ov.remove(); render();
    window.GRCAPP.toast(idx == null ? '✅ أُضيف البند' : '✅ حُدِّث البند');
  };
  ov.addEventListener('click', e => { if (e.target === ov) ov.remove(); });
}

function field(c, r) {
  const v = r[c.k] == null ? '' : r[c.k];
  const lbl = `<span>${esc(c.ar)}</span>`;
  if (c.t === 'select') {
    const hint = c.hint || null;
    return `<label>${lbl}<select data-rf="${c.k}"><option value=""></option>
      ${c.opts.map(o => {
        const h = hint ? (hint.find(x => x[0] === o) || [])[1] : '';
        return `<option value="${esc(o)}" ${v === o ? 'selected' : ''}>${esc(o)}${h ? ' — ' + esc(h) : ''}</option>`;
      }).join('')}</select></label>`;
  }
  if (c.t === 'ref') {
    const list = refList(c.ref);
    return `<label>${lbl}<input list="dl_${c.k}" data-rf="${c.k}" value="${esc(v)}" placeholder="${list.length ? 'اختر أو اكتب' : 'اكتب — أو أكمل العناصر السابقة'}">
      <datalist id="dl_${c.k}">${list.map(x => `<option value="${esc(x)}">`).join('')}</datalist></label>`;
  }
  if (c.t === 'multi') {
    const arr = Array.isArray(v) ? v : (v ? String(v).split(' · ') : []);
    return `<label class="full">${lbl}<div class="rmulti" data-multi="${c.k}">
      ${c.opts.map(o => `<label class="rmi"><input type="checkbox" value="${esc(o)}" ${arr.includes(o) ? 'checked' : ''}> ${esc(o)}</label>`).join('')}
    </div></label>`;
  }
  if (c.t === 'num') return `<label>${lbl}<input type="number" data-rf="${c.k}" value="${esc(v)}"></label>`;
  if (c.t === 'date') return `<label>${lbl}<input type="date" data-rf="${c.k}" value="${esc(v)}"></label>`;
  return `<label class="${c.w && c.w > 180 ? 'full' : ''}">${lbl}<input data-rf="${c.k}" value="${esc(v)}"></label>`;
}

/* ═══ التوليد المقترح ═══ */
function generate() {
  const ctx = window.ctxFor ? window.ctxFor(ST().org.activity, window.groupOf ? window.groupOf(ST().org.activity) : '', ST().org.sectorKey) : null;
  if (!ctx) { window.GRCAPP.toast('أكمل الملف التمهيدي أولاً'); return; }
  const src = KIND === 'risk' ? ctx.risks : KIND === 'opp' ? ctx.opps : ctx.regs;
  const objs = refList('objectives'), owners = refList('owners');
  const pick = a => a[Math.floor(Math.random() * a.length)];
  const rows = data();
  src.slice(0, 5).forEach((x, i) => {
    if (rows.some(r => r.item === x)) return;
    const S1 = pick(['0.3', '0.5', '0.7']), P1 = pick(['5', '10', '20']), R1 = pick(['2', '5', '10']);
    rows.push({
      date: new Date().toISOString().slice(0, 10), item: x,
      type: def().groups[0].cols.find(c => c.k === 'type').opts[0],
      cls: pick(['تشغيلي', 'امتثال', 'استراتيجي', 'خارجي']),
      root: 'يُحدَّد بتحليل السبب الجذري',
      eff: pick([['التكاليف', 'الجودة'], ['الجدول الزمني', 'رضا المستفيدين'], ['السمعة', 'الامتثال']]),
      obj: objs[0] || '', S1, P1, R1,
      resp: KIND === 'risk' ? 'تخفيف' : KIND === 'opp' ? 'استغلال' : 'امتثال كامل',
      owner: owners[0] || '', pdays: pick([7, 14, 30]), teff: 80,
      main: 'الخطة الأساسية — تُفصَّل مع المالك',
      alt: 'الخطة البديلة عند تعذّر الأساسية',
      ctrl: pick(['ضوابط إدارية', 'ضوابط وقائية', 'تدريب وتوعية']),
      S2: '0.3', P2: String(Math.max(1, parseFloat(P1) / 2)), R2: '2', wt: 'قيد المراجعة'
    });
  });
  window.GRCAPP.save(); render();
  window.GRCAPP.toast('✨ وُلِّدت بنود مقترحة — عدّلها أو احذفها');
}

/* ═══ التصدير ═══ */
function toXls() {
  const D = def(), G = groups(), rows = data();

  rows.forEach((r, i) => {
    const c = window.regCompute(r);
    h += '<tr>' + flat().map(col => {
      if (col.k === 'no') return `<td>${i + 1}</td>`;
      const v = col.t === 'calc' ? (c[col.k] || '') : (Array.isArray(r[col.k]) ? r[col.k].join(' · ') : (r[col.k] || ''));
      return `<td>${esc(v)}</td>`;
    }).join('') + '</tr>';
  });
  h += `</table><table><tr><td>نظام السعيد GRC — د. محمد عطية · تحت إشراف الأكاديمية الشمالية الغربية بتبوك</td></tr></table></body></html>`;
  const b = new Blob(['\ufeff' + h], { type: 'application/vnd.ms-excel' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(b);
  a.download = `${D.title}-${(ST().org.name || 'منظمة')}.xls`; a.click();
}

function printReg() {
  const D = def(), G = groups(), rows = data();
  let h = `<html dir="rtl"><head><meta charset="utf-8"><title>${esc(D.title)}</title><style>
    @page{size:A3 landscape;margin:10mm}
    body{font-family:'IBM Plex Sans Arabic',Tahoma,sans-serif;direction:rtl;padding:10px}

    tr.rg th{background:#12365A}

    tr:nth-child(even) td{background:#F6F9FC}

  </style></head><body>
  <h1>${esc(D.title)} — ${esc(ST().org.name || '')}</h1>
  <div style="font-size:10px;color:#5A6C82">نطاق التطبيق: ${esc(ST().org.scope)} · ${esc(ST().org.activity || '')} · ${new Date().toLocaleDateString('ar-SA')}</div>
  <table><thead>

    ${rows.map((r, i) => { const c = window.regCompute(r);
      return '<tr>' + flat().map(col => {
        if (col.k === 'no') return `<td>${i + 1}</td>`;

        return `<td>${esc(v)}</td>`; }).join('') + '</tr>'; }).join('')}
  </tbody></table>
  <div class="cr">نظام السعيد GRC — تصميم وإعداد وبرمجة: د. محمد عطية · تحت إشراف الأكاديمية الشمالية الغربية بتبوك</div>
  </body></html>`;
  const w = window.open('', '_blank'); w.document.write(h); w.document.close();
  setTimeout(() => w.print(), 600);
}

/* ═══ إضافة عمود مخصّص ═══ */
function addCol() {
  const cu = window.regCustom(KIND);
  const ov = document.createElement('div'); ov.className = 'tr-ov';

    <label>المجموعة التي يظهر فيها

    ${cu.length ? `<div class="nc-list"><b>الحقول المخصّصة الحالية</b>

        <button data-ncdel="${c.k}">✕</button></span>`).join('')}</div>` : ''}
    <div class="tr-act">
      <button class="btn g" id="ncSave">أضف الحقل</button>
      <button class="btn o" id="ncCancel">إغلاق</button>
    </div></div>`;
  document.body.appendChild(ov);
  const t = ov.querySelector('#ncType');

  ov.querySelector('#ncCancel').onclick = () => ov.remove();
  ov.querySelectorAll('[data-ncdel]').forEach(b => b.onclick = () => {
    window.regDelCol(KIND, b.dataset.ncdel); window.GRCAPP.save(); ov.remove(); render();
  });
  ov.querySelector('#ncSave').onclick = () => {
    const nm = ov.querySelector('#ncName').value.trim();
    if (!nm) { window.GRCAPP.toast('اكتب اسم الحقل'); return; }
    const col = { ar: nm, t: t.value, w: 150, kind: t.value === 'num' ? 'كمي' : 'نوعي' };
    if (t.value === 'select') col.opts = ov.querySelector('#ncOpts').value.split(',').map(x => x.trim()).filter(Boolean);
    window.regAddCol(KIND, col); window.GRCAPP.save(); ov.remove(); render();
    window.GRCAPP.toast('✅ أُضيف الحقل — يظهر في الجدول والتصدير');
  };
  ov.addEventListener('click', e => { if (e.target === ov) ov.remove(); });
}

function render() { const a = $('#app'); if (a) { a.innerHTML = view(); bind(); } }

function flashSave() {
  document.querySelectorAll('.sv-i').forEach(e => {
    e.textContent = '✅ حُفظ'; e.classList.add('on');
    clearTimeout(e._t);
    e._t = setTimeout(() => { e.textContent = '💾 يُحفظ تلقائياً'; e.classList.remove('on'); }, 1400);
  });
}

function bind() {
  if (window.I18) setTimeout(() => I18.sweep(document.body), 0);
  [...document.querySelectorAll('.back-bar [data-nav]')].forEach(b =>
    b.onclick = () => window.GRCAPP.go(b.dataset.nav));
  $$('[data-rk]').forEach(b => b.onclick = () => { KIND = b.dataset.rk; FILTER = ''; render(); });
  const ad = $('#regAdd'); if (ad) ad.onclick = () => editor(null);
  const ai = $('#regAI'); if (ai) ai.onclick = generate;
  const fx = $('#regXls'); if (fx) fx.onclick = toXls;
  const pr = $('#regPrint'); if (pr) pr.onclick = printReg;
  const nc = $('#regCol'); if (nc) nc.onclick = addCol;
  const fd = $('#regFind'); if (fd) fd.oninput = () => { FILTER = fd.value; const p = fd.selectionStart; render(); const n = $('#regFind'); if (n) { n.focus(); n.setSelectionRange(p, p); } };
  $$('[data-red]').forEach(b => b.onclick = () => editor(+b.dataset.red));
  $$('[data-rcp]').forEach(b => b.onclick = () => {
    const rows = data(); rows.push(Object.assign({}, rows[+b.dataset.rcp]));
    window.GRCAPP.save(); render(); window.GRCAPP.toast('⧉ نُسخ البند');
  });
  $$('[data-rdl]').forEach(b => b.onclick = () => {
    if (!confirm('حذف هذا البند نهائياً؟')) return;
    data().splice(+b.dataset.rdl, 1); window.GRCAPP.save(); render();
    window.GRCAPP.toast('🗑️ حُذف البند');
  });
}
return { view, bind, render };
})();

   horizon: 'سنة إلى خمس', owner: 'مدير البرنامج',

];

/* ═══ دراسة الجدوى ═══ */
const COST = [
 ['staff', 'الكوادر المخصّصة', 'وقت الفريق الداخلي وأي تعيينات جديدة'],
 ['tools', 'الأدوات والأنظمة', 'المنصات والتراخيص والتكامل'],
 ['consult', 'الاستشارات والتدريب', 'خبراء خارجيون وتأهيل الكوادر'],
 ['audit', 'الضمان والتدقيق', 'تقييمات مستقلة واعتمادات'],
 ['change', 'إدارة التغيير', 'التواصل والتوعية ومقاومة التغيير'],
 ['run', 'التشغيل السنوي', 'الكلفة المتكررة بعد التأسيس']
];
const BEN = [
 ['avoid', 'الخسائر المتفاداة', 'من تقدير المستشار الذكي — سوء السلوك والأخطاء وسوء التقدير'],
 ['fines', 'الغرامات والعقوبات المتفاداة', 'مخالفات نظامية كان يمكن أن تقع'],
 ['eff', 'كفاءة تشغيلية', 'إزالة الازدواج وتقليل إعادة العمل'],
 ['speed', 'تسريع القرار', 'وضوح الصلاحيات والحدود يختصر دورة الاعتماد'],
 ['opp', 'فرص مُقتنَصة', 'ما كان يفوت لغياب رصد أو تردّد في القرار'],
 ['rep', 'حماية السمعة والثقة', 'تُقدَّر بأثرها على العقود والتمويل']
];

function bag() { const s = ST(); s.feas = s.feas || { cost: {}, ben: {}, years: 3 }; return s.feas; }

function calc() {
  const F = bag();
  const cost = COST.reduce((a, c) => a + (parseFloat(F.cost[c[0]]) || 0), 0);
  const ben = BEN.reduce((a, c) => a + (parseFloat(F.ben[c[0]]) || 0), 0);
  const yrs = parseFloat(F.years) || 3;
  const run = parseFloat(F.cost.run) || 0;
  const setup = cost - run;
  const total = setup + run * yrs;
  const totalBen = ben * yrs;
  const net = totalBen - total;
  const roi = total ? (net / total * 100) : 0;
  const payback = ben > run ? (setup / (ben - run)) : 0;
  return { setup, run, cost, ben, yrs, total, totalBen, net, roi,
    payback: payback > 0 ? payback : 0,
    verdict: !total && !totalBen ? '' :
      roi >= 200 ? 'جدوى قوية جداً — يُعتمد' :
      roi >= 100 ? 'جدوى قوية — يُعتمد' :
      roi >= 30 ? 'جدوى مقبولة — يُعتمد بمتابعة' :
      roi >= 0 ? 'جدوى حدّية — راجع النطاق أو المرحلية' :
      'الكلفة تتجاوز المنفعة — قلّص النطاق أو ابدأ بنقطة بداية أضيق',
    col: roi >= 100 ? '#047857' : roi >= 30 ? '#0F766E' : roi >= 0 ? '#B4690E' : '#B3261E' };
}

  const A = window.ADVISOR ? window.ADVISOR.calc() : {};

    F.ben.avoid = Math.round(A.lossM * 0.45);

    F.ben.eff = Math.round(A.lossM * 0.10);
    F.ben.opp = Math.round(A.lossM * 0.08);
  }
  const band = emp < 50 ? 1 : emp < 250 ? 2.2 : emp < 1000 ? 4 : 7;
  F.cost.staff = Math.round(120000 * band);
  F.cost.tools = Math.round(60000 * band);
  F.cost.consult = Math.round(90000 * band);
  F.cost.audit = Math.round(40000 * band);
  F.cost.change = Math.round(30000 * band);
  F.cost.run = Math.round(70000 * band);
  window.GRCAPP.save(); window.GRCAPP.render();
  window.GRCAPP.toast('✨ قُدِّرت الأرقام من حجمك وتقدير المستشار — عدّلها بأرقامك الفعلية');
}

    <div><div class="l"></div><b>اعتمدها</b><br><span>السلطة الحاكمة</span></div>
  </div>
  <div class="cr">${CR}</div></body></html>`;
  const w = window.open('', '_blank'); w.document.write(html); w.document.close();
  setTimeout(() => w.print(), 700);
}

function bind() {
  if (window.I18) setTimeout(() => I18.sweep(document.body), 0);
  const F = bag();
  $$('[data-fsc]').forEach(b => b.onclick = () => {
    F.scope = F.scope === b.dataset.fsc ? '' : b.dataset.fsc;
    /* يُحدَّث نطاق المنظمة تلقائياً */
    if (F.scope === 'enterprise') ST().org.scope = 'منشأة';
    window.GRCAPP.save(); window.GRCAPP.render();
  });
  $$('[data-ff]').forEach(i => i.oninput = i.onchange = () => {
    F[i.dataset.ff] = i.value; window.GRCAPP.save();
    if (i.dataset.ff === 'years') window.GRCAPP.render();
  });
  $$('[data-fc]').forEach(i => i.oninput = () => { F.cost[i.dataset.fc] = i.value; window.GRCAPP.save(); live(); });
  $$('[data-fb]').forEach(i => i.oninput = () => { F.ben[i.dataset.fb] = i.value; window.GRCAPP.save(); live(); });
  const a = $('#fsAI'); if (a) a.onclick = suggest;
  const p = $('#fsPrint'); if (p) p.onclick = print_;
}
function live() {
  const C = calc();
  const r = $('.fs-res'); if (!r) { window.GRCAPP.render(); return; }
  r.style.borderColor = C.col;
  const vals = [fmt(C.total), fmt(C.totalBen), fmt(C.net), Math.round(C.roi) + '%',
    C.payback ? C.payback.toFixed(1) + ' سنة' : '—'];
  $$('.fr b').forEach((b, i) => { b.textContent = vals[i]; if (i >= 2) b.style.color = C.col; });
  const v = $('.fr-v'); if (v) { v.textContent = C.verdict; v.style.background = C.col; }
  const ts = $$('.fs-t b');
  if (ts[0]) ts[0].textContent = fmt(C.setup);
  if (ts[1]) ts[1].textContent = fmt(C.run);
  if (ts[2]) ts[2].textContent = fmt(C.ben);
}
return { view, bind, calc, SCOPES };
})();
</script>
<script>/* ============================================================
   نظام السعيد GRC™ — بوابة المكوّن
   تقييم الأداء الشامل للمكوّن ← ملخّص مخرجاته ← توقيع الإدارة
   ولا يُفتح المكوّن التالي إلا بعد التوقيع
   تصميم وبرمجة: د. محمد عطية
   ============================================================ */
window.GATE = (function () {
'use strict';
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => (s == null ? '' : String(s)).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const ST = () => window.GRCAPP.ST();
const EN = () => window.I18 && window.I18.lang === 'en';
const GT = (a, e) => EN() ? e : a;

const DIMS_AR = [
  ['الفعالية', 'Effective', 'هل حقّق المكوّن غرضه المقصود؟'],
  ['الكفاءة', 'Efficient', 'بأي كلفة من المال والوقت والجهد؟'],
  ['الاستجابة', 'Responsive', 'ما سرعة تكيّفه مع التغيّر؟'],
  ['المرونة', 'Resilient', 'هل يتحمّل الاضطراب ويتعافى؟']
];
const DIMS_EN = [
  ['Effectiveness', 'Effective', 'Did the component achieve its intended purpose?'],
  ['Efficiency', 'Efficient', 'At what cost in money, time and effort?'],
  ['Responsiveness', 'Responsive', 'How quickly does it adapt to change?'],
  ['Resilience', 'Resilient', 'Does it withstand disruption and recover?']
];
const dims = () => EN() ? DIMS_EN : DIMS_AR;
const ORDER = ['L', 'A', 'P', 'R'];

function bag(k) {
  const s = ST(); s.gates = s.gates || {};
  s.gates[k] = s.gates[k] || { tp: {}, notes: '', sig: null, outputs: {} };
  return s.gates[k];
}
function tpScore(tp) {
  const v = Object.values(tp || {}).filter(x => x != null);
  return v.length ? Math.round(v.reduce((a, b) => a + b, 0) / (v.length * 4) * 100) : 0;
}
/* هل وُقّع المكوّن؟ */
window.gateSigned = function (k) { const g = (ST().gates || {})[k]; return !!(g && g.sig); };
/* المكوّنات مفتوحة جميعاً — والتوقيع توصية مهنية لا قيد تقني.
   gateAdvised تُستخدم لعرض تنبيه لطيف لا لمنع الدخول. */
window.gateOpen = function () { return true; };
window.gateAdvised = function (k) {
  const i = ORDER.indexOf(k);
  return i <= 0 ? true : window.gateSigned(ORDER[i - 1]);
};

/* ═══ ملخّص مخرجات المكوّن ═══ */
function outputs(k) {
  const S = ST(), out = [];
  const has = d => d && Object.values(d).some(v => Array.isArray(v) ? v.length
    : (v && typeof v === 'object' ? Object.keys(v).length : String(v || '').trim()));
  const comp = (window.GRC_MODEL || []).find(c => c.k === k);
  if (!comp) return out;

  comp.els.forEach(e => {
    e.tools.forEach(t => {
      const d = (S.tools || {})[t.id];
      if (!has(d)) return;
      const rows = Object.values(d).find(v => Array.isArray(v));
      out.push({ el: e.c, elAr: e.ar, tool: t.ar,
        n: rows ? rows.length : 1,
        note: rows ? `${rows.length} بند` : 'مكتملة' });
    });
  });

  /* مخرجات الأدوات المتقدّمة */
  if (k === 'A') {
    const T = S.tech || {}, R = S.registers || {};
    if ((T.obj || []).length) out.push({ el: 'A2', elAr: 'الأهداف', tool: 'جدول الأهداف والمؤشرات', n: T.obj.length, note: `${T.obj.length} هدفاً بمؤشراته` });
    ['risk', 'opp', 'obl'].forEach((rk, i) => {
      if ((R[rk] || []).length) out.push({ el: 'A3', elAr: 'التحديد',
        tool: ['سجل المخاطر', 'سجل الفرص', 'سجل الالتزامات'][i], n: R[rk].length, note: `${R[rk].length} بند` });
    });
    ['par', 'fmea'].forEach((tk, i) => {
      if ((T[tk] || []).length) out.push({ el: 'A4', elAr: 'التحليل',
        tool: ['تحليل باريتو', 'تحليل FMEA'][i], n: T[tk].length, note: `${T[tk].length} بند` });
    });
    if (T.whyP && String(T.whyP.w5 || '').trim()) out.push({ el: 'A4', elAr: 'التحليل', tool: 'الأسئلة الخمسة', n: 1, note: 'سبب جذري محدَّد' });
    if ((T.cba || []).length) out.push({ el: 'A5', elAr: 'التصميم', tool: 'التكلفة والمنفعة', n: T.cba.length, note: `${T.cba.length} قرار` });
  }
  if (k === 'P') {
    const P = S.perf || {};
    if ((P.ctrl || []).length) out.push({ el: 'P1', elAr: 'الضوابط', tool: 'مصفوفة الضوابط', n: P.ctrl.length, note: `${P.ctrl.length} ضابط` });
    const cn = Object.values(P.coso || {}).filter(Boolean).length;
    if (cn) out.push({ el: 'P1', elAr: 'الضوابط', tool: 'إطار COSO', n: cn, note: `${cn}/17 مبدأً` });
    const pols = Object.keys(P.pol || {}).length;
    if (pols) out.push({ el: 'P2', elAr: 'السياسات', tool: 'مكتبة السياسات', n: pols, note: `${pols} سياسة` });
    if ((P.edu || []).length) out.push({ el: 'P4', elAr: 'التعليم', tool: 'خطة التعليم', n: P.edu.length, note: `${P.edu.length} برنامج` });
    if ((P.inc || []).length) out.push({ el: 'P5', elAr: 'الحوافز', tool: 'تصميم الحوافز', n: P.inc.length, note: `${P.inc.length} حافز` });
  }
  return out;
}

/* ما يُغذّيه هذا المكوّن في التالي */
const FEEDS = {
  L: ['السياق الخارجي والداخلي ← تحديد الفرص والعقبات في A3',
      'الثقافة ← تصميم الحوافز في P5 وقنوات الإبلاغ في P6',
      'أصحاب المصلحة ← صياغة الاتجاه في A1 والأهداف في A2'],
  A: ['الأهداف ومؤشراتها ← لوحة الرصد في R1',
      'السجل الموحّد والتحليل ← تصميم الضوابط في A5 ثم تنفيذها في P1',
      'حدود التحمّل ← اختبار كفاية الضوابط'],
  P: ['الضوابط ودليل تشغيلها ← خطة الضمان في R2',
      'السياسات ومؤشراتها ← قياس الالتزام في R1',
      'الاستجابة وتحليل الجذور ← سجل الدروس في R3'],
  R: ['المؤشرات والدروس ← تعود بالدراسة L من جديد',
      'فجوات الضمان ← تعديل التصميم في A5',
      'التحسينات ← تحديث الضوابط في P1']
};

/* ═══ الواجهة ═══ */
function view(k) {
  const comp = (window.GRC_MODEL || []).find(c => c.k === k);
  if (!comp) return '';
  const g = bag(k), sc = tpScore(g.tp);
  const outs = outputs(k);
  const i = ORDER.indexOf(k);
  const nxt = ORDER[i + 1];
  const nxtC = nxt ? (window.GRC_MODEL || []).find(c => c.k === nxt) : null;

  return `<div class="wrap">

      <h1>${GT('ملخّص مكوّن ' + comp.ar + ' واعتماده', comp.en + ' Component — Summary & Approval')}</h1>
      <p>${GT('قيّم الأداء الشامل للمكوّن، راجع مخرجاته، ثم اعتمده بتوقيع الإدارة.',
        'Assess total performance, review outputs, then approve with a management signature.')}</p>
    </div>

  <div class="card pad">

    <p class="hint">${GT('قيّم كل بُعد من 0 (غير موجود) إلى 4 (ناضج تماماً) — لهذا المكوّن تحديداً.',
      'Rate each dimension from 0 (absent) to 4 (fully mature) — for this component.')}</p>
    ${dims().map((d, j) => `<div class="lk">

      <div class="lk-g">${[0, 1, 2, 3, 4].map(v =>

    </div>`).join('')}
    <div class="res"><b>${sc}%</b> ${GT('الأداء الشامل لهذا المكوّن','total performance')}
      ${ready ? '' : `<span style="color:#B4690E">— ${GT('قيّم الأبعاد الأربعة لإتمام التقييم','rate all four dimensions')}</span>`}</div>

  <div class="card pad">

      <thead><tr><th>${GT('العنصر','Element')}</th><th>${GT('الأداة / التقنية','Tool / Technique')}</th><th>${GT('المخرَج','Output')}</th></tr></thead>
      <tbody>${outs.map(o => `<tr>
        <td><b>${o.el}</b> — ${esc(o.elAr)}</td><td>${esc(o.tool)}</td><td>${esc(o.note)}</td></tr>`).join('')}</tbody>
    </table></div>`
      : `<div class="warn">${GT('لم تُكمل أي أداة في هذا المكوّن بعد.','No tool completed in this component yet.')}</div>`}

    <div class="feeds">
      <b>⬅ ${GT('ما يُغذّيه هذا المكوّن','What this component feeds')}</b>
      ${(FEEDS[k] || []).map(f => `<div class="fd">${esc(f)}</div>`).join('')}
    </div>

    <label class="full mt">${GT('ملخّص تنفيذي للمكوّن — قابل للتعديل','Component executive summary — editable')}
      <textarea id="gNotes" rows="4" placeholder="${GT('اكتب خلاصة ما أُنجز في هذا المكوّن وأبرز قراراته…','Summarise what was accomplished and key decisions…')}">${esc(g.notes || '')}</textarea></label>
    <button class="btn b sm" id="gAI">✨ ${GT('توليد الملخّص','Generate summary')}</button>
    <button class="btn o sm" id="gRep">📄 ${GT('تقرير المكوّن','Component report')}</button>
  </div>

  <div class="card pad">
    <h3>③ ${GT('اعتماد الإدارة','Management approval')}</h3>
    ${g.sig ? `<div class="gate-ok">
        <div>${window.ESign.render(g.sig)}</div>
        <div class="go-t"><b>✓ ${GT('اعتُمد المكوّن','Component approved')}</b>
          <span>${GT('وُقّع في','Signed on')} ${new Date(g.sig.at).toLocaleString(EN()?'en-GB':'ar-SA')}</span></div>
        <button class="btn o sm" id="gUnsign">${GT('سحب الاعتماد للتعديل','Withdraw approval')}</button>
      </div>`
      : `<p class="hint">${GT('يُعرض ملخّص المكوّن ومخرجاته على الإدارة للاعتماد. التوقيع توصية مهنية توثّق المراجعة.',
          'The summary and outputs are presented to management for approval. The signature documents the review.')}</p>
        <button class="btn g" id="gSign">✍️ ${GT('اعتماد المكوّن بالتوقيع الإلكتروني','Approve with e-signature')}</button>`}
  </div>

  <div class="act">
    <button class="btn o" data-nav="comp:${k}">◀ ${GT('رجوع لعناصر المكوّن','Back to elements')}</button>
    ${nxtC ? `<button class="btn g" data-nav="comp:${nxt}">التالي · مكوّن ${esc(nxtC.ar)} ◀</button>`
      : `<button class="btn g" data-nav="after">التقييم البعدي ◀</button>`}
  </div></div>`;
}

    outs.length ? `اكتملت ${outs.length} أداة/تقنية عبر عناصر المكوّن، وأنتجت: ${outs.slice(0, 4).map(x => x.tool + ' (' + x.note + ')').join(' · ')}${outs.length > 4 ? ' وغيرها' : ''}.` : '',
    sc ? `بلغ الأداء الشامل لهذا المكوّن ${sc}% عبر أبعاده الأربعة${sc >= 70 ? ' — وهو مستوى جيد يمكن البناء عليه' : sc >= 45 ? ' — ويحتاج تعزيزاً في الأبعاد الأضعف' : ' — ويستدعي معالجة قبل التوسّع'}.`: '',
    `وتنتقل مخرجات هذا المكوّن مدخلاتٍ للمكوّن التالي: ${(FEEDS[k] || [])[0] || ''}`,
    `يُرفع هذا الملخّص للإدارة للاعتماد قبل الانتقال.`
  ].filter(Boolean);
  g.notes = lines.join('\n\n');
  window.GRCAPP.save(); window.GRCAPP.render();

}

  const CR = 'نظام السعيد GRC — تصميم وإعداد وبرمجة: د. محمد عطية · تحت إشراف الأكاديمية الشمالية الغربية بتبوك';

  <div class="dims">${dims().map((d, j) => `<div class="dm"><b>${g.tp[j] != null ? g.tp[j] : '—'}/4</b>

    <div><div class="l"></div><b>السلطة الحاكمة</b><br><span>الاعتماد النهائي</span></div>
  </div>
  <div class="cr">${CR}${g.sig ? ' · رقم التوقيع: ' + esc(g.sig.id) : ''}</div>
  </body></html>`;
  const w = window.open('', '_blank'); w.document.write(html); w.document.close();
  setTimeout(() => w.print(), 700);
}

function bind(k) {
  $$('[data-gtp]').forEach(b => b.onclick = () => {
    const [ck, j] = b.dataset.gtp.split('|');
    const g = bag(ck); g.tp[+j] = +b.dataset.v;
    /* يُحدَّث التقييم الشامل تلقائياً */
    const S = ST(); S.after = S.after || {}; S.after.tpC = S.after.tpC || {};
    S.after.tpC[ck] = g.tp;
    window.GRCAPP.save(); window.GRCAPP.render();
  });
  const n = $('#gNotes'); if (n) n.oninput = () => { bag(k).notes = n.value; window.GRCAPP.save(); };
  const a = $('#gAI'); if (a) a.onclick = () => genNotes(k);
  const r = $('#gRep'); if (r) r.onclick = () => report(k);
  const s = $('#gSign'); if (s) s.onclick = () => {
    const comp = (window.GRC_MODEL || []).find(c => c.k === k);
    window.ESign.open(`اعتماد مكوّن ${comp.ar}`, sig => {
      bag(k).sig = sig; window.GRCAPP.save(); window.GRCAPP.render();
      window.GRCAPP.toast('✅ اعتُمد المكوّن — فُتح المكوّن التالي');
    }, bag(k).sig);
  };
  const u = $('#gUnsign'); if (u) u.onclick = () => {
    if (!confirm('سحب الاعتماد؟ سيُغلق المكوّن التالي حتى تعيد التوقيع.')) return;
    bag(k).sig = null; window.GRCAPP.save(); window.GRCAPP.render();
  };
  $$('.act [data-nav]').forEach(b => b.onclick = () => {
    if (b.hasAttribute('disabled')) { window.GRCAPP.toast('وقّع المكوّن أولاً للانتقال'); return; }
    window.GRCAPP.go(b.dataset.nav);
  });
}
return { view, bind, outputs, tpScore, dims, ORDER };
})();
</script>
<script>/* ============================================================
   نظام السعيد GRC™ — لوحة المؤشرات (Dashboard)
   رسوم SVG خالصة بلا مكتبات — تعمل بلا إنترنت
   تصميم وبرمجة: د. محمد عطية
   ============================================================ */
window.DASH = (function () {
'use strict';
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => (s == null ? '' : String(s)).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
const ST = () => window.GRCAPP.ST();
const EN = () => window.I18 && window.I18.lang === 'en';
const DT = (a, e) => EN() ? e : a;
const fmt = n => Math.round(n || 0).toLocaleString('en-US');

/* ═══════════ 1) جمع كل المقاييس ═══════════ */
function metrics() {
  const s = ST(), o = s.org || {};
  const A = window.GRCAPP;

  /* الأدوات والعناصر */
  const toolsDone = (window.GRC_TOOLS || []).filter(t => {
    const d = (s.tools || {})[t.id];
    return d && Object.values(d).some(v => Array.isArray(v) ? v.length
      : (v && typeof v === 'object' ? Object.keys(v).length : String(v || '').trim()));
  }).length;
  const toolsAll = (window.GRC_TOOLS || []).length || 1;
  const elsDone = (window.GRC_ELEMENTS || []).filter(e =>
    e.tools.some(t => (s.tools || {})[t.id])).length;

  /* النضج والأداء لكل مكوّن */
  const comps = (window.GRC_MODEL || []).map(c => {
    const tp = ((s.baseline || {}).tpC || {})[c.k] || {};
    const tpA = ((s.after || {}).tpC || {})[c.k] || {};
    return {
      k: c.k, ar: c.ar, en: c.en, col: c.col, w: c.w,
      matB: ((s.baseline || {}).matC || {})[c.k] || 0,
      matA: ((s.after || {}).matC || {})[c.k] || 0,
      tpB: A.tpScore(tp), tpA: A.tpScore(tpA),
      els: c.els.length,
      done: c.els.filter(e => e.tools.some(t => (s.tools || {})[t.id])).length
    };
  });

  /* الأداء الشامل بأبعاده */
  const dims = ['الفعالية', 'الكفاءة', 'الاستجابة', 'المرونة'].map((d, i) => {
    const b = [], a = [];
    (window.GRC_MODEL || []).forEach(c => {
      const tb = ((s.baseline || {}).tpC || {})[c.k];
      const ta = ((s.after || {}).tpC || {})[c.k];
      if (tb && tb[i] != null) b.push(tb[i]);
      if (ta && ta[i] != null) a.push(ta[i]);
    });
    return { d,
      b: b.length ? Math.round(b.reduce((x, y) => x + y, 0) / (b.length * 4) * 100) : 0,
      a: a.length ? Math.round(a.reduce((x, y) => x + y, 0) / (a.length * 4) * 100) : 0 };
  });

  /* السجلات */
  const R = s.registers || {};
  const regs = ['risk', 'opp', 'obl'].map(k => {
    const rows = R[k] || [];
    const vs = rows.map(r => window.regCompute ? window.regCompute(r) : {});
    return { k, n: rows.length,
      high: vs.filter(v => v.V1 >= 20).length,
      treated: rows.filter(r => r.resp).length,
      red: (() => { const a = vs.filter(v => v.red).map(v => parseInt(v.red));
        return a.length ? Math.round(a.reduce((x, y) => x + y, 0) / a.length) : 0; })() };
  });
  const riskDist = {};
  (R.risk || []).forEach(r => {
    const v = window.regCompute ? window.regCompute(r) : {};
    const g = window.regGrade ? window.regGrade(v.V1)[0] : '';
    if (g && g !== '—') riskDist[g] = (riskDist[g] || 0) + 1;
  });

  /* الضوابط */
  const ctrls = (s.perf || {}).ctrl || [];
  const ctrlMix = { 'استباقي': 0, 'كشفي': 0, 'استجابي': 0 };
  ctrls.forEach(c => { if (ctrlMix[c.type] != null) ctrlMix[c.type]++; });
  const ctrlEff = ctrls.filter(c => c.eff === 'فعّال' && c.opeff === 'فعّال').length;
  const ctrlUntested = ctrls.filter(c => c.opeff === 'لم يُختبر').length;

  /* COSO */
  const coso = (s.perf || {}).coso || {};
  const cosoDone = Object.values(coso).filter(Boolean).length;

  /* المؤشرات */
  const ind = ((s.outputs || {}).indicators || {}).rows || [];
  const indKinds = { KPI: 0, KRI: 0, KCI: 0 };
  ind.forEach(i => { if (indKinds[i.type] != null) indKinds[i.type]++; });
  const leading = ind.filter(i => /متقدّم/.test(i.lead || '')).length;

  /* الثقافة */
  const cul = window.ADVISOR ? window.ADVISOR.cultureScore() : null;
  const culItems = (() => {
    const t = (s.tools || {}).culsurvey;
    if (!t || !t.scale) return [];
    const labels = EN()
      ? ['Leaders act on the values', 'Safety escalating bad news', 'Reporters rewarded not punished',
         'Mistakes are learning', 'Sanction consistency by rank', 'Culture measured periodically']
      : ['القادة يتصرفون وفق القيم', 'الأمان عند نقل خبر سيئ', 'يُكافأ المبلّغ لا يُعاقب',
         'الأخطاء فرصة تعلّم', 'اتساق العقوبة مهما كانت الرتبة', 'الثقافة تُقاس دورياً'];
    return labels.map((l, i) => ({ l, v: t.scale[i] != null ? t.scale[i] : null }))
      .filter(x => x.v != null);
  })();

  /* الممارسات */
  const pr = s.practices || {};
  const prAll = Object.values(window.PRACTICES || {}).reduce((a, v) => a + v.length, 0);
  const prDone = Object.values(pr).reduce((a, v) => a + Object.values(v).filter(Boolean).length, 0);

  /* التناقضات */
  const chk = window.CHECK ? window.CHECK.run() : [];
  const chkHigh = chk.filter(f => f.sev === 'high').length;
  const chkMed = chk.filter(f => f.sev === 'med').length;
  const consistency = Math.max(0, 100 - chkHigh * 12 - chkMed * 5 - (chk.length - chkHigh - chkMed) * 2);

  /* المستشار */
  const adv = window.ADVISOR ? window.ADVISOR.calc() : {};

  return { o, toolsDone, toolsAll, elsDone, comps, dims, regs, riskDist,
    ctrls: ctrls.length, ctrlMix, ctrlEff, ctrlUntested, cosoDone,
    ind: ind.length, indKinds, leading, cul, culItems, prAll, prDone,
    chk: chk.length, chkHigh, chkMed, consistency, adv,
    pct: Math.round(toolsDone / toolsAll * 100),
    matB: window.GRCAPP.allMat('baseline'), matA: window.GRCAPP.allMat('after'),
    tpB: window.GRCAPP.allTP('baseline'), tpA: window.GRCAPP.allTP('after') };
}

/* ═══════════ 2) رسوم SVG ═══════════ */
function donut(val, max, col, label, sub, size) {
  size = size || 132;
  const r = size / 2 - 12, c = 2 * Math.PI * r;
  const p = max ? Math.min(1, val / max) : 0;
  return `<svg viewBox="0 0 ${size} ${size}" class="dn">
    <circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="#E7EEF5" stroke-width="11"/>
    <circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="${col}" stroke-width="11"
      stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c * (1 - p)}"
      transform="rotate(-90 ${size / 2} ${size / 2})"/>
    <text x="${size / 2}" y="${size / 2 - 2}" text-anchor="middle" class="dn-v" fill="${col}">${label}</text>
    <text x="${size / 2}" y="${size / 2 + 16}" text-anchor="middle" class="dn-s">${esc(sub || '')}</text>
  </svg>`;
}

function bars(items, max, w, h) {
  w = w || 100; h = h || 150;
  const n = items.length || 1;
  const bw = (w - (n + 1) * 3) / n;
  return `<svg viewBox="0 0 ${w} ${h + 22}" class="bx">
    ${items.map((it, i) => {
      const bh = max ? (it.v / max) * h : 0;
      const x = 3 + i * (bw + 3);
      return `<g>
        <rect x="${x}" y="${h - bh}" width="${bw}" height="${Math.max(bh, 1)}"
          rx="2" fill="${it.c}"/>
        <text x="${x + bw / 2}" y="${h - bh - 3}" text-anchor="middle" class="bx-v">${it.v}</text>
        <text x="${x + bw / 2}" y="${h + 12}" text-anchor="middle" class="bx-l">${esc(it.l)}</text>
      </g>`;
    }).join('')}
  </svg>`;
}

/* رادار للأبعاد الأربعة */
function radar(dims) {
  const cx = 100, cy = 95, R = 72, n = dims.length;
  const pt = (i, v) => {
    const a = (Math.PI * 2 * i / n) - Math.PI / 2;
    const r = R * (v / 100);
    return [cx + r * Math.cos(a), cy + r * Math.sin(a)];
  };
  const poly = vals => vals.map((v, i) => pt(i, v).join(',')).join(' ');
  const grid = [25, 50, 75, 100].map(g =>
    `<polygon points="${poly(dims.map(() => g))}" fill="none" stroke="#E7EEF5" stroke-width="1"/>`).join('');
  const axes = dims.map((d, i) => {
    const [x, y] = pt(i, 108);
    return `<line x1="${cx}" y1="${cy}" x2="${pt(i, 100)[0]}" y2="${pt(i, 100)[1]}"
      stroke="#E7EEF5" stroke-width="1"/>
      <text x="${x}" y="${y}" text-anchor="middle" class="rd-l">${esc(d.d)}</text>`;
  }).join('');
  const hasA = dims.some(d => d.a);
  return `<svg viewBox="0 0 200 200" class="rdr">
    ${grid}${axes}
    <polygon points="${poly(dims.map(d => d.b))}" fill="#8A9AAE33" stroke="#8A9AAE" stroke-width="2"/>
    ${hasA ? `<polygon points="${poly(dims.map(d => d.a))}" fill="#04785733" stroke="#047857" stroke-width="2.5"/>` : ''}
  </svg>`;
}

/* شريط تقدم أفقي */
function hbar(label, val, max, col, note) {
  const p = max ? Math.min(100, val / max * 100) : 0;
  return `<div class="hb">
    <span class="hb-l">${esc(label)}</span>
    <div class="hb-t"><i style="width:${p}%;background:${col}"></i></div>
    <b class="hb-v">${esc(note != null ? note : val)}</b>
  </div>`;
}

/* ═══════════ 3) الشاشة ═══════════ */
function view() {

  const gcols = { 'خطر حرج': '#7A1F17', 'خطر عالٍ': '#B3261E', 'خطر متوسط': '#B4690E',
    'خطر منخفض': '#0F766E', 'خطر ضئيل': '#047857' };

  return `<div class="wrap">

    <div class="dk-c">

      <b>${DT('درجة الاتساق','Consistency score')}</b><span>${m.chkHigh} ${DT('حرجة','critical')} · ${m.chkMed} ${DT('متوسطة','moderate')}</span></div>
  </div>

  <div class="dg2">
    <!-- قبل وبعد -->

          ${hbar('قبل', m.tpB, 100, '#8A9AAE', m.tpB + '%')}
          ${hbar('بعد', m.tpA, 100, '#047857', m.tpA + '%')}
          <div class="ba-d ${dTp >= 0 ? 'up' : 'dn'}">${dTp >= 0 ? '▲ +' : '▼ '}${dTp}%</div>
        </div>
        <div class="ba2-c">
          <span>${DT('مستوى النضج','Maturity')}</span>

          ${hbar('بعد', m.matA, 5, '#047857', m.matA.toFixed(1))}
          <div class="ba-d ${dMat >= 0 ? 'up' : 'dn'}">${dMat >= 0 ? '▲ +' : '▼ '}${dMat.toFixed(1)}</div>
        </div>
      </div>
      ${!m.tpA ? '<p class="hint">أكمل «التقييم البعدي» لتظهر المقارنة.</p>' : ''}
    </div>

    <!-- رادار الأداء الشامل -->
    <div class="card pad">
      <h3>${DT('الأداء الشامل — الأبعاد الأربعة','Total Performance — four dimensions')}</h3>
      ${radar(m.dims)}
      <div class="rd-leg">
        <span class="rl2"><i style="background:#8A9AAE"></i> قبل</span>
        ${m.dims.some(d => d.a) ? '<span class="rl2"><i style="background:#047857"></i> بعد</span>' : ''}
      </div>
      <div class="rd-v">${m.dims.map(d => `<span>${esc(d.d)} <b>${d.a || d.b}%</b></span>`).join('')}</div>
    </div>
  </div>

  <!-- المكوّنات الأربعة -->
  <div class="card pad">
    <h3>${DT('المكوّنات الأربعة — الاكتمال والنضج','The Four Components — completion and maturity')}</h3>
    <div class="cmp-g">
      ${m.comps.map(c => `<div class="cmp-k" style="border-top-color:${c.col}">
        <div class="cmp-kh"><b style="color:${c.col}">${esc(c.ar)}</b>
          <em class="en">${c.en} · ${c.w}%</em></div>
        ${hbar('العناصر', c.done, c.els, c.col, `${c.done}/${c.els}`)}
        ${hbar('النضج', c.matA || c.matB, 5, '#C8791A', (c.matA || c.matB) || '—')}
        ${hbar('الأداء', c.tpA || c.tpB, 100, '#047857', (c.tpA || c.tpB) + '%')}
      </div>`).join('')}
    </div>

  <div class="dg2">

      <div class="dg-row">
        ${bars([
          { l: DT('مخاطر','Risks'), v: m.regs[0].n, c: '#B3261E' },
          { l: DT('فرص','Opps'), v: m.regs[1].n, c: '#047857' },

        <div class="dg-s">
          ${m.regs.map((r, i) => `<div class="ds-i">
            <b>${[DT('المخاطر','Risks'), DT('الفرص','Opportunities'), DT('الالتزامات','Obligations')][i]}</b>
            <span>${r.n} ${DT('بند','items')} · ${r.high} ${DT('حرج/عالٍ','critical/high')}</span>
            <em>${r.treated} ${DT('بخطة استجابة','with response plan')}${r.red ? ` · ${DT('تخفيض','reduction')} ${r.red}%` : ''}</em>

        </div>
      </div>
      ${Object.keys(m.riskDist).length ? `<div class="rdist">
        ${grades.filter(g => m.riskDist[g]).map(g => `<div class="rd-b" style="background:${gcols[g]}"

      </div>
      <div class="rd-lg">${grades.filter(g => m.riskDist[g]).map(g =>

    </div>

    <!-- الضوابط -->

          <div class="ds-i"><b style="color:#B4690E">${m.ctrlUntested}</b><span>${DT('بلا دليل تشغيل','without evidence')}</span></div>
        </div>

      ${hbar(DT('مبادئ COSO المُطبَّقة','COSO principles applied'), m.cosoDone, 17, '#0B2545', `${m.cosoDone}/17`)}
      ${hbar(DT('ممارسات الكتاب الأحمر','Red Book practices'), m.prDone, m.prAll || 118, '#C8791A', `${m.prDone}/${m.prAll || 118}`)}
    </div>
  </div>

  <div class="dg2">
    <!-- المؤشرات -->
    <div class="card pad">
      <h3>${DT('المؤشرات','Indicators')}</h3>
      <div class="dg-row">
        ${bars([
          { l: 'KPI', v: m.indKinds.KPI, c: '#047857' },
          { l: 'KRI', v: m.indKinds.KRI, c: '#B3261E' },
          { l: 'KCI', v: m.indKinds.KCI, c: '#1256A0' }
        ], Math.max(...Object.values(m.indKinds), 1), 110, 120)}
        <div class="dg-s">
          <div class="ds-i"><b>${m.ind}</b><span>${DT('مؤشراً مسجّلاً','indicators recorded')}</span></div>
          <div class="ds-i"><b style="color:${m.leading ? '#047857' : '#B3261E'}">${m.leading}</b>
            <span>${DT('متقدّم ينذر قبل الحدث','leading, warns before the event')}</span></div>
          ${!m.leading && m.ind ? '<em class="ds-w">⚠️ كل مؤشراتك متأخرة — قيادةٌ بالنظر في المرآة</em>' : ''}
        </div>
      </div>
    </div>

    <!-- الثقافة -->

/* ═══ الربط ═══ */
function render() { const a = $('#app'); if (a) { a.innerHTML = view(); bind(); } }
function refresh() { const b = $('#perfBody'); if (b) { b.innerHTML = body(); bind(); } }
function readGrid(id) {
  const t = $(`[data-grid="${id}"]`); if (!t) return null;
  return [...t.querySelectorAll('tbody tr')].map(tr => {
    const r = {}; tr.querySelectorAll('[data-c]').forEach(i => r[i.dataset.c] = i.value); return r;
  }).filter(r => Object.values(r).some(v => String(v || '').trim()));
}
function saveGrid(id) {
  const d = readGrid(id); if (!d) return;
  const s = ST(); s.perf = s.perf || {}; s.perf[id] = d; window.GRCAPP.save();
}
function liveRow(table, tr) {
  const id = table.dataset.grid, cols = GRIDS[id]();
  const r = {}; tr.querySelectorAll('[data-c]').forEach(x => r[x.dataset.c] = x.value);
  const c = CALC[id](r);
  const cells = tr.querySelectorAll('.rc-c');
  cols.filter(x => x.t === 'calc').forEach((col, i) => {
    if (!cells[i]) return;
    cells[i].textContent = c[col.k] || '';
    cells[i].style.cssText = c.col ? `color:${c.col};font-weight:700` : '';
  });
}

function flashSave() {
  document.querySelectorAll('.sv-i').forEach(e => {
    e.textContent = '✅ حُفظ'; e.classList.add('on');
    clearTimeout(e._t);
    e._t = setTimeout(() => { e.textContent = '💾 يُحفظ تلقائياً'; e.classList.remove('on'); }, 1400);
  });
}

function bind() {
  if (window.I18) setTimeout(() => I18.sweep(document.body), 0);
  [...document.querySelectorAll('.back-bar [data-nav]')].forEach(b =>
    b.onclick = () => window.GRCAPP.go(b.dataset.nav));
  $$('[data-pt]').forEach(b => b.onclick = () => { TAB = b.dataset.pt; render(); });
  $$('[data-add]').forEach(b => b.onclick = () => {
    const id = b.dataset.add; saveGrid(id); bag(id).push({}); window.GRCAPP.save(); refresh();
  });
  $$('[data-del]').forEach(b => b.onclick = () => {
    const t = b.closest('[data-grid]'); if (!t) return;
    saveGrid(t.dataset.grid); bag(t.dataset.grid).splice(+b.dataset.del, 1);
    window.GRCAPP.save(); refresh();
  });
  $$('.tech-t [data-c]').forEach(i => i.oninput = i.onchange = () => {
    const t = i.closest('[data-grid]'); if (!t) return;
    saveGrid(t.dataset.grid); liveRow(t, i.closest('tr')); flashSave();
  });
  $$('[data-coso]').forEach(c => c.onchange = () => {
    const s = ST(); s.perf.coso = s.perf.coso || {};
    s.perf.coso[c.dataset.coso] = c.checked; window.GRCAPP.save(); refresh();
  });
  $$('[data-pstage]').forEach(c => c.onchange = () => {
    const s = ST(); s.perf.polStage = s.perf.polStage || {};
    s.perf.polStage[c.dataset.pstage] = c.checked; window.GRCAPP.save(); refresh();
  });
  $$('[data-psel]').forEach(b => b.onclick = () => {
    const s = ST(); s.perf.polSel = b.dataset.psel; window.GRCAPP.save(); refresh();
  });
  $$('[data-pol]').forEach(t => t.oninput = t.onchange = () => {
    const s = ST(), sel = s.perf.polSel || 'gov';
    s.perf.pol = s.perf.pol || {}; s.perf.pol[sel] = s.perf.pol[sel] || {};
    s.perf.pol[sel][t.dataset.pol] = t.value; window.GRCAPP.save();
  });
  const m = { ctrlAI: genCtrl, polAI: genPol, eduAI: genEdu, incAI: genInc,
              polDoc: exportPolicy, ctrlXls: xlsCtrl };
  Object.entries(m).forEach(([k, f]) => { const e = $('#' + k); if (e) e.onclick = f; });
}
return { view, bind, render };
})();

/* حسابات التقنيات */
window.paretoCalc = function (rows) {
  const vals = rows.map(r => parseFloat(r.freq) || 0);
  const tot = vals.reduce((a, b) => a + b, 0) || 1;
  const idx = rows.map((r, i) => ({ i, v: vals[i] })).sort((a, b) => b.v - a.v);
  const out = rows.map(() => ({}));
  let cum = 0;
  idx.forEach(({ i, v }) => {
    const pct = v / tot * 100;
    cum += pct;
    out[i] = {
      pct: pct.toFixed(1) + '%',
      cum: cum.toFixed(1) + '%',
      vital: cum <= 80.5 ? 'القلّة الحيوية' : 'الكثرة التافهة',
      _cum: cum
    };
  });
  return out;
};
window.fmeaCalc = function (r) {
  const rpn = (parseFloat(r.sev) || 0) * (parseFloat(r.occ) || 0) * (parseFloat(r.det) || 0);
  const grade = !rpn ? '—' : rpn >= 200 ? 'حرجة — عالج فوراً'
    : rpn >= 100 ? 'عالية — خطة خلال 30 يوماً'
    : rpn >= 40 ? 'متوسطة — خطة خلال 90 يوماً' : 'منخفضة — مراقبة';
  const col = !rpn ? '#8A9AAE' : rpn >= 200 ? '#7A1F17' : rpn >= 100 ? '#B3261E'
    : rpn >= 40 ? '#B4690E' : '#047857';
  return { rpn: rpn || '', grade, col };
};

window.CBA = {
  ar: 'تحليل التكلفة والمنفعة', en: 'Cost-Benefit Analysis',
  what: 'يقارن كلفة الضابط بالمنفعة المتوقعة منه — لأن ضابطاً أغلى من الخطر الذي يعالجه هدرٌ لا حماية.',
  when: 'قبل اعتماد أي ضابط أو مبادرة ذات كلفة جوهرية.',
  how: ['قدّر الكلفة الكلية: تأسيس + تشغيل سنوي',
        'قدّر المنفعة: الخسارة المتفاداة + المكسب المضاف',
        'احسب صافي المنفعة ونسبة العائد',
        'لا تعتمد ضابطاً نسبته أقل من 1 إلا لالتزام إلزامي'],
  cols: [
    { k: 'item', ar: 'الضابط / المبادرة', t: 'text', w: 200 },
    { k: 'setup', ar: 'كلفة التأسيس', t: 'num', w: 120 },
    { k: 'run', ar: 'الكلفة التشغيلية السنوية', t: 'num', w: 140 },
    { k: 'total', ar: 'الكلفة الكلية', t: 'calc' },
    { k: 'avoid', ar: 'الخسارة المتفاداة سنوياً', t: 'num', w: 150 },
    { k: 'gain', ar: 'المكسب المضاف سنوياً', t: 'num', w: 140 },
    { k: 'benefit', ar: 'المنفعة الكلية', t: 'calc' },
    { k: 'net', ar: 'صافي المنفعة', t: 'calc' },
    { k: 'ratio', ar: 'نسبة المنفعة/الكلفة', t: 'calc' },
    { k: 'verdict', ar: 'التوصية', t: 'calc' },
    { k: 'mand', ar: 'التزام إلزامي؟', t: 'select', opts: ['نعم', 'لا'], w: 110 }
  ]
};
window.cbaCalc = function (r) {
  const cost = (parseFloat(r.setup) || 0) + (parseFloat(r.run) || 0);
  const ben = (parseFloat(r.avoid) || 0) + (parseFloat(r.gain) || 0);
  const net = ben - cost;
  const ratio = cost ? ben / cost : 0;
  const mand = r.mand === 'نعم';
  const verdict = !cost && !ben ? '—'
    : mand ? 'إلزامي — يُنفَّذ بغض النظر عن النسبة'
    : ratio >= 2 ? 'يُعتمد — جدوى قوية'
    : ratio >= 1 ? 'يُعتمد بحذر — جدوى حدّية'
    : 'يُعاد التصميم — الكلفة تتجاوز المنفعة';
  const col = mand ? '#1256A0' : ratio >= 2 ? '#047857' : ratio >= 1 ? '#B4690E' : '#B3261E';
  const f = n => n ? Math.round(n).toLocaleString('en-US') : '';
  return { total: f(cost), benefit: f(ben), net: f(net),
           ratio: cost ? ratio.toFixed(2) : '', verdict, col };
};

/* ═══ الربط ═══ */
function render() { const a = $('#app'); if (a) { a.innerHTML = view(); bind(); } }
function refresh() { const b = $('#techBody'); if (b) { b.innerHTML = body(); bind(); } }

function readGrid(id, cols) {
  const t = $(`[data-grid="${id}"]`); if (!t) return null;
  return [...t.querySelectorAll('tbody tr')].map(tr => {
    const r = {};
    tr.querySelectorAll('[data-c]').forEach(i => r[i.dataset.c] = i.value);
    return r;
  }).filter(r => Object.values(r).some(v => String(v || '').trim()));
}
const GRIDS = { obj: () => window.OBJ_TABLE.cols, par: () => window.ANALYSIS_TECH.pareto.cols,
  fmea: () => window.ANALYSIS_TECH.fmea.cols, cba: () => window.CBA.cols };

function saveGrid(id) {
  const cols = GRIDS[id] && GRIDS[id]();
  if (!cols) return;
  const d = readGrid(id, cols);
  if (d) { const s = ST(); s.tech = s.tech || {}; s.tech[id] = d; window.GRCAPP.save(); }
}

/* يحدّث الخلايا المحسوبة في الصف فوراً بلا إعادة رسم */
function liveRow(table, tr) {
  const id = table.dataset.grid;
  const cols = GRIDS[id] && GRIDS[id]();
  if (!cols || !tr) return;
  const r = {};
  tr.querySelectorAll('[data-c]').forEach(x => r[x.dataset.c] = x.value);

  if (id === 'par') {
    /* باريتو يعتمد على كل الصفوف — نُعيد حساب العمود كله */
    const rows = [...table.querySelectorAll('tbody tr')].map(t2 => {
      const o = {}; t2.querySelectorAll('[data-c]').forEach(x => o[x.dataset.c] = x.value); return o;
    });
    const calc = window.paretoCalc(rows);
    [...table.querySelectorAll('tbody tr')].forEach((t2, i) => {
      const cells = t2.querySelectorAll('.rc-c');
      const c = calc[i] || {};
      if (cells[0]) cells[0].textContent = c.pct || '';
      if (cells[1]) cells[1].textContent = c.cum || '';
      if (cells[2]) { cells[2].textContent = c.vital || '';
        cells[2].style.cssText = c.vital === 'القلّة الحيوية' ? 'color:#B3261E;font-weight:700' : ''; }
    });
    const ch = document.querySelector('.par-chart');
    if (ch) { const s2 = ST(); s2.tech.par = rows; drawPareto(); }
    return;
  }

  const c = id === 'fmea' ? window.fmeaCalc(r) : id === 'cba' ? window.cbaCalc(r) : {};
  const calcCols = cols.filter(x => x.t === 'calc');
  const cells = tr.querySelectorAll('.rc-c');
  calcCols.forEach((col, i) => {
    if (!cells[i]) return;
    cells[i].textContent = c[col.k] != null ? c[col.k] : '';
    cells[i].style.cssText = c.col && ['grade','verdict','rpn','ratio'].includes(col.k)
      ? `color:${c.col};font-weight:700` : '';
  });
}

/* إعادة رسم مخطط باريتو فقط */
function drawPareto() {
  const host = document.querySelector('.par-chart');
  if (!host) return;
  const rows = bag('par');
  const calc = window.paretoCalc(rows);
  const merged = rows.map((r, i) => ({ ...r, ...calc[i] })).filter(r => r.cause)
    .sort((a, b) => (parseFloat(b.freq) || 0) - (parseFloat(a.freq) || 0));
  const max = Math.max(...merged.map(r => parseFloat(r.freq) || 0), 1);
  const bars = host.querySelector('.par-b');
  if (!bars) return;
  bars.innerHTML = merged.map(r => {
    const h = (parseFloat(r.freq) || 0) / max * 100;
    const vital = r._cum <= 80.5;
    return `<div class="pb-c">
      <div class="pb-v" style="height:${h}%;background:${vital ? '#B3261E' : '#9DB4CC'}"><span>${esc(r.freq)}</span></div>
      <div class="pb-cum">${r.cum}</div>
      <div class="pb-l">${esc(String(r.cause).slice(0, 18))}</div></div>`;
  }).join('');
}

function flashSave() {
  document.querySelectorAll('.sv-i').forEach(e => {
    e.textContent = '✅ حُفظ';
    e.classList.add('on');
    clearTimeout(e._t);
    e._t = setTimeout(() => { e.textContent = '💾 يُحفظ تلقائياً'; e.classList.remove('on'); }, 1400);
  });
}

function bind() {
  if (window.I18) setTimeout(() => I18.sweep(document.body), 0);

    b.onclick = () => window.GRCAPP.go(b.dataset.nav));

  $$('.tech-t [data-c]').forEach(i => i.oninput = i.onchange = () => {

  });

    const s = ST(); s.tech.fishP = s.tech.fishP || {};

  };
  $$('[data-why]').forEach(i => i.onchange = i.oninput = () => {
    const s = ST(); s.tech.whyP = s.tech.whyP || {};

  });

}

function genObj() {

        : 'رفع كفاءة الكوادر وتقليل الاعتماد على الأفراد',

      kcit: '100%',

}

function xlsObj() {

}

return { view, bind, render };
})();

      : n < 250 ? 'مرحلة انتقالية: الممارسات تجاوزت العفوية ولم تُوثَّق بعد بشكل كافٍ.'
      : 'تعدّد الوحدات يجعل الازدواج والفجوات بين الإدارات أكبر مصدر هدر.']);
  const ctx = window.ctxFor ? window.ctxFor(o.activity, window.groupOf ? window.groupOf(o.activity) : '', o.sectorKey) : null;
  if (ctx) d.push(['القطاع والنشاط', `${o.sector || ''} · ${o.activity || ''}`,
    `يفرض التزامات محدّدة أبرزها: ${ctx.regs.slice(0, 2).join(' و')}.`]);
  if (mat) d.push(['النضج الحالي', `${mat.toFixed(1)} من 5`,
    mat < 2.5 ? 'الأولوية للتوثيق الرسمي وإنشاء السجلات — وهو ما ينقلك للمستوى 3.'
      : mat < 4 ? 'الأولوية لتوليد بيانات تكفي للحكم على الفاعلية — وهو ما ينقلك للمستوى 4.'
      : 'الأولوية لاستخدام المؤشرات في إثبات تحسّن مستمر — المستوى 5.']);
  if (tp) d.push(['الأداء الشامل', `${tp}%`,
    tp < 40 ? 'الفجوة واسعة في الأبعاد الأربعة — ابدأ بالفعالية قبل الكفاءة.'
      : tp < 70 ? 'الأساس قائم — ركّز على البُعد الأضعف تحديداً لا على الجميع.'
      : 'أداء جيد — الحفاظ عليه يتطلب رصداً مستمراً لا مبادرات جديدة.']);
  return d;
}

function bind() {
  const s = ST(); s.startup = s.startup || {};

    S.sp = S.sp === b.dataset.sp ? '' : b.dataset.sp;

    S.lines = S.lines || {}; S.lines[i.dataset.line] = i.value; window.GRCAPP.save();

return { view, bind, SP, PDCA, LINES, suggestSP, drivers };
})();

<script>/* ============================================================
   نظام السعيد GRC™ — تقرير المستشار الذكي
   يقدّر الخسائر ويوزّعها على الأسباب الثلاثة، ويقيس VUCA
   وانعدام التواصل، ثم يقود إلى الأداء المنضبط عبر GRC
   تصميم وبرمجة: د. محمد عطية
   ============================================================ */
window.ADVISOR = (function () {
'use strict';
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => (s == null ? '' : String(s)).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
const ST = () => window.GRCAPP.ST();
const fmt = n => Math.round(n).toLocaleString('en-US');

const VUCA = [
 ['V', 'التقلّب', 'Volatility', 'سرعة التغيير في سوقنا ومتطلباتنا ومداه'],
 ['U', 'عدم اليقين', 'Uncertainty', 'صعوبة التنبؤ بما هو قادم خلال 12 شهراً'],
 ['C', 'التعقيد', 'Complexity', 'تشابك العوامل والجهات والأنظمة المؤثرة فينا'],
 ['A', 'الغموض', 'Ambiguity', 'تعدّد التفسيرات الصحيحة للمعلومة نفسها لدينا']
];
const DISC = [
 ['d1', 'إدارات منفصلة', 'كل إدارة تعمل في صومعة ولا تتشارك المعلومة أو الأدوات'],
 ['d2', 'أشخاص منفصلون', 'ضعف العلاقات وانعدام الثقة بين الفرق'],
 ['d3', 'غرض وثقافة منفصلان', 'ما نعلنه يختلف عمّا يُمارَس فعلاً'],
 ['d4', 'مهارات منفصلة', 'كل تخصص يرى الحدث بعدسته وحدها ولا يتكامل مع غيره']
];

/* ═══ الحسابات ═══ */
function calc() {
  const s = ST(), o = s.org || {}, A = s.advisor || {};
  const rev = parseFloat(String(A.rev || o.rev || '').replace(/[^\d.]/g, '')) || 0;
  const emp = +o.emp || 0;

  /* شدّة VUCA وانعدام التواصل من 0..4 */
  const vArr = VUCA.map((_, i) => (A.vuca || {})[i]).filter(x => x != null);
  const dArr = DISC.map(d => (A.disc || {})[d[0]]).filter(x => x != null);
  const vAvg = vArr.length ? vArr.reduce((a, b) => a + b, 0) / vArr.length : 0;
  const dAvg = dArr.length ? dArr.reduce((a, b) => a + b, 0) / dArr.length : 0;

  /* النضج يخفّض الخسارة — والـVUCA وانعدام التواصل يرفعانها */
  const mat = window.GRCAPP.allMat ? window.GRCAPP.allMat('baseline') : 0;
  const matFactor = mat ? (5 - mat) / 4 : 1;              /* 0 عند النضج 5، 1 عند 1 */
  const vFactor = vAvg / 4, dFactor = dAvg / 4;

  /* معدّل الخسارة الأساسي: 3٪ من الإيراد كحد أدنى مرجعي، يرتفع بالعوامل */
  const rate = 0.03 + 0.05 * matFactor + 0.03 * vFactor + 0.04 * dFactor;   /* 3٪ .. 15٪ */
  const loss = rev * rate;

  /* توزيع الأسباب الثلاثة — يتأثر بالثقافة والنضج و VUCA */
  const cul = cultureScore();
  let misconduct = 20 + (cul != null ? (100 - cul) * 0.25 : 12);  /* ثقافة ضعيفة ⇐ سوء سلوك أعلى */
  let mistakes = 25 + matFactor * 30;                              /* نضج منخفض ⇐ أخطاء أكثر */
  let miscalc = 20 + vFactor * 30;                                 /* VUCA عالٍ ⇐ سوء تقدير أكثر */
  const tot = misconduct + mistakes + miscalc;
  misconduct = Math.round(misconduct / tot * 100);
  mistakes = Math.round(mistakes / tot * 100);
  miscalc = 100 - misconduct - mistakes;

  return { rev, emp, rate, loss, vAvg, dAvg, mat, cul,
           causes: { misconduct, mistakes, miscalc },
           lossM: rev ? loss : 0,
           saving: rev ? loss * 0.55 : 0 };   /* تقدير الوفر عند رفع النضج مستويين */
}

function cultureScore() {
  const t = (ST().tools || {}).culsurvey;
  if (!t || !t.scale) return null;
  const v = Object.values(t.scale).filter(x => x != null);
  return v.length ? Math.round(v.reduce((a, b) => a + b, 0) / (v.length * 4) * 100) : null;
}

/* ═══ الواجهة ═══ */
function view() {
  const s = ST(), o = s.org || {};
  s.advisor = s.advisor || {};

  const cul = C.cul;

  return `<div class="wrap">

    </div>
  </div>

  <div class="card pad">

    <div class="grid2">

      <label>عدد الموظفين <input value="${esc(o.emp || '')}" disabled></label>
    </div>
    <p class="hint">التقدير مبني على معدل مرجعي 3٪ كحدٍّ أدنى للهدر، يرتفع بانخفاض النضج وارتفاع VUCA وانعدام التواصل.</p>
  </div>

  <div class="card pad">
    <h3>② تقييم بيئة VUCA</h3>
    <p class="hint">قيّم كل بُعد من 0 (منخفض جداً) إلى 4 (مرتفع جداً) في بيئة منظمتك.</p>
    ${VUCA.map((v, i) => `<div class="lk">
      <div class="lk-q"><b>${v[0]} · ${v[1]}</b> <span class="en">${v[2]}</span><br><small>${v[3]}</small></div>
      <div class="lk-g">${[0,1,2,3,4].map(n => `<button class="lkb ${(A.vuca||{})[i] === n ? 'on' : ''}" data-v="${i}" data-n="${n}">${n}</button>`).join('')}</div>
    </div>`).join('')}
  </div>

  <div class="card pad">
    <h3>③ تقييم انعدام التواصل</h3>
    <p class="hint">أنواع الانفصال الأربعة التي وُجد GRC ليستبدلها بالتكامل — قيّم شدّتها لديك.</p>
    ${DISC.map(d => `<div class="lk">
      <div class="lk-q"><b>${d[1]}</b><br><small>${d[2]}</small></div>
      <div class="lk-g">${[0,1,2,3,4].map(n => `<button class="lkb ${(A.disc||{})[d[0]] === n ? 'on' : ''}" data-d="${d[0]}" data-n="${n}">${n}</button>`).join('')}</div>
    </div>`).join('')}
  </div>

  ${C.rev ? `
  <div class="adv-hero">
    <div class="adv-l">
      <span>الخسارة السنوية المقدّرة إن استمررت بالطريقة الحالية</span>
      <b>${fmt(C.lossM)}</b>
      <em>ريال سنوياً · ما يعادل ${(C.rate * 100).toFixed(1)}٪ من الإيراد</em>
    </div>
    <div class="adv-r">
      <span>الوفر المتوقع عند رفع النضج مستويين</span>
      <b>${fmt(C.saving)}</b>
      <em>ريال سنوياً</em>
    </div>
  </div>

  <div class="card pad">
    <h3>④ توزيع الأسباب — أين تذهب الخسارة؟</h3>
    <div class="cz">
      ${[['سوء السلوك غير المنضبط', C.causes.misconduct, '#B3261E', 'متعمَّد — نية مخالفة واضحة',
          'العلاج: الحوافز · قنوات الإبلاغ · اتساق الاستجابة (P5 · P6 · P8)'],
         ['الأخطاء', C.causes.mistakes, '#B4690E', 'غير متعمَّد — خلل في التنفيذ',
          'العلاج: الضوابط · الأتمتة · فصل المهام · التدريب (P1 · P4)'],
         ['سوء التقدير', C.causes.miscalc, '#1256A0', 'غير متعمَّد — خلل في الحكم',
          'العلاج: جودة المعلومة · تنوّع الآراء · تحدّي الافتراضات (L1 · A4)']]
        .map(([t, p, c, d, fix]) => `<div class="cz-c">
          <div class="cz-bar" style="background:${c}18">
            <i style="height:${p}%;background:${c}"></i>
            <b style="color:${c}">${p}%</b>
          </div>
          <div class="cz-t"><b>${t}</b><small>${d}</small>
            <em>${fmt(C.lossM * p / 100)} ريال</em>
            <span>${fix}</span></div>
        </div>`).join('')}
    </div>
    ${cul != null ? `<div class="adv-note">📊 استُخدمت نتيجة <b>استبيان الثقافة (${cul}%)</b> في تقدير نسبة سوء السلوك — فالثقافة الضعيفة ترفعها.</div>`
      : `<div class="warn">لم تُكمل استبيان الثقافة في L3 بعد — أكمله ليصبح تقدير سوء السلوك مبنياً على قياس لا على افتراض.</div>`}
  </div>

  <div class="card pad">
    <h3>⑤ الحل — الأداء المنضبط عبر قدرة GRC</h3>
    <div class="sol">
      <div class="sol-p"><b>المشكلة</b>
        <p>VUCA بشدّة ${C.vAvg.toFixed(1)}/4 وانعدام تواصل ${C.dAvg.toFixed(1)}/4، ونضج ${C.mat ? C.mat.toFixed(1) : '—'}/5 — فتتحوّل الخسارة إلى نمط متكرر لا حادثة عابرة.</p></div>
      <div class="sol-a">◀</div>
      <div class="sol-s"><b>الحل</b>
        <p>الأداء المنضبط: تحقيق الأهداف <b>بموثوقية</b>، ومعالجة <b>عدم اليقين</b>، والتصرف <b>بنزاهة</b> — ويُبنى بقدرة GRC المتكاملة عبر المكوّنات الأربعة.</p></div>
    </div>
    <div class="sol-steps">
      ${[['الصورة الكبيرة', 'نموذج العمل: كيف نُنتج القيمة ولمن'],
         ['الحوكمة · الإدارة · الضمان', 'من يوجّه · من ينفّذ · من يقيّم مستقلاً'],
         ['الأهداف والمؤشرات', 'KPI للفرص · KRI للعقبات · KCI للالتزامات'],
         ['الحُماة', 'من ينتج القيمة ويحفظها في آن واحد'],
         ['التخصصات الحرجة', 'الست التي يُرى بها الحدث الواحد']]
        .map((x, i) => `<div class="ss"><span>${i + 1}</span><b>${x[0]}</b><p>${x[1]}</p></div>`).join('')}
    </div>
  </div>

  ${ctx ? `<div class="card pad">
    <h3>⑥ ما يحتاجه قطاعك تحديداً</h3>
    <div class="grid3">
      <div class="mini"><b>التخصصات الحرجة الأولى بالبناء</b><ul>
        ${(C.causes.misconduct > 33 ? ['الامتثال والأخلاقيات', 'الحوكمة والرقابة'] :

           ['المخاطر واتخاذ القرار', 'الاستراتيجية والأداء']).map(x => `<li>${x}</li>`).join('')}
        <li>${C.dAvg >= 2.5 ? 'التكامل بين التخصصات — انعدام التواصل مرتفع لديك' : 'الحفاظ على التكامل القائم'}</li>
      </ul></div>
      <div class="mini"><b>أبرز المخاطر المرجّحة لنشاطك</b><ul>${ctx.risks.slice(0, 4).map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>
