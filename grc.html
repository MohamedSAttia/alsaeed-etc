 الأربعة للأداء الشامل التي ينبغي أخذها بعين الاعتبار في جميع مكونات وعناصر نموذج قدرات الحوكمة والمخاطر والامتثال (GRC)؟","oe":["Quality, Quantity, Timeliness, Accuracy","Effective (Sound), Efficient (Lean), Responsive (Agile), Resilient (Antifragile)","Revenue, Profit, Market Share, Growth","Leadership, Communication, Collaboration, Innovation"],"oa":["الجودة، الكمية، الالتزام بالوقت، الدقة","الفعالية (Sound)، الكفاءة (Lean)، الاستجابة (Agile)، المرونة (Antifragile)","الإيرادات، الربح، الحصة السوقية، النمو","القيادة، التواصل، التعاون، الابتكار"],"c":1,"ch":"Review Competent","ex":"Exam 1 - GRCP","fe":"Total Performance is always assessed using four dimensions: Effectiveness, Efficiency, Agility, and Resilience. These ensure a holistic evaluation of processes.\n\nGRC Capability Model v3.5 – Premium, p.120–121","fa":"يتم تقييم الأداء الكلي دائمًا باستخدام أربعة أبعاد: الفعالية، الكفاءة، الاستجابة، والمرونة. هذه الأبعاد تضمن تقييمًا شاملاً للعمليات.\n\n📖 المرجع: GRC Capability Model v3.5 – Premium, p.120–121"},{"qe":"In the context of Total Performance, how can the effectiveness of an education program be assessed?","qa":"في سياق الأداء الكلي، كيف يمكن تقييم فعالية برنامج التعليم؟","oe":["By analyzing customer satisfaction surveys","By assessing the number of employees who received promotions","By measuring the organization's revenue growth","By evaluating the design, coverage of topical areas, retention of knowledge/skills, and impact on business objectives"],"oa":["من خلال تحليل استبيانات رضا العملاء","من خلال تقييم عدد الموظفين الذين حصلوا على ترقيات","من خلال قياس نمو إيرادات المؤسسة","من خلال تقييم التصميم، شمولية المواضيع، الاحتفاظ بالمعرفة/المهارات، وتأثيره على أهداف العمل"],"c":3,"ch":"Perform Competent","ex":"Exam 2 - GRCP","fe":"Effectiveness relates to whether the program is well designed, covers the right topics, ensures knowledge retention, and achieves intended business impacts.\n\nGRC Capability Model v3.5 – Premium, p.23–24","fa":"الفعالية تعني ما إذا كان البرنامج مصممًا بشكل جيد، يغطي المواضيع الصحيحة، يضمن الاحتفاظ بالمعرفة، ويحقق الأثر المطلوب على أهداف العمل.\n\n📖 المرجع: GRC Capability Model v3.5 – Premium, p.23–24"},{"qe":"How does applying a consistent process for improvement benefit the organization?","qa":"كيف يفيد تطبيق عملية متسقة للتحسين المنظمة ؟","oe":["It is not necessary and has no benefits","It helps prioritize and execute across the organization","It reduces the need for employee training","It benefits the internal audit department"],"oa":["غير ضروري ولا يقدم أي فوائد","يساعد في تحديد الأولويات والتنفيذ على مستوى المنظمة","يقلل من الحاجة إلى تدريب الموظفين","يفيد قسم التدقيق الداخلي"],"c":1,"ch":"Review Competent","ex":"Exam 1 - GRCP","fe":"The REVIEW component highlights that applying a consistent improvement process helps prioritize and execute across the entire organization, ensuring alignment and efficiency.\n\nGRC Capability Model v3.5 – Premium, p.118–119","fa":"يؤكد مكون الـ REVIEW أن تطبيق عملية تحسين متسقة يساعد على تحديد الأولويات والتنفيذ على مستوى المؤسسة بالكامل، مما يضمن التوافق والكفاءة.\n\n📖 المرجع: GRC Capability Model v3.5 – Premium, p.118–119"},{"qe":"How is effectiveness measured in the context of the REVIEW component?","qa":"كيف يتم قياس الفعالية في سياق مكون الـ REVIEW؟","oe":["Through the number of new products launched","Through the number of employees and their job satisfaction","Through the organization’s stock price and market capitalization","Through the design and operating effectiveness of the capabilities to monitor the capability, provide assurance, and learn from prior mistakes"],"oa":["من خلال عدد المنتجات الجديدة التي يتم إطلاقها","من خلال عدد الموظفين ورضاهم عن وظائفهم","من خلال سعر سهم المنظمة ورؤوس أموال السوق","من خلال فعالية التصميم والتشغيل للقدرات من أجل مراقبتها وتوفير الضمان والتعلم من الأخطاء السابقة والتحسين"],"c":3,"ch":"Review Competent","ex":"Exam 1 - GRCP","fe":"Effectiveness in the Review component is measured by the organization’s ability to:\n\n\n\t\n\tMonitor capabilities, actions, and controls\n\t\n\t\n\tProvide objective assurance about total performance\n\t\n\t\n\tLearn from prior mistakes\n\t\n\t\n\tContinuously improve\n\t\n\n\nEffectiveness means that the design of the capability is sound and that it operates as intended, with monitoring and assurance activities leading to real performance improvement and alignment with priority objectives.\n\nGRC Capability Model v3.5 – Premium, p.119","fa":"قياس الفعالية في مكون المراجعة يعتمد على قدرة المنظمة على:\n\n\n\t\n\tمراقبة القدرات والإجراءات والضوابط\n\t\n\t\n\tتقديم ضمان موضوعي حول الأداء الكلي\n\t\n\t\n\tالتعلم من الأخطاء السابقة\n\t\n\t\n\tتحسين الأداء باستمرار\n\t\n\n\nالفعالية هنا تعني أن تصميم القدرات سليم وأنها تعمل كما هو مخطط لها، وأن نتائج المراقبة والضمان تؤدي فعليًا إلى تحسين الأداء وتعزيز القدرة على تحقيق الأهداف ذات الأولوية.\n \n\n📖 المرجع: GRC Capability Model v3.5 – Premium, p.119"},{"qe":"What is the purpose of after-action reviews","qa":"ما هو الغرض من المراجعات بعد الأحداث (After-Action Reviews)؟","oe":["They are used to provide incentives to employees for favorable conduct","They are used to ensure the protection of anonymity and non-retaliation for reporters","They uncover root causes of events and help improve proactive, detective, and responsive actions and controls","They are used to escalate incidents for investigation and identify them as in-house or external"],"oa":["تُستخدم لتقديم الحوافز للموظفين على السلوك الإيجابي","تُستخدم لضمان حماية السرية ومنع الانتقام للمبلغين","الكشف عن الأسباب الجذرية للأحداث والمساعدة في تحسين الإجراءات والضوابط الاستباقية والكاشفة والاستجابية","تُستخدم لتصعيد الحوادث للتحقيق وتحديد ما إذا كانت داخلية أو خارجية"],"c":2,"ch":"Review Competent","ex":"Exam 2 - GRCP","fe":"After-action reviews aim to identify the root causes of favorable and unfavorable events and strengthen proactive, detective, and responsive measures.\n\n📖  GRC Capability Model v3.5, p.115","fa":"الغرض من المراجعات بعد الأحداث هو تحديد الأسباب الجذرية للأحداث سواء كانت إيجابية أو سلبية وتعزيز الإجراءات الاستباقية والكاشفة والاستجابية.\n\n📖 المرجع: GRC Capability Model v3.5, p.115"},{"qe":"What is the goal of implementing an internal investigation","qa":"ما هو الهدف من تنفيذ التحقيق الداخلي","oe":["To compound and accelerate the impact of favorable events","To address allegations or indications of unfavorable events and respond to external inquiries and investigations","To ensure timely and consistent reporting to applicable stakeholders","To provide incentives to employees for favorable conduct"],"oa":["تعزيز وتسريع تأثير الأحداث الإيجابية","معالجة الادعاءات أو المؤشرات المتعلقة بالأحداث السلبية والرد على الاستفسارات والتحقيقات الخارجية","ضمان الإبلاغ في الوقت المناسب وبطريقة متسقة إلى أصحاب المصلحة","تقديم الحوافز للموظفين على السلوك الإيجابي"],"c":1,"ch":"Perform Competent","ex":"Exam 2 - GRCP","fe":"Internal investigations are designed to address allegations or indications of negative events and provide a structured way to also respond to external inquiries.\n\nGRC Capability Model v3.5, p.115","fa":"يهدف التحقيق الداخلي إلى التعامل مع الادعاءات أو المؤشرات المتعلقة بالأحداث السلبية وتوفير طريقة منظمة للرد على الاستفسارات الخارجية.\n\n📖 المرجع: GRC Capability Model v3.5, p.115"},{"qe":"Why is it important to quickly respond to favorable conduct by personnel","qa":"لماذا من المهم الاستجابة بسرعة للسلوك الإيجابي من الموظفين؟","oe":["To ensure protection of anonymity and non-retaliation for reporters","To escalate incidents for investigation and identify them as in-house or external","To preserve records and other evidence for investigation","To associate rewards with favorable conduct and compound or accelerate benefits"],"oa":["لضمان حماية السرية ومنع الانتقام للمبلغين","لتصعيد الحوادث للتحقيق وتحديد ما إذا كانت داخلية أو خارجية","للحفاظ على السجلات والأدلة الأخرى للتحقيق","لربط المكافآت بالسلوك الإيجابي وتعزيز أو تسريع الفوائد"],"c":3,"ch":"Perform Competent","ex":"Exam 1 - GRCP","fe":"Quickly responding to favorable conduct ensures that rewards are associated with the conduct, reinforcing positive behavior and amplifying benefits.\n\n📖 GRC Capability Model v3.5, p.116","fa":"الاستجابة السريعة للسلوك الإيجابي تضمن ربط المكافآت بهذا السلوك، مما يعزز التصرفات الإيجابية ويضاعف الفوائد.\n\n📖 المرجع: GRC Capability Model v3.5, p.116"},{"qe":"What is a consideration to keep in mind when using economic incentives to encourage favorable conduct?","qa":"ما هو الاعتبار الذي يجب وضعه في الاعتبار عند استخدام الحوافز الاقتصادية لتشجيع السلوك الإيجابي؟","oe":["Ensure that any unions or employee organizations approve them","Ensure that incentives are not “perverse incentives” that encourage adverse conduct","Ensure that economic incentives are based solely on individual performance metrics","Ensure that economic incentives are only provided to senior management"],"oa":["التأكد من موافقة النقابات أو منظمات الموظفين","التأكد من أن الحوافز ليست \"حوافز منحرفة\" تشجع السلوك السلبي","التأكد من أن الحوافز مبنية فقط على مقاييس الأداء الفردي","التأكد من أن الحوافز تُمنح فقط للإدارة العليا"],"c":1,"ch":"Perform Competent","ex":"Exam 1 - GRCP","fe":"Perverse incentives can unintentionally motivate employees toward undesirable behaviors. The model emphasizes avoiding such incentives to ensure alignment with organizational goals.","fa":"قد تؤدي الحوافز المنحرفة إلى تحفيز الموظفين بشكل غير مقصود نحو سلوكيات غير مرغوب فيها. يركز النموذج على تجنب هذه الحوافز لضمان التوافق مع أهداف المؤسسة."},{"qe":"What is the purpose of implementing incentives in an organization","qa":"ما هو الغرض من تنفيذ الحوافز في المؤسسة؟","oe":["To discourage employees from seeking employment opportunities elsewhere","To encourage the right proactive, detective, and responsive conduct in the workforce and extended enterprise","To reduce the overall cost of employee compensation and benefits","To reduce the need for performance reviews and evaluations"],"oa":["ردع الموظفين من البحث عن فرص العمل في منظمة أخرى","التشجيع على السلوك الاستباقي والاستقصائي والاستجابي الصحيح في القوى العاملة وامتداد المنشأة","تقليل التكاليف عامة لتعويض الموظفين ومزاياهم","تقليل الحاجة إلى المتابعة وتقييم الأداء"],"c":1,"ch":"Perform Competent","ex":"Exam 1 - GRCP","fe":"Under the Perform component (Incentives), OCEG explains that incentive systems should:\n\n\n\t\n\tReinforce values-based behavior\n\t\n\t\n\tReduce misconduct risk\n\t\n\t\n\tAlign performance with governance objectives\n\t\n\n\nIncentives are behavioral governance tools, not merely financial rewards.\n\nOCEG. (2024). GRC Capability Model™ Version 3.5 – Premium Edition. OCEG. pp. 185–189.","fa":"في مكون P3 – Incentives من نموذج GRC، تؤكد OCEG أن الحوافز يجب أن:\n\n\n\t\n\tتعزز السلوكيات المتوافقة مع القيم والسياسات\n\t\n\t\n\tتمنع الانحرافات الأخلاقية\n\t\n\t\n\tتربط الأداء بالمخاطر والامتثال\n\t\n\n\nالحوافز ليست مجرد مكافآت مالية، بل أدوات تصميم سلوكي (Behavioral Design Tools).\n\nOCEG. (2024). GRC Capability Model™ Version 3.5 – Premium Edition. OCEG. pp. 185–189."},{"qe":"Why is it important to avoid \"perverse incentives\" in an incentive program","qa":"لماذا من المهم تجنب \"الحوافز المنحرفة\" في برنامج الحوافز؟","oe":["They violate anti-harassment laws","They decrease employee satisfaction","They are not tax-deductible","They encourage adverse conduct"],"oa":["لأنها تنتهك قوانين مكافحة التحرش","لأنها تقلل من رضا الموظفين","لأنها غير قابلة للخصم الضريبي","لأنها تشجع السلوك السلبي"],"c":3,"ch":"Perform Competent","ex":"Exam 1 - GRCP","fe":"Perverse incentives undermine organizational goals by rewarding or encouraging behaviors that are harmful or adverse.","fa":"الحوافز المنحرفة تقوض أهداف المؤسسة لأنها تكافئ أو تشجع سلوكيات ضارة أو سلبية."},{"qe":"What is the role of continuous control monitoring in the context of notifications within an organization?","qa":"ما هو دور المراقبة المستمرة للضوابط في سياق الإخطارات داخل المؤسسة؟","oe":["It is a tool that provides automated alerts for notifications within an organization","It is a method primarily for tracking the organization’s speed of response to notifications","It is a technique for listening to hotline employees to ensure they are providing the right information","It is used to monitor employees’ personal communications"],"oa":["أداة تقدم تنبيهات آلية للإخطارات داخل المؤسسة","طريقة لتتبع سرعة استجابة المؤسسة للإخطارات","أسلوب للاستماع إلى الموظفين عبر الخط الساخن لضمان تقديمهم المعلومات الصحيحة","أداة لمراقبة اتصالات الموظفين الشخصية"],"c":0,"ch":"Perform Competent","ex":"Exam 1 - GRCP","fe":"Continuous control monitoring provides automated alerts that allow organizations to detect and act on important notifications quickly.","fa":"تعمل المراقبة المستمرة للضوابط على تقديم تنبيهات آلية تمكن المؤسسات من اكتشاف الإخطارات المهمة والتصرف بشأنها بسرعة."},{"qe":"How can an organization ensure that notifications are handled by the right organizational units?","qa":"كيف يمكن للمؤسسة ضمان أن تتم معالجة الإخطارات من قبل الوحدات التنظيمية المناسبة؟","oe":["By prioritizing, substantiating, validating, and routing notifications based on topic, type, and severity","By establishing a single point for referral regardless of topic or type","By requiring that all notifications be reviewed by the general counsel before any action is taken","By disregarding any notifications that do not meet specific criteria or thresholds so the remainder can be efficiently routed"],"oa":["من خلال إعطاء الأولوية والتحقق والتأكد وتوجيه الإخطارات بناءً على الموضوع والنوع والخطورة","بإنشاء نقطة إحالة واحدة بغض النظر عن الموضوع أو النوع","بمطالبة المستشار القانوني العام بمراجعة جميع الإخطارات قبل اتخاذ أي إجراء","بتجاهل الإخطارات التي لا تلبي معايير أو حدود معينة حتى يتم توجيه البقية بكفاءة"],"c":0,"ch":"Perform Competent","ex":"Exam 1 - GRCP","fe":"Organizations must prioritize and route notifications appropriately to ensure they reach the correct units for timely action.","fa":"يجب على المؤسسات إعطاء الأولوية للإخطارات وتوجيهها بشكل صحيح لضمان وصولها إلى الوحدات المناسبة واتخاذ الإجراءات في الوقت المناسب."},{"qe":"What are some examples of informal mechanisms that can capture notifications within an organization?","qa":"ما هي بعض الأمثلة على الآليات غير الرسمية التي تلتقط الإشارات داخل المنظمة؟","oe":["Audits and third-party assessments","Public announcements and press releases","Standard reporting forms and documentation","An open-door policy and direct communication with management"],"oa":["إجراءات التدقيق والتقييم من الطرف الثالث","الإعلان العام والبيان الصحفي","نماذج الإبلاغ والتوثيق التقليدية","سياسة الباب المفتوح والتواصل المباشر مع الإدارة"],"c":3,"ch":"Perform Competent","ex":"Exam 1 - GRCP","fe":"Informal mechanisms like open-door policies allow employees to communicate concerns or notifications without rigid procedures.","fa":"الآليات غير الرسمية مثل سياسة الباب المفتوح تمكن الموظفين من نقل المخاوف أو الإخطارات دون الحاجة لإجراءات صارمة."},{"qe":"What are some systems-based methods for conducting inquiries","qa":"ما هي بعض الطرق القائمة على الأنظمة لإجراء الاستفسارات؟","oe":["Continuous control monitoring, log management, application performance monitoring, management dashboards","Coordinating survey efforts throughout the organization","Observations, meetings, focus groups, and individual conversations","Avoiding any connection between inquiry responses and performance appraisals"],"oa":["المراقبة المستمرة للضوابط، إدارة السجلات، مراقبة أداء التطبيقات، لوحات متابعة الإدارة","تنسيق جهود الاستطلاع عبر المؤسسة","الملاحظات والاجتماعات ومجموعات النقاش والمحادثات الفردية","تجنب أي صلة بين ردود الاستفسارات وتقييم الأداء"],"c":0,"ch":"Perform Competent","ex":"Exam 1 - GRCP","fe":"Protecting inquiry information ensures compliance with mandatory requirements and laws in the jurisdiction where the inquiry is conducted. This safeguards confidentiality, integrity, and the credibility of the inquiry process.","fa":"حماية المعلومات المرتبطة بالاستفسار تضمن الالتزام بالمتطلبات والقوانين الإلزامية في المكان الذي يتم فيه الاستفسار. وهذا يحافظ على السرية والنزاهة ومصداقية عملية الاستفسار."},{"qe":"How can information be gathered through informal pathways in the context of inquiry?","qa":"كيف يمكن جمع المعلومات من خلال المسارات غير الرسمية في سياق الاستفسار؟","oe":["Through observations, meetings, and individual conversations","Through the use of continuous control monitoring systems","Through mandatory reporting and compliance audits","Through the implementation of strict inquiry routines and cycles"],"oa":["من خلال الملاحظات، والاجتماعات، والمحادثات الفردية","من خلال استخدام أنظمة المراقبة المستمرة للضوابط","من خلال التقارير الإلزامية وعمليات التدقيق على الامتثال","من خلال تطبيق روتينات ودورات استفسار صارمة"],"c":0,"ch":"Perform Competent","ex":"Exam 1 - GRCP","fe":"Informal pathways rely on direct human interactions such as casual conversations, personal observations, and informal meetings. These methods provide valuable insights that may not surface in formal reporting systems.\n\n📖 المرجع: GRC Capability Model v3.5 – Premium, ص. 113","fa":"المسارات غير الرسمية تعتمد على التفاعلات الإنسانية المباشرة مثل الملاحظات اليومية، الاجتماعات غير الرسمية، والمحادثات الفردية. هذه الأساليب توفر معلومات قيمة قد لا تظهر في أنظمة التقارير الرسمية أو عمليات التدقيق، وبالتالي فهي تدعم عملية الاستفسار بمرونة وعمق إضافي.\n\n📖 المرجع: GRC Capability Model v3.5 – Premium, ص. 113"},{"qe":"Why is it important to provide a helpline for the workforce and other stakeholders?","qa":"لماذا من المهم توفير خط مساعدة (Helpline) للقوى العاملة وأصحاب المصلحة الآخرين؟","oe":["To evaluate the effectiveness of the education program","To allow them to seek guidance about future conduct, ask general questions, and have the option for anonymity","To define the learning objectives for the workforce","To develop new content for the education program based on questions asked"],"oa":["لتقييم فعالية برنامج التثقيف","للسماح لهم بطلب التوجيه حول السلوك المستقبلي، وطرح الأسئلة العامة، وإتاحة خيار السرية","لتحديد الأهداف التعليمية للقوى العاملة","لتطوير محتوى جديد لبرنامج التثقيف بناءً على الأسئلة المطروحة"],"c":1,"ch":"Perform Competent","ex":"Exam 1 - GRCP","fe":"A helpline provides employees and stakeholders with a secure way to ask about expected conduct, raise general questions, and remain anonymous if necessary. This increases trust and supports compliance.","fa":"يمنح خط المساعدة الموظفين وأصحاب المصلحة وسيلة آمنة لطرح الأسئلة حول السلوك المتوقع، وطرح الاستفسارات العامة، والبقاء مجهولين عند الحاجة. هذا يعزز الثقة ويدعم الامتثال."},{"qe":"Which statement is FALSE","qa":"أي من العبارات التالية خاطئة؟","oe":["The organization should have an education plan for each target population indicating what they should know about the GRC capability and their responsibilities for GRC activities","Regardless of role, everyone in the organization should receive the same curriculum and the same education activities to ensure consistent understanding","The organization should identify legally mandated education, including who must be educated, the content required, the time required, and methods used for each required course","The organization should conduct a needs assessment to determine the training that will address high-risk situations and develop a training plan for each job or job family"],"oa":["يجب أن يكون لدى المنظمة خطة تعليمية لكل مجموعة مستهدفة توضح ما يجب أن يعرفوه عن قدرات GRC ومسؤولياتهم","بغض النظر عن الدور، يجب أن يتلقى جميع الموظفين نفس المنهج التعليمي ونفس الأنشطة التعليمية لضمان فهم موحد","يجب أن تحدد المنظمة التدريب المطلوب قانونياً، بما في ذلك من يجب تدريبه، والمحتوى المطلوب، والوقت اللازم، والطرق المستخدمة لكل دورة إلزامية","يجب أن تجري المنظمة تقييماً للاحتياجات لتحديد التدريب المطلوب لمعالجة المواقف عالية المخاطر ووضع خطة تدريب لكل وظيفة أو عائلة وظيفية"],"c":1,"ch":"Perform Competent","ex":"Exam 1 - GRCP","fe":"Different roles require tailored education. A single curriculum for everyone is ineffective because job-specific risks and responsibilities vary.\n\nGRC Capability Model v3.5 – Premium, p.108","fa":"الأدوار المختلفة تتطلب تعليماً مخصصاً. وجود منهج واحد للجميع غير فعال لأن المخاطر والمسؤوليات تختلف باختلاف الوظائف.\n\n📖 المرجع: GRC Capability Model v3.5 – Premium, p.108"},{"qe":"What is the importance of tracking attendance and assessments","qa":"ما أهمية تتبع الحضور والتقييمات؟","oe":["To have evidence for defense in enforcement actions","To provide evidence of “best efforts” and ensure that knowledge is transferred","To know which employees need discipline for not attending","To define the learning objectives for the workforce"],"oa":["للحصول على دليل للدفاع في الإجراءات التنفيذية","لتوفير دليل على \"أفضل الجهود\" والتأكد من أن المعرفة قد انتقلت","لمعرفة الموظفين الذين يحتاجون إلى إجراءات تأديبية بسبب عدم الحضور","لتحديد أهداف التعلم للقوى العاملة"],"c":1,"ch":"Perform Competent","ex":"Exam 1 - GRCP","fe":"Tracking attendance and assessments provides proof that the organization made serious efforts to educate employees and transfer knowledge, which is important for compliance and improvement.\n\nGRC Capability Model v3.5 – Premium, p.109","fa":"تتبع الحضور والتقييمات يثبت أن المنظمة بذلت جهوداً جادة لتعليم الموظفين ونقل المعرفة، وهو أمر مهم للامتثال والتحسين المستمر.\n\n📖 المرجع: GRC Capability Model v3.5 – Premium, p.109"},{"qe":"What is the purpose of proactively developing communication channels within an organization?","qa":"ما الغرض من تطوير قنوات الاتصال بشكل استباقي داخل المنظمة","oe":["To ensure that all communication is delivered in written form only","To limit communication to a single channel for simplicity and cost savings","To ensure that the channels are available before they are needed","To formalize the process so that employees know that anything they communicate will be kept in records"],"oa":["لضمان أن جميع الاتصالات تتم كتابياً فقط","لحصر الاتصال في قناة واحدة لتبسيط العملية وتوفير التكاليف","لضمان أن القنوات متوفرة قبل الحاجة إليها","لتقنين العملية بحيث يعرف الموظفون أن أي تواصل سيتم حفظه في السجلات"],"c":2,"ch":"Perform Competent","ex":"Exam 1 - GRCP","fe":"Developing channels proactively ensures that when communication needs arise, the organization already has effective mechanisms ready. This avoids delays and supports resilience.","fa":"تطوير القنوات بشكل استباقي يضمن أن المنظمة لديها آليات فعالة جاهزة عند الحاجة، مما يمنع التأخير ويدعم المرونة."},{"qe":"What factors should be considered when selecting the appropriate sender of a message?","qa":"ما العوامل التي يجب مراعاتها عند اختيار المرسل المناسب للرسالة؟","oe":["The purpose of communication, desired results, reputation with audience members, and shared culture and background with the audience","The sender’s job title, office location, years of experience, and formal communication channel","The sender’s preference for formal or informal communication and their ability to respond appropriately to feedback","The sender’s fluency in the language of the needed communication, cultural background, and comfort in communicating with the target audience"],"oa":["هدف الاتصال، النتائج المرجوة، السمعة مع الجمهور، والثقافة المشتركة مع الجمهور","المسمى الوظيفي للمرسل، موقع المكتب، سنوات الخبرة، والقناة الرسمية","تفضيل المرسل للاتصال الرسمي أو غير الرسمي وقدرته على الاستجابة للتعليقات","إتقان المرسل للغة الاتصال، الخلفية الثقافية، والقدرة على التواصل مع الجمهور المستهدف"],"c":0,"ch":"Perform Competent","ex":"Exam 1 - GRCP","fe":"The communicator strategy requires alignment between the purpose of communication, desired results, and the sender’s reputation and cultural fit with the audience.","fa":"استراتيجية المرسل تتطلب أن يكون هناك توافق بين هدف الاتصال والنتائج المرجوة وسمعة المرسل ومدى ملاءمته الثقافية مع الجمهور."},{"qe":"Which are some considerations to keep in mind when establishing a communication framework?","qa":"ما بعض الاعتبارات التي يجب وضعها في الاعتبار عند إنشاء إطار عمل للاتصال؟","oe":["Selecting the appropriate sender, recipient, intention, message, cadence, and channels","Ensuring external communications are always formal while internal communication can be more informal","Using only one communication channel for all types of communication so that sending and receipt can be tracked","Reducing the frequency of communication to avoid information overload"],"oa":["اختيار المرسل والمستقبل المناسبين، الهدف، الرسالة، وتيرة الاتصال، والقنوات","ضمان أن الاتصالات الخارجية تكون رسمية دائماً بينما الداخلية يمكن أن تكون غير رسمية","استخدام قناة واحدة فقط لجميع الاتصالات حتى يمكن تتبع الإرسال والاستلام","تقليل تكرار الاتصال لتجنب الحمل الزائد للمعلومات"],"c":0,"ch":"Perform Competent","ex":"Exam 1 - GRCP","fe":"In the GRC Capability Model, communication is structured and governance-driven.\nAn effective communication framework ensures:\n\n\n\t\n\tTransparency\n\t\n\t\n\tReduced misinterpretation\n\t\n\t\n\tAlignment with objectives\n\t\n\t\n\tProper timing and delivery\n\t\n\n\nTherefore, defining sender, receiver, purpose, frequency, and channel is essential.\n \n\n\n\t\n\tOCEG. (2024). GRC Capability Model™ Version 3.5 – Premium Edition. OCEG. pp. 176–181.","fa":"في نموذج GRC، التواصل ليس نشاطًا عشوائيًا، بل نشاط حوكمي منظم.\nالإطار الفعال للتواصل يجب أن:\n\n\n\t\n\tيدعم الشفافية\n\t\n\t\n\tيقلل سوء الفهم\n\t\n\t\n\tيعزز الامتثال\n\t\n\t\n\tيضمن وصول الرسالة الصحيحة إلى الشخص المناسب في الوقت المناسب                                          \n\t\n\tOCEG. (2024). GRC Capability Model™ Version 3.5 – Premium Edition. OCEG. pp. 176–181.\n\t\n\n\nولهذا فإن تحديد المرسل والمتلقي والقناة والنية والتكرار هو جوهر بناء إطار تواصل فعّال."},{"qe":"What are some key practices involved in managing policies within an organization?","qa":"ما بعض الممارسات الرئيسية في إدارة السياسات داخل المنظمة؟","oe":["Implementing, communicating, enforcing, and auditing policies and related procedures to ensure that they operate as intended and remain relevant","Delegating policy management to each unit of the organization so there is a sense of accountability established","Having internal audit design standard policy templates to make assessment of their effectiveness easier","Establishing policy management technology that has pre-populated templates so the organization’s policies meet industry standards"],"oa":["التطبيق، الاخطار، الإنفاذ، والتدقيق فى السياسات والإجراءات ذات الصلة لضمان للتأكد من أنها تعمل كما يجب وتظل ملائمة","تفويض إدارة السياسات لكل وحدة بالمنظمة لزيادة المساءلة","قيام التدقيق الداخلي بتصميم قوالب السياسات لتسهيل التقييم","إنشاء تقنيات لإدارة السياسات تحتوي على قوالب جاهزة لتلبية معايير الصناعة"],"c":0,"ch":"Perform Competent","ex":"Exam 1 - GRCP","fe":"Policy management is not just about templates but about implementing, communicating, enforcing, and auditing policies to keep them effective and relevant over time.","fa":"إدارة السياسات لا تقتصر على القوالب، بل تتضمن تنفيذ السياسات والتواصل بشأنها وإنفاذها وتدقيقها لضمان فعاليتها واستمراريتها."},{"qe":"What is the significance of establishing ethical decision-making guidelines within an organization?","qa":"ما أهمية وضع إرشادات لاتخاذ القرارات الأخلاقية داخل المنظمة؟","oe":["Ethical decision guidelines are only applicable to the organization’s external stakeholders","Ethical decision guidelines are used instead of policies and procedures so employees learn how to make the right choices","Ethical decision guidelines are optional and have no impact on the organization’s decision-making process","Ethical decision guidelines help people decide what to do without an explicit policy or procedure when the circumstances are not explicitly covered"],"oa":["الإرشادات الأخلاقية تنطبق فقط على الأطراف الخارجية للمنظمة","الإرشادات الأخلاقية تستخدم بدلاً من السياسات والإجراءات حتى يتعلم الموظفون اتخاذ الخيارات الصحيحة","الإرشادات الأخلاقية اختيارية ولا تأثير لها على عملية صنع القرار","توجيهات القرارات الأخلاقية تساعد الأشخاص على اتخاذ القرار فيما يجب القيام به بدون سياسات أو إجراءات صريحة عندما لا تكون الظروف مذكورة بها"],"c":3,"ch":"Perform Competent","ex":"Exam 1 - GRCP","fe":"Ethical decision guidelines provide employees with a structured way to make responsible choices when policies or codes of conduct do not explicitly apply.","fa":"الإرشادات الأخلاقية توفر للموظفين إطاراً يساعدهم على اتخاذ قرارات مسؤولة عندما لا توجد سياسة أو قاعدة سلوك تغطي الحالة بشكل مباشر."},{"qe":"What is the purpose of implementing policies within an organization?","qa":"ما الهدف من تنفيذ السياسات داخل المنظمة؟","oe":["To set clear expectations of conduct for key external stakeholders and the extended enterprise","To reduce the need for defined procedures and guidelines within the organization","To have individual regulation-specific policies instead of a generic Code of Conduct","To meet regulatory requirements and establish compliance"],"oa":["وضع توقعات واضحة للسلوك للأطراف الداخلية الرئيسية والمؤسسة الممتدة","تقليل الحاجة إلى الإجراءات والسياسات المحددة داخل المنظمة","وجود سياسات خاصة بكل لائحة بدلاً من مدونة سلوك عامة","تلبية المتطلبات التنظيمية وتحقيق الامتثال"],"c":0,"ch":"Perform Competent","ex":"Exam 1 - GRCP","fe":"Policies provide clarity by setting clear expectations of conduct for internal stakeholders and the extended enterprise, ensuring consistency and alignment.","fa":"السياسات تهدف إلى الوضوح من خلال وضع توقعات واضحة للسلوك لأصحاب المصلحة الداخليين والمؤسسة الممتدة، مما يضمن الاتساق والالتزام."},{"qe":"What is the Integrated Action & Control Model (IACM) designed to provide?","qa":"ما الذي صُمم نموذج العمل والرقابة المتكاملة (IACM) لتوفيره؟","oe":["A financial model for maximizing profits while addressing risk and compliance","A framework for eliminating all risks and achieving perfect compliance","A comprehensive model for governance, management, and assurance of performance, risk, and compliance","A method for deciding whether to outsource governance/assurance"],"oa":["نموذج مالي لتعظيم الأرباح مع معالجة المخاطر والامتثال","إطار عمل للقضاء على جميع المخاطر وتحقيق الامتثال الكامل","نموذج شامل للحوكمة والإدارة وضمان الأداء والمخاطر والامتثال","طريقة لاتخاذ القرار بشأن الاستعانة بمصادر خارجية للحوكمة أو الضمان"],"c":2,"ch":"Perform Competent","ex":"Exam 1 - GRCP","fe":"The IACM is a holistic framework that integrates governance, management, and assurance across performance, risk, and compliance, rather than simply eliminating risks or maximizing profits.","fa":"نموذج IACM هو إطار شامل يدمج بين الحوكمة والإدارة والضمان عبر الأداء والمخاطر والامتثال، ولا يقتصر على القضاء على المخاطر أو تعظيم الأرباح فقط."},{"qe":"How can organizations encourage the occurrence of positive events while preventing negative ones?","qa":"كيف يمكن للمنظمات تشجيع حدوث الأحداث الإيجابية مع منع السلبية؟","oe":["Through implementing proactive actions and controls","Through using financial actions and controls","Through employee training and follow up","Through relying on responsive actions and controls"],"oa":["من خلال تنفيذ الإجراءات والضوابط الاستباقية","من خلال استخدام الإجراءات والضوابط المالية","من خلال تدريب الموظفين والمتابعة","من خلال الاعتماد على الإجراءات والضوابط التفاعلية"],"c":0,"ch":"Perform Competent","ex":"Exam 1 - GRCP","fe":"Proactive actions prevent negative events before they occur and encourage positive outcomes, unlike reactive controls which only respond after events happen.","fa":"الإجراءات والضوابط الاستباقية تمنع وقوع الأحداث السلبية مسبقاً وتدعم النتائج الإيجابية، بخلاف الضوابط التفاعلية التي تتعامل مع الأحداث بعد وقوعها."},{"qe":"What is the primary focus of management actions and controls in the IACM?","qa":"ما هو التركيز الأساسي لإجراءات وضوابط الإدارة في نموذج IACM","oe":["To oversee employees and meet target objectives","To directly address opportunities, obstacles, and obligations","To ensure strict adherence to external regulations and internal policies","To minimize costs and maximize profits"],"oa":["للإشراف على الموظفين وتحقيق الأهداف المحددة","للتعامل مباشرة مع الفرص والعقبات والالتزامات","لضمان الالتزام الصارم باللوائح الخارجية والسياسات الداخلية","لتقليل التكاليف وتعظيم الأرباح"],"c":1,"ch":"Perform Competent","ex":"Exam 1 - GRCP","fe":"Management controls focus on dealing with opportunities, obstacles, and obligations as part of principled performance, not just compliance or cost reduction.","fa":"تركز الضوابط الإدارية على التعامل مع الفرص والعقبات والالتزامات ضمن الأداء المبدئي، وليس فقط الامتثال أو خفض التكاليف."},{"qe":"What is the significance of assurance controls in the PERFORM component?","qa":"ما هي أهمية ضوابط التأكيد (Assurance Controls) في مكوّن PERFORM؟","oe":["To establish a clear chain of command and reporting structure within the organization","To promote transparency and accountability in the organization’s decision-making processes","To provide sufficient information to assurance providers when management and governance actions and controls are not enough","To ensure that the organization’s financial statements are accurate and reliable"],"oa":["لإنشاء تسلسل قيادي واضح وهيكل للتقارير داخل المنظمة","لتعزيز الشفافية والمساءلة في عمليات اتخاذ القرار داخل المنظمة","لتوفير معلومات كافية لمقدمي خدمات التأكيد عندما لا تكفي الإجراءات والضوابط الإدارية والحَوْكَمِية","لضمان أن تكون البيانات المالية للمنظمة دقيقة وموثوقة"],"c":2,"ch":"Perform Competent","ex":"Exam 1 - GRCP","fe":"Assurance controls are added to give additional evidence and information to assurance providers when the normal management and governance controls are not sufficient. They strengthen reliability and support decision-making.","fa":"تُضاف ضوابط التأكيد لتوفير أدلة ومعلومات إضافية لمقدمي خدمات التأكيد عندما لا تكون الضوابط الإدارية والحَوْكَمِية كافية. وهي تعزز الموثوقية وتدعم عملية اتخاذ القرار."},{"qe":"What is the purpose of proactive actions and controls in the PERFORM component of the GRC Capability Model?","qa":"ما هو الغرض من الإجراءات والضوابط الاستباقية في مكوّن PERFORM ضمن نموذج GRC Capability؟","oe":["To promote favorable events and prevent unfavorable events","To ensure compliance with legal and regulatory requirements","To evaluate the outcomes of past events and actions","To monitor and report on the performance of the organization"],"oa":["لتعزيز وقوع الأحداث الإيجابية ومنع وقوع الأحداث السلبية","لضمان الامتثال للمتطلبات القانونية والتنظيمية","لتقييم نتائج الأحداث والإجراءات السابقة","لمراقبة أداء المنظمة والإبلاغ عنه"],"c":0,"ch":"Perform Competent","ex":"Exam 1 - GRCP","fe":"Proactive actions and controls are designed to create favorable conditions and prevent risks before they occur. They are preventive in nature, unlike detective or responsive controls.","fa":"الإجراءات والضوابط الاستباقية تهدف إلى خلق ظروف مواتية ومنع المخاطر قبل وقوعها. وهي ذات طبيعة وقائية، بخلاف الضوابط الكاشفة أو التفاعلية."},{"qe":"What is the primary responsibility of the Fourth Line in the Lines of Accountability Model?","qa":"ما هي المسؤولية الأساسية للخط الرابع في نموذج خطوط المساءلة؟","oe":["The Fourth Line, which is the HR department, is responsible for providing training and development opportunities to employees.","The Fourth Line, which is the Compliance Department, is responsible for establishing actions and controls to address regulatory and policy requirements.","The Fourth Line, which is the Procurement Department, is responsible for managing vendor relationships and procurement processes.","The Fourth Line, which is the Executive Team, is accountable and responsible for organization-wide performance, risk, and compliance."],"oa":["الخط الرابع، وهو قسم الموارد البشرية، مسؤول عن توفير فرص التدريب والتطوير للموظفين","الخط الرابع، وهو قسم الامتثال، مسؤول عن إنشاء إجراءات وضوابط لمعالجة المتطلبات التنظيمية والسياساتية","الخط الرابع، وهو قسم المشتريات، مسؤول عن إدارة علاقات البائعين وعمليات الشراء","الخط الرابع، وهو الفريق التنفيذي، مسؤول ومساءل عن الأداء والمخاطر والامتثال على مستوى المؤسسة بالكامل."],"c":3,"ch":"Align Competent","ex":"Exam 1 - GRCP","fe":"According to the GRC Capability Model v3.5, the Fourth Line is defined as the Executive Team. They hold accountability and responsibility for ensuring organization-wide performance, risk, and compliance. They use information from the First and Second Lines, and assurance from the Third Line, to make strategic decisions\n\n📖  (Reference): GRC Capability Model v3.5, Page 41.","fa":"وفقًا لنموذج القدرات GRC الإصدار 3.5، فإن الخط الرابع يُمثل الفريق التنفيذي. وهم يتحملون المسؤولية والمساءلة عن الأداء والمخاطر والامتثال على مستوى المنظمة بالكامل. ويعتمدون على المعلومات الواردة من الخط الأول والثاني، إضافةً إلى التأكيدات من الخط الثالث، لاتخاذ قرارات استراتيجية.\n\n📖 المرجع (Reference): GRC Capability Model v3.5, Page 41."},{"qe":"Which design option is characterized by ceasing all activity or terminating sources that give rise to the opportunity, obstacle, or obligation?","qa":"أي من خيارات التصميم يتسم بإيقاف جميع الأنشطة التى تؤدي الفرص أو المخاطر أو الألتزامات؟","oe":["Avoid","Share","Control","Accept"],"oa":["خيار التفادى","خيار المشاركة","خيار التحكم","خيار القبول"],"c":0,"ch":"Align Competent","ex":"Exam 1 - GRCP","fe":"The Avoid Design Option means that an organization chooses to cease all activity or terminate sources that create opportunities, risks, or obligations. This is a proactive approach to completely remove exposure rather than managing or mitigating it\n\n(Reference): GRC Capability Model v3.5, Page 61.","fa":"خيار التصميم التجنّب يعني أن تختار المنظمة إيقاف جميع الأنشطة أو إنهاء المصادر التي تُنشئ فرصًا أو مخاطر أو التزامات. هذا نهج استباقي لإزالة التعرض تمامًا بدلاً من محاولة التحكم فيه أو التخفيف من أثره.\n\n📖 المرجع (Reference): GRC Capability Model v3.5, Page 61."},{"qe":"What is the primary goal of the Design element?","qa":"ما هو الهدف الأساسي من عنصر التصميم؟","oe":["To develop an integrated plan to reliably achieve objectives within acceptable levels of risk, reward, and compliance.","To ensure that all employees receive training on risk management practices at a level appropriate for each role.","To establish a system for reporting and resolving compliance violations that can be tracked and assessed.","To create a detailed inventory of all organizational assets and resources and how they are applied to reduce risk and increase reward and compliance."],"oa":["وضع خطة متكاملة لتحقيق الأهداف بشكل موثوق ضمن مستويات مقبولة من المخاطر والمكافآت والامتثال.","ضمان حصول جميع الموظفين على التدريب على ممارسات إدارة المخاطر بالمستوى المناسب لكل دور.","إنشاء نظام للإبلاغ عن انتهاكات الامتثال وحلها يمكن تتبعه وتقييمه","إنشاء جرد تفصيلي لجميع أصول وموارد المنظمة وكيفية تطبيقها لتقليل المخاطر وزيادة المكافآت والامتثال"],"c":0,"ch":"Align Competent","ex":"Exam 1 - GRCP","fe":"The Design element in the GRC Capability Model focuses on developing an integrated and reliable plan that balances risk, reward, and compliance. This ensures that objectives are achieved while addressing risks and opportunities appropriately\n\n📖 (Reference): GRC Capability Model v3.5, Page 61.","fa":"يركز عنصر التصميم في نموذج القدرات GRC على تطوير خطة متكاملة وموثوقة توازن بين المخاطر والمكافآت والامتثال. ويهدف إلى ضمان تحقيق الأهداف مع معالجة المخاطر والفرص بشكل مناسب.\n\n📖 المرجع (Reference): GRC Capability Model v3.5, Page 61."},{"qe":"How can an organization prioritize areas where modifications are necessary to address opportunities, obstacles, and obligations?","qa":"كيف يمكن للمنظمة أن تعطي الأولوية للمجالات التي تتطلب تعديلات لمعالجة الفرص والعقبات والالتزامات؟","oe":["The organization can prioritize areas by avoiding any modifications that could lead to change.","The organization can use analysis criteria to prioritize areas so that levels of residual risk/reward and compliance are acceptable.","The organization can prioritize areas based on preferences of the management team based on their experience.","The organization can prioritize areas based on potential financial gains."],"oa":["يمكن للمنظمة إعطاء الأولوية للمجالات عن طريق تجنب أي تعديلات قد تؤدي إلى التغيير.","يمكن للمنظمة استخدام معايير التحليل لتحديد أولويات المجالات بحيث تكون مستويات المخاطر/المكافآت المتبقية والامتثال مقبولة.","يمكن للمنظمة إعطاء الأولوية للمجالات بناءً على تفضيلات فريق الإدارة استنادًا إلى خبراتهم","يمكن للمنظمة إعطاء الأولوية للمجالات بناءً على المكاسب المالية المحتملة."],"c":1,"ch":"Align Competent","ex":"Exam 1 - GRCP","fe":"The GRC model explains that analysis is used to identify areas requiring modification so that residual levels of risk/reward and compliance remain acceptable, ensuring a balance between performance, risk, and compliance.\n\t\n\n\n📖  Reference: GRC Capability Model v3.5, Page 96","fa":"يوضح نموذج GRC أن التحليل يُستخدم لتحديد المجالات التي تحتاج إلى تعديل بحيث تظل مستويات المخاطر/المكافآت والامتثال مقبولة، مما يضمن التوازن بين الأداء والمخاطر والامتثال\n\n📖 المرجع | Reference: GRC Capability Model v3.5, Page 96"},{"qe":"TRUE or FALSE. Analysis quantifies the relative size and impact of the effects of opportunities, obstacles, and obligations.","qa":"صح أم خطأ: التحليل يقيس الحجم النسبي والأثر للفرص والعقبات والالتزامات.","oe":["False","True"],"oa":["خطأ","صح"],"c":1,"ch":"Align Competent","ex":"Exam 1 - GRCP","fe":"Quantitative and qualitative analysis in the GRC model is used to estimate the likelihood and impact of events on objectives. This means it determines the relative size and effect of opportunities, obstacles, and obligations, ensuring that decision-makers have a clear view of risks and potential rewards to support effective governance, risk management, and compliance.","fa":"التحليل الكمي والنوعي في نموذج GRC يُستخدم لتقدير احتمالية وتأثير الأحداث على الأهداف، وبالتالي فهو يحدد الحجم النسبي والأثر للفرص والعقبات والالتزامات"},{"qe":"What is the role of distributions when considering likelihood and impact in quantitative methods?","qa":"ما هو دور التوزيعات عند النظر في احتمالية وتأثير الأحداث باستخدام الطرق الكمية؟","oe":["Distributions more realistically model situations and are useful when using quantitative methods to estimate likelihood and impact.","Distributions are used to determine the order in which events should be addressed.","Distributions are used to categorize events based on their level of severity.","Distributions are used to calculate the total number of events that can occur in a given time period."],"oa":["التوزيعات تمثل المواقف بشكل أكثر واقعية وتُعد مفيدة عند استخدام الطرق الكمية لتقدير الاحتمالية والتأثير.","تُستخدم التوزيعات لتحديد ترتيب معالجة الأحداث","تُستخدم التوزيعات لتصنيف الأحداث بناءً على مستوى خطورتها","تُستخدم التوزيعات لحساب العدد الإجمالي للأحداث التي يمكن أن تحدث خلال فترة زمنية معينة"],"c":0,"ch":"Align Competent","ex":"Exam 1 - GRCP","fe":"Distributions help represent uncertainty more accurately, making them an essential tool in quantitative models to estimate the likelihood and impact of events.\n\n📖 | Reference: GRC Capability Model v3.5, Pages 59–60","fa":"التوزيعات تساعد على تمثيل عدم اليقين بشكل أكثر دقة، مما يجعلها أداة أساسية في النماذج الكمية لتقدير احتمالية وتأثير الأحداث\n\n📖 المرجع | Reference: GRC Capability Model v3.5, Pages 59–60"},{"qe":"What is the term used to describe the positive, favorable effect of uncertainty on objectives?","qa":"ما المصطلح المستخدم لوصف التأثير الإيجابي والملائم لعدم اليقين على الأهداف؟","oe":["Profit","Enhancement","Reward","Obstacle"],"oa":["ربح","تعزيز","مكافأة","عقبة"],"c":2,"ch":"Align Competent","ex":"Exam 1 - GRCP","fe":"Reward refers to the positive and beneficial effect of uncertainty on objectives, such as opportunities that create value or advantage for the organization.\n\n📖 Reference : GRC Capability Model v3.5, Page 52","fa":"تشير \"المكافأة\" إلى التأثير الإيجابي والمفيد لعدم اليقين على الأهداف، مثل الفرص التي تخلق قيمة أو ميزة للمنظمة.\n\n📖 Reference | المرجع: GRC Capability Model v3.5, Page 52"},{"qe":"What is the purpose of defining identification criteria?","qa":"ما هو الغرض من تحديد معايير التعريف؟","oe":["To guide, constrain, and conscribe how opportunities, obstacles, and obligations are identified, categorized, and prioritized","To determine the budget allocation for risk management activities","To create a list of potential stakeholders for communication purposes","To establish the organizational hierarchy for decision-making"],"oa":["لتوجيه وضبط كيفية تحديد وتصنيف وترتيب الفرص والعقبات والالتزامات","لتحديد مخصصات الميزانية لأنشطة إدارة المخاطر","إنشاء قائمة من أصحاب المصلحة المحتملين لأغراض التواصل","إنشاء التسلسل الهرمي التنظيمي لاتخاذ القرار"],"c":0,"ch":"Align Competent","ex":"Exam 1 - GRCP","fe":"Defining identification criteria provides a structured method to ensure that opportunities, obstacles, and obligations are consistently identified, categorized, and prioritized in a systematic way.\n\n📖 Reference | : GRC Capability Model v3.5, Page 54","fa":"تحديد معايير التعريف يوفر طريقة منظمة لضمان أن الفرص والعقبات والالتزامات يتم تحديدها وتصنيفها وترتيبها بالأولوية بشكل منهجي ومتسق.\n\n📖 Reference | المرجع: GRC Capability Model v3.5, Page 54"},{"qe":"TRUE or FALSE. Identification typically uses only quantitative methods to identify and classify opportunities, obstacles, and obligations.","qa":"صح أم خطأ: عادةً ما تستخدم عملية التعريف الأساليب الكمية فقط لتحديد وتصنيف الفرص والعقبات والالتزامات.","oe":["True","False"],"oa":["صح","خطأ"],"c":1,"ch":"Align Competent","ex":"Exam 1 - GRCP","fe":"Identification does not rely only on quantitative methods; it also includes qualitative approaches, which provide context and insights that numbers alone cannot capture.\n\n📖 Reference : GRC Capability Model v3.5, Page 56","fa":"عملية التعريف لا تعتمد فقط على الأساليب الكمية، بل تشمل أيضاً الأساليب النوعية التي توفر سياقاً وفهماً أعمق لا يمكن للأرقام وحدها أن تعكسه.\n\n📖 Reference | المرجع: GRC Capability Model v3.5, Page 56"},{"qe":"What is the definition of uncertainty ?","qa":"ما هو تعريف عدم اليقين؟","oe":["A state of being unsure about something due to incomplete knowledge or underlying randomness making it difficult to understand with complete confidence.","A state of being unsure what to do, or to put in place, to have strong performance based on the established objectives.","A state of being unsure whether something might affect performance","A state of being ambivalent about something due to lack of information needed to make an assessment of its potential impact on achievement of objectives."],"oa":["حالة من عدم التأكد بشأن شيء ما بسبب المعرفة غير المكتملة أو العشوائية الكامنة، مما يجعل من الصعب الفهم بثقة كاملة.","حالة من عدم التأكد بشأن ما يجب القيام به، أو وضعه موضع التنفيذ، لتحقيق أداء قوي بناءً على الأهداف الموضوعة","حالة من عدم التأكد مما إذا كان شيء ما قد يؤثر على الأداء.","حالة من التردد بشأن شيء ما بسبب نقص المعلومات اللازمة لتقييم تأثيره المحتمل على تحقيق الأهداف"],"c":0,"ch":"Key Concepts","ex":"Exam 1 - GRCP","fe":"Uncertainty is defined as incomplete knowledge or inherent randomness that makes it difficult to fully predict or understand outcomes. Other options only partially reflect the concept but do not capture its full meaning.\n\nReference : GRC Capability Model v3.5 – p. 58","fa":"عدم اليقين يعني وجود نقص في المعرفة أو طبيعة عشوائية تجعل من الصعب فهم النتائج بثقة كاملة. الخيارات الأخرى تركز على جوانب جزئية مثل نقص المعلومات أو عدم التأكد من الأداء لكنها ليست شاملة.\n\nReference : GRC Capability Model v3.5 – p. 58"},{"qe":"What is the term used to describe a cause that has the potential to result in harm?","qa":"ما هو المصطلح المستخدم لوصف سبب لديه القدرة على إحداث ضرر؟","oe":["Opportunity","Hazard","Obstacle","Prospect"],"oa":["فرصة","خطر","عقبة","احتمال"],"c":1,"ch":"Key Concepts","ex":"Exam 1 - GRCP","fe":"A hazard is the source or cause that has the potential to create harm. Unlike opportunity (positive outcome), obstacle (a barrier without inherent harm), or prospect (possibility), hazard specifically refers to risk of harm.\n\nReference : GRC Capability Model v3.5 – p. 58","fa":"الخطر (Hazard) هو السبب أو المصدر الذي يمكن أن يؤدي إلى ضرر محتمل. بخلاف \"الفرصة\" التي تعني نتيجة إيجابية، أو \"العقبة\" التي تعني عائقًا، أو \"الاحتمال\" الذي يعبر عن إمكانية فقط\n\nReference / المرجع: GRC Capability Model v3.5 – p. 58"},{"qe":"What are the two measures used to estimate the effect of uncertainty on objectives?","qa":"ما المقياسان المستخدمان لتقدير أثر عدم اليقين على الأهداف؟","oe":["Probability and consequence","Likelihood and impact","Certainty and effect","Accuracy and precision"],"oa":["الاحتمال والعاقبة","الاحتمالية والتأثير","اليقين والتأثير","الدقة والموثوقية"],"c":1,"ch":"Key Concepts","ex":"Exam 1 - GRCP","fe":"Risk and uncertainty are evaluated based on likelihood (probability of occurrence) and impact (magnitude of effect on objectives). These two measures are the foundation of risk assessment in GRC.\n\nReference : GRC Capability Model v3.5 – p. 59","fa":"يتم تقييم المخاطر وعدم اليقين من خلال معيارين أساسيين: \n\nالاحتمالية (مدى احتمال وقوع الحدث) والتأثير (مدى تأثيره على الأهداف). وهذا هو الأساس في تقييم المخاطر ضمن إطار GRC.\n\n \n\nReference / المرجع:\nGRC Capability Model v3.5 – p. 59"},{"qe":"How do organizational values statements help establish a positive and productive organizational culture?","qa":"كيف تساعد بيانات القيم التنظيمية في إنشاء ثقافة تنظيمية إيجابية ومنتجة؟","oe":["By outlining the financial targets and objectives that the organization aims to achieve to build value.","By creating a shared sense of purpose and direction, guiding behaviors and decision-making, and aligning the organization’s actions with its broader mission and goals.","By detailing the organization’s expansion plans and growth strategies to add value.","By specifying the dress code and workplace etiquette that employees are expected to follow."],"oa":["من خلال تحديد الأهداف المالية التي تسعى المنظمة إلى تحقيقها لبناء القيمة","من خلال إنشاء شعور مشترك بالهدف والاتجاه، وتوجيه السلوكيات واتخاذ القرارات، ومواءمة أعمال المنظمة مع رسالتها وأهدافها الأوسع","من خلال توضيح خطط التوسع واستراتيجيات النمو الخاصة بالمنظمة لإضافة قيمة","من خلال تحديد قواعد اللباس وآداب مكان العمل التي يُتوقع من الموظفين اتباعها"],"c":1,"ch":"Key Concepts","ex":"Exam 1 - GRCP","fe":"Values statements create a shared sense of purpose and direction, shaping organizational culture by guiding behavior and aligning actions with mission and goals. They are not about financial targets, dress codes, or expansion plans.\n\nReference : GRC Capability Model v3.5 – p. 15–16","fa":"بيانات القيم تخلق شعورًا مشتركًا بالهدف، وتساعد على توجيه السلوكيات وضمان توافق أفعال المنظمة مع رسالتها وأهدافها الأوسع\nليست مجرد أهداف مالية أو قواعد مظهرية أو خطط نمو\n\nReference : GRC Capability Model v3.5 – p. 15–16"},{"qe":"What is the role of a values statement in an organization?","qa":"ما هو دور بيان القيم في المنظمة؟","oe":["A values statement reflects the shared beliefs and expectations of the organization’s leadership, employees, and stakeholders and serves as a guide for establishing a positive and productive organizational culture.","A values statement is a formal agreement between the organization and its suppliers to ensure the timely delivery of goods and services that are essential to building the organization’s value.","A values statement is a legal document that outlines the financial obligations and liabilities of the organization that contribute to its value."],"oa":["بيان القيم يعكس المعتقدات والتوقعات المشتركة لقيادة المنظمة وموظفيها وأصحاب المصلحة، ويعمل كدليل لإنشاء ثقافة تنظيمية إيجابية ومنتجة","بيان القيم هو اتفاق رسمي بين المنظمة ومورديها لضمان التسليم في الوقت المناسب للسلع والخدمات الضرورية لبناء قيمة المنظمة","بيان القيم هو وثيقة قانونية تحدد الالتزامات والمسؤوليات المالية للمنظمة التي تسهم في قيمتها."],"c":0,"ch":"Learn Component","ex":"Exam 1 - GRCP","fe":"A values statement reflects the shared beliefs and expectations of leadership, employees, and stakeholders. It is a cultural and ethical foundation, not a legal or supplier agreement.\n\nReference : GRC Capability Model v3.5 – p. 16","fa":"بيان القيم يعبر عن المعتقدات والتوقعات المشتركة بين القيادة والموظفين وأصحاب المصلحة. ليس وثيقة قانونية ولا اتفاقية مع الموردين، بل هو أساس ثقافي يساعد على توجيه السلوك وبناء ثقافة إيجابية ومنتجة.\n\nReference : GRC Capability Model v3.5 – p. 16"},{"qe":"In the IACM, what is the role of Governance Actions & Controls?","qa":"في نموذج الأفعال والضوابط المتكاملة (IACM)، ما هو دور أفعال وضوابط الحوكمة؟","oe":["To develop and implement innovative business strategies","To monitor and evaluate the performance of suppliers and vendors","By listing all compliance requirements and regulatory obligations the organization must follow.","To assist the governing authority in constraining and conscribing the organization","To engage with stakeholders and address their concerns"],"oa":["تطوير وتنفيذ استراتيجيات أعمال مبتكرة.","مراقبة وتقييم أداء الموردين والمتعاقدين.","من خلال سرد جميع متطلبات الامتثال والالتزامات التنظيمية التي يجب على المنظمة اتباعها","مساعدة السلطة الحاكمة في تقييد المنظمة والسيطرة عليها.","التفاعل مع أصحاب المصلحة ومعالجة اهتماماتهم"],"c":4,"ch":"Align Competent","ex":"Exam 1 - GRCP","fe":"Governance actions and controls are primarily about engaging stakeholders, ensuring accountability, and addressing their concerns to maintain alignment with objectives.\n\nRef : GRC Capability Model v3.5 – IACM Section, p. 73–74","fa":"أفعال وضوابط الحوكمة تركز على إشراك أصحاب المصلحة وضمان المساءلة ومعالجة مخاوفهم لضمان توافق المنظمة مع أهدافها.\n\nRef : GRC Capability Model v3.5 – IACM Section, p. 73–74"},{"qe":"Which category of actions and controls in the IACM includes hardware and software systems that facilitate other categories?","qa":"أي فئة من الأفعال والضوابط في IACM تشمل أنظمة الأجهزة والبرامج التي تسهل الفئات الأخرى؟","oe":["Governance","Policy","Technology","Information"],"oa":["الحوكمة","السياسات","التكنولوجيا","المعلومات"],"c":2,"ch":"Key Concepts","ex":"Exam 1 - GRCP","fe":"Technology in IACM includes tools, hardware, and software that enable and support other categories like information, people, and policies.\n\n \n\nGRC Capability Model v3.5 – IACM, p. 74","fa":"التكنولوجيا في IACM تشمل الأدوات والبرمجيات والأجهزة التي تدعم وتُمكّن باقي الفئات مثل المعلومات والأفراد والسياسات.\n\n \n\nGRC Capability Model v3.5 – IACM, p. 74"},{"qe":"In the IACM, what is the role of Correct/Recover Actions & Controls?","qa":"في IACM، ما هو دور أفعال وضوابط التصحيح/الاسترداد؟","oe":["To ensure that unfavorable events do not affect the profitability of the organization.","To slow down or decrease the impact of unfavorable events and return the organization to its original, stable, or superior state after harm has occurred.","To ensure that all employees adhere to the company’s code of conduct","To assess any damage done to the company from non-compliance"],"oa":["ضمان ألا تؤثر الأحداث غير المواتية على ربحية المنظمة","تقليل أو إبطاء تأثير الأحداث غير المواتية وإعادة المنظمة إلى حالتها الأصلية أو المستقرة أو الأفضل بعد وقوع الضرر","ضمان التزام جميع الموظفين بمدونة سلوك الشركة","تقييم أي ضرر لحق بالمنظمة نتيجة عدم الامتثال"],"c":1,"ch":"Key Concepts","ex":"Exam 1 - GRCP","fe":"Correct/Recover controls are about mitigation and recovery — restoring the organization to a stable or improved state after harm.\n\nReference  : GRC Capability Model v3.5 – IACM, p. 75","fa":"أفعال وضوابط التصحيح/الاسترداد تركز على التخفيف من تأثير الأحداث الضارة واستعادة استقرار المنظمة بعد وقوعها.\n\nReference  : GRC Capability Model v3.5 – IACM, p. 75"},{"qe":"Which category of actions and controls in the IACM includes human factors such as structure, accountability, education, and enablement?","qa":"أي فئة من الأفعال والضوابط في IACM تشمل العوامل البشرية مثل الهيكل، المساءلة، التعليم، والتمكين؟","oe":["People","Information","Policy","Technology"],"oa":["الأفراد","المعلومات","السياسات","التكنولوجيا"],"c":0,"ch":"Key Concepts","ex":"Exam 1 - GRCP","fe":"The “People” category in IACM covers human factors such as roles, accountability, training, and empowerment which are critical for effective governance and controls.\n\nReference : GRC Capability Model v3.5 – IACM, p. 74–75","fa":"فئة \"الأفراد\" في IACM تشمل العوامل البشرية مثل المسؤوليات، التدريب، التمكين، والهيكل التنظيمي، وهي عناصر أساسية للحوكمة والضوابط.\n\nReference : GRC Capability Model v3.5 – IACM, p. 74–75"},{"qe":"In the IACM, what is the role of Assurance Actions & Controls?","qa":"في نموذج الأفعال والضوابط المتكاملة (IACM)، ما هو دور أفعال وضوابط التأكيد (Assurance)؟","oe":["To assess new products and services for the market","To analyze financial statements and prepare budgets","To assist assurance personnel in providing assurance services","To create a positive organizational culture and work environment"],"oa":["تقييم المنتجات والخدمات الجديدة للسوق","تحليل البيانات المالية وإعداد الميزانيات","مساعدة موظفي التأكيد في تقديم خدمات التأكيد","إنشاء ثقافة تنظيمية إيجابية وبيئة عمل جيدة"],"c":2,"ch":"Key Concepts","ex":"Exam 1 - GRCP","fe":"Assurance Actions & Controls provide confidence to stakeholders that objectives are being achieved and risks are being managed effectively. They involve activities such as audits, monitoring, and evaluations to support assurance personnel in their roles.\n\nReference :GRC Capability Model v3.5 – IACM Section, p. 75–76","fa":"أفعال وضوابط التأكيد تهدف إلى طمأنة أصحاب المصلحة بأن الأهداف تتحقق وأن المخاطر تُدار بفعالية. وتشمل أنشطة مثل التدقيق والمراجعة والمتابعة لدعم فرق التأكيد في أداء مهامهم.\n\nReference :GRC Capability Model v3.5 – IACM Section, p. 75–76"},{"qe":"In the LEARN component, what is the difference between external context and internal context?","qa":"في مكون LEARN، ما هو الفرق بين السياق الخارجي والسياق الداخلي؟","oe":["External context includes the organization’s risk management policies, while internal context includes its compliance procedures.","External context refers to the organization’s financial performance, while internal context refers to its governance structure.","External context represents the operating environment, while internal context represents capabilities and resources.","External context encompasses the organization’s mission and vision, while internal context encompasses its values and culture."],"oa":["السياق الخارجي يشمل سياسات إدارة المخاطر الخاصة بالمنظمة، بينما السياق الداخلي يشمل إجراءات الامتثال","السياق الخارجي يشير إلى الأداء المالي للمنظمة، بينما السياق الداخلي يشير إلى هيكل الحوكمة الخاص بها","السياق الخارجي يمثل بيئة التشغيل، بينما السياق الداخلي يمثل القدرات والموارد","السياق الخارجي يشمل رسالة المنظمة ورؤيتها، بينما السياق الداخلي يشمل قيمها وثقافتها"],"c":2,"ch":"Learn Component","ex":"Exam 1 - GRCP","fe":"The external context is about the environment in which the organization operates (markets, regulations, external factors). The internal context is about the organization’s capabilities, resources, culture, and structure.\n\nReference: GRC Capability Model v3.5 – LEARN Component, p. 21–22","fa":"السياق الخارجي يتعلق بالبيئة التي تعمل فيها المنظمة (مثل الأسواق، القوانين، والعوامل الخارجية). أما السياق الداخلي فيتعلق بالقدرات والموارد والثقافة والهيكل الداخلي للمنظمة.\n\n \n\nReference: GRC Capability Model v3.5 – LEARN Component, p. 21–22"},{"qe":"What is the relationship between the internal context and the culture of an organization within the LEARN component?","qa":"ما هي العلاقة بين السياق الداخلي وثقافة المنظمة ضمن مكون  الدراسة  LEARN؟","oe":["The internal context and culture define the organization’s risk appetite and tolerance levels.","The internal context and culture outline the organization’s compliance requirements.","The internal context and culture determine the organization’s financial performance.","The internal context and culture describe the capabilities and resources used to meet stakeholder needs."],"oa":["السياق الداخلي والثقافة يحددان شهية المخاطر ومستويات التحمل لدى المنظمة","السياق الداخلي والثقافة يحددان متطلبات الامتثال في المنظمة","السياق الداخلي والثقافة يحددان الأداء المالي للمنظمة","السياق الداخلي والثقافة يصفان القدرات والموارد المستخدمة لتلبية احتياجات أصحاب المصلحة"],"c":3,"ch":"Learn Component","ex":"Exam 1 - GRCP","fe":"Internal context and culture describe the resources, skills, and capabilities that the organization relies on to achieve its goals and meet stakeholder needs. It is broader than just finances, compliance, or risk appetite.\n\nReference : GRC Capability Model v3.5 – LEARN Component, p. 22–23","fa":"السياق الداخلي والثقافة يصفان القدرات والموارد والمهارات التي تعتمد عليها المنظمة لتحقيق أهدافها وتلبية احتياجات أصحاب المصلحة. فهو أوسع من مجرد الأداء المالي أو متطلبات الامتثال أو شهية المخاطر.\n\nReference : GRC Capability Model v3.5 – LEARN Component, p. 22–23"},{"qe":"Why is it important for an organization to define events and timescales that trigger reconsideration of external factors?","qa":"لماذا من المهم للمنظمة أن تحدد الأحداث والجداول الزمنية التي تدفع إلى إعادة النظر في العوامل الخارجية؟","oe":["It helps the organization avoid the need for hiring consultants or law firms to recommend how to respond to changes in the external context.","It ensures that the organization remains responsive and adaptable to changes in the external context that may impact its operations and objectives.","It eliminates the need for supply chain management and procurement activities on an ongoing basis and only requires response to defined events in chain.","It allows the organization to reduce its staff time addressing changes in the external context."],"oa":["يساعد المنظمة على تجنب الحاجة لتعيين مستشارين أو مكاتب محاماة للتوصية بكيفية الاستجابة للتغيرات في السياق الخارجي","يضمن أن تظل المنظمة مستجيبة وقادرة على التكيف مع التغييرات في السياق الخارجي التي قد تؤثر على عملياتها وأهدافها","يلغي الحاجة إلى إدارة سلسلة التوريد وأنشطة المشتريات بشكل مستمر، ويقتصر فقط على الاستجابة للأحداث المحددة في السلسلة","يتيح للمنظمة تقليل وقت الموظفين المخصص لمعالجة التغييرات في السياق الخارجي"],"c":1,"ch":"Learn Component","ex":"Exam 1 - GRCP","fe":"By defining events and timescales, organizations can remain adaptable and responsive to external changes (like regulations, markets, or geopolitical shifts) that may affect operations and objectives.","fa":"تحديد الأحداث والجداول الزمنية يساعد المنظمة على البقاء يقظة ومرنة تجاه التغيرات الخارجية (مثل القوانين أو الأسواق أو العوامل السياسية) التي قد تؤثر على العمليات والأهداف."},{"qe":"What are some examples of environmental factors that may influence an organization’s external context?","qa":"ما هي أمثلة العوامل البيئية التي قد تؤثر على السياق الخارجي للمنظمة؟","oe":["Organizational response to new carbon emission regulations","Organizational procurement, vendor selection, and contract negotiation for hazardous waste disposal.","Organizational performance metrics, goal setting, and progress tracking regarding climate-related projects.","Climate and natural resources"],"oa":["استجابة المنظمة للوائح الجديدة الخاصة بانبعاثات الكربون.","مشتريات المنظمة، واختيار الموردين، والتفاوض على العقود للتخلص من النفايات الخطرة","مقاييس الأداء التنظيمي، وتحديد الأهداف، وتتبع التقدم بشأن المشاريع المتعلقة بالمناخ.","المناخ والموارد الطبيعية"],"c":3,"ch":"Learn Component","ex":"Exam 1 - GRCP","fe":"Environmental factors in external context are broad conditions like climate change, geography, or natural resources — not just internal metrics or specific responses.","fa":"العوامل البيئية ضمن السياق الخارجي تشمل عناصر عامة مثل المناخ، البيئة الطبيعية، والموارد البيئية، وليس مجرد سياسات أو مقاييس داخلية."},{"qe":"What are some examples of market factors that may influence an organization’s external context?","qa":"ما هي أمثلة العوامل السوقية التي قد تؤثر على السياق الخارجي للمنظمة؟","oe":["Research & development, product innovation, and quality control","Customer trends, demographics, and economic conditions","Demographic changes in the organization’s locations","Geopolitical and lobbying efforts in the industry sector"],"oa":["البحث والتطوير، وابتكار المنتجات، ومراقبة الجودة","اتجاهات العملاء، والديموغرافيا، والظروف الاقتصادية","التغيرات الديموغرافية في مواقع المنظمة","الجهود الجيوسياسية وأنشطة الضغط في قطاع الصناعة"],"c":1,"ch":"Learn Component","ex":"Exam 1 - GRCP","fe":"In the OCEG model under L1 External Context – Considerations, the category “Market factors” is explicitly defined as including customer trends, demographics, and economic conditions. The other options refer to (2) a narrow geographic/demographic note, (3) internal organizational activities (R&D, quality), and (4) geopolitical/political influences—not market factors.\n\nEnglish (Premium v3.5): L1 External Context → Considerations, “Market factors include customer trends, demographics, and economic conditions.” p. 81.","fa":"يوضح نموذج OCEG ضمن عنصر السياق الخارجي L1 – اعتبارات أن العوامل السوقية تشمل صراحة اتجاهات العملاء، والفئات السكانية، والظروف الاقتصادية. أما الاختيارات الأخرى فهي: (2) تركيز ضيق على تغيّر سكاني بمواقع المنظمة، (3) أنشطة داخلية مثل البحث والتطوير، (4) عوامل جيوسياسية/سياسية وليست سوقية.\n\nعنصر السياق الخارجي L1 → الاعتبارات: «عوامل السوق: تشمل العملاء، والفئات السكانية، والأحوال الاقتصادية» ص. 81."},{"qe":"Which of the following is most often responsible for balancing the competing needs of stakeholders and guiding, constraining, and conscribing the organization to act reliably, address uncertainty, and act with integrity to meet these needs?","qa":"أي مما يلي يكون في الغالب مسؤولاً عن موازنة الاحتياجات المتعارضة لأصحاب المصلحة وتوجيه المنظمة وتقييدها وإلزامها بالتصرف بشكل موثوق ومعالجة عدم اليقين والتصرف بنزاهة لتلبية هذه الاحتياجات؟","oe":["A governing board","A compliance unit","A risk manager","A general counsel"],"oa":["مجلس الإدارة","وحدة الامتثال","مدير المخاطر","المستشار القانوني العام"],"c":0,"ch":"Learn Component","ex":"Exam 1 - GRCP","fe":"The governing board has ultimate responsibility for balancing stakeholder needs and ensuring integrity, reliability, and risk oversight. Other roles (counsel, compliance, risk manager) support but do not carry ultimate accountability.\n\nReference : GRC Capability Model v3.5 – L2 Internal Context, p. 84–85","fa":"مجلس الإدارة هو الجهة المسؤولة عن الموازنة بين احتياجات أصحاب المصلحة وضمان النزاهة والموثوقية والإشراف على المخاطر. الأدوار الأخرى مثل المستشار القانوني أو وحدة الامتثال أو مدير المخاطر تقدم الدعم لكنها ليست صاحبة المسؤولية النهائية.\n\nReference : GRC Capability Model v3.5 – L2 Internal Context, p. 84–85"},{"qe":"How do values influence the way an organization operates?","qa":"كيف تؤثر القيم على طريقة عمل المنظمة؟","oe":["They dictate the organization’s pricing strategy and revenue generation","They set voluntary boundaries for how the organization operates and often explain design decisions about the operating model.","They establish the organization’s code of conduct","They determine the organization’s market share and competitive positioning as part of assessing its financial value to shareholders."],"oa":["تحدد استراتيجية التسعير وتوليد الإيرادات في المنظمة.","تضع حدودًا طوعية لكيفية عمل المنظمة وغالبًا ما تفسر قرارات التصميم المتعلقة بنموذج التشغيل","تؤسس مدونة السلوك الخاصة بالمنظمة","تحدد الحصة السوقية للمنظمة وموقعها التنافسي كجزء من تقييم قيمتها المالية للمساهمين"],"c":1,"ch":"Learn Component","ex":"Exam 1 - GRCP","fe":"Values are voluntary boundaries that guide organizational behavior, culture, and operating model decisions. They influence conduct broadly rather than determining market share, pricing, or financial valuation.\n\nReference :GRC Capability Model v3.5 – L2 Internal Context, p. 86","fa":"القيم تضع حدودًا طوعية لكيفية عمل المنظمة، وتوجه ثقافتها وقراراتها التشغيلية. هي أوسع من مجرد تحديد الحصة السوقية أو استراتيجية التسعير.\n\nReference :GRC Capability Model v3.5 – L2 Internal Context, p. 86"},{"qe":"What is the role of sensemaking in understanding the internal context?","qa":"ما هو دور صنع المعنى (Sensemaking) في فهم السياق الداخلي؟","oe":["Sensemaking involves evaluating the organization’s sense of all aspects of its culture so that improvements can be made.","Sensemaking involves conducting financial audits to make sense of the financial condition of the organization and ensure compliance with accounting standards.","Sensemaking involves continually watching for and making sense of changes in the internal context that have a direct, indirect, or cumulative effect on the organization.","Sensemaking involves analyzing the organization’s supply chain to identify potential bottlenecks and make any necessary changes in how it is managed."],"oa":["صنع المعنى يتضمن تقييم إحساس المنظمة بجميع جوانب ثقافتها بحيث يمكن إدخال تحسينات","صنع المعنى يتضمن إجراء المراجعات المالية لفهم الوضع المالي للمنظمة وضمان الامتثال للمعايير المحاسبية","صنع المعنى يتضمن المراقبة المستمرة وفهم التغيرات في السياق الداخلي التي لها تأثير مباشر أو غير مباشر أو تراكمي على المنظمة","صنع المعنى يتضمن تحليل سلسلة التوريد بالمنظمة لتحديد الاختناقات المحتملة وإجراء التغييرات اللازمة في إدارتها"],"c":2,"ch":"Learn Component","ex":"Exam 1 - GRCP","fe":"Sensemaking in the GRC model is the continuous scanning and interpretation of internal changes (direct, indirect, cumulative) that may affect performance or objectives. It is broader than audits, cultural evaluation, or supply chain analysis.\n\nGRC Capability Model v3.5 – L2 Internal Context, p. 87","fa":"صنع المعنى هو عملية المراقبة المستمرة والتفسير للتغيرات الداخلية (سواء كانت مباشرة أو غير مباشرة أو تراكمية) التي قد تؤثر على أداء المنظمة أو أهدافها. وهو أوسع من مجرد التدقيق المالي أو تحليل سلسلة التوريد.\n\nGRC Capability Model v3.5 – L2 Internal Context, p. 87"},{"qe":"What is the significance of developing relationships with key individuals and champions within stakeholder groups?","qa":"ما أهمية تطوير العلاقات مع الأفراد الرئيسيين والداعمين (Champions) داخل مجموعات أصحاب المصلحة؟","oe":["To gather intelligence on the activities and plans of competing organizations who have some of the same stakeholders.","To create a network of stakeholders who can promote the organization’s brand.","To ensure that stakeholders receive special privileges and benefits","To liaison with people and champions who hold actual power and influence in each stakeholder group."],"oa":["لجمع المعلومات عن أنشطة وخطط المنظمات المنافسة التي لديها بعض أصحاب المصلحة المشتركين","لإنشاء شبكة من أصحاب المصلحة الذين يمكنهم الترويج لعلامة المنظمة التجارية","لضمان حصول أصحاب المصلحة على امتيازات ومنافع خاصة","للتواصل مع الأشخاص والداعمين الذين يمتلكون السلطة والتأثير الفعلي داخل كل مجموعة من أصحاب المصلحة"],"c":3,"ch":"Learn Component","ex":"Exam 1 - GRCP","fe":"The significance lies in engaging with those individuals who hold influence and can shape decisions, ensuring effective stakeholder alignment.\n\nGRC Capability Model v3.5 – L4 Stakeholders, p. 97","fa":"الأهمية تكمن في التواصل مع الأفراد المؤثرين الذين لديهم سلطة فعلية على القرارات، مما يضمن مواءمة فعّالة مع أصحاب المصلحة.\n\nGRC Capability Model v3.5 – L4 Stakeholders, p. 97"},{"qe":"Which “most important stakeholder” judges whether an organization is producing, protecting, or destroying value?","qa":"أي \"أهم أصحاب المصلحة\" يحكم ما إذا كانت المنظمة تنتج أو تحمي أو تدمر القيمة؟","oe":["Ethics Department","Customer","Board","Risk Manager"],"oa":["قسم الأخلاقيات","العميل","مجلس الإدارة","مدير المخاطر"],"c":1,"ch":"Learn Component","ex":"Exam 1 - GRCP","fe":"Customers ultimately decide whether value is being created, protected, or destroyed, as they determine demand, trust, and long-term sustainability.\n\nGRC Capability Model v3.5 – L4 Stakeholders, p. 99","fa":"العملاء هم من يحددون فعليًا ما إذا كانت المنظمة تنتج أو تحافظ أو تدمر القيمة، لأن قراراتهم تحدد الطلب والثقة والاستدامة طويلة الأمد.\n\nGRC Capability Model v3.5 – L4 Stakeholders, p. 99"},{"qe":"What is the primary purpose of interacting with stakeholders in an organization?","qa":"ما هو الغرض الأساسي من التفاعل مع أصحاب المصلحة في المنظمة؟","oe":["To ensure stakeholders invest in the organization","To gather feedback for marketing campaigns","To negotiate contracts and agreements with stakeholders","To understand expectations, requirements, and perspectives that impact the organization."],"oa":["لضمان استثمار أصحاب المصلحة في المنظمة","لجمع الملاحظات حول الحملات التسويقية.","للتفاوض بشأن العقود والاتفاقيات مع أصحاب المصلحة","لفهم التوقعات والمتطلبات ووجهات النظر التي تؤثر على المنظمة"],"c":3,"ch":"Learn Component","ex":"Exam 1 - GRCP","fe":"The core purpose of stakeholder interaction is to understand their expectations and perspectives, which directly impact organizational strategies and operations.\n\nGRC Capability Model v3.5 – L4 Stakeholders, p. 100","fa":"الهدف الأساسي من التفاعل مع أصحاب المصلحة هو فهم توقعاتهم ومتطلباتهم ووجهات نظرهم، لأنها تؤثر مباشرة على استراتيجيات وعمليات المنظمة.\n\nGRC Capability Model v3.5 – L4 Stakeholders, p. 100"},{"qe":"What role do mission, vision, and values play in the ALIGN component?","qa":"ما هو الدور الذي تلعبه الرسالة والرؤية والقيم في مكون ALIGN؟","oe":["They outline the legal and regulatory requirements that the organization must satisfy and define how they relate to the business objectives.","They provide clear direction and decision-making criteria and should be well-defined and consistently communicated throughout the organization.","They specify the processes as well as the technology and tools used in the alignment process.","They determine the allocation of financial resources within the organization"],"oa":["يحددون المتطلبات القانونية والتنظيمية التي يجب على المنظمة تلبيتها ويشرحون علاقتها بالأهداف التجارية","يوفرون توجيهاً واضحاً ومعايير لاتخاذ القرار، ويجب أن تكون محددة جيداً ومتسقة ومُبلّغ عنها بوضوح في جميع أنحاء المنظمة.","يحددون العمليات بالإضافة إلى التكنولوجيا والأدوات المستخدمة في عملية المواءمة","يحددون تخصيص الموارد المالية داخل المنظمة"],"c":1,"ch":"Align Competent","ex":"Exam 1 - GRCP","fe":"Mission, vision, and values guide the organization by providing a clear direction and decision-making criteria. They must be consistently defined and communicated to ensure alignment across the organization.\n\nGRC Capability Model v3.5 – ALIGN Component, p. 112–113","fa":"الرسالة والرؤية والقيم توجه المنظمة من خلال توفير اتجاه واضح ومعايير لاتخاذ القرار، ويجب أن تكون محددة ومتسقة ويتم توصيلها بوضوح لضمان المواءمة عبر المنظمة.\n\nGRC Capability Model v3.5 – ALIGN Component, p. 112–113"},{"qe":"Why is it important to establish decision-making criteria in the alignment Component?","qa":"لماذا من المهم وضع معايير لاتخاذ القرار في مكون المواءمة؟","oe":["To comply with industry regulations and standards","To ensure that the organization stays on track and achieves its objectives","To calculate the return on investment (ROI) of alignment activities","To evaluate the performance of individual employees and teams"],"oa":["للامتثال للوائح والمعايير الصناعية","لضمان بقاء المنظمة على المسار الصحيح وتحقيق أهدافها","لحساب عائد الاستثمار (ROI) لأنشطة المواءمة","لتقييم أداء الأفراد والفرق"],"c":1,"ch":"Align Competent","ex":"Exam 1 - GRCP","fe":"Decision-making criteria help keep the organization aligned with its strategy, ensuring objectives are achieved. Without clear criteria, decisions can become inconsistent and misaligned.\n\nGRC Capability Model v3.5 – ALIGN Component, p. 113","fa":"معايير اتخاذ القرار تساعد المنظمة على البقاء على المسار الصحيح وضمان تحقيق الأهداف. غياب هذه المعايير يؤدي إلى قرارات غير متسقة وضعف في المواءمة.\n\nGRC Capability Model v3.5 – ALIGN Component, p. 113"},{"qe":"Why is it essential to make the mission, vision, and values explicit within an organization?","qa":"لماذا من الضروري توضيح الرسالة والرؤية والقيم بشكل صريح داخل المنظمة؟","oe":["It is important for gaining and maintaining buy-in from all stakeholders.","It helps the workforce understand and make decisions at all levels, preventing the organization from operating on ad hoc beliefs and interests.","It is crucial for developing the organization’s training and development programs aligned with the mission, vision, and values.","It is necessary to comply with industry regulations and standards"],"oa":["لأنه مهم لكسب والحفاظ على تأييد جميع أصحاب المصلحة","يساعد القوى العاملة على الفهم واتخاذ القرارات على جميع المستويات، ويمنع المنظمة من العمل وفق معتقدات ومصالح غير رسمية أو مؤقتة","لأنه ضروري لتطوير برامج التدريب والتطوير داخل المنظمة بما يتماشى مع الرسالة والرؤية والقيم","للامتثال للوائح والمعايير الصناعية"],"c":1,"ch":"Align Competent","ex":"Exam 1 - GRCP","fe":"Mission, vision, and values provide consistency in decisions across the organization. Without them, actions may become ad hoc or inconsistent.\n\nGRC Capability Model v3.5 – A1 Direction, p. 118","fa":"الرسالة والرؤية والقيم توفر اتساقًا في القرارات عبر المنظمة. غيابها يؤدي إلى قرارات عشوائية أو متضاربة.\n\nGRC Capability Model v3.5 – A1 Direction, p. 118"},{"qe":"How do mission, vision, and values contribute to guiding an organization’s overall goals and strategies?","qa":"كيف تساهم الرسالة والرؤية والقيم في توجيه الأهداف والاستراتيجيات العامة للمنظمة؟","oe":["They define the organization’s direction on exactly how employees should make decisions about the business.","They provide formal statements about core values, aims, and key stakeholders, serving as a clear and consistent statement of the organization’s overall purpose and direction.","They outline when managers must make decisions and when employees may make decisions.","They specify the goals of the organization so that each manager can make his/her own decisions about how to contribute toward those goals."],"oa":["تحدد اتجاه المنظمة بدقة حول كيفية اتخاذ الموظفين قراراتهم المتعلقة بالأعمال","توفر بيانات رسمية عن القيم الأساسية والأهداف وأصحاب المصلحة الرئيسيين، وتعمل كبيان واضح ومتسق لهدف المنظمة واتجاهها العام","تحدد متى يجب أن يتخذ المديرون القرارات ومتى يمكن للموظفين اتخاذ القرارات","تحدد أهداف المنظمة بحيث يتمكن كل مدير من اتخاذ قراراته الخاصة حول كيفية المساهمة في تحقيق تلك الأهداف"],"c":1,"ch":"Align Competent","ex":"Exam 1 - GRCP","fe":"Mission, vision, and values serve as the formal foundation of purpose and strategy, offering clarity and consistency to all stakeholders.\n\nGRC Capability Model v3.5 – A1 Direction, p. 119","fa":"تعمل الرسالة والرؤية والقيم كأساس رسمي للغرض والاستراتيجية، وتوفر وضوحًا واتساقًا لجميع أصحاب المصلحة.\n\nGRC Capability Model v3.5 – A1 Direction, p. 119"},{"qe":"What is the process of validating direction within an organization?","qa":"ما هي عملية التحقق من صحة الاتجاه داخل المنظمة؟","oe":["Communicating, negotiating, and finalizing direction with other organizational levels/units.","Implementing a performance management system to evaluate employee performance and alignment to established direction.","Conducting a SWOT analysis to identify the organization’s strengths, weaknesses, opportunities, and threats.","Conducting a comprehensive audit of the organization’s financial records to ensure they are showing movement in the right direction."],"oa":["التواصل والتفاوض والانتهاء من تحديد الاتجاه مع المستويات/الوحدات الأخرى في المنظمة","تنفيذ نظام لإدارة الأداء لتقييم أداء الموظفين ومواءمته مع الاتجاه المحدد","إجراء تحليل SWOT لتحديد نقاط القوة والضعف والفرص والتهديدات في المنظمة","إجراء تدقيق شامل للسجلات المالية للمنظمة لضمان أنها تُظهر حركة في الاتجاه الصحيح"],"c":2,"ch":"Align Competent","ex":"Exam 2 - GRCP","fe":"Validating direction requires analysis of strengths, weaknesses, opportunities, and threats (SWOT), ensuring the direction is realistic and aligned with organizational context.\n\nGRC Capability Model v3.5 – A1 Direction, p. 120","fa":"التحقق من صحة الاتجاه يتطلب تحليل نقاط القوة والضعف والفرص والتهديدات (SWOT) لضمان أن الاتجاه واقعي ومتماشى مع سياق المنظمة.\n\nGRC Capability Model v3.5 – A1 Direction, p. 120"},{"qe":"How are Key Performance Indicators (KPIs), Key Risk Indicators (KRIs), and Key Compliance Indicators (KCIs) used?","qa":"كيف يتم استخدام مؤشرات الأداء الرئيسية (KPIs) ومؤشرات المخاطر الرئيسية (KRIs) ومؤشرات الامتثال الرئيسية (KCIs)؟","oe":["KPIs are used to measure the efficiency of business processes; KRIs are used to assess the risk assessment processes; and KCIs are used to evaluate the impact of changes, regulations, and other obligations.","KPIs help govern, manage, and provide assurance about performance related to an objective; KRIs help govern, manage, and provide assurance about ris
