}

/* رسوم مضمّنة تعمل في المتصفح وWord وPDF */
/* ═══ الملخّص التنفيذي: الوضع قبل وبعد ونسبة التحسن والتوصيات ═══ */
function execSummary() {
  const S = A().ST(), o = S.org || {};
  const M = window.DASH ? window.DASH.metrics() : null;
  if (!M) return '';
  const dTp = M.tpA - M.tpB, dMat = M.matA - M.matB;
  const impr = M.tpB ? Math.round((M.tpA - M.tpB) / M.tpB * 100) : 0;
  const adv = M.adv || {};
  const chk = window.CHECK ? window.CHECK.run() : [];

  /* التوصيات: من الفاحص + الفجوات المقاسة */
  const recs = [];
  chk.filter(f => f.sev === 'high').slice(0, 4).forEach(f =>
    recs.push([f.el, f.ttl, f.fix]));
  if (M.leading === 0 && M.ind) recs.push(['R1', RT('كل المؤشرات متأخرة','All indicators are lagging'),
    RT('أضف مؤشرات متقدّمة تنذر قبل الحدث.','Add leading indicators that warn before the event.')]);
  if (M.cul != null && M.cul < 55) recs.push(['L3', RT('صحة الثقافة','Culture health') + ` ${M.cul}%`,
    RT('عالج الأمان النفسي عبر قنوات الإبلاغ والحوافز.','Address psychological safety through reporting channels and incentives.')]);
  if (M.ctrlUntested) recs.push(['P1', `${M.ctrlUntested} ` + RT('ضابط بلا دليل تشغيل','controls without operating evidence'),
    RT('اختبر الضوابط ووثّق أدلة تشغيلها.','Test the controls and document their operating evidence.')]);
  if (M.cosoDone < 17 && M.cosoDone) recs.push(['P1', `COSO ${M.cosoDone}/17`,
    RT('أكمل المبادئ غير المُطبَّقة لتكتمل فاعلية الرقابة.','Complete the unapplied principles for internal control to be effective.')]);
  if (M.matA && M.matA < 3) recs.push(['—', RT('النضج','Maturity') + ` ${M.matA.toFixed(1)}/5`,
    RT('وثّق الممارسات رسمياً — وهو ما ينقلك للمستوى 3.','Formally document practices — this is what moves you to level 3.')]);

  /* ملخّص كل مكوّن */
  const comps = (window.GRC_MODEL || []).map(c => {
    const g = (S.gates || {})[c.k] || {};
    const outs = window.GATE ? window.GATE.outputs(c.k) : [];
    return { c, g, outs, tp: window.GATE ? window.GATE.tpScore(g.tp) : 0 };
  });

  let h = `<h2>${RT('الملخّص التنفيذي','Executive Summary')}</h2>
  <div class="ex-sum">
    <p>${EN()
      ? `<b>${esc(o.name || 'The organisation')}</b> — ${esc(o.activity || '')} · scope: ${esc(o.scope || '')}.
         The organisation began its GRC capability journey at <b>${M.tpB}%</b> total performance and
         <b>${M.matB.toFixed(1)}/5</b> maturity, reaching <b>${M.tpA}%</b> and <b>${M.matA.toFixed(1)}/5</b>
         after implementation${impr > 0 ? ` — an improvement of <b>${impr}%</b> in total performance` : ''}.
         <b>${M.elsDone}</b> of twenty elements and <b>${M.toolsDone}</b> tools were completed,
         with a consistency score of <b>${M.consistency}/100</b>.`
      : `<b>${esc(o.name || 'المنظمة')}</b> — ${esc(o.activity || '')} · نطاق التطبيق: ${esc(o.scope || '')}.
         بدأت المنظمة رحلة بناء قدرة GRC من أداء شامل <b>${M.tpB}%</b> ونضج <b>${M.matB.toFixed(1)}/5</b>،
         ووصلت بعد التطبيق إلى أداء <b>${M.tpA}%</b> ونضج <b>${M.matA.toFixed(1)}/5</b>
         ${impr > 0 ? `— بنسبة تحسّن <b>${impr}%</b> في الأداء الشامل` : ''}.
         وأُنجزت <b>${M.elsDone}</b> من عشرين عنصراً و<b>${M.toolsDone}</b> أداة، بدرجة اتساق <b>${M.consistency}/100</b>.`}</p>
  </div>
  <table class="ba-t"><thead><tr><th>${RT('المؤشر','Indicator')}</th><th>${RT('قبل التطبيق','Before')}</th><th>${RT('بعد التطبيق','After')}</th><th>${RT('التغيّر','Change')}</th></tr></thead>
  <tbody>
    <tr><td>${RT('الأداء الشامل','Total performance')}</td><td>${M.tpB}%</td><td>${M.tpA}%</td>
      <td class="${dTp >= 0 ? 'up' : 'dn'}">${dTp >= 0 ? '▲ +' : '▼ '}${dTp}%</td></tr>
    <tr><td>${RT('مستوى النضج','Maturity level')}</td><td>${M.matB.toFixed(1)}</td><td>${M.matA.toFixed(1)}</td>
      <td class="${dMat >= 0 ? 'up' : 'dn'}">${dMat >= 0 ? '▲ +' : '▼ '}${dMat.toFixed(1)}</td></tr>
    ${M.dims.map(d => `<tr><td>${esc(EN() && window.I18 ? window.I18.t(d.d) : d.d)}</td><td>${d.b}%</td><td>${d.a}%</td>
      <td class="${d.a - d.b >= 0 ? 'up' : 'dn'}">${d.a - d.b >= 0 ? '▲ +' : '▼ '}${d.a - d.b}%</td></tr>`).join('')}
  </tbody></table>`;

  if (adv.lossM) h += `<div class="ex-loss">${EN()
    ? `The advisor estimated the pre-implementation annual loss at
       <b>${Math.round(adv.lossM).toLocaleString('en-US')}</b> SAR, with an expected saving of
       <b>${Math.round(adv.saving).toLocaleString('en-US')}</b> SAR — distributed across:
       misconduct ${adv.causes.misconduct}% · mistakes ${adv.causes.mistakes}% · misjudgement ${adv.causes.miscalc}%.`
    : `قدّر المستشار الخسارة السنوية قبل التطبيق بـ
       <b>${Math.round(adv.lossM).toLocaleString('en-US')}</b> ريال، والوفر المتوقع
       <b>${Math.round(adv.saving).toLocaleString('en-US')}</b> ريال — موزّعةً على:
       سوء السلوك ${adv.causes.misconduct}% · الأخطاء ${adv.causes.mistakes}% · سوء التقدير ${adv.causes.miscalc}%.`}</div>`;

  h += `<h2>${RT('ملخّص المكوّنات الأربعة','The Four Components')}</h2>
  <table><thead><tr><th>${RT('المكوّن','Component')}</th><th>${RT('الوزن','Weight')}</th><th>${RT('الأداء','Performance')}</th><th>${RT('المخرجات','Outputs')}</th><th>${RT('الاعتماد','Approval')}</th></tr></thead>
  <tbody>${comps.map(x => `<tr>
    <td><b>${esc(EN() ? x.c.en : x.c.ar)}</b>${EN() ? '' : ' — ' + x.c.en}</td><td>${x.c.w}%</td>
    <td>${x.tp ? x.tp + '%' : '—'}</td>
    <td>${x.outs.length ? x.outs.length + ' ' + RT('أداة/تقنية','tools') : RT('لم يبدأ','Not started')}</td>
    <td>${x.g.sig ? '✓ ' + RT('معتمَد','Approved') + ' — ' + esc(x.g.sig.name || '') : RT('قيد الاعتماد','Pending')}</td></tr>`).join('')}
  </tbody></table>
  ${comps.filter(x => x.g.notes).map(x => `<h3>${esc(EN() ? x.c.en : x.c.ar)}</h3>
    <div class="ex-note">${esc(x.g.notes).replace(/\n/g, '<br>')}</div>`).join('')}`;

  /* قسم مستقل بارز لاستبيان الثقافة */
  if (M.cul != null) {
    const lvl = M.cul >= 70 ? RT('ثقافة صحية','Healthy culture')
      : M.cul >= 45 ? RT('ثقافة متذبذبة','Unstable culture') : RT('ثقافة هشّة','Fragile culture');
    const col = M.cul >= 70 ? '#047857' : M.cul >= 45 ? '#B4690E' : '#B3261E';
    h += `<h2>${RT('نتيجة استبيان الثقافة (L3)','Culture Survey Result (L3)')}</h2>
    <div class="cul-box" style="border-color:${col}">
      <div class="cb-n" style="color:${col}"><b>${M.cul}%</b><span>${lvl}</span></div>
      <table><thead><tr><th>${RT('العبارة السلوكية','Behavioural statement')}</th><th>${RT('النتيجة','Score')}</th><th>${RT('القراءة','Reading')}</th></tr></thead>
      <tbody>${M.culItems.map(x => `<tr><td>${esc(x.l)}</td><td>${x.v}/4</td>
        <td style="color:${x.v >= 3 ? '#047857' : x.v >= 2 ? '#B4690E' : '#B3261E'}">
          ${x.v >= 3 ? RT('قوة','Strength') : x.v >= 2 ? RT('يحتاج تعزيزاً','Needs strengthening') : RT('فجوة حرجة','Critical gap')}</td></tr>`).join('')}
      </tbody></table>
      <p class="cb-t">${M.cul < 55
        ? RT('الثقافة الهشّة ترفع نسبة سوء السلوك في تقدير الخسائر — وعلاجها في العنصرين P5 الحوافز و P6 قنوات الإبلاغ.',
             'A fragile culture raises the misconduct share of estimated losses — remedied in elements P5 Incentives and P6 Notification.')
        : RT('الثقافة في وضع مقبول — والمطلوب الحفاظ عليها بقياس دوري ومتابعة الاتجاه لا الرقم المطلق.',
             'Culture is acceptable — maintain it with periodic measurement, tracking the trend rather than the absolute figure.')}</p>
    </div>`;
  } else {
    h += `<h2>${RT('نتيجة استبيان الثقافة (L3)','Culture Survey Result (L3)')}</h2>
      <div class="cul-box" style="border-color:#B4690E">
        <p class="cb-t">⚠️ ${RT('لم يُكمَل استبيان الثقافة في العنصر L3 — وهو أساس تقدير نسبة سوء السلوك في الخسائر.',
          'The culture survey in element L3 is not completed — it underpins the misconduct share of estimated losses.')}</p></div>`;
  }

  if (recs.length) h += `<h2>${RT('أهم التوصيات والإجراءات المقترحة','Key Recommendations')}</h2>
    <table><thead><tr><th>${RT('العنصر','Element')}</th><th>${RT('الملاحظة','Finding')}</th><th>${RT('الإجراء الموصى به','Recommended action')}</th></tr></thead>
    <tbody>${recs.slice(0, 8).map((r, i) => `<tr><td>${esc(r[0])}</td><td>${esc(r[1])}</td>
      <td>${esc(r[2])}</td></tr>`).join('')}</tbody></table>`;
  return h;
}

function chartsHTML() {
  const m = window.DASH ? window.DASH.metrics() : null;
  if (!m) return '';
  const D = window.DASH;
  const g = (t, inner) => `<div class="ch"><div class="ch-t">${t}</div>${inner}</div>`;
  const maxReg = Math.max(...m.regs.map(r => r.n), 1);
  const maxMix = Math.max(...Object.values(m.ctrlMix), 1);
  const hb = (l, v, mx, c, n) => `<div class="hb"><span>${l}</span>
    <div class="hbt"><i style="width:${mx ? Math.min(100, v / mx * 100) : 0}%;background:${c}"></i></div>
    <b>${n != null ? n : v}</b></div>`;

  let h = `<h2>${RT('لوحة المؤشرات','Dashboard')}</h2><div class="chg">`;
  h += g(RT('اكتمال المنظومة','System completion'), D.donut(m.pct, 100, '#1256A0', m.pct + '%', RT('اكتمال','complete')));
  h += g(RT('العناصر المُفعَّلة','Elements active'), D.donut(m.elsDone, 20, '#047857', m.elsDone + '/20', RT('عنصر','elements')));
  h += g(RT('مستوى النضج','Maturity'), D.donut(m.matA || m.matB, 5, '#C8791A', (m.matA || m.matB).toFixed(1), RT('من 5','of 5')));
  h += g(RT('درجة الاتساق','Consistency'), D.donut(m.consistency, 100,
    m.consistency >= 70 ? '#047857' : m.consistency >= 40 ? '#B4690E' : '#B3261E', m.consistency + '', RT('اتساق','score')));
  h += '</div>';

  h += '<div class="chg2">';
  h += g(RT('الأداء الشامل — الأبعاد الأربعة','Total Performance — four dimensions'), D.radar(m.dims) +
    `<div class="lg">${m.dims.map(d => `<span>${d.d}: <b>${d.a || d.b}%</b></span>`).join('')}</div>`);
  h += g(RT('التحسّن قبل وبعد','Improvement before/after'),
    hb(RT('الأداء قبل','Perf. before'), m.tpB, 100, '#8A9AAE', m.tpB + '%') +
    hb(RT('الأداء بعد','Perf. after'), m.tpA, 100, '#047857', m.tpA + '%') +
    hb(RT('النضج قبل','Maturity before'), m.matB, 5, '#8A9AAE', m.matB.toFixed(1)) +
    hb(RT('النضج بعد','Maturity after'), m.matA, 5, '#047857', m.matA.toFixed(1)) +
    `<div class="delta">${m.tpA - m.tpB >= 0 ? '▲ +' : '▼ '}${m.tpA - m.tpB}% ${RT('في الأداء','in performance')} ·
      ${m.matA - m.matB >= 0 ? '▲ +' : '▼ '}${(m.matA - m.matB).toFixed(1)} ${RT('في النضج','in maturity')}</div>`);
  h += '</div>';

  h += '<div class="chg2">';
  h += g(RT('السجلات التفصيلية','Detailed registers'), D.bars([
    { l: RT('مخاطر','Risks'), v: m.regs[0].n, c: '#B3261E' },
    { l: RT('فرص','Opps'), v: m.regs[1].n, c: '#047857' },
    { l: RT('التزامات','Obligs'), v: m.regs[2].n, c: '#1256A0' }], maxReg, 110, 120));
  h += g(RT('مزيج الضوابط','Control mix'), D.bars([
    { l: RT('استباقي','Proact'), v: m.ctrlMix['استباقي'], c: '#047857' },
    { l: RT('كشفي','Detect'), v: m.ctrlMix['كشفي'], c: '#B4690E' },
    { l: RT('استجابي','Respond'), v: m.ctrlMix['استجابي'], c: '#1256A0' }], maxMix, 110, 120) +
    hb(RT('مبادئ COSO','COSO principles'), m.cosoDone, 17, '#0B2545', m.cosoDone + '/17'));
  h += '</div>';

  h += '<div class="chg2">';
  h += g(RT('المؤشرات','Indicators'), D.bars([
    { l: 'KPI', v: m.indKinds.KPI, c: '#047857' },
    { l: 'KRI', v: m.indKinds.KRI, c: '#B3261E' },
    { l: 'KCI', v: m.indKinds.KCI, c: '#1256A0' }],
    Math.max(...Object.values(m.indKinds), 1), 110, 120) +
    `<div class="lg"><span>${RT('متقدّم','Leading')}: <b>${m.leading}</b> ${RT('من','of')} ${m.ind}</span></div>`);

  /* استبيان الثقافة — كان غائباً عن التقارير */
  if (m.cul != null) {
    h += g(RT('صحة الثقافة — استبيان L3','Culture health — L3'),
      D.donut(m.cul, 100, m.cul >= 70 ? '#047857' : m.cul >= 45 ? '#B4690E' : '#B3261E', m.cul + '%', RT('صحة','health')) +
      `<div class="cul">${m.culItems.map(x => hb(x.l, x.v, 4,
        x.v >= 3 ? '#047857' : x.v >= 2 ? '#B4690E' : '#B3261E', x.v + '/4')).join('')}</div>`);
  } else {
    h += g(RT('صحة الثقافة','Culture health'), `<p class="na">${RT('لم يُكمل استبيان الثقافة في العنصر L3.','Culture survey in element L3 not completed.')}</p>`);
  }
  h += '</div>';

  if (m.adv && m.adv.lossM) {
    h += `<h2>${RT('تقدير المستشار الذكي','Smart Advisor Estimate')}</h2>
      <div class="advb">
        <div class="ab loss"><span>${RT('الخسارة السنوية المقدّرة','Estimated annual loss')}</span><b>${Math.round(m.adv.lossM).toLocaleString('en-US')}</b><em>${RT('ريال','SAR')}</em></div>
        <div class="ab save"><span>${RT('الوفر المتوقع','Expected saving')}</span><b>${Math.round(m.adv.saving).toLocaleString('en-US')}</b><em>${RT('ريال','SAR')}</em></div>
      </div>
      <div class="ambar">
        ${[[RT('سوء السلوك','Misconduct'), m.adv.causes.misconduct, '#B3261E'],
           [RT('الأخطاء','Mistakes'), m.adv.causes.mistakes, '#B4690E'],
           [RT('سوء التقدير','Misjudgement'), m.adv.causes.miscalc, '#1256A0']]
          .map(([t, p, c]) => `<div style="width:${p}%;background:${c}"><span>${t} ${p}%</span></div>`).join('')}
      </div>`;
  }
  return h;
}

  /* جدول عربي: الأعمدة تُعكس ليبدأ العمود الأول من اليمين، وعرض العمود يتناسب مع محتواه */
  function arTable(sl, rows, top, maxRows) {
    maxRows = maxRows || 10;
    const nc = Math.min(rows[0].length, 6);
    const shown = rows.slice(0, maxRows + 1);
    /* أوزان الأعمدة من متوسط طول النص */
    const wts = [];
    for (let c = 0; c < nc; c++) {
      let L = 0;
      shown.forEach(r => { L = Math.max(L, String(r[c] || '').length); });
      wts.push(Math.max(1, Math.min(3.4, L / 9)));
    }
    const tot = wts.reduce((a, b) => a + b, 0);
    const colW = wts.map(v => CW * v / tot).reverse();     /* العكس للاتجاه العربي */
    const body = shown.map((r, ri) => {
      const cells = r.slice(0, nc).map(c => String(c || '').trim()).reverse();
      return cells.map(c => ({
        text: c,
        options: ri === 0
          ? { bold: true, color: WHITE, fill: { color: NAVY }, align: 'center', valign: 'middle' }

/* يولّد الملف بالصيغة المختارة ثم يفتح قناة الإرسال */
function shareVia(channel) {
  const ov = document.createElement('div'); ov.className = 'tr-ov';
  ov.innerHTML = `<div class="tr-box" style="max-width:560px">
    <h3>${channel === 'wa' ? '💬 إرسال عبر واتساب' : '✉️ إرسال بالبريد الإلكتروني'}</h3>
    <p>اختر صيغة التقرير. سيُولَّد الملف ويُحفظ في جهازك، ثم تُفتح قناة الإرسال بملخّص نصي — <b>أرفق الملف المحفوظ يدوياً</b> لأن المتصفح لا يسمح بإرفاقه تلقائياً.</p>
    <div class="fmt">
      ${[['pdf', '🖨️ PDF', 'يفتح نافذة الطباعة — احفظه PDF'],
         ['word', '📄 Word', 'ملف .doc بالرسوم والجداول'],
         ['excel', '📊 Excel', 'جداول البيانات فقط'],
         ['ppt', '📽️ PowerPoint', 'عرض تقديمي']].map(f =>
        `<button class="fmt-c" data-fmt="${f[0]}"><b>${f[1]}</b><span>${f[2]}</span></button>`).join('')}
    </div>
    ${channel === 'mail' ? '<label class="full">البريد المستلم (اختياري)<input id="shTo" placeholder="name@example.com"></label>' : ''}
    <div class="tr-act">
      <button class="btn o" id="shSkip">إرسال الملخّص فقط بلا ملف</button>
      <button class="btn o" id="shCancel">إلغاء</button>
    </div></div>`;
  document.body.appendChild(ov);
  const go = () => {
    const to = (ov.querySelector('#shTo') || {}).value || '';
    if (channel === 'wa') window.open('https://wa.me/?text=' + encodeURIComponent(summaryText()), '_blank');
    else window.location.href = 'mailto:' + encodeURIComponent(to)
      + '?subject=' + encodeURIComponent('تقرير منظومة GRC — ' + (A().ST().org.name || ''))
      + '&body=' + encodeURIComponent(summaryText());
    ov.remove();
  };
  ov.querySelectorAll('[data-fmt]').forEach(b => b.onclick = () => {
    const map = { pdf: expPDF, word: expWord, excel: expExcel, ppt: expPPT };
    try { map[b.dataset.fmt](); } catch (e) { A().toast('تعذّر التوليد: ' + e.message); }
    A().toast('📎 وُلّد الملف — أرفقه بعد فتح ' + (channel === 'wa' ? 'واتساب' : 'البريد'));
    setTimeout(go, 1200);
  });
  ov.querySelector('#shSkip').onclick = go;
  ov.querySelector('#shCancel').onclick = () => ov.remove();
  ov.addEventListener('click', e => { if (e.target === ov) ov.remove(); });
}
function expWA() { shareVia('wa'); }

      <div style="color:#5A6C82;font-size:.85rem">${esc(el.en)} · مكوّن ${esc(comp.ar)} (${comp.w}%)</div></div>

  </div>

<script>/* ============================================================
   نظام السعيد GRC® — محرّك التطبيق
   تصميم وإعداد وبرمجة: د. محمد عطية
   تحت إشراف الأكاديمية الشمالية الغربية بتبوك
   ============================================================ */
(function () {
'use strict';
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => (s == null ? '' : String(s)).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const LS = 'alsaeedGRC_v1';

/* ═══════ الحالة ═══════ */
const BLANK = {
  org: { name: '', desc: '', sectorKey: '', sector: '', group: '', activity: '', city: '', country: 'السعودية', emp: '', scope: 'منشأة', rev: '' },
  baseline: {}, after: {},
  tools: {},      // toolId -> بيانات
  outputs: {},    // feedName -> بيانات
  selected: {},   // elementCode -> [toolIds]
  step: 'home'
};
let ST = JSON.parse(JSON.stringify(BLANK));
window.STATE = ST;

function save() {
  try { localStorage.setItem(LS, JSON.stringify(ST)); } catch (e) {}
  if (window.WS) WS.persist(ST);          /* الحفظ في مساحة العمل الجارية */
  flashSaved();
}
let _sv = null;
function flashSaved() {
  const el = $('#savedDot'); if (!el) return;
  el.classList.add('on'); clearTimeout(_sv);
  _sv = setTimeout(() => el.classList.remove('on'), 1400);
}
function load() {
  let d = null;
  if (window.WS && WS.current()) d = WS.loadState(WS.current());
  if (!d) { try { d = JSON.parse(localStorage.getItem(LS) || 'null'); } catch (e) {} }
  if (d) { ST = Object.assign(JSON.parse(JSON.stringify(BLANK)), d); window.STATE = ST; }
}
/* إعادة ضبط الحالة عند تبديل المساحة أو استعادة لقطة */
function resetTo(st) {
  ST = st ? Object.assign(JSON.parse(JSON.stringify(BLANK)), st) : JSON.parse(JSON.stringify(BLANK));
  window.STATE = ST; save();
}

/* ═══════ نموذج الأداء الشامل والنضج ═══════ */
const TP_ITEMS = [
  ['الفعالية', 'Effective', 'تحقّق ممارساتنا الغرض المقصود منها ومصمّمة وفق أفضل الممارسات'],
  ['الكفاءة', 'Efficient', 'نحقّق الغرض بأقل كلفة ممكنة من المال والوقت والجهد'],
  ['الاستجابة', 'Responsive', 'نستشعر التغيّر ونتكيّف معه بسرعة'],
  ['المرونة', 'Resilient', 'نتحمّل الاضطرابات ونتعافى منها ولدينا خطط احتياطية']
];
const MAT_LEVELS = [
  [1, 'مرتجل', 'Ad hoc', 'ممارسات مرتجلة وعشوائية وغالباً فوضوية'],
  [2, 'متكرر', 'Repeatable', 'متكرّرة لكنها غير موثّقة رسمياً'],
  [3, 'الانتظام', 'Consistent', 'موثّقة رسمياً وتُدار بانتظام'],
  [4, 'القياس', 'Measuring', 'تُقاس وتُدار بالأدلة المثبتة بالبيانات'],
  [5, 'التحسين', 'Optimizing', 'تُحسَّن بانتظام مع مرور الوقت']
];

function tpScore(src) {
  const v = Object.values(src || {}).filter(x => x != null);
  return v.length ? Math.round(v.reduce((a, b) => a + b, 0) / (v.length * 4) * 100) : 0;
}
function matAvg(src) {
  const v = Object.values(src || {}).filter(x => x != null);
  return v.length ? (v.reduce((a, b) => a + b, 0) / v.length) : 0;
}

/* ═══════ التنقّل ═══════ */
function go(step) {
  if (step !== 'exam' && window.EXAM && window.EXAM.close) window.EXAM.close();
  ST.step = step; save(); render(); window.scrollTo(0, 0);
}

/* ═══════ الرسم ═══════ */
let _rq = null;
function render() {
  /* التأجيل يمنع خطأ innerHTML أثناء أحداث blur/focus */
  if (_rq) return;
  _rq = requestAnimationFrame(() => { _rq = null; doRender(); });
}
function doRender() {
  const app = $('#app');
  const s = ST.step;
  if (s === 'home') { app.innerHTML = vHome(); renderNav(); bind(); if (window.I18) I18.sweep(document.body); return; }
  else if (s === 'setup') app.innerHTML = vSetup();
  else if (s === 'baseline') app.innerHTML = vBaseline();
  else if (s.startsWith('comp:')) {
    const ck = s.split(':')[1];
    app.innerHTML = vComponent(ck);
  }
  else if (s.startsWith('tool:')) app.innerHTML = vTool(s.split(':')[1]);
  else if (s === 'exam') { window.EXAM.open(); renderNav(); if (window.I18) I18.sweep(document.body); return; }
  else if (s === 'ws') { app.innerHTML = window.WS.view(); renderNav(); window.WS.bind(); if (window.I18) I18.sweep(document.body); return; }
  else if (s === 'check') { app.innerHTML = window.CHECK.view(); renderNav(); window.CHECK.bind(); if (window.I18) I18.sweep(document.body); return; }
  else if (s === 'reg') { app.innerHTML = window.REGUI.view(); renderNav(); window.REGUI.bind(); if (window.I18) I18.sweep(document.body); return; }
  else if (s === 'startup') { app.innerHTML = window.STARTUP.view(); renderNav(); window.STARTUP.bind(); if (window.I18) I18.sweep(document.body); return; }
  else if (s === 'advisor') { app.innerHTML = window.ADVISOR.view(); renderNav(); window.ADVISOR.bind(); if (window.I18) I18.sweep(document.body); return; }
  else if (s === 'feas') { app.innerHTML = window.FEAS.view(); renderNav(); window.FEAS.bind(); if (window.I18) I18.sweep(document.body); return; }
  else if (s === 'tech') { app.innerHTML = window.TECHUI.view(); renderNav(); window.TECHUI.bind(); if (window.I18) I18.sweep(document.body); return; }
  else if (s === 'perf') { app.innerHTML = window.PERFUI.view(); renderNav(); window.PERFUI.bind(); if (window.I18) I18.sweep(document.body); return; }
  else if (s === 'dash') { app.innerHTML = window.DASH.view(); renderNav(); window.DASH.bind(); if (window.I18) I18.sweep(document.body); return; }
  else if (s.startsWith('gate:')) { app.innerHTML = window.GATE.view(s.split(':')[1]); renderNav(); window.GATE.bind(s.split(':')[1]); return; }
  else if (s === 'report') app.innerHTML = vReport();
  else if (s === 'after') app.innerHTML = vAfter();
  else app.innerHTML = vSetup();
  renderNav();
  bind();
  if (window.I18) I18.sweep(document.body);
  const lb = $('#langBtn'); if (lb) lb.onclick = () => window.I18.toggle();
}

function renderNav() {
  const on = ST.step;
  if (on === 'home') { $('#nav').innerHTML = ''; return; }
  const inExam = on === 'exam';
  /* تسلسل بسيط: التهيئة ← المكوّنات الأربعة ← النتائج
     والأدوات والقوالب تُفتح من داخل عناصرها لا من شريط منفصل */
  const groups = [
    { g: 'التهيئة', items: [['setup', '① الملف'], ['baseline', '② التقييم'],
        ['advisor', '③ المستشار'], ['feas', '④ الجدوى والنطاق'], ['startup', '⑤ خطة التطبيق']] },
    { g: 'المكوّنات', items: [['comp:L', 'الدراسة'], ['comp:A', 'المواءمة'],
        ['comp:P', 'التنفيذ'], ['comp:R', 'المراجعة']] },
    { g: 'النتائج', items: [['after', 'التقييم البعدي'], ['dash', '📈 اللوحة'],
        ['report', '📄 التقرير'], ['check', '🔍 الفاحص'], ['ws', '🗂️ المساحات']] }
  ];
  const cur = curComp();
  $('#nav').innerHTML = `
    <div class="sec-sw">
      <button class="sw hm" data-nav="home" title="الرئيسة">⌂</button>
      <button class="sw lng" id="langBtn" title="Language">${window.I18.lang === 'ar' ? 'EN' : 'ع'}</button>
      <button class="sw ${inExam ? '' : 'on'}" data-nav="setup">🏛️ النظام</button>
      <button class="sw ${inExam ? 'on' : ''}" data-nav="exam">🎓 الاختبارات</button>
    </div>
    ${inExam ? '' : `<div class="nv-row">${groups.map(gr => `
      <span class="nv-g">${gr.g}</span>
      ${gr.items.map(([k, l]) => {
        const act = on === k || (k.startsWith('comp:') && (on.startsWith('tool:') || TOOLPAGES.includes(on) || on === 'gate:' + k.split(':')[1]) && cur === k.split(':')[1]);
        const ck = k.startsWith('comp:') ? k.split(':')[1] : '';
        const done = ck && window.gateSigned && window.gateSigned(ck);
        return `<button class="nv ${act ? 'on' : ''} ${done ? 'dn' : ''}" data-nav="${k}">${done ? '✓ ' : ''}${l}</button>`;
      }).join('')}`).join('<span class="nv-sep">›</span>')}</div>`}`;
  $$('[data-nav]').forEach(b => b.onclick = () => go(b.dataset.nav));
}
const TOOLPAGES = ['tech', 'perf', 'reg'];

function curComp() {
  if (ST.step === 'tech') return ST.techFrom || 'A';
  if (ST.step === 'perf') return 'P';
  if (ST.step === 'reg') return ST.regFrom || 'A';
  const t = window.GRC_TOOLS.find(x => x.id === ST.step.split(':')[1]);
  return t ? t.comp : '';
}
function ready() { return true; }

/* ───────── ① الملف التمهيدي ───────── */
function vHome() {
  const st = ST, has = st.org && st.org.name;
  return `<div class="wrap home">
    <div class="hm-hero">
      <div class="hm-logo">GRC</div>
      <h1>نظام السعيد <span class="tm">GRC<sup>&#8482;</sup></span></h1>
      <p>منظومة متكاملة لبناء قدرة الحوكمة وإدارة المخاطر والامتثال على نموذج القدرات —
         أربعة مكوّنات وعشرون عنصراً بأدواتها وتقنياتها.</p>
      <span class="hm-cr">تصميم وإعداد وبرمجة: د. محمد عطية · تحت إشراف الأكاديمية الشمالية الغربية بتبوك</span>
    </div>
    <div class="hm-two">
      <button class="hm-c sys" data-go="${has ? 'dash' : 'setup'}">
        <div class="hm-i">🏛️</div>
        <b>النظام</b>
        <span>ابنِ منظومة GRC خطوةً بخطوة: تقييم مبدئي ← مستشار ذكي ← الدراسة ← المواءمة ← التنفيذ ← المراجعة ← تقرير شامل.</span>
        <i>${has ? 'تابع العمل على «' + esc(st.org.name) + '» ◀' : 'ابدأ من الملف التمهيدي ◀'}</i>
      </button>
      <button class="hm-c exam" data-go="exam">
        <div class="hm-i">🎓</div>
        <b>الاختبارات</b>
        <span>ستة اختبارات محاكية على بنك 203 أسئلة ثنائية اللغة بالشرح — خمسة للمكوّنات واختبار شامل، مع شهادة عند الاجتياز.</span>
        <i>ادخل قسم الاختبارات ◀</i>
      </button>
    </div>
    ${has ? `<div class="hm-quick">
      <span>انتقال سريع:</span>
      ${[['setup', 'الملف'], ['baseline', 'التقييم المبدئي'], ['advisor', 'المستشار'],
         ['comp:L', 'الدراسة'], ['report', 'التقرير'], ['ws', 'المساحات']]
        .map(([k, l]) => `<button class="btn o sm" data-go="${k}">${l}</button>`).join('')}
    </div>` : ''}
  </div>`;
}

  const groups = Object.keys(window.ACTIVITIES || {});
  const acts = (window.ACTIVITIES || {})[o.group] || [];
  return `<div class="wrap">

        ${['منشأة', 'إدارة', 'قسم', 'فريق'].map(x => `<button class="sc ${o.scope === x ? 'on' : ''}" data-scope="${x}">${x}</button>`).join('')}
      </div>
      <p class="hint">التشاكل الذاتي في النموذج يعني أنه يُطبَّق على أي مستوى — من منشأة كبرى إلى فريق من ثلاثة أفراد.</p>

    ${o.activity ? aiPreview() : ''}

function extraTools(ec, ck) {
  const list = EXTRA[ec] || [];
  return list.map(x => ({ ...x, done: extraDone(x.id), rec: !!recFor(x.id, ec, ck), why: recFor(x.id, ec, ck) || '' }));

function extraDone(id) {
  const T = ST.tech || {}, P = ST.perf || {}, R = ST.registers || {};
  if (id === 'objtable') return (T.obj || []).length > 0;
  if (id === 'regs') return ['risk', 'opp', 'obl'].some(k => (R[k] || []).length);
  if (id === 'anlz') return (T.par || []).length || (T.fmea || []).length ||
    (T.fishP && Object.values(T.fishP).some(v => String(v || '').trim())) ||
    (T.whyP && String(T.whyP.w5 || '').trim());
  if (id === 'cba') return (T.cba || []).length > 0;
  if (id === 'ctrlm') return (P.ctrl || []).length || Object.values(P.coso || {}).filter(Boolean).length;
  if (id === 'polm') return Object.keys(P.pol || {}).length > 0;
  if (id === 'edum') return (P.edu || []).length > 0;
  if (id === 'incm') return (P.inc || []).length > 0;
  return false;
}

function fields(t, d) {
  return t.fields.map(f => {
    const v = d[f.k];
    if (f.t === 'table') return tableField(f, v);
    if (f.t === 'scale') return scaleField(f, v || {});
    if (f.t === 'area') return `<label class="full"><span>${esc(f.ar)}</span><textarea data-f="${f.k}" rows="4">${esc(v || '')}</textarea></label>`;
    if (f.t === 'num') return `<label class="half"><span>${esc(f.ar)}</span><input type="number" data-f="${f.k}" value="${esc(v || '')}"></label>`;
    if (f.t === 'date') return `<label class="half"><span>${esc(f.ar)}</span><input type="date" data-f="${f.k}" value="${esc(v || '')}"></label>`;
    return `<label class="full"><span>${esc(f.ar)}</span><input data-f="${f.k}" value="${esc(v || '')}"></label>`;
  }).join('');
}

function tableField(f, rows) {
  rows = rows && rows.length ? rows : [{}];
  return `<div class="tbl-w" data-tbl="${f.k}">
    <div class="tbl-h"><b>${esc(f.ar)}</b><button class="btn sm b addrow" type="button">＋ أضف صفاً</button></div>
    <div class="tbl-s"><table class="tbl">
      <thead><tr>${f.cols.map(c => `<th>${esc(c.ar)}</th>`).join('')}<th></th></tr></thead>
      <tbody>${rows.map((r, i) => trow(f, r, i)).join('')}</tbody>
    </table></div></div>`;
}
function trow(f, r, i) {
  return `<tr data-i="${i}">${f.cols.map(c => {
    const v = r[c.k] == null ? '' : r[c.k];
    if (c.t === 'select') return `<td><select data-c="${c.k}"><option value=""></option>${c.opts.map(o => `<option ${v === o ? 'selected' : ''}>${esc(o)}</option>`).join('')}</select></td>`;
    if (c.t === 'calc') return `<td class="calc">${esc(v || '—')}</td>`;
    if (c.t === 'num') return `<td><input type="number" data-c="${c.k}" value="${esc(v)}"></td>`;
    if (c.t === 'date') return `<td><input type="date" data-c="${c.k}" value="${esc(v)}"></td>`;
    return `<td><input data-c="${c.k}" value="${esc(v)}"></td>`;
  }).join('')}<td><button class="delrow" type="button" title="حذف">✕</button></td></tr>`;
}
function scaleField(f, v) {
  return `<div class="scale-w" data-scale="${f.k}">
    <b>${esc(f.ar)}</b>
    ${f.items.map((it, i) => `<div class="lk">
      <div class="lk-q">${esc(it)}</div>

    </div>`).join('')}</div>`;
}

  });
  $$('[data-apdone]').forEach(c => c.onchange = () => {
    const a = apOf(c.dataset.apdone); a.status = c.checked ? 'approved' : ''; save(); render();
  });
  $$('[data-elrep]').forEach(b => b.onclick = () => window.elementReport(b.dataset.elrep));
  const ai = $('#aiGen'); if (ai) ai.onclick = doAI;
  const sv = $('#saveTool'); if (sv) sv.onclick = saveTool;
  if ($('#expBtns') && window.bindExports) window.bindExports();
}
function bindRows() {
  $$('.delrow').forEach(b => b.onclick = () => { const tr = b.closest('tr'); if (tr.parentNode.children.length > 1) tr.remove(); });
}
function curTool() { return window.GRC_TOOLS.find(x => x.id === ST.step.split(':')[1]); }

function readForm() {
  const t = curTool(); const out = {};
  t.fields.forEach(f => {
    if (f.t === 'table') {
      const w = $(`[data-tbl="${f.k}"]`); if (!w) return;
      out[f.k] = [...w.querySelectorAll('tbody tr')].map(tr => {
        const r = {};
        tr.querySelectorAll('[data-c]').forEach(i => r[i.dataset.c] = i.value);
        return r;
      }).filter(r => Object.values(r).some(v => String(v || '').trim()));
    } else if (f.t === 'scale') {
      out[f.k] = (ST.tools[t.id] || {})[f.k] || {};
    } else {
      const i = $(`[data-f="${f.k}"]`); if (i) out[f.k] = i.value;
    }
  });
  return out;
}

function doAI() {
  const t = curTool();
  const g = window.AI.generate(t.id);
  if (!g) { toast('لا يوجد مولّد لهذه الأداة'); return; }
  const cur = readForm();
  // ادمج: لا تمسح ما كتبه المستخدم
  const merged = {};
  t.fields.forEach(f => {
    if (f.t === 'table') {
      const has = (cur[f.k] || []).length;
      merged[f.k] = has ? cur[f.k].concat(g[f.k] || []) : (g[f.k] || []);
    } else if (f.t === 'scale') merged[f.k] = cur[f.k] || {};
    else merged[f.k] = (cur[f.k] && cur[f.k].trim()) ? cur[f.k] : (g[f.k] || '');
  });
  ST.tools[t.id] = merged; save();
  $('#form').innerHTML = fields(t, merged);
  bind();
  toast('✨ وُلِّدت مسودة مخصّصة — عدّل أو أضف كما تشاء');
}

function saveTool() {
  const t = curTool();
  const d = readForm();
  // حسابات
  if (t.id === 'quant') d.rows = (d.rows || []).map(r => {
    const emv = (+r.p || 0) / 100 * (+r.loss || 0);
    return { ...r, emv: Math.round(emv).toLocaleString('en-US'), net: Math.round(emv - (+r.ctrl || 0)).toLocaleString('en-US') };
  });
  if (t.id === 'assurance') d.rows = (d.rows || []).map(r => {
    const o = r.obj === 'نعم', c = r.comp === 'نعم';
    return { ...r, lvl: o && c ? 'ضمان عالٍ' : (o || c) ? 'ضمان محدود' : 'لا ضمان' };
  });
  ST.tools[t.id] = d;
  if (t.feeds) ST.outputs[t.feeds] = d;
  ST.selected[t.el] = [...new Set([...(ST.selected[t.el] || []), t.id])];
  save(); toast('💾 حُفظ المخرَج وأصبح متاحاً للعناصر التالية');
  setTimeout(() => go('comp:' + t.comp), 700);
}

function toast(m) {
  let t = $('#toast');
  if (!t) { t = document.createElement('div'); t.id = 'toast'; document.body.appendChild(t); }
  t.textContent = m; t.classList.add('on');
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('on'), 2600);
}

window.GRCAPP = { go, render, save, load, resetTo, allTP, allMat, LOA, apOf, apStatus, ST: () => ST, readForm, toast, feedName,
  TP_ITEMS, MAT_LEVELS, tpScore, matAvg, esc, vBaseline };
load();
document.addEventListener('DOMContentLoaded', render);
if (document.readyState !== 'loading') render();
})();
</script>
