functioning as intended. It provides assurance to management and stakeholders regarding:\n\n\n\t\n\tPerformance effectiveness\n\t\n\t\n\tControl efficiency\n\t\n\t\n\tRisk management\n\t\n\t\n\tCompliance with obligations\n\t\n\t\n\tIdentification of improvement opportunities\n\t\n\n\nReview is not limited to auditing. It is a comprehensive process involving measurement, analysis, evaluation, learning, and continuous improvement to ensure the organization remains aligned with its strategic objectives.\n\nOCEG (2024). GRC Capability Model v3.5 – Premium Revision 2024. Component R – Review, Page 118.","fa":"مركب المراجعة يهدف إلى التأكد من أن الأهداف ذات الأولوية يتم تحقيقها بطريقة فعالة، وأن الضوابط والإجراءات تعمل كما هو مخطط لها. كما يركز على تقديم ضمان للإدارة وأصحاب المصلحة حول:\n\n\n\t\n\tفعالية الأداء\n\t\n\t\n\tكفاءة الضوابط\n\t\n\t\n\tإدارة المخاطر\n\t\n\t\n\tالامتثال للالتزامات\n\t\n\t\n\tاكتشاف فرص التحسين\n\t\n\n\nالمراجعة ليست مجرد تدقيق، بل هي عملية شاملة تتضمن القياس والتحليل والتقييم والتعلم والتحسين المستمر، مما يضمن بقاء المنظمة على المسار الصحيح وتحقيق أهدافها الاستراتيجية.\n \n\nOCEG (2024). GRC Capability Model v3.5 – Premium Revision 2024. Component R – Review, Page 118."},{"qe":"What are the four aspects of total performance that should be considered across all components and elements of the GRC Capability Model?","qa":"ما هي النواحي الأربعة للأداء الشامل التي ينبغي أخذها بعين الاعتبار في جميع مكونات وعناصر نموذج قدرات الحوكمة والمخاطر والامتثال (GRC)؟","oe":["Vision, mission, strategic, and tactical","Planning, execution, monitoring, and control","Inputs, process, outputs, and feedback","Effectiveness, Efficiency, Agility, and Resilience"],"oa":["الرؤية والمهمة والاستراتيجية والتكتيكية","التخطيط والتنفيذ والمراقبة والتحكم","المدخلات والعملية والمخرجات والملاحظات","الفعالية والكفاءة والاستجابة والمرونة"],"c":3,"ch":"Review Competent","ex":"Exam 2 - GRCP","fe":"The GRC Capability Model emphasizes that every component and element must be evaluated through four interconnected dimensions of total performance:\n\n\n\t\n\tEffectiveness: The degree to which objectives are achieved and processes are properly designed.\n\t\n\t\n\tEfficiency: The optimal use of resources relative to the value created.\n\t\n\t\n\tAgility: The ability to adapt quickly to change.\n\t\n\t\n\tResilience: The capacity to recover, learn, and improve after stress or disruption.\n\t\n\n\nThese four dimensions apply across all components of the model to ensure principled and reliable performance.\n\n \n\nOCEG (2024). GRC Capability Model v3.5 – Premium Revision 2024. Component R – Review, Measurement Section, Page 118–119.","fa":"نموذج قدرات الحوكمة والمخاطر والامتثال يؤكد أن كل عنصر وكل مكون يجب أن يُقاس من خلال أربعة أبعاد مترابطة للأداء الشامل وهي:\n\n\n\t\n\tالفعالية: مدى تحقيق الأهداف وتصميم العمليات بشكل سليم.\n\t\n\t\n\tالكفاءة: مدى الاستخدام الأمثل للموارد مقابل القيمة المتحققة.\n\t\n\t\n\tالاستجابة: سرعة التكيف مع التغيرات والظروف الجديدة.\n\t\n\t\n\tالمرونة: القدرة على التعافي والتعلم والتحسن بعد الضغوط أو الأزمات.\n\t\n\n\nهذه الأبعاد الأربعة تطبق عبر جميع مكونات النموذج لضمان تحقيق\nالأداء المبدئي القائم على المبادئ.\n\n\nOCEG (2024). GRC Capability Model v3.5 – Premium Revision 2024. Component R – Review, Measurement Section, Page 118–119."},{"qe":"In the context of total performance, how can the effectiveness of educational programs be evaluated?","qa":"في سياق الأداء الشامل، كيف يمكن تقييم فعالية البرامج التعليمية؟","oe":["By evaluating design quality, coverage of subject matter, knowledge or skill retention, and impact on organizational objectives","By measuring revenue growth in the organization","By estimating the number of employees receiving promotions","By analyzing customer satisfaction surveys"],"oa":["عن طريق تقييم التصميم، وتغطية النواحي الموضوعية، والاحتفاظ بالمعرفة أو المهارات، والأثر على أهداف المنظمة","عن طريق قياس نمو الإيرادات في المنظمة","عن طريق تقدير عدد الموظفين الحاصلين على الترقيات","عن طريق تحليل استطلاعات رضا العملاء"],"c":0,"ch":"Review Competent","ex":"Exam 2 - GRCP","fe":"Evaluating the effectiveness of educational programs within total performance requires assessing:\n\n\n\t\n\tSound instructional design\n\t\n\t\n\tAdequate subject matter coverage\n\t\n\t\n\tKnowledge or skill retention\n\t\n\t\n\tImpact on organizational objectives\n\t\n\t\n\tContribution to continuous improvement\n\t\n\n\nEffectiveness means that the program is properly designed and produces measurable impact that supports organizational performance.\n \n\nOCEG (2024). GRC Capability Model v3.5 – Premium Revision 2024. Component R – Review, Maturity Model (Education Example), Page 28–29.","fa":"تقييم فعالية البرامج التعليمية في سياق الأداء الشامل يجب أن يشمل:\n\n\n\t\n\tسلامة تصميم البرنامج التعليمي\n\t\n\t\n\tمدى تغطية الموضوعات ذات الصلة\n\t\n\t\n\tقدرة المتعلمين على الاحتفاظ بالمعرفة أو المهارات\n\t\n\t\n\tتأثير البرنامج على تحقيق أهداف المنظمة\n\t\n\t\n\tمساهمة البرنامج في التحسين المستمر\n\t\n\n\nالفعالية لا تعني فقط تقديم محتوى جيد، بل تعني أن البرنامج مصمم بطريقة سليمة ويحقق أثرًا ملموسًا يدعم الأداء المؤسسي.                \n\nOCEG (2024). GRC Capability Model v3.5 – Premium Revision 2024. Component R – Review, Maturity Model (Education Example), Page 28–29."},{"qe":"What is the importance of periodic capability evaluation in the organization?","qa":"ما أهمية التقييم الدوري للقدرات في المنظمة؟","oe":["To ensure the organization’s brand image is positive","To ensure the organization’s stock price or value remains stable","To ensure the capability remains relevant in changing conditions, especially internal and external context changes","To ensure the organization’s supply chains are not disrupted"],"oa":["للتأكد من أن صورة المنظمة التجارية إيجابية","للتأكد من أن سعر حصة المنظمة أو قيمتها ما يزال مستقراً","للتأكد من أن القدرة تظل ذات صلة في ضوء الأحوال المتغيرة، خصوصًا التغيرات في السياق الداخلي والخارجي","للتأكد من أن سلاسل الإمداد للمنظمة لا يتم عرقلتها"],"c":2,"ch":"Review Competent","ex":"Exam 2 - GRCP","fe":"Periodic capability evaluation ensures:\n\n\n\t\n\tContinued alignment with priority objectives\n\t\n\t\n\tAdaptation to internal changes\n\t\n\t\n\tResponsiveness to external environmental changes\n\t\n\t\n\tSustained effectiveness and efficiency\n\t\n\t\n\tSupport for continuous improvement\n\t\n\n\nWithout periodic evaluation, capabilities may become outdated and misaligned with evolving conditions.\n\n \n\nOCEG (2024). GRC Capability Model v3.5 – Premium Revision 2024. Component R – Review, Considerations Section, Page 118–119.","fa":"التقييم الدوري للقدرات ضروري لضمان:\n\n\n\t\n\tاستمرار ملاءمة القدرة للأهداف ذات الأولوية\n\t\n\t\n\tالتكيف مع التغيرات في البيئة الداخلية\n\t\n\t\n\tالاستجابة للتغيرات في البيئة الخارجية\n\t\n\t\n\tالحفاظ على الأداء الفعال والكفء\n\t\n\t\n\tدعم التحسين المستمر\n\t\n\n\nبدون تقييم دوري، قد تصبح القدرة غير متوافقة مع الواقع المتغير، مما يؤدي إلى ضعف الأداء أو فقدان المرونة.                                                                     \n                                                                 \nOCEG (2024). GRC Capability Model v3.5 – Premium Revision 2024. Component R – Review, Considerations Section, Page 118–119."},{"qe":"What is the role of the assurance provider in the assurance process?","qa":"ما دور مزود الضمان في عملية الضمان؟","oe":["Developing the organization’s risk management framework and strategy","Performing evaluation activities on claims and subject matter information to enhance confidence","Performing financial audit procedures and issuing audit reports","Supervising the implementation of the organization’s compliance program and policies"],"oa":["تطوير إطار العمل والاستراتيجية الخاصة بإدارة المخاطر بالمنظمة","تنفيذ أنشطة تقييم الادعاءات والبيانات الخاصة بموضوع الاختصاص لتعزيز الثقة","تنفيذ إجراءات التدقيق المالي وإصدار تقارير التدقيق","الإشراف على تطبيق برنامج وسياسات الامتثال بالمنظمة"],"c":1,"ch":"Review Competent","ex":"Exam 2 - GRCP","fe":"The assurance provider:\n\n\n\t\n\tObjectively evaluates subject matter\n\t\n\t\n\tUses professional competence to form justified conclusions\n\t\n\t\n\tEnhances confidence among information users\n\t\n\t\n\tConfirms that statements and beliefs are supported by sufficient evidence\n\t\n\n\nAssurance is not management or execution; it is independent evaluation that increases trust in information.\n \n\nOCEG (2024). GRC Capability Model v3.5 – Premium Revision 2024. Definition of Assurance, Page 12.","fa":"مزود الضمان يقوم بما يلي:\n\n\n\t\n\tتقييم موضوع الاختصاص تقييماً موضوعياً\n\t\n\t\n\tاستخدام الكفاءة المهنية لإصدار استنتاجات مبررة\n\t\n\t\n\tتعزيز الثقة لدى مستخدمي المعلومات\n\t\n\t\n\tالتأكد من أن التصريحات والمعتقدات مدعومة بأدلة كافية\n\t\n\n\nالضمان لا يعني الإدارة أو التنفيذ، بل يعني التقييم المستقل الذي يوفر الثقة في صحة المعلومات.\n \n\nOCEG (2024). GRC Capability Model v3.5 – Premium Revision 2024. Definition of Assurance, Page 12."},{"qe":"What is the definition of “Assurance”?","qa":"ما هو تعريف مصطلح \"الضمان\"؟","oe":["Assurance is establishing policies to ensure compliance","Assurance is monitoring and controlling financial performance and reports","Assurance is the process of identifying and mitigating risks","Assurance is objectively and competently evaluating subject matter to provide justified conclusions and confidence that statements and beliefs are true"],"oa":["الضمان هو تأسيس السياسات والإجراءات للتأكد من الامتثال بالقوانين واللوائح","الضمان هو ممارسة المراقبة والتحكم بالأداء المالي والتقارير المالية للمنظمة","الضمان هو عملية تعريف وتخفيف المخاطر التي قد تؤثر سلباً على أهداف المنظمة","الضمان هو العمل على تقييم موضوع الاختصاص بالموضوعية والأهلية اللازمة لتقديم الاستنتاجات المبررة والثقة بأن التصريحات والمعتقدات الخاصة بموضوع الاختصاص صحيحة"],"c":3,"ch":"Review Competent","ex":"Exam 2 - GRCP","fe":"Assurance requires:\n\n\n\t\n\tObjectivity and independence\n\t\n\t\n\tProfessional competence\n\t\n\t\n\tSupporting evidence\n\t\n\t\n\tJustified conclusions\n\t\n\t\n\tIncreased confidence for information users\n\t\n\n\nIt is an evaluation process, not management or execution.\n \n\nOCEG (2024). GRC Capability Model v3.5 – Premium Revision 2024. Definition of Assurance, Page 12.","fa":"الضمان يتطلب:\n\n\n\t\n\tموضوعية واستقلال\n\t\n\t\n\tكفاءة مهنية\n\t\n\t\n\tأدلة داعمة\n\t\n\t\n\tإصدار استنتاجات مبررة\n\t\n\t\n\tتعزيز الثقة لدى مستخدمي المعلومات\n\t\n\n\nهو عملية تقييم وليست إدارة أو تنفيذ.     \n\n\nOCEG (2024). GRC Capability Model v3.5 – Premium\nRevision 2024. Definition of Assurance, Page 12."},{"qe":"Which of the following does NOT trigger reconsideration of internal factors within the organization?","qa":"أي من التالي لا يدفع لإعادة النظر في العوامل الداخلية في المنظمة؟","oe":["Stock market fluctuations and economic conditions","Changes in governmental regulations and industry standards","Competitors launching new products or services","Normal seasonal fluctuations in purchasing"],"oa":["تذبذبات سوق الأسهم والأحوال الاقتصادية","التغيرات في اللوائح الحكومية ومعايير القطاع","إطلاق المنافسين لمنتجات أو خدمات جديدة","التذبذبات الموسمية العادية في المشتريات"],"c":3,"ch":"Learn Component","ex":"Exam 2 - GRCP","fe":"Reconsideration of internal factors is typically triggered by:\n\n\n\t\n\tStrategic shifts\n\t\n\t\n\tRegulatory changes\n\t\n\t\n\tCompetitive pressures\n\t\n\t\n\tSignificant economic impacts\n\t\n\n\nNormal seasonal fluctuations are predictable operational cycles and do not generally justify a reassessment of internal factors.\n\nOCEG (2024). GRC Capability Model v3.5 – Premium Revision 2024. LEARN Component – Internal Context Considerations.","fa":"إعادة النظر في العوامل الداخلية عادةً ما تكون نتيجة:\n\n\n\t\n\tتغيرات استراتيجية\n\t\n\t\n\tضغوط تنظيمية\n\t\n\t\n\tتغيرات في البيئة التنافسية\n\t\n\t\n\tتقلبات اقتصادية مؤثرة\n\t\n\n\nأما التذبذبات الموسمية الطبيعية فهي أنماط متوقعة ومخطط لها ضمن العمليات التشغيلية، ولا تمثل تغيرًا استثنائيًا يستوجب مراجعة جوهرية للعوامل الداخلية.\n\nOCEG (2024). GRC Capability Model v3.5 – Premium Revision 2024. LEARN Component – Internal Context Considerations."},{"qe":"Which aspect of culture includes the execution and design of the organization, how management authority interacts with the executive team, and whether leadership demonstrates behaviors both as example and in practice?","qa":"أي جانب من جوانب الثقافة يتضمن تنفيذ وتصميم المنظمة، وتشمل كيفية تفاعل السلطة الإدارية مع الفريق التنفيذي، وما إذا كانت القيادة تظهر السلوكيات قدوة وفعلاً؟","oe":["Governance Culture","Performance Culture","Management Culture","Assurance Culture"],"oa":["ثقافة الحوكمة","ثقافة الأداء","ثقافة الإدارة","ثقافة الضمان"],"c":0,"ch":"Learn Component","ex":"Exam 2 - GRCP","fe":"Governance culture reflects:\n\n\n\t\n\tHow authority is structured and exercised\n\t\n\t\n\tThe relationship between governing body and executive management\n\t\n\t\n\tLeadership behavior as role model\n\t\n\t\n\tCommitment to principles and integrity\n\t\n\t\n\tOrganizational design and decision rights\n\t\n\n\nIt directly influences integrity, consistency, and principled performance.\n \n\nOCEG (2024). GRC Capability Model v3.5 – Premium Revision 2024. LEARN Component – Culture Element (L3), Page 56–58.","fa":"ثقافة الحوكمة تعكس:\n\n\n\t\n\tكيفية توزيع وممارسة السلطة داخل المنظمة\n\t\n\t\n\tالعلاقة بين مجلس الإدارة والإدارة التنفيذية\n\t\n\t\n\tسلوك القيادة كقدوة عملية\n\t\n\t\n\tمدى التزام القيادة بالقيم والمبادئ\n\t\n\t\n\tتصميم الهيكل التنظيمي وصلاحيات اتخاذ القرار\n\t\n\n\nهذا الجانب من الثقافة يؤثر بشكل مباشر على النزاهة والاتساق والقدرة على تحقيق الأداء المبدئي القائم على المبادئ.\nOCEG (2024). GRC Capability Model v3.5 – Premium Revision 2024. LEARN Component – Culture Element (L3), Page 56–58."},{"qe":"What are some considerations when dealing with conflicting stakeholder needs?","qa":"ما هي بعض الأمور التي تؤخذ بعين الاعتبار عند التعامل مع تضارب احتياجات أصحاب المصلحة؟","oe":["Recognizing that not all stakeholders should have equal influence on the organization and prioritizing based on authority and impact","Assigning separate internal representatives for conflicting stakeholder groups","Ensuring separation between stakeholders with conflicting needs","Establishing a formal dispute resolution process for stakeholders with conflicting needs"],"oa":["إدراك أنه لا ينبغي أن يكون لكل أصحاب المصلحة التأثير ذاته على المنظمة، وترتيب الأولويات بناءً على السلطة والتأثير","تعيين مسؤولين داخليين مختلفين لأصحاب المصلحة ذوي الاحتياجات المتضاربة ليشرف كل منهم على مناقشة آراء أصحاب المصلحة الذين يمثلونهم","التأكد من فصل أصحاب المصلحة ذوي الاحتياجات المتضاربة عن بعضهم بعضاً","وضع عملية رسمية لتسوية المنازعات لأصحاب المصلحة ذوي الاحتياجات المتضاربة"],"c":0,"ch":"Learn Component","ex":"Exam 2 - GRCP","fe":"When stakeholder needs conflict, organizations must:\n\n\n\t\n\tAssess power and authority\n\t\n\t\n\tEvaluate level of interest and impact\n\t\n\t\n\tPrioritize stakeholders based on strategic importance\n\t\n\t\n\tBalance competing interests systematically\n\t\n\n\nNot all stakeholders carry equal weight in decision-making; prioritization based on influence is essential.\n \n\nOCEG (2024). GRC Capability Model v3.5 – Premium Revision 2024. LEARN Component – L4 Stakeholders, Page 63–65.","fa":"عند وجود تضارب في احتياجات أصحاب المصلحة، يجب:\n\n\n\t\n\tتحليل مستوى السلطة والتأثير\n\t\n\t\n\tتقييم درجة الاهتمام أو التأثر\n\t\n\t\n\tترتيب الأولويات بناءً على أهمية كل طرف لتحقيق الأهداف\n\t\n\t\n\tالموازنة بين المصالح المتعارضة بطريقة منهجية\n\t\n\n\nليس كل أصحاب المصلحة يمتلكون الوزن ذاته في عملية اتخاذ القرار، ولذلك فإن إدارة التأثير والأولوية عنصر أساسي في عنصر أصحاب المصلحة.\n\nOCEG (2024). GRC Capability Model v3.5 – Premium Revision 2024. LEARN Component – L4 Stakeholders, Page 63–65."},{"qe":"What are the two primary factors in the organization’s interactions with stakeholders?","qa":"ما هما العاملان الرئيسيان في تفاعلات المنظمة مع أصحاب المصلحة؟","oe":["Push and pull","Interest and authority (power)","Compliance and ethics","Internal and external"],"oa":["الدفع والسحب","الاهتمام والسلطة","الامتثال والأخلاقيات","الداخلية والخارجية"],"c":1,"ch":"Learn Component","ex":"Exam 1 - GRCP","fe":"Stakeholder management is primarily based on two dimensions:\n\n\n\t\n\tPower or authority:\n\tThe stakeholder’s ability to influence decisions or outcomes.\n\t\n\t\n\tInterest:\n\tThe degree to which the stakeholder cares about or is affected by outcomes.\n\t\n\n\nThese two dimensions determine:\n\n\n\t\n\tWho must be closely engaged\n\t\n\t\n\tWho must be kept informed\n\t\n\t\n\tWho must be monitored\n\t\n\t\n\tWho requires active management\n\t\n\n\nThis forms the foundation of the power-interest matrix.\n \n\nOCEG (2024). GRC Capability Model v3.5 – Premium Revision 2024. LEARN Component – L4 Stakeholders, Page 63–64.","fa":"الشرح بالعربية:\n\nإدارة أصحاب المصلحة تعتمد بشكل أساسي على بعدين رئيسيين:\n\n\n\t\n\tالسلطة أو التأثير:\n\tمدى قدرة صاحب المصلحة على التأثير في قرارات المنظمة أو نتائجها.\n\t\n\t\n\tالاهتمام:\n\tمدى اهتمام صاحب المصلحة بنتائج المنظمة أو تأثره بها.\n\t\n\n\nمن خلال تحليل هذين العاملين يتم تحديد:\n\n\n\t\n\tمن يجب إشراكه بشكل وثيق\n\t\n\t\n\tمن يجب إطلاعه فقط\n\t\n\t\n\tمن يجب مراقبته\n\t\n\t\n\tمن يجب إدارته بشكل مباشر\n\t\n\n\nوهذا هو الأساس المنهجي لمصفوفة القوة والاهتمام.                   \n\nOCEG (2024). GRC Capability Model v3.5 – Premium Revision 2024. LEARN Component – L4 Stakeholders, Page 63–64."},{"qe":"What is the primary purpose of the ALIGN component in the GRC Capability Model?","qa":"ما الغرض الرئيسي من وجود مُركّب (المواءمة) في نموذج قدرات الحوكمة والمخاطر والامتثال (GRC)؟","oe":["To coordinate the monitoring and evaluation of governance, risk, and compliance activities within the organization","To determine organizational direction and objectives and design an integrated plan to address opportunities, uncertainties, and obligations","To review and improve policies and controls and ensure their alignment with operational processes","To establish communication channels and provide stakeholder awareness about aligning operations with their needs"],"oa":["لتنسيق مراقبة وتقييم أنشطة الحوكمة والمخاطر والامتثال في المنظمة","لتحديد توجه المنظمة وأهدافها وتصميم خطة متكاملة للتعامل مع الفرص والعقبات والالتزامات","لمراجعة وتحسين السياسات والضوابط في المنظمة وضمان مواءمتها مع العمليات التشغيلية","لتأسيس قنوات التواصل وتوفير التوعية لأصحاب المصلحة حول كيفية مواءمة العمليات التشغيلية مع احتياجاتهم"],"c":1,"ch":"Align Competent","ex":"Exam 2 - GRCP","fe":"The ALIGN component ensures that:\n\n\n\t\n\tOrganizational direction is clearly defined\n\t\n\t\n\tStrategic objectives are connected to capabilities\n\t\n\t\n\tAn integrated plan exists to address\n\n\t\n\t\t\n\t\tOpportunities\n\t\t\n\t\t\n\t\tUncertainties\n\t\t\n\t\t\n\t\tObligations\n\t\t\n\t\n\t\n\n\nALIGN bridges contextual understanding from LEARN to strategic integration across governance, risk, and compliance.\n\n \n\nOCEG (2024). GRC Capability Model v3.5 – Premium Revision 2024. ALIGN Component Overview, Chapter 3, Page 78–80.","fa":"مركّب المواءمة يركز على ضمان أن:\n\n\n\t\n\tتوجه المنظمة واضح ومحدد\n\t\n\t\n\tالأهداف الاستراتيجية مترابطة مع القدرات المؤسسية\n\t\n\t\n\tتوجد خطة متكاملة لمعالجة\n\n\t\n\t\t\n\t\tالفرص\n\t\t\n\t\t\n\t\tحالات عدم اليقين\n\t\t\n\t\t\n\t\tالالتزامات\n\t\t\n\t\n\t\n\n\nالمواءمة تعني الانتقال من فهم السياق في مرحلة الدراسة إلى تصميم استجابة استراتيجية متكاملة تضمن انسجام الأنشطة مع التوجه العام للمنظمة.                                                                   \n\nOCEG (2024). GRC Capability Model v3.5 – Premium  Revision 2024. ALIGN Component Overview  Chapter 3, Page 78–80"},{"qe":"What is the importance of clarity of mission, vision, and values within an organization?","qa":"ما أهمية وضوح المهمة والرؤية والقيم داخل المنظمة؟","oe":["It is important for gaining and maintaining the support of all stakeholders","It is necessary for developing development and training programs aligned with mission, vision, and values","It enables the workforce to understand and make decisions at all levels, preventing the organization from operating based on random beliefs or interests","It is necessary for compliance with regulations and sector requirements"],"oa":["أنها مهمة لاكتساب والحفاظ على دعم جميع أصحاب المصلحة","أنها ضرورية لتطوير برامج التنمية والتدريب في المنظمة بما يتواءم مع المهمة والرؤية والقيم","أنها تعين القوى العاملة على فهم واتخاذ القرارات على جميع المستويات، مما يمنع المنظمة من العمل بمعتقدات واهتمامات عشوائية","أنها ضرورية للامتثال للوائح وأنظمة القطاع"],"c":2,"ch":"Align Competent","ex":"Exam 2 - GRCP","fe":"Clarity of mission, vision, and values:\n\n\n\t\n\tGuides decision-making at all organizational levels\n\t\n\t\n\tEnsures alignment across departments\n\t\n\t\n\tReduces behavioral and strategic inconsistencies\n\t\n\t\n\tPrevents decisions driven by personal agendas or random interests\n\t\n\n\nClear mission, vision, and values act as a foundational reference for strategic and operational consistency.\n \n\nOCEG (2024). GRC Capability Model v3.5 – Premium Revision 2024. LEARN Component – L2 Internal Context, Chapter 2, Page 52–54.","fa":"وضوح المهمة والرؤية والقيم يؤدي إلى:\n\n\n\t\n\tتوجيه عملية اتخاذ القرار على جميع المستويات\n\t\n\t\n\tتحقيق الاتساق بين الإدارات والوظائف\n\t\n\t\n\tتقليل التضارب في التوجهات والسلوكيات\n\t\n\t\n\tمنع العمل بناءً على مصالح فردية أو معتقدات غير منسجمة مع توجه المنظمة\n\t\n\n\nعندما تكون المهمة والرؤية والقيم واضحة، تصبح مرجعًا دائمًا للسلوك المؤسسي والقرارات الاستراتيجية والتشغيلية، مما يعزز الانضباط المؤسسي ويحقق التماسك الداخلي.\n \n\nOCEG (2024). GRC Capability Model v3.5 – Premium Revision 2024. LEARN Component – L2 Internal Context, Chapter 2, Page 52–54."},{"qe":"How is the impact of uncertain conditions on objectives classified as positive or negative?","qa":"كيف يتم تصنيف تأثير الأحوال غير المؤكدة على الأهداف بأنها إيجابية أو سلبية؟","oe":["Positive impact is called hope, and negative impact is called obstacle","Positive impact of uncertainty is called benefit, and negative impact is called harm","Positive impact of uncertainty is called gains, and negative impact is called risks","Positive impact is called benefit, and negative impact is called hope"],"oa":["التأثير الإيجابي للأحوال غير المؤكدة يُسمى أمل، والتأثير السلبي للأحوال غير المؤكدة يُسمى عائق","التأثير الإيجابي للأحوال غير المؤكدة يُسمى منفعة، والتأثير السلبي للأحوال غير المؤكدة يُسمى ضرر","التأثير الإيجابي للأحوال غير المؤكدة يُسمى مكاسب، والتأثير السلبي للأحوال غير المؤكدة يُسمى مخاطر","التأثير الإيجابي للأحوال غير المؤكدة يُسمى منفعة، والتأثير السلبي للأحوال غير المؤكدة يُسمى أمل"],"c":1,"ch":"Align Competent","ex":"Exam 2 - GRCP","fe":"Uncertain conditions may impact objectives in two ways:\n\n\n\t\n\tA positive impact represents a potential benefit that enhances achievement of objectives.\n\t\n\t\n\tA negative impact represents harm that may hinder objective achievement.\n\t\n\n\nThis classification reflects the integrated understanding of uncertainty management, recognizing both positive and negative impacts.\n \n\nOCEG (2024). GRC Capability Model v3.5 – Premium Revision 2024. ALIGN Component – Objectives and Uncertainty, Chapter 3, Page 82–84.","fa":"الأحوال غير المؤكدة قد تؤثر على الأهداف بطريقتين:\n\n\n\t\n\tإذا كان التأثير إيجابيًا فإنه يمثل منفعة محتملة تعزز تحقيق الأهداف.\n\t\n\t\n\tإذا كان التأثير سلبيًا فإنه يمثل ضررًا قد يعيق تحقيق الأهداف.\n\t\n\n\nهذا التصنيف ينسجم مع الفهم المتكامل لإدارة المخاطر ضمن النموذج، حيث لا يقتصر التعامل على المخاطر السلبية فقط، بل يشمل أيضًا تعظيم المنافع المحتملة.                                                             \n\nOCEG (2024). GRC Capability Model v3.5 – Premium Revision 2024. ALIGN Component – Objectives and Uncertainty, Chapter 3, Page 82–84."},{"qe":"What is the role of identification criteria?","qa":"ما هو دور معايير التعرّف؟","oe":["Identification criteria are used to establish communication channels","Identification criteria are used to calculate the organization’s total budget","Identification criteria are used to determine sequencing of units","Identification criteria are used to focus on objectives and outcomes that matter"],"oa":["تُستخدم معايير التعرّف لتأسيس قنوات التواصل داخل المنظمة فيما يتعلق بالفرص والعقبات والالتزامات","تُستخدم معايير التعرّف لاحتساب الميزانية الإجمالية للمنظمة بناءً على الأهداف ذات الأهمية وعدد العقبات والالتزامات ذات الصلة","تُستخدم معايير التعرّف لتحديد الترتيب الذي تتبعه الوحدات في تنفيذ أنشطة التعرّف","تُستخدم معايير التعرّف للتركيز على الأهداف والنتائج ذات الأهمية"],"c":3,"ch":"Align Competent","ex":"Exam 2 - GRCP","fe":"Identification criteria are used to:\n\n\n\t\n\tPrioritize objectives\n\t\n\t\n\tDistinguish significant opportunities, uncertainties, and obligations\n\t\n\t\n\tAvoid wasted effort on immaterial issues\n\t\n\t\n\tEnsure resources focus on impactful outcomes\n\t\n\n\nThey provide disciplined focus during identification activities.\n \n\nOCEG (2024). GRC Capability Model v3.5 – Premium Revision 2024. ALIGN Component – Identification Criteria, Chapter 3, Page 86–88.","fa":"معايير التعرّف تُستخدم من أجل:\n\n\n\t\n\tتحديد الأهداف ذات الأولوية\n\t\n\t\n\tتمييز الفرص والعقبات والالتزامات المهمة\n\t\n\t\n\tمنع إهدار الجهد على مسائل غير مؤثرة\n\t\n\t\n\tضمان تركيز الموارد على ما يؤثر فعليًا على النتائج\n\t\n\n\nهي أداة توجيهية تساعد في تطبيق منهجية منظمة ومنضبطة في التعرف على القضايا المهمة.                                                          \n\nOCEG (2024). GRC Capability Model v3.5 – Premium Revision 2024. ALIGN Component – Identification Criteria, Chapter 3, Page 86–88."},{"qe":"What does the term “inherent risk” refer to?","qa":"إلى ماذا يشير مصطلح \"المخاطر المتأصلة\"؟","oe":["The level of risk in the absence of procedures and controls","The complete elimination of all organizational risks","Risks associated only with internal factors","The level of risk after all controls are applied"],"oa":["إلى مستوى المخاطر في غياب الإجراءات والضوابط","إلى القضاء التام على جميع المخاطر بالمنظمة","إلى المخاطر المرتبطة فقط بالعوامل الداخلية","إلى مستوى المخاطر بعد تطبيق جميع الضوابط"],"c":0,"ch":"Key Concepts","ex":"Exam 2 - GRCP","fe":"Inherent risk is the natural level of risk before:\n\n\n\t\n\tControls are implemented\n\t\n\t\n\tMitigation measures are applied\n\t\n\t\n\tPreventive actions are taken\n\t\n\n\nIt reflects the organization’s raw exposure to uncertainty.\nAfter controls are applied, the remaining exposure is called residual risk.\n\nOCEG (2024). GRC Capability Model v3.5 – Premium Revision 2024. PERFORM Component – Risk and Control Concepts, Chapter 4, Page 101–103.","fa":"المخاطر المتأصلة هي مستوى الخطر الموجود بطبيعته قبل:\n\n\n\t\n\tتطبيق الضوابط\n\t\n\t\n\tتنفيذ الإجراءات الوقائية\n\t\n\t\n\tاتخاذ أي تدابير تخفيف\n\t\n\n\nوهي تعكس التعرض الطبيعي للمنظمة تجاه حدث غير مؤكد قد يؤثر على الأهداف.\nبعد تطبيق الضوابط يصبح لدينا ما يسمى بالمخاطر المتبقية.\n\nOCEG (2024). GRC Capability Model v3.5 – Premium Revision 2024. PERFORM Component – Risk and Control Concepts, Chapter 4, Page 101–103."},{"qe":"What are the potential advantages of using quantitative analysis methods in the context of risks, benefits, and compliance?","qa":"ما هي المزايا المحتملة لاتباع أساليب التحليل الكمي في سياق المخاطر والمكاسب والامتثال؟","oe":["Quantitative methods allow estimation using numerical data enabling comparisons between targets, tolerance, and capacity","Quantitative methods eliminate the need for qualitative analysis","Quantitative methods ignore compliance requirements","Quantitative methods require focus only on financial aspects"],"oa":["تسمح أساليب التحليل الكمي بتقدير المخاطر والمكاسب والامتثال باستخدام بيانات رقمية مما يتيح إجراء المقارنات بين المستهدفات ونطاق التحمل والنطاق الاستيعابي","تلغي أساليب التحليل الكمي الحاجة لأي تحليل نوعي","تتجاهل أساليب التحليل الكمي متطلبات الامتثال وتركز فقط على المخاطر والمكاسب","تتطلب أساليب التحليل الكمي النظر فقط إلى النواحي المالية للمخاطر والمكاسب"],"c":0,"ch":"Perform Competent","ex":"Exam 2 - GRCP","fe":"Quantitative analysis enables:\n\n\n\t\n\tUse of measurable numerical data\n\t\n\t\n\tComparison between actual performance and targets\n\t\n\t\n\tEvaluation of tolerance and capacity thresholds\n\t\n\t\n\tEvidence-based decision-making\n\t\n\n\nIt strengthens objective evaluation across risk, benefit, and compliance dimensions.\n \n\nOCEG (2024). GRC Capability Model v3.5 – Premium Revision 2024. PERFORM Component – Measurement and Analysis, Chapter 4, Page 112–115.","fa":"التحليل الكمي يتيح:\n\n\n\t\n\tاستخدام بيانات رقمية قابلة للقياس\n\t\n\t\n\tمقارنة الأداء الفعلي بالمستهدف\n\t\n\t\n\tتقييم نطاق التحمل ونطاق الاستيعاب\n\t\n\t\n\tدعم اتخاذ القرار بناءً على أرقام واضحة\n\t\n\n\nيساعد ذلك الإدارة على فهم مدى اقترابها من تحقيق الأهداف وحدود المخاطر المقبولة.                                                        \nOCEG (2024). GRC Capability Model v3.5 – Premium Revision 2024. PERFORM Component – Measurement and Analysis, Chapter 4, Page 112–115."},{"qe":"In the context of uncertainty, what is the difference between likelihood and impact?","qa":"في سياق الأحوال غير المؤكدة، ما الفرق بين الاحتمالية والأثر؟","oe":["Likelihood refers to the possibility of an event occurring after controls have been implemented, while impact measures the economic and non-economic consequences of the event","Likelihood is a measure of the possibility of an event occurring, while impact measures the economic and non-economic consequences of the event","Likelihood is a measure of the possibility of an event occurring, while impact refers to the location within the organization where the event occurs","Likelihood is a measure of the possibility of an event occurring, while impact is a category of types of risks or benefits arising from the event"],"oa":["الاحتمالية هي إمكانية وقوع الحدث بعد وضع الضوابط قيد التنفيذ، بينما يقيس الأثر العواقب الاقتصادية وغير الاقتصادية للحدث","الاحتمالية هي مقياس لإمكانية وقوع الحدث، بينما يقيس الأثر العواقب الاقتصادية وغير الاقتصادية للحدث","الاحتمالية هي مقياس لإمكانية وقوع الحدث، أما الأثر فهو مكان وقوع الحدث داخل المنظمة","الاحتمالية هي مقياس لإمكانية وقوع الحدث، أما الأثر فهو فئة من أنواع المخاطر أو المكاسب من الحدث"],"c":1,"ch":"Key Concepts","ex":"Exam 2 - GRCP","fe":"In uncertainty management:\n\n\n\t\n\tLikelihood represents the probability or possibility that an event will occur.\n\t\n\t\n\tImpact represents the magnitude of the consequences, whether economic, operational, legal, reputational, or otherwise.\n\t\n\n\nAssessing both likelihood and impact enables evaluation of overall exposure and prioritization of response.\n \n\nOCEG (2024). GRC Capability Model v3.5 – Premium Revision 2024. PERFORM Component – Risk Assessment Concepts, Chapter 4, Page 104–106.","fa":"في إدارة الأحوال غير المؤكدة:\n\n\n\t\n\tالاحتمالية تمثل درجة إمكانية وقوع الحدث.\n\t\n\t\n\tالأثر يمثل حجم وتأثير نتائج الحدث سواء كانت اقتصادية أو تشغيلية أو قانونية أو سمعة أو غيرها.\n\t\n\n\nتحليل الاحتمالية والأثر معًا يساعد في تحديد مستوى التعرض الكلي وتقدير أولوية المعالجة.                                     \n\nOCEG (2024). GRC Capability Model v3.5 – Premium Revision 2024. PERFORM Component – Risk Assessment Concepts, Chapter 4, Page 104–106."},{"qe":"Which design option involves outsourcing, joint ventures and partnerships, purchasing insurance, or using other financial instruments?","qa":"أي من خيارات التصميم يتسم بالاستعانة بمصادر خارجية، أو بمشاريع مشتركة وشراكات، أو بشراء التأمين، أو الاستعانة بأدوات مالية أخرى؟","oe":["Accept option","Avoid option","Share option","Control option"],"oa":["خيار القبول","خيار التفادي","خيار المشاركة","خيار التحكم"],"c":2,"ch":"Align Competent","ex":"Exam 2 - GRCP","fe":"The share option is used when an organization intends to:\n\n\n\t\n\tTransfer part of the exposure to another party\n\t\n\t\n\tDistribute risks or benefits\n\t\n\t\n\tPurchase insurance\n\t\n\t\n\tEnter joint ventures or partnerships\n\t\n\t\n\tUse financial hedging instruments\n\t\n\n\nThe fundamental concept is sharing exposure rather than retaining it fully.\n\n \n\nOCEG (2024). GRC Capability Model v3.5 – Premium Revision 2024. PERFORM Component – Design and Response Options, Chapter 4, Page 118–121.","fa":"خيار المشاركة (Share) يُستخدم عندما ترغب المنظمة في:\n\n\n\t\n\tنقل جزء من التعرض لطرف آخر\n\t\n\t\n\tتوزيع المخاطر أو المكاسب\n\t\n\t\n\tاستخدام التأمين\n\t\n\t\n\tالدخول في شراكات أو مشاريع مشتركة\n\t\n\t\n\tاستخدام أدوات مالية للتحوط\n\t\n\n\nالفكرة الأساسية هنا هي تقاسم التعرض بدلاً من الاحتفاظ به بالكامل.       \n\nOCEG (2024). GRC Capability Model v3.5 – Premium Revision 2024. PERFORM Component – Design and Response Options, Chapter 4, Page 118–121."},{"qe":"How is effectiveness measured within the PERFORM component?","qa":"كيف يتم قياس الفعالية بمركّب (التنفيذ)؟","oe":["Through evaluating the Return on Investment (ROI) of organizational initiatives supported by execution procedures and controls","Through evaluating the effectiveness of the design and operating effectiveness of execution procedures and controls","Through conducting periodic audits and inspections of organizational operations embedded within execution procedures and controls","Through analyzing opinions or suggestions from employees and stakeholders regarding execution procedures and controls"],"oa":["من خلال تقييم العائد على الاستثمار (Return on Investment – ROI) لمبادرات المنظمة التي تدعمها إجراءات وضوابط التنفيذ","من خلال تقييم فعالية التصميم والتشغيل لإجراءات وضوابط التنفيذ","من خلال عمل التدقيق والتفتيش الدوري لعمليات المنظمة المدمجة ضمن إجراءات وضوابط التنفيذ","من خلال تحليل الآراء أو الاقتراحات من الموظفين وأصحاب المصلحة حول إجراءات وضوابط التنفيذ"],"c":1,"ch":"Perform Competent","ex":"Exam 1 - GRCP","fe":"Within the PERFORM component, effectiveness is measured through:\n\n\n\t\n\tDesign Effectiveness:\n\tWhether controls and procedures are properly designed to address risks and obligations.\n\t\n\t\n\tOperating Effectiveness:\n\tWhether those controls are functioning consistently as intended in practice.\n\t\n\n\nTrue effectiveness requires both sound design and consistent operation.\n\n\nOCEG (2024). GRC Capability Model v3.5 – Premium Revision 2024. PERFORM Component – Control Effectiveness, Chapter 4, Page 124–127.","fa":"في مركّب التنفيذ (PERFORM) يتم قياس الفعالية عبر:\n\n\n\t\n\tفعالية التصميم (Design Effectiveness):\n\tهل تم تصميم الإجراءات والضوابط بطريقة مناسبة لمعالجة المخاطر والالتزامات؟\n\t\n\t\n\tالفعالية التشغيلية (Operating Effectiveness):\n\tهل يتم تطبيق الإجراءات والضوابط كما هو مخطط لها وباستمرار؟\n\t\n\n\nالفعالية الحقيقية تتحقق عندما يكون التصميم سليمًا والتشغيل فعّالًا في الواقع العملي.                                                         \nOCEG (2024). GRC Capability Model v3.5 – Premium Revision 2024. PERFORM Component – Control Effectiveness, Chapter 4, Page 124–127."},{"qe":"What are the three dimensions of procedures and controls within the PERFORM component?","qa":"ما هي المحاور الثلاث للإجراءات والضوابط في مكون (التنفيذ)؟","oe":["Financial, operational, and reputational dimensions","Strategic, operational, and tactical dimensions","Short-term, medium-term, and long-term dimensions","Management, governance, and assurance dimensions"],"oa":["المحاور المالية والتشغيلية والمتعلقة بالسمعة","المحاور الاستراتيجية، والتشغيلية، والتكتيكية","المحاور قصيرة المدى ومتوسطة المدى وطويلة المدى","محاور الإدارة والحوكمة والضمان"],"c":1,"ch":"Perform Competent","ex":"Exam 2 - GRCP","fe":"Within the PERFORM component, procedures and controls must span:\n\n\n\t\n\tStrategic dimension:\n\tEnsuring alignment with organizational direction and objectives.\n\t\n\t\n\tOperational dimension:\n\tManaging day-to-day processes and operational risks.\n\t\n\t\n\tTactical dimension:\n\tSupporting specific activities and control implementations.\n\t\n\n\nThese three dimensions ensure full integration across planning and execution levels.","fa":"في مركّب التنفيذ (PERFORM)، يجب أن تمتد الإجراءات والضوابط عبر:\n\nالمحور الاستراتيجي:\n\nلضمان دعم الأهداف والتوجه العام للمنظمة.\n\n🎯 مثال تطبيقي:\n\nالسيناريو:\nشركة تعمل في القطاع المالي ترغب في التوسع الرقمي.\n\nإجراء/ضبط استراتيجي:\n\n\n\tوضع سياسة لإدارة المخاطر الرقمية مرتبطة بخطة التحول الرقمي.\n\tتحديد مستوى تحمل المخاطر (Risk Appetite) المعتمد من مجلس الإدارة.\n\tإنشاء لجنة إشراف على مخاطر الأمن السيبراني.\n\n\n🔎 لماذا هو استراتيجي؟\n\nلأنه:\n\n\n\tمرتبط برؤية المنظمة\n\tيعتمد من الإدارة العليا\n\tيؤثر على توجه المنظمة بالكامل\n\n\nالمحور التشغيلي:\nلضمان كفاءة العمليات اليومية وإدارة المخاطر التشغيلية.​​​​​​​\n\n🎯 مثال تطبيقي:\n\nالسيناريو:\nنفس الشركة الرقمية تحتاج إلى حماية بيانات العملاء.\n\nإجراء/ضبط تشغيلي:\n\n\n\t\n\tتطبيق نظام مراقبة دخول المستخدمين (Access Control System).\n\t\n\t\n\tمراجعة صلاحيات المستخدمين كل 3 أشهر.\n\t\n\t\n\tتنفيذ نسخ احتياطي دوري للبيانات.\n\t\n\n\n🔎 لماذا هو تشغيلي؟\n\nلأنه:\n\n\n\tيطبق يوميًا\n\tيدار بواسطة إدارات تنفيذية\n\tيحد من المخاطر التشغيلية المباشرة\n\n\nالمحور التكتيكي:\n\nلضمان التطبيق الفعلي للإجراءات على مستوى الأنشطة المحددة.\n\n🎯 مثال تطبيقي:\n\nالسيناريو:\nتنفيذ حملة تحديث لأنظمة الحماية.\n\nإجراء/ضبط تكتيكي:\n\n\n\t\n\tتحديث كلمة المرور كل 60 يومًا.\n\t\n\t\n\tتفعيل المصادقة الثنائية (Multi-Factor Authentication).\n\t\n\t\n\tاستخدام قائمة تحقق (Checklist) قبل نشر أي تحديث تقني.\n\t\n\n\n🔎 لماذا هو تكتيكي؟\n\nلأنه:\n\n\n\tإجراء محدد\n\tقابل للقياس\n\tيطبق على مستوى نشاط أو مهمة معينة\n\n\nوجود هذه المحاور الثلاثة يضمن التكامل بين التخطيط والتنفيذ والمتابعة داخل النظام المؤسسي.\n​​​​​​​"},{"qe":"For what purpose was the Integrated Assurance and Control Model (IACM) designed?","qa":"ما الذي من أجله تم تصميم نموذج الإجراءات والضوابط المتكامل (IACM)؟","oe":["The IACM was designed to eliminate all risks and achieve complete compliance","The IACM provides a comprehensive model for considering all governance, management, and assurance procedures and controls related to performance, risk, and compliance","The IACM was designed to provide a structure for deciding whether to outsource governance, management, and assurance responsibilities","The IACM was designed to provide a financial model to maximize profits while addressing risk and compliance considerations"],"oa":["تم تصميم نموذج الاجراءات والضوابط المتكامل لتوفير إطار عمل للقضاء على جميع المخاطر وتحقيق الامتثال التام","نموذج IACM يوفر نموذجًا شاملًا للنظر في جميع الإجراءات والضوابط التابعة للحوكمة والإدارة والضمان حول الأداء والمخاطر والامتثال","تم تصميم نموذج الاجراءات والضوابط المتكامل لتوفير هيكل لاتخاذ القرار حول الاستعانة بمصادر خارجية لتحمل بعض أو كل المسؤولية المتعلقة بأنشطة الحوكمة والإدارة والضمان","تم تصميم نموذج IACM لتوفير نموذج مالي لمضاعفة الأرباح بالتعامل مع اعتبارات المخاطر والامتثال"],"c":1,"ch":"Key Concepts","ex":"Exam 2 - GRCP","fe":"The IACM was designed to:\n\n\n\t\n\tIntegrate governance, management, and assurance activities\n\t\n\t\n\tEliminate duplication and fragmentation of controls\n\t\n\t\n\tAlign performance, risk, and compliance activities\n\t\n\t\n\tProvide a holistic view of organizational procedures and controls\n\t\n\n\nIt ensures coordination across planning, execution, and assurance layers.\n \n\nOCEG (2024). GRC Capability Model v3.5 – Premium Revision 2024. , Chapter 4, Page 130–132.","fa":"تم تصميم نموذج IACM من أجل:\n\n\n\t\n\tتوحيد أنشطة الحوكمة والإدارة والضمان\n\t\n\t\n\tمنع التكرار والتداخل بين الضوابط\n\t\n\t\n\tتحقيق التنسيق بين الأداء والمخاطر والامتثال\n\t\n\t\n\tضمان وجود رؤية شاملة لجميع الإجراءات والضوابط المؤسسية\n\t\n\n\nهو نموذج تكاملي يربط بين:\n\n\n\t\n\tما يتم التخطيط له\n\t\n\t\n\tما يتم تنفيذه\n\t\n\t\n\tما يتم مراجعته وضمانه\n\t\n\n\nبهدف تحقيق أداء منضبط ومتكامل.                                   \nOCEG (2024). GRC Capability Model v3.5 – Premium Revision 2024. , Chapter 4, Page 130–132."},{"qe":"Which type of policies provide guidance about actions the organization should avoid?","qa":"ما نوع السياسات التي تقدم إرشادات حول الإجراءات التي ينبغي أن تتجنبها المنظمة؟","oe":["Reactive policy","Undesired behavior policy","Desired behavior policy","Procedural policy"],"oa":["السياسة التفاعلية","سياسة السلوك المكروه","سياسة السلوك المستحب","سياسة الإجراءات"],"c":1,"ch":"Perform Competent","ex":"Exam 2 - GRCP","fe":"Undesired behavior policies are designed to:\n\n\n\t\n\tDefine prohibited actions\n\t\n\t\n\tPrevent misconduct\n\t\n\t\n\tReduce exposure to risk\n\t\n\t\n\tEstablish clear behavioral boundaries\n\t\n\n\nThey form a critical part of an effective control environment.\n\n\nOCEG (2024). GRC Capability Model v3.5 – Premium Revision 2024. PERFORM Component – P1 Policies and Controls, Chapter 4, Page 134–136.","fa":"سياسات السلوك المكروه تهدف إلى:\n\n\n\t\n\tتحديد الأفعال غير المقبولة\n\t\n\t\n\tمنع التصرفات المخالفة\n\t\n\t\n\tتقليل التعرض للمخاطر\n\t\n\t\n\tتوضيح الحدود السلوكية داخل المنظمة\n\t\n\n\nوهي عنصر مهم في بناء بيئة رقابية واضحة المعالم.\n\n\nOCEG (2024). GRC Capability Model v3.5 – Premium Revision 2024. PERFORM Component – P1 Policies and Controls, Chapter 4, Page 134–136."}],"sep":{"Key Concepts":[0,117,10,12,114,130,29,72,197,101,107,17,22,103,3,129,110,135,123,105,125,21,134,112,2,23,18,128,121,118],"Learn Component":[138,73,79,141,87,85,89,144,86,82,81,190,83,143,142],"Align Competent":[11,66,115,62,64,148,198,139,65,94,60,96,92,9,90,149,158,151,97,156],"Perform Competent":[30,169,180,168,56,176,108,44,52,171,113,48,49,160,162,161,157,54,55,163,37,43,174,179,36],"Review Competent":[8,28,35,27,185,184,25,183,166,181]},"full":{"Key Concepts":[77,1,20,6,133,104,16,71,78,126,122,19,127,116,119,106,75,69,76,124,132,131,120,102,70,98,111,201,4,195],"Learn Component":[84,137,187,15,13,100,145,146,136,99,88,140,80,188,189],"Align Competent":[68,61,147,194,191,74,153,91,95,155,150,154,14,159,192,67,7,152,193,63],"Perform Competent":[172,40,39,46,178,57,165,196,173,41,32,38,53,45,59,170,175,50,199,42,177,164,200,58,109],"Review Competent":[34,33,26,24,186,167,182,5,31,8]},"bp":{"Key Concepts":30,"Learn Component":15,"Align Competent":20,"Perform Competent":25,"Review Competent":10}};</script>
<script>/* ============================================================
   نظام السعيد GRC® — وحدة الاختبارات المحاكية
   6 اختبارات: 5 منفصلة حسب المكوّن + اختبار شامل 100 سؤال
   ثنائية اللغة · مؤقّت · ترجمة وشرح ذكي لكل سؤال · شهادة
   تصميم وبرمجة: د. محمد عطية
   ============================================================ */
window.EXAM = (function () {
'use strict';
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => (s == null ? '' : String(s)).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const LSK = 'alsaeedExam_v1';
const PASS = 70;

const CH = {
  'Key Concepts':     { ar: 'المفاهيم الأساسية', en: 'Key Concepts',   n: 30, col: '#0369A1' },
  'Learn Component':  { ar: 'الدراسة',           en: 'Learn',          n: 15, col: '#C8791A' },
  'Align Competent':  { ar: 'المواءمة',          en: 'Align',          n: 20, col: '#0F766E' },
  'Perform Competent':{ ar: 'التنفيذ',           en: 'Perform',        n: 25, col: '#1D4ED8' },
  'Review Competent': { ar: 'المراجعة',          en: 'Review',         n: 10, col: '#047857' }
};

let H = {};   // سجل المحاولات
try { H = JSON.parse(localStorage.getItem(LSK) || '{}'); } catch (e) { H = {}; }
const saveH = () => { try { localStorage.setItem(LSK, JSON.stringify(H)); } catch (e) {} };

let S = null;         // الجلسة الجارية
let tick = null;

/* لغة الاختبار مستقلة عن لغة الواجهة */
function L() { return (S && S.lang) || (window.I18 ? window.I18.lang : 'ar'); }
const isAR = () => L() === 'ar';
const T = (a, e) => (isAR() ? a : e);

/* ═══════ بناء جلسة ═══════ */
function idxFor(kind, ch) {
  const B = window.QBANK;
  if (kind === 'full') return Object.keys(CH).flatMap(c => B.full[c] || []);
  return (B.sep[ch] || []);
}
function start(kind, ch, opts) {
  const idx = idxFor(kind, ch).slice();
  if (opts.shuffle) shuffle(idx);
  S = {
    kind, ch, lang: opts.lang, timed: opts.timed,
    ids: idx, i: 0,
    pick: Array(idx.length).fill(-1),
    order: idx.map(id => {
      const q = window.QBANK.q[id];
      const o = q.oe.map((_, k) => k);
      if (opts.shuffleOpts) shuffle(o);
      return o;
    }),
    flag: Array(idx.length).fill(false),
    reveal: Array(idx.length).fill(false),
    locked: Array(idx.length).fill(false),
    alt: false,
    t0: Date.now(),
    left: opts.timed ? Math.round(idx.length * 72) : 0,
    done: false, secs: 0
  };
  if (S.timed) {
    clearInterval(tick);
    tick = setInterval(() => {
      S.left--;
      const el = $('#exTimer');
      if (el) el.textContent = fmt(S.left);
      if (S.left <= 0) { clearInterval(tick); finish(); }
    }, 1000);
  }
  render();
}
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1));[a[i], a[j]] = [a[j], a[i]]; } }
function fmt(s) { s = Math.max(0, s); return `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`; }

/* ═══════ الشاشات ═══════ */
function home() {
  const rows = Object.entries(CH).map(([k, c]) => {
    const best = bestOf('sep', k);
    return `<div class="ex-card" style="border-top-color:${c.col}">
      <div class="ex-n" style="background:${c.col}">${c.n}</div>
      <b>${T(c.ar, c.en)}</b>
      <span class="en">${c.en}</span>
      <small>${T('سؤالاً من مكوّن', 'questions from')} ${T(c.ar, c.en)}</small>
      ${best != null ? `<i class="ex-best ${best >= PASS ? 'ok' : ''}">${T('أفضل نتيجة', 'Best')}: ${best}%</i>` : ''}
      <button class="btn b sm" data-ex="sep" data-ch="${esc(k)}">${T('ابدأ', 'Start')}</button>
    </div>`;
  }).join('');
  const bf = bestOf('full', '');
  return `<div class="wrap">
  <div class="hero">
    <div class="hero-t">
      <span class="kick">EXAM SIMULATION · GRCP<sup>&#8482;</sup></span>
      <h1>${T('الاختبارات المحاكية', 'Exam Simulation')}</h1>
      <p>${T('ستة اختبارات مبنية على بنك 203 أسئلة ثنائية اللغة بالشرح والمرجع. الأسئلة في الاختبارات المنفصلة تختلف عن الاختبار الشامل. نسبة الاجتياز 70٪.',
             'Six exams built on a 203-question bilingual bank with rationales. Questions in the component exams differ from the comprehensive exam. Pass mark is 70%.')}</p>
    </div>
  </div>

  <div class="wm-note">
    🔒 ${T('تنبيه حماية المحتوى', 'Content protection notice')}:
    ${T('أسئلة هذا البنك محمية بحقوق النشر. يُحجب المحتوى تلقائياً عند محاولة الالتقاط أو مغادرة النافذة، '
      + 'والنسخ والطباعة معطّلان.',
      'This question bank is copyright protected. Content is automatically veiled on capture attempts or window blur, and copy/print are disabled.')}

  </div>

  <div class="card pad">
    <h3>${T('إعدادات الاختبار', 'Exam Settings')}</h3>
    <div class="ex-opt">
      <label class="inl"><span>${T('لغة الأسئلة', 'Question language')}</span>
        <select id="exLang"><option value="ar">العربية</option><option value="en">English</option></select></label>
      <label class="chk"><input type="checkbox" id="exTimed" checked> ${T('تفعيل المؤقّت (72 ثانية للسؤال)', 'Enable timer (72s per question)')}</label>
      <label class="chk"><input type="checkbox" id="exShuf" checked> ${T('ترتيب عشوائي للأسئلة', 'Shuffle questions')}</label>
      <label class="chk"><input type="checkbox" id="exShufO" checked> ${T('ترتيب عشوائي للبدائل', 'Shuffle options')}</label>
    </div>
  </div>

  <h3 class="sec-t">${T('① اختبارات المكوّنات — 100 سؤال موزّعة', '① Component exams — 100 questions split')}</h3>
  <div class="ex-grid">${rows}</div>

  <h3 class="sec-t">${T('② الاختبار الشامل', '② Comprehensive exam')}</h3>
  <div class="card pad ex-full">
    <div>
      <b>${T('اختبار GRCP الشامل — 100 سؤال', 'Comprehensive GRCP Exam — 100 questions')}</b>
      <p>${T('بأسئلة مختلفة عن الاختبارات المنفصلة، وبالتوزيع المعتمد: 30 مفاهيم · 15 دراسة · 20 مواءمة · 25 تنفيذ · 10 مراجعة.',
             'With different questions from the component exams, following the official blueprint: 30 Key Concepts · 15 Learn · 20 Align · 25 Perform · 10 Review.')}</p>
      ${bf != null ? `<i class="ex-best ${bf >= PASS ? 'ok' : ''}">${T('أفضل نتيجة', 'Best')}: ${bf}%</i>` : ''}
    </div>
    <button class="btn g" data-ex="full" data-ch="">${T('ابدأ الاختبار الشامل', 'Start comprehensive exam')} ◀</button>
  </div>

  ${histView()}
  </div>`;
}

function bestOf(kind, ch) {
  const k = kind + '|' + ch;
  const a = (H[k] || []);
  return a.length ? Math.max(...a.map(x => x.pct)) : null;
}
function histView() {
  const all = Object.entries(H).flatMap(([k, a]) => a.map(x => ({ ...x, k })));
  if (!all.length) return '';
  all.sort((a, b) => new Date(b.d) - new Date(a.d));
  return `<div class="card pad">
    <h3>${T('سجل محاولاتك', 'Your attempt history')}</h3>
    <div class="tbl-s"><table class="tbl">
      <thead><tr><th>${T('الاختبار', 'Exam')}</th><th>${T('التاريخ', 'Date')}</th><th>${T('النتيجة', 'Score')}</th>
      <th>${T('صحيحة', 'Correct')}</th><th>${T('الزمن', 'Time')}</th><th>${T('الحالة', 'Status')}</th></tr></thead>
      <tbody>${all.slice(0, 12).map(x => `<tr>
        <td>${esc(x.name)}</td>
        <td>${new Date(x.d).toLocaleDateString(isAR() ? 'ar-SA' : 'en-GB')}</td>
        <td><b>${x.pct}%</b></td><td>${x.ok}/${x.n}</td><td>${fmt(x.secs)}</td>
        <td><span class="pillx ${x.pct >= PASS ? 'ok' : 'no'}">${x.pct >= PASS ? T('ناجح', 'Pass') : T('لم يجتز', 'Fail')}</span></td>
      </tr>`).join('')}</tbody></table></div>
    <button class="btn o sm" id="exClear">${T('مسح السجل', 'Clear history')}</button>
  </div>`;
}

function examName() {
  if (S.kind === 'full') return T('الاختبار الشامل', 'Comprehensive Exam');
  const c = CH[S.ch];
  return T('اختبار ' + c.ar, c.en + ' Exam');
}

/* ═══════ شاشة السؤال ═══════ */
function runView() {
  const q = window.QBANK.q[S.ids[S.i]];
  const ord = S.order[S.i];
  const ansd = S.pick.filter(p => p >= 0).length;
  return `<div class="wrap">
  <div class="ex-bar">
    <button class="btn o sm" id="exQuit">${T('إنهاء وتسليم', 'Finish & submit')}</button>
    ${S.timed ? `<div class="ex-timer" id="exTimer">${fmt(S.left)}</div>` : ''}
    <div class="ex-prog"><i style="width:${ansd / S.ids.length * 100}%"></i></div>
    <div class="ex-cnt">${S.i + 1} / ${S.ids.length}</div>
    <span class="pillx">${esc(examName())}</span>
  </div>

  <div class="card pad ex-q">
    <div class="ex-q-h">
      <span class="pillx" style="background:${CH[q.ch].col}22;color:${CH[q.ch].col};border-color:${CH[q.ch].col}55">${T(CH[q.ch].ar, CH[q.ch].en)}</span>
      <div class="ex-q-a">
        <button class="btn o sm ${S.alt ? 'flag' : ''}" id="qTr">🌐 ${S.alt ? T('إخفاء الترجمة', 'Hide translation') : T('ترجمة السؤال والخيارات', 'Translate question & options')}</button>
        <button class="btn o sm" id="qReveal" ${S.locked[S.i] ? '' : 'disabled title="' + T('أجب أولاً ثم يمكنك رؤية الإجابة', 'Answer first, then you may view the answer') + '"'}>💡 ${S.reveal[S.i] ? T('إخفاء الإجابة', 'Hide answer') : T('أظهر الإجابة الصحيحة', 'Show correct answer')}</button>
        <button class="btn o sm" id="qAI">🤖 ${T('اشرح لي', 'Explain')}</button>
        <button class="btn o sm ${S.flag[S.i] ? 'flag' : ''}" id="qFlag">🚩 ${T('تعليم', 'Flag')}</button>
      </div>
    </div>
    <div class="ex-stem" dir="${isAR() ? 'rtl' : 'ltr'}">${esc(isAR() ? q.qa : q.qe)}</div>
    ${S.alt ? `<div class="ex-alt" dir="${isAR() ? 'ltr' : 'rtl'}">${esc(isAR() ? q.qe : q.qa)}</div>` : ''}
    <div class="ex-opts">
      ${ord.map((oi, pos) => {
        const txt = isAR() ? (q.oa[oi] || q.oe[oi]) : q.oe[oi];
        const alt = isAR() ? q.oe[oi] : (q.oa[oi] || q.oe[oi]);
        const rv = S.reveal[S.i];
        const isC = oi === q.c, isP = S.pick[S.i] === oi;
        const lk = S.reveal[S.i];   /* القفل يقع عند كشف الإجابة لا عند الاختيار */
        const cls = (rv ? (isC ? 'rc' : (isP ? 'rw' : '')) : (isP ? 'on' : '')) + (lk ? ' lk' : '');
        return `<button class="ex-o ${cls}" data-pick="${oi}" ${lk ? 'disabled' : ''} dir="${isAR() ? 'rtl' : 'ltr'}">
          <span class="k">${rv && isC ? '✓' : rv && isP ? '✕' : 'ABCDE'[pos]}</span>
          <span class="t">${esc(txt)}
            ${S.alt ? `<em class="o-alt" dir="${isAR() ? 'ltr' : 'rtl'}">${esc(alt)}</em>` : ''}</span></button>`;
      }).join('')}
    </div>
    ${S.locked[S.i] && !S.reveal[S.i] ? `<div class="ex-lock">💡 ${T('يمكنك تعديل إجابتك بحرية. وبمجرد عرض الإجابة الصحيحة تُقفل ولا يمكن تغييرها.', 'You may change your answer freely. Once you reveal the correct answer it locks and cannot be changed.')}</div>` : ''}
    ${S.reveal[S.i] ? `<div class="ex-lock lk">🔒 ${T('قُفلت إجابتك بعد عرض الحل.', 'Your answer locked after revealing the solution.')}</div>` : ''}
    ${S.reveal[S.i] ? `<div class="ex-rev"><b>${T('الإجابة الصحيحة', 'Correct answer')}:</b>
      ${esc(isAR() ? (q.oa[q.c] || q.oe[q.c]) : q.oe[q.c])}
      <div class="ex-rev-f">${esc(isAR() ? (q.fa || q.fe) : (q.fe || q.fa))}</div></div>` : ''}
    <div id="qAIout"></div>
  </div>

  <div class="ex-nav">
    <button class="btn o" id="exPrev" ${S.i === 0 ? 'disabled' : ''}>◀ ${T('السابق', 'Previous')}</button>
    <button class="btn b" id="exNext">${S.i === S.ids.length - 1 ? T('إنهاء', 'Finish') : T('التالي', 'Next')} ▶</button>
  </div>

  <div class="card pad">
    <h3>${T('لوحة الأسئلة', 'Question palette')}</h3>
    <div class="ex-pal">${S.ids.map((_, k) => `<button class="pb ${k === S.i ? 'cur' : ''} ${S.pick[k] >= 0 ? 'ans' : ''} ${S.flag[k] ? 'fl' : ''}" data-jump="${k}">${k + 1}</button>`).join('')}</div>
  </div></div>`;
}

/* ═══════ النتيجة ═══════ */
function finish() {
  clearInterval(tick);
  S.done = true;
  S.secs = Math.round((Date.now() - S.t0) / 1000);
  const ok = S.ids.filter((id, k) => S.pick[k] === window.QBANK.q[id].c).length;
  S.ok = ok; S.pct = Math.round(ok / S.ids.length * 100);
  const key = S.kind + '|' + S.ch;
  H[key] = H[key] || [];
  H[key].unshift({ d: new Date().toISOString(), name: examName(), pct: S.pct, ok, n: S.ids.length, secs: S.secs });
  H[key] = H[key].slice(0, 20);
  saveH();
  S.view = 'res';
  render();
}

function resView() {
  const pass = S.pct >= PASS;
  const by = {};
  S.ids.forEach((id, k) => {
    const q = window.QBANK.q[id];
    by[q.ch] = by[q.ch] || { t: 0, o: 0 };
    by[q.ch].t++;
    if (S.pick[k] === q.c) by[q.ch].o++;
  });
  return `<div class="wrap">
  <div class="ex-res ${pass ? 'pass' : 'fail'}">
    <div class="ex-score"><b>${S.pct}%</b><span>${S.ok} / ${S.ids.length}</span></div>
    <div class="ex-verdict">
      <h2>${pass ? T('🎓 مبروك — اجتزت الاختبار', '🎓 Congratulations — you passed') : T('لم تجتز هذه المرة', 'Not passed this time')}</h2>
      <p>${pass ? T('تجاوزت نسبة الاجتياز 70٪. يمكنك إصدار شهادتك الآن.', 'You exceeded the 70% pass mark. You can issue your certificate now.')
                : T('نسبة الاجتياز 70٪. راجع إجاباتك الخاطئة ثم أعد المحاولة.', 'The pass mark is 70%. Review your incorrect answers then try again.')}</p>
      <div class="ex-meta">${T('الزمن', 'Time')}: ${fmt(S.secs)} · ${esc(examName())}</div>
    </div>
  </div>

  <div class="card pad">
    <h3>${T('الأداء حسب المكوّن', 'Performance by component')}</h3>
    ${Object.entries(by).map(([k, v]) => {
      const p = Math.round(v.o / v.t * 100), c = CH[k];
      return `<div class="ba-r"><span style="width:110px">${T(c.ar, c.en)}</span>
        <div class="bar"><i style="width:${p}%;background:${p >= PASS ? '#047857' : p >= 50 ? '#B4690E' : '#B3261E'}"></i></div>
        <b>${v.o}/${v.t} · ${p}%</b></div>`;
    }).join('')}
  </div>

  ${analysisView(by)}

  <div class="card pad">
    <h3>${T('مراجعة الإجابات', 'Review answers')}</h3>
    <div class="ex-filt">
      <button class="fb on" data-filt="all">${T('الكل', 'All')} (${S.ids.length})</button>
      <button class="fb" data-filt="ok">${T('الصحيحة', 'Correct')} (${S.ok})</button>
      <button class="fb" data-filt="no">${T('الخاطئة', 'Incorrect')} (${S.ids.length - S.ok})</button>
      <button class="fb" data-filt="skip">${T('المتروكة', 'Skipped')} (${S.pick.filter(p => p < 0).length})</button>
      <button class="fb" data-filt="fl">${T('المعلَّمة', 'Flagged')} (${S.flag.filter(Boolean).length})</button>
    </div>
    <div id="revList">${revList('all')}</div>
  </div>

  <div class="act">
    ${pass ? `<button class="btn g" id="exCert">🎓 ${T('إصدار الشهادة', 'Issue certificate')}</button>` : ''}
    <button class="btn b" id="exRetry">🔁 ${T('أعد الاختبار', 'Retake exam')}</button>
    <button class="btn o" id="exHome">${T('كل الاختبارات', 'All exams')}</button>
  </div></div>`;
}

/* ═══════ تحليل الأداء: قوة · ضعف · تركيز ═══════ */
function analysisView(by) {
  const rows = Object.entries(by).map(([k, v]) => {
    const p = Math.round(v.o / v.t * 100);
    return { k, c: CH[k], p, o: v.o, t: v.t, gap: v.t - v.o, w: CH[k].n };
  });
  const strong = rows.filter(r => r.p >= 80).sort((a, b) => b.p - a.p);
  const weak   = rows.filter(r => r.p < 60).sort((a, b) => a.p - b.p);
  const mid    = rows.filter(r => r.p >= 60 && r.p < 80).sort((a, b) => a.p - b.p);
  /* أولوية التركيز = عدد الأخطاء × وزن المكوّن في الاختبار الحقيقي */
  const focus = rows.map(r => ({ ...r, score: r.gap * (r.w / 100) }))
                    .filter(r => r.gap > 0).sort((a, b) => b.score - a.score).slice(0, 3);
  const badge = p => p >= 80 ? 'ok' : p >= 60 ? 'mid' : 'no';
  const label = p => p >= 80 ? T('قوة', 'Strength') : p >= 60 ? T('مقبول', 'Adequate') : T('ضعف', 'Weakness');

  const tips = {
    'Key Concepts': T('راجع تعريف الأداء المنضبط بأجزائه، والأسباب الثلاثة، وأنواع الانفصال الأربعة.',
                      'Revisit the Principled Performance definition, the three causes and the four forms of disconnection.'),
    'Learn Component': T('ركّز على تمييز السياق الخارجي عن الداخلي، وأن الثقافة تُقاس ولا تُفترض، وأن ترتيب أصحاب المصلحة يُبرز التعارض.',
                      'Focus on distinguishing external from internal context, that culture is measured not assumed, and that prioritisation surfaces conflict.'),
    'Align Competent': T('ركّز على قاعدة السعة ≥ الشهية ≥ حدود التحمّل، والفرق بين المتأصلة والمتبقية والثانوية، وخيارات التصميم الأربعة.',
                      'Focus on capacity ≥ appetite ≥ tolerance, the difference between inherent, residual and secondary risk, and the four design options.'),
    'Perform Competent': T('ركّز على أنواع الضوابط الثلاثة، ودورة حياة السياسة، وأن التعليم يُقاس بالسلوك لا بالحضور، واتساق الاستجابة.',
                      'Focus on the three control types, the policy lifecycle, education measured by behaviour not attendance, and response consistency.'),
    'Review Competent': T('ركّز على المؤشرات المتقدّمة مقابل المتأخرة، وأن مستوى الضمان = الموضوعية + الأهلية، وأن الدرس بلا تغيير ليس درساً.',
                      'Focus on leading versus lagging indicators, assurance level = objectivity + competence, and that a lesson without change is not a lesson.')
  };

  return `<div class="card pad">
    <h3>${T('تحليل أدائك', 'Your Performance Analysis')}</h3>
    <p class="hint">${T('مرتّب حسب أثره على نتيجتك في الاختبار الحقيقي — عدد أخطائك مضروباً في وزن المكوّن.',
                        'Ranked by impact on your real exam score — your error count multiplied by the component weight.')}</p>

    <div class="an-grid">
      <div class="an-col ok">
        <b>💪 ${T('نقاط قوتك', 'Your strengths')}</b>
        ${strong.length ? strong.map(r => `<div class="an-i"><span>${T(r.c.ar, r.c.en)}</span><i>${r.p}%</i></div>`).join('')
                        : `<p class="an-e">${T('لا يوجد مكوّن بلغ 80٪ بعد — واصل التدريب.', 'No component reached 80% yet — keep practising.')}</p>`}
      </div>
      <div class="an-col mid">
        <b>⚖️ ${T('يحتاج تثبيتاً', 'Needs consolidation')}</b>
        ${mid.length ? mid.map(r => `<div class="an-i"><span>${T(r.c.ar, r.c.en)}</span><i>${r.p}%</i></div>`).join('')
                     : `<p class="an-e">—</p>`}
      </div>
      <div class="an-col no">
        <b>⚠️ ${T('نقاط ضعفك', 'Your weaknesses')}</b>
        ${weak.length ? weak.map(r => `<div class="an-i"><span>${T(r.c.ar, r.c.en)}</span><i>${r.p}%</i></div>`).join('')
                      : `<p class="an-e">${T('لا يوجد مكوّن تحت 60٪ — أداء متوازن.', 'No component below 60% — balanced performance.')}</p>`}
      </div>
    </div>

    ${focus.length ? `<div class="an-focus">
      <b>🎯 ${T('ركّز مراجعتك على هذا الترتيب', 'Focus your revision in this order')}</b>
      ${focus.map((r, i) => `<div class="an-f">
        <span class="an-r">${i + 1}</span>
        <div class="an-fb">
          <div class="an-ft"><b>${T(r.c.ar, r.c.en)}</b>
            <span class="pillx ${badge(r.p)}">${label(r.p)} · ${r.p}%</span>
            <em>${T('أخطأت', 'Missed')} ${r.gap} ${T('من', 'of')} ${r.t} · ${T('وزنه في الاختبار', 'exam weight')} ${r.w}%</em></div>
          <p>${tips[r.k] || ''}</p>
        </div></div>`).join('')}
    </div>` : `<div class="an-perfect">🎉 ${T('لم تخطئ في أي مكوّن — أداء مثالي.', 'No errors in any component — perfect performance.')}</div>`}
  </div>`;
}

function revList(f) {
  const out = [];
  S.ids.forEach((id, k) => {
    const q = window.QBANK.q[id], p = S.pick[k], ok = p === q.c;
    if (f === 'ok' && !ok) return;
    if (f === 'no' && (ok || p < 0)) return;
    if (f === 'skip' && p >= 0) return;
    if (f === 'fl' && !S.flag[k]) return;
    out.push(`<div class="rv ${ok ? 'ok' : p < 0 ? 'sk' : 'no'}">
      <div class="rv-h"><span class="rv-n">${k + 1}</span>
        <span class="pillx" style="background:${CH[q.ch].col}18;color:${CH[q.ch].col}">${T(CH[q.ch].ar, CH[q.ch].en)}</span>
        <i>${ok ? '✓ ' + T('صحيحة', 'Correct') : p < 0 ? '○ ' + T('متروكة', 'Skipped') : '✕ ' + T('خاطئة', 'Incorrect')}</i></div>
      <div class="rv-q" dir="${isAR() ? 'rtl' : 'ltr'}">${esc(isAR() ? q.qa : q.qe)}</div>
      ${(isAR() ? q.oa : q.oe).map((o, i) => `<div class="rv-o ${i === q.c ? 'c' : ''} ${i === p && i !== q.c ? 'w' : ''}" dir="${isAR() ? 'rtl' : 'ltr'}">
        ${i === q.c ? '✓' : i === p ? '✕' : '○'} ${esc(o)}</div>`).join('')}
      <div class="rv-f"><b>${T('الشرح', 'Rationale')}</b> ${esc(isAR() ? (q.fa || q.fe) : (q.fe || q.fa))}</div>
    </div>`);
  });
  return out.length ? out.join('') : `<p class="hint">${T('لا توجد أسئلة في هذا التصنيف.', 'No questions in this filter.')}</p>`;
}

/* ═══════ الرسم والربط ═══════ */
let VIEW = 'home', CERT = '';
function render() {
  document.body.classList.toggle('no-cert', VIEW !== 'cert');
  const app = $('#app');
  if (!S || VIEW === 'home') app.innerHTML = home();
  else if (VIEW === 'cert') app.innerHTML = certView(CERT);
  else if (S.done) app.innerHTML = resView();
  else app.innerHTML = runView();
  bind();
  window.scrollTo(0, 0);
}

function bind() {
  $$('[data-ex]').forEach(b => b.onclick = () => {
    VIEW = 'run';
    start(b.dataset.ex, b.dataset.ch, {
      lang: ($('#exLang') || {}).value || 'ar',
      timed: ($('#exTimed') || {}).checked !== false,
      shuffle: ($('#exShuf') || {}).checked !== false,
      shuffleOpts: ($('#exShufO') || {}).checked !== false
    });
  });
  const cl = $('#exClear'); if (cl) cl.onclick = () => { H = {}; saveH(); render(); };
  $$('[data-pick]').forEach(b => b.onclick = () => {
    if (S.reveal[S.i]) return;                 /* لا تعديل بعد كشف الحل فقط */
    S.pick[S.i] = +b.dataset.pick;
    S.locked[S.i] = true;
    render();
  });
  $$('[data-jump]').forEach(b => b.onclick = () => { S.i = +b.dataset.jump; render(); });
  const p = $('#exPrev'); if (p) p.onclick = () => { if (S.i > 0) { S.i--; render(); } };
  const n = $('#exNext'); if (n) n.onclick = () => { if (S.i < S.ids.length - 1) { S.i++; render(); } else finish(); };
  const qt = $('#exQuit'); if (qt) qt.onclick = () => { if (confirm(T('تسليم الاختبار الآن؟', 'Submit the exam now?'))) finish(); };
  const fl = $('#qFlag'); if (fl) fl.onclick = () => { S.flag[S.i] = !S.flag[S.i]; render(); };
  const tr = $('#qTr'); if (tr) tr.onclick = () => { S.alt = !S.alt; render(); };
  const rv = $('#qReveal'); if (rv) rv.onclick = () => {
    if (!S.locked[S.i]) { if (window.GRCAPP) GRCAPP.toast(T('اختر إجابتك أولاً', 'Choose your answer first')); return; }
    if (!S.reveal[S.i] && !confirm(T('بعرض الإجابة الصحيحة ستُقفل إجابتك ولن تتمكّن من تعديلها. متابعة؟',
      'Revealing the correct answer will lock your choice permanently. Continue?'))) return;
    S.reveal[S.i] = true; render();
  };
  const ai = $('#qAI'); if (ai) ai.onclick = () => {
    const q = window.QBANK.q[S.ids[S.i]];
    $('#qAIout').innerHTML = `<div class="ai-out"><b>🤖 ${T('شرح المحرّك', 'Engine explanation')}</b>
      <p>${esc(isAR() ? (q.fa || q.fe) : (q.fe || q.fa))}</p>
      <div class="ai-hint">${T('الإجابة الصحيحة', 'Correct answer')}: <b>${esc(isAR() ? (q.oa[q.c] || q.oe[q.c]) : q.oe[q.c])}</b></div></div>`;
  };
  $$('[data-filt]').forEach(b => b.onclick = () => {
    $$('[data-filt]').forEach(x => x.classList.remove('on'));
    b.classList.add('on');
    $('#revList').innerHTML = revList(b.dataset.filt);
  });
  const rt = $('#exRetry'); if (rt) rt.onclick = () => { VIEW = 'run'; start(S.kind, S.ch, { lang: S.lang, timed: S.timed, shuffle: true, shuffleOpts: true }); };
  const hm = $('#exHome'); if (hm) hm.onclick = () => { VIEW = 'home'; S = null; render(); };
  const ct = $('#exCert'); if (ct) ct.onclick = () => {
    const nm = prompt(T('اكتب اسمك كما تريده على الشهادة:', 'Enter your name as it should appear on the certificate:'), CERT || '');
    if (nm && nm.trim()) { CERT = nm.trim(); VIEW = 'cert'; render(); }
  };
  const cp = $('#certPrint'); if (cp) cp.onclick = () => window.print();
  const cb = $('#certBack'); if (cb) cb.onclick = () => { VIEW = 'res'; render(); };
}

/* ═══════ حماية الأسئلة من النسخ والطباعة ═══════ */
const PMSG_AR = 'محتوى محمي — أسئلة الاختبار وإجاباتها لا تُطبع ولا تُنسخ.\nنظام السعيد GRC · د. محمد عطية · جميع الحقوق محفوظة';
const PMSG_EN = 'Protected content — exam questions and answers cannot be printed or copied.\nAl-Saeed GRC System · Dr. Mohamed Attia · All rights reserved';
let protectOn = false;
function protect() {
  if (protectOn) return;
  protectOn = true;
  const inExam = () => document.body.classList.contains('exam-mode');
  const block = e => {
    if (!inExam() || VIEW === 'cert') return;
    const t = e.target;
    if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;
    e.preventDefault();
    if (window.GRCAPP) GRCAPP.toast(isAR() ? 'محتوى محمي — لا يمكن نسخ الأسئلة' : 'Protected — questions cannot be copied');
    return false;
  };
  document.addEventListener('copy', block);
  document.addEventListener('cut', block);
  document.addEventListener('contextmenu', block);
  document.addEventListener('dragstart', e => { if (inExam() && VIEW !== 'cert') e.preventDefault(); });
  document.addEventListener('keydown', e => {
    if (!inExam() || VIEW === 'cert') return;
    const k = (e.key || '').toLowerCase();
    if ((e.ctrlKey || e.metaKey) && ['c', 'x', 'p', 's', 'u'].includes(k)) {
      const t = e.target;
      if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA')) return;
      e.preventDefault();
      if (window.GRCAPP) GRCAPP.toast(isAR() ? 'محتوى محمي' : 'Protected content');
    }
  });
  /* تعتيم المحتوى — يُستدعى من عدة مواضع */
  function veil(on) {
    if (!inExam() || VIEW === 'cert') return;
    document.body.classList.toggle('veiled', on);
  }
  window.addEventListener('blur', () => veil(true));
  window.addEventListener('focus', () => veil(false));
  document.addEventListener('visibilitychange', () => veil(document.hidden));
  /* الحجب الاستباقي: عند أول ضغطة على مفاتيح الالتقاط — قبل أن يكمل النظام اللقطة */
  document.addEventListener('keydown', e => {
    if (!inExam() || VIEW === 'cert') return;
    const k = (e.key || '').toLowerCase();
    const snip = (e.metaKey && e.shiftKey) || (e.metaKey && k === 's');   /* أداة القص */
    const shot = k === 'printscreen' || e.code === 'PrintScreen' || (e.metaKey && e.shiftKey && k === 's');
    if (shot || snip) {
      veil(true);
      clearTimeout(window.__vt);
      window.__vt = setTimeout(() => veil(false), 2600);
    }
  }, true);
  /* أي ضغطة على مفتاح النظام تُرجَّح أن تسبق التقاطاً */
  document.addEventListener('keydown', e => {
    if (!inExam() || VIEW === 'cert') return;
    if (e.metaKey) { veil(true); clearTimeout(window.__vt2);
      window.__vt2 = setTimeout(() => veil(false), 1800); }
  }, true);

  document.addEventListener('keyup', e => {
    if (!inExam() || VIEW === 'cert') return;
    if (e.key === 'PrintScreen' || e.code === 'PrintScreen') {
      /* ويندوز لا يُطلق keydown لهذا المفتاح — نحجب هنا لمنع اللقطات التالية */
      veil(true); clearTimeout(window.__vt3);
      window.__vt3 = setTimeout(() => veil(false), 3000);
      try { navigator.clipboard && navigator.clipboard.writeText(
        isAR() ? 'محتوى محمي — نظام السعيد GRC — د. محمد عطية'
               : 'Protected content — Al-Saeed GRC System — Dr. Mohamed Attia'); } catch (x) {}
      capWarn();
    }
  });
  window.addEventListener('beforeprint', () => {
    document.body.setAttribute('data-pmsg', isAR() ? PMSG_AR : PMSG_EN);
    document.body.classList.toggle('no-cert', VIEW !== 'cert');
  });
}

/* هوية المتدرب — تُطبع في العلامة المائية فتكشف مصدر أي تسريب */
/* معرّف جلسة مجهول — بلا طلب اسم من المتدرب */
function whoami() {
  let w = null;
  try { w = JSON.parse(localStorage.getItem('alsaeedExamWho') || 'null'); } catch (e) {}
  if (w && w.id) return w;
  w = { name: '', id: 'ID-' + Date.now().toString(36).toUpperCase() + '-' +
        Math.random().toString(36).slice(2, 6).toUpperCase() };
  try { localStorage.setItem('alsaeedExamWho', JSON.stringify(w)); } catch (e) {}
  return w;
}

/* علامة مائية قطرية متكررة تغطّي منطقة الأسئلة */

let WHO = null;
/* عدّاد محاولات الالتقاط — يُعرض للمتدرب ويُسجَّل في الجلسة */
let capCount = 0;
function capWarn() {
  capCount++;
  const ov = document.createElement('div'); ov.className = 'tr-ov cap-ov';
  ov.innerHTML = `<div class="tr-box cap-box">
    <div class="cap-i">🛡️</div>

      ? 'رُصدت محاولة التقاط شاشة. أسئلة هذا البنك وإجاباتها ملكية فكرية محفوظة، ونسخها أو نشرها مخالفة صريحة.'
      : 'A screen capture attempt was detected. These questions and answers are protected intellectual property; copying or publishing them is a clear violation.'}</p>
    <div class="cap-n">${isAR() ? 'عدد المحاولات في هذه الجلسة' : 'Attempts this session'}: <b>${capCount}</b></div>
    <div class="tr-act"><button class="btn g" id="capOk">${isAR() ? 'فهمت — متابعة' : 'Understood — continue'}</button></div>
  </div>`;
  document.body.appendChild(ov);
  ov.querySelector('#capOk').onclick = () => { ov.remove(); veil(false); };
  setTimeout(() => { if (ov.parentNode) { ov.remove(); veil(false); } }, 6000);
}

function open() {
  VIEW = 'home'; S = null;
  document.body.classList.add('exam-mode');
  if (!WHO) WHO = whoami();
  protect(); render();
}
function close() { document.body.classList.remove('exam-mode'); }
return { open, close, render, PASS, CH };
})();

function hasData(d) {

}

}
