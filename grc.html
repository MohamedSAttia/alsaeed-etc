}

function bind() {
  const s = ST(); s.advisor = s.advisor || {};
  const A = s.advisor;
  const r = $('#advRev');
  if (r) r.onchange = () => { A.rev = r.value; window.GRCAPP.save(); window.GRCAPP.render(); };
  $$('[data-v]').forEach(b => b.onclick = () => {
    A.vuca = A.vuca || {}; A.vuca[+b.dataset.v] = +b.dataset.n;
    window.GRCAPP.save(); window.GRCAPP.render();
  });
  $$('[data-d]').forEach(b => b.onclick = () => {
    A.disc = A.disc || {}; A.disc[b.dataset.d] = +b.dataset.n;
    window.GRCAPP.save(); window.GRCAPP.render();
  });
}
return { view, bind, calc, cultureScore, VUCA, DISC };
})();
</script>
<script>/* ============================================================
   نظام السعيد GRC™ — مساحات العمل واللقطات الزمنية
   يحمي عمل المستخدم: عدّة منظمات · حفظ مرئي · لقطات للمقارنة
   تصميم وبرمجة: د. محمد عطية
   ============================================================ */
window.WS = (function () {
'use strict';
const IDX = 'alsaeedGRC_ws_index';
const KEY = id => 'alsaeedGRC_ws_' + id;
const CUR = 'alsaeedGRC_ws_current';
const esc = s => (s == null ? '' : String(s)).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const T = (a, e) => (window.I18 && window.I18.lang === 'en') ? e : a;

function idx() { try { return JSON.parse(localStorage.getItem(IDX) || '[]'); } catch (e) { return []; } }
function setIdx(a) { try { localStorage.setItem(IDX, JSON.stringify(a)); } catch (e) {} }
function current() { return localStorage.getItem(CUR) || ''; }
function setCurrent(id) { try { localStorage.setItem(CUR, id); } catch (e) {} }

function newId() { return 'ws' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5); }

/* ── إنشاء مساحة ── */
function create(name) {
  const id = newId();
  const a = idx();
  a.push({ id, name: name || T('مساحة جديدة', 'New workspace'), created: Date.now(), touched: Date.now() });
  setIdx(a); setCurrent(id);
  try { localStorage.setItem(KEY(id), JSON.stringify({ snaps: [] })); } catch (e) {}
  return id;
}

/* ── حفظ الحالة الحالية في المساحة الجارية ── */
function persist(state) {
  let id = current();
  if (!id) id = create(state && state.org && state.org.name);
  let blob = {};
  try { blob = JSON.parse(localStorage.getItem(KEY(id)) || '{}'); } catch (e) {}
  blob.state = state;
  try { localStorage.setItem(KEY(id), JSON.stringify(blob)); } catch (e) { return false; }
  const a = idx(); const w = a.find(x => x.id === id);
  if (w) {
    w.touched = Date.now();
    if (state && state.org && state.org.name) w.name = state.org.name;
    w.pct = completion(state);
    setIdx(a);
  }
  return true;
}

function loadState(id) {
  try { const b = JSON.parse(localStorage.getItem(KEY(id)) || '{}'); return b.state || null; } catch (e) { return null; }
}
function snapsOf(id) {
  try { const b = JSON.parse(localStorage.getItem(KEY(id)) || '{}'); return b.snaps || []; } catch (e) { return []; }
}

function completion(st) {
  if (!st || !st.tools || !window.GRC_TOOLS) return 0;
  const done = window.GRC_TOOLS.filter(t => {
    const d = st.tools[t.id];
    return d && Object.values(d).some(v => Array.isArray(v) ? v.length : (v && typeof v === 'object' ? Object.keys(v).length : String(v || '').trim()));
  }).length;
  return Math.round(done / window.GRC_TOOLS.length * 100);
}

/* ── لقطة زمنية ── */
function snapshot(state, label) {
  const id = current(); if (!id) return false;
  let b = {};
  try { b = JSON.parse(localStorage.getItem(KEY(id)) || '{}'); } catch (e) {}
  b.snaps = b.snaps || [];
  b.snaps.unshift({
    at: Date.now(),
    label: label || new Date().toLocaleDateString('ar-SA'),
    pct: completion(state),
    tp: window.GRCAPP ? GRCAPP.tpScore((state.baseline || {}).tp) : 0,
    tpA: window.GRCAPP ? GRCAPP.tpScore((state.after || {}).tp) : 0,
    mat: window.GRCAPP ? GRCAPP.matAvg((state.baseline || {}).mat) : 0,
    matA: window.GRCAPP ? GRCAPP.matAvg((state.after || {}).mat) : 0,
    data: JSON.parse(JSON.stringify(state))
  });
  b.snaps = b.snaps.slice(0, 12);
  try { localStorage.setItem(KEY(id), JSON.stringify(b)); } catch (e) { return false; }
  return true;
}
function restore(i) {
  const id = current(); const s = snapsOf(id)[i];
  return s ? s.data : null;
}
function removeWs(id) {
  setIdx(idx().filter(x => x.id !== id));
  try { localStorage.removeItem(KEY(id)); } catch (e) {}
  if (current() === id) setCurrent('');
}

/* ── حجم التخزين ── */
function usage() {
  let n = 0;
  try { for (const k in localStorage) if (k.indexOf('alsaeed') === 0) n += (localStorage[k] || '').length; } catch (e) {}
  return Math.round(n / 1024);
}

/* ── الواجهة ── */
function view() {
  const a = idx().sort((x, y) => y.touched - x.touched);
  const cur = current();
  const snaps = cur ? snapsOf(cur) : [];
  return `<div class="wrap">
  <div class="hero">
    <div class="hero-t">
      <span class="kick">WORKSPACES &amp; SNAPSHOTS</span>
      <h1>${T('مساحات العمل', 'Workspaces')}</h1>
      <p>${T('اعمل على عدّة منظمات في النظام نفسه، واحفظ لقطات زمنية تقارن بها تقدّمك عبر الوقت.',
             'Work on several organisations in the same system, and save snapshots to compare progress over time.')}</p>
    </div>
  </div>

  <div class="warn">
    ⚠️ <b>${T('تنبيه مهم', 'Important')}:</b>
    ${T('كل بياناتك محفوظة في متصفحك على هذا الجهاز فقط — لا تُرسل لأي خادم. مسح ذاكرة المتصفح يمحوها. صدّر نسخة احتياطية دورياً من صفحة التقرير.',
        'All your data is stored in this browser on this device only — nothing is sent to any server. Clearing browser data erases it. Export a backup regularly from the report page.')}
    <span class="ws-use">${T('المستخدَم', 'Used')}: ${usage()} KB</span>
  </div>

  <div class="card pad">
    <div class="ws-head">
      <h3>${T('مساحاتك', 'Your workspaces')} (${a.length})</h3>
      <button class="btn g sm" id="wsNew">＋ ${T('مساحة جديدة', 'New workspace')}</button>
    </div>
    ${a.length ? `<div class="ws-grid">${a.map(w => `
      <div class="ws-c ${w.id === cur ? 'on' : ''}">
        <div class="ws-t"><b>${esc(w.name)}</b>${w.id === cur ? `<i>${T('الحالية', 'Current')}</i>` : ''}</div>
        <div class="ws-m">${T('آخر تحديث', 'Updated')}: ${new Date(w.touched).toLocaleDateString('ar-SA')}</div>
        <div class="ws-b"><i style="width:${w.pct || 0}%"></i></div>
        <div class="ws-p">${w.pct || 0}% ${T('اكتمال', 'complete')}</div>
        <div class="ws-a">
          ${w.id === cur ? '' : `<button class="btn b sm" data-ws-open="${w.id}">${T('افتح', 'Open')}</button>`}
          <button class="btn o sm" data-ws-del="${w.id}">${T('حذف', 'Delete')}</button>
        </div>
      </div>`).join('')}</div>`
      : `<p class="hint">${T('لا توجد مساحات بعد — أنشئ واحدة للبدء.', 'No workspaces yet — create one to begin.')}</p>`}
  </div>

  <div class="card pad">
    <div class="ws-head">
      <h3>${T('اللقطات الزمنية', 'Snapshots')}</h3>
      <button class="btn b sm" id="wsSnap" ${cur ? '' : 'disabled'}>📸 ${T('التقط لقطة الآن', 'Take snapshot now')}</button>
    </div>
    <p class="hint">${T('اللقطة تحفظ حالة المنظومة كاملة في لحظة معيّنة — فتقارن تقدّمك أو تعود إليها إن أخطأت.',
                        'A snapshot saves the full workspace state at a moment in time — compare progress or roll back if needed.')}</p>
    ${snaps.length ? `<div class="tbl-s"><table class="tbl">
      <thead><tr><th>${T('اللقطة', 'Snapshot')}</th><th>${T('التاريخ', 'Date')}</th>
      <th>${T('الاكتمال', 'Completion')}</th><th>${T('الأداء الشامل', 'Total perf.')}</th>
      <th>${T('النضج', 'Maturity')}</th><th></th></tr></thead>
      <tbody>${snaps.map((s, i) => `<tr>
        <td>${esc(s.label)}</td>
        <td>${new Date(s.at).toLocaleString('ar-SA')}</td>
        <td><b>${s.pct}%</b></td>
        <td>${s.tp}%${s.tpA ? ' ← ' + s.tpA + '%' : ''}</td>
        <td>${(s.mat || 0).toFixed(1)}${s.matA ? ' ← ' + s.matA.toFixed(1) : ''}</td>
        <td><button class="btn o sm" data-ws-rest="${i}">${T('استعادة', 'Restore')}</button></td>
      </tr>`).join('')}</tbody></table></div>`
      : `<p class="hint">${T('لا توجد لقطات بعد.', 'No snapshots yet.')}</p>`}
  </div></div>`;
}

function bind() {
  const $$ = s => [...document.querySelectorAll(s)];
  const n = document.getElementById('wsNew');
  if (n) n.onclick = () => {
    const nm = prompt(T('اسم المساحة الجديدة (اسم المنظمة):', 'New workspace name (organisation):'), '');
    if (nm && nm.trim()) { create(nm.trim()); window.GRCAPP.resetTo(null); GRCAPP.go('setup'); }
  };
  $$('[data-ws-open]').forEach(b => b.onclick = () => {
    setCurrent(b.dataset.wsOpen);
    const st = loadState(b.dataset.wsOpen);
    window.GRCAPP.resetTo(st);
    GRCAPP.go(st && st.org && st.org.name ? 'report' : 'setup');
  });
  $$('[data-ws-del]').forEach(b => b.onclick = () => {
    if (confirm(T('حذف هذه المساحة نهائياً؟', 'Delete this workspace permanently?'))) {
      removeWs(b.dataset.wsDel); GRCAPP.go('ws');
    }
  });
  const s = document.getElementById('wsSnap');
  if (s) s.onclick = () => {
    const lb = prompt(T('وصف اللقطة (اختياري):', 'Snapshot label (optional):'), '');
    if (snapshot(window.GRCAPP.ST(), lb)) { GRCAPP.toast(T('📸 حُفظت اللقطة', '📸 Snapshot saved')); GRCAPP.go('ws'); }
  };
  $$('[data-ws-rest]').forEach(b => b.onclick = () => {
    if (!confirm(T('استعادة هذه اللقطة؟ ستحل محل حالتك الحالية.', 'Restore this snapshot? It will replace your current state.'))) return;
    const st = restore(+b.dataset.wsRest);
    if (st) { window.GRCAPP.resetTo(st); GRCAPP.toast(T('✅ استُعيدت اللقطة', '✅ Snapshot restored')); GRCAPP.go('report'); }
  });
}

return { view, bind, create, persist, loadState, current, setCurrent, idx, snapshot, completion, usage };
})();
</script>
<script>/* ============================================================
   نظام السعيد GRC™ — فاحص التناقضات والفجوات
   يقرأ ما بُني ويكشف ما لا يتسق مع نموذج القدرات
   تصميم وبرمجة: د. محمد عطية
   ============================================================ */
window.CHECK = (function () {
'use strict';
const esc = s => (s == null ? '' : String(s)).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
const T = (a, e) => (window.I18 && window.I18.lang === 'en') ? e : a;
const ST = () => window.GRCAPP.ST();
const out = k => (ST().outputs || {})[k];
const rows = k => { const o = out(k); return (o && o.rows) || []; };
const has = v => String(v == null ? '' : v).trim().length > 0;

/* شدّة: high · med · low */
function run() {
  const F = [];
  const add = (sev, el, ttl, det, fix, go) => F.push({ sev, el, ttl, det, fix, go });

  /* ── A1: الحدود ── */
  const ap = out('appetite');
  if (ap) {
    if (!has(ap.capacity)) add('high', 'A1',
      T('شهية مخاطرة بلا سعة تحمّل محسوبة', 'Risk appetite without computed capacity'),
      T('وضعت شهية دون أن تحسب سعة التحمّل أولاً. النموذج صريح: السعة حقيقة مالية تُحسب، والشهية تُوضع دونها.',
        'You set an appetite without first computing capacity. The model is explicit: capacity is a computed financial fact, and appetite sits below it.'),
      T('احسب سعة التحمّل ثم أعد ضبط الشهية دونها.', 'Compute capacity, then set appetite below it.'), 'tool:appetite');
    if (!has(ap.approver)) add('high', 'A1',
      T('شهية المخاطرة غير معتمدة من السلطة الحاكمة', 'Appetite not approved by the governing authority'),
      T('الشهية قرار حوكمة يعتمده المجلس كتابةً. وبلا اعتماد موثّق تتغيّر بتغيّر صاحبها.',
        'Appetite is a board-approved governance decision. Undocumented, it changes with whoever holds it.'),
      T('أضف اسم المُعتمِد وتاريخ الاعتماد.', 'Add the approver name and approval date.'), 'tool:appetite');
    const noTol = (ap.rows || []).filter(r => has(r.cat) && !has(r.tol));
    if (noTol.length) add('med', 'A1',
      T(noTol.length + ' فئة مخاطرة بلا حد تحمّل قابل للقياس', noTol.length + ' risk category without a measurable tolerance'),
      T('حد التحمّل يجب أن يكون رقماً يُقاس لا وصفاً عاماً — وإلا لا يمكن معرفة متى تجاوزته.',
        'A tolerance must be a measurable number, not a general description — otherwise you cannot know when it is breached.'),
      T('حوّل كل حد إلى رقم أو نسبة أو مدة.', 'Convert each threshold into a number, percentage or duration.'), 'tool:appetite');
  }

  /* ── A2: الأهداف ── */
  const objs = rows('objectives');
  const noOwner = objs.filter(o => has(o.obj) && !has(o.own));
  if (noOwner.length) add('high', 'A2',
    T(noOwner.length + ' هدفاً بلا مالك نهائي', noOwner.length + ' objective(s) without an ultimate owner'),
    T('الملكية الجماعية تُذيب المساءلة — حين يملك الجميع الهدف لا يملكه أحد.',
      'Collective ownership dissolves accountability — when everyone owns the objective, nobody does.'),
    T('عيّن مالكاً واحداً نهائياً لكل هدف بصلاحية وموارد.', 'Assign one ultimate owner per objective with authority and resources.'), 'tool:cascade');
  const noMeasure = objs.filter(o => has(o.obj) && !has(o.measure));
  if (noMeasure.length) add('med', 'A2',
    T(noMeasure.length + ' هدفاً بلا مقياس نجاح', noMeasure.length + ' objective(s) without a success measure'),
    T('الهدف بلا مقياس نيّة لا هدف — ولا يمكن الحكم على تحقّقه.',
      'An objective without a measure is an intention — its achievement cannot be judged.'),
    T('أضف مقياساً رقمياً وأفقاً زمنياً لكل هدف.', 'Add a numeric measure and time horizon to each objective.'), 'tool:cascade');

  /* ── A3: السجل ── */
  const reg = rows('register');
  const unlinked = reg.filter(r => has(r.item) && !has(r.obj));
  if (unlinked.length) add('high', 'A3',
    T(unlinked.length + ' بنداً في السجل غير مرتبط بهدف', unlinked.length + ' register item(s) not linked to an objective'),
    T('الخطر الذي لا يهدّد هدفاً لا يستحق مورداً. والربط بالهدف هو ما يحوّل السجل من قائمة إلى أداة قرار.',
      'A risk that threatens no objective does not deserve a resource. Linking to objectives turns a list into a decision tool.'),
    T('اربط كل بند بالهدف الذي يؤثر فيه، أو احذفه.', 'Link each item to the objective it affects, or remove it.'), 'tool:unified');
  if (reg.length) {
    const cats = new Set(reg.map(r => r.cat).filter(has));
    if (cats.size < 3) add('med', 'A3',
      T('سجلك ليس موحّداً — يغطّي ' + cats.size + ' فئة فقط', 'Your register is not unified — it covers only ' + cats.size + ' category(ies)'),
      T('السجل الموحّد يضمّ الفرص والعقبات والالتزامات معاً. الاقتصار على فئة يعيد إنتاج الصوامع.',
        'A unified register includes opportunities, obstacles and obligations together. One category reproduces the silos.'),
      T('أضف بنوداً من الفئات الناقصة.', 'Add items from the missing categories.'), 'tool:unified');
  }

  /* ── A4: التحليل ── */
  const ana = rows('analysis');
  const noSec = ana.filter(a => has(a.item) && !has(a.sec));
  if (ana.length && noSec.length === ana.length) add('high', 'A4',
    T('لم تُسجّل أي مخاطرة ثانوية', 'No secondary risk recorded'),
    T('كل استجابة قد تُنشئ تعرّضاً جديداً لم يكن موجوداً. تجاهله هو كيف تحلّ مشكلة وتصنع أخرى.',
      'Every response can create new exposure that did not exist before. Ignoring it is how you solve one problem and manufacture another.'),
    T('لكل بند اسأل: وماذا تولّد استجابتي نفسها؟', 'For each item ask: what does my response itself generate?'), 'tool:irr');
  const outTol = ana.filter(a => a.wt === 'لا' || a.wt === 'No');
  const opts = rows('designOptions');
  const untreated = outTol.filter(a => !opts.some(o => o.item === a.item));
  if (untreated.length) add('high', 'A4',
    T(untreated.length + ' بنداً خارج حدود التحمّل بلا قرار معالجة', untreated.length + ' item(s) outside tolerance with no treatment decision'),
    T('هذه هي قائمة عملك الحقيقية — بنود تجاوزت حدودك ولم تقرّر بشأنها.',
      'This is your real work list — items that breached your thresholds with no decision taken.'),
    T('طبّق أحد خيارات التصميم الأربعة على كل بند.', 'Apply one of the four design options to each item.'), 'tool:options');

  /* ── A5 / P1: الضوابط ── */
  const ctrls = rows('controls');
  if (ctrls.length) {
    const types = new Set(ctrls.map(c => c.type).filter(has));
    if (types.size < 3) add('high', 'A5',
      T('مزيج ضوابطك ناقص — ' + types.size + ' من 3 أنواع', 'Incomplete control mix — ' + types.size + ' of 3 types'),
      T('الوقاية وحدها لا تكشف ما اخترقها ولا تعالج ما وقع. المنظمة التي تستثمر في الوقاية فقط تكون عمياء بعد الاختراق.',
        'Prevention alone neither detects what breached it nor treats what occurred. Investing only in prevention leaves you blind after a breach.'),
      T('أضف ضوابط كشفية واستجابية.', 'Add detective and responsive controls.'), 'tool:iacm');
    const orphan = ctrls.filter(c => has(c.ctrl) && !has(c.serves));
    if (orphan.length) add('med', 'A5',
      T(orphan.length + ' ضابطاً لا يخدم أي بند', orphan.length + ' control(s) serving no register item'),
      T('الضابط الذي لا يخدم بنداً كلفة بلا مقابل — أو أنك نسيت ربطه.',
        'A control serving no item is cost without benefit — or you forgot to link it.'),
      T('اربط كل ضابط بالبند الذي يعالجه.', 'Link each control to the item it addresses.'), 'tool:iacm');
  }
  const regNoCtrl = reg.filter(r => (r.cat === 'عقبة' || /التزام/.test(r.cat || '')) &&
    has(r.item) && !ctrls.some(c => (c.serves || '').indexOf(r.item) >= 0));
  if (regNoCtrl.length) add('med', 'A5',
    T(regNoCtrl.length + ' عقبة أو التزاماً بلا ضابط', regNoCtrl.length + ' obstacle(s)/obligation(s) with no control'),
    T('بند مسجّل بلا ضابط يعني أنك تعرف الخطر ولم تفعل شيئاً حياله.',
      'A recorded item without a control means you know the risk and did nothing about it.'),
    T('صمّم ضابطاً لكل بند أو وثّق قرار القبول.', 'Design a control for each item or document an acceptance decision.'), 'tool:iacm');

  /* ── P2: السياسات ── */
  const pol = rows('policies');
  const polDoc = out('policies');
  if (polDoc && has(polDoc.title)) {
    if (!has(polDoc.review)) add('high', 'P2',
      T('السياسة بلا تاريخ مراجعة', 'Policy without a review date'),
      T('السياسة بلا تاريخ مراجعة سياسة ميتة — تنحرف عن السياق والالتزامات دون أن ينتبه أحد.',
        'A policy without a review date is a dead policy — it drifts from context and obligations unnoticed.'),
      T('حدّد تاريخ المراجعة القادم.', 'Set the next review date.'), 'tool:policydoc');
    if (!has(polDoc.owner)) add('high', 'P2',
      T('السياسة بلا مالك', 'Policy without an owner'),
      T('المالك وتاريخ المراجعة أول ما يطلبه المدقق.', 'The owner and review date are the first two things an auditor asks for.'),
      T('عيّن مالكاً بالاسم والمسمّى.', 'Assign an owner by name and title.'), 'tool:policydoc');
  }
  const exc = rows('exceptions');
  const openExc = exc.filter(e => has(e.pol) && !has(e.exp));
  if (openExc.length) add('high', 'P2',
    T(openExc.length + ' استثناءً بلا تاريخ انتهاء', openExc.length + ' exception(s) without an expiry date'),
    T('الاستثناء الذي يصبح دائماً بالتقادم يُلغي الضابط عملياً. الاستثناءات تنتهي بتاريخ لا بالإهمال.',
      'An exception that becomes permanent by default effectively cancels the control. Exceptions expire on a date, not by neglect.'),
    T('حدّد تاريخ انتهاء وضابطاً تعويضياً لكل استثناء.', 'Set an expiry date and a compensating control for each exception.'), 'tool:exceptions');

  /* ── P4: التعليم ── */
  const tr = rows('training');
  const noMeas = tr.filter(t => has(t.role) && !has(t.measure));
  if (noMeas.length) add('med', 'P4',
    T(noMeas.length + ' برنامج تدريب بلا مقياس أثر سلوكي', noMeas.length + ' training programme(s) without a behavioural measure'),
    T('الحضور يُثبت بذل الجهد فقط. التعليم يُقاس بانخفاض الحوادث وارتفاع البلاغات المبكرة.',
      'Attendance evidences best efforts only. Education is measured by fewer incidents and more early reports.'),
    T('أضف مقياس أثر سلوكي لكل برنامج.', 'Add a behavioural impact measure to each programme.'), 'tool:training');

  /* ── P5: الحوافز ── */
  const inc = rows('incentives');
  const noCond = inc.filter(i => has(i.role) && !has(i.cond));
  if (noCond.length) add('high', 'P5',
    T(noCond.length + ' حافزاً بلا شرط سلوكي', noCond.length + ' incentive(s) without a conduct condition'),
    T('الحافز المرتبط بالرقم وحده يتحوّل من محرّك أداء إلى مصدر خطر — ويُنتج التجاوزات بشكل متوقع.',
      'A bonus tied to the number alone turns from a performance driver into a source of risk, predictably producing shortcuts.'),
    T('اربط جزءاً معلوماً بمعايير سلوكية يُسحب عند المخالفة.', 'Tie a known portion to conduct criteria, withdrawn on violation.'), 'tool:incentive');

  /* ── P6: القنوات ── */
  const ch = rows('channels');
  const weakRet = ch.filter(c => has(c.chan) && /غير موجودة|None/.test(c.ret || ''));
  if (weakRet.length) add('high', 'P6',
    T(weakRet.length + ' قناة بلا سياسة حظر انتقام', weakRet.length + ' channel(s) without a non-retaliation policy'),
    T('حظر الانتقام المُطبَّق فعلاً هو العامل الحاسم في استخدام القناة — أهم من عدد القنوات نفسه.',
      'An enforced non-retaliation rule is the decisive factor in channel usage — more than the number of channels.'),
    T('اكتب سياسة حظر انتقام واختبرها بحالة حقيقية.', 'Write a non-retaliation policy and test it on a real case.'), 'tool:channels');
  const hrRun = ch.filter(c => /الموارد البشرية|HR/.test(c.mgr || ''));
  if (hrRun.length) add('med', 'P6',
    T('قناة إبلاغ يديرها من قد يملك صلاحية العقاب', 'A reporting channel run by someone who may hold sanction authority'),
    T('حين يسلّم المبلّغ بلاغه لمن قد يعاقبه تُلغى الحماية عملياً — وقلة البلاغات تصبح عَرَض خوف لا دليل نزاهة.',
      'When the reporter hands their report to whoever may punish them, protection is nullified — few reports become a symptom of fear, not evidence of integrity.'),
    T('انقل القناة إلى طرف محايد خارجي.', 'Move the channel to a neutral external party.'), 'tool:channels');

  /* ── R1: المؤشرات ── */
  const ind = rows('indicators');
  if (ind.length) {
    const lead = ind.filter(i => /متقدّم|Leading/.test(i.lead || ''));
    if (!lead.length) add('high', 'R1',
      T('كل مؤشراتك متأخرة', 'All your indicators are lagging'),
      T('الاعتماد على المؤشرات المتأخرة وحدها قيادةٌ بالنظر في المرآة — تعرف أين كنت لا إلى أين تتجه.',
        'Relying on lagging indicators alone is driving by looking in the mirror — you know where you were, not where you are heading.'),
      T('أضف مؤشرات متقدّمة: دوران الأدوار الحرجة · التدريب المتأخر · عمر الاستثناءات.',
        'Add leading indicators: turnover in critical roles, overdue training, age of open exceptions.'), 'tool:dashboard');
    const noObj = ind.filter(i => has(i.ind) && !has(i.obj));
    if (noObj.length) add('med', 'R1',
      T(noObj.length + ' مؤشراً غير مرتبط بهدف', noObj.length + ' indicator(s) not linked to an objective'),
      T('المؤشر الذي لا يخدم هدفاً يستهلك انتباه المجلس بلا مقابل.',
        'An indicator serving no objective consumes board attention for nothing.'),
      T('اربط كل مؤشر بالهدف الذي يخدمه.', 'Link each indicator to the objective it serves.'), 'tool:dashboard');
    const noThr = ind.filter(i => has(i.ind) && !has(i.thr));
    if (noThr.length) add('low', 'R1',
      T(noThr.length + ' مؤشراً بلا عتبة تصعيد', noThr.length + ' indicator(s) without an escalation threshold'),
      T('المؤشر بلا عتبة رقم يُعرض ولا يُحرّك قراراً.', 'An indicator without a threshold is a number displayed, not a decision trigger.'),
      T('حدّد متى يتحوّل المؤشر إلى تصعيد.', 'Define when the indicator triggers escalation.'), 'tool:dashboard');
  }

  /* ── R2: الضمان ── */
  const asr = rows('assurance');
  const fake = asr.filter(a => /عالٍ|High/.test(a.lvl || '') &&
    ((a.obj === 'لا' || a.obj === 'No') || (a.comp === 'لا' || a.comp === 'No')));
  if (fake.length) add('high', 'R2',
    T(fake.length + ' ادّعاء «ضمان عالٍ» مع نقص الموضوعية أو الأهلية', fake.length + ' claim(s) of high assurance with missing objectivity or competence'),
    T('مستوى الضمان = الموضوعية + الأهلية معاً. ونقص أحدهما يُنزل المستوى مهما كان مسمّى مقدّم الضمان.',
      'Assurance level = objectivity + competence together. Missing either lowers the level regardless of the provider\u2019s title.'),
    T('صحّح المستوى أو غيّر مقدّم الضمان.', 'Correct the level or change the assurance provider.'), 'tool:assurance');
  const selfA = asr.filter(a => (a.obj === 'لا' || a.obj === 'No'));
  if (selfA.length) add('med', 'R2',
    T(selfA.length + ' موضوع ضمان يقيّمه من ليس موضوعياً عنه', selfA.length + ' assurance subject(s) evaluated by a non-objective provider'),
    T('تقييم ما صمّمته أو نفّذته بنفسك لا ينتج ضماناً إطلاقاً مهما بلغت الكفاءة.',
      'Evaluating what you designed or performed yourself produces no assurance at all, regardless of competence.'),
    T('أسنِد التقييم لجهة لم تشارك في التصميم أو التشغيل.', 'Assign evaluation to a party that neither designed nor operated it.'), 'tool:assurance');
  if (ctrls.length && !asr.length) add('med', 'R2',
    T('لا توجد خطة ضمان رغم وجود ضوابط', 'No assurance plan despite existing controls'),
    T('بلا خطة ضمان متكاملة ينشأ عَرَضان معاً: ازدواج تدقيق على عملية وفجوة على أخرى لا يدقّقها أحد.',
      'Without an integrated assurance plan two symptoms appear together: audit duplication on one process and a gap on another nobody audits.'),
    T('ابنِ خطة ضمان تحدّد من يضمن ماذا وبأي مستوى.', 'Build a plan defining who assures what and at what level.'), 'tool:assurance');

  /* ── R3: التحسين ── */
  const les = rows('lessons');
  const noChange = les.filter(l => has(l.finding) && !has(l.change));
  if (noChange.length) add('high', 'R3',
    T(noChange.length + ' درساً بلا تغيير فعلي', noChange.length + ' lesson(s) with no actual change'),
    T('الدرس الذي لا يغيّر ضابطاً أو سياسة أو تدريباً ليس درساً — بل تقريراً يُحفظ.',
      'A lesson that changes no control, policy or training is not a lesson — it is a filed report.'),
    T('حدّد التغيير الفعلي المُنفَّذ لكل درس.', 'Specify the actual change implemented for each lesson.'), 'tool:lessons');

  /* ── سلسلة الترابط ── */
  const chain = [
    ['stakeholders', T('أصحاب المصلحة', 'Stakeholders'), 'tool:stkreg'],
    ['direction', T('الاتجاه', 'Direction'), 'tool:mvv'],
    ['objectives', T('الأهداف', 'Objectives'), 'tool:cascade'],
    ['register', T('السجل الموحّد', 'Unified register'), 'tool:unified'],
    ['controls', T('الضوابط', 'Controls'), 'tool:iacm'],
    ['indicators', T('المؤشرات', 'Indicators'), 'tool:dashboard']
  ];
  const broken = chain.filter(c => !rows(c[0]).length && !out(c[0]));
  if (broken.length) add('med', '—',
    T('سلسلة الترابط مكسورة عند ' + broken.length + ' حلقة', 'The chain breaks at ' + broken.length + ' link(s)'),
    T('كل حلقة تُغذّي التي بعدها. الحلقة الفارغة تُضعف كل ما يعتمد عليها: ',
      'Each link feeds the next. An empty link weakens everything that depends on it: ') + broken.map(b => b[1]).join(' · '),
    T('أكمل الحلقات الناقصة بالترتيب.', 'Complete the missing links in order.'), broken[0][2]);

  return F;
}

/* ═══════ الواجهة ═══════ */
function view() {
  const F = run();
  const hi = F.filter(f => f.sev === 'high'), me = F.filter(f => f.sev === 'med'), lo = F.filter(f => f.sev === 'low');
  const SEV = { high: [T('حرجة', 'Critical'), '#B3261E'], med: [T('متوسطة', 'Moderate'), '#B4690E'], low: [T('منخفضة', 'Minor'), '#1256A0'] };
  return `<div class="wrap">
  <div class="hero">
    <div class="hero-t">
      <span class="kick">CONSISTENCY CHECKER</span>
      <h1>${T('فاحص التناقضات', 'Consistency Checker')}</h1>
      <p>${T('يقرأ ما بنيته ويقارنه بقواعد نموذج القدرات، فيكشف التناقضات والفجوات قبل أن يكشفها المدقق.',
             'Reads what you built and compares it against the Capability Model rules, exposing contradictions and gaps before an auditor does.')}</p>
    </div>
  </div>

  <div class="grid4 mb">
    <div class="stat"><b style="color:#B3261E">${hi.length}</b><span>${T('ملاحظة حرجة', 'Critical')}</span></div>
    <div class="stat"><b style="color:#B4690E">${me.length}</b><span>${T('ملاحظة متوسطة', 'Moderate')}</span></div>
    <div class="stat"><b style="color:#1256A0">${lo.length}</b><span>${T('ملاحظة منخفضة', 'Minor')}</span></div>
    <div class="stat"><b>${F.length ? Math.max(0, 100 - hi.length * 12 - me.length * 5 - lo.length * 2) : 100}</b><span>${T('درجة الاتساق', 'Consistency score')}</span></div>
  </div>

  ${F.length ? ['high', 'med', 'low'].map(sv => {
    const g = F.filter(f => f.sev === sv);
    if (!g.length) return '';
    return `<h3 class="sec-t" style="color:${SEV[sv][1]}">${T('ملاحظات', 'Findings')} ${SEV[sv][0]} (${g.length})</h3>
      ${g.map(f => `<div class="chk-c ${sv}">
        <div class="chk-h">
          <span class="chk-el">${esc(f.el)}</span>
          <b>${esc(f.ttl)}</b>
          <span class="pillx" style="background:${SEV[sv][1]}18;color:${SEV[sv][1]};border-color:${SEV[sv][1]}55">${SEV[sv][0]}</span>
        </div>
        <p class="chk-d">${esc(f.det)}</p>
        <div class="chk-f"><b>${T('العلاج', 'Fix')}:</b> ${esc(f.fix)}
          <button class="btn b sm" data-fix="${esc(f.go)}">${T('اذهب للأداة', 'Go to tool')} ◀</button></div>
      </div>`).join('')}`;
  }).join('') : `<div class="chk-clean">
      <b>✅ ${T('لا توجد تناقضات', 'No contradictions found')}</b>
      <p>${T('كل ما بنيته متسق مع قواعد النموذج. تابع إكمال بقية العناصر ثم أعد الفحص.',
             'Everything you built is consistent with the model rules. Continue completing the remaining elements then re-run the check.')}</p>
    </div>`}
  </div>`;
}

function bind() {
  [...document.querySelectorAll('[data-fix]')].forEach(b => b.onclick = () => window.GRCAPP.go(b.dataset.fix));
}
return { run, view, bind };
})();
</script>

n, alignment with best practices, coverage of disciplines, and impact on objectives.","Cost savings through applying a GRC program","The program's ability to ensure compliance with laws and avoid violations","Speed of implementation with a good design usable in each department"],"oa":["إلى سلامة البرنامج وتصميمه المنطقي، ومواءمته لأفضل الممارسات، وتغطيه مجالات الاختصاص، وتأثيره على الأهداف المعنية","إلى التوفير في التكاليف عن طريق تطبيق إحدى GRC برامج الحوكمة والمخاطر والامتثال","إلى قدرة البرنامج على ضمان الامتثال بالقوانين واللوائح، وتجنب حالات عدم الامتثال","إلى سرعة تنفيذ البرنامج بتصميم جيد يمكن تطبيقه في كل قسم"],"c":0,"ch":"Key Concepts","ex":"Exam 1 - GRCP","fe":"\"Effectiveness\" refers to how well the program achieves its intended outcomes, with a sound structure and appropriate coverage.\n\nReference: GRC Capability Model v3.5, page 24","fa":"تشير \"الفعالية\" في هذا السياق إلى مدى تأثير البرنامج في تحقيق النتائج المستهدفة، وسلامة تصميمه، واتساقه مع التخصصات المعنية، ومدى مساهمته في تحقيق الأهداف.\n\nالمرجع :Reference: GRC Capability Model v3.5, page 24"},{"qe":"What is the highest level in the maturity model, according to the GRC (Governance, Risk, and Compliance) Capability Model?","qa":"ما هو أعلى مستويات نموذج قياس النضج، حسب ما ورد في نموذج قدرات الحوكمة، المخاطر، والامتثال (GRC)؟","oe":["Level 5 – Optimizing","Level 6 – Advancing","Level 4 – Measuring","Level 1 – Initial"],"oa":["المستوى 5 - التحسين","المستوى 6 - التقدم","المستوى 4 - القياس","المستوى 1 - البدائى"],"c":0,"ch":"Key Concepts","ex":"Exam 2 - GRCP","fe":"Level 5 is the most mature stage, where processes are continuously improved using performance data and aligned with strategic goals.\n\nReference: GRC Capability Model v3.5, pages 26–28","fa":"المستوى الخامس هو أعلى درجة من درجات النضج، حيث تكون العمليات خاضعة للتحسين المستمر استناداً إلى بيانات الأداء ومرتبطة بالأهداف الاستراتيجية\n\n GRC Capability Model v3.5, pages 26–28:  المراجع"},{"qe":"What is the importance of independence in the context of assurance activities?","qa":"ما أهمية الاستقلالية في سياق أنشطة الضمان؟","oe":["It is a tool to achieve objectivity, enhance impartiality, and credibility of assurance activities.","It allows assurance providers to negotiate and reach better agreements and contracts with stakeholders","It allows assurance providers to avoid legal accountability and regulatory penalties","It enables assurance providers to access confidential and proprietary information"],"oa":["هي أداة لتحقيق الموضوعية، وتعزيز الحيادية، ومصداقية أنشطة الضمان","تتيح لمزودي الضمان التفاوض والوصول إلى اتفاقيات وعقود أفضل مع أصحاب المصلحة","تتيح لمزودي الضمان تجنب المساءلة القانونية والعقوبات النظامية","تمكّن مزود الضمان من الوصول إلى المعلومات السرية والبيانات الخاصة بالملكية"],"c":0,"ch":"Key Concepts","ex":"Exam 2 - GRCP","fe":"Independence is essential for maintaining objectivity and impartiality in assurance activities, ensuring that the findings and evaluations are credible and not influenced by internal or external pressure.\n\n \n\nReference: GRC Capability Model v3.5 – Assurance Role & Independence Principles (around page 58)","fa":"الاستقلالية تُعد من المبادئ الجوهرية التي تضمن أن يكون مزود الضمان قادرًا على تقييم الأنشطة والعمليات بموضوعية وحيادية دون تأثير من الأطراف المعنية، مما يعزز من مصداقية النتائج التي يقدمها.\n\n \n\nالمراجع : GRC Capability Model v3.5 – Assurance Role & Independence Principles (around page 58)"},{"qe":"Can the second line provide assurance on the activities of the first line, and under what conditions?","qa":"هل يمكن للخط الثاني تقديم الضمان حول أنشطة الخط الأول، وتحت أي ظروف؟","oe":["No, the second line cannot provide assurance on the first line’s activities because it focuses on long-term strategic planning, not assurance activities","Yes, the second line may provide assurance on first line activities if the audited activities were not designed or implemented by the second line, and second line staff have sufficient objectivity and competence, based on the subject matter and assurance level required","Yes, the second line can always provide assurance on the first line because it has the required authority and skills","No, the second line cannot provide assurance on the first line’s activities because it lacks authority and required competencies"],"oa":["لا، لا يمكن للخط الثاني تقديم الضمان حول أنشطة الخط الأول لأنه يركز على التخطيط الاستراتيجي والأهداف طويلة المدى، وليس على أنشطة الضمان","نعم، قد يقوم الخط الثاني بتقديم الضمان حول أنشطة الخط الأول بشرط أن الأنشطة قيد التدقيق لم يتم تصميمها أو تنفيذها من قبل الخط الثاني، وأن يتمتع موظفو الخط الثاني بالموضوعية والأهلية الكافية، نسبة إلى نوع موضوع الاختصاص ومستوى الضمان المطلوب","نعم، يمكن للخط الثاني بغض النظر عن تصميم الأنشطة وأدائها لأنه يمتلك مستوى من السلطة والمهارات اللازمة","لا، لا يمكن للخط الثاني تقديم الضمان حول أنشطة الخط الأول لأنها تفتقر للسلطة والصلاحيات اللازمة"],"c":1,"ch":"Review Competent","ex":"Exam 1 - GRCP","fe":"The second line can provide assurance on the first line’s activities only if it maintains independence from the design or execution of those activities and has adequate expertise and objectivity to ensure a credible assurance process.\n\nReference: GRC Capability Model v3.5 – Lines of Assurance (around page 60)","fa":"يمكن للخط الثاني تقديم الضمان لأنشطة الخط الأول، ولكن بشرط ألا يكون قد شارك في تصميم أو تنفيذ الأنشطة قيد التقييم، وأن يكون لديه الكفاءة والموضوعية لتقديم الضمان المناسب. هذا يضمن تجنب تضارب المصالح ويعزز مصداقية التقييم.\n\nالمراجع :\nGRC Capability Model v3.5 – Lines of Assurance (around page 60)"},{"qe":"What is the importance of independence in the context of assurance activities?","qa":"في سياق أنشطة الضمان، إلام يشير مصطلح \"الموضوعية\"؟","oe":["The ability of the assurance provider to reduce costs and increase efficiency when executing audit activities","The ability of the assurance provider to deliver reliable and accurate information to stakeholders, enabling them to form their own opinions on the subject matter","The ability of the assurance provider to act neutrally, independently, and honestly while conducting necessary activities and forming opinions on the subject.","The ability of the assurance provider to comply with standards and sector best practices during audit execution."],"oa":["مدى إمكانية مزود الضمان من تقليل التكاليف ورفع الكفاءة عند تنفيذ أنشطة التدقيق","مدى إمكانية مزود الضمان من تقديم معلومات موثوقة ودقيقة لأصحاب المصلحة بحيث يمكنهم تكوين الآراء بشأن موضوع الاختصاص بأنفسهم","مدى إمكانية مزود الضمان من أن يكون حيادياً، ونزيهاً، ومستقلاً، حراً القيام بالأنشطة اللازمة وتكوين الآراء بشأن موضوع الاختصاص","مدى إمكانية مزود الضمان من الالتزام بالمعايير وأفضل الممارسات الخاصة بالقطاع عند تنفيذ أنشطة التدقيق"],"c":2,"ch":"Key Concepts","ex":"Exam 1 - GRCP","fe":"Objectivity means that the assurance provider acts with neutrality, integrity, and independence, without being influenced by personal interest or external pressure, and is free to form professional opinions and conduct assurance activities accordingly.\n\nReference: GRC Capability Model v3.5 – Objectivity Principle (around page 57)","fa":"الموضوعية تعني أن مزود الضمان يعمل بطريقة حيادية ونزيهة ومستقلة، بحيث لا يتأثر بالضغوط أو المصالح الشخصية، ويكون حراً في تنفيذ الأنشطة واتخاذ المواقف المهنية، بما يعزز من مصداقية الضمان.\n\nالمراجع : نموذج قدرات الحوكمة والمخاطر والأمتثال - صفحة 57."},{"qe":"What is the importance of having both leading (early) and lagging (late) indicators in measuring progress toward objectives in Governance, Risk, and Compliance (GRC)?","qa":"ما أهمية وجود كل من المؤشرات المبكرة والمؤشرات المتأخرة في قياس التقدم تجاه الأهداف في الحوكمة والمخاطر والامتثال (GRC)؟","oe":["Leading indicators provide information about future events or conditions, while lagging indicators provide information about past events or conditions, allowing for a comprehensive view of progress","Leading indicators are financial, while lagging indicators are non-financial; both are essential for judging progress toward objectives","Leading indicators are always subjective, while lagging indicators are measurable; both are necessary to get a full picture.","Leading indicators provide information about future conditions for external stakeholders, while lagging indicators are necessary for internal stakeholders to adjust based on indicator values"],"oa":["توفر المؤشرات المبكرة معلومات عن الأحداث أو الظروف المستقبلية، بينما توفر المؤشرات المتأخرة معلومات حول الأحداث أو الظروف السابقة، مما يسمح برؤية شاملة عن مستوى التقدم","المؤشرات المبكرة هي محفوفات مالية، في حين أن المؤشرات المتأخرة غير مالية، وكلاهما ضروري للحكم على التقدم نحو الأهداف","المؤشرات المبكرة دائماً شخصية، بينما المؤشرات المتأخرة قابلة للقياس، وكلاهما ضروري للحصول على صورة كاملة","توفر المؤشرات المبكرة معلومات عن الظروف المستقبلية المتوقعة لأصحاب المصلحة الخارجيين، بينما المؤشرات المتأخرة ضرورية لأصحاب المصلحة الداخليين الذين قد يضطرون لإجراء التعديلات بناءً على قيم المؤشرات"],"c":0,"ch":"Align Competent","ex":"Exam 1 - GRCP","fe":"Leading indicators are predictive in nature, offering early warnings to enable proactive action, while lagging indicators reflect actual outcomes. Using both helps organizations gain a full understanding of performance and progress.\n\nReference: GRC Capability Model v3.5 – Performance Measurement Section (around page 62)","fa":"المؤشرات المبكرة تُستخدم لتقديم تنبؤات أو تحذيرات بشأن ما قد يحدث، مما يساعد في اتخاذ إجراءات استباقية، بينما المؤشرات المتأخرة تُستخدم لتقييم ما حدث فعلياً. الجمع بين النوعين يوفر صورة متكاملة عن الأداء ومستوى التقدم.\n\nالمرجع: نموذج GRC Capability Model v3.5 – قسم قياس الأداء (الصفحة 62)"},{"qe":"What is the role of Compliance Management Systems and Key Compliance Indicators (KCIs) in the organization?","qa":"ما هو دور أنظمة إدارة الامتثال ومؤشرات الامتثال الرئيسية (KCIs) في المنظمة؟","oe":["Measuring the level of adherence to requirements and commitments","Providing compliance training for employees","Ensuring adherence to ethical standards and codes of conduct","Monitoring and evaluating the effectiveness of internal controls and procedures"],"oa":["قياس درجة التعامل مع المتطلبات والالتزامات","تقديم تدريب الامتثال للموظفين","ضمان الالتزام بالقواعد الأخلاقية وقواعد السلوك","مراقبة وتقييم فعالية الضوابط والإجراءات الداخلية"],"c":3,"ch":"Review Competent","ex":"Exam 2 - GRCP","fe":"Compliance Management Systems and Key Compliance Indicators (KCIs) primarily serve the function of monitoring and assessing the effectiveness of internal controls and procedures.\n\nThese systems ensure that the organization:\n\n\n\t\n\tAdheres to internal policies and external regulations.\n\t\n\t\n\tIdentifies and mitigates compliance risks.\n\t\n\t\n\tUses metrics (KCIs) to track and report on control effectiveness.\n\t\n\t\n\tSupports continuous improvement of compliance functions.\n\t\n\n\nWhile training, ethical standards, and adherence are important, they are supportive components — the core function is oversight and evaluation of control systems.\n\n“Monitoring requires indicators such as KPIs, KRIs, and KCIs...”\n“Gauge the effectiveness, efficiency, agility, and resilience of actions & controls.”\n📖 Page 126–127, GRC Capability Model v3.5​","fa":"أنظمة إدارة الامتثال ومؤشرات الامتثال الرئيسية (KCIs) تُستخدم بشكل أساسي لرصد مدى التزام المؤسسة بالأنظمة والسياسات الداخلية والخارجية. وهي تعتمد على أدوات رقابية وتحليلية تساعد في:\n\n\n\t\n\tالتحقق من فعالية الضوابط.\n\t\n\t\n\tمراجعة الإجراءات الداخلية.\n\t\n\t\n\tرصد المخاطر.\n\t\n\t\n\tضمان تطبيق الالتزامات القانونية والتنظيمية.\n\t\n\n\nبالتالي، فإن مراقبة وتقييم فعالية الضوابط الداخلية هو لب عمل أنظمة الامتثال، أما تدريب الموظفين أو الالتزام الأخلاقي فهي مكونات مكملة ولكن ليست الدور الجوهري الأساسي.\n\n\n\t\n\tورد في صفحة 126 من المرجع أن عنصر  يتضمن:\n\t\n\t(تنفيذ أنشطة دورية ومستدامة لقياس فعالية وكفاءة ومرونة الإجراءات والضوابط)​.\n\t\n\t\n\tكما جاء في صفحة 127 :\n\t\n\t(المراقبة تتطلب مؤشرات مثل مؤشرات الأداء الرئيسية، ومؤشرات المخاطر، ومؤشرات الامتثال الرئيسية)​\n\t \n\n\t\n\t\t\n\t\t\t\n\t\t\t\tالمصطلح\n\t\t\t\tالوصف الرئيسي\n\t\t\t\tهل هو المصطلح الصحيح؟\n\t\t\t\n\t\t\n\t\n\n\t\n\t\t\n\t\t\t\n\t\t\t\tإدارة الفرص\n\t\t\t\tيركز على جزء محدد من اللايقين الإيجابي فقط\n\t\t\t\t❌ لا، جزء فقط\n\t\t\t\n\t\t\n\t\n\n\t\n\t\t\n\t\t\t\n\t\t\t\t✅ إدارة الأداء (المنفعة)\n\t\t\t\tإدارة شاملة لتحقيق المكاسب مع معالجة المخاطر ضمن العمليات والموارد\n\t\t\t\t✔️ نعم\n\t\t\t\n\t\t\n\t\n\n\t\n\t\t\n\t\t\t\n\t\t\t\tإدارة المخاطر\n\t\t\t\tيركز على التعامل مع الآثار السلبية (العقبات)\n\t\t\t\t❌ لا، جزء فقط\n\t\t\t\n\t\t\n\t\n\n\t\n\t\t\n\t\t\t\n\t\t\t\tإدارة الأحوال غير المؤكدة\n\t\t\t\tمصطلح غير دقيق وغير مستخدم رسميًا في إطار GRC"},{"qe":"In the context of Governance, Risk, and Compliance (GRC), what is the importance of having a target value and a time frame for each indicator?","qa":"في سياق الحوكمة والمخاطر والامتثال (GRC)، ما أهمية وجود قيمة المستهدف والنطاق الزمني لكل مؤشر؟","oe":["They relate only to external reporting and do not affect internal decision-making","Their presence allows the organization to avoid constant monitoring and measure progress toward goals.","They relate only to financial indicators and do not impact non-financial ones","Their presence ensures that the organization sets clear performance expectations and defines the expected timeframe to achieve targets."],"oa":["وجودها له علاقة فقط بالتقارير الخارجية ولا يؤثر على عمليات اتخاذ القرار داخلياً","وجودها يسمح للمنظمة بتجنب الرقابة المستمرة وقياس التقدم تجاه الأهداف","وجودها له علاقة فقط بالمؤشرات المالية، ولا يؤثر على المؤشرات غير المالية","وجودها يضمن أن المنظمة تضع توقعات واضحة للأداء، وتضع النطاق الزمني المتوقع لتحقيق المستهدفات"],"c":3,"ch":"Align Competent","ex":"Exam 1 - GRCP","fe":"In the GRC context, indicators such as KPIs (Key Performance Indicators), KCIs (Key Compliance Indicators), and KRIs (Key Risk Indicators) are used to track the organization’s performance, compliance, and risk exposure.\n\t\n\t\n\tFor these indicators to be meaningful and actionable, they must include:\n\n\t\n\t\t\n\t\tA Target Value – What the organization aims to achieve.\n\t\t\n\t\t\n\t\tA Timeframe – When the target is expected to be achieved.\n\t\t\n\t\n\t\n\n\n🔍 Why is this important?\n\n\n\t\n\tIt ensures clear expectations are set.\n\t\n\t\n\tAllows the organization to track progress over time.\n\t\n\t\n\tSupports evidence-based decision-making.\n\t\n\t\n\tForms the basis of effective performance measurement.\n\t\n\tReference: GRC Capability Model v3.5 – Premium Edition Page: 61","fa":"في أنظمة الحوكمة والمخاطر والامتثال (GRC)، تُستخدم المؤشرات (مثل KPIs, KCIs, KRIs) لتتبع الأداء والمخاطر والامتثال.\n\nلكي تكون المؤشرات فعّالة، يجب أن تتضمن:\n\nقيمة مستهدفة (Target Value): توضح ما تسعى المنظمة إلى تحقيقه.\n\nنطاق زمني (Timeframe): يحدد متى يجب الوصول إلى هذا الهدف.\n\n🔎 لماذا هذا مهم؟\n\nيساعد في توضيح التوقعات لجميع أصحاب المصلحة.\n\nيمكّن الإدارة من مقارنة الأداء الفعلي بالهدف المخطط في الوقت المناسب.\n\nيساهم في تحسين المساءلة واتخاذ القرار المبني على البيانات.\n\nيعتبر جزءًا أساسيًا من عناصر القياس الاستراتيجي في إطار GRC.\nReference: GRC Capability Model v3.5 – Premium Edition Page: 61"},{"qe":"What is the term that refers to managing operations and resources while seeking rewards and addressing risks?","qa":"ما هو المصطلح الذي يُطلق على إدارة العمليات والموارد للسعي تجاه المكاسب مع التعامل مع المخاطر؟","oe":["Risk Management","Performance Management (Reward)","Management of Uncertainty","Opportunity Management"],"oa":["إدارة المخاطر","إدارة الأداء (المنفعة)","إدارة الأحوال غير المؤكدة","إدارة الفرص"],"c":1,"ch":"Key Concepts","ex":"Exam 1 - GRCP","fe":"According to the GRC Capability Model v3.5, uncertainty can result in:\n\n\n\t\n\tOpportunities – Potential for positive outcomes (Reward)\n\t\n\t\n\tObstacles – Potential for negative outcomes (Risk)\n\t\n\t\n\tObligations – Requirements that must be complied with\n\t\n\n\n▶️ The correct term that describes managing processes and resources to pursue gain while addressing uncertainty and risk is:\n\n\nPerformance Management (Reward)\n\n\nIt goes beyond just identifying opportunities — it actively seeks reward and balances it with risk through strategic operation and decision-making.\n\nReference : GRC Capability Model v3.5 – OCEG (2024 Premium Edition) , Page 40 – Section: Uncertainty & Performance","fa":"في إطار الحوكمة والمخاطر والامتثال (GRC)، تم تصنيف التعامل مع اللايقين (Uncertainty) إلى ثلاث أنواع:\n\n\n\t\n\tالفرص (Opportunities):\n\tوهي الآثار الإيجابية المحتملة للايقين.\n\tتُعالج من خلال إدارة الأداء.\n\t\n\t\n\tالعقبات أو التهديدات (Obstacles):\n\tوهي الآثار السلبية للايقين.\n\tتُعالج من خلال إدارة المخاطر.\n\t\n\t\n\tالالتزامات (Obligations):\n\tوهي ما يجب الامتثال له قانونيًا أو أخلاقيًا.\n\tتُعالج من خلال إدارة الامتثال.\n\t\n\n\n🔷 لذلك، المصطلح الذي يشير إلى إدارة العمليات والموارد بهدف تحقيق المكاسب الإيجابية مع التعامل مع المخاطر هو: \"إدارة الأداء\"، وليس فقط \"إدارة الفرص\" أو \"إدارة المخاطر\"، لأن المصطلحين الآخرين يُعبران عن جوانب محددة فقط.\nالمراجع : GRC Capability Model v3.5 – OCEG (2024 Premium Edition) صفحة 40"},{"qe":"What is the design option associated with acceptance or concession to the situation with minor modifications to processes and controls, with awareness of the nature of risks/rewards, obligations and their levels, and their relation to opportunities, obstacles, or compliance?","qa":"ما هو خيار التصميم المرتبط بالتقبل أو التنازل للموقف مع تعديلات طفيفة على الإجراءات والضوابط مع العلم بطبيعة المخاطر/المكاسب، والالتزامات ومستوياتها وعلاقتها بالفرص أو العقبات أو الامتثال","oe":["Control","Acceptance","Sharing","Avoidance"],"oa":["التحكم","القبول","المشاركة","التقادي"],"c":1,"ch":"Align Competent","ex":"Exam 1 - GRCP","fe":"In the GRC Capability Model, design options refer to how organizations manage situations involving uncertainty (risks or rewards) and obligations.\n\t\n\t\n\tThe Acceptance option is applied when:\n\n\t\n\t\t\n\t\tThe organization is aware of the situation's nature and implications.\n\t\t\n\t\t\n\t\tIt chooses to live with it, perhaps with minor procedural adjustments.\n\t\t\n\t\t\n\t\tThe risk or opportunity is tolerable, or the cost of mitigation outweighs the benefit.✅ It represents a calculated tolerance of a known risk, opportunity, or obligation with slight adjustments in controls or governance.\n\t\t\n\t\t\n\t\tSource: GRC Capability Model v3.5 – OCEG (2024 Premium Edition) , Page: 68","fa":"في نموذج GRC (الحوكمة والمخاطر والامتثال)، تُصنَّف استجابات التصميم (Design Options) وفقًا لطريقة تعامل المنظمة مع الفرص أو العقبات أو الالتزامات.\n\t\n\t\n\tخيار القبول (Acceptance) هو الاستجابة التي تُستخدم عندما:\n\n\t\n\t\t\n\t\tتكون المخاطر أو الالتزامات مفهومة ومدارة.\n\t\t\n\t\t\n\t\tيكون التأثير قابلاً للتحمل أو تكلفة التدخل أعلى من المنفعة.\n\t\t\n\t\t\n\t\tتُجري المنظمة تعديلات بسيطة أو طفيفة على الضوابط أو الإجراءات.\n\t\t\n\t\t\n\t\tيتم الاعتراف بالموقف وقبوله دون رفضه أو تجاوزه بالكامل.\n\t\t\n\t\tSource: GRC Capability Model v3.5 – OCEG (2024 Premium Edition) , Page: 68"},{"qe":"What are “Proactive Actions & Controls” in the context of dealing with uncertain conditions?","qa":"ما هي \"الإجراءات والضوابط الاستقصائية\" في سياق التعامل مع الأحوال غير المؤكدة؟","oe":["Proactive actions and controls predict the probability of undesired events occurring in the future","Proactive actions and controls enhance desired events and correct or adapt to undesired events","Proactive actions and controls detect the occurrence of desired and undesired events","Proactive actions and controls stimulate favorable events and prevent unfavorable events"],"oa":["الإجراءات والضوابط الاستقصائية تنبئ باحتمالية وقوع الأحداث غير المرغوبة في المستقبل","الإجراءات والضوابط الاستقصائية تعزز تأثير الأحداث المرغوبة وتصحح وتتعايش مع الأحداث غير المرغوبة","الإجراءات والضوابط الاستقصائية ترصد وقوع الأحداث المرغوبة والأحداث غير المرغوبة","الإجراءات والضوابط الاستقصائية تحفز الأحداث المرغوبة وتمنع الأحداث غير المرغوبة"],"c":3,"ch":"Key Concepts","ex":"Exam 1 - GRCP","fe":"In the GRC Capability Model v3.5, controls are categorized by their timing and intent into three main types:\n\n\n\t\n\t\t\n\t\t\tType of Control\n\t\t\tDescription\n\t\t\n\t\n\t\n\t\t\n\t\t\t🔹 Proactive\n\t\t\tAct before the event: to promote good outcomes and prevent bad ones\n\t\t\n\t\t\n\t\t\t🔸 Detective\n\t\t\tIdentify events as they occur, to enable quick response\n\t\t\n\t\t\n\t\t\t🔻 Responsive\n\t\t\tAct after the event, to recover or correct\n\t\t\n\t\n\n\n🔍 Proactive controls are most desirable because they allow an organization to:\n\n\n\t\n\tIncrease the chance of positive events (opportunities/rewards)\n\t\n\t\n\tDecrease the likelihood of negative events (risks/obstacles)\n\t\n\n\n\n📚 Official Source:\n\n\n\t\n\tGRC Capability Model v3.5 – Page 73\n\t\n\n\n\n“Proactive Actions & Controls prevent unfavorable events before they happen and promote favorable events.”\nGRC Capability Model v3…","fa":"في نموذج GRC، يتم تصنيف الضوابط إلى:\n\nاستقصائية (Proactive): تمنع الأحداث الضارة وتُعزز الأحداث المفيدة قبل وقوعها.\n\nرصدية (Detective): تكشف الأحداث فور وقوعها.\n\nاستجابية (Responsive): تُعالج بعد وقوع الأحداث.\n\n💡 وبالتالي، الضوابط الاستقصائية لا تتنبأ فقط، بل تُحرك الأحداث الإيجابية وتمنع السلبية بشكل استباقي.\n\n\n📚 المصدر الرسمي | Official Reference:\n\n\n\"Proactive Actions & Controls prevent unfavorable events before they happen and promote favorable events.\"\n📖 GRC Capability Model v3.5 – Page 73​GRC Capability Model v3.5"},{"qe":"What is the term used to describe the level of risk in the presence of actions and controls","qa":"ما هو المصطلح الذي يُطلق على مستوى المخاطر مع وجود الإجراءات والضوابط؟","oe":["Risk with Controls","Residual Risk","Uncontrolled Risk","Inherent Risk"],"oa":["المخاطر مع الضوابط","المخاطر المتبقية","المخاطر دون الضوابط","المخاطر المتأصلة"],"c":0,"ch":"Learn Component","ex":"Exam 1 - GRCP","fe":"In the GRC Capability Model, the standard terms used to describe risk levels are:\n\n\n\t\n\t\t\n\t\t\tTerm\n\t\t\tDefinition\n\t\t\n\t\n\t\n\t\t\n\t\t\tInherent Risk\n\t\t\tRisk that exists before any controls are applied\n\t\t\n\t\t\n\t\t\t✅ Residual Risk\n\t\t\tRisk that remains after controls and actions have been implemented\n\t\t\n\t\t\n\t\t\tUncontrolled Risk\n\t\t\tRisk in the absence of any management or oversight – more chaotic version of inherent\n\t\t\n\t\t\n\t\t\tRisk with Controls\n\t\t\tthe term used to describe the level of risk in the presence of actions and controls\n\t\t\n\t\n\n\n Official Reference:\n\n\n📖 GRC Capability Model v3.5, Page 70","fa":"في منهجية GRC، يتم تعريف مستويات المخاطر الرئيسية كما يلي:\n\n\n\t\n\t\t\n\t\t\tالمصطلح\n\t\t\tالتعريف\n\t\t\n\t\n\t\n\t\t\n\t\t\tالمخاطر المتأصلة\n\t\t\tهي المخاطر الموجودة قبل تطبيق أي ضوابط أو إجراءات رقابية أو علاجية.\n\t\t\n\t\t\n\t\t\t المخاطر المتبقية\n\t\t\tهي مستوى الخطر الذي يبقى بعد تطبيق الإجراءات والضوابط.\n\t\t\n\t\t\n\t\t\tالمخاطر دون ضوابط\n\t\t\tتشير إلى الحالات التي لا تحتوي على أي آليات رقابة – تشبه المخاطر المتأصلة لكن بصورة فوضوية.\n\t\t\n\t\t\n\t\t\tالمخاطر مع الضوابط\n\t\t\tهو المصطلح الذي يُطلق على مستوى المخاطر مع وجود الإجراءات والضوابط\n\t\t\n\t\n\n\n📚 المصدر الرسمي | Official Reference:\n\n\n\"Residual Risk – the level of risk in the presence of actions & controls.\"\n📖 GRC Capability Model v3.5, Page 70"},{"qe":"What is the role of a values statement in an organization?","qa":"ما دور بيان القيم في المنظمة؟","oe":["The values statement is a marketing tool to attract new customers and investors to the organization.","The values statement reflects shared beliefs and expectations among leadership, employees, and stakeholders, serving as a guide to building a positive and productive organizational culture","The values statement is a formal agreement between the organization and its suppliers to ensure the timely delivery of services and products, which is essential to organizational value.","The values statement is a legal document outlining the organization’s obligations and financial responsibilities that contribute to its value."],"oa":["بيان القيم هو أداة تسويقية لجذب العملاء والمستثمرين الجدد إلى المنظمة","بيان القيم يعكس المعتقدات والتوقعات المشتركة لقيادة المنظمة والموظفين وأصحاب المصلحة، وتُعد بمثابة دليل لتأسيس ثقافة تنظيمية إيجابية ومنتجة","بيان القيم هو اتفاقية رسمية بين المنظمة ومورديها للتأكد من تسليم الخدمات والمنتجات في الوقت المناسب لضرورتها في بناء قيمة المنظمة","بيان القيم هو مستند قانوني يوضح التزامات المنظمة ومسؤولياتها المالية التي تساهم في قيمتها"],"c":1,"ch":"Align Competent","ex":"Exam 2 - GRCP","fe":"A values statement defines the core beliefs and behavioral expectations that guide how an organization operates. It:\n\n\n\t\n\tAligns leadership and employees with a shared vision\n\t\n\t\n\tSupports the development of a healthy organizational culture\n\t\n\t\n\tReinforces ethical behavior and decision-making\n\t\n\t\n\tBuilds trust internally and externally\n\t\n\n\nIt is not a legal, marketing, or contractual document — but rather a cultural and ethical compass.\n \n\n📚  Official Reference:\n\n\n“A values statement expresses the core principles that guide behavior and decision-making across the organization. It creates a foundation for ethical culture, internal alignment, and accountability.”\n— PMI Talent Triangle & GRC Capability Model v3.5 – Culture & Ethics Element","fa":"بيان القيم في المنظمة هو عنصر من عناصر الهوية المؤسسية، يُعبر عن:\n\n\n\t\n\tالمبادئ التي تؤمن بها المنظمة\n\t\n\t\n\tالمعايير السلوكية المتوقعة من الموظفين والإدارة\n\t\n\t\n\tالأساس الذي تُبنى عليه الثقافة التنظيمية الإيجابية\n\t\n\t\n\tأداة توجيهية تدعم اتخاذ القرار وتعزز الالتزام الأخلاقي\n\t\n\n\n📌 هو ليس مستندًا قانونيًا، ولا أداة تسويقية، ولا اتفاقية تشغيلية، بل هو مرآة للثقافة التنظيمية التي ترغب المؤسسة في ترسيخها داخليًا.\n\n📚 المرجع الرسمي | Official Reference:\n\n“A values statement expresses the core principles that guide behavior and decision-making across the organization. It creates a foundation for ethical culture, internal alignment, and accountability.”\n— PMI Talent Triangle & GRC Capability Model v3.5 – Culture & Ethics Element"},{"qe":"How can an organization’s values help shape a positive and productive organizational culture?","qa":"كيف يمكن لقيم المنظمة أن تساعد في تشكيل ثقافة مؤسسية إيجابية ومنتجة؟","oe":["By detailing the organization’s expansion plans and growth strategies to add value","By setting financial goals and targets that the organization aims to achieve to build value","By creating shared purpose and direction, guiding behavior and decision-making, and aligning organizational actions with mission and goals on a broader scale","By customizing dress codes and expected workplace etiquette"],"oa":["عن طريق تفصيل خطط توسعة المنظمة واستراتيجيات النمو لإضافة القيمة","عن طريق تحديد المستهدفات والأهداف المالية التي تسعى المنظمة لتحقيقها من أجل بناء القيمة","عن طريق خلق معنى مشترك للغرض والتوجه، وتوجيه السلوكيات وصنع القرار، ومواءمة إجراءات المنظمة مع المهمة والأهداف على نطاق أوسع","عن طريق تخصيص قواعد الزي وآداب مكان العمل التي يتوقع أن يتبعها الموظفون"],"c":2,"ch":"Learn Component","ex":"Exam 1 - GRCP","fe":"Organizational values act as a cultural compass. When values are clearly defined and embraced, they:\n\n\n\t\n\tCreate a shared identity and collective direction for employees.\n\t\n\t\n\tInfluence daily behavioral standards and decision-making across teams.\n\t\n\t\n\tStrengthen alignment between operations and the organization's mission and long-term goals.\n\t\n\t\n\tBuild a positive, trust-driven, and results-oriented work environment.\n\t\n\n\nValues go beyond policies or dress codes; they establish the \"why\" behind what people do.\n\nReference:\nGRC Capability Model v3.5 – Culture & Ethics\n\n\n“Values define shared purpose, align behavior, and guide the organization’s culture and performance.”","fa":"قيم المنظمة تشكّل الأساس الثقافي الذي تعتمد عليه كل الأنشطة والسلوكيات داخل المؤسسة.\n\t\n\t\n\tعندما تكون القيم واضحة ومشتركة، فإنها:\n\n\t\n\t\t\n\t\tتوجّه القرارات\n\t\t\n\t\t\n\t\tتنظّم السلوكيات\n\t\t\n\t\t\n\t\tتعزّز الالتزام بالمهمة والرؤية\n\t\t\n\t\t\n\t\tوتخلق بيئة متماسكة وفعّالة\n\n\t\t📘 المراجع | References:\n\t\t\n\t\t\n\t\tGRC Capability Model v3.5 – Culture & Ethics\n\t\t\n\t\t\n\t\t\n\t\t“Values creat  a common understanding of purpose and expected behavior, guiding the organization’s culture and decisions.”"},{"qe":"What is the difference between mandatory and voluntary obligations?","qa":"ما الفرق بين الالتزامات الإجبارية والالتزامات الاختيارية؟","oe":["Mandatory obligations relate to financial performance; voluntary ones relate to stakeholder satisfaction.","Mandatory obligations are set by legal teams, while voluntary ones are set by customers.","Mandatory obligations are requirements imposed by legitimate authority (laws, regulations), while voluntary obligations are commitments the organization accepts willingly (e.g., contracts, agreements, and values)","Mandatory obligations are the organization’s choices, while voluntary ones are binding"],"oa":["الالتزامات الإجبارية متعلقة بالأداء المالي، أما الالتزامات الاختيارية فهي رضا أصحاب المصلحة من غير المساهمين","الالتزامات الإجبارية يتم تحديدها من قبل الإدارة القانونية، بينما الالتزامات الاختيارية يتم تحديدها من قبل العملاء","الالتزامات الإجبارية هي المتطلبات التي يجب على المنظمة استيفاؤها نتيجة سلطة شرعية (مثل القوانين والأنظمة واللوائح)، بينما الالتزامات الاختيارية هي المتطلبات التي توافق عليها المنظمة طوعًا (مثل العقود والاتفاقيات والقيم)","الالتزامات الإجبارية هي اختيارات للمنظمة، أما الالتزامات الاختيارية فهي ملزمة"],"c":2,"ch":"Key Concepts","ex":"Exam 1 - GRCP","fe":"Mandatory obligations are non-negotiable and enforced by external authorities such as regulators, governments, or legal systems. Organizations must comply to avoid legal consequences.\n\t\n\t\n\tVoluntary obligations are self-imposed by the organization, often aligned with ethical principles, stakeholder agreements, or corporate values. Though not required by law, they build trust and accountability.\n\t\n\n\nUnderstanding both types is essential for sound risk and compliance management.\n\nReference:\nGRC Capability Model v3.5 – Obligations Element\n\n\n“Obligations may be externally imposed or voluntarily adopted. Both must be managed with equal rigor.”","fa":"الالتزامات الإجبارية (Mandatory): مفروضة من الجهات التنظيمية أو التشريعية، ويجب على المؤسسة الالتزام بها قانونًا.\n\t\n\t\n\tالالتزامات الاختيارية (Voluntary): ترتبط بالاتفاقيات التي تختار المنظمة الالتزام بها بإرادتها لتعزيز الثقة والالتزام القيمي.\n\t\n\n\n\n📘 المراجع | References:\n\n\n\t\n\tGRC Capability Model v3.5 – Obligations\n\t\n\n\n\n“Obligations may be imposed (by law or regulation) or voluntarily undertaken (e.g., codes of conduct, contracts).”"},{"qe":"In the context of disciplined performance, how is integrity defined?","qa":"في سياق الأداء المنضبط، ما تعريف النزاهة؟","oe":["Integrity is the absence of legal disputes within the organization.","Integrity is the standard of completeness in fulfilling commitments and promises, and in managing failures responsibly.","Integrity is the ability to achieve financial success based on promised outcomes to stakeholders.","Integrity means adhering to all government regulations."],"oa":["النزاهة هي غياب أي نزاعات أو خلافات قانونية داخل المنظمة","النزاهة هي مستوى الكمال من ناحية الوفاء بالالتزامات والوعود، وترتيب الفوضى إذا تم الإخلال بها","النزاهة هي القدرة على تحقيق النجاح المالي حسب الوعود التي تم تقديمها لأصحاب المصلحة","النزاهة هي عملية الالتزام بجميع اللوائح الحكومية"],"c":1,"ch":"Key Concepts","ex":"Exam 1 - GRCP","fe":"Integrity in the organizational context is about:\n\n\n\t\n\tKeeping commitments and promises fully, not just partially.\n\t\n\t\n\tBeing accountable when something goes wrong.\n\t\n\t\n\tTaking corrective actions instead of hiding or denying issues.\n\t\n\n\nIt reflects an organization’s maturity and ethical foundation. Without integrity, even compliance and performance mechanisms may collapse.\n\nReference:\nGRC Capability Model v3.5 – Integrity Element","fa":"النزاهة لا تعني فقط تنفيذ الالتزامات، بل تشمل:\n\nالوفاء التام بالوعود\n\nالشفافية في الاعتراف بالفشل\n\nاتخاذ خطوات عملية لمعالجة الأخطاء\n\n\n📘 المراجع | References:\n\nGRC Capability Model v3.5 – Integrity"},{"qe":"Which organization and its membership created the concepts of Principled Performance and GRC?","qa":"أي منظمة وأعضاؤها قاموا بإنشاء مفهومي الأداء المبني على المبادئ (Principled Performance) والحوكمة والمخاطر والامتثال (GRC)؟","oe":["SCCE (Society of Corporate Compliance and Ethics)","The OCEG community of GRC Professionals","IFAC (International Federation of Accountants)","ACFE (Association of Certified Fraud Examiners)"],"oa":["SCCE (Society of Corporate Compliance and Ethics)","The OCEG community of GRC Professionals","IFAC (International Federation of Accountants)","ACFE (Association of Certified Fraud Examiners)"],"c":1,"ch":"Key Concepts","ex":"Exam 1 - GRCP","fe":"OCEG (Open Compliance & Ethics Group) is the organization that originally developed and formalized the concepts of GRC (Governance, Risk Management, and Compliance) and Principled Performance. They published the GRC Capability Model and set the global standard for how organizations should align performance, risk, and integrity. Their framework promotes achieving objectives, addressing uncertainty, and acting with integrity.","fa":"تُعد منظمة OCEG (مجموعة الامتثال والأخلاقيات المفتوحة) هي الجهة التي طورت ووضعت رسميًا مفاهيم GRC (الحوكمة، إدارة المخاطر، والامتثال) ومفهوم الأداء المبني على المبادئ (Principled Performance).\nقامت OCEG بنشر نموذج GRC Capability Model والذي يُعد معيارًا عالميًا يوضح كيفية تحقيق التوافق بين الأداء والمخاطر والنزاهة في المؤسسات.\nيركز هذا النموذج على تحقيق الأهداف، والتعامل مع عدم اليقين، والعمل بنزاهة."},{"qe":"What is the role of key compliance indicators (KCIs)?","qa":"ما هو دور مؤشرات الامتثال الرئيسية (KCIs)؟","oe":["KCIs are indicators that help govern, manage, and provide assurance about compliance related to an objective.","KCIs are subjective measures that help the chief compliance officer to request resources from the governing authority.","KCIs are used to determine the number of compliance requirements that the organization must satisfy.","KCIs are used to report to stakeholders on the number of compliance-related legal actions that have been taken against the organization."],"oa":["مؤشرات تساعد على الحوكمة والإدارة وتقديم الضمان حول الامتثال المتعلق بهدف ما","مقاييس ذاتية تساعد مسؤول الامتثال الرئيسي في طلب الموارد من السلطة الحاكمة.","تُستخدم مؤشرات الامتثال الرئيسية لتحديد عدد متطلبات الامتثال التي يجب على المنظمة تلبيتها.","تُستخدم مؤشرات الامتثال الرئيسية لإبلاغ أصحاب المصلحة بعدد الإجراءات القانونية المتعلقة بالامتثال المتخذة ضد المنظمة."],"c":0,"ch":"Key Concepts","ex":"Exam 1 - GRCP","fe":"Key Compliance Indicators (KCIs) provide governance, management, and assurance regarding compliance. They are not simply counts of requirements, resource requests, or legal actions. The correct option fully reflects their role in GRC.\n\n \n\n**Reference:** GRC Capability Model v3.5, p. 5–6.","fa":"مؤشرات الامتثال الرئيسية (KCIs) هي أدوات لقياس مدى التزام المنظمة بمتطلبات الامتثال الإلزامية والاختيارية، وتساعد على تقديم الضمان (assurance) لأصحاب المصلحة بأن المنظمة تعمل ضمن الحدود القانونية والأخلاقية.\n\t\n\tالمرجع:\n\t\n\n\nالنسخة الإنجليزية: صـ 5 و6 (Big Picture Perspective) حيث ورد شرح Key Compliance Indicators (KCIs) ضمن KPIs وKRIs وKCIs"},{"qe":"In the context of GRC, what is the significance of setting objectives that are specific, measurable, achievable, relevant, and timebound (SMART)?","qa":"في سياق GRC، ما أهمية وضع أهداف تكون محددة وقابلة للقياس وقابلة للتحقيق وذات صلة ومحددة بالوقت (SMART)؟","oe":["SMART objectives are only relevant for financial objectives and have no impact on non-financial objectives.","SMART objectives can be more easily communicated to stakeholders to gain their confidence.","SMART objectives provide clarity, focus, and direction and help ensure that objectives are effectively aligned with the organization’s priorities.","SMART objectives allow the organization to avoid accountability and responsibility for failing to achieve objectives."],"oa":["الأهداف الذكية ذات صلة فقط بالأهداف المالية وليس لها أي تأثير على الأهداف غير المالية","يمكن توصيل الأهداف الذكية بسهولة أكبر إلى أصحاب المصلحة لكسب ثقتهم","توفر الأهداف الذكية الوضوح والتركيز والاتجاه وتساعد في ضمان توافق الأهداف بفعالية مع أولويات المنظمة","تسمح الأهداف الذكية للمنظمة بتجنب المساءلة والمسؤولية عن عدم تحقيق الأهداف."],"c":2,"ch":"Key Concepts","ex":"Exam 1 - GRCP","fe":"SMART objectives ensure clarity, measurability, and alignment with organizational priorities. They apply to both financial and non-financial objectives and enhance accountability rather than avoiding it.\n\n**Reference:** GRC Capability Model v3.5, p. 44–45.","fa":"SMART هي أداة لتعزيز الفعالية في صياغة الأهداف بحيث تكون واضحة وقابلة للقياس ومرتبطة بالوقت، وبالتالي تساعد على توجيه الجهود وضمان التوافق مع الاستراتيجية.\n\nالمرجع:\n\nالنسخة الإنجليزية: صـ 44–45 (Achieve Objectives) حيث ورد شرح أهمية الأهداف الذكية في GRC"},{"qe":"What is the definition of \"uncertainty\"?","qa":"ما هو تعريف \"عدم اليقين\" (Uncertainty)؟","oe":["A state of being unsure what to do, or to put in place, to have strong performance based on the established objectives.","A state of being ambivalent about something due to lack of information needed to make an assessment of its potential impact on achievement of objectives.","A state of being unsure about something due to incomplete knowledge or underlying randomness making it difficult to understand with complete confidence.","A state of being unsure whether something might affect performance."],"oa":["حالة من عدم التأكد بشأن ما يجب القيام به، أو وضعه موضع التنفيذ، للحصول على أداء قوي بناءً على الأهداف الموضوعة.","حالة من التردد تجاه شيء ما بسبب نقص المعلومات اللازمة لتقييم تأثيره المحتمل على تحقيق الأهداف","حالة من عدم التأكد بشأن شيء ما بسبب المعرفة غير المكتملة أو العشوائية الكامنة، مما يجعل من الصعب الفهم بثقة كاملة","حالة من عدم التأكد مما إذا كان شيء ما قد يؤثر على الأداء."],"c":2,"ch":"Key Concepts","ex":"Exam 1 - GRCP","fe":"Uncertainty refers to incomplete knowledge or inherent randomness that prevents full confidence in predicting outcomes. Other options partially capture aspects of uncertainty but are incomplete.\n\n**Reference:** GRC Capability Model v3.5, p. 58.","fa":"التعريف الدقيق لـ عدم اليقين (Uncertainty) في GRC هو: \"عدم القدرة على التنبؤ بنتيجة ما بسبب نقص المعرفة أو الطبيعة العشوائية للأحداث\"، وهذا ما ورد في إطار OCEG.\n\nباقي الخيارات تعبر عن جوانب جزئية لكنها ليست شاملة أو دقيقة بالمعنى الرسمي.\n\nالمرجع: صـ 58 (Address Uncertainty)."},{"qe":"What is the term used to describe a cause that has the potential to result in harm?","qa":"ما هو المصطلح المستخدم لوصف سبب لديه القدرة على إحداث ضرر؟","oe":["Obstacle","Hazard","Opportunity","Prospect"],"oa":["عقبة","خطر","فرصة","احتمال"],"c":1,"ch":"Key Concepts","ex":"Exam 1 - GRCP","fe":"A hazard is the source or cause with the potential to create harm. Other options describe opportunities, barriers, or possibilities, but not a cause of harm.\n\n**Reference:** GRC Capability Model v3.5, p. 58.","fa":"Hazard يُستخدم في إدارة المخاطر للدلالة على السبب أو المصدر الذي يمكن أن يؤدي إلى ضرر.\n\nOpportunity يشير إلى احتمال إيجابي.\n\nObstacle عائق وليس بالضرورة ضار.\n\nProspect مجرد احتمال أو إمكانية مستقبلية.\n\nالمرجع:\n\nالنسخة الإنجليزية: صـ 58 (Address Uncertainty – risk terminology)"},{"qe":"What are beliefs, and how do they influence behavior within an organization?","qa":"ما هي المعتقدات، وكيف تؤثر على السلوك داخل المنظمة؟","oe":["Beliefs are the organization’s understanding of its mission, vision, and values, and they influence behavior by aligning actions with the organization’s higher purpose and long-term goals.","Beliefs are the organization’s perceptions of risk and uncertainty, and they influence behavior by guiding actions and controls to address compliance-related risks.","Beliefs are ideas and assumptions held by individuals or groups, often shaped by experiences and perceptions, that influence behavior by informing the values and principles that guide actions and decisions.","Beliefs are the organization’s commitments to mandatory and voluntary obligations, and they influence behavior by determining the extent to which individuals fulfill obligations and honor promises.","Beliefs are the written codes of conduct and policies that employees must follow to ensure compliance."],"oa":["المعتقدات هي فهم المنظمة لرسالتها ورؤيتها وقيمها، وتؤثر على السلوك من خلال مواءمة الأفعال مع الغرض الأعلى والأهداف طويلة الأمد","المعتقدات هي تصورات المنظمة للمخاطر وعدم اليقين، وتؤثر على السلوك من خلال توجيه الإجراءات والضوابط لمعالجة المخاطر المرتبطة بالامتثال","المعتقدات هي أفكار وافتراضات يحملها الأفراد أو المجموعات، غالبًا ما تتشكل من التجارب والانطباعات، وتؤثر على السلوك من خلال إمداد القيم والمبادئ التي توجه الأفعال والقرارات","المعتقدات هي التزامات المنظمة بالالتزامات الإلزامية والتطوعية، وتؤثر على السلوك من خلال تحديد مدى وفاء الأفراد بالالتزامات والوعود","المعتقدات هي القوانين والسياسات المكتوبة التي يجب على الموظفين اتباعها لضمان الامتثال"],"c":2,"ch":"Key Concepts","ex":"Exam 1 - GRCP","fe":"Beliefs are mental assumptions and ideas shaped by experiences and perceptions. They influence behavior by forming the basis of values and principles that guide decision-making. The other options confuse beliefs with mission, obligations, or risk perceptions.\n\nReference\nGRC Capability Model v3.5 – p. 14–15","fa":"المعتقدات هي الأساس الفكري الذي يتشكل من التجارب والانطباعات، ويؤثر على القيم والمبادئ التي توجه القرارات والسلوكيات داخل المنظمة. باقي الخيارات تخلط بين المعتقدات وبين الرسالة أو الالتزامات أو تصور المخاطر.\n\nReference / المرجع:\nGRC Capability Model v3.5 – p. 14–15"},{"qe":"How does budgeting for regular improvement activities contribute to capability maturation?","qa":"كيف يساهم تخصيص ميزانية للأنشطة التحسينية المنتظمة في نضج القدرات؟","oe":["It increases the organization's profitability and revenue","It minimizes the risk of legal disputes and litigation","It ensures that resources are available when opportunities to improve arise","It reduces the need for external audits and assessments"],"oa":["يزيد من ربحية المنظمة وإيراداتها","يقلل من مخاطر النزاعات والدعاوى القضائية","يضمن توفر الموارد عندما تنشأ فرص للتحسين","يقلل الحاجة إلى المراجعات والتدقيقات الخارجية"],"c":2,"ch":"Review Competent","ex":"Exam 1 - GRCP","fe":"Budgeting ensures that resources are ready when opportunities for improvement arise. Without a budget, improvement efforts may be delayed or ignored. This systematic allocation helps organizations progress in their capability maturity. (Page 124–125).","fa":"إن تخصيص ميزانية يضمن توفر الموارد عند ظهور فرص للتحسين. في غياب الميزانية، قد تتأخر جهود التحسين أو يتم تجاهلها. إن هذا التخصيص المنهجي يساعد المؤسسات على التقدم في نضج القدرات. (الصفحة 124–125)."},{"qe":"Why is it important to incorporate change management activities in all improvement plans?","qa":"لماذا من المهم دمج أنشطة إدارة التغيير في جميع خطط التحسين","oe":["It increases the likelihood of successful mergers and acquisitions","It increases awareness of and acceptance of changes","It reduces the need for employee training and development","It ensures the accuracy of financial reporting and accounting"],"oa":["يزيد من احتمالية نجاح الاندماجات والاستحواذات","يزيد من الوعي وقبول التغييرات","يقلل من الحاجة إلى تدريب وتطوير الموظفين","يضمن دقة التقارير المالية والمحاسبة"],"c":1,"ch":"Review Competent","ex":"Exam 1 - GRCP","fe":"Change management builds awareness and acceptance among employees, which reduces resistance. It ensures that improvements are actually adopted and sustained. (Page 124–125).","fa":"إدارة التغيير تساعد على رفع الوعي وقبول الموظفين للتغييرات، مما يقلل المقاومة. وهذا يضمن أن التحسينات يتم تطبيقها بالفعل واستمرارها. (الصفحة 124–125)."},{"qe":"How does Benchmarking contribute to the improvement of a capability","qa":"كيف يساهم التقييم المقارن (Benchmarking) في تحسين القدرات","oe":["By evaluating the effectiveness of risk management campaigns","By comparing the capability’s performance to industry standards or best practices","By identifying potential legal and regulatory issues","By assessing the impact of organizational culture"],"oa":["من خلال تقييم فعالية حملات إدارة المخاطر","من خلال مقارنة أداء القدرات بمعايير الصناعة أو أفضل الممارسات","من خلال تحديد القضايا القانونية والتنظيمية المحتملة","من خلال تقييم أثر الثقافة التنظيمية"],"c":1,"ch":"Review Competent","ex":"Exam 1 - GRCP","fe":"Benchmarking highlights performance gaps by comparing organizational practices with industry standards, guiding targeted improvements.\n\n📖 GRC Capability Model v3.5 – Premium, p.125","fa":"التقييم المقارن يكشف الفجوات في الأداء عبر مقارنة ممارسات المؤسسة مع معايير الصناعة، مما يوجه التحسينات المستهدفة.\n\n📖 المرجع: GRC Capability Model v3.5 – Premium, p.125"},{"qe":"What is the significance of \"assurance objectivity\" in providing a higher level of assurance?","qa":"ما هي أهمية \"موضوعية التأكيد\" في تقديم مستوى أعلى من التأكيد؟","oe":["It is not relevant to the level of assurance and does not affect the assurance process","It contributes to a higher level of assurance by enhancing impartiality and credibility","It is only important for high levels of assurance in financial audits","It is determined by the governing authority and enhances the level of assurance"],"oa":["ليست ذات صلة بمستوى التأكيد ولا تؤثر على عملية التأكيد","تساهم في مستوى أعلى من التأكيد من خلال تعزيز الحياد والمصداقية","تهم فقط المستويات العالية من التأكيد في التدقيقات المالية","يتم تحديدها من قبل السلطة الحاكمة وتُعزز مستوى التأكيد"],"c":1,"ch":"Review Competent","ex":"Exam 1 - GRCP","fe":"Objectivity enhances impartiality and credibility, increasing the trustworthiness of assurance.\n\n📖 GRC Capability Model v3.5 – Premium, p.38","fa":"الموضوعية تعزز الحياد والمصداقية، مما يزيد من موثوقية التأكيد.\n\n📖 المرجع: GRC Capability Model v3.5 – Premium, p.38"},{"qe":"What is the relationship between independence and objectivity in assurance?","qa":"ما العلاقة بين الاستقلالية والموضوعية في التأكيد؟","oe":["Independence is unrelated to objectivity and has no impact on the assurance process","Independence is a means to achieve objectivity, but independence alone does not guarantee objectivity","Independence and objectivity are interchangeable terms with the same meaning in the context of assurance","Independence is a requirement for objectivity, and all assurance providers must be independent"],"oa":["الاستقلالية غير مرتبطة بالموضوعية ولا تؤثر على عملية التأكيد","الاستقلالية وسيلة لتحقيق الموضوعية، ولكن الاستقلالية وحدها لا تضمن الموضوعية","الاستقلالية والموضوعية مصطلحان مترادفان بنفس المعنى في سياق التأكيد","الاستقلالية شرط لتحقيق الموضوعية ويجب أن يكون جميع مقدمي التأكيد مستقلين"],"c":1,"ch":"Review Competent","ex":"Exam 1 - GRCP","fe":"Independence reduces conflicts of interest but does not guarantee objectivity. Objectivity requires impartiality and professional judgment.\n\n📖 GRC Capability Model v3.5 – Premium, p.40","fa":"الاستقلالية تقلل تضارب المصالح لكنها لا تضمن الموضوعية. الموضوعية تحتاج إلى الحياد والحكم المهني.\n\n📖 المرجع: GRC Capability Model v3.5 – Premium, p.40"},{"qe":"How can \"assurance competence\" contribute to the level of assurance provided?","qa":"كيف يمكن أن تسهم \"كفاءة التأكيد\" في مستوى التأكيد المقدم؟","oe":["It is solely based on the assurance provider's credentials and ensures the highest level of assurance","It is only relevant for external audits and does not apply to internal assurance activities","It is determined by the number of years the assurance provider has been in the industry and ensures high levels of assurance","A greater degree of it allows the assurance provider to use sophisticated, professional, and structured techniques to evaluate the subject matter, resulting in a higher level of assurance"],"oa":["تستند فقط إلى مؤهلات مقدم خدمة التأكيد وتضمن أعلى مستوى من التأكيد","تنطبق فقط على التدقيقات الخارجية ولا تشمل أنشطة التأكيد الداخلية","تُحدد بعدد سنوات خبرة مقدم الخدمة في المجال وتضمن مستويات عالية من التأكيد","كلما زادت درجتها، تمكن مقدم خدمة التأكيد من استخدام أساليب متطورة ومهنية وهيكلية لتقييم الموضوع، مما يؤدي إلى مستوى أعلى من التأكيد"],"c":3,"ch":"Key Concepts","ex":"Exam 1 - GRCP","fe":"Competence allows the use of professional and structured techniques, producing higher quality assurance.\n\n📖  GRC Capability Model v3.5 – Premium, p.38","fa":"الكفاءة تمكّن من استخدام أساليب مهنية وهيكلية، مما يؤدي إلى جودة أعلى في عملية التأكيد.\n\n📖 المرجع: GRC Capability Model v3.5 – Premium, p.38"},{"qe":"In the context of Total Performance, what considerations are made for resilience in the assessment of an education program?","qa":"في سياق الأداء الكلي، ما الاعتبارات التي تؤخذ في الحسبان للمرونة عند تقييم برنامج التعليم؟","oe":["The frequency of updates to the education program's curriculum","The number of employees who have completed advanced training","Contingency plans for system failure, slack in timelines, and availability of backup staff","The availability of online and offline training materials"],"oa":["تكرار تحديثات منهج البرنامج التعليمي","عدد الموظفين الذين أكملوا التدريب المتقدم","خطط الطوارئ في حال فشل النظام، وجود مرونة في الجداول الزمنية، وتوفر طاقم بديل","توفر مواد التدريب عبر الإنترنت وخارجه"],"c":2,"ch":"Perform Competent","ex":"Exam 1 - GRCP","fe":"Resilience in monitoring focuses on the ability to recover from stress or failure. It requires contingency plans, timeline flexibility, and backup staff to ensure continuity.\n\n \n\n📖GRC Capability Model v3.5 – Premium, p.121","fa":"المرونة في المراقبة تركز على القدرة على التعافي من الضغوط أو الفشل. ويتطلب ذلك وجود خطط طوارئ، ومرونة في الجداول، وطاقم بديل لضمان الاستمرارية.\n\n \n\n📖 المرجع: GRC Capability Model v3.5 – Premium, p.121"},{"qe":"What are the four aspects of Total Performance that should be considered in monitoring activities?","qa":"ما هي النواحي
