<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نظام السعيد GRC<sup>&#8482;</sup> — منظومة الحوكمة وإدارة المخاطر والامتثال</title>
<meta name="description" content="نظام متكامل لبناء منظومة GRC على نموذج القدرات: 4 مكوّنات · 20 عنصراً · 38 أداة، بمحرّك توليد ذكي داخلي وتصدير للتقارير. تصميم وبرمجة د. محمد عطية.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>
<style>:root{
  --navy:#0B2545; --navy2:#12365A; --blue:#1256A0; --blue2:#066EB5;
  --green:#9FC53D; --green2:#047857; --ice:#EFF5FA; --ice2:#CBDDF5;
  --line:#DCE4EC; --ink:#16202E; --ink2:#2B3A4D; --dim:#5A6C82; --dim2:#8A9AAE;
  --red:#B3261E; --amber:#B4690E; --paper:#F6F9FC;
  --fa:'IBM Plex Sans Arabic',system-ui,sans-serif;
  --fe:'IBM Plex Sans',system-ui,sans-serif;
  --r:12px; --r2:16px; --r3:20px;
  --sh:0 2px 8px rgba(11,37,69,.06); --sh2:0 10px 30px -12px rgba(11,37,69,.25);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--fa);background:var(--paper);color:var(--ink);direction:rtl;line-height:1.85;
  -webkit-font-smoothing:antialiased}
.en{font-family:var(--fe);direction:ltr;display:inline-block}
button{font-family:inherit;cursor:pointer;border:none;background:none}
input,select,textarea{font-family:inherit;font-size:.88rem}

/* ── الترويسة ── */
header{background:var(--navy);color:#fff;position:sticky;top:0;z-index:50;box-shadow:var(--sh2)}
.hd{max-width:1320px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,var(--green),#7EB45C);
  display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--navy);font-size:1.05rem;flex-shrink:0}
.brand b{font-size:1.05rem;display:block;line-height:1.3}
.brand span{font-size:.68rem;color:var(--ice2);font-family:var(--fe)}
.hd .sp{margin-inline-start:auto;font-size:.72rem;color:var(--dim2);text-align:end;line-height:1.6}
nav#nav{max-width:1320px;margin:0 auto;padding:0 20px 10px;display:flex;gap:6px;overflow-x:auto}
.nv{background:rgba(255,255,255,.08);color:#CFE0F0;border-radius:9px;padding:7px 13px;font-size:.76rem;
  white-space:nowrap;transition:.18s;font-weight:600}
.nv:hover{background:rgba(255,255,255,.16);color:#fff}
.nv.on{background:var(--green);color:var(--navy)}

/* ── التخطيط ── */
.wrap{max-width:1320px;margin:0 auto;padding:22px 20px 70px}
.hero{background:linear-gradient(140deg,var(--navy),var(--navy2) 60%,#081B33);border-radius:var(--r3);
  padding:30px 32px;color:#fff;margin-bottom:20px;box-shadow:var(--sh2)}
.hero.sm{padding:22px 26px}
.kick{font-family:var(--fe);font-size:.7rem;font-weight:700;color:var(--green);letter-spacing:2px;display:block;margin-bottom:8px}
.hero h1{font-size:1.75rem;font-weight:700;margin-bottom:8px}
.hero.sm h1{font-size:1.4rem}
.hero p{font-size:.9rem;color:#CFE0F0;line-height:1.95;max-width:900px}
.hero .en-sub{font-family:var(--fe);direction:ltr;text-align:right;font-size:.8rem;color:var(--dim2);margin-top:4px}

.card{background:#fff;border:1px solid var(--line);border-radius:var(--r2);margin-bottom:16px;box-shadow:var(--sh)}
.card.pad{padding:22px}
.card h3{font-size:1.05rem;color:var(--navy);margin-bottom:10px;font-weight:700}
.hint{font-size:.8rem;color:var(--dim);line-height:1.8;margin-bottom:12px}
.mt{margin-top:14px}.mb{margin-bottom:16px}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
@media(max-width:760px){.grid2{grid-template-columns:1fr}}

label{display:flex;flex-direction:column;gap:6px;font-size:.84rem;font-weight:600;color:var(--ink2);margin-bottom:12px}
label.full{grid-column:1/-1}
label span{font-weight:600}
input,select,textarea{border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;background:#FBFDFE;color:var(--ink);width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue);background:#fff}
textarea{resize:vertical;line-height:1.8}

/* ── النطاق ── */
.scope{margin-top:8px;background:var(--ice);border:1px solid var(--ice2);border-radius:var(--r);padding:16px}
.scope .lbl{font-size:.86rem;font-weight:700;color:var(--navy);margin-bottom:10px}
.scope-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.sc{background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:9px 20px;font-size:.86rem;
  font-weight:600;color:var(--dim);transition:.18s}
.sc:hover{border-color:var(--blue)}
.sc.on{background:var(--navy);border-color:var(--navy);color:#fff}

/* ── الأزرار ── */
.btn{border-radius:11px;padding:11px 22px;font-size:.88rem;font-weight:700;transition:.18s;display:inline-flex;
  align-items:center;gap:7px;justify-content:center}
.btn.sm{padding:8px 15px;font-size:.8rem}
.btn.g{background:linear-gradient(135deg,var(--green),#8AB534);color:var(--navy);box-shadow:0 4px 14px -4px rgba(159,197,61,.6)}
.btn.b{background:var(--navy);color:#fff}
.btn.o{background:#fff;border:1.5px solid var(--line);color:var(--navy)}
.btn:hover{transform:translateY(-2px)}
.act{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}

/* ── ليكرت ── */
.lk{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;
  background:#FBFDFE;border:1px solid var(--line);border-radius:11px;padding:12px 15px;margin-bottom:8px}
.lk-q{flex:1;min-width:240px;font-size:.85rem;color:var(--ink2);line-height:1.7}
.lk-q small{color:var(--dim);font-size:.76rem}
.lk-g{display:flex;gap:5px;flex-shrink:0}
.lkb{width:36px;height:34px;border-radius:9px;border:1.5px solid var(--line);background:#fff;
  font-family:var(--fe);font-weight:600;font-size:.82rem;color:var(--dim);transition:.15s;white-space:nowrap;
  min-width:max-content;padding:0 10px}
.lkb:hover{border-color:var(--blue);transform:translateY(-1px)}
.lkb.on{background:var(--navy);border-color:var(--navy);color:#fff}
.res{background:var(--ice);border:1px solid var(--ice2);border-radius:11px;padding:13px 16px;margin-top:12px;
  font-size:.88rem;color:var(--ink2)}
.res b{font-family:var(--fe);font-size:1.35rem;color:var(--navy)}
.res span{display:block;font-size:.78rem;color:var(--dim);margin-top:2px}

/* ── الذكاء ── */
.ai-card{background:linear-gradient(135deg,#EFF5FA,#E4EEF8);border-color:var(--ice2)}
.drv{display:flex;flex-direction:column;gap:8px}
.drv-i{background:#fff;border:1px solid var(--ice2);border-inline-start:3px solid var(--blue);
  border-radius:10px;padding:11px 14px;font-size:.85rem;color:var(--ink2);line-height:1.8}
.mini{background:#fff;border:1px solid var(--ice2);border-radius:11px;padding:13px}
.mini b{font-size:.82rem;color:var(--navy);display:block;margin-bottom:6px}
.mini ul{padding-inline-start:18px}
.mini li{font-size:.8rem;color:var(--dim);line-height:1.75}
.ai-bar{background:linear-gradient(135deg,#EFF5FA,#E4EEF8);border:1px solid var(--ice2);border-radius:var(--r2);
  padding:16px 20px;margin-bottom:16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.ai-bar span{font-size:.82rem;color:var(--dim);flex:1;min-width:260px;line-height:1.8}

/* ── العناصر والأدوات ── */
.el{overflow:hidden}
.el-h{display:flex;justify-content:space-between;gap:16px;padding:18px 20px;border-inline-start:5px solid var(--blue);
  background:#FBFDFE;flex-wrap:wrap}
.el-c{display:inline-block;font-family:var(--fe);font-size:.72rem;font-weight:700;color:#fff;
  padding:3px 10px;border-radius:7px;margin-bottom:6px}
.el-h h3{font-size:1.1rem;margin-bottom:4px}
.el-h p{font-size:.83rem;color:var(--dim);line-height:1.8;max-width:760px}
.el-n{text-align:center;flex-shrink:0;font-family:var(--fe);font-size:1.2rem;font-weight:600;color:var(--navy)}
.el-n span{display:block;font-family:var(--fa);font-size:.7rem;color:var(--dim);font-weight:400}
.el-out{padding:12px 20px;background:var(--ice);border-top:1px solid var(--line);font-size:.8rem;color:var(--ink2)}
.tagx{display:inline-block;background:#fff;border:1px solid var(--ice2);border-radius:8px;padding:3px 10px;
  font-size:.75rem;margin:2px;color:var(--navy)}
.tagx.ok{background:#ECFBF3;border-color:#A8E6C6;color:var(--green2)}
.tagx.no{background:#FDF6E3;border-color:#F7DFA8;color:var(--amber)}
.tools{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;padding:16px 20px}
.tool{background:#FBFDFE;border:1px solid var(--line);border-radius:var(--r);padding:15px;display:flex;
  flex-direction:column;gap:8px}
.tool.done{background:#F4FBF7;border-color:#A8E6C6}
.tool-h b{font-size:.94rem;color:var(--navy);display:block}
.tool-h .en{font-size:.72rem;color:var(--dim2)}
.tool-h .ok{font-style:normal;font-size:.72rem;color:var(--green2);font-weight:700}
.tool p{font-size:.82rem;color:var(--dim);line-height:1.75}
.tool-m{font-size:.76rem;color:var(--ink2);background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px 11px}
.tool-u{font-size:.75rem;color:var(--blue)}
.tool-u span{background:#EFF5FA;border-radius:6px;padding:2px 7px;margin:0 3px}
.tool .btn{margin-top:auto}

/* ── الجداول ── */
.tbl-w{margin-bottom:18px}
.tbl-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:10px;flex-wrap:wrap}
.tbl-h b{font-size:.9rem;color:var(--navy)}
.tbl-s{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r)}
.tbl{width:100%;border-collapse:collapse;font-size:.82rem;min-width:640px}
.tbl th{background:var(--navy);color:#fff;padding:9px 10px;text-align:start;font-size:.76rem;white-space:nowrap}
.tbl td{border-top:1px solid var(--line);padding:5px 7px;background:#fff}
.tbl tr:nth-child(even) td{background:#FBFDFE}
.tbl input,.tbl select{border:1.5px solid transparent;border-radius:7px;padding:6px 8px;font-size:.8rem;
  background:#FBFDFE;min-width:110px}
.tbl input:hover,.tbl select:hover{border-color:var(--line)}
.tbl .calc{font-family:var(--fe);color:var(--blue);font-weight:600;text-align:center}
.delrow{width:26px;height:26px;border-radius:7px;border:1px solid #FBD0D9;background:#FEF2F4;color:var(--red);font-size:.72rem}
.delrow:hover{background:var(--red);color:#fff}
.scale-w>b{display:block;font-size:.9rem;color:var(--navy);margin-bottom:10px}

.meta{display:flex;flex-direction:column;gap:8px;font-size:.83rem;color:var(--ink2)}
.meta b{color:var(--navy)}
.warn{background:#FDF6E3;border:1px solid #F7DFA8;border-radius:var(--r);padding:14px 18px;
  font-size:.85rem;color:#6B4A08;margin-bottom:16px;line-height:1.8}
.crumb{display:flex;align-items:center;gap:8px;font-size:.82rem;color:var(--dim);margin-bottom:14px}
.crumb button{color:var(--blue);font-weight:600;font-size:.82rem}

/* ── التقرير ── */
.stat{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px;text-align:center;box-shadow:var(--sh)}
.stat b{display:block;font-family:var(--fe);font-size:1.5rem;color:var(--navy);font-weight:600;line-height:1.2}
.stat span{font-size:.75rem;color:var(--dim)}
.ba{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media(max-width:760px){.ba{grid-template-columns:1fr}}
.ba-c{background:#FBFDFE;border:1px solid var(--line);border-radius:var(--r);padding:15px}
.ba-t{font-size:.9rem;font-weight:700;color:var(--navy);margin-bottom:10px}
.ba-r{display:flex;align-items:center;gap:10px;margin-bottom:8px;font-size:.82rem}
.ba-r span{width:32px;color:var(--dim)}
.ba-r b{font-family:var(--fe);width:52px;text-align:end;color:var(--navy)}
.bar{flex:1;height:10px;background:#E7EEF5;border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:6px;transition:.6s}
.ba-d{font-family:var(--fe);font-weight:700;font-size:1rem;text-align:center;margin-top:6px}
.ba-d.up{color:var(--green2)}.ba-d.dn{color:var(--red)}
.exp{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:10px}
.rep-sec{overflow:hidden}
.rep-h{padding:12px 20px;color:#fff;display:flex;justify-content:space-between;align-items:baseline}
.rep-h b{font-size:1.05rem}.rep-h span{font-family:var(--fe);font-size:.76rem;opacity:.85}
.rep-el{padding:14px 20px;border-bottom:1px solid var(--line)}
.rep-el-h{display:flex;align-items:center;gap:9px;margin-bottom:10px}
.rep-el-h b{font-size:.98rem;color:var(--navy)}
.rep-t{background:#FBFDFE;border:1px solid var(--line);border-radius:var(--r);padding:13px;margin-bottom:10px}
.rep-t-h{font-size:.88rem;font-weight:700;color:var(--navy);margin-bottom:8px}
.rep-f{font-size:.82rem;color:var(--ink2);margin-bottom:7px;line-height:1.8}
.rep-f b{color:var(--navy);display:block;font-size:.8rem}
.rep-tbl{overflow-x:auto;margin:7px 0}
.rep-tbl table{width:100%;border-collapse:collapse;font-size:.76rem;min-width:520px}
.rep-tbl th{background:var(--navy2);color:#fff;padding:6px 8px;text-align:start;white-space:nowrap}
.rep-tbl td{border:1px solid var(--line);padding:5px 8px}
.credit{text-align:center;font-size:.78rem;color:var(--dim);padding:22px;border-top:1px solid var(--line);margin-top:20px;line-height:1.9}

#toast{position:fixed;bottom:24px;inset-inline-start:24px;background:var(--navy);color:#fff;padding:13px 20px;
  border-radius:12px;font-size:.85rem;box-shadow:var(--sh2);opacity:0;transform:translateY(12px);
  transition:.3s;z-index:999;max-width:340px;line-height:1.7}
#toast.on{opacity:1;transform:translateY(0)}

@media print{
  header,nav,.act,.ai-bar,.exp,.btn{display:none!important}
  body{background:#fff}
  .card{break-inside:avoid;box-shadow:none}
}

/* ════════ وحدة الاختبارات ════════ */
.sec-t{font-size:1.05rem;color:var(--navy);margin:18px 0 12px;font-weight:700}
.ex-opt{display:flex;gap:16px;flex-wrap:wrap;align-items:center}
.inl{flex-direction:row!important;align-items:center;gap:8px;margin:0}
.inl select{width:auto;min-width:130px}
.chk{flex-direction:row!important;align-items:center;gap:7px;margin:0;font-weight:500;font-size:.83rem}
.chk input{width:16px;height:16px;accent-color:var(--blue)}
.ex-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:20px}
.ex-card{background:#fff;border:1px solid var(--line);border-top:4px solid var(--blue);border-radius:var(--r);
  padding:16px;text-align:center;box-shadow:var(--sh);display:flex;flex-direction:column;gap:5px;align-items:center}
.ex-n{width:44px;height:44px;border-radius:12px;color:#fff;display:flex;align-items:center;justify-content:center;
  font-family:var(--fe);font-size:1.15rem;font-weight:700;margin-bottom:4px}
.ex-card b{font-size:1rem;color:var(--navy)}
.ex-card .en{font-size:.72rem;color:var(--dim2)}
.ex-card small{font-size:.74rem;color:var(--dim);line-height:1.6}
.ex-best{font-style:normal;font-size:.74rem;background:#FDF6E3;color:#6B4A08;border-radius:7px;padding:3px 10px}
.ex-best.ok{background:#ECFBF3;color:var(--green2)}
.ex-card .btn{margin-top:auto;width:100%}
.ex-full{display:flex;justify-content:space-between;align-items:center;gap:18px;flex-wrap:wrap}
.ex-full b{font-size:1.05rem;color:var(--navy);display:block;margin-bottom:5px}
.ex-full p{font-size:.85rem;color:var(--dim);line-height:1.8;max-width:720px}

.ex-bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--navy);border-radius:var(--r);
  padding:12px 16px;margin-bottom:16px;color:#fff}
.ex-timer{font-family:var(--fe);font-size:1.15rem;font-weight:700;background:rgba(255,255,255,.12);
  padding:5px 14px;border-radius:9px}
.ex-prog{flex:1;min-width:120px;height:8px;background:rgba(255,255,255,.18);border-radius:5px;overflow:hidden}
.ex-prog i{display:block;height:100%;background:var(--green);transition:.4s}
.ex-cnt{font-family:var(--fe);font-size:.88rem;font-weight:600}
.ex-q-h{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.ex-q-a{display:flex;gap:7px;flex-wrap:wrap}
.ex-q-a .flag{background:#FDF6E3;border-color:var(--amber);color:#6B4A08}
.ex-stem{font-size:1.02rem;font-weight:600;color:var(--ink);line-height:1.95;margin-bottom:10px}
.ex-alt{font-size:.88rem;color:var(--dim);line-height:1.85;padding:10px 14px;background:var(--ice);
  border-radius:10px;margin-bottom:12px}
.ex-alt.hide{display:none}
.ex-opts{display:flex;flex-direction:column;gap:9px;margin-top:6px}
.ex-o{display:flex;gap:12px;align-items:center;background:#FBFDFE;border:1.5px solid var(--line);
  border-radius:12px;padding:13px 16px;text-align:start;transition:.16s;width:100%}
.ex-o:hover{border-color:var(--blue);background:#F5FAFF}
.ex-o.on{border-color:var(--navy);background:var(--ice)}
.ex-o .k{width:28px;height:28px;border-radius:8px;background:#fff;border:1.5px solid var(--line);
  display:flex;align-items:center;justify-content:center;font-family:var(--fe);font-weight:600;
  font-size:.8rem;flex-shrink:0;color:var(--dim)}
.ex-o.on .k{background:var(--navy);color:#fff;border-color:var(--navy)}
.ex-o .t{flex:1;font-size:.9rem;color:var(--ink2);line-height:1.7}
.ex-nav{display:flex;gap:10px;justify-content:space-between;margin:16px 0}
.ex-pal{display:flex;gap:6px;flex-wrap:wrap}
.pb{width:34px;height:32px;border-radius:8px;border:1.5px solid var(--line);background:#fff;
  font-family:var(--fe);font-size:.78rem;font-weight:600;color:var(--dim);transition:.15s}
.pb:hover{border-color:var(--blue)}
.pb.ans{background:var(--ice);border-color:var(--ice2);color:var(--navy)}
.pb.cur{background:var(--navy);color:#fff;border-color:var(--navy)}
.pb.fl{border-color:var(--amber);border-width:2px}
.ai-out{background:linear-gradient(135deg,#EFF5FA,#E4EEF8);border:1px solid var(--ice2);
  border-inline-start:3px solid var(--blue);border-radius:12px;padding:14px 17px;margin-top:14px}
.ai-out b{color:var(--blue);font-size:.88rem}
.ai-out p{font-size:.85rem;color:var(--ink2);line-height:1.9;margin-top:5px}
.ai-hint{font-size:.83rem;color:var(--green2);margin-top:8px}

.ex-res{display:flex;gap:24px;align-items:center;flex-wrap:wrap;border-radius:var(--r3);padding:28px 32px;
  margin-bottom:18px;box-shadow:var(--sh2)}
.ex-res.pass{background:linear-gradient(140deg,#065F46,#047857)}
.ex-res.fail{background:linear-gradient(140deg,#7A1F17,#B3261E)}
.ex-score{text-align:center;flex-shrink:0;color:#fff}
.ex-score b{display:block;font-family:var(--fe);font-size:3.2rem;line-height:1;font-weight:700}
.ex-score span{font-size:.85rem;opacity:.85}
.ex-verdict{flex:1;min-width:260px;color:#fff}
.ex-verdict h2{font-size:1.35rem;margin-bottom:6px}
.ex-verdict p{font-size:.9rem;opacity:.92;line-height:1.85}
.ex-meta{font-size:.8rem;opacity:.8;margin-top:8px}
.ex-filt{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}
.fb{background:#fff;border:1.5px solid var(--line);border-radius:9px;padding:7px 14px;font-size:.8rem;
  font-weight:600;color:var(--dim);transition:.15s}
.fb:hover{border-color:var(--blue)}
.fb.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.rv{border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px;background:#FBFDFE}
.rv.ok{border-inline-start:4px solid var(--green2)}
.rv.no{border-inline-start:4px solid var(--red)}
.rv.sk{border-inline-start:4px solid var(--dim2)}
.rv-h{display:flex;gap:9px;align-items:center;margin-bottom:9px;flex-wrap:wrap}
.rv-n{width:26px;height:26px;border-radius:7px;background:var(--navy);color:#fff;display:flex;
  align-items:center;justify-content:center;font-family:var(--fe);font-size:.76rem}
.rv-h i{font-style:normal;font-size:.78rem;font-weight:700;color:var(--dim)}
.rv.ok .rv-h i{color:var(--green2)} .rv.no .rv-h i{color:var(--red)}
.rv-q{font-size:.9rem;font-weight:600;color:var(--ink);line-height:1.8;margin-bottom:8px}
.rv-o{font-size:.84rem;color:var(--dim);padding:6px 11px;border-radius:8px;margin-bottom:4px;line-height:1.7}
.rv-o.c{background:#ECFBF3;color:#065F46;font-weight:600}
.rv-o.w{background:#FDECEA;color:#7A1F17}
.rv-f{font-size:.83rem;color:var(--ink2);background:#fff;border:1px solid var(--line);border-radius:9px;
  padding:10px 13px;margin-top:8px;line-height:1.85}
.rv-f b{color:var(--navy);display:block;margin-bottom:3px}
.pillx{display:inline-block;font-size:.72rem;padding:3px 10px;border-radius:8px;background:var(--ice);
  border:1px solid var(--ice2);color:var(--navy);font-weight:600}
.pillx.ok{background:#ECFBF3;border-color:#A8E6C6;color:var(--green2)}
.pillx.no{background:#FDECEA;border-color:#FBD0D9;color:var(--red)}


/* ════════ علامة ™ بمحاذاة صحيحة ════════ */
sup{font-size:.62em;line-height:0;vertical-align:super;font-family:var(--fe)}
.tm{direction:ltr;display:inline-block;unicode-bidi:isolate}

/* ════════ ترجمة الخيارات وكشف الإجابة ════════ */
.o-alt{display:block;font-style:normal;font-size:.8rem;color:var(--dim);margin-top:5px;
  padding-top:5px;border-top:1px dashed var(--line);line-height:1.7}
.ex-o.rc{border-color:var(--green2);background:#ECFBF3}
.ex-o.rc .k{background:var(--green2);color:#fff;border-color:var(--green2)}
.ex-o.rc .t{color:#065F46;font-weight:600}
.ex-o.rw{border-color:var(--red);background:#FDECEA}
.ex-o.rw .k{background:var(--red);color:#fff;border-color:var(--red)}
.ex-o.rw .t{color:#7A1F17}
.ex-rev{background:#ECFBF3;border:1px solid #A8E6C6;border-inline-start:4px solid var(--green2);
  border-radius:12px;padding:14px 17px;margin-top:14px;font-size:.9rem;color:#065F46;line-height:1.85}
.ex-rev b{color:var(--green2)}
.ex-rev-f{font-size:.83rem;color:var(--ink2);margin-top:8px;padding-top:8px;border-top:1px solid #A8E6C6;line-height:1.85}

/* ════════ حماية الأسئلة من النسخ والطباعة ════════ */
.ex-q,.ex-opts,.ex-stem,.ex-alt,.rv,.ex-rev,.ai-out{
  -webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none;
  -webkit-touch-callout:none}
@media print{
  body.exam-mode>*{visibility:hidden!important}
  body.exam-mode #certBox,body.exam-mode #certBox *{visibility:visible!important}
  body.exam-mode.no-cert::after{
    content:attr(data-pmsg);visibility:visible!important;position:fixed;inset:0;display:flex;
    align-items:center;justify-content:center;text-align:center;padding:60px;font-size:15px;
    line-height:2.2;color:#0B2545;font-family:'IBM Plex Sans Arabic',sans-serif}
}

/* ════════ الشهادة ════════ */
.cert{background:linear-gradient(135deg,#0B2545,#12365A 55%,#0B2545);border-radius:var(--r3);
  padding:16px;box-shadow:var(--sh2)}
.cert-in{background:linear-gradient(#fff,#FDFEFF);border-radius:var(--r2);padding:42px 50px 34px;
  text-align:center;border:2px solid #C9A227;position:relative;overflow:hidden;font-family:var(--fe)}
.cert-in::before{content:'';position:absolute;inset:9px;border:1px solid #E3CE86;border-radius:12px;pointer-events:none}
.cert-guilloche{position:absolute;inset:0;pointer-events:none;opacity:.05;
  background:repeating-linear-gradient(45deg,#C9A227 0 2px,transparent 2px 14px),
             repeating-linear-gradient(-45deg,#0B2545 0 2px,transparent 2px 14px)}
.cert-top{display:flex;align-items:center;justify-content:center;gap:13px;margin-bottom:22px;position:relative}
.cert-logo{width:46px;height:46px;border-radius:12px;background:linear-gradient(135deg,var(--green),#7EB45C);
  color:var(--navy);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.88rem}
.cert-org{text-align:left}
.cert-org b{display:block;font-size:1.02rem;color:var(--navy)}
.cert-org span{font-size:.72rem;color:var(--dim)}
.cert-t{font-size:2.1rem;font-weight:700;color:var(--navy);letter-spacing:.5px;position:relative}
.cert-rule{width:150px;height:2px;background:linear-gradient(90deg,transparent,#C9A227,transparent);
  margin:8px auto 14px}
.cert-sub{font-size:.9rem;color:var(--dim);font-style:italic;margin-bottom:10px}
.cert-name{font-size:2.15rem;font-weight:700;color:var(--blue);padding:6px 30px 12px;
  border-bottom:2px solid #C9A227;display:inline-block;margin-bottom:20px;min-width:360px;position:relative}
.cert-body{font-size:.94rem;color:var(--ink2);line-height:2.05;max-width:680px;margin:0 auto 24px;position:relative}
.cert-row{display:flex;justify-content:center;gap:34px;flex-wrap:wrap;margin-bottom:26px;position:relative}
.cert-row div{text-align:center}
.cert-row span{display:block;font-size:.68rem;color:var(--dim);text-transform:uppercase;letter-spacing:1px}
.cert-row b{font-size:.9rem;color:var(--navy)}
.cert-sig{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;
  margin-top:14px;position:relative;flex-wrap:wrap}
.sig{text-align:center;flex:1;min-width:190px}
.sig-mark{font-family:'Segoe Script','Brush Script MT',cursive;font-size:1.5rem;color:#1A3A6B;
  transform:rotate(-3deg);margin-bottom:-4px;height:34px}
.sig .line{border-top:1.5px solid var(--ink2);margin-bottom:6px}
.sig b{display:block;font-size:.88rem;color:var(--navy)}
.sig span{display:block;font-size:.7rem;color:var(--dim);line-height:1.6}
.seal{width:104px;height:104px;border-radius:50%;flex-shrink:0;
  background:conic-gradient(#E9CF7A,#C9A227,#F3E3A8,#C9A227,#E9CF7A);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 14px -4px rgba(201,162,39,.75);transform:rotate(-8deg)}
.seal-in{width:88px;height:88px;border-radius:50%;background:#FFFBEF;border:2px dashed #C9A227;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.seal-top{font-size:.54rem;letter-spacing:1.6px;color:#8A6D12;font-weight:700}
.seal-mid{font-size:.92rem;font-weight:700;color:#0B2545}
.seal-bot{font-size:.48rem;letter-spacing:.8px;color:#8A6D12}
.cert-foot{margin-top:22px;padding-top:12px;border-top:1px solid #EEE3C0;font-size:.68rem;
  color:var(--dim2);position:relative}
@media print{
  .cert{box-shadow:none;padding:0}
  .act,header,nav{display:none!important}
  .cert-in{border-color:#C9A227}
}

/* ════════ قفل الإجابة ════════ */
.ex-o.lk{cursor:default;opacity:.96}
.ex-o.lk:hover{border-color:var(--line);background:#FBFDFE;transform:none}
.ex-o.on.lk:hover,.ex-o.rc.lk:hover,.ex-o.rw.lk:hover{border-color:inherit;background:inherit}
.ex-lock{background:var(--ice);border:1px solid var(--ice2);border-radius:10px;padding:10px 14px;
  margin-top:12px;font-size:.82rem;color:var(--navy)}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none!important}

/* ════════ تحليل الأداء ════════ */
.an-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:16px}
.an-col{border-radius:12px;padding:14px;border:1px solid var(--line);background:#FBFDFE}
.an-col.ok{background:#ECFBF3;border-color:#A8E6C6}
.an-col.mid{background:#FDF6E3;border-color:#F7DFA8}
.an-col.no{background:#FDECEA;border-color:#FBD0D9}
.an-col>b{display:block;font-size:.88rem;margin-bottom:9px;color:var(--navy)}
.an-i{display:flex;justify-content:space-between;align-items:center;background:#fff;border-radius:8px;
  padding:7px 11px;margin-bottom:5px;font-size:.83rem;color:var(--ink2)}
.an-i i{font-style:normal;font-family:var(--fe);font-weight:700;color:var(--navy)}
.an-e{font-size:.79rem;color:var(--dim);line-height:1.7}
.an-focus{background:var(--navy);border-radius:14px;padding:18px 20px;color:#fff}
.an-focus>b{display:block;font-size:.95rem;color:var(--green);margin-bottom:12px}
.an-f{display:flex;gap:12px;align-items:flex-start;background:rgba(255,255,255,.07);border-radius:11px;
  padding:12px 14px;margin-bottom:8px}
.an-r{width:28px;height:28px;border-radius:9px;background:var(--green);color:var(--navy);flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-family:var(--fe);font-weight:700;font-size:.82rem}
.an-fb{flex:1}
.an-ft{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:5px}
.an-ft b{font-size:.92rem;color:#fff}
.an-ft em{font-style:normal;font-size:.75rem;color:var(--ice2)}
.an-fb p{font-size:.83rem;color:#CFE0F0;line-height:1.85}
.pillx.mid{background:#FDF6E3;border-color:#F7DFA8;color:#6B4A08}
.an-perfect{background:#ECFBF3;border:1px solid #A8E6C6;border-radius:12px;padding:16px;text-align:center;
  font-size:.95rem;font-weight:600;color:#065F46}

/* ════════ مساحات العمل ════════ */
.ws-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.ws-use{display:inline-block;background:#fff;border:1px solid var(--line);border-radius:8px;padding:3px 10px;
  font-size:.75rem;color:var(--dim);margin-inline-start:8px;font-family:var(--fe)}
.ws-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.ws-c{background:#FBFDFE;border:1.5px solid var(--line);border-radius:var(--r);padding:15px}
.ws-c.on{border-color:var(--green);background:#F7FCF0}
.ws-t{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:5px}
.ws-t b{font-size:.95rem;color:var(--navy)}
.ws-t i{font-style:normal;font-size:.7rem;background:var(--green);color:var(--navy);border-radius:6px;padding:2px 8px;font-weight:700}
.ws-m{font-size:.75rem;color:var(--dim);margin-bottom:8px}
.ws-b{height:7px;background:#E7EEF5;border-radius:5px;overflow:hidden;margin-bottom:5px}
.ws-b i{display:block;height:100%;background:var(--blue);border-radius:5px}
.ws-p{font-size:.75rem;color:var(--dim);margin-bottom:10px;font-family:var(--fe)}
.ws-a{display:flex;gap:7px;flex-wrap:wrap}
#savedDot{display:inline-flex;align-items:center;gap:5px;font-size:.7rem;color:var(--dim2);opacity:0;transition:.3s}
#savedDot.on{opacity:1;color:var(--green)}

/* ════════ فاحص التناقضات ════════ */
.chk-c{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:10px;
  box-shadow:var(--sh)}
.chk-c.high{border-inline-start:4px solid #B3261E}
.chk-c.med{border-inline-start:4px solid #B4690E}
.chk-c.low{border-inline-start:4px solid #1256A0}
.chk-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.chk-el{font-family:var(--fe);font-size:.72rem;font-weight:700;background:var(--navy);color:#fff;
  border-radius:7px;padding:3px 9px}
.chk-h b{font-size:.96rem;color:var(--navy);flex:1;min-width:200px}
.chk-d{font-size:.85rem;color:var(--ink2);line-height:1.9;margin-bottom:10px}
.chk-f{background:#FBFDFE;border:1px solid var(--line);border-radius:10px;padding:11px 14px;
  font-size:.83rem;color:var(--ink2);display:flex;justify-content:space-between;align-items:center;
  gap:12px;flex-wrap:wrap;line-height:1.8}
.chk-f b{color:var(--green2)}
.chk-clean{background:#ECFBF3;border:1px solid #A8E6C6;border-radius:var(--r2);padding:30px;text-align:center}
.chk-clean b{font-size:1.2rem;color:#065F46;display:block;margin-bottom:8px}
.chk-clean p{font-size:.88rem;color:#2F4A12;line-height:1.9}

/* ════════ التقييم لكل مكوّن ════════ */
.cmp-a{overflow:hidden}
.cmp-h{display:flex;align-items:center;gap:12px;padding:13px 20px;color:#fff;flex-wrap:wrap}
.cmp-h b{font-size:1.05rem}
.cmp-h span{font-size:.76rem;opacity:.9;font-family:var(--fe)}
.cmp-h i{margin-inline-start:auto;font-style:normal;font-size:.82rem;background:rgba(255,255,255,.18);
  border-radius:8px;padding:4px 12px;font-weight:600}
.cmp-sec{font-size:.86rem;font-weight:700;color:var(--navy);margin:12px 0 8px;padding-inline-start:9px;
  border-inline-start:3px solid var(--green)}
.sc em{display:block;font-style:normal;font-size:.68rem;opacity:.7;font-family:var(--fe)}

/* ════════ الاعتماد والتوقيع ════════ */
.apv{margin:0 20px 14px;background:#FBFDFE;border:1px solid var(--line);border-radius:var(--r);padding:13px}
.apv.ok{background:#F4FBF7;border-color:#A8E6C6}
.apv-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.apv-h b{font-size:.9rem;color:var(--navy)}
.apv-h .btn{margin-inline-start:auto}
.apv-h .btn+.btn{margin-inline-start:0}
.apv-b{margin-top:12px}
.apv-b.hide{display:none}
.apv-a{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:10px}

/* ════════ الممارسات ════════ */
.prc{margin:0 20px 12px;background:#FFF9EC;border:1px solid #F0DFB8;border-radius:var(--r);padding:13px}
.prc-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.prc-h b{font-size:.9rem;color:#7A5A12}
.prc-h .btn{margin-inline-start:auto}
.prc-b{margin-top:11px;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:7px}
.prc-b.hide{display:none}
.prc-i{flex-direction:row!important;align-items:flex-start;gap:9px;background:#fff;border:1px solid #F0DFB8;
  border-radius:9px;padding:9px 11px;margin:0;cursor:pointer;font-weight:400}
.prc-i.on{background:#ECFBF3;border-color:#A8E6C6}
.prc-i input{width:16px;height:16px;margin-top:3px;accent-color:#047857;flex-shrink:0}
.prc-i b{display:block;font-size:.83rem;color:var(--navy)}
.prc-i em{font-style:normal;font-size:.7rem;color:var(--dim2)}

/* ════════ التوقيع الإلكتروني ════════ */
.es-box{max-width:680px}
.es-tabs{display:flex;gap:7px;margin-bottom:12px}
.es-t{background:#fff;border:1.5px solid var(--line);border-radius:9px;padding:8px 16px;font-size:.83rem;
  font-weight:600;color:var(--dim)}
.es-t.on{background:var(--navy);color:#fff;border-color:var(--navy)}
#esCanvas{width:100%;height:180px;border:2px dashed var(--ice2);border-radius:12px;background:#FBFDFE;
  cursor:crosshair;touch-action:none}
.es-hint{font-size:.76rem;color:var(--dim);text-align:center;margin-top:6px}
.es-prev{font-family:'Segoe Script','Brush Script MT',cursive;font-size:1.9rem;color:#12365A;
  min-height:64px;display:flex;align-items:center;justify-content:center;border:2px dashed var(--ice2);
  border-radius:12px;margin-top:9px;background:#FBFDFE}
.es-cell{min-width:190px}
.es-card{display:flex;align-items:center;gap:9px;background:#FBFDFE;border:1px solid var(--line);
  border-radius:9px;padding:6px 9px;margin-bottom:5px}
.es-card img{height:38px;max-width:110px;object-fit:contain}
.es-script{font-family:'Segoe Script','Brush Script MT',cursive;font-size:1.1rem;color:#12365A}
.es-meta b{display:block;font-size:.78rem;color:var(--navy)}
.es-meta span{font-size:.7rem;color:var(--dim)}
.es-meta small{display:block;font-size:.64rem;color:var(--dim2);font-family:var(--fe)}
.es-none{font-size:.75rem;color:var(--dim2)}

/* ════════ السجلات التفصيلية ════════ */
.reg-tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.rt{background:#fff;border:1.5px solid var(--line);border-radius:11px;padding:11px 20px;font-size:.9rem;
  font-weight:700;color:var(--dim);display:flex;align-items:center;gap:8px}
.rt.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.rt i{font-style:normal;font-family:var(--fe);font-size:.74rem;background:var(--ice);color:var(--navy);
  border-radius:7px;padding:2px 8px}
.rt.on i{background:var(--green);color:var(--navy)}
.reg-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.reg-bar input{max-width:230px}
.reg-wrap{overflow:auto;max-height:70vh;border:1px solid var(--line);border-radius:var(--r)}
.reg-t{border-collapse:collapse;font-size:.74rem;white-space:nowrap}
.reg-t th{background:var(--navy);color:#fff;padding:7px 8px;position:sticky;top:0;z-index:2;text-align:start}
.reg-t tr.rg th{background:var(--navy2);top:0;z-index:3;text-align:center;border-inline:1px solid #24455F}
.reg-t thead tr:nth-child(2) th{top:29px}
.reg-t td{border:1px solid var(--line);padding:5px 8px;background:#fff;max-width:230px;overflow:hidden;
  text-overflow:ellipsis}
.reg-t tr:nth-child(even) td{background:#FBFDFE}
.rc-n{background:var(--ice)!important;font-weight:700;text-align:center}
.rc-c{text-align:center;font-family:var(--fe)}
.rc-m{white-space:normal;min-width:150px}
.rc-a{white-space:nowrap;background:#F4F7FB!important}
.ra{width:24px;height:24px;border-radius:6px;border:1px solid var(--line);background:#fff;font-size:.72rem;margin:0 1px}
.ra.e:hover{background:var(--blue);color:#fff;border-color:var(--blue)}
.ra.c:hover{background:var(--green2);color:#fff;border-color:var(--green2)}
.ra.d:hover{background:var(--red);color:#fff;border-color:var(--red)}
.reg-leg{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}
.rl{font-size:.75rem;border:1px solid;border-radius:8px;padding:4px 11px;font-weight:600}
.reg-ed{max-width:920px}
.reg-g{margin-bottom:14px}
.reg-gh{font-size:.86rem;font-weight:700;color:var(--navy);background:var(--ice);border-inline-start:3px solid var(--blue);
  border-radius:0 8px 8px 0;padding:7px 12px;margin-bottom:9px}
.reg-gf{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.reg-gf label.full{grid-column:1/-1}
.rmulti{display:flex;gap:7px;flex-wrap:wrap}
.rmi{flex-direction:row!important;align-items:center;gap:5px;background:#FBFDFE;border:1px solid var(--line);
  border-radius:8px;padding:5px 10px;margin:0;font-size:.78rem;font-weight:500;cursor:pointer}
.rmi input{width:14px;height:14px;accent-color:var(--blue)}
.reg-live{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--navy);border-radius:12px;
  padding:13px 17px;margin-top:8px}
.rlv{text-align:center;color:#fff}
.rlv span{display:block;font-size:.7rem;color:var(--ice2)}
.rlv b{display:block;font-family:var(--fe);font-size:1.5rem;line-height:1.2}
.rlv i{font-style:normal;font-size:.78rem;font-weight:700}
.rlv em{display:block;font-style:normal;font-size:.68rem;color:var(--ice2)}
.rlv-a{color:var(--green);font-size:1.2rem}

/* الحوافز */
.inc-2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;margin-top:12px}
.inc-c{background:#FBFDFE;border:1px solid var(--line);border-top:4px solid var(--blue);border-radius:var(--r);padding:14px}
.inc-c b{font-size:1rem}
.inc-c em{font-style:normal;font-size:.72rem;color:var(--dim2);margin-inline-start:6px}
.inc-c p{font-size:.8rem;color:var(--ink2);line-height:1.7;margin:6px 0}
.inc-c ul{padding-inline-start:16px}
.inc-c li{font-size:.78rem;color:var(--ink2);line-height:1.75}
.inc-r{background:#FDF6E3;border:1px solid #F7DFA8;border-radius:8px;padding:9px 12px;
  font-size:.76rem;color:#6B4A08;line-height:1.65;margin-top:9px}

/* ════════ لوحة المؤشرات ════════ */
.dk{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:16px}
.dk-c{background:#fff;border:1px solid var(--line);border-radius:var(--r2);padding:16px;text-align:center;
  box-shadow:var(--sh)}
.dk-c b{display:block;font-size:.92rem;color:var(--navy);margin-top:6px}
.dk-c span{font-size:.74rem;color:var(--dim)}
.dn{width:118px;height:118px}
.dn-v{font-family:var(--fe);font-size:20px;font-weight:700}
.dn-s{font-family:var(--fa);font-size:9px;fill:#8A9AAE}
.dg2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
@media(max-width:900px){.dg2{grid-template-columns:1fr}}
.dg-row{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.bx{width:150px;height:auto;flex-shrink:0}
.bx-v{font-family:var(--fe);font-size:9px;font-weight:700;fill:#16202E}
.bx-l{font-family:var(--fa);font-size:8px;fill:#5A6C82}
.dg-s{flex:1;min-width:150px}
.ds-i{background:#FBFDFE;border:1px solid var(--line);border-radius:9px;padding:8px 11px;margin-bottom:6px}
.ds-i b{font-family:var(--fe);font-size:1rem;color:var(--navy)}
.ds-i span{display:block;font-size:.74rem;color:var(--dim);line-height:1.5}
.ds-i em{display:block;font-style:normal;font-size:.7rem;color:var(--green2);margin-top:2px}
.ds-w{display:block;font-style:normal;font-size:.74rem;color:var(--red);background:#FDECEA;
  border-radius:8px;padding:7px 10px;line-height:1.5}
.hb{display:flex;align-items:center;gap:9px;margin-bottom:6px}
.hb-l{font-size:.76rem;color:var(--dim);min-width:56px;flex-shrink:0}
.hb-t{flex:1;height:9px;background:#E7EEF5;border-radius:5px;overflow:hidden}
.hb-t i{display:block;height:100%;border-radius:5px;transition:.5s}
.hb-v{font-family:var(--fe);font-size:.76rem;color:var(--navy);min-width:52px;text-align:end;flex-shrink:0}
.ba2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:560px){.ba2{grid-template-columns:1fr}}
.ba2-c{background:#FBFDFE;border:1px solid var(--line);border-radius:11px;padding:12px}
.ba2-c>span{display:block;font-size:.85rem;font-weight:700;color:var(--navy);margin-bottom:8px}
.rdr{width:200px;height:200px;display:block;margin:0 auto}
.rd-l{font-family:var(--fa);font-size:8.5px;fill:#5A6C82}
.rd-leg{display:flex;gap:12px;justify-content:center;margin-top:4px}
.rl2{font-size:.74rem;color:var(--dim);display:flex;align-items:center;gap:5px}
.rl2 i{width:10px;height:10px;border-radius:3px;display:inline-block}
.rd-v{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:8px}
.rd-v span{font-size:.74rem;color:var(--dim);background:var(--ice);border-radius:7px;padding:3px 9px}
.rd-v b{font-family:var(--fe);color:var(--navy)}
.cmp-g{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:11px}
.cmp-k{background:#FBFDFE;border:1px solid var(--line);border-top:4px solid var(--blue);
  border-radius:var(--r);padding:12px}
.cmp-kh{margin-bottom:8px}
.cmp-kh b{font-size:.95rem}
.cmp-kh em{display:block;font-style:normal;font-size:.68rem;color:var(--dim2)}
.rdist{display:flex;height:26px;border-radius:8px;overflow:hidden;margin-top:12px;gap:2px}
.rd-b{flex:1;display:flex;align-items:center;justify-content:center;min-width:26px}
.rd-b span{color:#fff;font-family:var(--fe);font-size:.74rem;font-weight:700}
.rd-lg{display:flex;gap:9px;flex-wrap:wrap;margin-top:6px;font-size:.7rem}
.cul-h{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.cul-v{font-size:.95rem;font-weight:700;color:var(--navy)}
.cul-items{max-height:190px;overflow-y:auto}
.cul-items .hb-l{min-width:auto;flex:1;font-size:.73rem}
.adv-mini{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:560px){.adv-mini{grid-template-columns:1fr}}
.am-c{border-radius:12px;padding:14px 18px;color:#fff}
.am-c.loss{background:linear-gradient(140deg,#7A1F17,#B3261E)}
.am-c.save{background:linear-gradient(140deg,#065F46,#047857)}
.am-c span{font-size:.78rem;opacity:.9}
.am-c b{display:block;font-family:var(--fe);font-size:1.8rem;font-weight:700;line-height:1.2}
.am-c em{font-style:normal;font-size:.74rem;opacity:.85}
.am-b{grid-column:1/-1;display:flex;height:30px;border-radius:9px;overflow:hidden;gap:2px}
.amb{display:flex;align-items:center;justify-content:center;min-width:34px}
.amb span{color:#fff;font-family:var(--fe);font-size:.76rem;font-weight:700}
.am-l{grid-column:1/-1;display:flex;gap:12px;flex-wrap:wrap;font-size:.74rem}

/* ════════ اختيار صيغة الإرسال ════════ */
.fmt{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:12px 0}
.fmt-c{background:#FBFDFE;border:1.5px solid var(--line);border-radius:11px;padding:13px;text-align:start;transition:.18s}
.fmt-c:hover{border-color:var(--blue);background:#F5FAFF;transform:translateY(-2px)}
.fmt-c b{display:block;font-size:.92rem;color:var(--navy)}
.fmt-c span{font-size:.74rem;color:var(--dim);line-height:1.5}

/* ════════ شريط تنقّل متسلسل ════════ */
.nv-g{font-size:.68rem;color:var(--dim2);align-self:center;padding:0 4px;white-space:nowrap;font-weight:700}
.nv-sep{color:rgba(255,255,255,.25);align-self:center;padding:0 3px}
.nv-row{align-items:center}
.back-bar{background:#fff;border:1px solid var(--line);border-radius:11px;padding:9px 14px;
  margin-bottom:12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.back-bar b{font-size:.85rem;color:var(--navy)}
.back-bar span{font-size:.78rem;color:var(--dim)}
.back-bar .btn{margin-inline-start:auto}

/* ════════ الشاشة الرئيسة ════════ */
.home{max-width:1000px;padding-top:40px}
.hm-hero{text-align:center;margin-bottom:34px}
.hm-logo{width:74px;height:74px;border-radius:20px;background:linear-gradient(135deg,var(--green),#7EB45C);
  color:var(--navy);display:flex;align-items:center;justify-content:center;font-weight:700;
  font-size:1.4rem;margin:0 auto 16px;box-shadow:0 8px 24px -8px rgba(159,197,61,.6)}
.hm-hero h1{font-size:2.1rem;color:var(--navy);font-weight:700;margin-bottom:10px}
.hm-hero p{font-size:1rem;color:var(--dim);line-height:2;max-width:640px;margin:0 auto 14px}
.hm-cr{font-size:.78rem;color:var(--dim2)}
.hm-two{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media(max-width:760px){.hm-two{grid-template-columns:1fr}}
.hm-c{background:#fff;border:2px solid var(--line);border-radius:var(--r3);padding:30px 26px;
  text-align:center;transition:.22s;box-shadow:var(--sh)}
.hm-c:hover{transform:translateY(-4px);box-shadow:var(--sh2)}
.hm-c.sys:hover{border-color:var(--blue)}
.hm-c.exam:hover{border-color:var(--green)}
.hm-i{font-size:2.6rem;margin-bottom:10px}
.hm-c b{display:block;font-size:1.4rem;color:var(--navy);margin-bottom:9px}
.hm-c span{display:block;font-size:.88rem;color:var(--dim);line-height:1.95;margin-bottom:16px}
.hm-c i{font-style:normal;display:inline-block;font-size:.86rem;font-weight:700;
  background:var(--navy);color:#fff;border-radius:10px;padding:9px 20px}
.hm-c.exam i{background:var(--green);color:var(--navy)}
.hm-quick{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center;margin-top:26px}
.hm-quick>span{font-size:.8rem;color:var(--dim)}
.sw.hm{padding:9px 14px;font-size:1.05rem}

/* ════════ بوابة المكوّن ════════ */
.locked{background:#fff;border:2px dashed var(--ice2);border-radius:var(--r3);padding:44px;text-align:center;
  max-width:640px;margin:40px auto}
.lk-i{font-size:3rem;margin-bottom:12px}
.locked h2{font-size:1.35rem;color:var(--navy);margin-bottom:10px}
.locked p{font-size:.92rem;color:var(--dim);line-height:2;margin-bottom:18px}
.locked .act{justify-content:center}
.nv.lk{opacity:.5}
.nv.dn{background:rgba(159,197,61,.22);color:#DFF0B8}
.feeds{background:var(--ice);border:1px solid var(--ice2);border-radius:11px;padding:13px 16px;margin-top:14px}
.feeds>b{display:block;font-size:.86rem;color:var(--navy);margin-bottom:7px}
.fd{background:#fff;border-radius:8px;padding:8px 11px;margin-bottom:5px;font-size:.8rem;color:var(--ink2);line-height:1.7}
.gate-ok{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:#ECFBF3;
  border:1px solid #A8E6C6;border-radius:12px;padding:14px 17px}
.go-t b{display:block;font-size:.95rem;color:#065F46}
.go-t span{font-size:.78rem;color:#2F4A12}
.gate-ok .btn{margin-inline-start:auto}

/* ════════ العلامة المائية وحجب الالتقاط ════════ */
.ex-q,.ex-filt{position:relative}
.wm{position:absolute;inset:0;pointer-events:none;z-index:3;background-repeat:repeat;
  background-position:0 0;opacity:1}
body.veiled .ex-q,body.veiled .ex-opts,body.veiled .rv,body.veiled .ex-stem,
body.veiled #revList,body.veiled .ex-rev,body.veiled .ai-out{filter:blur(16px);transition:filter .05s}
body.veiled .ex-q,body.veiled #revList{position:relative}
body.veiled .ex-q::after{content:'⚠️ المحتوى محجوب — عُد للنافذة لمتابعة الاختبار';
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,.92);border-radius:var(--r2);font-size:1rem;font-weight:700;
  color:var(--navy);filter:none;z-index:9}
.wm-note{background:#FDF6E3;border:1px solid #F7DFA8;border-inline-start:4px solid var(--amber);
  border-radius:10px;padding:12px 16px;font-size:.82rem;color:#6B4A08;line-height:1.85;margin-bottom:14px}
.wm-note b{display:inline-block;background:#fff;border:1px solid #F0DFB8;border-radius:7px;
  padding:3px 11px;margin-top:6px;color:var(--navy);font-family:var(--fe)}

/* ════════ اختيار مستوى النضج ════════ */
.mat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:9px;margin-bottom:12px}
.mat-c{background:#FBFDFE;border:1.5px solid var(--line);border-radius:var(--r);padding:13px;
  text-align:start;transition:.18s}
.mat-c:hover{border-color:var(--blue);transform:translateY(-2px)}
.mat-c.on{background:var(--navy);border-color:var(--navy)}
.mat-c b{display:block;font-family:var(--fe);font-size:1.5rem;color:var(--blue);line-height:1}
.mat-c.on b{color:var(--green)}
.mat-c span{display:block;font-size:.92rem;font-weight:700;color:var(--navy);margin-top:3px}
.mat-c.on span{color:#fff}
.mat-c em{font-style:normal;font-size:.68rem;color:var(--dim2)}
.mat-c p{font-size:.75rem;color:var(--ink2);line-height:1.6;margin-top:5px}
.mat-c.on p,.mat-c.on em{color:var(--ice2)}

/* ════════ اقتراح المستشار داخل المكوّن ════════ */
.advc{background:linear-gradient(135deg,#EFF5FA,#E4EEF8);border:1px solid var(--ice2);
  border-radius:var(--r2);padding:16px 18px;margin-bottom:16px}
.advc-h b{display:block;font-size:.98rem;color:var(--navy)}
.advc-h span{font-size:.78rem;color:var(--dim)}
.advc-g{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:10px;margin-top:12px}
.ac{background:#fff;border:1px solid var(--line);border-inline-start:3px solid var(--blue);
  border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:6px}
.ac.high{border-inline-start-color:var(--red)}
.ac.mid{border-inline-start-color:var(--amber)}
.ac b{font-size:.88rem;color:var(--navy)}
.ac p{font-size:.77rem;color:var(--ink2);line-height:1.65;flex:1}
.ac .btn{align-self:flex-start;padding:6px 13px}

/* ════════ تنبيه الاعتماد اللطيف ════════ */
.ghint{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:#FFF9EC;
  border:1px solid #F0DFB8;border-radius:var(--r);padding:12px 16px;margin-bottom:14px}
.ghint>span{font-size:1.2rem}
.ghint div{flex:1;min-width:230px}
.ghint b{display:block;font-size:.88rem;color:#7A5A12}
.ghint p{font-size:.79rem;color:#6B4A08;line-height:1.7}
.ghint .btn{margin-inline-start:auto}

/* ════════ الجدوى والنطاق ════════ */
.sco-g{display:grid;grid-template-columns:repeat(auto-fit,minmax(195px,1fr));gap:11px;margin-top:12px}
.sco{background:#FBFDFE;border:1.5px solid var(--line);border-radius:var(--r);padding:15px;
  text-align:center;transition:.18s}
.sco:hover{border-color:var(--blue);transform:translateY(-2px)}
.sco.on{background:var(--navy);border-color:var(--navy)}
.sco-i{font-size:1.8rem;margin-bottom:6px}
.sco b{display:block;font-size:1rem;color:var(--navy)}
.sco.on b{color:#fff}
.sco em{font-style:normal;font-size:.68rem;color:var(--dim2)}
.sco p{font-size:.76rem;color:var(--ink2);line-height:1.6;margin-top:6px}
.sco.on p,.sco.on em{color:var(--ice2)}
.sco-d{background:var(--ice);border:1px solid var(--ice2);border-radius:var(--r);padding:14px 17px;margin-top:12px}
.sd-r{display:flex;gap:10px;margin-bottom:7px;flex-wrap:wrap}
.sd-r b{min-width:130px;font-size:.82rem;color:var(--navy)}
.sd-r span{flex:1;font-size:.82rem;color:var(--ink2);line-height:1.7}
.sd-n{background:#fff;border-radius:9px;padding:9px 13px;font-size:.8rem;color:var(--green2);margin-top:8px}
.fs-two{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:12px}
@media(max-width:760px){.fs-two{grid-template-columns:1fr}}
.fs-c{border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.fs-c.cost{border-top:4px solid var(--red)}
.fs-c.ben{border-top:4px solid var(--green2)}
.fs-h{background:#FBFDFE;padding:10px 14px;font-size:.92rem;font-weight:700;color:var(--navy);
  border-bottom:1px solid var(--line)}
.fs-r{flex-direction:row!important;align-items:center;gap:10px;padding:9px 14px;margin:0;
  border-bottom:1px solid var(--line);font-weight:400}
.fs-r span{flex:1}
.fs-r b{display:block;font-size:.82rem;color:var(--ink)}
.fs-r em{font-style:normal;font-size:.7rem;color:var(--dim);line-height:1.5}
.fs-r input{width:130px;flex-shrink:0;text-align:center;font-family:var(--fe)}
.fs-t{display:flex;justify-content:space-between;padding:9px 14px;background:var(--ice);
  font-size:.83rem;color:var(--navy)}
.fs-t b{font-family:var(--fe)}
.fs-res{background:#fff;border:2px solid var(--green2);border-radius:var(--r2);padding:18px;margin-bottom:16px}
.fr-g{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:11px;margin-bottom:12px}
.fr{background:#FBFDFE;border:1px solid var(--line);border-radius:11px;padding:13px;text-align:center}
.fr span{display:block;font-size:.74rem;color:var(--dim)}
.fr b{display:block;font-family:var(--fe);font-size:1.35rem;color:var(--navy);margin-top:3px}
.fr-v{color:#fff;border-radius:11px;padding:13px;text-align:center;font-weight:700;font-size:.95rem}

/* ════════ ملخّص العنصر ════════ */
.elsum{margin:0 20px 12px;background:#F7FAFD;border:1px solid var(--line);border-radius:var(--r);padding:12px}
.elsum.on{background:#F4FBF7;border-color:#A8E6C6}
.es-h{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.es-h b{font-size:.88rem;color:var(--navy)}
.es-h .btn{margin-inline-start:auto}
.es-b{margin-top:10px}
.es-b.hide{display:none}
.es-b textarea{margin-bottom:8px}

/* ════════ شارة اقتراح المستشار ════════ */
.tool.recd{border-color:#F0DFB8;background:#FFFDF7}
.tool.ext{border-inline-start:3px solid var(--blue)}
.tool-h .rec{font-style:normal;font-size:.9rem;cursor:help}
.tool-rec{background:#FFF9EC;border:1px solid #F0DFB8;border-radius:8px;padding:7px 11px;
  font-size:.75rem;color:#7A5A12;line-height:1.6}

/* ════════ طبقات الصورة الكبيرة ════════ */
.bp-steps{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:12px 0}
.bps{background:#FBFDFE;border:1.5px solid var(--line);border-radius:11px;padding:10px 16px;text-align:center}
.bps.on{background:var(--navy);border-color:var(--navy)}
.bps span{display:inline-flex;width:22px;height:22px;border-radius:7px;background:var(--blue);color:#fff;
  align-items:center;justify-content:center;font-family:var(--fe);font-size:.72rem;margin-bottom:4px}
.bps.on span{background:var(--green);color:var(--navy)}
.bps b{display:block;font-size:.86rem;color:var(--navy)}
.bps.on b{color:#fff}
.bps em{font-style:normal;font-size:.66rem;color:var(--dim2)}
.bps.on em{color:var(--ice2)}
.bps-a{color:var(--dim2);font-size:1.1rem}
.bp-lbl{font-size:.9rem;font-weight:700;color:var(--navy);background:var(--ice);
  border-inline-start:3px solid var(--blue);border-radius:0 8px 8px 0;padding:8px 13px;margin:14px 0 10px}

/* ════════ مؤشر الحفظ التلقائي ════════ */
.sv-i{font-size:.74rem;color:var(--dim2);background:#F4F7FB;border:1px solid var(--line);
  border-radius:8px;padding:5px 11px;transition:.25s;white-space:nowrap}
.sv-i.on{background:#ECFBF3;border-color:#A8E6C6;color:var(--green2);font-weight:700}

/* ════════ تبديل اللغة ════════ */
.sw.lng{padding:9px 15px;font-family:var(--fe);font-size:.86rem;min-width:44px}
.hm-lang{margin-bottom:12px}
body.en-mode{direction:ltr}
body.en-mode .hero-t,body.en-mode .hm-hero{text-align:left}
body.en-mode .en{direction:ltr}

/* ════════ تحذير الالتقاط ════════ */
.cap-ov{background:rgba(11,37,69,.88)}
.cap-box{max-width:520px;text-align:center;border:3px solid var(--red)}
.cap-i{font-size:3rem;margin-bottom:10px}
.cap-box h3{color:var(--red);font-size:1.25rem}
.cap-box p{font-size:.92rem;line-height:2;color:var(--ink2);margin:10px 0}
.cap-n{background:#FDECEA;border:1px solid #FBD0D9;border-radius:10px;padding:10px;
  font-size:.85rem;color:#7A1F17}
.cap-n b{font-family:var(--fe);font-size:1.1rem}
.cap-box .tr-act{justify-content:center;border:0;padding-top:12px}

/* ════════ زر اللغة الثابت في الترويسة ════════ */
.lang-top{display:inline-flex;align-items:center;gap:7px;background:rgba(255,255,255,.14);
  border:1.5px solid rgba(255,255,255,.28);border-radius:11px;padding:9px 16px;color:#fff;
  font-size:.86rem;font-weight:700;transition:.18s;white-space:nowrap;flex-shrink:0}
.lang-top:hover{background:var(--green);border-color:var(--green);color:var(--navy);transform:translateY(-1px)}

const nrm = x => String(x || '').replace(/\s+/g, ' ').trim();
const N = {};
Object.entries(D).forEach(([a, e]) => { N[nrm(a)] = e; });

function t(s) {
  if (lang === 'ar') return s;
  return D[s] || N[nrm(s)] || s;
}
function set(l) {
  lang = l;
  try { localStorage.setItem(KEY, l); } catch (e) {}
  apply();
  const t = document.querySelector('#langTop .lt-t');
  if (t) t.textContent = lang === 'ar' ? 'English' : 'العربية';
  if (window.GRCAPP) window.GRCAPP.render();
}
function apply() {
  const h = document.documentElement;
  h.setAttribute('lang', lang);
  h.setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');
  document.body.classList.toggle('en-mode', lang === 'en');
}
function toggle() { set(lang === 'ar' ? 'en' : 'ar'); }

/* ترجمة نص العقدة بعد الرسم — للنصوص التي لم تُغلَّف بـ t() */
function sweep(root) {
  if (lang === 'ar') return;
  root = root || document.body;
  if (!root) return;
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  const list = [];
  let n;
  while ((n = w.nextNode())) {
    const v = nrm(n.nodeValue);
    const tr = D[v] || N[v];
    if (v && tr) list.push([n, tr]);
  }
  list.forEach(([node, val]) => { node.nodeValue = node.nodeValue.replace(node.nodeValue.trim(), val); });
  /* العناوين والأزرار التي تحمل نصاً مركّباً */
  root.querySelectorAll('h1,h2,h3,b,span,button,em,small,p,label,i,th,td').forEach(el => {
    if (el.children.length) return;
    const v = nrm(el.textContent);
    const tr = D[v] || N[v];
    if (v && tr && nrm(el.textContent) !== tr) el.textContent = tr;
  });
  /* أخفِ العنوان الفرعي إن صار مطابقاً للعنوان بعد الترجمة */
  root.querySelectorAll('.tool-h, .el-h h3, .hero-t').forEach(box => {
    const b = box.querySelector('b, h3, h1'), e = box.querySelector('.en, .en-sub');
    if (b && e && nrm(b.textContent) === nrm(e.textContent)) e.style.display = 'none';
  });
  root.querySelectorAll('h3, .el-h h3').forEach(h => {
    const sp = h.querySelector('.en');
    if (sp && nrm(h.textContent).replace(nrm(sp.textContent), '').trim() === nrm(sp.textContent))
      sp.style.display = 'none';
  });
  root.querySelectorAll('[title]').forEach(el => {
    const v = el.getAttribute('title'); const tr = D[v] || N[nrm(v)];
    if (tr) el.setAttribute('title', tr);
  });
  /* العناصر النائبة */
  root.querySelectorAll('[placeholder]').forEach(el => {
    const p = el.getAttribute('placeholder');
    const tr = D[p] || N[nrm(p)];
    if (tr) el.setAttribute('placeholder', tr);
  });
}

/* الزر الثابت في الترويسة — يُربط مرة واحدة ويبقى ظاهراً */
function mountBtn() {

}
if (document.readyState === 'loading')
  document.addEventListener('DOMContentLoaded', mountBtn);
else mountBtn();

apply();
return { mountBtn, get lang() { return lang; }, t, set, toggle, apply, sweep, D };
})();

  [/جمعي|خير|وقف|تطوع|مانح|غير ربحي/, 'غير الربحي']
];

window.ctxFor = function (activity, group, sectorKey) {
  const C = window.ACT_CTX;
  if (activity && C[activity]) return C[activity];
  if (group && C[group]) return C[group];
  const t = (activity || '') + ' ' + (group || '');
  for (const [re, k] of KEYMAP) if (re.test(t) && C[k]) return C[k];
  if (sectorKey === 'gov') return C['القطاع الحكومي'];
  if (sectorKey === 'npo') return C['غير الربحي'];
  return C['الخدمات المهنية'];
};

/* شفافية: هل السياق مطابق أم مستنتج أم افتراضي؟ */
window.ctxConfidence = function (activity, group) {
  const C = window.ACT_CTX;
  if (activity && C[activity]) return { lvl: 'مطابق', col: '#047857', why: 'مطابقة مباشرة لنشاطك' };
  if (group && C[group]) return { lvl: 'مطابق', col: '#047857', why: 'مطابقة لمجموعة نشاطك' };
  const t = (activity || '') + ' ' + (group || '');
  for (const [re, k] of KEYMAP) if (re.test(t))
    return { lvl: 'مستنتج', col: '#B4690E', why: 'استُنتج من كلمات نشاطك ← ' + k };
  return { lvl: 'افتراضي', col: '#B3261E',
    why: 'لم يُطابَق نشاطك — اكتبه بتفصيل أدق أو اختر من القائمة لتتحسّن دقة التوليد' };
};

const DEFAULT = SECTORS['تقني'];
/* السياق الآن من بنك الأنشطة: النشاط ← المجموعة ← القطاع */
const sec = () => {
  const o = S().org || {};
  if (window.ctxFor) {
    const c = window.ctxFor(o.activity || '', window.groupOf ? window.groupOf(o.activity || '') : '', o.sectorKey || '');
    if (c) return c;
  }
  return SECTORS[(o.sector || '')] || DEFAULT;
};
const S = () => window.STATE;

const pick = (a, n) => { const c = a.slice(); const o = []; while (o.length < n && c.length) o.push(c.splice(Math.floor(Math.random() * c.length), 1)[0]); return o; };
const one = a => a[Math.floor(Math.random() * a.length)];

/* نطاق التطبيق يغيّر الصياغة */
function scopeWord() {
  return { 'منشأة': 'المنشأة', 'إدارة': 'الإدارة', 'قسم': 'القسم', 'فريق': 'الفريق' }[S().org.scope] || 'المنشأة';
}
function sizeBand() {
  const n = +S().org.emp || 0;
  return n < 50 ? 'صغيرة' : n < 250 ? 'متوسطة' : n < 1000 ? 'كبيرة' : 'كبرى';
}

/* استرجاع مخرجات سابقة */
function out(name) { return (S().outputs || {})[name]; }
function rowsOf(name) { const o = out(name); return (o && o.rows) || []; }

/* ═══════ مولّدات لكل أداة ═══════ */
const GEN = {

pestle() {

  const dims = ['سياسي', 'اقتصادي', 'اجتماعي', 'تقني', 'بيئي', 'قانوني'];

  const rows = [];
  dims.forEach(d => {
    (P[d] || []).forEach(f => rows.push({
      dim: d, factor: f,
      impact: /نظام|لائحة|اشتراط|ترخيص|إلزام|ضوابط|حماية/.test(f) ? 'حرج'

  });
  return { rows };
},

porter() {

horizon() {

swot() {
  const k = sec(), ext = rowsOf('externalFactors');
  const sw = k.swot || { s: [], w: [] };
  /* الفرص والتهديدات تُستورد من PESTLE لا تُخترع */
  const opp = ext.filter(r => /متوسط/.test(r.impact || '')).map(r => r.factor);
  const thr = ext.filter(r => /عالٍ|حرج/.test(r.impact || '')).map(r => r.factor);
  const L = a => a.map(x => '• ' + x).join('\n');
  return {
    s: L(sw.s),
    w: L(sw.w),
    o: L(opp.length ? opp.slice(0, 3) : (k.opps || []).slice(0, 3)),
    t: L(thr.length ? thr.slice(0, 3) : (k.risks || []).slice(0, 3)),
    so: sw.s[0] && (opp[0] || (k.opps || [])[0])
      ? `استثمر «${sw.s[0]}» لاقتناص «${opp[0] || k.opps[0]}» قبل المنافسين.`
      : 'استثمر نقاط قوتك في اقتناص الفرص المتاحة.',
    wt: sw.w[0] && (thr[0] || (k.risks || [])[0])
      ? `عالج «${sw.w[0]}» أولاً لأنها تُضاعف أثر «${thr[0] || k.risks[0]}».`
      : 'أغلق فجوة التوثيق أولاً لأنها تضاعف أثر أي تهديد خارجي.'
  };
},

    comp: 'رقابة لاحقة يومية وتوثيق كل حالة', appr: 'مالك السياسة', exp: '' }] };
},

commsplan() {
  const st = rowsOf('stakeholders').map(r => r.name);
  const base = st.length ? st.slice(0, 4) : sec().stake.slice(0, 4);
  return { rows: base.map((a, i) => ({
    aud: a, msg: i === 0 ? 'التوقعات والالتزامات والتغييرات الجوهرية' : 'التقدّم نحو الأهداف والمخاطر المستجدّة',

    chan: 'بوابة داخلية', freq: 'فوري', dir: 'صاعد', owner: 'مالك الأخلاقيات' }]) };

training() {
  const p = rowsOf('processes');
  const base = p.length ? p : sec().proc.map(x => ({ proc: x, crit: 'عالية' }));
  return { rows: base.slice(0, 4).map(r => ({
    role: `العاملون في ${r.proc || r}`, risk: /حرجة/.test(r.crit || '') ? 'حرج' : one(['عالٍ', 'متوسط']),
    topic: `الضوابط والإجراءات المرتبطة بـ${r.proc || r}`,
    mode: one(['حضوري', 'محاكاة', 'تدريب عملي']),
    measure: 'انخفاض الحوادث المرتبطة وارتفاع البلاغات المبكرة خلال 6 أشهر',
    ext: one(['نعم', 'لا'])
  })) };
},

incentive() {
  return { rows: [
    { role: 'مدير وحدة تشغيلية', base: 'حجم الإنجاز/المبيعات', cond: 'خلوّ الفترة من مخالفة جوهرية مؤكدة + إغلاق ملاحظات التدقيق في المهلة', pct: 25, wd: 'نعم', risk: 'الربط بالحجم وحده يدفع لتجاوز إجراءات التحقق' },
    { role: 'فريق العمليات', base: 'إنجاز المهام في الوقت', cond: 'دقة التوثيق ومعدل الإبلاغ المبكر', pct: 15, wd: 'نعم', risk: 'ضغط الوقت قد يشجّع تخطّي خطوات التحقق' }
  ] };
},

channels() {
  return { rows: [
    { chan: 'خط ساخن يديره طرف محايد خارجي', anon: 'نعم', mgr: 'طرف محايد خارجي', ack: 'خلال 48 ساعة', ret: 'مكتوبة ومُطبَّقة ومُختبَرة' },
    { chan: 'بوابة إلكترونية داخلية', anon: 'نعم', mgr: 'الأخلاقيات', ack: 'خلال 72 ساعة', ret: 'مكتوبة غير مُختبَرة' },
    { chan: 'الإبلاغ المباشر للمدير', anon: 'لا', mgr: 'الإدارة المباشرة', ack: 'فوري', ret: 'مكتوبة ومُطبَّقة ومُختبَرة' }
  ] };
},

protocol() {

    steps: '1. استلام البلاغ وتسجيله برقم مرجعي خلال 24 ساعة.\n2. التقييم الأولي وتحديد النطاق والجسامة.\n3. تعيين محقّق كفء ومستقل عن موضوع البلاغ.\n4. حفظ الأدلة وتأمين سلسلة العهدة قبل أي مقابلة.\n5. إجراء المقابلات وتوثيقها كتابةً وتوقيعها.\n6. صياغة الاستنتاج المستند إلى الأدلة لا الانطباع.\n7. رفع التوصية لصاحب الصلاحية وإغلاق الملف بقرار موثّق.',
    inv: 'محقّق من خارج الإدارة موضوع البلاغ — يُوثَّق استقلاله وأهليته في ملف القضية',
    evid: 'تُحفظ الأدلة الرقمية بنسخة طبق الأصل مع بصمة زمنية، وتُقيَّد كل عملية تسليم واستلام في سجل العهدة.',
    conf: 'الوصول مقصور على فريق التحقيق. يُحظر الكشف عن هوية المبلّغ إلا بموجب إلزام نظامي، وتُطبَّق حماية صريحة من الانتقام.',
    sla: '30 يوماً للبلاغات الاعتيادية · 10 أيام للبلاغات الجسيمة'
  };
},

sanction() {
  return { rows: [
    { viol: 'مخالفة إجرائية غير متعمّدة', sev: 'بسيطة', first: 'تنبيه موثّق + تدريب تصحيحي', repeat: 'إنذار كتابي', notify: 'لا' },
    { viol: 'تجاوز ضابط دون استثناء معتمد', sev: 'متوسطة', first: 'إنذار كتابي + خطة تصحيح', repeat: 'حسم من الحافز المشروط', notify: 'حسب الحالة' },
    { viol: 'تلاعب أو إخفاء معلومات جوهرية', sev: 'جسيمة', first: 'إيقاف عن العمل + تحقيق', repeat: 'إنهاء الخدمة', notify: 'نعم' },

},

rca() {
  const inc = (rowsOf('incidentPatterns')[0] || {}).inc || sec().risks[0];
  return { event: inc, symptom: 'نُسب الأمر إلى إهمال الموظف',
    w1: 'لماذا وقع الخطأ؟ لأن الخطوة نُفِّذت يدوياً تحت ضغط وقت.',
    w2: 'لماذا كانت يدوية؟ لعدم وجود تحقّق آلي في النظام.',

dashboard() {
  const reg = rowsOf('register'), objs = rowsOf('objectives').map(r => r.obj);

  const rows = reg.slice(0, 6).map(r => ({
    ind: `مؤشر ${r.item}`, type: map[r.cat] || 'KPI',
    lead: /فرصة|التزام/.test(r.cat) ? 'متقدّم' : one(['متقدّم', 'متأخر']),

    thr: 'تجاوز العتبة مرتين متتاليتين ⇐ تصعيد', freq: one(['شهري', 'ربع سنوي'])

assurance() {

lessons() {

pdca() {

  };
}
};

/* ═══════ الواجهة العامة ═══════ */
function generate(toolId) {
  const g = GEN[toolId];
  if (!g) return null;
  try { return g(); } catch (e) { console.warn('AI gen', toolId, e); return null; }
}

/* تحليل ذكي للملف التمهيدي */
function profileInsight() {
  const o = S().org, k = sec(), b = sizeBand();
  const drivers = [];
  if (o.scope === 'منشأة') drivers.push('نطاق التطبيق على مستوى المنشأة يستدعي حوكمة مركزية وتفويضاً واضحاً للصلاحيات');
  else drivers.push(`نطاق التطبيق على مستوى ${scopeWord()} يستدعي مواءمة رأسية مع أهداف المنشأة الأم`);
  if (b === 'صغيرة') drivers.push('الحجم الصغير يعني تركّز الأدوار — فالخطر الأكبر هو ضعف فصل المهام والاعتماد على أفراد بعينهم');
  else if (b === 'كبرى') drivers.push('الحجم الكبير يعني تعدّد الصوامع — فالخطر الأكبر هو الازدواج والفجوات بين الإدارات');
  else drivers.push('الحجم المتوسط مرحلة انتقالية: الممارسات تجاوزت العفوية ولم تُوثَّق بعد بشكل كافٍ');
  drivers.push(`قطاع ${o.sector || 'النشاط'} يفرض التزامات محدّدة أبرزها: ${k.regs.slice(0, 2).join(' و')}`);
  return {
    drivers,
    topRisks: k.risks.slice(0, 3),
    topRegs: k.regs.slice(0, 3),
    stake: k.stake.slice(0, 4),
    proc: k.proc
  };
}

return { generate, profileInsight, sectors: Object.keys(SECTORS), scopeWord, sizeBand };
})();
