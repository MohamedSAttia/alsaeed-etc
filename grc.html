ity of management authority?","qa":"في داخل المنظمة، ما هي مسؤولية السلطة الإدارية؟","oe":["Balancing competing stakeholder needs in order to direct, control, and align the organization toward reliability in achieving objectives, addressing uncertainty, and acting with integrity","Designing every strategic plan applicable at any level of the organization","Direct management of the most important aspects of the organization’s operational activities to ensure the achievement of defined objectives","Negotiating contracts with all executives within the organization, as well as all suppliers and vendors"],"oa":["موازنة الاحتياجات المتنافسة لأصحاب المصلحة من أجل توجيه وتقييد وتخصيص المنظمة للموثوقية في تحقيق الأهداف والتعامل مع الأحوال غير المؤكدة والعمل بنزاهة","تصميم كل خطة استراتيجية تنطبق على أي مستوى من المنظمة","الإدارة المباشرة للنواحي الأكثر أهمية من العمليات التشغيلية للمنظمة للتأكد من تحقيق الأهداف المحددة","التفاوض على العقود مع جميع المدراء التنفيذيين في المنظمة، بالإضافة إلى جميع الموردين والتجار"],"c":0,"ch":"Align Competent","ex":"Exam 2 - GRCP","fe":"According to the GRC Capability Model, management authority is responsible for:\n\n\n\t\n\tDirecting the organization\n\t\n\t\n\tConstraining and controlling activities\n\t\n\t\n\tAllocating resources\n\t\n\t\n\tBalancing stakeholder interests\n\t\n\t\n\tEnsuring objective achievement\n\t\n\t\n\tAddressing uncertainty\n\t\n\t\n\tActing with integrity\n\t\n\n\nThis directly aligns with the definition of Principled Performance:\n\n\nAchieve objectives\nAddress uncertainty\nAct with integrity\n\n\nTherefore, management authority is about governance-driven balancing and alignment — not just operations or contracting.","fa":"وفق نموذج GRC Capability Model،\nالسلطة الإدارية (Management Authority) مسؤولة عن:\n\n\n\t\n\tتوجيه المنظمة\n\t\n\t\n\tتقييدها وضبطها\n\t\n\t\n\tتخصيص الموارد\n\t\n\t\n\tموازنة مصالح أصحاب المصلحة\n\t\n\t\n\tضمان تحقيق الأهداف\n\t\n\t\n\tالتعامل مع عدم اليقين\n\t\n\t\n\tالعمل بنزاهة\n\t\n\n\nوهذا يتطابق حرفيًا مع تعريف Principled Performance:\n\n\nتحقيق الأهداف\nالتعامل مع عدم اليقين\nوالعمل بنزاهة\n\n\nإذن المسؤولية ليست تشغيلية فقط، وليست تعاقدية، وليست تصميمية بحتة —\nبل هي قيادة وتوجيه استراتيجي متوازن."},{"qe":"How does the GRC Capability Model define the term “Enterprise”?","qa":"كيف يُعرّف نموذج قدرات الحوكمة والمخاطر والامتثال (GRC) مصطلح \"المنشأة\"؟","oe":["The enterprise refers to a spaceship that boldly goes where no one has gone before","The enterprise refers to the infrastructure and technical systems of the organization","The enterprise refers to the organization’s sales and distribution channels","The enterprise is the highest-level unit that encompasses the entire organization"],"oa":["المنشأة تشير إلى مركبة فضائية تذهب بجرأة حيث لم يذهب أحد قط","المنشأة تشير إلى البنية التحتية والأنظمة التقنية في المنظمة","المنشأة تشير إلى مبيعات المنظمة وقنوات التوزيع","المنشأة هي الوحدة العليا التي تشمل المنظمة بالكامل"],"c":3,"ch":"Learn Component","ex":"Exam 2 - GRCP","fe":"In the GRC Capability Model, the term Enterprise does not refer to a department, infrastructure, or sales activity.\n\nIt refers to:\n\n\nThe entire organization as a whole entity to which governance, risk, and compliance practices apply.\n\n\nThe enterprise encompasses:\n\n\n\t\n\tStructure\n\t\n\t\n\tOperations\n\t\n\t\n\tResources\n\t\n\t\n\tActivities\n\t\n\t\n\tStakeholder relationships\n\t\n\n\nIt is the full organizational scope within which Principled Performance is pursued.","fa":"في نموذج GRC، مصطلح Enterprise (المنشأة) لا يُقصد به قسمًا معينًا، ولا وظيفة تشغيلية، ولا بنية تقنية،\nبل يُقصد به:\n\n\nالكيان الكامل الذي تسري عليه ممارسات الحوكمة والمخاطر والامتثال.\n\n\nالنموذج ينظر إلى المنشأة كوحدة شاملة تشمل:\n\n\n\t\n\tالهيكل\n\t\n\t\n\tالعمليات\n\t\n\t\n\tالموارد\n\t\n\t\n\tالأنشطة\n\t\n\t\n\tالعلاقات مع أصحاب المصلحة\n\t\n\n\nأي أنها الإطار الكلي الذي يُمارس عليه “Principled Performance”.\n\nOCEG. (2024). GRC Capability Model Version 3.5: Red Book (Premium Edition). OCEG."},{"qe":"What practices are associated with analyzing and understanding the ethical culture of the organization?","qa":"ما هي الممارسات المرتبطة بتحليل وفهم الثقافة الأخلاقية للمنظمة؟","oe":["Conducting employee surveys every few years regarding their opinions about the organization’s commitment to ethical behaviors","Implementing a performance appraisal system to measure employee performance","Developing a long-term strategic plan to achieve organizational objectives in order to improve ethical culture","Analyzing the organizational climate and mindsets regarding how the workforce demonstrates integrity"],"oa":["إجراء استطلاعات الموظفين كل عدة سنوات حول آرائهم عن التزام المنظمة بالسلوكيات الأخلاقية","تطبيق نظام تقييم الأداء لقياس أداء الموظفين","تطوير خطة استراتيجية لتحقيق أهداف المنظمة طويلة المدى من أجل تحسين الثقافة الأخلاقية","تحليل المناخ المؤسسي والعقليات حول كيفية إظهار القوى العاملة للنزاهة"],"c":3,"ch":"Learn Component","ex":"Exam 2 - GRCP","fe":"Analyzing organizational climate and workforce mindsets directly aligns with assessing ethical culture. Ethical culture is reflected in:\n\n\n\t\n\tOrganizational climate\n\t\n\t\n\tBehavioral norms\n\t\n\t\n\tShared perceptions of integrity\n\t\n\t\n\tDecision-making patterns\n\t\n\n\nThis aligns with the GRC model’s emphasis on Culture and Values within Principled Performance.\n\nOCEG. (2024). GRC Capability Model Version 3.5: Red Book (Premium Edition). OCEG.\nSection: Learn (L3 – Culture); Foundational Concepts – Culture & Values.","fa":"تحليل المناخ المؤسسي والعقليات (Mindsets) هو جوهر فهم الثقافة الأخلاقية.\nالثقافة الأخلاقية تُقاس من خلال:\n\n\n\t\n\tالمناخ التنظيمي\n\t\n\t\n\tالسلوكيات الفعلية\n\t\n\t\n\tالتصورات الجماعية للنزاهة\n\t\n\t\n\tكيفية اتخاذ القرارات في الواقع\n\t\n\n\nوهذا يتماشى مباشرة مع مفهوم Culture & Values في نموذج GRC.\n\nفي نموذج GRC، الثقافة الأخلاقية جزء أساسي من:\n\n\n\t\n\tL3 – Culture (ضمن مكون Learn)\n\t\n\t\n\tCulture & Values\n\t\n\t\n\tIntegrity within Principled Performance\n\t\n\n\nالنموذج يركز على:\n\n\nفهم كيف تتصرف المنظمة فعليًا، وليس فقط ما هو مكتوب في السياسات.\n\n\n\n \n\nOCEG. (2024). GRC Capability Model Version 3.5: Red Book (Premium Edition). OCEG.\nSection: Learn (L3 – Culture); Foundational Concepts – Culture & Values."},{"qe":"It is difficult – even impossible – to “design” culture because:","qa":"يصعب – بل يستحيل – \"تصميم\" الثقافة بسبب:","oe":["It takes a long time","The existence of multiple subcultures","People are not interested in change","It is an emergent property"],"oa":["أنها تستغرق الكثير من الوقت","وجود العديد من الثقافات الفرعية","عدم اهتمام الأشخاص بالتغيير","أنها خاصية ناشئة"],"c":3,"ch":"Learn Component","ex":"Exam 2 - GRCP","fe":"Organizational culture is an emergent property, meaning it cannot be engineered directly like policies or structures. Instead, it:\n\n\n\t\n\tEmerges from daily interactions\n\t\n\t\n\tIs shaped by actual behaviors and shared values\n\t\n\t\n\tEvolves through leadership influence and context\n\t\n\n\nTherefore, culture cannot simply be “designed”; it can only be influenced.\n\nOCEG. (2024). GRC Capability Model Version 3.5: Red Book (Premium Edition). OCEG.\nSection: Learn – L3 Culture; Discussion of organizational culture as an emergent characteristic (pp. 96–101).","fa":"الثقافة التنظيمية تُعد خاصية ناشئة (Emergent Property)، أي أنها لا تُصمَّم بشكل مباشر من أعلى إلى أسفل مثل السياسات أو الهياكل، بل:\n\n\n\t\n\tتنشأ من التفاعلات اليومية\n\t\n\t\n\tتتشكل من القيم والسلوكيات الفعلية\n\t\n\t\n\tتتأثر بالقيادة والقرارات والسياق\n\t\n\n\nلذلك لا يمكن \"تصميمها\" هندسيًا، بل يمكن التأثير عليها فقط.\n\nOCEG. (2024). GRC Capability Model Version 3.5: Red Book (Premium Edition). OCEG.\nSection: Learn – L3 Culture; Discussion of organizational culture as an emergent characteristic (pp. 96–101)."},{"qe":"The best heading for a statement about the organization’s beliefs is","qa":"أفضل عنوان لعبارة حول معتقدات المنظمة هو:","oe":["Results","Values","Mission","Vision"],"oa":["النتائج","القيم","المهمة","الرؤية"],"c":1,"ch":"Learn Component","ex":"Exam 2 - GRCP","fe":"Values represent the organization’s fundamental beliefs that guide behavior and decision-making.\n\nValues answer the question:\n\n\n“What do we believe in?”\n\n\nThey form the foundation of culture, integrity, and principled performance.","fa":"القيم تعكس المعتقدات الجوهرية التي تؤمن بها المنظمة وتوجّه سلوكها وقراراتها.\n\nالقيم تجيب عن سؤال:\n\n\n\"ما الذي نؤمن به؟\"\n\n\nوهي الأساس الذي تُبنى عليه الثقافة والنزاهة والأداء المنضبط."},{"qe":"How should the organization determine the interests and needs of stakeholder groups?","qa":"كيف يتعين للمنظمة معرفة اهتمامات واحتياجات فئات أصحاب المصلحة؟","oe":["By conducting investigations on all stakeholders","By requiring stakeholders to sign non-disclosure agreements and then conducting discussions","By identifying and understanding the interests and needs of each organization and certain individuals within them","By hosting annual appreciation events for stakeholders to allow executive management to request what it wants from them"],"oa":["من خلال إجراء التحريات عن جميع أصحاب المصلحة","من خلال مطالبة أصحاب المصلحة بتوقيع اتفاقيات عدم الإفشاء ومن ثم إجراء المحادثات","من خلال تحديد وفهم الاهتمامات والاحتياجات لكل من المنظمات وبعض الأشخاص فيها","من خلال استضافة فعاليات سنوية لتقدير أصحاب المصلحة لبث الإدارة التنفيذية طلب ما تشاء منهم"],"c":2,"ch":"Learn Component","ex":"Exam 2 - GRCP","fe":"The GRC model emphasizes:\n\n\n\t\n\tIdentifying stakeholders\n\t\n\t\n\tAnalyzing their interests\n\t\n\t\n\tUnderstanding expectations\n\t\n\t\n\tEvaluating influence\n\t\n\n\nThis aligns with:\n\nL4 – Stakeholders (Learn Component)\n\nOCEG. (2024). GRC Capability Model Version 3.5: Red Book (Premium Edition). OCEG.\nSection: Learn – L4 Stakeholders (pp. 102–110).","fa":"نموذج GRC يؤكد أن معرفة أصحاب المصلحة تتم عبر:\n\n\n\t\n\tتحديدهم\n\t\n\t\n\tتحليل اهتماماتهم\n\t\n\t\n\tفهم توقعاتهم\n\t\n\t\n\tتقييم تأثيرهم\n\t\n\n\nويشمل ذلك المنظمة ككيان وكذلك الأفراد المؤثرين داخلها.\n\nهذا يتماشى مع مكون:\n\nL4 – Stakeholders (Learn Component)\n\nOCEG. (2024). GRC Capability Model Version 3.5: Red Book (Premium Edition). OCEG.\nSection: Learn – L4 Stakeholders (pp. 102–110)."},{"qe":"Which of the most important stakeholders determines whether the organization produces, preserves, or erodes value?","qa":"أي من أصحاب المصلحة الأكثر أهمية يقرر ما إذا كانت المنظمة تنتج القيمة أو تحافظ على القيمة أو تتلف القيمة؟","oe":["Board of Directors","Ethics Department","Customers","Risk Manager"],"oa":["مجلس الإدارة","قسم الأخلاقيات","العملاء","مدير المخاطر"],"c":2,"ch":"Learn Component","ex":"Exam 2 - GRCP","fe":"Value is ultimately determined by the market, and customers decide:\n\n\n\t\n\tWhether the product/service creates value\n\t\n\t\n\tWhether they continue purchasing\n\t\n\t\n\tWhether value is created, preserved, or eroded\n\t\n\n\nIn the GRC model, principled performance connects value creation to stakeholder satisfaction, especially customers.\n\n\nOCEG. (2024). GRC Capability Model Version 3.5: Red Book (Premium Edition). OCEG. Section: Principled Performance & Stakeholder Value (pp. 18–24; 102–110).","fa":"القيمة تُقاس من منظور السوق، والعملاء هم من يحددون:\n\n\n\t\n\tهل المنتج أو الخدمة لها قيمة؟\n\t\n\t\n\tهل سيستمرون في الشراء؟\n\t\n\t\n\tهل ستُخلق قيمة أم تُفقد؟\n\t\n\n\nفي نموذج GRC، خلق القيمة وحفظها وتحسينها يرتبط بتلبية توقعات أصحاب المصلحة، وأهمهم العملاء.\n\n \n\nOCEG. (2024). GRC Capability Model Version 3.5: Red Book (Premium Edition). OCEG. Section: Principled Performance & Stakeholder Value (pp. 18–24; 102–110)."},{"qe":"What is the importance of the organization prioritizing stakeholder interests and needs?","qa":"ما أهمية ترتيب المنظمة لأولويات اهتمامات واحتياجات أصحاب المصلحة؟","oe":["To organize stakeholder appreciation events","To create a stakeholder directory","To classify the highest-value stakeholders","To highlight and address needs that compete with or conflict with each other"],"oa":["لتنظيم فعاليات تقدير أصحاب المصلحة","لإنشاء دليل لأصحاب المصلحة","لتصنيف أصحاب المصلحة الأعلى قيمة","لإبراز والتعامل مع الاحتياجات التي تتنافس مع أو تتعارض مع بعضها بعضًا"],"c":3,"ch":"Learn Component","ex":"Exam 2 - GRCP","fe":"Within the GRC Capability Model, stakeholders often have:\n\n\n\t\n\tCompeting expectations\n\t\n\t\n\tConflicting interests\n\t\n\t\n\tDifferent priority levels\n\t\n\n\nPrioritization enables the organization to:\n\n\n\t\n\tBalance conflicting demands\n\t\n\t\n\tMake context-aware decisions\n\t\n\t\n\tProtect value from erosion\n\t\n\t\n\tAllocate resources effectively\n\t\n\n\nThis aligns with:\n\nL4 – Stakeholder Engagement & Prioritization\nwithin the LEARN component\n\n\nOCEG. (2024). GRC Capability Model Version 3.5: Red Book (Premium Edition). OCEG.\nSection: Learn – L4 Stakeholders & Stakeholder Prioritization (pp. 104–111).","fa":"في نموذج GRC، أصحاب المصلحة غالبًا ما تكون لديهم:\n\n\n\t\n\tتوقعات متنافسة\n\t\n\t\n\tمصالح متعارضة\n\t\n\t\n\tأولويات مختلفة\n\t\n\n\nلذلك فإن ترتيب الأولويات يسمح للمنظمة بـ:\n\n\n\t\n\tموازنة المطالب المتعارضة\n\t\n\t\n\tاتخاذ قرارات مبنية على السياق\n\t\n\t\n\tحماية القيمة ومنع تآكلها\n\t\n\t\n\tتخصيص الموارد بفعالية\n\t\n\n\nوهذا جزء أساسي من:\n\nL4 – Stakeholder Engagement and Prioritization\nضمن مكون LEARN\n\nOCEG. (2024). GRC Capability Model Version 3.5: Red Book (Premium Edition). OCEG.\nSection: Learn – L4 Stakeholders & Stakeholder Prioritization (pp. 104–111)."},{"qe":"What is the final outcome of alignment activities within the ALIGN component?","qa":"ما هي النتيجة النهائية لعمليات المواءمة داخل مكون (المواءمة)؟","oe":["The final outcome of alignment is obtaining a detailed budget and financial forecasting reports","The final outcome of alignment is obtaining a detailed organizational structure with reporting lines","The final outcome of alignment is obtaining an integrated action plan","The final outcome of alignment is obtaining a comprehensive risk analysis report"],"oa":["النتيجة النهائية للمواءمة هي الحصول على ميزانية مفصلة وعلى تقارير التنبؤ المالي","النتيجة النهائية للمواءمة هي الحصول على هيكل تنظيمي مفصل مع خطوط التسلسل الإداري","النتيجة النهائية للمواءمة هي الحصول على خطة عمل متكاملة","النتيجة النهائية للمواءمة هي الحصول على تقرير شامل لتحليل المخاطر"],"c":2,"ch":"Align Competent","ex":"Exam 2 - GRCP","fe":"Within the GRC Capability Model, the ALIGN component:\n\n\n\t\n\tTranslates insights from LEARN\n\t\n\t\n\tConverts contextual understanding into strategic direction\n\t\n\t\n\tDefines objectives and priorities\n\t\n\t\n\tDesigns policies and controls\n\t\n\t\n\tAssigns resources and accountability\n\t\n\n\nThe final outcome is therefore:\n\nAn integrated action plan\nthat guides principled performance.\n\n\nOCEG. (2024). GRC Capability Model Version 3.5: Red Book (Premium Edition). OCEG. Section: Align – Strategy, Objectives, and Action Planning (pp. 132–145).","fa":"في نموذج GRC Capability Model، مكون ALIGN يهدف إلى:\n\n\n\t\n\tترجمة نتائج الدراسة (LEARN)\n\t\n\t\n\tتحويل الفهم السياقي إلى توجه استراتيجي\n\t\n\t\n\tتحديد الأهداف والأولويات\n\t\n\t\n\tتصميم السياسات والإجراءات\n\t\n\t\n\tتحديد الموارد والمسؤوليات\n\t\n\n\nوالنتيجة النهائية لذلك هي:\n\nخطة عمل متكاملة (Integrated Action Plan)\nتوجه المنظمة نحو الأداء المنضبط (Principled Performance).\n\n\nOCEG. (2024). GRC Capability Model Version 3.5: Red Book (Premium Edition). OCEG. Section: Align – Strategy, Objectives, and Action Planning (pp. 132–145)."},{"qe":"What is the importance of establishing decision-making criteria in the alignment process?","qa":"ما أهمية ضبط معايير اتخاذ القرار في عملية المواءمة؟","oe":["To ensure the organization remains on the right path to achieve its objectives","To comply with industry regulations and standards","To calculate the return on investment (ROI) of alignment activities","To evaluate employee and team performance"],"oa":["لضمان بقاء المنظمة على المسار الصحيح لتحقيق أهدافها","للامتثال بأنظمة ومعايير القطاع","لاحتساب العائد من الاستثمار لأنشطة المواءمة","لتقييم أداء الموظفين وفرق العمل"],"c":0,"ch":"Align Competent","ex":"Exam 2 - GRCP","fe":"Within the ALIGN component of the GRC Capability Model:\n\n\n\t\n\tObjectives are defined\n\t\n\t\n\tPriorities are set\n\t\n\t\n\tDecision criteria are established\n\t\n\t\n\tRisk appetite and tolerance are clarified\n\t\n\n\nDecision criteria ensure:\n\n\nDecisions align with strategy\nRisk-taking stays within acceptable boundaries\nResources support objectives\nThe organization does not drift off course\n\n\nTherefore, the correct answer is:\n\nTo ensure the organization remains on the right path to achieve its objectives.\n \n\nOCEG. (2024). GRC Capability Model Version 3.5: Red Book (Premium Edition). OCEG.\nSection: Align – Decision Criteria & Risk Appetite (pp. 136–140).","fa":"في مكون ALIGN من نموذج GRC Capability Model:\n\n\n\t\n\tيتم تحديد الأهداف\n\t\n\t\n\tتحديد الأولويات\n\t\n\t\n\tوضع معايير واضحة لاتخاذ القرار\n\t\n\t\n\tتحديد ما يُقبل وما يُرفض\n\t\n\t\n\tتحديد حدود المخاطر المقبولة\n\t\n\n\nوجود معايير لاتخاذ القرار يضمن أن:\n\n\nالقرارات المتخذة تتماشى مع التوجه الاستراتيجي\nالمخاطر المقبولة ضمن حدود واضحة\nالموارد تُستخدم بما يخدم الأهداف\nالمنظمة لا تنحرف عن مسارها\n\n\nإذن الهدف هو:\n\nضمان بقاء المنظمة على المسار الصحيح لتحقيق أهدافها\n \n\nOCEG. (2024). GRC Capability Model Version 3.5: Red Book (Premium Edition). OCEG.\nSection: Align – Decision Criteria & Risk Appetite (pp. 136–140)."},{"qe":"What is the importance of gaining support from subordinate levels when setting organizational direction?","qa":"ما أهمية اكتساب دعم المستويات التابعة عند ضبط التوجه للمنظمة؟","oe":["To determine the organization’s growth and expansion plans without internal conflict","To reinforce the organization’s identity and brand image without conflict","To help subordinate units understand and define how they contribute to the organization’s success, thereby reducing the risk of strategic misalignment and disengagement","To ensure there are sufficient employees in the organization to carry out the specified tasks"],"oa":["لتحديد خطط نمو وتوسع المنظمة دون أي تعارض داخلي","لترسيخ الهوية والصورة التجارية للمنظمة دون أي تعارض","لمساعدة الوحدات التابعة في فهم وتعريف أساليب المساهمة في نجاح المنظمة، مما يقلل من مخاطر عدم المواءمة الاستراتيجية واضمحلال التفاعل","للتأكد من وجود ما يكفي من الموظفين في المنظمة لتنفيذ المهام المحددة"],"c":2,"ch":"Align Competent","ex":"Exam 2 - GRCP","fe":"Within the ALIGN component of the GRC Capability Model:\n\n\n\t\n\tDirection is set\n\t\n\t\n\tObjectives are clarified\n\t\n\t\n\tPriorities are defined\n\t\n\t\n\tDecision criteria are established\n\t\n\t\n\tOrganizational units are aligned\n\t\n\n\nWithout subordinate-level support:\n\n\n\t\n\tMisunderstanding of objectives occurs\n\t\n\t\n\tFragmented strategies emerge\n\t\n\t\n\tEngagement declines\n\t\n\t\n\tStrategic misalignment risk increases\n\t\n\n\nGaining support ensures:\n\n✔ Clear role understanding\n✔ Coordinated contribution\n✔ Reduced strategic misalignment risk\n✔ Stronger engagement\n \n\nOCEG. (2024). GRC Capability Model Version 3.5: Red Book (Premium Edition). OCEG.\nSection: Align – Cascading Direction and Organizational Alignment (pp. 128–134).","fa":"في مكون ALIGN من نموذج GRC Capability Model:\n\n\n\t\n\tيتم تحديد الاتجاه\n\t\n\t\n\tتحديد الأهداف\n\t\n\t\n\tتحديد الأولويات\n\t\n\t\n\tتحديد معايير القرار\n\t\n\t\n\tمواءمة الوحدات التنظيمية\n\t\n\n\nإذا لم يتم إشراك المستويات التابعة:\n\n\n\t\n\tيحدث سوء فهم للأهداف\n\t\n\t\n\tتتشكل استراتيجيات جزئية غير متسقة\n\t\n\t\n\tتضعف المشاركة\n\t\n\t\n\tتزيد مخاطر عدم المواءمة\n\t\n\n\nاكتساب الدعم يضمن:\n\n✔ فهم واضح للدور\n✔ مساهمة متناسقة\n✔ تقليل المخاطر الاستراتيجية\n✔ تعزيز التفاعل المؤسسي\n\n\nOCEG. (2024). GRC Capability Model Version 3.5: Red Book (Premium Edition). OCEG.\nSection: Align – Cascading Direction and Organizational Alignment (pp. 128–134)."},{"qe":"What is the process of confirming direction within the organization?","qa":"ما هي عملية تأكيد التوجه داخل المنظمة؟","oe":["The process of confirming direction is associated with conducting a SWOT analysis to identify strengths, weaknesses, opportunities, and threats in the organization.","The process of confirming direction is associated with communication, negotiation, and preparing the final formulation of direction with other organizational units/levels.","The process of confirming direction is associated with implementing a performance management system to evaluate employee performance and alignment with the defined direction.","The process of confirming direction is associated with conducting a comprehensive audit of the organization’s financial records to ensure it is moving in the right direction."],"oa":["عملية تأكيد التوجه مرتبطة بإجراء تحليل SWOT للتعرف على نقاط القوة والضعف والفرص والتهديدات بالمنظمة","عملية تأكيد التوجه مرتبطة بالتواصل والتفاوض وإعداد الصيغة النهائية للتوجه مع الوحدات/المستويات التنظيمية الأخرى","عملية تأكيد التوجه مرتبطة بتطبيق نظام لإدارة الأداء من أجل تقييم أداء الموظفين والمواءمة مع التوجه المحدد","عملية تأكيد التوجه مرتبطة بإجراء تدقيق شامل لسجلات المنظمة المالية لضمان سيرها في الاتجاه الصحيح"],"c":1,"ch":"Align Competent","ex":"Exam 2 - GRCP","fe":"According to the GRC Capability Model v3.5, confirming direction is part of the Align component and ensures that strategic direction is:\n\n\n\t\n\tUnderstood\n\t\n\t\n\tAgreed upon\n\t\n\t\n\tAligned\n\t\n\t\n\tSupported\n\t\n\t\n\tAdopted across organizational levels\n\t\n\n\nThis process involves:\n\n\n\t\n\tCommunication\n\t\n\t\n\tNegotiation\n\t\n\t\n\tBuilding consensus\n\t\n\t\n\tFinalizing strategic direction across organizational units\n\t \n\n\tOCEG. (2024). GRC Capability Model (Red Book) v3.5. OCEG.\n\n\t📖 Align – Confirm Direction\n\t📍 Page: 96–101\n\n\t\n\t(OCEG, 2024, pp. 96–101)","fa":"وفق نموذج GRC Capability Model v3.5، عملية تأكيد التوجه داخل المنظمة تقع ضمن مكون المواءمة (Align)، وتهدف إلى ضمان أن التوجه الاستراتيجي يتم:\n\n\n\t\n\tفهمه\n\t\n\t\n\tالاتفاق عليه\n\t\n\t\n\tمواءمته\n\t\n\t\n\tدعمه\n\t\n\t\n\tتبنيه من قبل المستويات التنظيمية المختلفة\n\t\n\n\nوتتم هذه العملية عبر:\n\n\n\tالتواصل الفعال\n\tالتفاوض\n\tبناء التوافق\n\tصياغة التوجه النهائي بما يضمن الاتساق المؤسسي\n\t \n\tOCEG. (2024). GRC Capability Model (Red Book) v3.5. OCEG.\n\n\t📖 Align – Confirm Direction\n\t📍 Page: 96–101\n\n\t\n\t(OCEG, 2024, pp. 96–101)"},{"qe":"What is the importance of vision in inspiring and motivating employees, stakeholders, and customers?","qa":"ما أهمية الرؤية في إلهام وتشجيع الموظفين وأصحاب المصلحة والعملاء؟","oe":["It clarifies succession plans within the organization and leadership development.","It describes what the organization aspires to achieve and why it matters, serving as a guide for long-term strategic planning and inspiring and motivating employees, stakeholders, and customers.","It defines the organization's views regarding ethical issues it faces.","It details sales targets and revenue expectations in the organization to encourage employees to work hard to achieve those objectives."],"oa":["أنها توضح الخطط التعاقبية في المنظمة وتطوير القيادة","أنها تصف ما تطمح المنظمة في الوصول إليه ومدى أهميته، وتعمل بمثابة دليل للتخطيط الاستراتيجي طويل المدى، وإلهام وتشجيع الموظفين وأصحاب المصلحة والعملاء","أنها تحدد آراء المنظمة حول القضايا الأخلاقية التي تواجهها","أنها تفصل مستهدفات المبيعات وتوقعات الإيرادات في المنظمة لتشجيع الموظفين على العمل بجهد لتحقيق تلك الأهداف"],"c":1,"ch":"Align Competent","ex":"Exam 2 - GRCP","fe":"According to the GRC Capability Model v3.5, vision is an aspirational statement that defines:\n\n\n\t\n\tThe desired future state\n\t\n\t\n\tLong-term direction\n\t\n\t\n\tThe overarching purpose of the organization\n\t\n\n\nVision is used to:\n\n\n\t\n\tGuide strategic planning\n\t\n\t\n\tInspire employees\n\t\n\t\n\tAttract stakeholders\n\t\n\t\n\tCreate shared meaning about the future\n\t\n\n\nVision is not an operational plan nor a financial target; it is a guiding and inspirational framework.\n\n\nOCEG. (2024). GRC Capability Model (Red Book) v3.5. OCEG.\n\n📖 Section: Align – Establish Direction (Vision, Mission, Values)\n\n\n(OCEG, 2024, pp. 90–94)","fa":"وفق نموذج GRC Capability Model v3.5، الرؤية (Vision) هي بيان طموحي يحدد:\n\n\n\t\n\tالصورة المستقبلية المرغوبة\n\t\n\t\n\tالاتجاه طويل المدى\n\t\n\t\n\tالغاية الكبرى للمنظمة\n\t\n\n\nوتُستخدم الرؤية من أجل:\n\n\n\t\n\tتوجيه التخطيط الاستراتيجي\n\t\n\t\n\tتحفيز العاملين\n\t\n\t\n\tجذب أصحاب المصلحة\n\t\n\t\n\tخلق معنى مشترك حول المستقبل\n\t\n\n\nالرؤية ليست خطة تنفيذية، وليست بيانًا ماليًا، بل إطار إلهامي موجِّه.\n \n\nOCEG. (2024). GRC Capability Model (Red Book) v3.5. OCEG.\n\n📖 Section: Align – Establish Direction (Vision, Mission, Values)\n📍 الصفحات: 90–94\n\n\n(OCEG, 2024, pp. 90–94)"},{"qe":"What is the importance of ensuring clarity of objectives across different organizational levels?","qa":"ما أهمية التأكد من وضوح رؤية الأهداف من مختلف مستويات المنظمة؟","oe":["It creates a competitive environment among different units within the organization.","It showcases the achievements of the organization’s leadership team.","It enables coordination of activities.","It identifies underperforming employees and takes corrective actions."],"oa":["يخلق بيئة تنافسية ضمن مختلف الوحدات داخل المنظمة","يعرض إنجازات الفريق القيادي للمنظمة","يسمح بتنسيق الأنشطة","يتعرف على الموظفين ضعيفي الأداء ويتخذ الإجراءات التصحيحية"],"c":2,"ch":"Align Competent","ex":"Exam 2 - GRCP","fe":"According to the GRC Capability Model, clarity of objectives across organizational levels ensures:\n\n\n\t\n\tStrategic alignment\n\t\n\t\n\tCoordination between units\n\t\n\t\n\tAvoidance of conflicting initiatives\n\t\n\t\n\tProper allocation of resources\n\t\n\n\nClear objectives prevent siloed operations.\n\n\nAccording to the GRC Capability Model, clarity of objectives across organizational levels ensures:\n\n\n\t\n\tStrategic alignment\n\t\n\t\n\tCoordination between units\n\t\n\t\n\tAvoidance of conflicting initiatives\n\t\n\t\n\tProper allocation of resources\n\t\n\n\nClear objectives prevent siloed operations.\n\n\n \n\nOCEG. (2024). GRC Capability Model v3.5. OCEG.\nSection: Align – Establish Direction & Alignment\n(pp. 94–100)\n\n\n(OCEG, 2024, pp. 94–100)","fa":"وفق نموذج GRC، وضوح الأهداف عبر المستويات التنظيمية يحقق:\n\n\n\t\n\tالمواءمة الاستراتيجية (Strategic Alignment)\n\t\n\t\n\tالتنسيق بين الوحدات\n\t\n\t\n\tتجنب تضارب المبادرات\n\t\n\t\n\tتوجيه الموارد نحو نفس الاتجاه\n\t\n\n\nوضوح الرؤية والأهداف يمنع العمل في جزر منفصلة داخل المنظمة.\n​​​​​​​\n\nOCEG. (2024). GRC Capability Model v3.5. OCEG.\nSection: Align – Establish Direction & Alignment\n(pp. 94–100)\n\n\n(OCEG, 2024, pp. 94–100)"},{"qe":"What is the role of indicators in measuring progress toward objectives?","qa":"ما هو دور المؤشرات في قياس التقدم تجاه الأهداف؟","oe":["Indicators measure quantitative or qualitative progress toward objectives.","Indicators are used to evaluate whether the organization selected appropriate objectives.","Indicators are used to determine whether objectives need to be changed in response to internal or external changes.","Indicators are used to calculate return on investment for various initiatives and projects."],"oa":["تقيس المؤشرات التقدم الكمي أو النوعي تجاه الأهداف","تستخدم المؤشرات لتقييم ملاءمة اختيار المنظمة للأهداف","تستخدم المؤشرات لتحديد مدى ضرورة تغيير الأهداف استجابة لأي تغييرات في السياق الخارجي أو الداخلي","تستخدم المؤشرات لاكتساب العائد من الاستثمار لمختلف المشاريع والمبادرات"],"c":0,"ch":"Align Competent","ex":"Exam 2 - GRCP","fe":"In the GRC model, indicators (KPIs, KRIs, KCIs) are used to:\n\n\n\t\n\tMeasure performance\n\t\n\t\n\tTrack progress\n\t\n\t\n\tDetect deviations\n\t\n\t\n\tSupport decision-making\n\t\n\n\nThey are quantitative or qualitative tools for assessing movement toward objectives.\n \n\nOCEG. (2024). GRC Capability Model v3.5. OCEG.\nSection: Perform – Monitor and Measure\n(pp. 150–160)\n\n\n(OCEG, 2024, pp. 150–160)","fa":"في نموذج GRC، المؤشرات (KPIs, KRIs, KCIs) تُستخدم من أجل:\n\n\n\t\n\tقياس الأداء\n\t\n\t\n\tمتابعة التقدم\n\t\n\t\n\tكشف الانحرافات\n\t\n\t\n\tدعم اتخاذ القرار\n\t\n\n\nوهي أدوات كمية أو نوعية لتقييم مدى الاقتراب من الأهداف الاستراتيجية.\n\nOCEG. (2024). GRC Capability Model v3.5. OCEG.\nSection: Perform – Monitor and Measure\n(pp. 150–160)\n\n\n(OCEG, 2024, pp. 150–160)"},{"qe":"In the Identify process, what is the importance of using both top-down and bottom-up approaches?","qa":"في عملية التعرف، ما أهمية اتباع طرق من الأعلى إلى الأسفل والعكس؟","oe":["To determine the appropriate allocated budget for each department.","To identify a comprehensive set of opportunities, obstacles, and obligations.","To build a clear leadership hierarchy within the organization.","To ensure all employees receive equal recognition for their contributions."],"oa":["لتحديد الميزانية المخصصة المناسبة لكل قسم","تحديد مجموعة متكاملة من الفرص والعقبات والالتزامات","لبناء تسلسل قيادي واضح داخل المنظمة","التقدير الوظيفي موضوع إدارة موارد بشرية، وليس غرض عملية التعرف في GRC."],"c":1,"ch":"Align Competent","ex":"Exam 2 - GRCP","fe":"According to the GRC Capability Model, a top-down approach identifies:\n\n\n\t\n\tStrategic direction\n\t\n\t\n\tEnterprise obligations\n\t\n\t\n\tMajor risks\n\t\n\n\nA bottom-up approach identifies:\n\n\n\t\n\tOperational risks\n\t\n\t\n\tLocal opportunities\n\t\n\t\n\tPractical obligations\n\t\n\n\nCombining both ensures a complete and balanced view.\n \n\nOCEG. (2024). GRC Capability Model v3.5. OCEG.\nSection: Learn – Identify (L component)\n(pp. 72–78)\n\n\n(OCEG, 2024, pp. 72–78)","fa":"وفق نموذج GRC، استخدام المنهج من الأعلى إلى الأسفل (Top-Down) يضمن تحديد:\n\n\n\t\n\tالتوجهات الاستراتيجية\n\t\n\t\n\tالتزامات المنشأة\n\t\n\t\n\tالمخاطر الكبرى\n\t\n\n\nبينما المنهج من الأسفل إلى الأعلى (Bottom-Up) يكشف:\n\n\n\t\n\tالمخاطر التشغيلية\n\t\n\t\n\tالفرص المحلية\n\t\n\t\n\tالالتزامات العملية\n\t\n\n\nالجمع بين الطريقتين يضمن صورة شاملة ومتوازنة.\n\nOCEG. (2024). GRC Capability Model v3.5. OCEG.\nSection: Learn – Identify (L component)\n(pp. 72–78)\n\n\n(OCEG, 2024, pp. 72–78)"},{"qe":"How are opportunities, obstacles, and obligations prioritized for further analysis?","qa":"كيف يتم ترتيب الفرص والعقبات والالتزامات لمواصلة التحليل؟","oe":["Based on related business units and their importance in achieving objectives.","Based on identification criteria and the priority of relevant objectives.","Based on matters defined as top priority at the enterprise level and considered more important than unit-level matters.","Based on executive management team preferences."],"oa":["بناءً على وحدات العمل المرتبطة بها وعلى مدى أهمية هذه الوحدات في تحقيق الأهداف","بناءً على معايير التعرف وأولوية الأهداف ذات الصلة","بناءً على الأمور التي يتم تعريفها على أنها ذات أولوية قصوى على مستوى المنشأة والتي تعد أكبر أهمية من أي أمور على مستوى الوحدة","بناءً على تفضيلات فريق الإدارة التنفيذية"],"c":1,"ch":"Align Competent","ex":"Exam 2 - GRCP","fe":"In the GRC model, prioritization is based on:\n\n\n\t\n\tDefined identification criteria\n\t\n\t\n\tImpact on objectives\n\t\n\t\n\tLikelihood and consequence\n\t\n\t\n\tRelevance to enterprise value\n\t\n\n\nAnalysis is objective-driven, not structure-driven.\n\n \n\nOCEG. (2024). GRC Capability Model v3.5. OCEG.\nSection: Learn – Prioritize (pp. 78–85)","fa":"في نموذج GRC، الترتيب يتم وفق:\n\n\n\t\n\tمعايير واضحة للتعرف\n\t\n\t\n\tمدى تأثير العنصر على تحقيق الأهداف\n\t\n\t\n\tمستوى الاحتمالية والأثر\n\t\n\t\n\tصلته بالقيمة المؤسسية\n\t\n\n\nالتحليل يكون مبنيًا على الأهداف أولًا وليس على الهيكل أو الأشخاص.\n\nOCEG. (2024). GRC Capability Model v3.5. OCEG.\nSection: Learn – Prioritize (pp. 78–85)"},{"qe":"What term is used to describe the positive and desired effect of uncertain conditions on objectives?","qa":"ما هو المصطلح الذي يُطلق على التأثير الإيجابي والمرغوب للأحوال غير المؤكدة على الأهداف؟","oe":["Gains","Development","Obstacle","الربح"],"oa":["المكاسب","التطوير","Obstacle","الربح"],"c":0,"ch":"Align Competent","ex":"Exam 2 - GRCP","fe":"According to the GRC Capability Model:\n\n\n\t\n\tUncertain conditions may result in:\n\n\t\n\t\t\n\t\tA negative impact → Obstacle\n\t\t\n\t\t\n\t\tA positive impact → Gain\n\t\t\n\t\n\t\n\n\nA Gain is the positive effect of uncertainty that enhances or advances objective achievement.\n\n\nOCEG. (2024). GRC Capability Model v3.5. OCEG.\nSection: Learn – Identify (Uncertain Conditions Classification)\n(pp. 73–76)","fa":"وفق نموذج GRC Capability Model:\n\n\n\t\n\tالأحوال غير المؤكدة قد تؤدي إلى:\n\n\t\n\t\t\n\t\tتأثير سلبي → عقبة (Obstacle)\n\t\t\n\t\t\n\t\tتأثير إيجابي → مكسب (Gain)\n\t\t\n\t\n\t\n\n\nالمكاسب هي التأثير الإيجابي الناتج عن حالة عدم يقين تؤدي إلى تحسين النتائج أو تعزيز تحقيق الأهداف.\n\nOCEG. (2024). GRC Capability Model v3.5. OCEG.\nSection: Learn – Identify (Uncertain Conditions Classification)\n(pp. 73–76)"},{"qe":"What is the duality of compliance, and how does it relate to both risk and compliance?","qa":"ما هي ازدواجية الامتثال، وكيف ترتبط بكل من المخاطر والامتثال؟","oe":["The duality of compliance means that compliance requirements arise from both external requirements and internal policies","The duality of compliance refers to the fact that compliance is only related to external stakeholders and not to the organization itself","The duality of compliance refers to the fact that obligations represent both aspects of risk and compliance. Compliance involves meeting certain requirements, while the risks associated with compliance include the possibility of harm or damage.","The duality of compliance means that compliance requirements can be fulfilled and ignored at the same time in different parts of the organization"],"oa":["تعني ازدواجية الامتثال أن متطلبات الامتثال تنشأ عن كل من المتطلبات الخارجية والسياسات الداخلية","تشير ازدواجية الامتثال إلى حقيقة أن الامتثال له علاقة فقط بأصحاب المصلحة الخارجيين، وليس بالمنظمة ذاتها","تشير ازدواجية الامتثال إلى حقيقة أن الالتزامات تمثل كلًّا من نواحي المخاطر والامتثال، ويشمل الامتثال تلبية متطلبات معينة، بينما المخاطر المتعلقة بالامتثال تشمل احتمال وقوع الأذى أو الضرر","تعني ازدواجية الامتثال أن متطلبات الامتثال يمكن تلبيتها وتجاهلها في الوقت ذاته وفي مختلف أجزاء المنظمة"],"c":2,"ch":"Perform Competent","ex":"Exam 2 - GRCP","fe":"According to the GRC Capability Model:\n\nCompliance has a dual nature:\n\n\n\t\n\tIt is about fulfilling obligations.\n\t\n\t\n\tIt also carries risk implications.\n\t\n\n\nMeaning:\n\n\n\t\n\tCompliance = Meeting obligations\n\t\n\t\n\tCompliance Risk = The probability and impact of failing to meet those obligations\n\t\n\n\nThis dual perspective connects compliance directly with risk management.\n \n\nOCEG. (2024). GRC Capability Model v3.5. OCEG.\nSection: Obligations and Compliance Risk (pp. 75–79).","fa":"وفق نموذج GRC Capability Model:\n\nازدواجية الامتثال تعني أن:\n\n\n\t\n\tالامتثال ليس مجرد \"تنفيذ متطلبات\"\n\t\n\t\n\tبل يرتبط أيضاً بمفهوم المخاطر\n\t\n\n\nأي أن:\n\n\n\t\n\tالامتثال = تلبية الالتزامات\n\t\n\t\n\tمخاطر الامتثال = احتمال التعرض لأذى أو خسارة نتيجة عدم الامتثال\n\t\n\n\nإذن الالتزام له بعدان:\n\n\n\t\n\tبعد تنظيمي/تنفيذي\n\t\n\t\n\tبعد مخاطري (احتمالية الضرر)\n\t\n\n\nوهذا هو جوهر مفهوم الازدواجية.\n\n \n\nOCEG. (2024). GRC Capability Model v3.5. OCEG.\nSection: Obligations and Compliance Risk (pp. 75–79)."},{"qe":"What is the purpose of defining design criteria?","qa":"ما الغرض من تحديد معايير التصميم؟","oe":["To establish a timeline for implementing the design","To determine the budget allocated to the design project","To identify the key stakeholders involved in the design process","To guide, constrain, and tailor how procedures and controls are prioritized in order to achieve acceptable levels of risk, gains, and compliance"],"oa":["لوضع جدول زمني لتنفيذ التصميم","لتحديد الميزانية المخصصة لمشروع التصميم","للتعرّف على أصحاب المصلحة الرئيسيين المشاركين في عملية التصميم","لتوجيه وتقييد وتخصيص كيفية ترتيب أولويات الإجراءات والضوابط من أجل تحقيق مستويات مقبولة للمخاطر والمكاسب والامتثال"],"c":3,"ch":"Align Competent","ex":"Exam 2 - GRCP","fe":"Within the GRC Capability Model,\nDesign criteria are not about budget or scheduling.\n\nThey are used to:\n\n\n\t\n\tDefine acceptable risk levels\n\t\n\t\n\tDefine desired gains\n\t\n\t\n\tEstablish compliance expectations\n\t\n\t\n\tGuide prioritization of controls and procedures\n\t\n\n\nDesign criteria act as a decision framework ensuring balanced performance.\n\nOCEG. (2024). GRC Capability Model v3.5. OCEG.\nSection: Align – Design Criteria (pp. 118–122)","fa":"في نموذج GRC Capability Model،\nتحديد معايير التصميم (Design Criteria) لا يتعلق بالميزانية أو الجدول الزمني، بل يتعلق بـ:\n\n\n\t\n\tتحديد ما هو مقبول من المخاطر\n\t\n\t\n\tتحديد ما هو مرغوب من المكاسب\n\t\n\t\n\tتحديد مستوى الامتثال المطلوب\n\t\n\t\n\tتوجيه كيفية ترتيب أولويات الضوابط والإجراءات\n\t\n\n\nأي أن معايير التصميم تعمل كـ إطار مرجعي لاتخاذ القرار أثناء تصميم نظام الضوابط.\n\nهي بمثابة “حدود وضوابط توجيهية” تضمن أن التصميم:\n\n\n\tلا يبالغ في تقليل المخاطر\n\tلا يهمل المكاسب\n\tلا يفشل في الامتثال\n\n\n \n\nOCEG. (2024). GRC Capability Model v3.5. OCEG.\nSection: Align – Design Criteria (pp. 118–122)"},{"qe":"What is the value of having an integrated plan?","qa":"ما قيمة وجود خطة متكاملة؟","oe":["To ensure that all internal stakeholders of the organization agree on the mission, vision, and values","To provide a detailed inventory of the organization's physical assets and available resources to address opportunities and requirements","To establish a data-sharing system using spreadsheets and shared file directories used by each unit within the organization","To ensure that all major opportunities, obstacles, and obligations are addressed, and that performance, risk, and compliance levels are acceptable"],"oa":["لضمان أن جميع أصحاب المصلحة الداخليين للمنظمة على وفاق فيما يتعلق بالمهمة والرؤية والقيم","لتوفير جرد مفصل لأصول المنظمة المادية والموارد المتاحة للتعامل مع الفرص والمتطلبات","لوضع نظام لمشاركة البيانات من خلال جداول البيانات وأدلة مشاركة الملفات التي تستخدمها كل وحدة داخل المنظمة","لضمان التعامل مع جميع الفرص والعقبات والمتطلبات الرئيسية، وأن مستويات الأداء والمخاطر والامتثال مقبولة"],"c":3,"ch":"Align Competent","ex":"Exam 2 - GRCP","fe":"An integrated plan connects:\n\n\n\t\n\tObjectives\n\t\n\t\n\tRisks\n\t\n\t\n\tGains\n\t\n\t\n\tObligations\n\t\n\t\n\tControls\n\t\n\n\nIt is central to achieving Principled Performance.\n \n\nOCEG. (2024). GRC Capability Model v3.5. OCEG.\nSection: Align – Integrated Planning (pp. 132–136)","fa":"الخطة المتكاملة تربط بين:\n\n\n\t\n\tالأهداف (Objectives)\n\t\n\t\n\tالمخاطر (Risks)\n\t\n\t\n\tالمكاسب (Gains)\n\t\n\t\n\tالالتزامات (Obligations)\n\t\n\t\n\tالضوابط (Controls)\n\t\n\n\nوهي نتيجة منطقية لمفهوم Principled Performance.\n\n\nOCEG. (2024). GRC Capability Model v3.5. OCEG.\nSection: Align – Integrated Planning (pp. 132–136)"},{"qe":"What is the importance of having assurance controls within the Perform component?","qa":"ما أهمية وجود ضوابط الضمان في مكون (التنفيذ)؟","oe":["Enhancing transparency and accountability in the organization’s decision-making processes","Ensuring the accuracy and reliability of the organization's financial reports","Establishing a clear leadership chain and administrative hierarchy within the organization","Providing objective information to assurance providers when management and governance controls are insufficient"],"oa":["تعزيز الشفافية والمساءلة في عمليات اتخاذ القرار بالمنظمة","ضمان دقة وموثوقية التقارير المالية للمنظمة","تأسيس سلسلة قيادية وتسلسل إداري واضح داخل المنظمة","توفير المعلومات الواقعية لمزودي الضمان عندما لا تكفي إجراءات وضوابط الإدارة والحوكمة"],"c":0,"ch":"Perform Competent","ex":"Exam 2 - GRCP","fe":"In the GRC Capability Model,\nAssurance controls within the Perform component:\n\n\n\t\n\tProvide independent evaluation of control effectiveness\n\t\n\t\n\tIncrease transparency\n\t\n\t\n\tStrengthen accountability\n\t\n\t\n\tBuild stakeholder confidence\n\t\n\n\nAssurance is not merely reporting — it is independent verification that governance and risk processes are functioning as intended.\n \n\nOCEG. (2024). GRC Capability Model v3.5. OCEG.\nSection: Perform – Assurance (pp. 158–162)","fa":"في نموذج GRC،\nضوابط الضمان (Assurance Controls) في مكون Perform (التنفيذ) تهدف إلى:\n\n\n\t\n\tالتحقق المستقل من فعالية الضوابط\n\t\n\t\n\tتعزيز الثقة في الأداء\n\t\n\t\n\tدعم المساءلة\n\t\n\t\n\tزيادة الشفافية أمام أصحاب المصلحة\n\t\n\n\nالضمان لا يقتصر على المعلومات، بل يضيف طبقة مستقلة من التقييم والتأكيد (Independent Evaluation).\n\n \n\nOCEG. (2024). GRC Capability Model v3.5. OCEG.\nSection: Perform – Assurance (pp. 158–162)\n\n \n\nوجود ضمان فعّال يعزز:\n\n\n\t\n\tالثقة (Confidence)\n\t\n\t\n\tالشفافية (Transparency)\n\t\n\t\n\tالمساءلة (Accountability)\n\t\n\n\nوهي عناصر جوهرية في الأداء المنضبط (Principled Performance)."},{"qe":"When are additional governance procedures and controls added within the Perform component?","qa":"متى يتم إضافة إجراءات وضوابط أخرى للحوكمة في مكون (التنفيذ)؟","oe":["When the organization undergoes major restructuring or reorganization","When the organization faces a catastrophic crisis or emergency","When management procedures and controls do not provide sufficient information or guidance to direct and constrain the organization","When the organization is subject to new legal or regulatory requirements"],"oa":["عندما تخضع المنظمة لإعادة الهيكلة أو التنظيم بشكل كبير","عندما تواجه المنظمة أزمة كارثية أو حالة طارئة","عندما لا توفر إجراءات وضوابط الإدارة ما يكفي من المعلومات أو الإرشاد لتقييد وتخصيص المنظمة","عندما تتعرض المنظمة لمتطلبات قانونية أو نظامية جديدة"],"c":2,"ch":"Perform Competent","ex":"Exam 2 - GRCP","fe":"In the GRC Capability Model,\nAdditional governance controls are introduced within the Perform component when:\n\n\n\t\n\tManagement controls are insufficient\n\t\n\t\n\tThere is inadequate guidance\n\t\n\t\n\tInformation is not reliable enough\n\t\n\t\n\tOrganizational direction is unclear\n\t\n\n\nIn other words:\n\n\nGovernance controls are strengthened when gaps appear in direction, constraint, or reliable information.\n\n\nGovernance is adaptive, not static.\n\nOCEG. (2024). GRC Capability Model v3.5. OCEG.\nSection: Perform – Governance & Control Adaptation (pp. 150–155)","fa":"في نموذج GRC Capability Model،\nتُضاف ضوابط أو إجراءات حوكمة إضافية داخل مكون Perform (التنفيذ) عندما:\n\n\n\t\n\tلا تكون ضوابط الإدارة كافية\n\t\n\t\n\tلا توفر معلومات موثوقة لاتخاذ القرار\n\t\n\t\n\tلا تُقيد المنظمة ضمن الحدود المقبولة\n\t\n\t\n\tلا تحقق التوازن بين المخاطر والمكاسب والالتزامات\n\t\n\n\nبمعنى آخر:\n\n\nيتم تعزيز الضوابط عندما تظهر فجوة في التوجيه أو المعلومات أو القدرة على التحكم.\n\n\nالنموذج يؤكد أن الحوكمة ليست ثابتة، بل ديناميكية، ويتم تقويتها عند الحاجة لسد فجوات الأداء أو الانضباط.\n\nOCEG. (2024). GRC Capability Model v3.5. OCEG\nSection: Perform – Governance & Control Adaptation (pp 150 155)"},{"qe":"What is the fundamental structure followed by the (IACM) model when dealing with opportunities, obstacles, and obligations?","qa":"ما هو التركيب الأساسي الذي يتبعه نموذج (IACM) عند التعامل مع الفرص والعقبات والالتزامات؟","oe":["It is a “Before, During, and After” structure to prioritize short-term gains over long-term objectives.","It is a “Before, During, and After” structure to preserve the design of each control element before undesirable events occur, and then compare it with the modified design after the event occurs.","It is a “Before, During, and After” structure to classify obstacles, opportunities, and obligations in order to easily assign and evaluate responsibility for each.","It is a “Before, During, and After” structure and “desirable and undesirable events” to reduce the (likelihood and impact) of undesirable events and behaviors, and enhance the (likelihood and impact) of desirable events and behaviors."],"oa":["هو تركيبة \"قبل وأثناء وبعد\" لإعطاء الأولوية للمكاسب قصيرة المدى على الأهداف طويلة المدى.","هو تركيبة \"قبل وأثناء وبعد\" لحفظ تصميم كل عنصر من الإجراءات أو الضوابط قبل وقوع الأحداث غير المرغوبة، ومن ثم مقارنته بذلك التصميم الذي يتم تعديله بعد وقوع الحدث.","هو تركيبة \"قبل وأثناء وبعد\" لتصنيف العقبات والفرص والالتزامات لكي يتسنى بسهولة تعيين وتقييم المسؤولية لكل منها.","هو تركيبة \"قبل وأثناء وبعد\" و\"الأحداث المرغوبة وغير المرغوبة\" للتقليل من تأثير (الاحتمالية والأثر) الأحداث والسلوكيات غير المرغوبة، وتعزيز تأثير (الاحتمالية والأثر) الأحداث والسلوكيات المرغوبة."],"c":3,"ch":"Perform Competent","ex":"Exam 2 - GRCP","fe":"This accurately reflects the philosophy of the GRC Capability Model.\nThe model addresses:\n\n\n\t\n\tDesirable events (Opportunities)\n\t\n\t\n\tUndesirable events (Risks / Compliance failures)\n\t\n\n\nIt applies controls:\n\n\n\t\n\tBefore the event (Preventive)\n\t\n\t\n\tDuring the event (Detective/Responsive)\n\t\n\t\n\tAfter the event (Corrective/Recovery)\n\t\n\n\nWith the objective of:\n\n\n\t\n\tReducing likelihood and impact of undesirable events\n\t\n\t\n\tEnhancing likelihood and impact of desirable events\n\t\n\n\nThis represents the integrated nature of Governance, Risk, and Compliance.\n\nOCEG. (2023). GRC Capability Model 3.5: Principled Performance. OCEG (Open Compliance & Ethics Group).","fa":"هذا يعكس بدقة فلسفة GRC Capability Model.\nالنموذج ينظر إلى:\n\n\n\t\n\tالأحداث المرغوبة (Opportunities)\n\t\n\t\n\tالأحداث غير المرغوبة (Risks / Compliance failures)\n\t\n\n\nويطبق عليها ضوابط:\n\n\n\t\n\tقبل الحدث (Preventive)\n\t\n\t\n\tأثناء الحدث (Detective)\n\t\n\t\n\tبعد الحدث (Corrective)\n\t\n\n\nبهدف:\n\n\n\t\n\tتقليل الاحتمالية والأثر للأحداث غير المرغوبة\n\t\n\t\n\tتعزيز الاحتمالية والأثر للأحداث المرغوبة\n\t\n\n\nوهذا هو جوهر التكامل بين Governance وRisk وCompliance.        \n\nOCEG. (2023). GRC Capability Model 3.5: Principled Performance. OCEG (Open Compliance & Ethics Group)."},{"qe":"What are some examples of categories of actions and controls as described in the (IACM) model?","qa":"ما هي بعض أمثلة فئات الإجراءات والضوابط حسب وصفها في نموذج (IACM)؟","oe":["Policies, changing procedures, sanctions, incentives, and employee training","Outsourcing, downsizing, and automation as primary means of controls","Policies, people, procedures, physical resources, informational, technological, and financial controls and actions","Random selection, trial and error, and reliance on intuition and experience"],"oa":["السياسات وتغيير الإجراءات والعقوبات والحوافز وتدريب الموظفين","الاستعانة بالمصادر الخارجية وتقليص الحجم والأتمتة كوسيلة رئيسية للضوابط","الإجراءات والضوابط الخاصة بالسياسات والأشخاص وإجراءات العمل والموارد المادية والمعلوماتية والتقنية والمالية","الاختيار العشوائي والتجربة والخطأ والاعتماد على الحدس والخبرة"],"c":2,"ch":"Perform Competent","ex":"Exam 2 - GRCP","fe":"Policies, people, procedures, physical resources, informational, technological, and financial controls and actions\nThis directly reflects the IACM classification of control categories, which include policies, people, processes, physical resources, information, technology, and financial resources.","fa":"في نموذج Integrated Action & Control Model (IACM™) يوضح الكتاب أن الضوابط والإجراءات تُصنَّف ضمن فئات تشمل:\n\n\n\t\n\tالسياسات (Policies)\n\t\n\t\n\tالأشخاص (People)\n\t\n\t\n\tالعمليات والإجراءات (Processes/Procedures)\n\t\n\t\n\tالموارد المادية (Physical Resources)\n\t\n\t\n\tالمعلومات (Information)\n\t\n\t\n\tالتكنولوجيا (Technology)\n\t\n\t\n\tالموارد المالية (Financial Resources)\n\t\n\n\nوهذه الفئات تمثل البنية الشاملة لأنواع الضوابط والإجراءات داخل مكون التنفيذ (Perform).\n\nOCEG. (2024). نموذج قدرات الحوكمة والمخاطر والامتثال – الإصدار 3.5 (النسخة المميزة). صفحة 77."},{"qe":"What type of policies provide guidance about the actions that the organization should follow?","qa":"ما نوع السياسات التي تقدم إرشادات حول الإجراءات التي يجب أن تتبعها المنظمة؟","oe":["Code of Ethical Conduct Policy","Preferred Conduct Policy","Procedural Policy","Prohibited Conduct Policy"],"oa":["سياسة السلوك الأخلاقي","سياسة السلوك المستحب","سياسة الإجراءات","سياسة السلوك المكروه"],"c":2,"ch":"Perform Competent","ex":"Exam 2 - GRCP","fe":"Procedural policies define the specific steps and actions that must be followed within the organization. They translate high-level direction into actionable guidance.\n\nOCEG. (2024). GRC Capability Model™ Version 3.5 – Premium Edition. OCEG. pp. 135–137.","fa":"سياسة الإجراءات يعتبر من السياسات الذي يحدد الخطوات والإجراءات العملية التي يجب اتباعها داخل المنظمة. فهو يترجم التوجيهات العامة إلى تعليمات تنفيذية واضحة.\n\nOCEG. (2024). GRC Capability Model™ Version 3.5 – Premium Edition. OCEG. pp. 135–137."},{"qe":"Why is it important to tailor policies to the audience, local culture, language, and legal requirements?","qa":"ما أهمية ملاءمة السياسات للجمهور والثقافة المحلية واللغة والمتطلبات القانونية؟","oe":["This tailoring enables the local audience to better understand policies and their rationale, increasing the likelihood of compliance","It is not necessary because policies should remain uniform throughout the organization","It facilitates mergers and acquisitions across regions","It is important because each geographic unit needs to control employee behavior"],"oa":["هذه الملاءمة تمكن الجمهور المحلي من فهم السياسات وأسبابها بشكل أفضل، مما يزيد احتمالية التقيد بها","ليست ضرورية لأنه ينبغي أن تبقى السياسات موحدة ولا تتغير في أنحاء المنظمة لضمان سلوك ثابت وموحد","تسهل عمليات الدمج والاستحواذ عبر مناطق جغرافية ذات ثقافات ولغات ومتطلبات قانونية مختلفة","هي مهمة لأن إدارة كل وحدة جغرافية للمنظمة في حاجة للسيطرة على سلوك موظفيها"],"c":0,"ch":"Perform Competent","ex":"Exam 2 - GRCP","fe":"According to the GRC Capability Model, there is a clear structural distinction between:\n\n\n\t\n\tValues\n\t\n\t\n\tPolicies\n\t\n\t\n\tProcedures\n\t\n\t\n\tControls\n\t\n\n\nA Procedures Policy operationalizes direction. It translates high-level governance intent into concrete, executable steps.\n\nIt defines:\n\n\n\t\n\tWhat must be done\n\t\n\t\n\tHow it must be done\n\t\n\t\n\tWho is responsible\n\t\n\t\n\tWhen and under what conditions\n\t\n\n\nThis aligns with the model’s principle of converting governance direction into operational execution.\n\n\n📘 Reference \n\nOCEG. (2024). GRC Capability Model™ Version 3.5 – Premium Edition. OCEG. pp. 135–137.","fa":"وفقًا لنموذج GRC Capability Model، هناك تمييز واضح بين:\n\n\n\t\n\tالقيم (Values)\n\t\n\t\n\tالسياسات (Policies)\n\t\n\t\n\tالإجراءات (Procedures)\n\t\n\t\n\tالضوابط (Controls)\n\t\n\n\nسياسة الإجراءات هي المستوى الذي يترجم التوجيه الاستراتيجي إلى تعليمات تنفيذية واضحة.\nأي أنها تحدد:\n\n\n\t\n\tماذا يجب فعله\n\t\n\t\n\tكيف يجب فعله\n\t\n\t\n\tمن المسؤول\n\t\n\t\n\tمتى يتم التنفيذ\n\t\n\n\nوهذا يتوافق مع مبدأ Operationalization of Direction في مكون Align وPerform، حيث تتحول التوجيهات العليا إلى إجراءات قابلة للتطبيق.\n\n\n📘 Reference \n\nOCEG. (2024). GRC Capability Model™ Version 3.5 – Premium Edition. OCEG. pp. 135–137."},{"qe":"What is the purpose of reviewing the information obtained from monitoring and assurance activities?","qa":"ما الغرض من مراجعة المعلومات التي يتم الحصول عليها من عمليتي المراقبة والضمان؟","oe":["Determining the effectiveness of strategies","Identifying opportunities for improvement","Assessing the financial stability of the organization","Evaluating employee performance"],"oa":["تحديد فعالية الاستراتيجيات","التعرف على فرص التحسين","تقييم الاستقرار المالي للمنظمة","تقييم أداء الموظفين"],"c":0,"ch":"Review Competent","ex":"Exam 2 - GRCP","fe":"Within the Review component of the GRC Capability Model:\n\n\n\t\n\tMonitoring provides performance feedback.\n\t\n\t\n\tAssurance provides independent validation.\n\t\n\n\nReviewing this information allows leadership to determine whether strategies, controls, and governance mechanisms are functioning as intended and achieving desired outcomes.\n\nOCEG. (2024). GRC Capability Model™ Version 3.5 – Premium Edition. OCEG. pp. 210–215.","fa":"في مكون Review من نموذج GRC، يتم:\n\n\n\t\n\tتحليل نتائج المراقبة (Monitoring)\n\t\n\t\n\tتحليل نتائج الضمان (Assurance)\n\t\n\n\nوذلك بهدف:\n\n\n\t\n\tقياس مدى تحقيق الأهداف الاستراتيجية\n\t\n\t\n\tتقييم كفاءة الضوابط\n\t\n\t\n\tالتأكد من اتساق التنفيذ مع التوجيه\n\t\n\n\nبالتالي فإن الغرض الأساسي هو تقييم فعالية الاستراتيجية ككل.               \nOCEG. (2024). GRC Capability Model™ Version 3.5 – Premium Edition. OCEG. pp. 210–215."},{"qe":"What is the primary objective of “Agility” as a method of improvement?","qa":"ما الهدف الرئيسي من \"الرشاقة\" كإحدى طرق التحسين؟","oe":["Doubling profits and shareholder value","Enhancing customer satisfaction and loyalty","Eliminating waste and increasing efficiency","Improving communication and collaboration"],"oa":["مضاعفة الأرباح وقيمة المساهمين","تعزيز رضا العملاء وولائهم","القضاء على الهدر ورفع الكفاءة","تحسين التواصل والتعاون"],"c":2,"ch":"Review Competent","ex":"Exam 2 - GRCP","fe":"Agility within governance and operational improvement emphasizes:\n\n\n\t\n\tWaste reduction\n\t\n\t\n\tProcess simplification\n\t\n\t\n\tFaster adaptation\n\t\n\t\n\tContinuous improvement\n\t\n\n\nIt aligns conceptually with Lean thinking.\n\nOCEG. (2024). GRC Capability Model™ Version 3.5 – Premium Edition. OCEG. pp. 220–223.","fa":"في سياق التحسين المستمر داخل GRC:\n\nالرشاقة تعني:\n\n\n\t\n\tتقليل التعقيد\n\t\n\t\n\tإزالة الهدر\n\t\n\t\n\tتسريع الاستجابة\n\t\n\t\n\tتحسين تدفق العمليات\n\t\n\n\nوهي مرتبطة بمفاهيم Lean وContinuous Improvement.    \n\nOCEG. (2024). GRC Capability Model™ Version 3.5 – Premium Edition. OCEG. pp. 220–223."},{"qe":"What is the importance of maintaining accurate communication management records?","qa":"ما أهمية الاحتفاظ بسجلات دقيقة لإدارة التواصل؟","oe":["Demonstrates compliance to regulatory authorities","Provides evidence to be used by assurance and mandatory compliance efforts","Eliminates the need for a communication strategy framework","Ensures that all communication is formal"],"oa":["يثبت الامتثال للجهات التنظيمية","يوفر الأدلة ليتم استخدامها من قبل جهود الضمان والامتثال الإجباري","يحول دون الحاجة إلى إطار استراتيجية التواصل","يضمن أن جميع أوجه التواصل رسمية"],"c":1,"ch":"Perform Competent","ex":"Exam 1 - GRCP","fe":"Within GRC, governance activities must be auditable.\nAccurate communication records provide:\n\n\n\t\n\tTraceability\n\t\n\t\n\tAudit readiness\n\t\n\t\n\tAssurance support\n\t\n\t\n\tRegulatory defensibility\n\t\n\n\nThis supports evidence-based governance and compliance validation.\n\nOCEG. (2024). GRC Capability Model™ Version 3.5 – Premium Edition. OCEG. pp. 181–185.","fa":"في GRC، كل نشاط حوكمي يجب أن يكون قابلاً للتدقيق.\nالسجلات الدقيقة توفر:\n\n\n\t\n\tقابلية التتبع (Traceability)\n\t\n\t\n\tقابلية المراجعة (Auditability)\n\t\n\t\n\tدعم أنشطة الضمان (Assurance Support)\n\t\n\t\n\tدليل عند التحقيقات أو المراجعات التنظيمية\n\t\n\n\nوهذا يعكس مفهوم \"Evidence-Based Governance\".         \n\nOCEG. (2024). GRC Capability Model™ Version 3.5 – Premium Edition. OCEG. pp. 181–185."},{"qe":"Which of the following refers to the capabilities that a learner acquires after the educational activity?","qa":"أي من التالي يشير إلى القدرات التي يكتسبها المتعلم بعد النشاط التعليمي؟","oe":["Instructional Content","Learning Outcome","Assessment of Learning","Learning Objective"],"oa":["المحتوى التعليمي","حصيلة التعلم","تقييم التعلم","الهدف التعليمي"],"c":1,"ch":"Perform Competent","ex":"Exam 2 - GRCP","fe":"Within learning design frameworks (including GRC’s Education element):\n\nThere is a progression:\n\n\n\t\n\tLearning Objective – Intended result\n\t\n\t\n\tInstructional Content – Delivered material\n\t\n\t\n\tAssessment – Measurement method\n\t\n\t\n\tLearning Outcome – Actual acquired capability\n\t\n\n\nThe question explicitly refers to “capabilities acquired after the educational activity,” which aligns directly with Learning Outcomes.\n \n\nOCEG. (2024). GRC Capability Model™ Version 3.5 – Premium Edition. OCEG. pp. 168–172.\n(Section: Education and Learning within Perform Component)","fa":"في سياق التعليم والتطوير داخل GRC (خصوصًا في عنصر P3 – Education):\n\nهناك تسلسل منطقي:\n\n\n\t\n\tالهدف التعليمي (Learning Objective) – ما نريد تحقيقه\n\t\n\t\n\tالمحتوى التعليمي (Content) – ما نقدمه\n\t\n\t\n\tالتقييم (Assessment) – كيف نقيس\n\t\n\t\n\tحصيلة التعلم (Learning Outcome) – ما تم تحقيقه فعليًا\n\t\n\n\nحصيلة التعلم تركز على القدرات الفعلية المكتسبة وليس على النية أو التوقع.\n\nOCEG. (2024). GRC Capability Model™ Version 3.5 – Premium Edition. OCEG. pp. 168–172.\n(Section: Education and Learning within Perform Component)"},{"qe":"What is the term used to describe the difference between the current skill level and the targeted skill level?","qa":"اذا يُطلق على الفرق بين مستوى المهارات الحالي ومستوى المهارات المستهدف؟","oe":["Training Needs","Skill Set","Skills Gap","Learning Objective"],"oa":["الاحتياجات التعليمية","مجموعة المهارات","فجوة المهارات","الهدف التعليمي"],"c":2,"ch":"Perform Competent","ex":"Exam 2 - GRCP","fe":"In learning and capability development frameworks (including GRC’s Education component):\n\nThe process involves:\n\n\n\t\n\tIdentifying current skill levels\n\t\n\t\n\tDefining target skill levels\n\t\n\t\n\tMeasuring the difference\n\t\n\n\nThis difference is called the Skills Gap.\n\nSkills gap analysis supports:\n\n\n\t\n\tStrategic workforce development\n\t\n\t\n\tCompetency alignment\n\t\n\t\n\tTargeted training interventions\n\t \n\n\tOCEG. (2024). GRC Capability Model™ Version 3.5 – Premium Edition. OCEG. pp. 168–172.\n\t(Section: Education, Competency, and Skills Development)","fa":"في منهجيات التعليم والتطوير (وخاصة ضمن مكون Education في GRC):\n\nيتم أولاً:\n\n\n\t\n\tتحديد المستوى الحالي للمهارات\n\t\n\t\n\tتحديد المستوى المستهدف\n\t\n\t\n\tقياس الفرق بينهما\n\t\n\n\nهذا الفرق يسمى فجوة المهارات (Skills Gap).\n\nتحليل فجوة المهارات يساعد على:\n\n\n\tتحديد برامج التدريب المطلوبة\n\tتحسين الكفاءة المؤسسية\n\tمواءمة القدرات مع الاستراتيجية\n\n\n\nOCEG. (2024). GRC Capability Model™ Version 3.5 – Premium Edition. OCEG. pp. 168–172.\n(Section: Education, Competency, and Skills Development)"},{"qe":"What are some examples of non-economic incentives that may be used to encourage desirable behaviors?","qa":"ما هي بعض أمثلة الحوافز غير الاقتصادية التي يمكن استخدامها لتشجيع السلوكيات المرغوبة؟","oe":["Recognition, status, and professional development","Health insurance, retirement plans, paid leave, and sick leave","Gift baskets, additional leave, and employee contests","Stock options, salary increases, bonuses, and profit-sharing"],"oa":["التقدير والمكانة والتطوير المهني","التأمين الصحي وخطط التقاعد والإجازات مدفوعة الأجر والإجازات المرضية","سلال الهدايا والإجازات الإضافية ومسابقات الموظفين","خيارات الأسهم وزيادة الراتب والعلاوات ومشاركة الأرباح"],"c":0,"ch":"Perform Competent","ex":"Exam 2 - GRCP","fe":"Non-economic incentives influence intrinsic motivation by:\n\n\n\t\n\tProviding recognition\n\t\n\t\n\tEnhancing status\n\t\n\t\n\tSupporting career development\n\t\n\n\nThey foster long-term cultural alignment rather than short-term transactional motivation.\n\nOCEG. (2024). GRC Capability Model™ Version 3.5 – Premium Edition. OCEG. pp. 188–190.","fa":"الحوافز غير الاقتصادية تركز على:\n\n\n\t\n\tالتقدير المعنوي\n\t\n\t\n\tالسمعة والمكانة\n\t\n\t\n\tفرص النمو والتطور\n\t\n\n\nوهي تؤثر على الدافعية الداخلية (Intrinsic Motivation)، مما يجعلها أكثر استدامة من الحوافز المالية فقط.\n\nOCEG. (2024). GRC Capability Model™ Version 3.5 – Premium Edition. OCEG. pp. 188–190."},{"qe":"How do inconsistent incentives affect the perceptions of employees and business partners?","qa":"كيف تؤثر الحوافز غير المتسقة على تصور الموظفين وشركاء العمل؟","oe":["They may reduce the risk of legal disputes","They may improve the company’s public image","They may increase employee motivation and productivity","They may lead to perceptions of favoritism and a lack of trust"],"oa":["يمكن أن تقلل من مخاطر النزاعات القانونية","يمكن أن تحسن الصورة العامة للشركة","يمكن أن تزيد من تحفيز الموظفين وإنتاجيتهم","يمكن أن تؤدي إلى تصورات عن التفضيل وانعدام الثقة"],"c":3,"ch":"Perform Competent","ex":"Exam 2 - GRCP","fe":"When incentives are inconsistent, unfair, or non-transparent:\n\n\n\t\n\tEmployees may perceive favoritism\n\t\n\t\n\tTrust in leadership declines\n\t\n\t\n\tOrganizational culture deteriorates\n\t\n\t\n\tEthical risks increase\n\t\n\n\nIn GRC, fairness and consistency are critical to sustaining institutional trust.\n\nWithin the GRC framework, incentive systems must be:\n\n\n\t\n\tConsistent\n\t\n\t\n\tFair\n\t\n\t\n\tTransparent\n\t\n\t\n\tValues-aligned\n\t\n\n\nInconsistency undermines principled performance by:\n\n\n\t\n\tEroding institutional trust\n\t\n\t\n\tWeakening ethical culture\n\t\n\t\n\tIncreasing misconduct risk\n\t\n\t\n\tDamaging stakeholder relationships\n\t\n\n\nTrust is a governance asset; inconsistent incentives erode it.\n \n\nOCEG. (2024). GRC Capability Model™ Version 3.5 – Premium Edition. OCEG. pp. 186–192. (Section: Perform – Incentives & Ethical Culture)","fa":"عندما تكون الحوافز غير متسقة أو غير عادلة أو غير شفافة:\n\n\n\t\n\tقد يشعر بعض الموظفين بوجود تفضيل\n\t\n\t\n\tينخفض مستوى الثقة في الإدارة\n\t\n\t\n\tتتأثر الثقافة المؤسسية سلبًا\n\t\n\t\n\tتزداد مخاطر السلوك غير الأخلاقي\n\t\n\n\nضمن إطار GRC، العدالة والاتساق عنصران أساسيان للحفاظ على الثقة المؤسسية.\n\nفي نموذج GRC Capability Model، الحوافز يجب أن تكون:\n\n\n\t\n\tمتسقة (Consistent)\n\t\n\t\n\tعادلة (Fair)\n\t\n\t\n\tشفافة (Transparent)\n\t\n\t\n\tمرتبطة بالقيم (Values-based)\n\t\n\n\nإذا لم تكن كذلك، فإن ذلك يؤدي إلى:\n\n\n\t\n\tتآكل الثقة المؤسسية\n\t\n\t\n\tضعف الثقافة الأخلاقية\n\t\n\t\n\tارتفاع مخاطر السلوك غير المنضبط\n\t\n\t\n\tزيادة احتمالية الانحرافات التنظيمية\n\t\n\n\nوهذا يتعارض مع مبدأ Principled Performance.\n\n\nOCEG. (2024). GRC Capability Model™ Version 3.5 – Premium Edition. OCEG. pp. 186–192. (Section: Perform – Incentives & Ethical Culture)"},{"qe":"When should the identity of stakeholders not be disclosed when submitting complaints through notification channels?","qa":"متى ينبغي عدم الكشف عن هوية أصحاب المصلحة عند تقديم الشكاوى من خلال قنوات الإشعار؟","oe":["Anonymity should only be provided to non-employee stakeholders","Anonymity should be provided when legally permitted or required","Anonymity should never be provided because it encourages malicious reporting","Anonymity should be provided only when the issue is of minor importance"],"oa":["ينبغي توفير خيار إخفاء الهوية فقط لأصحاب المصلحة من غير موظفي المنظمة","ينبغي توفير خيار إخفاء الهوية عندما يكون مسموحاً أو مطلوباً قانونياً","ينبغي عدم توفير خيار إخفاء الهوية أبداً حيث يحفز ذلك على الإبلاغ الكيدي","ينبغي توفير خيار إخفاء الهوية فقط عندما تكون المسألة ذات أهمية ضئيلة"],"c":1,"ch":"Perform Competent","ex":"Exam 2 - GRCP","fe":"Anonymity should be provided when legally permitted or required\n\n \n\nThis is the correct answer because notification and whistleblowing channels must align with:\n\n\n\t\n\tWhistleblower protection laws\n\t\n\t\n\tRegulatory and legal requirements\n\t\n\t\n\tThe level of retaliation risk within the organization\n\t\n\n\nThe OCEG GRC Capability Model clearly states that anonymity:\n\n\n\t\n\tIs not always mandatory\n\t\n\t\n\tBut must be provided when legally required or permitted\n\t\n\t\n\tShould be supported by verification and investigation controls to prevent abuse\n\t\n\n\nThe primary objective is to encourage early reporting of risks and misconduct without fear of retaliation, not merely to collect complaints.\n \n\nOCEG. (2015). GRC Capability Model (Red Book), Version 3.0. Burlington, MA: OCEG. pp. 118–120 (Notification, Reporting & Whistleblower Protection)","fa":"✅ ينبغي توفير خيار إخفاء الهوية عندما يكون مسموحاً أو مطلوباً قانونياً\n\n\nهذه هي الإجابة الصحيحة لأن قنوات الإشعار (Notification & Reporting Channels) يجب أن تتماشى مع:\n\n\n\t\n\tقوانين حماية المبلّغين (Whistleblower Protection Laws)\n\t\n\t\n\tالمتطلبات التنظيمية المحلية والدولية\n\t\n\t\n\tمستوى المخاطر الانتقامية داخل المنظمة\n\t\n\n\nنموذج GRC Capability Model (OCEG) يؤكد أن:\n\n\n\t\n\tإخفاء الهوية ليس دائمًا إلزاميًا\n\t\n\t\n\tولكنه يجب أن يكون متاحًا عندما يتطلبه القانون أو يسمح به\n\t\n\t\n\tويجب أن يكون مصحوبًا بضوابط تحقق تمنع البلاغات الكيدية\n\t\n\n\nالهدف الأساسي ليس فقط استقبال البلاغ، بل تشجيع الإبلاغ المبكر عن المخاطر والسلوكيات غير الأخلاقية دون خوف.\n​​​​​​​\n\nOCEG. (2015). GRC Capability Model (Red Book), Version 3.0. Burlington, MA: OCEG. pp. 118–120 (Notification, Reporting & Whistleblower Protection)"},{"qe":"In the context of notifications about events, how can the organization benefit from technology-based notifications?","qa":"في سياق الإشعارات حول الأحداث، كيف يمكن أن تستفيد المنظمة من الإشعارات التقنية؟","oe":["These notifications are more reliable than traditional paper-based methods.","Often (though not always), these notifications alert the organization sooner than other methods, especially when human methods fail or are delayed.","These notifications eliminate the need for any human interaction in assigning follow-up tasks.","This type of notification is useful only in large organizations with complex structures."],"oa":["هذه الإشعارات أكثر موثوقية من الوسائل الورقية التقليدية","غالبًا (وليس دائمًا) ما تنبه هذه الإشعارات المنظمة في وقت أسرع عن الوسائل الأخرى، خاصة عندما تخفق أو تتأخر الوسائل اليدوية","تلغي هذه الإشعارات الحاجة لأي تفاعل بشري في تعيين مهام المتابعة","استخدام هذا النوع من الإشعار مفيد فقط في المنظمة الكبيرة ذات الهياكل المعقدة"],"c":1,"ch":"Perform Competent","ex":"Exam 2 - GRCP","fe":"According to the official GRC Capability Model v3.5 under P6 – Notification (Considerations):\n\n\n“Technology-based notifications alert the organization sooner than other methods, especially when human methods fail or are delayed.”\n\n\nThis indicates that:\n\n\n\t\n\tAutomated systems (e.g., Continuous Control Monitoring, Log Management, Application Performance Monitoring, Dashboards)\n\t\n\t\n\tProvide real-time or near-real-time alerts\n\t\n\t\n\tReduce dependency on manual detection\n\t\n\t\n\tEnable earlier identification of risks, incidents, and performance deviations\n\t\n\t\n\tSupport faster corrective actions\n\t\n\n\nHowever, these systems do not replace human judgment. They enhance speed and detection capability.\n\n\nOCEG. (2024). GRC Capability Model v3.5 (Premium Revision 2024). Section: P6 – Notification, Considerations.\nPage 112–113 (English Version).","fa":"وفق نص الكتاب الرسمي في قسم P6 – Notification تحت Considerations:\n\n\n“Technology-based notifications alert the organization sooner than other methods, especially when human methods fail or are delayed.”\n\n\nوهذا يعني أن:\n\n\n\t\n\tالأنظمة التقنية (مثل Continuous Control Monitoring، Log Management، APM Alerts)\n\t\n\t\n\tتوفر تنبيهات فورية وآلية\n\t\n\t\n\tتقلل من الاعتماد الكامل على الملاحظة البشرية\n\t\n\t\n\tتسرّع اكتشاف الانحرافات أو الأحداث غير المواتية\n\t\n\t\n\tتعزز الاستجابة المبكرة وتقليل الخسائر\n\t\n\n\nلكن النموذج يوضح ضمنيًا أن هذه الإشعارات:\n\n\n\t\n\tليست بديلاً كاملاً عن البشر\n\t\n\t\n\tتحتاج إلى تحليل وتوجيه (Filter & Route Notifications)\n\t\n\n\nوبالتالي الاستفادة الأساسية هي السرعة والكشف المبكر.              \n\nOCEG. (2024). GRC Capability Model v3.5 (Premium Revision 2024). Section: P6 – Notification, Considerations.\nPage 112–113 (English Version)."},{"qe":"What should be avoided in order to preserve the integrity of the inquiry process?","qa":"ما الذي ينبغي تجنبه من أجل الحفاظ على نزاهة عملية التقصي؟","oe":["Any inquiry cases require identifying the accused person.","Any actual or perceived relationship between inquiry procedures and individual performance evaluation.","Any automatic analysis of information and conclusions.","Any use of technical inquiry tools."],"oa":["أي حالات التقصي تستدعي تعريف هوية المدعى عليه","أي علاقة فعلية أو تصورية بين إجراءات التقصي وتقييم الأداء الفردي","أي تحليل تلقائي للمعلومات والاستنتاجات","أي استخدام لوسائل التقصي التقنية"],"c":1,"ch":"Perform Competent","ex":"Exam 2 - GRCP","fe":"Under P7 – Inquiry, the model emphasizes implementing pathways to discover information about performance, risks, compliance, and conduct\n\nTo preserve integrity:\n\n\n\t\n\tIndividuals must feel safe providing information\n\t\n\t\n\tInquiry processes must not be linked to punitive mechanisms\n\t\n\t\n\tThere must be separation between learning systems and performance evaluation systems\n\t\n\n\nIf inquiry is connected — even perceptually — to performance evaluation:\n\n\n\t\n\tIndividuals may withhold information\n\t\n\t\n\tTransparency decreases\n\t\n\t\n\tData quality deteriorates\n\t\n\t\n\tTrust in the system weakens\n\t\n\n\nThus, integrity requires neutrality and independence.\n\nOCEG. (2024). GRC Capability Model v3.5 – Premium Revision 2024. Section: P7 – Inquiry, Practices. Page 113–114.","fa":"وفق نموذج P7 – Inquiry، فإن عملية التقصي تهدف إلى:\n\n\nاكتشاف المعلومات حول الأداء أو المخاطر أو الامتثال، سواء كانت مواتية أو غير مواتية\n\n\nوللحفاظ على نزاهة العملية:\n\n\n\t\n\tيجب أن يشعر الأفراد بالأمان عند تقديم المعلومات\n\t\n\t\n\tيجب ألا ترتبط إجراءات التقصي بالعقوبات أو تقييم الأداء\n\t\n\t\n\tيجب الفصل بين أنظمة التعلم والتحسين وأنظمة التقييم الفردي\n\t\n\n\nإذا وُجدت علاقة فعلية أو حتى تصورية بين التقصي وتقييم الأداء:\n\n\n\t\n\tقد يخفي الأفراد المعلومات\n\t\n\t\n\tقد يقلّ مستوى الصراحة\n\t\n\t\n\tتتأثر جودة البيانات\n\t\n\t\n\tتضعف الثقة في النظام\n\t\n\n\nوبالتالي، الحفاظ على النزاهة يتطلب الاستقلالية والحياد.               \n               \nOCEG. (2024). GRC Capability Model v3.5 – Premium Revision 2024. Section: P7 – Inquiry, Practices. Page 113–114."},{"qe":"What is the importance of designing specific inquiry procedures to detect unfavorable events?","qa":"ما أهمية تصميم إجراءات محددة للتقصي من أجل رصد الأحداث غير المرغوبة؟","oe":["Prioritizing the discovery of events  undesirable","Avoiding the need for technological inquiry tools","Avoiding the need for observations and conversations","Detecting them as early as possible."],"oa":["ترتيب أولويات اكتشاف الأحداث المرغوبة","تجنب الحاجة إلى وسائل التقصي التقنية","تجنب الحاجة إلى الملاحظات والمحادثات","رصدها في أقرب وقت ممكن"],"c":0,"ch":"Perform Competent","ex":"Exam 2 - GRCP","fe":"According to P7 Practice 5:\n\n\n“Analyze information and findings from all pathways to identify, prioritize, and route findings…”\n\n\nTherefore, the importance lies in:\n\n\n\t\n\tStructured information gathering\n\t\n\t\n\tSystematic analysis\n\t\n\t\n\tPrioritization of findings\n\t\n\t\n\tProper routing to management\n\t\n\n\nThe objective is not merely detection, but structured and prioritized detection.\n\nOCEG. (2024). GRC Capability Model v3.5 – Premium Revision 2024. Section: P7 – Inquiry, Practice 5. Page 114.","fa":"وفق الممارسة الخامسة ضمن P7:\n\n\n“Analyze information and findings from all pathways to identify, prioritize, and route findings…”\n\n\nإذن أهمية تصميم إجراءات محددة تكمن في:\n\n\n\t\n\tجمع المعلومات بشكل منظم\n\t\n\t\n\tتحليلها\n\t\n\t\n\tتحديد الأولويات\n\t\n\t\n\tتوجيهها إلى الجهات المختصة\n\t\n\n\nالهدف ليس فقط الاكتشاف، بل الاكتشاف المنظم القابل للإدارة.\n\n \n\nOCEG. (2024). GRC Capability Model v3.5 – Premium Revision 2024. Section: P7 – Inquiry, Practice 5. Page 114."},{"qe":"What is the purpose of establishing an approach to surveys and self-assessment activities?","qa":"ما الغرض من إنشاء نهج للاستطلاعات وأنشطة التقييم الذاتي؟","oe":["Increasing the frequency of surveys and self-assessments","Focusing only on technological inquiry tools","Eliminating the need for informal inquiry pathways","Reducing the burden on survey subjects and improving the quality of information"],"oa":["زيادة وتيرة إجراءات الاستطلاع والتقييم الذاتي","التركيز فقط على وسائل التقصي التقنية","التخلص من الحاجة إلى المسارات غير الرسمية للتقصي","تقليل العبء على المستهدفين من الاستطلاع وتحسين جودة المعلومات"],"c":3,"ch":"Perform Competent","ex":"Exam 2 - GRCP","fe":"P7 – Inquiry model explicitly states that the goal of establishing a standardized approach to surveys and self-assessments is to:\n\nReduce survey fatigue\n\nAvoid duplicate information requests\n\nImprove data accuracy and quality\n\nStandardize data collection across the organization\n\nAs stated in the official reference:\n\n“Establish an organization-wide approach to surveys, self-assessments, and other information requests that reduces the burden on survey subjects and improves information quality.”\n\nOCEG. (2024). GRC Capability Model v3.5 – Premium Revision 2024. Section: P7 – Inquiry, Practice 3. Pages 113–114.","fa":"هذا هو الخيار الصحيح لأن نموذج P7 – Inquiry ينص صراحةً على أن الهدف من إنشاء نهج موحد للاستطلاعات والتقييم الذاتي هو:\n\n\n\t\n\tتقليل إرهاق المشاركين (Survey Fatigue)\n\t\n\t\n\tتجنب تكرار طلبات المعلومات\n\t\n\t\n\tتحسين دقة وجودة البيانات\n\t\n\t\n\tتوحيد أسلوب جمع المعلومات عبر المنظمة\n\t\n\n\nوقد ورد في المرجع الرسمي:\n\n\n“Establish an organization-wide approach to surveys, self-assessments, and other information requests that reduces the burden on survey subjects and\nimproves information quality.”\n\nOCEG. (2024). GRC Capability Model v3.5 – Premium Revision 2024. Section: P7 – Inquiry, Practice 3. Page 113–114."},{"qe":"What is the importance of rapid response to desirable employee behaviors?","qa":"ما أهمية الاستجابة السريعة لسلوكيات الموظفين المرغوبة؟","oe":["Ensuring identity protection and non-retaliation for whistleblowers","Linking rewards to positive behavior and amplifying and accelerating its benefit","Retaining records and other evidence used in investigations","Escalating cases for investigation and distinguishing whether internal or external"],"oa":["لضمان حماية الهوية وعدم الثأر من مقدمي البلاغات","لربط المكافآت بالسلوك الإيجابي ومضاعفة وتسريع المنفعة منها","الاحتفاظ بالسجلات والأدلة الأخرى المستخدمة في التحري","تصعيد الحالات للتحري وتمييزها بين ما هو داخل المنظمة أو خارجها"],"c":1,"ch":"Perform Competent","ex":"Exam 2 - GRCP","fe":"Under P5 – Incentives, the model states:\n\n\n“Recognition should occur as close as possible to the favored conduct…”\n\n\nRapid response:\n\n\n\t\n\tReinforces desirable conduct\n\t\n\t\n\tStrengthens behavioral association\n\t\n\t\n\tAmplifies motivational impact\n\t\n\t\n\tIncreases likelihood of repetition\n\t\n\n\nDelayed recognition weakens reinforcement effects.\n\nOCEG. (2024). GRC Capability Model v3.5 – Premium  Section: P5 – Incentives, Page 110–111.","fa":"وفق عنصر P5 – Incentives في نموذج GRC، فإن الاعتراف والمكافأة يجب أن يحدثا قريبًا من السلوك المرغوب:\n\n\n“Recognition should occur as close as possible to the favored conduct in both timescale and location.”\n\n\nوهذا يعني أن:\n\n\n\t\n\tسرعة الاستجابة تعزز السلوك الإيجابي\n\t\n\t\n\tتربط السلوك بالمكافأة مباشرة\n\t\n\t\n\tتقوي ثقافة الامتثال\n\t\n\t\n\tتزيد احتمالية تكرار السلوك المرغوب\n\t\n\n\nفالاستجابة المتأخرة تُضعف الأثر التحفيزي.                          \n\nOCEG. (2024). GRC Capability Model v3.5 – Premium  Section: P5 – Incentives, Page 110–111."},{"qe":"What is the importance of retaining records and other evidence when responding to unfavorable events?","qa":"ما أهمية الاحتفاظ بالسجلات والأدلة الأخرى عند الاستجابة للأحداث غير المرغوبة؟","oe":["Providing retraining when necessary for employees at fault","Providing incentives and implementing actions that accelerate favorable events","Amplifying and accelerating favorable events","Ensuring evidence is preserved if investigations are required to resolve the issue"],"oa":["توفير إعادة التدريب عند الضرورة للموظفين المخطئين","تقديم الحوافز وتنفيذ الإجراءات التي تسرع الأحداث المرغوبة","مضاعفة وتسريع أثر الأحداث المرغوبة","ضمان الاحتفاظ بالأدلة في حال ضرورة إجراء التحقيقات لحل المشكلة"],"c":3,"ch":"Perform Competent","ex":"Exam 2 - GRCP","fe":"Under P7 – Inquiry, the model requires:\n\n\n\t\n\tAnalyzing findings\n\t\n\t\n\tRouting information\n\t\n\t\n\tProtecting inquiry information\n\t\n\t\n\tEnsuring compliance with legal requirements\n\t\n\n\nEvidence retention ensures:\n\n\n\t\n\tFair investigations\n\t\n\t\n\tLegal defensibility\n\t\n\t\n\tRegulatory compliance\n\t\n\t\n\tInformed corrective action\n\t\n\tOCEG. (2024). GRC Capability Model v3.5 – Premium Revision 2024. Section: P7 – Inquiry, Page 113–114.","fa":"عند التعامل مع أحداث غير مواتية، ينص النموذج ضمن P7 – Inquiry وعمليات المتابعة على:\n\n\n\t\n\tتحليل النتائج\n\t\n\t\n\tتوجيهها\n\t\n\t\n\tالتحقيق عند الحاجة\n\t\n\t\n\tحماية المعلومات المرتبطة بالتقصي\n\t\n\n\nكما ورد:\n\n\n“Analyze information and findings…”\n\nGRC Capability Model v3.5-PREMI…\n\n“Protect information associated with inquiry…”\n\nالاحتفاظ بالأدلة يضمن:\n\n\n\t\n\tإمكانية التحقيق العادل\n\t\n\t\n\tالامتثال القانوني\n\t\n\t\n\tتقليل المخاطر القانونية\n\t\n\t\n\t     دعم قرارات الإدارة\n\t\n\tOCEG. (2024). GRC Capability Model v3.5 – Premium Revision 2024. Section: P7 – Inquiry, Page 113–114."},{"qe":"What is the purpose of conducting internal investigations?","qa":"ما الهدف من إجراء التحريات الداخلية؟","oe":["To amplify and accelerate the impact of favorable events","To address allegations and indicators of unfavorable events and to respond to inquiries and external investigations","To provide incentives for desirable employee behavior","Ensuring continuous and timely notification to relevant stakeholders"],"oa":["لمضاعفة وتسريع أثر الأحداث المرغوبة","للتعامل مع الادعاءات ومؤشرات الأحداث غير المرغوبة والاستجابة للاستفسارات والتحريات الخارجية","لتقديم الحوافز للموظفين على السلوك المرغوب","التأكد من الإخطار المستمر في الوقت المحدد لأصحاب المصلحة المعنيين"],"c":1,"ch":"Perform Competent","ex":"Exam 2 - GRCP","fe":"Under P7 – Inquiry, the model requires organizations to:\n\n\n\t\n\tDiscover unfavorable events\n\t\n\t\n\tAddress allegations\n\t\n\t\n\tAnalyze findings\n\t\n\t\n\tRoute and manage investigation outcomes\n\t\n\t\n\tProtect inquiry information\n\t\n\n\nAs stated:\n\n\n“Implement multiple pathways to discover information… about unfavorable conduct…”\n\nGRC Capability Model v3.5-PREMI…\n\n\n\n“Analyze information and findings… and route findings…”\n\nGRC Capability Model v3.5-PREMI…\n\n\nInternal investigations ensure:\n\n\n\t\n\tObjective handling of allegations\n\t\n\t\n\tLegal defensibility\n\t\n\t\n\tReadiness for external inquiries\n\t\n\t\n\tRisk mitigation\n\t\n\t\n\tOrganizational integrity\n\t\n\t\n\tOCEG. (2024). GRC Capability Model v3.5 – Premium Revision 2024. Section: P7 – Inquiry, Page 113–114.","fa":"وفق عنصر P7 – Inquiry في نموذج GRC، فإن التحريات تهدف إلى:\n\n\n\t\n\tاكتشاف الأحداث غير المرغوبة\n\t\n\t\n\tالتعامل مع الادعاءات\n\t\n\t\n\tتحليل المؤشرات\n\t\n\t\n\tتوجيه النتائج\n\t\n\t\n\tحماية المعلومات المرتبطة بالتحقيق\n\t\n\n\nكما ورد في النص:\n\n\n“Implement multiple pathways to discover information… about unfavorable conduct…”\n\n\nوكذلك:\n\n\n“Analyze information and findings… and route findings…”\n\n\nإجراء التحريات الداخلية يهدف إلى:\n\n\n\tمعالجة الادعاءات بموضوعية\n\tدعم الامتثال القانوني\n\tالاستعداد للتحقيقات الخارجية\n\tتقليل المخاطر النظامية\n\t  حماية سمعة المنظمة                                          \n\tOCEG. (2024). GRC Capability Model v3.5 – Premium Revision 2024. Section: P7 – Inquiry, Page 113–114."},{"qe":"In the Governance, Risk, and Compliance (GRC) Capability Model, what is the primary focus of the Review component?","qa":"في نموذج قدرات الحوكمة والمخاطر والامتثال (GRC)، ما هو التركيز الرئيسي لمركب (المراجعة)؟","oe":["Implementing new policies and procedures to enhance organizational performance","Continuous improvement of overall performance by monitoring processes and controls and providing assurance regarding priority objectives, opportunities, obstacles, and obligations","Focusing exclusively on monitoring processes and controls without providing assurance","Executing audit and inspection procedures to identify non-compliance cases"],"oa":["تطبيق السياسات والإجراءات الجديدة لتعزيز الأداء المؤسسي","لتحسين المستمر للأداء الشامل عن طريق مراقبة الإجراءات والضوابط وتقديم الضمان حول الأهداف ذات الأولوية والفرص والعقبات والالتزامات","التركيز حصريًا على مراقبة الإجراءات والضوابط دون توفير الضمان","تنفيذ إجراءات التدقيق والتفتيش للتعرف على حالات عدم الامتثال"],"c":1,"ch":"Review Competent","ex":"Exam 2 - GRCP","fe":"The Review component ensures that priority objectives are being achieved effectively and that controls and processes are
