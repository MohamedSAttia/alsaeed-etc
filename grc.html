k related to an objective; KCIs help govern, manage, and provide assurance about compliance related to an objective.","KPIs are financial metrics, KRIs are operational metrics, and KCIs are customer-related metrics, all of which are used to determine executive bonuses.","KPIs are long-term goals, KRIs are short-term goals, and KCIs are intermediate goals, all of which are used to determine what decision-making criteria is required."],"oa":["تستخدم لقياس كفاءة العمليات، KRIs لتقييم عمليات إدارة المخاطر، و KCIs لتقييم تأثير التغيرات واللوائح والالتزامات الأخرى","KPIs تساعد على الحوكمة والإدارة وتقديم التأكيد بشأن الأداء المرتبط بهدف؛ KRIs تساعد على الحوكمة والإدارة والتأكيد بشأن المخاطر؛ KCIs تساعد على الحوكمة والإدارة والتأكيد بشأن الامتثال.","KPIs مقاييس مالية، KRIs مقاييس تشغيلية، وKCIs مقاييس متعلقة بالعملاء، وتستخدم جميعها لتحديد مكافآت التنفيذيين","KPIs أهداف طويلة المدى، KRIs أهداف قصيرة المدى، KCIs أهداف متوسطة المدى، وتستخدم جميعها لتحديد معايير اتخاذ القرار المطلوبة"],"c":1,"ch":"Align Competent","ex":"Exam 1 - GRCP","fe":"KPIs focus on performance, KRIs on risks, and KCIs on compliance. Together, they ensure comprehensive governance, management, and assurance related to objectives.\n\nGRC Capability Model v3.5 – A2 Objectives, p. 125","fa":"تركز KPIs على الأداء، وKRIs على المخاطر، وKCIs على الامتثال. مجتمعة تضمن الحوكمة والإدارة والتأكيد الشامل المرتبط بالأهداف.\n\nGRC Capability Model v3.5 – A2 Objectives, p. 125"},{"qe":"What is a key difference between objectives that “Change the Organization” and those that “Run the Organization”?","qa":"ما هو الفرق الأساسي بين أهداف \"تغيير المنظمة\" وأهداف  \"تشغل المنظمة\"؟","oe":["Objectives that “Change the Organization” are established by the board of directors, while objectives that “Run the Organization” are established by the management team.","Objectives that “Change the Organization” are related to the organization’s financial performance, while objectives that “Run the Organization” are related to the organization’s legal compliance.","Objectives that “Change the Organization” focus on change management, employee training, and development, while objectives that “Run the Organization” focus on customer satisfaction and sales growth.","Objectives that “Change the Organization” inspire progress and produce new value, while objectives that “Run the Organization” allow the organization to maintain what it has achieved, preserve existing value, and notice when value erodes or atrophies."],"oa":["الأهداف التي \"تغير المنظمة\" يضعها مجلس الإدارة، بينما الأهداف التي \"تشغل المنظمة\" يضعها فريق الإدارة","الأهداف التي \"تغير المنظمة\" تتعلق بالأداء المالي، بينما الأهداف التي \"تشغل المنظمة\" تتعلق بالامتثال القانوني","الأهداف التي \"تغير المنظمة\" تركز على إدارة التغيير وتدريب الموظفين وتطويرهم، بينما الأهداف التي \"تشغل المنظمة\" تركز على رضا العملاء ونمو المبيعات","أهداف \"تغير المنظمة\" تلهم التقدم وتنتج قيمة جديدة، بينما تسمح أهداف \"تشغل المنظمة\" بالحفاظ على ما تم تحقيقه  وعلى القيمة الحالية ، وبالابلاغ فى حال فقدان القيمة أو ضمورها"],"c":3,"ch":"Align Competent","ex":"Exam 1 - GRCP","fe":"“Change the Organization” objectives are about transformation and innovation (new value), while “Run the Organization” objectives are about sustaining and protecting existing value.\n\nGRC Capability Model v3.5 – A2 Objectives, p. 126","fa":"الأهداف التي \"تغير المنظمة\" ترتبط بالتحول والابتكار (إيجاد قيمة جديدة)، بينما الأهداف التي \"تشغل المنظمة\" ترتبط بالحفاظ على القيمة الحالية وحمايتها.\n\nGRC Capability Model v3.5 – A2 Objectives, p. 126"},{"qe":"What is the significance of ensuring the visibility of objectives across different levels of the organization?","qa":"ما هي أهمية ضمان وضوح الأهداف عبر المستويات المختلفة في المنظمة؟","oe":["It allows for the coordination of activities","It creates a competitive environment among different units within the organization.","It showcases the achievements of the organization’s leadership team","It identifies underperforming employees and takes corrective action"],"oa":["يتيح تنسيق الأنشطة","يخلق بيئة تنافسية بين الوحدات المختلفة داخل المنظمة","يعرض إنجازات فريق القيادة في المنظمة","يحدد الموظفين ذوي الأداء المنخفض ويتخذ الإجراءات التصحيحية"],"c":0,"ch":"Align Competent","ex":"Exam 1 - GRCP","fe":"When objectives are visible across levels, coordination and alignment are improved, ensuring organizational coherence.\n\nGRC Capability Model v3.5 – A2 Objectives, p. 127","fa":"عندما تكون الأهداف واضحة على جميع المستويات، يتحسن التنسيق والمواءمة، مما يضمن انسجام المنظمة.\n\nGRC Capability Model v3.5 – A2 Objectives, p. 127"},{"qe":"What is the term used to describe the positive, favorable effect of uncertainty on objectives?","qa":"ما هو المصطلح المستخدم لوصف الأثر الإيجابي أو المواتي لعدم اليقين على الأهداف؟","oe":["Reward","Obstacle","Profit","Enhancement"],"oa":["مكافأة","عائق","ربح","تعزيز"],"c":0,"ch":"Key Concepts","ex":"Exam 1 - GRCP","fe":"In GRC, uncertainty can have both negative (obstacle, threat) and positive (reward, opportunity) effects. The positive effect is called a Reward.\n\nGRC Capability Model v3.5 – A3 Identification, p. 132","fa":"في إطار GRC، يمكن أن يكون لعدم اليقين تأثير سلبي (عائق أو تهديد) أو تأثير إيجابي (مكافأة أو فرصة). المصطلح المستخدم للأثر الإيجابي هو المكافأة.\n\nGRC Capability Model v3.5 – A3 Identification, p. 132"},{"qe":"How does the LEARN component contribute to achieving disciplined performance?","qa":"كيف يساهم مكون (الدراسة – LEARN) في تحقيق الأداء المنضبط؟","oe":["By aligning the organization’s strategic objectives with its operational activities.","By monitoring and reviewing organizational performance metrics.","By studying requirements to design a comprehensive risk management framework.","By understanding the internal and external context, culture, and stakeholders in order to shape direction, objectives, and methodology."],"oa":["من خلال مواءمة الأهداف الاستراتيجية للمنظمة مع أنشطتها التشغيلية.","من خلال مراقبة ومراجعة مقاييس أداء المنظمة","من خلال دراسة المتطلبات لتصميم إطار شامل لإدارة المخاطر","من خلال فهم الواقع الداخلي والخارجي والثقافة وأصحاب المصلحة من أجل تشكيل التوجه والأهداف والمنهجية."],"c":3,"ch":"Learn Component","ex":"Exam 2 - GRCP","fe":"Disciplined performance does not begin with execution —\nit begins with structured understanding.\n\nLEARN contributes by:\n\n\n\t\n\tUnderstanding external conditions\n\t\n\t\n\tAssessing internal capabilities\n\t\n\t\n\tEvaluating culture\n\t\n\t\n\tIdentifying stakeholder expectations\n\t\n\n\nThis foundation shapes:\n\n\n\t\n\tDirection\n\t\n\t\n\tObjectives\n\t\n\t\n\tDecision criteria\n\t\n\t\n\tMethodology\n\t\n\n\nAs described in decision-setting criteria (page 36)\n\nOCEG. (2024). GRC Capability Model™ Version 3.5 – Premium Edition (Revision 2024-11-20). OCEG (Open Compliance & Ethics Group).","fa":"الأداء المنضبط (Disciplined Performance) لا يبدأ بالتنفيذ،\nبل يبدأ بفهم صحيح ومنهجي للواقع.\n\nLEARN يحقق ذلك من خلال:\n\n\n\t\n\tفهم البيئة الخارجية (السوق، التشريعات، المخاطر)\n\t\n\t\n\tفهم البيئة الداخلية (القدرات، الموارد، العمليات)\n\t\n\t\n\tتحليل الثقافة التنظيمية\n\t\n\t\n\tفهم توقعات أصحاب المصلحة\n\t\n\n\nومن ثم استخدام هذا الفهم لتشكيل:\n\n\n\t\n\tالتوجه الاستراتيجي (Direction)\n\t\n\t\n\tالأهداف (Objectives)\n\t\n\t\n\tمعايير القرار (Decision Criteria)\n\t\n\t\n\tالمنهجية (Methodology)\n\t\n\n\nوهذا يتسق مع مفهوم:\n\n\nDirection-Setting Criteria\nObjective-Setting Criteria\n\n\nكما ورد في صفحة 36 \nOCEG. (2024). GRC Capability Model™ Version 3.5 – Premium Edition (Revision 2024-11-20). OCEG (Open Compliance & Ethics Group)."},{"qe":"What are some legal and regulatory factors that may influence the external context of an organization?","qa":"ما هي بعض العوامل القانونية والنظامية التي يمكن أن تؤثر على السياق الخارجي للمنظمة؟","oe":["Laws, regulations, rules, litigation, and judicial and administrative opinions.","Enforcement actions and litigation against the company.","Market research, customer feedback, and competitive analysis.","How the internal legal department coordinates with external legal bodies."],"oa":["القوانين والأنظمة واللوائح والترافع والآراء القضائية والإدارية","إجراءات الإنفاذ والترافع ضد الشركة","أبحاث السوق، وملاحظات العملاء، والتحليل التنافسي","كيفية تنسيق الإدارة القانونية في المنظمة والمجالس القانونية الخارجية للأنشطة"],"c":0,"ch":"Learn Component","ex":"Exam 2 - GRCP","fe":"Legal and regulatory external factors include:\n\n\n\t\n\tLaws\n\t\n\t\n\tRegulations\n\t\n\t\n\tStatutes\n\t\n\t\n\tJudicial rulings\n\t\n\t\n\tAdministrative opinions\n\t\n\t\n\tEnforcement frameworks\n\t\n\t\n\tRegulatory interpretations\n\t\n\n\nThese define the structural legal environment within which the organization operates.\n\nThey directly influence:\n\n\n\t\n\tPolicy design\n\t\n\t\n\tRisk exposure\n\t\n\t\n\tCompliance obligations\n\t\n\t\n\tStrategic decision-making\n\t \n\n\tOCEG. (2024). GRC Capability Model™ Version 3.5 – Premium Edition (Revision 2024-11-20). OCEG.\n\n\t📍 Part II – GRC Capabilities\n\t📍 Component L – LEARN\n\t📍 Section: L1 – External Context - Page 81","fa":"السياق الخارجي القانوني والتنظيمي يشمل:\n\n\n\tالقوانين (Laws)\n\tالأنظمة (Statutes)\n\tاللوائح (Regulations)\n\tالقرارات التنفيذية\n\tالآراء القضائية\n\tالتفسيرات الإدارية\n\tالسوابق القضائية\n\tالبيئة الرقابية\n\n\nوهذه العناصر تشكل الإطار القانوني الذي تعمل المنظمة ضمنه.\n\nوبالتالي فهي تمثل عوامل هيكلية خارجية تؤثر على:\n\n\n\tتصميم السياسات\n\tإدارة المخاطر\n\tالتزامات الامتثال\n\tقرارات الاستثمار\n\tالاستراتيجية العامة\n\n\nOCEG. (2024). GRC Capability Model™ Version 3.5 – Premium Edition (Revision 2024-11-20). OCEG.\n\n📍 Part II – GRC Capabilities\n📍 Component L – LEARN\n📍 Section: L1 – External Context\n📍 صفحة 81"},{"qe":"Which critical discipline of a Protector’s skills includes scoping activities and setting direction?","qa":"أي من التخصصات الحرجة لمهارات مسؤول الحماية يشمل مهارة حصر الأنشطة وضبط التوجه؟","oe":["Compliance and Ethics","Audit and Assurance","Risk and Decision-Making","Governance and Oversight"],"oa":["الامتثال والأخلاقيات","التدقيق والضمان","المخاطر واتخاذ القرار","الحوكمة والرقابة"],"c":3,"ch":"Key Concepts","ex":"Exam 1 - GRCP","fe":"In the GRC Capability Model™, the Protector role supports disciplined performance by ensuring proper governance structures are in place.\n\nThe skill of:\n\n\n\t\n\tScoping activities\n\t\n\t\n\tSetting direction\n\t\n\t\n\tDefining boundaries\n\t\n\t\n\tAssigning accountability\n\t\n\t\n\tOverseeing performance\n\t\n\n\nare core governance functions.\n\nThese are not operational execution tasks, nor audit tasks, nor compliance monitoring tasks. They are governance-level responsibilities.\n\nTherefore, the critical discipline that includes scoping and setting direction is:\n\n\nGovernance and Oversight.\n\n\n📚 Reference:\nGRC Capability Model v3.5 – Governance & Oversight (Protector Role), p. 32–34","fa":"في نموذج GRC Capability Model™، يُعرَّف مسؤول الحماية (Protector) بأنه الشخص أو الجهة التي تساعد المنظمة على تحقيق الأداء المنضبط (Disciplined Performance) من خلال ضمان وجود:\n\n\n\t\n\tالتوجيه الصحيح\n\t\n\t\n\tالرقابة المناسبة\n\t\n\t\n\tالمساءلة\n\t\n\t\n\tالإشراف المستمر\n\t\n\n\nمهارة حصر الأنشطة (Scoping Activities) وضبط التوجه (Setting Direction) ترتبط مباشرة بوظائف الحوكمة، والتي تشمل:\n\n\n\t\n\tتحديد النطاق\n\t\n\t\n\tوضع الحدود\n\t\n\t\n\tتحديد الصلاحيات\n\t\n\t\n\tتحديد المساءلة\n\t\n\t\n\tالإشراف على الأداء\n\t\n\n\nهذه وظائف حوكمة وليست وظائف تنفيذية أو تشغيلية.\n\nلذلك فإن التخصص الحرج الذي يتضمن هذه المهارات هو:\n\n\nالحوكمة والرقابة (Governance & Oversight)\n\n\n📚 المرجع:\nGRC Capability Model v3.5 – Governance & Oversight (Protector Role), p. 32–34"},{"qe":"What is the role of the Protector in helping organizations achieve disciplined performance?","qa":"ما هو دور مسؤول الحماية في مساعدة المنظمات على تحقيق الأداء المنضبط؟","oe":["Acting within stabilizing forces that help organizations achieve and maintain principled performance in a VUCA environment","Developing and implementing technical solutions to improve operations","Monitoring supply chains and ensuring timely delivery","Increasing revenue and driving growth"],"oa":["العمل ضمن قوى الاستقرار التي تساعد المنظمات في الوصول إلى الأداء المنضبط والحفاظ عليه في ظل الواقع الهائج (VUCA)","تطوير وتنفيذ حلول تقنية لتحسين العمليات التشغيلية","مراقبة سلاسل الإمداد والتأكد من تسليم الخدمات في الوقت المحدد","زيادة الإيرادات وتحفيز نمو المنشأة"],"c":0,"ch":"Key Concepts","ex":"Exam 1 - GRCP","fe":"The Protector represents one of the stabilizing forces in the GRC model.\n\nIn a VUCA environment (Volatile, Uncertain, Complex, Ambiguous), the Protector helps organizations:\n\n\n\t\n\tReduce deviations\n\t\n\t\n\tMaintain control\n\t\n\t\n\tStrengthen compliance\n\t\n\t\n\tSupport accountability\n\t\n\t\n\tPreserve stability\n\t\n\n\nThis role ensures the organization achieves and sustains Principled Performance, meaning performance aligned with values, objectives, and governance boundaries.\n\n📚 Reference:\nGRC Capability Model v3.5 – Principled Performance & Protector Role, p. 14–16","fa":"مسؤول الحماية (Protector) يمثل إحدى قوى الاستقرار (Stabilizing Forces) في نموذج GRC.\n\nفي بيئة تتسم بـ:\n\n\n\t\n\tالتقلب (Volatility)\n\t\n\t\n\tعدم اليقين (Uncertainty)\n\t\n\t\n\tالتعقيد (Complexity)\n\t\n\t\n\tالغموض (Ambiguity)\n\t\n\n\nفإن دور مسؤول الحماية هو:\n\n\n\t\n\tتقليل الانحرافات\n\t\n\t\n\tتعزيز الرقابة\n\t\n\t\n\tدعم الامتثال\n\t\n\t\n\tبناء الثقة\n\t\n\t\n\tضمان الاتساق\n\t\n\n\nوذلك بهدف تحقيق:\n\n\nالأداء المنضبط (Principled Performance)\n\n\nأي تحقيق الأهداف مع الالتزام بالقيم والحدود والضوابط.\n\n📚 المرجع:\nGRC Capability Model v3.5 – Principled Performance & Protector Role, p. 14–16"},{"qe":"Risk and Decision specialization skills help the organization in which of the following?","qa":"مهارات تخصص المخاطر والقرارات تساعد المنظمة في أي من التالي؟","oe":["Identifying mandatory and voluntary obligations, establishing policies, managing workforce execution, and shaping ethical culture","Enhancing brand reputation, managing public relations, handling media campaigns, and building brand equity","Strengthening supply chains, managing inventory, developing logistics services, improving distribution, and ensuring timely delivery","Planning for risks, identifying them, assessing them, responding to them, measuring them, monitoring them, and leveraging them in decision-making"],"oa":["التعرف على الالتزامات الإجبارية والاختيارية، ووضع السياسات، وتنفيذ القوى العاملة، وتشكيل الثقافة الأخلاقية","تعزيز سمعة العلامة التجارية، وإدارة العلاقات العامة، والتعامل مع الحملات الإعلامية، وبناء حقوق ملكية العلامة التجارية","تعزيز سلاسل الإمداد، وإدارة المخزون، وتطوير الخدمات اللوجستية، وتحسين التوزيع، وضمان التسليم في الوقت المحدد","التخطيط للمخاطر، والتعرف عليها، وتقديرها، والتعامل معها، وقياسها، ومراقبتها، والاستفادة منها في اتخاذ القرارات"],"c":3,"ch":"Key Concepts","ex":"Exam 1 - GRCP","fe":"Within the GRC Capability Model™, the Risk & Decision specialization focuses on managing uncertainty to improve decision quality.\n\nIt includes:\n\n\n\t\n\tRisk planning\n\t\n\t\n\tRisk identification\n\t\n\t\n\tRisk assessment\n\t\n\t\n\tRisk response\n\t\n\t\n\tRisk measurement\n\t\n\t\n\tRisk monitoring\n\t\n\t\n\tIntegrating risk insight into decision-making\n\t\n\n\nRisk in this context includes both threats and opportunities that may affect objective achievement.\n\n \n\n📚 Reference:\nGRC Capability Model v3.5 – Risk & Decision Specialization, p. 30–31","fa":"في نموذج ™GRC Capability Model، تخصص المخاطر والقرارات (Risk & Decision) يركز على:\n\n\n\t\n\tفهم عدم اليقين\n\t\n\t\n\tتحليل الاحتمالات\n\t\n\t\n\tتقييم التأثير\n\t\n\t\n\tالمفاضلة بين البدائل\n\t\n\t\n\tتحسين جودة القرار\n\t\n\n\nويشمل ذلك:\n\n\n\t\n\tالتخطيط للمخاطر\n\t\n\t\n\tتحديد المخاطر\n\t\n\t\n\tتقييمها\n\t\n\t\n\tالاستجابة لها\n\t\n\t\n\tقياسها\n\t\n\t\n\tمراقبتها\n\t\n\t\n\tاستخدامها كمدخل لتحسين القرار\n\t\n\n\nالمخاطر في هذا السياق ليست فقط تهديدات، بل تشمل أيضًا:\n\n\nالفرص وعدم اليقين الذي يؤثر على تحقيق الأهداف.\n\n\n📚 المرجع:\nGRC Capability Model v3.5 – Risk & Decision Specialization, p. 30–31"},{"qe":"What does the term “Resilience” refer to when evaluating total performance under the GRC Capability Model?","qa":"إلى ماذا تشير كلمة \"المرونة\" عند تقييم الأداء الشامل وفق نموذج قدرات الحوكمة والمخاطر والامتثال (GRC)؟","oe":["The speed of executing a mature program across the entire enterprise","The ability to withstand disruptions and recover from them, including having contingency plans, schedule slack, and backup personnel","The ability to ensure accuracy and rigor in program outcomes","The ability to maintain business continuity at minimal cost to protect data"],"oa":["السرعة في تنفيذ برنامج ناضج وتطبيقه على مستوى الكيان بأكمله","القدرة على تحمل الاضطرابات والتعافي منها، بما فيها وجود الخطط الاحتياطية، والتراخي في الجداول الزمنية، ووجود موظفين احتياطيين","القدرة على ضمان دقة وإحكام نتائج البرامج","امتلاك القدرة على استمرارية العمل بأقل التكاليف لحماية البيانات"],"c":1,"ch":"Key Concepts","ex":"Exam 1 - GRCP","fe":"Under the Total Performance Model in GRC, performance is measured across four dimensions:\n\n\n\t\n\tEffectiveness\n\t\n\t\n\tEfficiency\n\t\n\t\n\tAgility\n\t\n\t\n\tResilience\n\t\n\n\nResilience refers to:\n\n\nThe organization’s ability to withstand stress, absorb disruption, recover effectively, and emerge stronger.\n\n\nIt includes:\n\n\n\t\n\tContingency planning\n\t\n\t\n\tRedundancy\n\t\n\t\n\tBackup personnel\n\t\n\t\n\tBuffer capacity\n\t\n\t\n\tAdaptive recovery capability\n\t \n\t\n\n\n📚 Reference:\nGRC Capability Model v3.5 – Total Performance (Resilience), p. 24","fa":"في نموذج Total Performance ضمن GRC Capability Model، الأداء الشامل يتضمن أربعة أبعاد:\n\n\n\t\n\tالفعالية (Effectiveness)\n\t\n\t\n\tالكفاءة (Efficiency)\n\t\n\t\n\tالرشاقة/الاستجابة (Agility)\n\t\n\t\n\tالمرونة (Resilience)\n\t\n\n\nالمرونة تعني:\n\n\nقدرة المنظمة على تحمل الصدمات، والاستمرار أثناء الاضطرابات، والتعافي بسرعة، والخروج أكثر قدرة بعد التعرض للضغط.\n\n\nوتشمل عناصر مثل:\n\n\n\t\n\tخطط الطوارئ\n\t\n\t\n\tبدائل تشغيلية\n\t\n\t\n\tاحتياطيات\n\t\n\t\n\tمرونة في الموارد\n\t\n\t\n\tجاهزية لمواجهة المخاطر غير المتوقعة\n\t\n\n\n \n\n📚 المرجع:\nGRC Capability Model v3.5 – Total Performance (Resilience), p. 24"},{"qe":"In the context of the maturity model, what characterizes Level 1 practices?","qa":"في سياق نموذج قياس النضج، بماذا تتميز ممارسات المستوى 1؟","oe":["Practices are formally documented and regularly managed","Practices are measured and managed using evidence-based data","Practices are continuously improved over time","Practices are ad hoc, informal, and often chaotic"],"oa":["الممارسات موثقة بشكل رسمي وتتم إدارتها بانتظام","الممارسات يتم قياسها وإدارتها بالأدلة المثبتة بالبيانات","الممارسات يتم تحسينها بانتظام مع مرور الوقت","الممارسات مرتجلة، وعشوائية، وغالبًا فوضوية"],"c":3,"ch":"Key Concepts","ex":"Exam 1 - GRCP","fe":"Within the GRC Capability Model™ Maturity Model, Level 1 represents the lowest maturity state.\n\nIt is characterized by:\n\n\n\t\n\tLack of formal documentation\n\t\n\t\n\tAbsence of standardized processes\n\t\n\t\n\tReliance on individual effort\n\t\n\t\n\tReactive and inconsistent responses\n\t\n\t\n\tUnpredictable outcomes\n\t\n\n\nIn short, practices are:\n\n\nAd hoc\nInformal\nOften chaotic\n\n\n \n\nHigher levels introduce documentation, measurement, and continuous improvement.\n\n📚 Reference:\nGRC Capability Model v3.5 – Maturity Model Level 1 (Ad Hoc), p. 38–39","fa":"في نموذج النضج ضمن GRC Capability Model™، يمثل المستوى الأول (Level 1) أدنى درجات النضج المؤسسي.\n\nويتميز هذا المستوى بـ:\n\n\n\t\n\tغياب التوثيق الرسمي\n\t\n\t\n\tعدم وجود عمليات معيارية\n\t\n\t\n\tالاعتماد على الاجتهادات الفردية\n\t\n\t\n\tاستجابات غير منهجية\n\t\n\t\n\tنتائج غير متوقعة\n\t\n\n\nأي أن العمل يتم بصورة:\n\n\nمرتجلة (Ad Hoc)\nغير منظمة\nغير قابلة للتكرار\n\n\nأما باقي الخيارات فتمثل مستويات أعلى:\n\n\n\t\n\tالتوثيق الرسمي → مستوى 2 أو 3\n\t\n\t\n\tالقياس القائم على البيانات → مستوى 4\n\t\n\t\n\tالتحسين المستمر → مستوى 5\n\t\n\n\n📚 المرجع:\nGRC Capability Model v3.5 – Maturity Model Level 1 (Ad Hoc), p. 38–39"},{"qe":"In the Lines of Accountability model, what is the role of the First Line?","qa":"في نموذج خطوط المساءلة، ما هو دور الخط الأول؟","oe":["Individuals or teams that set strategy and institutional objectives","Individuals or teams that perform audit and evaluation procedures to ensure compliance","Individuals or teams that oversee policy implementation across the organization","Individuals and teams responsible for managing performance, risk, and compliance related to daily operational activities"],"oa":["هم الأفراد أو فرق العمل التي تقوم بتوجيه الاستراتيجية وضبط الأهداف المؤسسية","هم الأفراد أو فرق العمل التي تنفذ إجراءات التدقيق والتقييم لضمان الامتثال للوائح","هم الأفراد أو فرق العمل التي تشرف على تطبيق السياسات والإجراءات على مستوى المنظمة","هم الأفراد وفرق العمل التي تتولى تسيير الأداء والمخاطر والامتثال المتعلق بالأنشطة التشغيلية اليومية"],"c":3,"ch":"Key Concepts","ex":"Exam 1 - GRCP","fe":"In the GRC Lines of Accountability model:\n\n\n\t\n\tFirst Line = Operational Management\n\t\n\t\n\tSecond Line = Oversight and Risk Support\n\t\n\t\n\tThird Line = Independent Assurance\n\t\n\n\nThe First Line:\n\n\n\t\n\tExecutes daily operations\n\t\n\t\n\tOwns and manages risk\n\t\n\t\n\tEnsures compliance in operational activities\n\t\n\t\n\tDelivers performance\n\t\n\n\n \n\n📚 Reference:\nGRC Capability Model v3.5 – Lines of Accountability, p. 28–29","fa":"في نموذج Lines of Accountability ضمن GRC Capability Model:\n\n\n\t\n\tالخط الأول (First Line) = العمليات التشغيلية\n\t\n\t\n\tالخط الثاني = الرقابة والدعم\n\t\n\t\n\tالخط الثالث = التدقيق المستقل\n\t\n\n\nالخط الأول هو المسؤول عن:\n\n\n\t\n\tتنفيذ الأنشطة اليومية\n\t\n\t\n\tإدارة المخاطر ضمن نطاق العمل\n\t\n\t\n\tالالتزام بالسياسات\n\t\n\t\n\tتحقيق الأداء التشغيلي\n\t\n\n\nبمعنى أنه:\n\n\n\"يمتلك ويدير المخاطر ضمن الأنشطة التشغيلية\"\n\n\nولا يقوم بوظيفة التدقيق (هذا دور الخط الثالث)، ولا يضع الاستراتيجية (هذا دور الحوكمة).\n\n📚 المرجع:\nGRC Capability Model v3.5 – Lines of Accountability, p. 28–29"},{"qe":"In the context of assurance activities, what does the term “Competence” refer to?","qa":"في سياق أنشطة الضمان، إلى ماذا يشير مصطلح \"الأهلية\"؟","oe":["The ability of the assurance provider to communicate with stakeholders","The ability of the assurance provider to be objective, ethical, independent, and free in performing governance activities and forming opinions","The ability of the assurance provider to apply professional, advanced, and methodological techniques in evaluating the subject matter","The ability of the assurance provider to manage conflicts of interest and ethical dilemmas"],"oa":["مدى قدرة مزود الضمان على التواصل مع أصحاب المصلحة","مدى قدرة مزود الضمان على أن يكون محايدًا ونزيهًا ومستقلاً وحرًا في القيام بأنشطة الحوكمة وتكوين الآراء بشأن موضوع الاختصاص","مدى قدرة مزود الضمان على تطبيق أساليب متقدمة ومهنية ومنهجية لتقييم موضوع الاختصاص","مدى قدرة مزود الضمان على إدارة تضارب المصالح والمعضلات الأخلاقية"],"c":2,"ch":"Key Concepts","ex":"Exam 2 - GRCP","fe":"In GRC Assurance activities, competence refers to:\n\n\n\t\n\tKnowledge\n\t\n\t\n\tSkills\n\t\n\t\n\tProfessional methodologies\n\t\n\t\n\tTechnical capability\n\t\n\t\n\tEvidence-based evaluation\n\t\n\n\nCompetence is about the technical and methodological ability to perform assurance work effectively.\n\nObjectivity and independence are separate assurance attributes.\n\n \n\n📚 Reference:\nGRC Capability Model v3.5 – Assurance Attributes (Competence), p. 33–34","fa":"في إطار أنشطة الضمان ضمن GRC، الأهلية (Competence) تعني:\n\n\n\t\n\tامتلاك المعرفة\n\t\n\t\n\tامتلاك المهارات\n\t\n\t\n\tتطبيق المنهجيات المناسبة\n\t\n\t\n\tاستخدام معايير مهنية\n\t\n\t\n\tالقدرة على التقييم الموضوعي المدعوم بالأدلة\n\t\n\n\nالأهلية تتعلق بالقدرة الفنية والمهنية على أداء مهمة الضمان.\n\nأما الحياد والاستقلال (Objectivity & Independence) فهي مفهوم مختلف.\n\n \n\n📚 المرجع:\nGRC Capability Model v3.5 – Assurance Attributes (Competence), p. 33–34"},{"qe":"In the context of assurance activities, what does the term “Suitable Criteria” mean?","qa":"في سياق أنشطة الضمان، ما معنى مصطلح \"المعايير المناسبة\"؟","oe":["Established benchmarks used to evaluate the subject matter, producing consistent and meaningful results","Financial targets defined by the organization as performance indicators","Legal and regulatory requirements the organization must comply with","Ethical rules and codes of conduct defined by the organization"],"oa":["المعايير المرجعية المتبعة لتقييم موضوع الاختصاص، وتكون نتائجها متسقة وذات أهمية","المستهدفات المالية كمؤشرات الأداء التي تحددها المنظمة","المتطلبات القانونية والنظامية التي ينبغي على المنظمة الالتزام بها","القواعد الأخلاقية وقواعد السلوك التي تحددها المنظمة"],"c":0,"ch":"Perform Competent","ex":"Exam 2 - GRCP","fe":"Within GRC assurance activities, “Suitable Criteria” refers to:\n\n\nThe established benchmarks or standards used to evaluate the subject matter in a consistent and meaningful way.\n\n\nSuitable criteria must be:\n\n\n\t\n\tRelevant\n\t\n\t\n\tComplete\n\t\n\t\n\tReliable\n\t\n\t\n\tNeutral\n\t\n\t\n\tUnderstandable\n\t\n\n\nThey are not limited to laws or policies; they are the structured evaluation benchmarks used in assurance engagements.\n\n \n\n📚 Reference:\nGRC Capability Model v3.5 – Assurance Framework (Suitable Criteria), p. 32–33","fa":"في إطار أنشطة الضمان ضمن نموذج GRC، المعايير المناسبة (Suitable Criteria) تعني:\n\n\nالمعايير أو الأطر المرجعية التي يتم استخدامها لتقييم موضوع الاختصاص بطريقة موضوعية ومنهجية.\n\n\nويجب أن تكون هذه المعايير:\n\n\n\t\n\tذات صلة (Relevant)\n\t\n\t\n\tكاملة (Complete)\n\t\n\t\n\tموثوقة (Reliable)\n\t\n\t\n\tمحايدة (Neutral)\n\t\n\t\n\tقابلة للفهم (Understandable)\n\t\n\n\nالمعايير المناسبة ليست فقط قوانين أو سياسات، بل إطارًا مرجعيًا معتمدًا لتقييم موضوع محدد.\n\n \n\n📚 المرجع:\nGRC Capability Model v3.5 – Assurance Framework (Suitable Criteria), p. 32–33"},{"qe":"How does the Lines of Accountability model facilitate governance, management, and assurance in an organization?","qa":"كيف يساهم نموذج خطوط المساءلة في تسهيل الحوكمة والإدارة والضمان بالمنظمة؟","oe":["By identifying processes and frameworks that clarify how each line contributes to creating and preserving value across performance, risk, and compliance","By managing employee performance and evaluation procedures in each line","By establishing communication between each line","By allocating financial and human resources across lines"],"oa":["من خلال التعرف على العمليات والأطر التي تركز على مساهمة كل \"خط\" في إنتاج القيمة والحفاظ عليها في مجالات الأداء والمخاطر والامتثال","من خلال إدارة أداء الموظفين وإجراءات تقييم الأداء في كل \"خط\" بما يسهم بمجالات الأداء والمخاطر والامتثال","من خلال تأسيس التواصل بين كل \"خط\" بما يسهم بمجالات الأداء والمخاطر والامتثال","من خلال تخصيص الموارد المالية والبشرية للأقسام المختلفة في كل \"خط\""],"c":0,"ch":"Perform Competent","ex":"Exam 2 - GRCP","fe":"The Lines of Accountability model clarifies:\n\n\n\t\n\tWho creates value\n\t\n\t\n\tWho protects value\n\t\n\t\n\tWho provides independent assurance\n\t\n\n\nIt is not merely about communication or resource allocation.\n\nIt defines how each line contributes to:\n\n\n\t\n\tValue creation\n\t\n\t\n\tValue preservation\n\t\n\t\n\tPerformance\n\t\n\t\n\tRisk management\n\t\n\t\n\tCompliance\n\t\n\n\n \n\n📚 Reference:\nGRC Capability Model v3.5 – Lines of Accountability & Value Creation/Preservation, p. 27–29","fa":"نموذج Lines of Accountability في GRC يهدف إلى:\n\n\n\t\n\tتوضيح الأدوار والمسؤوليات\n\t\n\t\n\tتحديد من يملك المخاطر\n\t\n\t\n\tتحديد من يشرف ويراقب\n\t\n\t\n\tتحديد من يقدم الضمان المستقل\n\t\n\n\nوهو لا يركز فقط على التواصل أو تخصيص الموارد، بل على:\n\n\nتنظيم مساهمة كل خط في إنتاج القيمة (Value Creation) وحمايتها (Value Preservation) ضمن مجالات الأداء والمخاطر والامتثال.\n\n\nالخط الأول ينتج القيمة،\nالخط الثاني يحمي القيمة،\nالخط الثالث يقدم الضمان المستقل.\n\n \n\n📚 المرجع:\nGRC Capability Model v3.5 – Lines of Accountability & Value Creation/Preservation, p. 27–29"},{"qe":"Security and Resilience specialization skills help the organization in which of the following?","qa":"مهارات تخصص الأمن والاستمرارية تساعد المنظمة في أي من التالي؟","oe":["Identifying mandatory and voluntary obligations, assessing risk, establishing policies, educating the workforce, and shaping ethical culture","Strengthening sales strategies, improving sales performance, managing sales channels, driving sales growth, and achieving sales targets","Identifying critical physical and digital assets, assessing and addressing related risks, measuring and monitoring risks, and executing crisis response actions","Prioritizing assurance activities, designing and executing evaluation plans, applying examination methods, and communicating to build trust"],"oa":["التعرف على الالتزامات الإجبارية والاختيارية، وتقدير المخاطر، ووضع السياسات، وتثقيف القوى العاملة، وتشكيل الثقافة الأخلاقية","تعزيز استراتيجيات المبيعات، وتحسين أداء المبيعات، وإدارة قنوات البيع، وتحريك نمو المبيعات، وتحقيق مستهدفات المبيعات","التعرف على أهم الأصول المادية والرقمية، وتقدير المخاطر المتعلقة بها ومواجهتها، وقياس ومراقبة المخاطر، وتنفيذ إجراءات الاستجابة للأزمات","ترتيب أولويات أنشطة الضمان، ووضع خطط التقييم وتنفيذها، واتباع طرق الفحص، والتواصل لتعزيز الثقة"],"c":2,"ch":"Key Concepts","ex":"Exam 2 - GRCP","fe":"Within the GRC Capability Model™, Security & Resilience specialization focuses on:\n\n\n\t\n\tProtecting critical assets\n\t\n\t\n\tMaintaining operational continuity\n\t\n\t\n\tManaging disruptions\n\t\n\t\n\tResponding to incidents\n\t\n\t\n\tReducing impact of crises\n\t\n\n\nIt includes:\n\n\n\t\n\tIdentifying critical physical and digital assets\n\t\n\t\n\tAssessing related risks\n\t\n\t\n\tCrisis response planning\n\t\n\t\n\tBusiness Continuity Planning (BCP)\n\t\n\t\n\tDisaster Recovery (DR)\n\t\n\n\n \n\n📚 Reference:\nGRC Capability Model v3.5 – Security & Resilience Specialization, p. 31","fa":"في نموذج ™GRC Capability Model، تخصص (الأمن والاستمرارية) يركز على:\n\n\n\t\n\tحماية الأصول الحيوية\n\t\n\t\n\tتعزيز القدرة على الاستمرار أثناء الأزمات\n\t\n\t\n\tإدارة الانقطاعات\n\t\n\t\n\tالاستجابة للحوادث\n\t\n\t\n\tتقليل تأثير التهديدات\n\t\n\n\nويشمل ذلك:\n\n\n\t\n\tتحديد الأصول الحرجة (Critical Assets)\n\t\n\t\n\tتقييم مخاطر الأمن السيبراني والمادي\n\t\n\t\n\tتطوير خطط الاستجابة للحوادث\n\t\n\t\n\tخطط استمرارية الأعمال (BCP)\n\t\n\t\n\tخطط التعافي من الكوارث (DRP)\n\t\n\n\n \n\n📚 المرجع:\nGRC Capability Model v3.5 – Security & Resilience Specialization, p. 31"},{"qe":"Audit and Assurance specialization skills help the organization in which of the following?","qa":"مهارات تخصص التدقيق والضمان تساعد المنظمة في أي من التالي؟","oe":["Prioritizing assurance activities, designing and executing evaluation plans, applying examination methods, and communicating to build trust","Identifying critical physical and digital assets, assessing and addressing related risks, measuring and monitoring risks, and executing crisis response actions","Managing mergers and acquisitions, evaluating investment opportunities, exercising due diligence, and integrating acquired businesses","Setting direction, defining objectives and metrics, identifying opportunities, reviewing strategies, and managing systems"],"oa":["ترتيب أولويات أنشطة الضمان، ووضع خطط التقييم وتنفيذها، واتباع طرق الفحص، والتواصل لتعزيز الثقة","التعرف على أهم الأصول المادية والرقمية، وتقدير المخاطر المتعلقة بها ومواجهتها، وقياس ومراقبة المخاطر، وتنفيذ إجراءات الاستجابة للأزمات","إدارة الدمج والاستحواذ، وتقييم فرص الاستثمار، واتخاذ الحيطة اللازمة، ودمج الأعمال التي تم الاستحواذ عليها","ضبط التوجه، وضبط الأهداف والمؤشرات، والتعرف على الفرص، ومراجعة الاستراتيجيات، وإدارة الأنظمة"],"c":0,"ch":"Key Concepts","ex":"Exam 2 - GRCP","fe":"Within the GRC Capability Model™, Audit & Assurance specialization focuses on:\n\n\n\t\n\tProviding independent evaluation\n\t\n\t\n\tAssessing subject matter against suitable criteria\n\t\n\t\n\tApplying professional examination methods\n\t\n\t\n\tPrioritizing assurance activities\n\t\n\t\n\tCommunicating results to build confidence\n\t\n\n\nAssurance activities include:\n\n\n\t\n\tPlanning\n\t\n\t\n\tExecution\n\t\n\t\n\tExamination\n\t\n\t\n\tReporting\n\t\n\t\n\tConfidence building\n\t\n\n\n \n\n📚 Reference:\nGRC Capability Model v3.5 – Audit & Assurance Specialization, p. 30–31","fa":"في نموذج ™GRC Capability Model، تخصص Audit & Assurance (التدقيق والضمان) يركز على:\n\n\n\t\n\tتقديم رأي مستقل\n\t\n\t\n\tتقييم موضوع الاختصاص مقابل معايير مناسبة\n\t\n\t\n\tتطبيق منهجيات فحص معتمدة\n\t\n\t\n\tترتيب أولويات مهام الضمان\n\t\n\t\n\tالتواصل بالنتائج لتعزيز الثقة\n\t\n\n\nأنشطة الضمان تشمل:\n\n\n\t\n\tالتخطيط (Planning)\n\t\n\t\n\tالتنفيذ (Execution)\n\t\n\t\n\tالفحص والتقييم (Examination & Evaluation)\n\t\n\t\n\tإصدار التقارير (Reporting)\n\t\n\t\n\tبناء الثقة (Building Confidence)\n\t\n\n\n \n\n📚 المرجع:\nGRC Capability Model v3.5 – Audit & Assurance Specialization, p. 30–31"},{"qe":"What criteria should objectives meet in order to be considered effective?","qa":"ما هي المعايير التي ينبغي أن تتسم بها الأهداف بها لكي تعتبر أهدافًا فعّالة؟","oe":["Objectives should be based solely on financial metrics for each unit","Objectives should have a uniform time horizon such as quarterly, annual, or five-year","Objectives should meet SMART criteria:\nSpecific, Measurable, Achievable, Relevant, and Time-bound","Most stakeholder groups should aspire to the objectives"],"oa":["أن تكون الأهداف مبنية فقط على المصفوفات المالية لكل وحدة أو قسم","أن يكون للأهداف نطاق زمني موحد، مثل النطاق الربع سنوي أو السنوي أو لمدة 5 سنوات","أن تستوفي الأهداف المعايير الذكية:\nمحددة ، قابلة للقياس ، قابلة للإنجاز ، ذات صلة ، ومحددة التوقيت","أن تسعى أغلب فئات أصحاب المصلحة للمنظمة إلى الأهداف"],"c":2,"ch":"Key Concepts","ex":"Exam 2 - GRCP","fe":"Within governance and performance alignment in the **GRC Capability Model™, effective objectives must be:\n\n\n\t\n\tClearly defined\n\t\n\t\n\tMeasurable\n\t\n\t\n\tAchievable\n\t\n\t\n\tStrategically relevant\n\t\n\t\n\tTime-bound\n\t\n\n\nThese align with the well-known SMART framework.\n\nSMART objectives ensure:\n\n\n\t\n\tClarity\n\t\n\t\n\tMeasurability\n\t\n\t\n\tAccountability\n\t\n\t\n\tAlignment with strategic intent\n\t\n\n\nOther options represent partial considerations but not comprehensive criteria.\n\n📚 Reference:\nGRC Capability Model v3.5 – Objectives & Performance Alignment, p. 18–19","fa":"في إطار الحوكمة وتحديد الأهداف ضمن GRC Capability Model™، يجب أن تكون الأهداف:\n\n\n\t\n\tواضحة ومحددة\n\t\n\t\n\tقابلة للقياس\n\t\n\t\n\tقابلة للتحقيق\n\t\n\t\n\tمرتبطة بالاستراتيجية\n\t\n\t\n\tمحددة بإطار زمني\n\t\n\n\nوهذه هي خصائص نموذج SMART الشهير في صياغة الأهداف الفعالة.\n\nوجود هذه المعايير يضمن:\n\n\n\t\n\tوضوح التوقعات\n\t\n\t\n\tإمكانية القياس والمتابعة\n\t\n\t\n\tإمكانية المساءلة\n\t\n\t\n\tربط الأداء بالنتائج\n\t\n\n\nأما باقي الخيارات فهي عناصر جزئية وليست معايير شاملة للأهداف الفعالة.\n\n📚 المرجع:\nGRC Capability Model v3.5 – Objectives & Performance Alignment, p. 18–19"},{"qe":"What are “detective procedures and controls” in the context of dealing with uncertainty?","qa":"ما هي \"الإجراءات والضوابط الاستقصائية\" في سياق التعامل مع الأحوال غير المؤكدة؟","oe":["Detective controls stimulate desired events and prevent undesirable events","Detective controls predict the likelihood of undesirable events occurring in the future","Detective controls monitor and identify the occurrence of desired and undesired events","Detective controls enhance desired events and correct undesirable events"],"oa":["الإجراءات والضوابط الاستقصائية تحفّز الأحداث المرغوبة وتمنع الأحداث غير المرغوبة","الإجراءات والضوابط الاستقصائية تتنبأ باحتمالية وقوع الأحداث غير المرغوبة في المستقبل","الإجراءات والضوابط الاستقصائية ترصد وقوع الأحداث المرغوبة والأحداث غير المرغوبة","الإجراءات والضوابط الاستقصائية تعزز تأثير الأحداث المرغوبة وتصحح وتعافي من الأحداث غير المرغوبة"],"c":2,"ch":"Perform Competent","ex":"Exam 2 - GRCP","fe":"Within the GRC Capability Model™, control types include:\n\n\n\t\n\tPreventive\n\t\n\t\n\tDetective\n\t\n\t\n\tCorrective\n\t\n\n\nDetective controls:\n\n\nIdentify and monitor events after or as they occur.\n\n\nThey do not prevent events (preventive), nor fix them (corrective), but detect them.\n\n \n\n📚 Reference:\nGRC Capability Model v3.5 – Controls (Preventive, Detective, Corrective), p. 25–26","fa":"في إطار إدارة المخاطر والضوابط ضمن GRC Capability Model، هناك أنواع مختلفة من الضوابط:\n\n\n\t\n\tوقائية (Preventive)\n\t\n\t\n\tاستقصائية / كشفية (Detective)\n\t\n\t\n\tتصحيحية (Corrective)\n\t\n\n\nالضوابط الاستقصائية (Detective Controls) تعني:\n\n\nرصد واكتشاف وقوع الحدث بعد حدوثه أو أثناء حدوثه.\n\n\nأي أنها لا تمنع الحدث (هذا دور الضوابط الوقائية)،\nولا تصححه (هذا دور الضوابط التصحيحية)،\nبل تكشفه وتحدد وقوعه.\n\n \n\n📚 المرجع:\nGRC Capability Model v3.5 – Controls (Preventive, Detective, Corrective), p. 25–26"},{"qe":"According to the Integrated Actions & Controls Model (IACM), what are the two types of proactive actions and controls?","qa":"وفق نموذج الإجراءات والضوابط المتكامل (IACM)، ما هما النوعان للإجراءات والضوابط الاستباقية؟","oe":["Reactive actions & controls and passive actions & controls","Quantitative actions & controls and qualitative actions & controls","Centralized and decentralized actions & controls","Preventive/Deterrent actions & controls and Enabling/Promotional actions & controls"],"oa":["الإجراءات والضوابط التفاعلية والإجراءات والضوابط السلبية","الإجراءات والضوابط الكمية والإجراءات والضوابط النوعية","الإجراءات والضوابط المركزية والإجراءات والضوابط غير المركزية","إجراءات وضوابط المنع/الردع وإجراءات وضوابط التعزيز/التمكين"],"c":3,"ch":"Key Concepts","ex":"Exam 2 - GRCP","fe":"Within the IACM framework of the GRC Capability Model, proactive actions and controls are classified into two primary categories:\n\n\n\t\n\tPreventive/Deterrent Controls\n\tThese are designed to reduce the likelihood of undesired events (risks, losses).\n\t\n\t\n\tEnabling/Promotional Controls\n\tThese aim to increase the likelihood of desired events (value creation, objective achievement).\n\t\n\n\nThe model emphasizes Principled Performance — balancing risk reduction with value creation.","fa":"في نموذج IACM ضمن GRC Capability Model يتم تقسيم الإجراءات والضوابط الاستباقية إلى نوعين أساسيين:\n\n\n\t\n\tإجراءات وضوابط المنع/الردع (Preventive/Deterrent Controls)\n\tوتهدف إلى تقليل احتمالية وقوع الأحداث غير المرغوبة (الخسائر والمخاطر).\n\t\n\t\n\tإجراءات وضوابط التعزيز/التمكين (Enabling/Promotional Controls)\n\tوتهدف إلى زيادة احتمالية وقوع الأحداث المرغوبة (المكاسب وتحقيق الأهداف).\n\t\n\n\nالنموذج لا يركز فقط على إدارة المخاطر، بل على تحقيق الأداء المنضبط (Principled Performance)، أي التوازن بين تقليل الخسائر وتعظيم القيمة."},{"qe":"What are the two types of events considered in the Integrated Actions & Controls Model (IACM)?","qa":"ما هما النوعان للأحداث التي تؤخذ بعين الاعتبار في نموذج الإجراءات والضوابط المتكامل (IACM)؟","oe":["Internal and external events","Quantitative and qualitative events","Expected and unexpected events","Desired and undesired events"],"oa":["الأحداث الداخلية والخارجية","الأحداث الكمية والنوعية","الأحداث المتوقعة وغير المتوقعة","الأحداث المرغوبة وغير المرغوبة"],"c":3,"ch":"Align Competent","ex":"Exam 2 - GRCP","fe":"According to the IACM within the GRC Capability Model, events are categorized as:\n\n\n\tDesired Events\n\n\nOutcomes that contribute to achieving objectives and creating organizational value.\n\n\n\tUndesired Events\n\n\nOutcomes that may result in loss, disruption, or failure to achieve objectives.\n\nThis distinction is central to Principled Performance — balancing value creation and risk mitigation.\n\nOCEG. (2019). GRC Capability Model v3.5 – Integrated Actions & Controls Model (IACM). pp. 172–175.","fa":"وفق نموذج IACM في GRC Capability Model، يتم تصنيف الأحداث إلى:\n\n\n\t أحداث مرغوبة (Desired Events)\n\n\nوهي النتائج أو الوقائع التي تدعم تحقيق الأهداف والقيمة المؤسسية.\n \n\n\n\t أحداث غير مرغوبة (Undesired Events)\n\n\nوهي النتائج التي تؤدي إلى خسائر أو تعطل الأهداف أو مخاطر.\n\nهذا التصنيف جوهري في النموذج لأنه يوازن بين:\n\n\n\t\n\tتعظيم القيمة (Value Creation)\n\t\n\t\n\tتقليل الخسائر (Risk Reduction)\n\t\n\n\nالنموذج لا يركز فقط على المخاطر، بل على إدارة المكاسب والخسائر معًا ضمن مفهوم الأداء المنضبط.\n \n\nنموذج قدرات الحوكمة والمخاطر والامتثال GRC Capability Model v3.5 – قسم IACM، ص 172–175."},{"qe":"In the Integrated Actions & Controls Model (IACM), what is the role of enabling/promotional actions and controls?","qa":"في نموذج الإجراءات والضوابط المتكامل (IACM)، ما دور الإجراءات والضوابط التعزيزية/الممكنة؟","oe":["Increasing the likelihood of desired events","Establishing clear communication channels within the organization","Setting performance metrics for all actions and controls","Preparing and enabling controls that mitigate security threats"],"oa":["زيادة احتمالية وقوع الأحداث المرغوبة","تأسيس مسارات واضحة للتواصل داخل المنظمة","وضع مقاييس الأداء لجميع الإجراءات والضوابط","إعداد وتمكين الضوابط التي تخفف من تهديدات الأمن المحتملة"],"c":0,"ch":"Key Concepts","ex":"Exam 2 - GRCP","fe":"Enabling or promotional controls are designed to:\n\n✔ Encourage behaviors that drive objective achievement\n✔ Support opportunities\n✔ Maximize organizational value\n\nThey differ from preventive controls, which aim to reduce undesired events.\n\nThe model promotes balance — not only loss prevention, but also value enablement.\n\nOCEG. (2019). GRC Capability Model v3.5 – IACM Section. pp. 176–178.","fa":"الإجراءات والضوابط التعزيزية (Enabling/Promotional Controls) تهدف إلى:\n\n✔ تعزيز السلوكيات والممارسات التي تؤدي إلى تحقيق الأهداف\n✔ دعم الفرص\n✔ تعظيم القيمة المؤسسية\n\nوهي تختلف عن ضوابط المنع التي تركز على تقليل الأحداث غير المرغوبة.\n\nالنموذج هنا يقدم منظورًا متوازنًا:\nليس فقط منع الخسائر، بل تمكين النجاح.\n\nOCEG. (2019). GRC Capability Model v3.5 – IACM Section. pp. 176–178."},{"qe":"What is the measure of the degree of dealing with requirements and obligations?","qa":"ما هو مقياس درجة التعامل مع المتطلبات والالتزامات؟","oe":["Violation","Compliance","Deviation","Non-compliance"],"oa":["المخالفة","الامتثال","الانحراف","عدم الامتثال"],"c":1,"ch":"Key Concepts","ex":"Exam 2 - GRCP","fe":"Compliance is the measure that reflects the extent to which an organization adheres to:\n\n\n\t\n\tLaws\n\t\n\t\n\tRegulations\n\t\n\t\n\tInternal policies\n\t\n\t\n\tContractual obligations\n\t\n\t\n\tRegulatory requirements\n\t\n\n\nIn other words, compliance measures the degree of alignment between organizational actions and imposed obligations.\n\nBy contrast:\n\n\n\t\n\tNon-compliance represents failure\n\t\n\t\n\tDeviation refers to divergence from a standard\n\t\n\t\n\tViolation indicates a breach\n\t\n\n\nThe question asks about the measurement of dealing with requirements — which is compliance.","fa":"الامتثال هو المقياس الذي يعبّر عن مدى التزام المنظمة بـ:\n\n\n\t\n\tالقوانين\n\t\n\t\n\tاللوائح\n\t\n\t\n\tالسياسات الداخلية\n\t\n\t\n\tالمعايير التعاقدية\n\t\n\t\n\tالمتطلبات التنظيمية\n\t\n\n\nبمعنى آخر، الامتثال هو درجة توافق الأداء والسلوك مع الالتزامات المفروضة.\n\nأما:\n\n\n\t\n\tعدم الامتثال هو نتيجة سلبية لغياب الامتثال\n\t\n\t\n\tالانحراف هو خروج عن معيار أو إجراء\n\t\n\t\n\tالمخالفة تشير إلى خرق فعلي\n\t\n\n\nلكن السؤال يسأل عن \"مقياس درجة التعامل\" — وهذا يتم قياسه عبر مستوى الامتثال."},{"qe":"In which organizational departments does the Value Protector typically work and provide advisory services?","qa":"في أي من أقسام المنظمة يعمل عادة مسؤول الحماية ويقدم الاستشارة؟","oe":["Board of Directors, Strategy, Risk, Compliance, Ethics, HR, Legal, Security, Quality, Internal Control, and Audit","Sales, Marketing, Finance, and Customer Service","R&D, Engineering, and Production","Supply Chain, Logistics, and Procurement"],"oa":["مجلس الإدارة والإدارة الاستراتيجية والمخاطر والامتثال والأخلاقيات والموارد البشرية والإدارة القانونية والأمن والجودة والرقابة الداخلية والتدقيق","المبيعات والتسويق والإدارة المالية وخدمة العملاء","الأبحاث والتطوير والهندسة والإنتاج","سلاسل الإمداد والخدمات اللوجستية المساندة والمشتريات"],"c":0,"ch":"Key Concepts","ex":"Exam 2 - GRCP","fe":"According to the GRC Capability Model, the Value Protector role typically operates within governance, oversight, and advisory functions rather than operational departments.\n\nThese include:\n\n\n\t\n\tBoard of Directors\n\t\n\t\n\tStrategic management\n\t\n\t\n\tRisk management\n\t\n\t\n\tCompliance\n\t\n\t\n\tEthics\n\t\n\t\n\tHuman resources\n\t\n\t\n\tLegal\n\t\n\t\n\tSecurity\n\t\n\t\n\tQuality\n\t\n\t\n\tInternal control\n\t\n\t\n\tInternal audit\n\t\n\n\nThese are commonly associated with second and third lines of accountability.\n\nThey are responsible for:\n\n✔ Establishing policies\n✔ Monitoring performance\n✔ Providing advisory services\n✔ Ensuring compliance\n✔ Protecting the organization from risk\n\nThey do not directly execute core revenue-generating activities.\n \n\nGRC Capability Model v3.5 – Protection & Performance Roles, Three Lines Concept, pp. 95–110.","fa":"وفق نموذج GRC Capability Model، فإن مسؤول الحماية (Value Protector) يعمل عادة ضمن وظائف الحوكمة والرقابة والدعم الاستشاري، وليس ضمن العمليات التشغيلية الأساسية.\n\nتشمل هذه الوظائف:\n\n\n\t\n\tمجلس الإدارة\n\t\n\t\n\tالإدارة الاستراتيجية\n\t\n\t\n\tإدارة المخاطر\n\t\n\t\n\tالامتثال\n\t\n\t\n\tالأخلاقيات\n\t\n\t\n\tالموارد البشرية\n\t\n\t\n\tالإدارة القانونية\n\t\n\t\n\tالأمن\n\t\n\t\n\tالجودة\n\t\n\t\n\tالرقابة الداخلية\n\t\n\t\n\tالتدقيق الداخلي\n\t\n\n\nهذه الوظائف تُعرف غالبًا بوظائف \"الخط الثاني والثالث\" في نموذج خطوط المساءلة، وهي مسؤولة عن:\n\n✔ وضع السياسات\n✔ مراقبة الأداء\n✔ تقديم الاستشارات\n✔ ضمان الالتزام\n✔ حماية المنظمة من المخاطر\n\nوليست مسؤولة عن تحقيق الإيرادات أو تنفيذ العمليات اليومية مباشرة.\nGRC Capability Model v3.5 – Protection & Performance Roles, Three Lines Concept, pp. 95–110."},{"qe":"What approach does a high-performing protector value  follow in order to leverage the best strengths and techniques from all critical disciplines?","qa":"ما النهج الذي يتبعه مسؤول الحماية ذو الأداء العالي في عمله لاستغلال أفضل نقاط القوة والتقنيات من جميع التخصصات الحرجة؟","oe":["Financial-focused approach","Goal-focused approach","Multidisciplinary approach","IT-focused approach"],"oa":["منهجية تركز على النواحي المالية","منهجية تركز على تحقيق الأهداف","منهجية متعددة التخصصات","منهجية تركز على تقنية المعلومات"],"c":2,"ch":"Key Concepts","ex":"Exam 2 - GRCP","fe":"According to the GRC Capability Model, a high-performing protection professional does not operate within a single discipline (such as legal, finance, or IT).\n\nInstead, they adopt a multidisciplinary approach, integrating best practices from:\n\n✔ Risk management\n✔ Compliance\n✔ Ethics\n✔ Audit\n✔ Security\n✔ Strategy\n✔ HR\n✔ Technology\n\nIn today’s complex and interconnected environment, siloed approaches create governance gaps.\n\nA high-performing protection officer:\n\n\n\t\n\tIntegrates disciplines\n\t\n\t\n\tSees the big picture\n\t\n\t\n\tBalances performance and protection\n\t\n\t\n\tCreates value while reducing risk","fa":"وفق نموذج GRC Capability Model، فإن مسؤول الحماية عالي الأداء لا يعمل ضمن تخصص واحد فقط (قانوني أو مالي أو تقني)، بل يعتمد على:\n\n✔ دمج أفضل الممارسات من المخاطر\n✔ الامتثال\n✔ الأخلاقيات\n✔ التدقيق\n✔ الأمن\n✔ الإدارة الاستراتيجية\n✔ الموارد البشرية\n✔ التقنية\n\nهذا ما يُعرف بالنهج المتكامل أو متعدد التخصصات (Integrated / Multidisciplinary Approach).\n\nلأن بيئة المخاطر الحديثة (VUCA) معقدة ومترابطة، فإن العمل المنعزل داخل تخصص واحد يؤدي إلى فجوات رقابية.\n\nالمسؤول عالي الأداء:\n\n\n\t\n\tيربط بين التخصصات\n\t\n\t\n\tيفهم الصورة الشاملة\n\t\n\t\n\tيوازن بين الأداء والحماية\n\t\n\t\n\tيخلق قيمة وليس فقط يمنع الخسائر\n\t \n\n\t Page 100-108  GRC Capability Model v3.5"},{"qe":"Which critical protection discipline includes managing obligations and shaping ethical culture?","qa":"أي من التخصصات الحرجة لمهارات مسؤول الحماية يشمل مهارة التعامل مع الالتزامات وتشكيل الثقافة الأخلاقية؟","oe":["Governance and Oversight","Compliance and Ethics","Security and Continuity","Audit and Assurance"],"oa":["الحوكمة والرقابة","الامتثال والأخلاقيات","الأمن والاستمرارية","التدقيق والضمان"],"c":1,"ch":"Key Concepts","ex":"Exam 2 - GRCP","fe":"The Compliance and Ethics discipline in the GRC Capability Model focuses on:\n\n✔ Identifying legal and regulatory obligations\n✔ Ensuring regulatory adherence\n✔ Building an ethical organizational culture\n✔ Promoting integrity\n✔ Managing conflicts of interest\n✔ Establishing codes of conduct\n\nThis discipline goes beyond formal compliance — it embeds ethical behavior into everyday organizational conduct.\n\nBy contrast:\n\n\n\t\n\tSecurity and Continuity focus on asset protection and resilience\n\t\n\t\n\tGovernance and Oversight focus on strategic supervision\n\t\n\t\n\tAudit and Assurance focus on independent evaluation\n\t\n\n\nShaping ethical culture and managing obligations fall under Compliance and Ethics.\n \n\nGRC Capability Model v3.5 – Protection Disciplines: Compliance & Ethics, pp. 102–106.","fa":"تخصص الامتثال والأخلاقيات في نموذج GRC Capability Model يركز على:\n\n✔ تحديد الالتزامات القانونية والتنظيمية\n✔ التأكد من الالتزام باللوائح\n✔ بناء ثقافة أخلاقية داخل المنظمة\n✔ تعزيز النزاهة\n✔ معالجة تضارب المصالح\n✔ وضع مدونات السلوك\n\nهذا التخصص لا يقتصر على الالتزام الشكلي بالقوانين، بل يشمل تشكيل الثقافة المؤسسية بحيث تصبح الأخلاق جزءًا من السلوك اليومي.\n\nأما:\n\n\n\t\n\tالأمن والاستمرارية يركز على حماية الأصول والتعافي من الأزمات\n\t\n\t\n\tالحوكمة والرقابة يركز على الإشراف الاستراتيجي\n\t\n\t\n\tالتدقيق والضمان يركز على التقييم المستقل\n\t\n\n\nلكن تشكيل الثقافة الأخلاقية وإدارة الالتزامات يقع ضمن الامتثال والأخلاقيات.\nGRC Capability Model v3.5 – Protection Disciplines: Compliance & Ethics, pp. 102–106."},{"qe":"In the context of the GRC Capability Model, what is the purpose of having a maturity model?","qa":"في سياق نموذج قدرات الحوكمة والمخاطر والامتثال (GRC)، ما هو الغرض من وجود نموذج قياس النضج؟","oe":["The maturity model provides templates to document practices at each level","The maturity model defines hierarchical roles for GRC professionals","The maturity model prioritizes regulatory requirements","The maturity model provides a structured progression to assess organizational capability and gradually improve maturity levels"],"oa":["يقدم نموذج النضج قوالب لتوثيق الممارسات على كل مستوى من مستويات النضج","يحدد نموذج النضج التسلسل الهرمي للأدوار والمسؤوليات الخاصة بمحترفي الحوكمة والمخاطر والامتثال","يرتب نموذج النضج أولويات المتطلبات النظامية والقانونية لممارسات الحوكمة والمخاطر والامتثال","يقدم نموذج النضج تسلسلاً نظريًا لتقييم قدرة المنظمة على أداء الممارسات وتطوير مستوى النضج تدريجيًا من مستوى إلى آخر"],"c":3,"ch":"Key Concepts","ex":"Exam 2 - GRCP","fe":"The GRC maturity model is not designed to provide templates or define roles. Instead, it:\n\n✔ Establishes a progressive framework\n✔ Assesses the maturity of practices\n✔ Identifies gaps\n✔ Determines the organization’s current level\n✔ Guides improvement from one level to the next\n\nIt serves as a continuous improvement roadmap for governance, risk, and compliance capabilities.\n\nThe progression typically moves from:\n\n\n\t\n\tAd hoc practices\n\t\n\t\n\tManaged practices\n\t\n\t\n\tMeasured practices\n\t\n\t\n\tContinuously improved practices\n\t\n\tGRC Capability Model v3.5\n\tMaturity Model Section, pp. 210–220","fa":"نموذج قياس النضج في GRC ليس أداة توثيق أو تحديد أدوار، بل هو:\n\n✔ إطار تدرجي\n✔ يقيّم مستوى نضج الممارسات\n✔ يوضح الفجوات\n✔ يحدد موقع المنظمة الحالي\n✔ يرشدها للانتقال من مستوى إلى آخر\n\nهو أداة تقييم وتحسين مستمر، تساعد المنظمة على تطوير قدراتها في الحوكمة والمخاطر والامتثال بشكل تدريجي ومنهجي.\n\nالنموذج يُظهر:\n\n\n\tمن ممارسات عشوائية\n\tإلى ممارسات مُدارة\n\tإلى ممارسات مُقاسة\n\tإلى ممارسات مُحسّنة باستمرار\n\tGRC Capability Model v3.5\n\tMaturity Model Section, pp. 210–220"},{"qe":"In the maturity model context, what characterizes Level 5 practices?","qa":"في سياق نموذج قياس النضج، يتميز ممارسات المستوى 5؟","oe":["Practices are ad hoc and chaotic","Practices are measured and evidence-based","Practices are defined and managed but sometimes informal","Practices are continuously improved over time"],"oa":["الممارسات مرتجلة وعفوية وغالبًا فوضوية","الممارسات يتم قياسها وإدارتها بالأدلة المبنية بالبيانات","الممارسات محددة ويتم إدارتها ولكن بشكل غير رسمي أحيانًا","الممارسات يتم تحسينها بانتظام مع مرور الوقت"],"c":3,"ch":"Key Concepts","ex":"Exam 2 - GRCP","fe":"Level 5 represents the highest maturity level.\n\nAt this level:\n\n✔ Practices are stable\n✔ Performance is measured\n✔ Data is used\n✔ Continuous improvement exists\n✔ Ongoing optimization occurs\n\nContinuous improvement distinguishes Level 5 from Level 4 (which focuses on measurement).\n \n\nGRC Capability Model v3.5 –\nMaturity Levels Description (Levels 1–5), pp. 212–218.","fa":"المستوى الخامس يمثل أعلى درجات النضج.\n\nفي هذا المستوى:\n\n✔ توجد ممارسات مستقرة\n✔ يتم قياس الأداء\n✔ يتم استخدام البيانات\n✔ يوجد تحسين مستمر\n✔ توجد مراجعة دورية وتطوير منهجي\n\nالتحسين المستمر هو السمة الفارقة للمستوى 5، وهو ما يتجاوز مجرد القياس (المستوى 4).\n\nGRC Capability Model v3.5 –\nMaturity Levels Description (Levels 1–5), pp. 212–218."},{"qe":"In the context of assurance activities, what does the term \"subject matter\" mean?","qa":"في سياق أنشطة الضمان، ما معنى مصطلح \"موضوع الاختصاص\"؟","oe":["Training programs, workshops, and seminars","Statements, conditions, events, or activities that can be evidenced","Financial reports and accounting records","Policies, procedures, and guidelines"],"oa":["برامج التدريب وورش العمل والندوات","عبارات أو ظروف أو أحداث أو أنشطة مميزة يمكن إثباتها بالأدلة","التقارير المالية وسجلات المحاسبة","السياسات والإجراءات والإرشادات"],"c":1,"ch":"Key Concepts","ex":"Exam 2 - GRCP","fe":"In assurance activities, subject matter refers to the item being evaluated, examined, or reported on.\n\nIt may include:\n\n✔ A process\n✔ An activity\n✔ A system\n✔ A statement\n✔ An event\n✔ A condition\n✔ Performance outcomes\n\nThe essential requirement is that it must be capable of being evaluated and supported by objective evidence.\n\nThus, the most accurate definition is:\n\n“Statements, conditions, events, or activities that can be evidenced.”\n\nFinancial reports or policies are examples of subject matter — but they do not define the term comprehensively.\n\nGRC Capability Model v3.5 –\nAssurance Activities & Subject Matter Definition, pp. 150–155.","fa":"في أنشطة الضمان، يُقصد بـ موضوع الاختصاص (Subject Matter) الشيء الذي يتم تقييمه أو فحصه أو تقديم رأي مستقل بشأنه.\n\nوقد يكون:\n\n✔ عملية\n✔ نشاطًا\n✔ نظامًا\n✔ بيانًا\n✔ حدثًا\n✔ حالة\n✔ أداءً معينًا\n\nالشرط الأساسي هو أن يكون قابلاً للتقييم والتحقق بالأدلة الموضوعية.\n\nلذلك التعريف الأدق هو:\n\"عبارات أو ظروف أو أحداث أو أنشطة يمكن إثباتها بالأدلة\".\n\nأما:\n\n\n\t\n\tالتقارير المالية مثال على موضوع اختصاص، لكنها ليست التعريف العام.\n\t\n\t\n\tالسياسات مثال أيضًا، لكنها ليست المفهوم الشامل.\n\t\n\n\nالمفهوم أوسع من مجرد نوع محدد من المستندات.\n\nGRC Capability Model v3.5 –\nAssurance Activities & Subject Matter Definition, pp. 150–155."},{"qe":"In the context of Principled Performance, what does the term \"Reliability\" refer to?","qa":"إلى ماذا يشير مصطلح \"الموثوقية\" في سياق الأداء المنضبط؟","oe":["Flexibility, adaptability, and innovation","Consistency, reliability, and transparency in achieving objectives and dealing with uncertainty with integrity","Authority and assertiveness in leadership","Caution and risk avoidance in decision-making"],"oa":["المرونة والتكيف والابتكار في تحقيق الأهداف","الاتساق والاعتمادية والشفافية في تحقيق الأهداف وفي التعامل مع الأحوال غير المؤكدة وفي نزاهة العمل","الاعتماد والهيمنة والحزم في القيادة لكي يعتمد الجميع على فهمهم لما هو مطلوب منهم","الحيطة والحذر وتجنب المخاطر والتحفظ في اتخاذ القرار"],"c":1,"ch":"Key Concepts","ex":"Exam 2 - GRCP","fe":"In the GRC Capability Model, reliability refers to an organization that:\n\n✔ Acts with integrity\n✔ Achieves objectives consistently\n✔ Is reliable\n✔ Operates transparently\n✔ Manages uncertainty responsibly\n\nReliabilityis not merely about risk avoidance, innovation, or leadership authority.\n\nIt is about achieving objectives in a principled, reliable, and ethical manner — earning stakeholder trust.\n\nGRC Capability Model v3.5 –\nPrincipled Performance Definition & Trustworthiness Concept, pp. 10–18.","fa":"في نموذج GRC Capability Model، الموثوقية  تعني أن المنظمة:\n\n✔ تتصرف بنزاهة\n✔ تحقق أهدافها بطريقة متسقة\n✔ يمكن الاعتماد عليها\n✔ تتعامل بشفافية\n✔ تدير عدم اليقين بوعي ومسؤولية\n\nالموثوقية ليست مجرد تجنب المخاطر، وليست الابتكار فقط، وليست الهيمنة القيادية.\n\nهي القدرة على:\n\nتحقيق الأهداف بطريقة أخلاقية، مستقرة، ويمكن الوثوق بها من قبل أصحاب المصلحة.\n\nوهذا المفهوم هو جوهر Principled Performance.\n \n\nGRC Capability Model v3.5 –\nPrincipled Performance Definition & Trustworthiness Concept, pp. 10–18."},{"qe":"Regardless of overlap or ambiguity, why is it important to distinguish between “Governance” and “Management”?","qa":"بصرف النظر عن التداخل والغموض المحتمل، ما أهمية التمييز بين \"الإدارة\" و\"الحوكمة\"؟","oe":["To avoid conflicts of interest and unethical behavior","To clarify roles and responsibilities in directing, monitoring, and evaluating entities or operations, ensuring effective governance, management, and assurance","To facilitate communication and collaboration","To ensure the organization achieves financial targets"],"oa":["لتجنب تعارض المصالح والسلوك غير الأخلاقي في المنظمة","لتوضيح أدوار الأفراد وفرق العمل ومسؤولياتهم في توجيه ومراقبة وتقييم الكيانات أو العمليات أو الموارد، ولضمان فعالية الحوكمة والإدارة والضمان","للتمييز بين الإدارة والحوكمة لتسهيل التواصل والتعاون بين الأقسام","للتمييز بين الإدارة والحوكمة لضمان أن المنظمة تحقق المستهدفات المالية وأهداف الإيرادات"],"c":1,"ch":"Key Concepts","ex":"Exam 2 - GRCP","fe":"Within the GRC Capability Model, distinguishing governance from management is critical to:\n\n✔ Clarify who sets direction (Governance)\n✔ Who executes operations (Management)\n✔ Who independently evaluates performance (Assurance)\n\nGovernance focuses on:\n\n\n\t\n\tDirection\n\t\n\t\n\tOversight\n\t\n\t\n\tAccountability\n\t\n\t\n\tEnsuring objectives are achieved reliably\n\t\n\n\nManagement focuses on:\n\n\n\t\n\tExecution\n\t\n\t\n\tResource utilization\n\t\n\t\n\tOperational control\n\t\n\n\nThis distinction enhances accountability and ensures Principled Performance.\n\nGRC Capability Model v3.5 –\nGovernance vs Management Distinction, pp. 35–45.","fa":"في نموذج GRC Capability Model، التمييز بين الحوكمة والإدارة ضروري من أجل:\n\n✔ تحديد من يضع التوجيه الاستراتيجي (Governance)\n✔ من ينفذ العمليات اليومية (Management)\n✔ من يقوم بالمراجعة المستقلة (Assurance)\n\nالحوكمة تركز على:\n\n\n\t\n\tالتوجيه\n\t\n\t\n\tالإشراف\n\t\n\t\n\tالمساءلة\n\t\n\t\n\tضمان تحقيق الأهداف بطريقة موثوقة\n\t\n\n\nالإدارة تركز على:\n\n\n\t\n\tالتنفيذ\n\t\n\t\n\tتشغيل الموارد\n\t\n\t\n\tإدارة العمليات\n\t\n\n\nالتمييز بينهما يمنع تداخل المسؤوليات ويعزز وضوح المساءلة، مما يرفع فعالية الأداء المنضبط.\n\nGRC Capability Model v3.5 –\nGovernance vs Management Distinction, pp. 35–45."},{"qe":"In the context of Principled Performance, why is it important to align objectives with stakeholder expectations?","qa":"في سياق الأداء المنضبط، ما أهمية ضبط الأهداف باتساق مع توقعات أصحاب المصلحة؟","oe":["To focus solely on financial performance","To ensure the organization’s activities are designed to meet stakeholder expectations","To reduce the need for continuous stakeholder communication","To avoid uncertainty and risks"],"oa":["للتركيز فقط على الأداء المالي للمنظمة","لضمان أن أعمال المنظمة تم تصميمها لتحقيق توقعات أصحاب المصلحة","لوضع خطة تقلل من الحاجة للتواصل المستمر مع أصحاب المصلحة","لتجنب الأحوال غير المؤكدة والمخاطر داخل المنظمة"],"c":1,"ch":"Key Concepts","ex":"Exam 2 - GRCP","fe":"Under the GRC Capability Model, Principled Performance is not limited to achieving internal targets. It emphasizes:\n\n✔ Sustainable value creation\n✔ Earning stakeholder trust\n✔ Acting reliably and ethically\n\nTherefore, objectives must be aligned with the expectations of:\n\n\n\t\n\tShareholders\n\t\n\t\n\tCustomers\n\t\n\t\n\tRegulators\n\t\n\t\n\tEmployees\n\t\n\t\n\tSociety\n\t\n\n\nMisaligned objectives may generate short-term financial results but damage long-term trust and sustainability.\n \n\nGRC Capability Model v3.5 –\nPrincipled Performance & Stakeholder Alignment, pp. 25–40.","fa":"في نموذج GRC Capability Model، الأداء المنضبط لا يقتصر على تحقيق أهداف داخلية، بل يرتبط بـ:\n\n✔ تحقيق قيمة مستدامة\n✔ كسب ثقة أصحاب المصلحة\n✔ العمل بطريقة موثوقة وأخلاقية\n\nلذلك يجب أن تُصاغ الأهداف بما يتوافق مع توقعات:\n\n\n\t\n\tالمساهمين\n\t\n\t\n\tالعملاء\n\t\n\t\n\tالجهات التنظيمية\n\t\n\t\n\tالموظفين\n\t\n\t\n\tالمجتمع\n\t\n\n\nإذا لم تكن الأهداف متسقة مع هذه التوقعات، فقد تحقق المنظمة نتائج مالية قصيرة الأجل لكنها تفقد الثقة والاستدامة.\n\nGRC Capability Model v3.5 –\nPrincipled Performance & Stakeholder Alignment, pp. 25–40."},{"qe":"Why is having a clear accountability structure for each objective important in GRC?","qa":"ما أهمية وجود هيكل واضح للمساءلة لكل هدف في الحوكمة والمخاطر والامتثال (GRC)؟","oe":["A clear accountability structure ensures a single ultimate owner for each objective with the necessary authority and resources","Eliminates the need for evaluation and performance feedback","Allows full delegation of decisions without management oversight","Allows objective owners to modify targets freely"],"oa":["وجود هيكل واضح للمساءلة يضمن تعيين مالك واحد ونهائي لكل هدف وتزويده بالموارد والسلطة اللازمة لتحقيقه","يلغي الحاجة إلى التقييم وملاحظات الأداء","يسمح بتفويض جميع صلاحيات اتخاذ القرار دون مراجعة إدارية","يتيح للمسؤول عن الهدف تعديل المستهدفات حسب ما يراه مناسبًا"],"c":0,"ch":"Key Concepts","ex":"Exam 2 - GRCP","fe":"In the GRC Capability Model, accountability means:\n\n✔ Assigning a clear owner for each objective\n✔ Establishing ultimate responsibility\n✔ Providing adequate authority and resources\n✔ Clarifying escalation paths\n\nWithout a clear accountability structure:\n\n\n\t\n\tResponsibilities become blurred\n\t\n\t\n\tRoles overlap\n\t\n\t\n\tPrincipled Performance weakens\n\t\n\n\nAccountability does not eliminate oversight — it clarifies ownership.\n\n\n📚 Reference\n\nGRC Capability Model v3.5 –\nAccountability & Objective Ownership, pp. 60–75.","fa":"في نموذج GRC، المساءلة (Accountability) تعني:\n\n✔ تحديد مالك واضح لكل هدف\n✔ وجود مسؤولية نهائية واضحة\n✔ توفير الموارد والصلاحيات المناسبة\n✔ وضوح خطوط التصعيد\n\nبدون هيكل مساءلة واضح:\n\n\n\t\n\tتضيع المسؤوليات\n\t\n\t\n\tيحدث تداخل في الأدوار\n\t\n\t\n\tتقل فعالية الأداء المنضبط\n\t\n\n\nالمساءلة لا تعني التفويض المطلق، ولا تعني إلغاء الرقابة، بل تعني وضوح من هو المسؤول النهائي عن تحقيق الهدف.\n\nGRC Capability Model v3.5 \nAccountability & Objective Ownership, pp. 60–75."},{"qe":"What is the difference between a mission and a vision?","qa":"ما الفرق بين المهمة والرؤية؟","oe":["Mission is defined by external stakeholders; vision by internal stakeholders","Mission is short-term financial; vision is long-term non-financial","Mission applies to for-profit; vision to non-profit","Mission defines purpose; vision describes future aspiration"],"oa":["المهمة يتم تحديدها من قبل أصحاب المصلحة الخارجيين، بينما الرؤية يتم تحديدها من قبل أصحاب المصلحة الداخليين","المهمة هدف مالي قصير المدى، والرؤية هدف غير مالي طويل المدى","المهمة للمنظمات الربحية، والرؤية لغير الربحية","المهمة تصف غرض المنظمة وسبب وجودها، بينما الرؤية تصف ما تطمح إليه المنظمة في المستقبل"],"c":3,"ch":"Key Concepts","ex":"Exam 2 - GRCP","fe":"Mission:\n\n✔ Defines the organization’s purpose\n✔ Explains why it exists\n✔ Describes what it does\n\nVision:\n\n✔ Describes the desired future state\n✔ Explains where the organization aspires to go\n✔ Reflects long-term ambition\n\nIn simple terms:\n\nMission = Why we exist\nVision = Where we want to go\n\nGRC Capability Model v3.5 –\nMission, Vision & Objective Alignment, pp. 28–35.","fa":"المهمة (Mission):\n\n✔ تصف سبب وجود المنظمة\n✔ تحدد غرضها الأساسي\n✔ تشرح ماذا تفعل ولماذا\n\nالرؤية (Vision):\n\n✔ تصف الصورة المستقبلية المرغوبة\n✔ توضح ما تطمح المنظمة للوصول إليه\n✔ تعبر عن الطموح طويل المدى\n\nبمعنى مبسط:\n\nالمهمة = لماذا نوجد؟\nالرؤية = إلى أين نريد أن نصل؟\n\nGRC Capability Model v3.5 –\nMission, Vision & Objective Alignment, pp. 28–35."},{"qe":"What term is used to describe causes that can result in a benefit?","qa":"ما هو المصطلح الذي يُطلق على المسببات التي يمكن أن تتسبب في منفعة؟","oe":["Objectives","Opportunities","Indicators","Hazard"],"oa":["المستهدفات","الآمال","المؤشرات","Hazard"],"c":1,"ch":"Key Concepts","ex":"Exam 2 - GRCP","fe":"Within the GRC framework, risk is not limited to negative events. It refers to uncertainty that may result in:\n\n✔ Positive outcomes (opportunities)\n✔ Negative outcomes (threats)\n\nCauses that can lead to benefits are referred to as:\n\n📌 Opportunities\n\nThese are events or conditions that may enhance objective achievement or increase value.\n\nBy contrast:\n\n\n\t\n\tHazard refers to a source of harm\n\t\n\t\n\tObjectives are desired outcomes\n\t\n\t\n\tIndicators are measurement tools\n\t\n\n\nThe correct term for benefit-causing factors is opportunities.\n\nGRC Capability Model v3.5 –\nRisk & Opportunity Concept within Principled Performance, pp. 45–55.","fa":"في إطار GRC، لا يتم النظر إلى المخاطر فقط كأحداث سلبية، بل كاحتمال انحراف عن الهدف قد يكون:\n\n✔ إيجابيًا (فرصة)\n✔ سلبيًا (تهديد)\n\nالمسببات التي يمكن أن تؤدي إلى منفعة تُسمى:\n\n📌 فرص (Opportunities)\n\nوهي أحداث أو ظروف قد تعزز تحقيق الأهداف أو تزيد من القيمة.\n\nأما:\n\n\n\t\n\tHazard يشير إلى مصدر خطر أو تهديد\n\t\n\t\n\tObjectives هي النتائج المرغوبة\n\t\n\t\n\tIndicators هي أدوات قياس\n\t\n\n\nلكن السؤال يسأل عن المسببات التي تؤدي إلى منفعة — وهذا هو مفهوم الفرص.\n\nGRC Capability Model v3.5 –\nRisk & Opportunity Concept within Principled Performance, pp. 45–55."},{"qe":"What are “Obstacles” in the context of dealing with uncertainty?","qa":"ما هي \"العقبات\" في سياق التعامل مع الأحوال غير المؤكدة؟","oe":["Future uncertain events that generally have a negative impact on objectives","Future uncertain events that the organization should plan for to avoid any change in its objectives","Past confirmed events that negatively affected objectives and cannot be overcome","Future certain events that will definitely have a negative impact on objectives"],"oa":["هي أحداث مستقبلية غير مؤكدة لها تأثير سلبي على الأهداف بشكل عام","هي أحداث مستقبلية غير مؤكدة ينبغي أن تخطط لها المنظمة لتجنب أي تغيير في أهدافها","هي أحداث سابقة مؤكدة كان لها تأثير سلبي على الأهداف لا يمكن التغلب عليها","هي أحداث مستقبلية مؤكدة وقطعًا لها تأثير سلبي على الأهداف"],"c":0,"ch":"Key Concepts","ex":"Exam 2 - GRCP","fe":"In risk and uncertainty management:\n\n\n\t\n\tObstacles refer to future uncertain events\n\t\n\t\n\tThey may negatively affect objectives\n\t\n\t\n\tThey are NOT certain\n\t\n\t\n\tIf they are certain, they are considered issues, not risks\n\t\n\n\nTherefore, the correct definition aligns with the concept of a negative risk (threat).\n\n\n\t\n\tISO 31000: Risk = “Effect of uncertainty on objectives”\n\t\n\t\n\tOCEG GRC Capability Model\n\t\n\t\n\tCOSO ERM Framework 2017","fa":"في سياق إدارة المخاطر وGRC:\n\n\n\t\n\t\"العقبات\" تشير إلى أحداث مستقبلية غير مؤكدة\n\t\n\t\n\tلها تأثير سلبي محتمل على تحقيق الأهداف\n\t\n\t\n\tلكنها ليست مؤكدة الوقوع\n\t\n\t\n\tوإذا كانت مؤكدة فهي ليست مخاطرة بل مشكلة (Issue)\n\t\n\n\nإذن التعريف الدقيق يطابق مفهوم الخطر السلبي (Threat Risk).\n\n\n\t\n\tISO 31000: Risk = “Effect of uncertainty on objectives”\n\t\n\t\n\tOCEG GRC Capability Model\n\t\n\t\n\tCOSO ERM Framework 2017"},{"qe":"In the context of Principled Performance, what does “Acting with Integrity” mean for an organization?","qa":"في سياق الأداء المنضبط، ماذا تعني عبارة \"العمل بنزاهة\" بالنسبة للمنظمة؟","oe":["Complying with all standards and best industry practices","Maintaining a strong public image and positive reputation","Maximizing financial returns for stakeholders","Acting according to the organization’s values and within mandatory and voluntary boundaries"],"oa":["تعني الالتزام بجميع المعايير وأفضل الممارسات المتبعة في القطاع","تعني الحفاظ على صورة عامة قوية وسمعة تجارية إيجابية","تعني تحقيق أعلى العوائد المالية الممكنة لأصحاب المصلحة","تعني العمل بقيم المنظمة والعمل ضمن الحدود الإجبارية والاختيارية"],"c":3,"ch":"Key Concepts","ex":"Exam 2 - GRCP","fe":"According to OCEG’s Principled Performance:\n\nActing with integrity means:\n\n\n\t\n\tOperating according to core values\n\t\n\t\n\tRespecting mandatory obligations\n\t\n\t\n\tHonoring voluntary commitments\n\t\n\t\n\tMaking decisions aligned with principles\n\t\n\n\nIntegrity is not just compliance, reputation, or profitability.\nIt is about principled action under uncertainty.\n \n\n\n\t\n\tOCEG GRC Capability Model\n\t\n\t\n\tOCEG Principled Performance Framework\n\t\n\t\n\tISO 37301 Compliance Management\n\t\n\t\n\tISO 37000 Governance of Organizations","fa":"في نموذج OCEG – Principled Performance:\n\nالعمل بنزاهة يعني:\n\n\n\t\n\tالالتزام بالقيم الأساسية\n\t\n\t\n\tالالتزام بالقوانين والمتطلبات الإلزامية\n\t\n\t\n\tاحترام الالتزامات الطوعية والمعايير الأخلاقية\n\t\n\t\n\tاتخاذ قرارات متسقة مع المبادئ\n\t\n\n\nالنزاهة لا تعني فقط الامتثال، ولا تعني السمعة، ولا تعني الربحية، بل تعني العمل وفق القيم والمبادئ حتى في حالات عدم اليقين.\n\n\n\t\n\tOCEG GRC Capability Model\n\t\n\t\n\tOCEG Principled Performance Framework\n\t\n\t\n\tISO 37301 Compliance Management\n\t\n\t\n\tISO 37000 Governance of Organizations"},{"qe":"How does the Integrated Assurance & Control Model (IACM) deal with desirable events (Opportunities)?","qa":"كيف يتعامل نموذج الإجراءات والضوابط المتكامل (IACM) مع الأحداث المرغوبة المتعلقة بالفرص؟","oe":["Increasing the likelihood and ultimate positive impact","Focusing only on short-term objectives","Prioritizing financial gains over other considerations","Eliminating all risks and potential threats"],"oa":["من خلال زيادة الاحتمالية والأثر النهائي للمنفعة","من خلال التركيز فقط على الأهداف قصيرة المدى","من خلال إعطاء الأولوية للمكاسب المالية على الاعتبارات الأخرى","من خلال إزالة جميع المخاطر والتهديدات المحتملة"],"c":0,"ch":"Key Concepts","ex":"Exam 2 - GRCP","fe":"Within the IACM framework, events are categorized as:\n\n\n\t\n\tDesirable events (Opportunities)\n\t\n\t\n\tUndesirable events (Threats)\n\t\n\n\nFor opportunities, IACM does not merely allow them to occur. Instead, it seeks to:\n\n\n\t\n\tEnhance their probability\n\t\n\t\n\tExploit them strategically\n\t\n\t\n\tMaximize their positive impact\n\t\n\n\nThis aligns with the OCEG concept of Principled Performance, which emphasizes value creation alongside risk management.","fa":"في إدارة المخاطر المتكاملة وضمن نموذج IACM:\n\n\n\t\n\tالأحداث المرغوبة = Opportunities\n\t\n\t\n\tيتم التعامل معها عبر:\n\n\t\n\t\t\n\t\tEnhance (تعزيز الاحتمالية)\n\t\t\n\t\t\n\t\tExploit (استغلال الفرصة بالكامل)\n\t\t\n\t\t\n\t\tIncrease Impact (زيادة العائد أو القيمة الناتجة)\n\t\t\n\t\n\t\n\n\nالنموذج لا يركز فقط على تجنب المخاطر، بل أيضًا على تحقيق القيمة Value Creation."},{"qe":"How does IACM deal with undesirable events (Threats/Obstacles)?","qa":"كيف يتعامل نموذج الإجراءات والضوابط المتكامل (IACM) مع الأحداث غير المرغوبة المتعلقة بالعقبات؟","oe":["Conducting employee satisfaction surveys","Focusing on opportunities","Reducing likelihood and final negative impact","Applying a fixed organizational structure"],"oa":["من خلال إجراء استطلاعات دورية لرضى الموظفين","من خلال التركيز على الفرص","من خلال التقليل من الاحتمالية والأثر النهائي للضرر","من خلال تطبيق هيكل تنظيمي ثابت"],"c":2,"ch":"Key Concepts","ex":"Exam 2 - GRCP","fe":"Within IACM, undesirable events (threats) are managed through:\n\n\n\t\n\tPreventive controls (reducing likelihood)\n\t\n\t\n\tMitigating controls (reducing impact)\n\t\n\t\n\tDeterrent mechanisms\n\t\n\n\nThe objective is not risk elimination, but risk optimization within the organization’s risk appetite.\n\nOCEG GRC Capability Model\nIACM Control Categories\nSection: Preventive, Detective, Corrective and Deterrent Controls","fa":"في حالة الأحداث غير المرغوبة (Threats):\n\nيتم التعامل معها عبر:\n\n\n\t\n\tPrevent (منع)\n\t\n\t\n\tReduce (تقليل الاحتمالية)\n\t\n\t\n\tMitigate (تقليل الأثر)\n\t\n\t\n\tTransfer (نقل المخاطر)\n\t\n\t\n\tAccept (القبول الواعي)\n\t\n\n\nإذن النموذج يعمل على:\n\n\nتقليل Probability + تقليل Impact\n\nOCEG GRC Capability Model\nIACM Control Categories\nSection: Preventive, Detective, Corrective and Deterrent Controls"},{"qe":"What is the role of Preventive/Deterrent Controls in IACM?","qa":"ما دور الإجراءات والضوابط الوقائية/الرادعة في نموذج (IACM)؟","oe":["Encouraging teamwork among employees","Ensuring compliance with sector regulations","Identifying areas where compliance issues may arise","Reducing the likelihood of undesirable events"],"oa":["التحفيز على التعاون والعمل الجماعي بين الموظفين","التأكد من الامتثال للوائح الخاصة بالقطاع","تعريف النواحي التي يمكن أن تظهر فيها مشكلات الامتثال","التقليل من احتمالية الأحداث غير المرغوبة"],"c":3,"ch":"Key Concepts","ex":"Exam 2 - GRCP","fe":"Preventive controls operate before an event occurs.\nTheir primary purpose is to:\n\n\n\t\n\tPrevent deviations\n\t\n\t\n\tReduce risk probability\n\t\n\t\n\tStrengthen organizational discipline\n\t\n\n\nExamples include segregation of duties, authorization protocols, and approval workflows.\n\nOCEG IACM Framework\nControl Type Classification — Preventive Controls","fa":"الضوابط الوقائية (Preventive Controls):\n\n\n\t\n\tتعمل قبل وقوع الحدث\n\t\n\t\n\tهدفها تقليل Probability\n\t\n\t\n\tمثل:\n\n\t\n\t\t\n\t\tفصل المهام (Segregation of Duties)\n\t\t\n\t\t\n\t\tالصلاحيات المسبقة\n\t\t\n\t\t\n\t\tأنظمة التحقق\n\t\t\n\t\n\t\n\n\nأما الضوابط الكاشفة (Detective Controls):\n\n\n\tتعمل بعد الحدث\n\tOCEG IACM Framework\n\tControl Type Classification — Preventive Controls"},{"qe":"What is the role of Assurance Controls in IACM?","qa":"ما دور إجراءات وضوابط الضمان في نموذج (IACM)؟","oe":["Analyzing financial statements and preparing the budget","Establishing an institutional culture and positive work environment","Evaluating new products and services for the market","Assisting the assurance provider in delivering assurance services"],"oa":["تحليل القوائم المالية وإعداد الميزانية","تشكيل ثقافة مؤسسية وبيئة عمل إيجابية","تقييم المنتجات والخدمات الجديدة للسوق","مساعدة مسؤول الضمان على توفير خدمات الضمان"],"c":3,"ch":"Key Concepts","ex":"Exam 2 - GRCP","fe":"In IACM, assurance procedures and controls are designed to:\n\n\n\t\n\tProvide independent evaluation\n\t\n\t\n\tTest control effectiveness\n\t\n\t\n\tSupport audit and oversight functions\n\t\n\t\n\tStrengthen organizational trust and reliability\n\t\n\n\nThey are not operational or management functions.","fa":"ضوابط وإجراءات الضمان في IACM تهدف إلى:\n\n\n\t\n\tتوفير تقييم مستقل\n\t\n\t\n\tاختبار فعالية الضوابط\n\t\n\t\n\tدعم أنشطة التدقيق والمراجعة\n\t\n\t\n\tتعزيز الثقة في التقارير والممارسات\n\t\n\n\nولا تهدف إلى الإدارة التنفيذية أو العمليات التشغيلية."},{"qe":"What does the term “organizational responsiveness” refer to in the context of the (LEARN) component?","qa":"إلام يشير مصطلح \"سرعة الاستجابة\" للمنظمة في سياق مكون (الدراسة)؟","oe":["The ability to expand and scale organizational operations quickly in response to changes","The ability to re-examine context and culture quickly when changes occur","The ability to adapt the organization’s vision and mission under changing market conditions","The ability to manage risks effectively and respond to identified compliance issues."],"oa":["القدرة على توسعة وزيادة نطاق عمليات المنظمة بسرعة استجابة للتغيرات","القدرة على إعادة دراسة السياق والثقافة بسرعة عندما تطرأ التغيرات","القدرة على تكييف رؤية المنظمة ومهمتها تحت ظروف السوق المتغيرة","القدرة على إدارة المخاطر بفعالية والاستجابة لمشكلات الامتثال التي يتم تحديدها"],"c":1,"ch":"Learn Component","ex":"Exam 2 - GRCP","fe":"In the GRC Capability Model v3.5, the LEARN component focuses on understanding internal and external context, culture, and stakeholders.\n“Responsiveness” or “Agility” in this context refers to the organization’s ability to rapidly reassess context when change occurs.\n\nGRC Capability Model v3.5 – Total Performance Model, Agile (Responsive) Definition, p. 24.","fa":"في نموذج GRC Capability Model v3.5، مكون LEARN (الدراسة) يركز على فهم السياق الداخلي والخارجي والثقافة وأصحاب المصلحة.\nمصطلح Responsiveness / Agile ضمن هذا السياق يشير إلى قدرة المنظمة على إعادة تقييم السياق بسرعة عند حدوث تغيرات — أي سرعة إعادة الدراسة والتحليل.\n\nGRC Capability Model v3.5 – Total Performance Model, Agile (Responsive) Definition, p. 24."},{"qe":"What is the primary objective of the (LEARN) component in the GRC Capability Model?","qa":"ما هو الهدف الرئيسي من مكون (الدراسة) في نموذج قدرات الحوكمة والمخاطر والامتثال (GRC)؟","oe":["Aligning the organization’s objectives with its strategic direction","Developing policies and controls to manage risk and compliance","Monitoring and tracking the performance of governance processes within the organization","Studying and understanding stakeholders, the external context, the internal context, and culture in order to understand reality and changes."],"oa":["مواءمة أهداف المنظمة مع التوجه الاستراتيجي لها","إعداد السياسات والضوابط لإدارة المخاطر والامتثال","مراقبة ومتابعة أداء عمليات الحوكمة في المنظمة","دراسة وفهم أصحاب المصلحة والسياق الخارجي والسياق الداخلي والثقافة لفهم الواقع والتغيرات"],"c":3,"ch":"Learn Component","ex":"Exam 2 - GRCP","fe":"In the GRC Capability Model v3.5, the LEARN component forms the foundation of the model.\nIt focuses on:\n\n\n\t\n\tUnderstanding stakeholders\n\t\n\t\n\tAssessing external context\n\t\n\t\n\tEvaluating internal context\n\t\n\t\n\tReviewing organizational culture\n\t\n\t\n\tIdentifying environmental changes\n\t\n\n\nIt is a diagnostic and analytical phase before alignment and control design.\n\nGRC Capability Model v3.5 – Section: The LEARN Component – Total Performance Model, pp. 18–21.","fa":"في نموذج GRC Capability Model v3.5، مكون LEARN (الدراسة) هو الأساس الذي تُبنى عليه بقية المكونات.\nيركّز على:\n\n\n\t\n\tفهم أصحاب المصلحة\n\t\n\t\n\tتحليل السياق الخارجي (PESTLE)\n\t\n\t\n\tتحليل السياق الداخلي (SWOT)\n\t\n\t\n\tتقييم الثقافة\n\t\n\t\n\tفهم المتغيرات المؤثرة\n\t\n\n\nأي أنه مكون تحليلي تشخيصي يهدف إلى فهم الواقع قبل اتخاذ أي قرارات أو تصميم ضوابط.\n\nGRC Capability Model v3.5 – Section: The LEARN Component – Total Performance Model, pp. 18–21."},{"qe":"What are some industry factors that can affect the organization’s external context?","qa":"ما هي بعض العوامل الصناعية التي يمكن أن تؤثر على السياق الخارجي للمنظمة؟","oe":["Competitors’ political participation","New entrants, competitors, suppliers, and customers","New technologies available to the organization and its competitors","Product development, branding, and advertising campaigns"],"oa":["المشاركة السياسية للمنافسين","الشركات الجديدة والمنافسون والموردون والعملاء","التقنيات الجديدة المتاحة للمنظمة ومنافسيها","تطوير المنتجات والعلامات التجارية والحملات الدعائية"],"c":1,"ch":"Learn Component","ex":"Exam 2 - GRCP","fe":"Industry factors refer to competitive forces within the industry, including:\n\n\n\t\n\tNew entrants\n\t\n\t\n\tExisting competitors\n\t\n\t\n\tSupplier power\n\t\n\t\n\tCustomer power\n\t\n\n\nThis aligns with Porter’s Five Forces, commonly used when analyzing external context within the LEARN component of the GRC Capability Model.\n\nThese forces directly impact:\n\n\n\t\n\tRisk exposure\n\t\n\t\n\tOpportunities\n\t\n\t\n\tCompetitive intensity\n\t\n\t\n\tOrganizational sustainability","fa":"العوامل الصناعية (Industry Factors) تشير إلى القوى التنافسية في الصناعة، مثل:\n\n\n\t\n\tدخول منافسين جدد\n\t\n\t\n\tالمنافسة القائمة\n\t\n\t\n\tقوة الموردين\n\t\n\t\n\tقوة العملاء\n\t\n\n\nوهذا يتوافق مع نموذج Porter’s Five Forces الذي يُستخدم ضمن تحليل السياق الخارجي في مكون LEARN في نموذج GRC.\n\nهذه العناصر تؤثر مباشرة على:\n\n\n\tالمخاطر\n\tالفرص\n\tمستوى التنافس\n\tاستدامة الأداء"},{"qe":"Within the organization, what is the responsibil
